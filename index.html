/><rect x="260" y="86" width="60" height="28" fill="var(--bad)"/>\n   <text x="230" y="106" fill="#fff" font-size="15" font-weight="900">S</text><text x="290" y="106" fill="#fff" font-size="15" font-weight="900">N</text></g></svg>\n   <figcaption>圖 1　磁力線在磁鐵外由 N 極出發，回到 S 極。</figcaption></figure>\n  <ol class="pts"><li>磁鐵<b>外面</b>：N 出、S 進；裡面則由 S 到 N，形成封閉曲線。</li><li>磁力線<b>越密</b>，磁場越強（兩極最強）；磁力線<b>不會相交</b>。</li><li>磁針 N 極指的方向＝該處磁場方向。</li></ol>\n  <p><b>地磁</b>：指北針的 N 極指北，表示地理北極附近是地磁的 <b>S 極</b>（異極相吸）。</p>`,side:[["易錯","地理北極附近是地磁 S 極，不是 N 極。"],["記法","磁針 N 極永遠順著磁力線箭頭指。"]],ex:"m84",exNote:["磁鐵外部磁力線由 N 出、S 進 → A 錯。","磁力線越密磁場越強 → B 對。","地理北極是地磁 S 極 → C 錯；磁力線不會相交 → D 錯。"],pr:"pr161"},{t:"電流磁效應：右手握住導線",star:"★★★",main:`<p>1820 年厄斯特發現：導線通電時，旁邊的磁針會偏轉。<b>電流會產生磁場</b>。</p>\n  <p class="law"><span>安培右手定則（直導線）</span>右手握住導線，<em>大拇指指電流方向</em>，<em>四指彎曲的方向</em>就是磁場方向。</p>\n  <figure class="dg"><svg viewBox="0 0 520 220" role="img" aria-label="直導線磁場">${AH}\n   <g font-family="Noto Sans TC,sans-serif" text-anchor="middle">\n   <ellipse cx="160" cy="110" rx="90" ry="34" fill="none" stroke="var(--earth)" stroke-width="2.5" stroke-dasharray="6 5"/><path d="M238 128 Q200 146 160 144" stroke="var(--earth)" stroke-width="3" fill="none" marker-end="url(#ah)"/>\n   <line x1="160" y1="200" x2="160" y2="20" stroke="var(--sc)" stroke-width="6" marker-end="url(#ah)"/><text x="185" y="30" fill="var(--accent)" font-size="14" font-weight="700">電流 I</text>\n   <text x="160" y="214" fill="var(--earth-k)" font-size="13" font-weight="700">磁場繞著導線轉一圈</text>\n   <text x="300" y="60" text-anchor="start" fill="var(--ink)" font-size="14" font-weight="900">導線南北放、電流向北</text>\n   <text x="300" y="90" text-anchor="start" fill="var(--ink)" font-size="14">磁針在導線<tspan font-weight="900">上方</tspan> → N 極偏<tspan fill="var(--bad)" font-weight="900">東</tspan></text>\n   <text x="300" y="118" text-anchor="start" fill="var(--ink)" font-size="14">磁針在導線<tspan font-weight="900">下方</tspan> → N 極偏<tspan fill="var(--bad)" font-weight="900">西</tspan></text>\n   <text x="300" y="150" text-anchor="start" fill="var(--muted)" font-size="13">上方、下方磁場方向相反</text></g></svg>\n   <figcaption>圖 2　直導線周圍的磁場是一圈一圈的同心圓。</figcaption></figure>\n  <p>把導線繞成<b>螺線管</b>，磁場就像一根磁棒：<b>四指順著電流繞的方向，大拇指指的那端是 N 極</b>。</p>`,side:[["易錯","導線上方與下方磁場方向相反，先確認磁針在上還是在下。（114 會考第 31 題）"],["易錯","電流產生的磁場剛好和地磁同向時，磁針不會偏轉，不能說沒有電流。（115 會考第 35 題）"]],ex:"p69",exNote:["右手大拇指指北（電流方向）。","四指在導線「上方」繞的方向是往東。","磁針在導線上方 → N 極偏向東，選 A。"],pr:"fig35"},{t:"電磁鐵與電動機",star:"★★",main:`<p>螺線管中間插一根<b>鐵心</b>，鐵被磁化後磁場大大增強，就是<b>電磁鐵</b>。通電才有磁性，可以控制開關。</p>\n  <div class="cmp"><table><thead><tr><th>增強電磁鐵的方法</th><th>沒用的做法</th></tr></thead><tbody><tr><td>增加線圈圈數、增加電流、插入<b>鐵心</b></td><td>換成鋁棒、塑膠棒（不會被磁化）；把線圈拉稀</td></tr></tbody></table></div>\n  <p>通電的導線放在磁場中會<b>受到磁力</b>。把線圈放在磁鐵中間，通電後受力轉動，就是<b>電動機（馬達）</b>：把<b>電能轉成動能</b>。</p>\n  <figure class="dg"><svg viewBox="0 0 520 180" role="img" aria-label="電動機">${AH}\n   <g font-family="Noto Sans TC,sans-serif" text-anchor="middle"><rect x="60" y="50" width="70" height="80" fill="var(--bad)"/><text x="95" y="96" fill="#fff" font-size="20" font-weight="900">N</text><rect x="390" y="50" width="70" height="80" fill="var(--earth)"/><text x="425" y="96" fill="#fff" font-size="20" font-weight="900">S</text>\n   <rect x="190" y="60" width="140" height="60" fill="none" stroke="var(--sc)" stroke-width="5"/>\n   <path d="M190 50 V20" stroke="var(--ink)" stroke-width="3" marker-end="url(#ah)"/><path d="M330 130 V160" stroke="var(--ink)" stroke-width="3" marker-end="url(#ah)"/>\n   <text x="200" y="152" fill="var(--muted)" font-size="13">兩邊受力方向相反 → 線圈轉動</text><text x="260" y="40" fill="var(--accent)" font-size="13" font-weight="700">通電線圈</text></g></svg>\n   <figcaption>圖 3　電動機：電流在磁場中受力而轉動。</figcaption></figure>`,side:[["生活實例","電磁鐵：廢鐵回收吊車、電鈴、磁浮列車。馬達：電風扇、吹風機、電動車。"],["易錯","鋁不會被磁化，換成鋁棒不能增強磁力。"]],ex:"m85",exNote:["螺線管右手定則：四指順著線圈中電流繞的方向。","大拇指指的那一端就是 N 極。","選 A。"],pr:"m80"},{t:"電磁感應：磁場要「變化」才有電",star:"★★★",main:`<p>法拉第發現：<b>穿過線圈的磁場發生變化</b>時，線圈會產生電流，叫<b>感應電流</b>。這就是<b>電磁感應</b>。</p>\n  <div class="cmp"><table><thead><tr><th>情況</th><th>磁場有沒有變</th><th>感應電流</th></tr></thead><tbody>\n   <tr><th>磁棒插入線圈</th><td>變強</td><td><b>有</b></td></tr><tr><th>磁棒拔出線圈</th><td>變弱</td><td><b>有</b>（方向相反）</td></tr><tr><th>磁棒靜止在線圈裡</th><td>沒變</td><td><b>沒有</b></td></tr><tr><th>線圈套向靜止的磁棒</th><td>變強</td><td><b>有</b>（相對運動就算）</td></tr></tbody></table></div>\n  <p class="law"><span>感應電流的大小</span>磁場變化得<em>越快</em>（動得越快、磁鐵越強）、線圈<em>圈數越多</em>，感應電流越大。</p>`,side:[["易錯","磁鐵靜止放在線圈裡，就算磁場很強也沒有感應電流。重點是「變化」。"],["易錯","塑膠線圈不會有感應電流，因為塑膠不導電。"]],ex:"p32",exNote:["一個 N 極向下、一個 N 極向上 → 線圈裡磁場變化的方向相反 → 感應電流方向相反。","從同樣高度落下 → 進入線圈的速率相同；磁鐵、線圈都相同 → 磁場變化一樣快。","所以大小相同、方向相反，選 D。"],pr:"m81"},{t:"冷次定律與發電機",star:"★★",main:`<p>感應電流的方向怎麼決定？冷次定律說：它總是<b>反抗</b>造成它的變化。</p>\n  <p class="law"><span>冷次定律</span>感應電流產生的磁場，會<em>反抗</em>原來磁場的變化。磁鐵靠近就排斥它，磁鐵遠離就吸住它。</p>\n  <figure class="dg"><svg viewBox="0 0 520 170" role="img" aria-label="冷次定律">${AH}\n   <g font-family="Noto Sans TC,sans-serif" text-anchor="middle"><rect x="40" y="65" width="60" height="36" fill="var(--earth)"/><rect x="100" y="65" width="60" height="36" fill="var(--bad)"/><text x="70" y="89" fill="#fff" font-size="16" font-weight="900">S</text><text x="130" y="89" fill="#fff" font-size="16" font-weight="900">N</text>\n   <path d="M170 83 H220" stroke="var(--ink)" stroke-width="3" marker-end="url(#ah)"/><text x="195" y="60" fill="var(--ink)" font-size="13" font-weight="700">靠近</text>\n   ${[260,280,300,320,340,360,380].map(t=>`<ellipse cx="${t}" cy="83" rx="8" ry="40" fill="none" stroke="var(--sc)" stroke-width="3"/>`).join("")}\n   <text x="255" y="146" fill="var(--bad)" font-size="15" font-weight="900">N</text><text x="390" y="146" fill="var(--earth-k)" font-size="15" font-weight="900">S</text>\n   <text x="320" y="20" fill="var(--accent)" font-size="13" font-weight="700">線圈靠近端變 N 極 → 排斥磁鐵</text></g></svg>\n   <figcaption>圖 4　N 極靠近：線圈這端也變 N 極，把磁鐵推開。</figcaption></figure>\n  <p><b>發電機</b>：讓線圈在磁鐵間轉動，穿過線圈的磁場一直變化，就一直產生感應電流，把<b>動能轉成電能</b>。和馬達剛好相反。</p>\n  <div class="cmp"><table><thead><tr><th></th><th>電動機（馬達）</th><th>發電機</th></tr></thead><tbody><tr><th>原理</th><td>電流在磁場中受力</td><td><b>電磁感應</b></td></tr><tr><th>能量</th><td>電能 → 動能</td><td>動能 → 電能</td></tr></tbody></table></div>`,side:[["口訣","來拒去留：靠近就排斥，離開就挽留。"],["易錯","發電機是電磁感應；馬達是電流在磁場中受力。不要倒過來。"]],ex:"fig9",exNote:["N 極快速靠近線圈甲端 → 穿過線圈的磁場變強。","冷次定律：感應電流要反抗這個變化 → 把磁鐵推開。","要推開 N 極，甲端就要變成 N 極（同極相斥），選 A。"],pr:"m83"}],end:["m82","pr165","pr167","pr168","pr169"],sumT:"電與磁一次整理",sumH:["","發生什麼","判斷方法","應用"],summary:[["電流磁效應","電流 → 磁場","安培右手定則","電磁鐵、電鈴"],["電流在磁場中受力","電 ＋ 磁 → 力","—","電動機（馬達）"],["電磁感應","磁場變化 → 電流","冷次定律：來拒去留","發電機"]]};REF[201]={intro:"地球的水大多在海裡，能用的淡水很少。水在地表流動時，會把高山<b>侵蝕</b>、把沙土<b>搬運</b>、最後<b>堆積</b>成平原，臺灣很多地形就是這樣來的。大約一兩年考 1 題，觀念單純。",map:mkMap("水圈與地貌",[["水資源","海水 97%","★"],["河流三作用","侵蝕・搬運・沉積","★★"],["河流與海岸地形","V 形谷・三角洲","★★"],["地下水","超抽→下陷","★★"]]),table:[["水的分布與水循環","★","課本基本題"],["河流的侵蝕、搬運、沉積","★★","課本基本題"],["曲流、沖積扇、三角洲、海岸","★★","課本基本題"],["地下水與地層下陷","★★","114-6"]],cs:[{t:"地球的水在哪裡",star:"★",main:`<figure class="dg"><svg viewBox="0 0 600 140" role="img" aria-label="地球的水分布">\n   <g font-family="Noto Sans TC,sans-serif">\n   <rect x="40" y="30" width="504" height="40" rx="6" fill="#3b6fc4" opacity=".8"/><rect x="544" y="30" width="16" height="40" fill="#9fd3ea"/>\n   <text x="290" y="56" text-anchor="middle" fill="#fff" font-size="16" font-weight="900">海水 約 97%</text>\n   <text x="560" y="22" text-anchor="end" fill="var(--ink)" font-size="13" font-weight="700">淡水 約 3% ↓</text>\n   <rect x="40" y="95" width="350" height="30" rx="6" fill="#cfe8f3"/><rect x="390" y="95" width="150" height="30" fill="#7fb6d6"/><rect x="540" y="95" width="20" height="30" fill="var(--sc)"/>\n   <text x="215" y="115" text-anchor="middle" fill="#1b4a6b" font-size="13" font-weight="700">冰川、冰帽（最多）</text><text x="465" y="115" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">地下水</text>\n   <text x="560" y="138" text-anchor="end" fill="var(--sc)" font-size="12" font-weight="700">河、湖（很少）</text></g></svg>\n   <figcaption>圖 1　淡水裡最多的是冰川，人類容易用的河水、湖水非常少。</figcaption></figure>\n  <p class="law"><span>水循環</span>靠<em>太陽</em>的能量推動：蒸發 → 凝結成雲 → 降水 → 地表逕流或滲入地下 → 回到海洋。</p>`,side:[["易錯","淡水大部分是冰川，不是河流或湖泊。"]],ex:"bm38",exNote:["地球的水約 97% 是海水。","淡水只占約 3%。","水大部分在海洋，選 C。"],pr:"pr260"},{t:"河流的三種作用",star:"★★",main:`<p>河流就像一個人的一生：<b>上游</b>年輕力氣大，一直往下挖；<b>下游</b>老了走不動，就把帶來的沙土放下。</p>\n  <figure class="dg"><svg viewBox="0 0 600 220" role="img" aria-label="河流從上游到下游">\n   <g font-family="Noto Sans TC,sans-serif" text-anchor="middle">\n   <path d="M20 40 C140 60 220 150 330 170 C430 185 520 188 590 190" fill="none" stroke="#3b6fc4" stroke-width="6"/>\n   <path d="M20 200 V40 C140 60 220 150 330 170 C430 185 520 188 590 190 V200 Z" fill="var(--earth)" opacity=".18"/>\n   ${[[100,"上游","坡陡、水流快","侵蝕為主 → V 形谷"],[300,"中游","坡度變緩","搬運為主 → 曲流"],[500,"下游","坡平、水流慢","沉積為主 → 三角洲"]].map(([t,e,a,i])=>`<text x="${t}" y="${e==="上游"?110:e==="中游"?60:60}" fill="var(--ink)" font-size="16" font-weight="900">${e}</text><text x="${t}" y="${e==="上游"?130:80}" fill="var(--muted)" font-size="12">${a}</text><text x="${t}" y="${e==="上游"?150:100}" fill="var(--sc)" font-size="13" font-weight="700">${i}</text>`).join("")}\n   </g></svg>\n   <figcaption>圖 2　上游侵蝕、下游堆積。</figcaption></figure>\n  <p class="law"><span>沉積順序</span>流速變慢時，<em>顆粒大、重</em>的先沉下來（礫石 → 砂 → 泥）。所以上游河床多大石頭，河口多細泥。</p>`,side:[["記法","年輕愛挖、年老愛堆。"]],ex:"bm39",exNote:["上游坡度大、水流快、力量大。","主要作用是侵蝕，往下切。","切出 V 形谷，選 B。"],pr:"pr265"},{t:"河流與海岸的地形",star:"★★",main:`<div class="cmp"><table><thead><tr><th>地形</th><th>在哪裡</th><th>怎麼形成</th></tr></thead><tbody>\n   <tr><th>V 形谷</th><td>上游山區</td><td>河流往下<b>侵蝕</b></td></tr>\n   <tr><th>沖積扇</th><td>山谷出口（山地和平原交界）</td><td>坡度突然變緩，泥沙堆成扇形</td></tr>\n   <tr><th>曲流</th><td>中下游平原</td><td>外側（凹岸）侵蝕、內側（凸岸）堆積</td></tr>\n   <tr><th>三角洲</th><td>河口</td><td>流進海裡變慢，泥沙堆積</td></tr>\n   <tr><th>海蝕洞、海蝕柱、海蝕平臺</th><td>岩岸</td><td>海浪<b>侵蝕</b>岩石</td></tr>\n   <tr><th>沙灘、沙洲、潟湖</th><td>沙岸</td><td>海浪、沿岸流<b>堆積</b></td></tr></tbody></table></div>\n  <figure class="dg"><svg viewBox="0 -24 600 204" role="img" aria-label="曲流">\n   <g font-family="Noto Sans TC,sans-serif" text-anchor="middle">\n   <path d="M40 150 C140 150 160 40 300 40 C440 40 460 150 560 150" fill="none" stroke="#3b6fc4" stroke-width="26" stroke-linecap="round" opacity=".8"/>\n   <path d="M230 20 C270 8 330 8 370 20" fill="none" stroke="var(--bad)" stroke-width="4"/><text x="300" y="-6" fill="var(--bad)" font-size="13" font-weight="700">凹岸（外側）：水流快 → 侵蝕</text>\n   <path d="M250 72 C280 82 320 82 350 72" fill="none" stroke="var(--earth)" stroke-width="10"/><text x="300" y="105" fill="var(--earth-k)" font-size="13" font-weight="700">凸岸（內側）：水流慢 → 堆積</text></g></svg>\n   <figcaption>圖 3　曲流轉彎處：外側被挖、內側變沙洲。</figcaption></figure>`,side:[["判斷技巧","「谷口」→ 沖積扇；「河口」→ 三角洲。"]],ex:"bm40",exNote:["題目說「流出山谷進入平原」、坡度突然變緩。","泥沙在谷口堆積成扇子的形狀。","這是沖積扇，選 B。"],pr:"pr269"},{t:"地下水與地層下陷",star:"★★",main:`<p class="law"><span>超抽地下水</span>地底的土層空隙原本有水撐著。水被抽走，土層就被<em>壓密</em>，地面跟著<em>下陷</em>。</p>\n  <figure class="dg"><svg viewBox="0 0 600 190" role="img" aria-label="地層下陷">${AH}\n   <g font-family="Noto Sans TC,sans-serif" text-anchor="middle">\n   <rect x="60" y="60" width="200" height="110" fill="var(--earth)" opacity=".25"/>${[0,1,2,3,4,5].map(t=>`<circle cx="${85+t*32}" cy="115" r="9" fill="#3b6fc4" opacity=".7"/>`).join("")}\n   <rect x="120" y="30" width="60" height="30" fill="var(--muted)"/><text x="160" y="22" fill="var(--ink)" font-size="13" font-weight="700">抽水前</text>\n   <path d="M280 115 H330" stroke="var(--bad)" stroke-width="3" marker-end="url(#ah)"/><text x="305" y="100" fill="var(--bad)" font-size="12" font-weight="700">超抽</text>\n   <rect x="350" y="90" width="200" height="80" fill="var(--earth)" opacity=".4"/>\n   <rect x="410" y="60" width="60" height="30" fill="var(--muted)"/><line x1="350" y1="60" x2="550" y2="60" stroke="var(--bad)" stroke-dasharray="5 4"/>\n   <text x="450" y="22" fill="var(--ink)" font-size="13" font-weight="700">抽水後</text><text x="510" y="80" fill="var(--bad)" font-size="12" font-weight="700">下陷</text>\n   <text x="300" y="186" fill="var(--muted)" font-size="12">土層被壓密，再灌水也回不去</text></g></svg>\n   <figcaption>圖 4　臺灣西南沿海養殖業抽地下水，造成地層下陷、海水倒灌、土壤鹽化。</figcaption></figure>`,side:[["易錯","地層下陷是超抽地下水造成，不是地震。（114 會考第 6 題）"],["判斷技巧","山壁滑動是順向坡；泥沙沖毀房屋是土石流；搖晃受損是地震。"]],ex:"bp53",exNote:["超抽地下水 → 地層壓密 → 地面下陷。","下陷後，新蓋的房子和原本的舊屋會出現高度落差。","B 是順向坡、C 是土石流、D 是地震，選 A。"],pr:"bm41"}],end:["fig43","pr262","pr263","pr264","pr266","pr268"],sumT:"侵蝕 vs 堆積一次整理",sumH:["","水流","作用","地形"],summary:[["河流上游","快","侵蝕","V 形谷"],["山谷出口","突然變慢","堆積","沖積扇"],["曲流","外快內慢","凹岸侵蝕、凸岸堆積","沙洲"],["河口","慢","堆積","三角洲"],["岩岸","海浪拍打","侵蝕","海蝕洞、海蝕平臺"]]};REF[202]={intro:"岩石看起來都一樣硬，其實有三種不同的「出生方式」。學會分辨三大岩類，再學怎麼從<b>地層</b>判斷先後，最後看岩層受力後變成<b>褶皺</b>或<b>斷層</b>。大約每年 1 題。",map:mkMap("岩石與地層",[["三大岩類","燒・堆・壓","★★"],["化石與變質","化石在沉積岩","★★"],["地層先後","疊置・截切","★★★"],["褶皺與斷層","彎曲・斷開","★★"]]),table:[["礦物與三大岩類","★★","課本基本題"],["化石與變質岩","★★","課本基本題"],["疊置定律、截切定律","★★★","112-10"],["褶皺、正斷層、逆斷層","★★","112-2"]],cs:[{t:"三大岩類：看它怎麼出生",star:"★★",main:`<figure class="dg"><svg viewBox="0 0 620 230" role="img" aria-label="三大岩類循環">${AH}\n   <g font-family="Noto Sans TC,sans-serif" text-anchor="middle">\n   <circle cx="110" cy="110" r="62" fill="var(--bad)" opacity=".18"/><text x="110" y="102" fill="var(--bad)" font-size="17" font-weight="900">火成岩</text><text x="110" y="124" fill="var(--ink)" font-size="12">岩漿冷卻</text><text x="110" y="142" fill="var(--muted)" font-size="11">「燒」出來的</text>\n   <circle cx="310" cy="110" r="62" fill="var(--earth)" opacity=".22"/><text x="310" y="102" fill="var(--earth-k)" font-size="17" font-weight="900">沉積岩</text><text x="310" y="124" fill="var(--ink)" font-size="12">泥沙堆積壓實</text><text x="310" y="142" fill="var(--muted)" font-size="11">「堆」出來的</text>\n   <circle cx="510" cy="110" r="62" fill="var(--sc)" opacity=".2"/><text x="510" y="102" fill="var(--sc)" font-size="17" font-weight="900">變質岩</text><text x="510" y="124" fill="var(--ink)" font-size="12">高溫高壓改變</text><text x="510" y="142" fill="var(--muted)" font-size="11">「壓」出來的</text>\n   <path d="M175 100 H245" stroke="var(--muted)" stroke-width="2.5" marker-end="url(#ah)"/><text x="210" y="90" fill="var(--muted)" font-size="11">風化侵蝕</text>\n   <path d="M375 100 H445" stroke="var(--muted)" stroke-width="2.5" marker-end="url(#ah)"/><text x="410" y="90" fill="var(--muted)" font-size="11">高溫高壓</text>\n   <path d="M510 175 C450 205 170 205 110 175" fill="none" stroke="var(--muted)" stroke-width="2.5" marker-end="url(#ah)"/><text x="310" y="222" fill="var(--muted)" font-size="11">熔融成岩漿，再冷卻</text></g></svg>\n   <figcaption>圖 1　岩石會不斷轉變，稱為岩石循環。</figcaption></figure>\n  <div class="cmp"><table><thead><tr><th>火成岩</th><th>冷卻地點</th><th>晶體</th><th>例子</th></tr></thead><tbody>\n   <tr><th>深成岩</th><td>地底深處，慢慢冷卻</td><td><b>大</b>、看得到顆粒</td><td>花岡岩</td></tr>\n   <tr><th>火山岩</th><td>地表，快速冷卻</td><td><b>小</b>、細緻</td><td>玄武岩、安山岩</td></tr></tbody></table></div>`,side:[["記法","冷得越慢，晶體越大（慢工出細活，結晶也長得大）。"],["判斷技巧","鑑定礦物看硬度、顏色、條痕、解理。指甲刮得出痕的，硬度比刮得傷玻璃的小。"]],ex:"bm42",exNote:["花岡岩是岩漿冷卻形成 → 火成岩。","在地底深處慢慢冷卻 → 深成岩。","選 C。"],pr:"pr270"},{t:"化石和變質岩",star:"★★",main:`<p class="law"><span>化石只在沉積岩</span>生物死後被泥沙一層層埋住，跟著壓實成岩，才能保存成化石。火成岩是岩漿燒出來的、變質岩被高溫高壓改過，化石都保不住。</p>\n  <div class="cmp"><table><thead><tr><th>原來的岩石</th><th></th><th>變質後</th></tr></thead><tbody>\n   <tr><td>石灰岩</td><td>→</td><td><b>大理岩</b></td></tr><tr><td>頁岩</td><td>→</td><td>板岩</td></tr>\n   <tr><td>砂岩</td><td>→</td><td>石英岩</td></tr><tr><td>花岡岩</td><td>→</td><td>片麻岩</td></tr></tbody></table></div>\n  <p>在高山上找到海洋生物化石 → 那裡以前是海，後來被<b>地殼抬升</b>。</p>`,side:[["記法","沉積岩三兄弟：頁岩（泥）、砂岩（砂）、石灰岩（貝殼珊瑚）。"]],ex:"bm43",exNote:["化石多保存在沉積岩。","玄武岩、花岡岩是火成岩；大理岩是變質岩。","頁岩是沉積岩，選 C。"],pr:"bm46"},{t:"地層的先後：疊置與截切",star:"★★★",main:`<figure class="dg"><svg viewBox="0 0 600 220" role="img" aria-label="地層與岩脈">\n   <g font-family="Noto Sans TC,sans-serif" text-anchor="middle">\n   ${[["丙","#e3cf9e"],["乙","#cfae78"],["甲","#b08a57"]].map(([t,e],a)=>`<rect x="60" y="${30+a*55}" width="300" height="55" fill="${e}"/><text x="80" y="${63+a*55}" fill="#3d2a12" font-size="16" font-weight="900">${t}</text>`).join("")}\n   <path d="M200 195 L215 85 L240 85 L230 195 Z" fill="var(--bad)" opacity=".85"/><text x="222" y="150" fill="#fff" font-size="15" font-weight="900">丁</text>\n   <text x="480" y="60" fill="var(--ink)" font-size="14" font-weight="900">① 疊置定律</text><text x="480" y="80" fill="var(--muted)" font-size="12">下面先沉積、比較老</text><text x="480" y="98" fill="var(--muted)" font-size="12">甲 → 乙 → 丙</text>\n   <text x="480" y="140" fill="var(--bad)" font-size="14" font-weight="900">② 截切定律</text><text x="480" y="160" fill="var(--muted)" font-size="12">切過別人的比較年輕</text><text x="480" y="178" fill="var(--muted)" font-size="12">丁切過甲、乙，沒切過丙</text>\n   <text x="210" y="215" fill="var(--ink)" font-size="13" font-weight="700">由老到新：甲 → 乙 → 丁 → 丙</text></g></svg>\n   <figcaption>圖 2　先用疊置排出沉積順序，再把切過別人的插進去。</figcaption></figure>`,side:[["易錯","侵入的火成岩脈比被它切過的岩層年輕。（112 會考第 10 題）"],["注意","疊置定律的前提是地層「沒有倒轉」。"]],ex:"bp42",exNote:["要先有岩層，岩漿才能侵入切過它 → 岩層沉積在前。","火成岩脈形成後，海水把較軟的岩層侵蝕掉，岩脈才像牆一樣立在平臺上。","順序：岩層沉積 → 火成岩脈 → 海水侵蝕，選 B。"],pr:"bm44"},{t:"褶皺與斷層",star:"★★",main:`<p>岩層受力後，如果只是<b>彎曲</b>叫褶皺；如果<b>斷開錯動</b>叫斷層。</p>\n  <figure class="dg"><svg viewBox="0 0 640 220" role="img" aria-label="褶皺、正斷層、逆斷層">${AH}\n   <g font-family="Noto Sans TC,sans-serif" text-anchor="middle">\n   ${[0,1,2].map(t=>`<path d="M15 ${95+t*16} C55 ${55+t*16} 85 ${55+t*16} 100 ${95+t*16} S150 ${135+t*16} 185 ${95+t*16}" fill="none" stroke="${["#b08a57","#cfae78","#8c6a3e"][t]}" stroke-width="14"/>`).join("")}\n   <text x="110" y="22" fill="var(--ink)" font-size="15" font-weight="900">褶皺</text><text x="110" y="205" fill="var(--muted)" font-size="12">擠壓 → 彎曲不斷開</text>\n   ${[[230,"正斷層","張力（拉開）→ 上盤下滑",1],[440,"逆斷層","擠壓 → 上盤上升",-1]].map(([t,e,a,i])=>`<text x="${t+85}" y="22" fill="var(--ink)" font-size="15" font-weight="900">${e}</text>\n   <path d="M${t} 70 H${t+70} L${t+110} 170 H${t} Z" fill="#cfae78"/><path d="M${t+70} ${70+i*25} H${t+170} V170 H${t+110} L${t+70+(i>0?0:0)} ${70+i*25} Z" fill="#b08a57"/>\n   <path d="M${t+64} 55 L${t+118} 185" stroke="var(--bad)" stroke-width="2.5" stroke-dasharray="5 4"/>\n   <path d="M${t+140} ${i>0?100:140} V${i>0?140:100}" stroke="var(--bad)" stroke-width="3" marker-end="url(#ah)"/><text x="${t+150}" y="${i>0?92:160}" fill="var(--bad)" font-size="11" font-weight="700" text-anchor="start">上盤</text>\n   <text x="${t+85}" y="48" fill="var(--ink)" font-size="16" font-weight="900">${i>0?"← 拉開 →":"→ 擠壓 ←"}</text>\n   <text x="${t+85}" y="205" fill="var(--muted)" font-size="12">${a}</text>`).join("")}</g></svg>\n   <figcaption>圖 3　上盤＝斷層面上方那一塊。拉開 → 正斷層；擠壓 → 逆斷層。</figcaption></figure>`,side:[["記法","「拉正擠逆」：張力正斷層、擠壓逆斷層。"],["易錯","岩層「彎曲」是褶皺，「斷開錯動」才是斷層。（112 會考第 2 題）"]],ex:"bp40",exNote:["太魯閣的岩層「彎曲」成圖案，沒有斷開。","受擠壓而彎曲 → 褶皺。","選 B。"],pr:"bm45"}],end:["fig18","fig44","pr275","pr276","pr277","pr279"],sumT:"三大岩類一次整理",sumH:["","怎麼形成","例子","有沒有化石"],summary:[["火成岩","岩漿冷卻","花岡岩、玄武岩、安山岩","沒有"],["沉積岩","沉積物堆積壓實","頁岩、砂岩、石灰岩","有（最常見）"],["變質岩","高溫高壓改變","大理岩、板岩、片麻岩","幾乎沒有"]]};REF[203]={intro:"臺灣為什麼常地震、有高山？答案在<b>板塊</b>。這一章先認識地球內部的兩種分層，再看板塊怎麼移動、交界長什麼樣，最後是<b>地震波</b>和最常搞混的<b>規模 vs 震度</b>。每年 1～2 題。",map:mkMap("板塊構造與地震",[["地球內部","兩種分層","★★"],["板塊運動","海底擴張","★★"],["板塊邊界","張裂・聚合・錯動","★★★"],["地震波","P 波先到","★★"],["規模與震度","能量 vs 搖晃","★★★"]]),table:[["地殼地函地核、岩石圈軟流圈","★★","111-13"],["大陸漂移與海底擴張","★★","114-15"],["三種板塊邊界","★★★","115-26"],["P 波、S 波與地震預警","★★","115-8"],["規模與震度","★★★","112-49"]],cs:[{t:"地球內部：兩種分法",star:"★★",main:`<p>「地殼、地函、地核」是看<b>材料</b>分的（像蛋殼、蛋白、蛋黃）；「岩石圈、軟流圈」是看<b>軟硬</b>分的。</p>\n  <figure class="dg"><svg viewBox="0 0 600 240" role="img" aria-label="地球內部分層">\n   <g font-family="Noto Sans TC,sans-serif">\n   <rect x="160" y="20" width="200" height="18" fill="#8c6a3e"/><rect x="160" y="38" width="200" height="22" fill="#c9734a"/><rect x="160" y="60" width="200" height="70" fill="#e09a4f"/><rect x="160" y="130" width="200" height="50" fill="#f2c14e"/><rect x="160" y="180" width="200" height="40" fill="#f7dd8a"/>\n   <text x="150" y="33" text-anchor="end" fill="var(--ink)" font-size="13" font-weight="700">地殼</text>\n   <text x="150" y="100" text-anchor="end" fill="var(--ink)" font-size="13" font-weight="700">地函</text>\n   <text x="150" y="160" text-anchor="end" fill="var(--ink)" font-size="13" font-weight="700">外核（液態）</text>\n   <text x="150" y="205" text-anchor="end" fill="var(--ink)" font-size="13" font-weight="700">內核（固態）</text>\n   <text x="80" y="232" text-anchor="middle" fill="var(--muted)" font-size="11">依材料分</text>\n   <path d="M370 20 h10 v40 h-10" fill="none" stroke="var(--sc)" stroke-width="3"/><text x="390" y="38" fill="var(--sc)" font-size="14" font-weight="900">岩石圈（硬）</text><text x="390" y="56" fill="var(--muted)" font-size="12">＝地殼＋上部地函</text>\n   <path d="M370 62 h10 v40 h-10" fill="none" stroke="var(--bad)" stroke-width="3"/><text x="390" y="86" fill="var(--bad)" font-size="14" font-weight="900">軟流圈（可慢慢流動）</text><text x="390" y="104" fill="var(--muted)" font-size="12">只是地函的一部分</text>\n   <text x="460" y="232" text-anchor="middle" fill="var(--muted)" font-size="11">依軟硬分</text></g></svg>\n   <figcaption>圖 1　板塊就是岩石圈裂成的一塊塊，浮在軟流圈上慢慢移動。</figcaption></figure>`,side:[["易錯","岩石圈包含地殼「和上部地函」，不是只有地殼。（111 會考第 13 題）"]],ex:"bp37",exNote:["岩石圈＝地殼＋上部地函，比地殼厚 → A 錯、C 對。","軟流圈只是地函的一部分 → B 錯。","軟流圈不包含地殼 → D 錯，選 C。"],pr:"pr280"},{t:"板塊運動與海底擴張",star:"★★",main:`<p class="law"><span>海底擴張</span>中洋脊下方岩漿湧出，冷卻成<em>新的海洋地殼</em>，把兩邊往外推。所以離中洋脊<em>越遠越老</em>，兩側年齡<em>對稱</em>。</p>\n  <figure class="dg"><svg viewBox="0 0 600 190" role="img" aria-label="中洋脊海底擴張">${AH}\n   <g font-family="Noto Sans TC,sans-serif" text-anchor="middle">\n   ${[0,1,2,3].map(t=>`<rect x="${300+t*60}" y="80" width="60" height="30" fill="var(--earth)" opacity="${.9-t*.2}"/><rect x="${240-t*60}" y="80" width="60" height="30" fill="var(--earth)" opacity="${.9-t*.2}"/>`).join("")}\n   <path d="M300 170 V112" stroke="var(--bad)" stroke-width="6" marker-end="url(#ah)"/><text x="300" y="185" fill="var(--bad)" font-size="13" font-weight="700">岩漿上升</text>\n   <path d="M330 60 H440" stroke="var(--ink)" stroke-width="3" marker-end="url(#ah)"/><path d="M270 60 H160" stroke="var(--ink)" stroke-width="3" marker-end="url(#ah)"/>\n   <text x="300" y="40" fill="var(--ink)" font-size="15" font-weight="900">中洋脊</text>\n   <text x="318" y="135" text-anchor="start" fill="var(--sc)" font-size="12" font-weight="700">最年輕</text><text x="80" y="135" fill="var(--muted)" font-size="12">較老</text><text x="520" y="135" fill="var(--muted)" font-size="12">較老</text></g></svg>\n   <figcaption>圖 2　兩側往外推開，形成新的海洋地殼。</figcaption></figure>\n  <p>板塊會移動，所以<b>陸地和海底的地形都會改變</b>。但板塊交界不一定在海陸交界。</p>`,side:[["易錯","中洋脊附近的岩石最年輕，不是最古老。"]],ex:"bp55",exNote:["板塊交界和海陸交界不一定吻合 → A 錯。","交界有張裂、聚合、錯動三種，不全是山脈或中洋脊 → C、D 錯。","板塊移動會改變地形，選 B。"],pr:"bm50"},{t:"三種板塊邊界",star:"★★★",main:`<figure class="dg"><svg viewBox="0 0 640 200" role="img" aria-label="三種板塊邊界">${AH}\n   <g font-family="Noto Sans TC,sans-serif" text-anchor="middle">\n   ${[[110,"張裂型","← →","中洋脊、裂谷"],[320,"聚合型","→ ←","海溝、島弧、高山"],[530,"錯動型","↑ ↓","平移斷層"]].map(([t,e,a,i],s)=>`<text x="${t}" y="22" fill="var(--ink)" font-size="16" font-weight="900">${e}</text>\n    <rect x="${t-90}" y="60" width="85" height="40" fill="var(--earth)" opacity=".7"/><rect x="${t+5}" y="60" width="85" height="40" fill="var(--earth)" opacity=".45"/>\n    ${s===0?`<path d="M${t-15} 80 H${t-75}" stroke="var(--ink)" stroke-width="3" marker-end="url(#ah)"/><path d="M${t+15} 80 H${t+75}" stroke="var(--ink)" stroke-width="3" marker-end="url(#ah)"/><path d="M${t} 130 V102" stroke="var(--bad)" stroke-width="4" marker-end="url(#ah)"/>`:s===1?`<path d="M${t-80} 80 H${t-20}" stroke="var(--ink)" stroke-width="3" marker-end="url(#ah)"/><path d="M${t+80} 80 H${t+20}" stroke="var(--ink)" stroke-width="3" marker-end="url(#ah)"/><path d="M${t-5} 100 L${t+20} 140" stroke="var(--bad)" stroke-width="4" marker-end="url(#ah)"/>`:`<path d="M${t-45} 95 V65" stroke="var(--ink)" stroke-width="3" marker-end="url(#ah)"/><path d="M${t+45} 65 V95" stroke="var(--ink)" stroke-width="3" marker-end="url(#ah)"/>`}\n    <text x="${t}" y="165" fill="var(--sc)" font-size="13" font-weight="700">${i}</text>\n    <text x="${t}" y="188" fill="var(--muted)" font-size="12">${["岩漿湧出，新地殼","海洋板塊隱沒","水平錯開"][s]}</text>`).join("")}</g></svg>\n   <figcaption>圖 3　分開、撞在一起、擦身而過。</figcaption></figure>\n  <p class="law"><span>臺灣</span>位在<em>歐亞板塊</em>和<em>菲律賓海板塊</em>的<em>聚合型</em>邊界，所以多地震、有高山。</p>`,side:[["判斷技巧","兩側陸地「越來越遠」→ 張裂型 → 海底有岩漿形成的火成岩、新的海洋地殼。（115 會考第 26 題）"],["易錯","海溝在聚合型邊界，不在張裂型。"]],ex:"bp60",exNote:["兩側陸地距離逐年增加 → 張裂型邊界。","張裂處岩漿湧出，冷卻成新的海洋地殼（火成岩）。","最古老的地殼、海溝都不會在這裡，選 A。"],pr:"bm49"},{t:"地震波與地震預警",star:"★★",main:`<div class="cmp"><table><thead><tr><th></th><th>P 波</th><th>S 波</th></tr></thead><tbody>\n   <tr><th>速度</th><td><b>快，先到</b></td><td>慢，後到</td></tr>\n   <tr><th>感覺</th><td>上下跳動</td><td>左右搖晃，<b>破壞較大</b></td></tr>\n   <tr><th>能通過</th><td>固體、液體、氣體</td><td>只有固體（過不了液態外核）</td></tr></tbody></table></div>\n  <figure class="dg"><svg viewBox="0 0 600 150" role="img" aria-label="地震儀紀錄">\n   <g font-family="Noto Sans TC,sans-serif" text-anchor="middle">\n   <path d="M30 80 H150 ${Array.from({length:12},(t,e)=>`l5 ${e%2?16:-16}`).join(" ")} H330 ${Array.from({length:14},(t,e)=>`l5 ${e%2?40:-40}`).join(" ")} H580" fill="none" stroke="var(--ink)" stroke-width="2"/>\n   <line x1="150" y1="30" x2="150" y2="125" stroke="var(--sc)" stroke-dasharray="4 4"/><text x="150" y="22" fill="var(--sc)" font-size="13" font-weight="900">P 波到</text>\n   <line x1="330" y1="30" x2="330" y2="125" stroke="var(--bad)" stroke-dasharray="4 4"/><text x="330" y="22" fill="var(--bad)" font-size="13" font-weight="900">S 波到</text>\n   <text x="240" y="145" fill="var(--ink)" font-size="13" font-weight="700">S－P 時間差：離震央越遠越大</text></g></svg>\n   <figcaption>圖 4　地震預警就是先偵測到 P 波，在 S 波到之前發出警報。</figcaption></figure>`,side:[["判斷技巧","「13 秒後抵達」是指劇烈搖晃前還有 13 秒，不是會搖 13 秒。（115 會考第 8 題）"]],ex:"bp58",exNote:["預警是在主要搖晃到達前發出的，13 秒是剩下的時間。","震度每個地方不同，B 錯；震度 4 級不等於規模 4，D 錯。","劇烈搖晃前約有 13 秒可以避難，選 C。"],pr:"bm47"},{t:"規模 vs 震度",star:"★★★",main:`<p>想像一盞燈：<b>規模</b>是燈泡有多少瓦（地震本身釋放的能量）；<b>震度</b>是你那邊有多亮（當地搖晃得多厲害）。</p>\n  <figure class="dg"><svg viewBox="0 0 600 200" role="img" aria-label="規模與震度">\n   <g font-family="Noto Sans TC,sans-serif" text-anchor="middle">\n   <circle cx="100" cy="110" r="16" fill="var(--bad)"/><circle cx="100" cy="110" r="40" fill="none" stroke="var(--bad)" opacity=".5"/><circle cx="100" cy="110" r="66" fill="none" stroke="var(--bad)" opacity=".25"/>\n   <text x="130" y="24" fill="var(--bad)" font-size="14" font-weight="900">震央：規模 6.2（只有一個）</text>\n   ${[[200,"花蓮","5 級"],[340,"臺中","4 級"],[500,"臺北","3 級"]].map(([t,e,a],i)=>`<circle cx="${t}" cy="100" r="8" fill="var(--sc)"/><text x="${t}" y="130" fill="var(--ink)" font-size="14" font-weight="900">${e}</text><text x="${t}" y="150" fill="var(--sc)" font-size="13" font-weight="700">震度 ${a}</text>`).join("")}\n   <text x="350" y="194" fill="var(--muted)" font-size="12">一般來說離震央越遠，震度越小</text></g></svg>\n   <figcaption>圖 5　一次地震只有一個規模，但各地震度不同。</figcaption></figure>`,side:[["易錯","土壤液化、房子會不會倒，看的是當地「搖晃程度」＝震度，不是規模。（112 會考第 49 題）"],["記法","規模看「震源」，震度看「這裡」。"]],ex:"bp46",exNote:["評估的是當地的「搖晃程度」。","搖晃程度就是震度；規模是地震本身的能量，各地相同。","選 A。"],pr:"bm48"}],end:["fig19","fig45","pr285","pr286","pr287","pr289"],sumT:"板塊邊界一次整理",sumH:["","板塊怎麼動","地形","例子"],summary:[["張裂型","分開","中洋脊、裂谷","大西洋中洋脊、東非裂谷"],["聚合型","互相擠撞","海溝、島弧、高山","臺灣、日本、喜馬拉雅山"],["錯動型","水平錯開","平移斷層","美國聖安德魯斯斷層"]]};REF[204]={intro:"這是地科<b>考最多</b>的一章，每年 2～4 題。只要抓住一條主線：空氣<b>上升</b>會變冷、水氣凝結 → 下雨；空氣<b>下沉</b>會變暖 → 晴天。高低氣壓、鋒面、颱風、季風都用得上。",map:mkMap("大氣與天氣變化",[["大氣分層","對流層・平流層","★★"],["高低氣壓","下沉晴・上升雨","★★★"],["風與季風","高壓吹向低壓","★★★"],["氣團與鋒面","暖空氣往上爬","★★★"],["梅雨與颱風","滯留鋒・低氣壓","★★"]]),table:[["大氣分層、氣壓","★★","111-1、115-27"],["高氣壓與低氣壓","★★★","112-28、113-28、113-15"],["海陸風、季風","★★★","112-15、114-13"],["氣團與鋒面","★★★","114-5"],["梅雨、颱風、太平洋高壓","★★","115-34"]],cs:[{t:"大氣分層與氣壓",star:"★★",main:`<figure class="dg"><svg viewBox="0 0 600 230" role="img" aria-label="大氣分層與氣溫">\n   <g font-family="Noto Sans TC,sans-serif">\n   <rect x="60" y="20" width="300" height="80" fill="#3b6fc4" opacity=".12"/><rect x="60" y="100" width="300" height="110" fill="#3b6fc4" opacity=".25"/>\n   <text x="75" y="48" fill="var(--ink)" font-size="15" font-weight="900">平流層</text><text x="75" y="68" fill="var(--muted)" font-size="12">臭氧層吸收紫外線</text><text x="75" y="85" fill="var(--muted)" font-size="12">越高越熱、穩定</text>\n   <text x="75" y="130" fill="var(--ink)" font-size="15" font-weight="900">對流層</text><text x="75" y="150" fill="var(--muted)" font-size="12">天氣現象都在這裡</text><text x="75" y="167" fill="var(--muted)" font-size="12">越高越冷</text>\n   <path d="M330 210 L240 100 L320 25" fill="none" stroke="var(--bad)" stroke-width="4"/>\n   <text x="345" y="200" fill="var(--bad)" font-size="12" font-weight="700">暖</text><text x="215" y="105" fill="#3b6fc4" font-size="12" font-weight="700">冷</text>\n   <text x="390" y="60" fill="var(--ink)" font-size="14" font-weight="900">氣溫轉折處</text><text x="390" y="80" fill="var(--muted)" font-size="12">就是兩層的分界</text>\n   <text x="390" y="150" fill="var(--ink)" font-size="14" font-weight="900">氣壓</text><text x="390" y="170" fill="var(--muted)" font-size="12">一路隨高度降低</text><text x="390" y="188" fill="var(--muted)" font-size="12">單位：百帕（hPa）</text></g></svg>\n   <figcaption>圖 1　紅線是氣溫：對流層往上變冷，平流層往上變熱。</figcaption></figure>`,side:[["判斷技巧","要分對流層和平流層，看「氣溫」圖才行；氣壓兩層都一路下降，分不出來。（115 會考第 27 題）"],["注意","1 大氣壓 ≈ 1013 百帕，百帕是氣壓的單位。"]],ex:"bp61",exNote:["對流層越高越冷，平流層越高越熱 → 氣溫有轉折，看得出分界。","氣壓在兩層都隨高度一直降低，沒有轉折。","所以只有甲圖（氣溫）可以，選 A。"],pr:"pr299"},{t:"高氣壓與低氣壓",star:"★★★",main:`<figure class="dg"><svg viewBox="0 0 620 230" role="img" aria-label="高氣壓與低氣壓">${AH}\n   <g font-family="Noto Sans TC,sans-serif" text-anchor="middle">\n   <text x="150" y="22" fill="var(--bad)" font-size="16" font-weight="900">高氣壓 H</text>\n   <path d="M150 40 V110" stroke="var(--bad)" stroke-width="4" marker-end="url(#ah)"/><text x="190" y="75" fill="var(--bad)" font-size="12" font-weight="700">下沉</text>\n   <path d="M140 140 H60" stroke="var(--muted)" stroke-width="3" marker-end="url(#ah)"/><path d="M160 140 H240" stroke="var(--muted)" stroke-width="3" marker-end="url(#ah)"/>\n   <rect x="40" y="148" width="220" height="6" fill="var(--earth)"/>\n   <text x="150" y="182" fill="var(--ink)" font-size="14" font-weight="900">變暖 → 不易成雲 → 晴天</text><text x="150" y="204" fill="var(--muted)" font-size="12">北半球：順時針向外吹</text>\n   <text x="470" y="22" fill="#3b6fc4" font-size="16" font-weight="900">低氣壓 L</text>\n   <path d="M470 120 V72" stroke="#3b6fc4" stroke-width="4" marker-end="url(#ah)"/><text x="510" y="75" fill="#3b6fc4" font-size="12" font-weight="700">上升</text>\n   <path d="M380 140 H455" stroke="var(--muted)" stroke-width="3" marker-end="url(#ah)"/><path d="M560 140 H485" stroke="var(--muted)" stroke-width="3" marker-end="url(#ah)"/>\n   <rect x="360" y="148" width="220" height="6" fill="var(--earth)"/>\n   <ellipse cx="470" cy="54" rx="46" ry="13" fill="var(--muted)" opacity=".5"/>\n   <text x="470" y="182" fill="var(--ink)" font-size="14" font-weight="900">變冷 → 水氣凝結 → 雲雨</text><text x="470" y="204" fill="var(--muted)" font-size="12">北半球：逆時針向內吹</text></g></svg>\n   <figcaption>圖 2　高壓好天氣、低壓壞天氣。</figcaption></figure>\n  <div class="cmp"><table><thead><tr><th>高氣壓</th><th>低氣壓</th></tr></thead><tbody>\n   <tr><td>蒙古大陸冷氣團、太平洋暖氣團（太平洋高壓）</td><td>颱風、鋒面附近</td></tr></tbody></table></div>\n  <p class="law"><span>等壓線</span>線越<em>密</em>，氣壓變化越大，<em>風越強</em>。只有一條等壓線時，看不出風向和風速。</p>`,side:[["易錯","太平洋暖氣團是高氣壓，不是低氣壓。（113 會考第 28 題）"],["記法","H 下沉晴、L 上升雨。"]],ex:"bp44",exNote:["高氣壓中心的空氣往下沉。","下沉會增溫，水氣不容易凝結成雲。","所以高氣壓多半晴朗，選 A。"],pr:"pr298"},{t:"風、海陸風與季風",star:"★★★",main:`<p class="law"><span>風怎麼吹</span>空氣從<em>高氣壓</em>吹向<em>低氣壓</em>。地面哪裡比較熱，那裡空氣上升、氣壓變低，風就往那裡吹。</p>\n  <div class="cmp"><table><thead><tr><th></th><th>誰比較熱</th><th>風向</th></tr></thead><tbody>\n   <tr><th>海風（白天）</th><td>陸地升溫快 → 陸地低壓</td><td><b>海 → 陸</b></td></tr>\n   <tr><th>陸風（晚上）</th><td>陸地降溫快 → 海上低壓</td><td><b>陸 → 海</b></td></tr></tbody></table></div>\n  <figure class="dg"><svg viewBox="0 0 600 230" role="img" aria-label="臺灣的季風">${AH}\n   <g font-family="Noto Sans TC,sans-serif" text-anchor="middle">\n   ${[[150,"冬：東北季風",1],[450,"夏：西南季風",0]].map(([t,e,a])=>`<text x="${t}" y="22" fill="var(--ink)" font-size="15" font-weight="900">${e}</text>\n    <path d="M${t-8} 60 C${t+12} 70 ${t+14} 110 ${t+6} 140 C${t} 170 ${t-14} 180 ${t-22} 170 C${t-30} 140 ${t-26} 90 ${t-8} 60 Z" fill="var(--sc)" opacity=".85"/>\n    ${a?`<path d="M${t+90} 40 L${t+30} 85" stroke="#3b6fc4" stroke-width="4" marker-end="url(#ah)"/><text x="${t}" y="204" fill="#3b6fc4" font-size="12" font-weight="700">迎風：北、東北部濕冷多雨</text><text x="${t}" y="222" fill="var(--muted)" font-size="12">背風：南部乾燥</text>`:`<path d="M${t-100} 180 L${t-40} 140" stroke="var(--bad)" stroke-width="4" marker-end="url(#ah)"/><text x="${t}" y="204" fill="var(--bad)" font-size="12" font-weight="700">迎風：南部多雨</text><text x="${t}" y="222" fill="var(--muted)" font-size="12">往北航行：西南季風＋黑潮</text>`}`).join("")}</g></svg>\n   <figcaption>圖 3　冬天北部濕冷、南部乾；夏天南部雨多。夏天吹西南季風，往北航行最順。</figcaption></figure>`,side:[["判斷技巧","問某地冬天濕不濕 → 看它是不是東北季風的迎風面（北部、東北部）。（114 會考第 13 題）"],["記法","季風名字是「從哪裡吹來」：東北季風從東北吹來。"]],ex:"bp54",exNote:["臺北冬天多雨又強風，因為是東北季風的迎風面。","臺南、高雄在南部，冬天是背風面，比較乾。","所以這個建議不適用高雄，選 D。"],pr:"bm52"},{t:"氣團與鋒面",star:"★★★",main:`<p>冷、暖兩個氣團碰在一起的交界叫<b>鋒面</b>。冷空氣重、在下面；<b>暖空氣輕，沿著鋒面往上爬</b>，上升冷卻就形成雲雨。</p>\n  <figure class="dg"><svg viewBox="0 0 600 200" role="img" aria-label="冷鋒剖面">${AH}\n   <g font-family="Noto Sans TC,sans-serif" text-anchor="middle">\n   <path d="M40 180 L40 120 C120 120 200 130 280 180 Z" fill="#3b6fc4" opacity=".35"/>\n   <rect x="40" y="180" width="520" height="6" fill="var(--earth)"/>\n   <text x="110" y="160" fill="#3b6fc4" font-size="15" font-weight="900">冷空氣</text>\n   <path d="M120 140 H200" stroke="#3b6fc4" stroke-width="3" marker-end="url(#ah)"/>\n   <text x="430" y="150" fill="var(--bad)" font-size="15" font-weight="900">暖空氣</text>\n   <path d="M330 165 C290 140 250 100 230 60" fill="none" stroke="var(--bad)" stroke-width="3" marker-end="url(#ah)"/>\n   <ellipse cx="220" cy="45" rx="60" ry="20" fill="var(--muted)" opacity=".55"/><text x="220" y="50" fill="var(--ink)" font-size="13" font-weight="700">雲、雨</text>\n   ${[0,1,2,3].map(t=>`<path d="M${195+t*12} 72 l-4 10" stroke="#3b6fc4" stroke-width="2"/>`).join("")}</g></svg>\n   <figcaption>圖 4　冷鋒：冷空氣推進，把暖空氣往上抬。</figcaption></figure>\n  <div class="cmp"><table><thead><tr><th>鋒面</th><th>怎麼動</th><th>通過後</th></tr></thead><tbody>\n   <tr><th>冷鋒</th><td>冷空氣推暖空氣</td><td><b>氣溫下降、氣壓上升</b>，常有短暫陣雨</td></tr>\n   <tr><th>暖鋒</th><td>暖空氣推冷空氣</td><td>氣溫上升</td></tr>\n   <tr><th>滯留鋒</th><td>冷暖勢力差不多，停著不動</td><td>連續多天下雨（梅雨）</td></tr></tbody></table></div>`,side:[["判斷技巧","看剖面圖：往上爬、形成雲雨的那團一定是暖空氣；貼在下面的是冷空氣。（114 會考第 5 題）"]],ex:"bp52",exNote:["乙沿著鋒面往上抬升並形成雲雨 → 輕的暖空氣。","甲在鋒面下方 → 重的冷空氣。","甲冷、乙暖，選 D。"],pr:"bm53"},{t:"梅雨、颱風與太平洋高壓",star:"★★",main:`<div class="cmp"><table><thead><tr><th>天氣系統</th><th>是什麼</th><th>天氣</th></tr></thead><tbody>\n   <tr><th>梅雨（5～6 月）</th><td><b>滯留鋒</b>停在臺灣附近</td><td>連續多日降雨、易豪雨</td></tr>\n   <tr><th>颱風（夏秋）</th><td>熱帶海洋上的強烈<b>低氣壓</b></td><td>北半球逆時針向內吹，中心上升，狂風暴雨</td></tr>\n   <tr><th>太平洋高壓（夏）</th><td><b>高氣壓</b></td><td>籠罩時晴朗炎熱；它的位置會影響颱風路徑和鋒面停在哪</td></tr>\n   <tr><th>寒流（冬）</th><td>強烈大陸冷氣團（高氣壓）</td><td>氣溫明顯下降，北部、東北部濕冷</td></tr></tbody></table></div>`,side:[["判斷技巧","臺灣「乾熱」→ 被高氣壓籠罩；鋒面「長期停留」→ 滯留鋒。（115 會考第 34 題）"],["易錯","颱風眼裡反而風小、天氣較好，因為中心有一點下沉氣流。"]],ex:"bp62",exNote:["臺灣乾熱 → 被天氣系統甲（高氣壓，太平洋高壓）籠罩。","鋒面長期停在日本到中國間不移動 → 滯留鋒。","選 D。"],pr:"bm55"}],end:["bp35","bp43","bp47","bp49","fig17","fig46","pr297"],sumT:"高壓 vs 低壓一次整理",sumH:["","中心氣流","北半球地面風","天氣"],summary:[["高氣壓","下沉、增溫","順時針向外吹","晴朗"],["低氣壓","上升、降溫","逆時針向內吹","多雲雨"],["冷鋒過境","暖空氣被抬升","轉北風","降溫、氣壓升"],["滯留鋒","冷暖相持","—","連續降雨（梅雨）"]]};REF[205]={intro:"地科的大魔王，每年 2～4 題。只要把「<b>誰繞誰轉、太陽從哪邊照</b>」想清楚，四季、月相、日月食、潮汐都是同一張圖。先畫圖再作答，比背口訣可靠。",map:mkMap("天文與星象",[["宇宙與太陽系","光年・行星","★★"],["晝夜與四季","地軸傾斜","★★★"],["月相","亮面朝太陽","★★★"],["日食與月食","新月・滿月","★★★"],["潮汐","每天兩漲兩退","★★★"]]),table:[["光年、太陽系行星","★★","114-37"],["晝夜、四季、太陽直射","★★★","111-6、113-31"],["月相變化","★★★","112-39、114-50"],["日食與月食","★★★","112-39、113-24"],["潮汐與大潮小潮","★★★","111-37、112-5、115-15"]],cs:[{t:"宇宙與太陽系",star:"★★",main:`<p class="law"><span>光年</span>光走一年的<em>距離</em>，是距離單位，不是時間單位。</p>\n  <figure class="dg"><svg viewBox="0 0 640 150" role="img" aria-label="太陽系八大行星">\n   <g font-family="Noto Sans TC,sans-serif" text-anchor="middle">\n   <circle cx="0" cy="70" r="50" fill="#f2b632"/>\n   ${[["水",80,5,"#9a8f84"],["金",125,8,"#e0b26a"],["地",172,9,"#3b82c4"],["火",218,6,"#c9573a"],["木",300,26,"#d6a46a"],["土",395,22,"#e2c58c"],["天",480,14,"#8fd0d8"],["海",560,14,"#4a6fd0"]].map(([t,e,a,i])=>`<circle cx="${e}" cy="70" r="${a}" fill="${i}"/><text x="${e}" y="120" fill="var(--ink)" font-size="14" font-weight="900">${t}</text>`).join("")}\n   <path d="M60 135 H240" stroke="var(--earth)" stroke-width="2"/><text x="150" y="148" fill="var(--earth-k)" font-size="12" font-weight="700">類地行星：岩石、密度大、體積小</text>\n   <path d="M270 135 H600" stroke="var(--accent)" stroke-width="2"/><text x="435" y="148" fill="var(--accent)" font-size="12" font-weight="700">類木行星：氣體、體積大、衛星多</text></g></svg>\n   <figcaption>圖 1　離太陽由近到遠：水金地火木土天海。</figcaption></figure>`,side:[["判斷技巧","行星排一直線的題目：先畫出各自的軌道圈，地球軌道在金星外面，所以地球不可能夾在金星和水星中間。（114 會考第 37 題）"]],ex:"bp56",exNote:["地球的軌道在金星、水星外面，不可能在兩者之間 → A 錯。","地球和火星可以分別在太陽兩側，太陽就在中間 → B 對。","金星、水星可以分在太陽兩側，C 錯；火星、木星分在兩側時地球也可能夾在中間，D 錯。選 B。"],pr:"bm56"},{t:"晝夜與四季",star:"★★★",main:`<p><b>晝夜</b>是地球<b>自轉</b>造成的；<b>四季</b>是因為<b>地軸傾斜</b>，加上地球<b>公轉</b>，太陽直射的位置在南北回歸線之間移動。</p>\n  <figure class="dg"><svg viewBox="0 0 620 220" role="img" aria-label="地球公轉與四季">\n   <g font-family="Noto Sans TC,sans-serif" text-anchor="middle">\n   <ellipse cx="310" cy="110" rx="250" ry="75" fill="none" stroke="var(--muted)" stroke-dasharray="5 5"/>\n   <circle cx="310" cy="110" r="26" fill="#f2b632"/><text x="310" y="115" fill="#5a3d00" font-size="13" font-weight="900">太陽</text>\n   ${[[60,110,"夏至 6/21","北回歸線直射",1],[560,110,"冬至 12/22","南回歸線直射",0],[310,35,"秋分","赤道直射",2],[310,185,"春分","赤道直射",2]].map(([t,e,a,i,s])=>`<circle cx="${t}" cy="${e}" r="16" fill="#3b82c4"/><path d="M${t+8} ${e-22} L${t-8} ${e+22}" stroke="var(--ink)" stroke-width="2.5"/><text x="${s===2?t+26:t}" text-anchor="${s===2?"start":"middle"}" y="${s===2?e+5:e+42}" fill="var(--ink)" font-size="13" font-weight="900">${a}</text><text x="${t}" y="${s===2?e<100?e-10+0:e+54:e+58}" fill="var(--muted)" font-size="11">${s===2?"":i}</text>`).join("")}\n   <text x="60" y="50" fill="var(--bad)" font-size="11" font-weight="700">北極朝太陽</text><text x="560" y="50" fill="#3b6fc4" font-size="11" font-weight="700">北極背太陽</text></g></svg>\n   <figcaption>圖 2　地軸方向固定。北極傾向太陽時是北半球夏天。</figcaption></figure>\n  <div class="cmp"><table><thead><tr><th>臺灣</th><th>正午太陽</th><th>白天</th><th>影子</th></tr></thead><tbody>\n   <tr><th>夏至</th><td><b>最高</b>（仰角最大）</td><td>最長</td><td>最短</td></tr>\n   <tr><th>冬至</th><td><b>最低</b></td><td>最短</td><td>最長、陽光照進屋內最深</td></tr></tbody></table></div>`,side:[["易錯","南北半球季節相反：12 月北半球冬天、南半球夏天。（111 會考第 6 題）"],["判斷技巧","陽光照進教室越深 → 太陽越低 → 越接近冬至。（113 會考第 31 題）"]],ex:"bp36",exNote:["12/25 太陽直射在南回歸線附近。","南半球（紐西蘭）是夏天，晝長夜短；北半球（英國）是冬天，晝短夜長。","所以紐西蘭白晝比英國長，選 B。"],pr:"bm57"},{t:"月相：亮面永遠朝太陽",star:"★★★",main:`<p>月亮自己不發光，是反射太陽光。月亮繞地球一圈約 <b>29.5 天</b>，我們看到被照亮的部分不一樣，就是月相。</p>\n  <figure class="dg"><svg viewBox="0 0 620 285" role="img" aria-label="月相圖">${AH}\n   <g font-family="Noto Sans TC,sans-serif" text-anchor="middle">\n   ${[40,130,220].map(t=>`<path d="M612 ${t} H568" stroke="#f2b632" stroke-width="3" marker-end="url(#ah)"/>`).join("")}<text x="590" y="20" fill="#c98b00" font-size="12" font-weight="700">陽光</text>\n   <circle cx="290" cy="130" r="26" fill="#3b82c4"/><text x="290" y="135" fill="#fff" font-size="12" font-weight="900">地球</text>\n   ${[[430,130,"新月（初一）",0],[290,30,"上弦月（初七、八）",1],[150,130,"滿月（十五）",2],[290,230,"下弦月（廿二、三）",3]].map(([t,e,a,i])=>{const s=i===0?"":i===2?"":"";return`<circle cx="${t}" cy="${e}" r="16" fill="#2b2f3a"/><path d="M${t} ${e-16} A16 16 0 0 1 ${t} ${e+16} Z" fill="#f3e9b5"/>\n   <circle cx="${t+(i===0?100:i===2?-100:i===1?110:110)}" cy="${e}" r="16" fill="#2b2f3a"/>${i===0?"":i===2?`<circle cx="${t-100}" cy="${e}" r="16" fill="#f3e9b5"/>`:i===1?`<path d="M${t+110} ${e-16} A16 16 0 0 1 ${t+110} ${e+16} Z" fill="#f3e9b5"/>`:`<path d="M${t+110} ${e-16} A16 16 0 0 0 ${t+110} ${e+16} Z" fill="#f3e9b5"/>`}\n   <text x="${t+(i===0?100:i===2?-100:110)}" y="${e+34}" fill="var(--ink)" font-size="12" font-weight="900">${a}</text>`}).join("")}\n   <text x="20" y="280" fill="var(--muted)" font-size="11" text-anchor="start">內圈：月球位置　外圈：從地球看到的樣子</text></g></svg>\n   <figcaption>圖 3　上弦月右半邊亮、下弦月左半邊亮。新月→上弦→滿月→下弦，各隔約 7 天。</figcaption></figure>`,side:[["記法","「上弦右亮、傍晚南天；下弦左亮、清晨南天」。"],["判斷技巧","知道某天是滿月，加 7 天是下弦、加 15 天是新月、加 22 天是上弦。"]],ex:"bp45",exNote:["月食在滿月（9 日），日食在新月（23 日）。","新月後約 7 天是上弦月 → 23＋7＝30 日。","16 日是下弦月、2 日是上弦月，選 D。"],pr:"bm58"},{t:"日食與月食",star:"★★★",main:`<figure class="dg"><svg viewBox="0 0 620 190" role="img" aria-label="日食與月食排列">\n   <g font-family="Noto Sans TC,sans-serif" text-anchor="middle">\n   ${[[45,"日食：太陽－月球－地球","月球在中間 → 一定是新月（初一）",[["#f2b632",30,"太陽"],["#2b2f3a",10,"月"],["#3b82c4",18,"地球"]]],[125,"月食：太陽－地球－月球","地球在中間 → 一定是滿月（十五）",[["#f2b632",30,"太陽"],["#3b82c4",18,"地球"],["#b5533a",10,"月"]]]].map(([t,e,a,i])=>`${i.map(([e,a,i],s)=>`<circle cx="${60+s*130}" cy="${t}" r="${a}" fill="${e}"/><text x="${60+s*130}" y="${t+a+16}" fill="var(--muted)" font-size="11">${i}</text>`).join("")}<path d="M90 ${t} H${330}" stroke="#f2b632" stroke-width="1.5" stroke-dasharray="3 4"/><text x="480" y="${t-6}" fill="var(--ink)" font-size="14" font-weight="900">${e}</text><text x="480" y="${t+14}" fill="var(--bad)" font-size="12" font-weight="700">${a}</text>`).join("")}</g></svg>\n   <figcaption>圖 4　擋在中間的那顆，影子落在另一顆上。</figcaption></figure>\n  <p>月球軌道和地球軌道有一點傾斜，所以不是每個初一、十五都會有日月食。</p>`,side:[["易錯","日食一定是新月、月食一定是滿月，不會反過來。（112 會考第 39 題）"],["判斷技巧","白天太陽被遮住一部分又恢復 → 日食 → 月影落在地球上。（113 會考第 24 題）"]],ex:"bp48",exNote:["白天太陽明亮面積先減少再恢復 → 日食。","日食是月球擋在中間，月球的影子落在地球上。","日食在農曆初一，不是十五，選 C。"],pr:"bm59"},{t:"潮汐：每天兩漲兩退",star:"★★★",main:`<p>潮汐主要由<b>月球引力</b>（太陽也有一點）造成。大部分地方<b>每天兩次滿潮、兩次乾潮</b>，滿潮到下一次滿潮約 <b>12 小時 25 分</b>。</p>\n  <figure class="dg"><svg viewBox="0 0 600 200" role="img" aria-label="潮汐水位曲線">\n   <g font-family="Noto Sans TC,sans-serif" text-anchor="middle">\n   <path d="M40 160 H570" stroke="var(--muted)" stroke-width="1.5"/>\n   <path d="M40 40 C100 40 120 140 165 140 C210 140 230 40 290 40 C350 40 370 140 415 140 C460 140 480 40 540 40" fill="none" stroke="#3b6fc4" stroke-width="4"/>\n   ${[[40,"滿潮","0 時"],[165,"乾潮","約 6 時"],[290,"滿潮","約 12 時 25 分"],[415,"乾潮","約 18 時 37 分"]].map(([t,e,a],i)=>`<circle cx="${t}" cy="${i%2?140:40}" r="6" fill="${i%2?"var(--earth)":"#3b6fc4"}"/><text x="${t+(t===40?10:0)}" y="${i%2?128:28}" fill="var(--ink)" font-size="13" font-weight="900">${e}</text><text x="${t+(t===40?10:0)}" y="182" fill="var(--muted)" font-size="11">${a}</text>`).join("")}\n   <text x="228" y="95" fill="var(--bad)" font-size="12" font-weight="700">漲潮</text><text x="103" y="95" fill="var(--bad)" font-size="12" font-weight="700">退潮</text></g></svg>\n   <figcaption>圖 5　滿潮到乾潮大約 6 小時；退潮期間的一半約 3 小時。</figcaption></figure>\n  <div class="cmp"><table><thead><tr><th></th><th>月相</th><th>排列</th><th>潮差</th></tr></thead><tbody>\n   <tr><th>大潮</th><td>新月、滿月</td><td>日、地、月成一直線</td><td>最大</td></tr>\n   <tr><th>小潮</th><td>上弦、下弦</td><td>日、地、月成直角</td><td>最小</td></tr></tbody></table></div>`,side:[["判斷技巧","水位一直降、某時開始升 → 乾潮就在「降→升」轉折的那段時間。（111 會考第 37 題）"],["注意","潮差＝滿潮高度－乾潮高度。"]],ex:"bp39",exNote:["8→10→12 點海浪位置一路變低，代表在退潮。","12→14 點變高，代表開始漲潮。","最低點（乾潮）落在 12～14 點之間，選 B。"],pr:"bm60"}],end:["bp41","bp50","bp57","bp59","fig16","fig47","fig48"],sumT:"月相、日月食、潮汐一次整理",sumH:["","農曆","可能發生","潮汐"],summary:[["新月","初一","日食","大潮"],["上弦月","初七、八","—（傍晚在南方天空）","小潮"],["滿月","十五","月食","大潮"],["下弦月","廿二、廿三","—（清晨在南方天空）","小潮"]]};REF[206]={intro:"這一章的題目常常是一篇<b>閱讀文章</b>：先讀懂文章裡的氣體或現象有什麼性質，再對應到課本的觀念。抓住三件事：<b>溫室效應</b>怎麼保溫、<b>聖嬰現象</b>海水怎麼變、<b>節能減碳</b>怎麼做。每年 1～2 題。",map:mkMap("全球氣候變遷",[["溫室效應","吸收地表紅外線","★★★"],["大氣成分與碳","O₂ 21%・CO₂ 0.04%","★★"],["聖嬰現象","東太平洋變暖","★"],["永續與能源","再生能源","★★"]]),table:[["溫室效應與暖化","★★★","111-19"],["大氣成分、CO₂ 季節變化","★★","113-50"],["聖嬰與反聖嬰","★","課本基本題"],["永續發展與能源","★★","課本基本題"]],cs:[{t:"溫室效應：地球的棉被",star:"★★★",main:`<figure class="dg"><svg viewBox="0 0 600 220" role="img" aria-label="溫室效應">${AH}\n   <g font-family="Noto Sans TC,sans-serif" text-anchor="middle">\n   <circle cx="60" cy="40" r="26" fill="#f2b632"/>\n   <rect x="40" y="170" width="520" height="40" fill="var(--earth)" opacity=".35"/><text x="300" y="196" fill="var(--ink)" font-size="14" font-weight="900">地表</text>\n   <rect x="40" y="80" width="520" height="30" fill="var(--muted)" opacity=".25"/><text x="470" y="100" fill="var(--ink)" font-size="13" font-weight="700">溫室氣體</text>\n   <path d="M85 60 L180 165" stroke="#f2b632" stroke-width="4" marker-end="url(#ah)"/><text x="95" y="45" text-anchor="start" fill="#c98b00" font-size="12" font-weight="700">① 陽光照進來</text>\n   <path d="M260 168 L300 108" stroke="var(--bad)" stroke-width="4" marker-end="url(#ah)"/><text x="240" y="140" fill="var(--bad)" font-size="12" font-weight="700" text-anchor="end">② 地表放出紅外線</text>\n   <path d="M310 100 L330 30" stroke="var(--bad)" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#ah)"/><text x="345" y="40" fill="var(--muted)" font-size="12" text-anchor="start">一部分散到太空</text>\n   <path d="M330 110 L370 165" stroke="var(--bad)" stroke-width="4" marker-end="url(#ah)"/><text x="385" y="145" fill="var(--bad)" font-size="12" font-weight="700" text-anchor="start">③ 被吸收再放回地表 → 保溫</text></g></svg>\n   <figcaption>圖 1　溫室氣體像棉被：適量讓地球不會太冷，太厚就變熱。</figcaption></figure>\n  <p class="law"><span>溫室氣體的關鍵特性</span>會<em>吸收地表放出的紅外線（地表輻射）</em>。主要有水氣、<em>二氧化碳</em>、甲烷、一氧化二氮。氮氣、氧氣不是。</p>`,side:[["判斷技巧","文章說某氣體「會吸收地表輻射」→ 它就是溫室氣體，其他性質（無色、能麻醉）都是干擾。（111 會考第 19 題）"],["易錯","溫室效應本身不是壞事；問題是人類燒化石燃料讓它增強。"]],ex:"bp38",exNote:["溫室氣體的關鍵：會吸收地表放出的輻射，把熱留在大氣中。","無色無味、是氣體、能麻醉，都和溫室效應無關。","所以是「會吸收地表輻射」，選 B。"],pr:"bm61"},{t:"大氣成分與碳的季節變化",star:"★★",main:`<figure class="dg"><svg viewBox="0 0 600 120" role="img" aria-label="大氣成分">\n   <g font-family="Noto Sans TC,sans-serif">\n   <rect x="40" y="30" width="410" height="40" fill="#3b6fc4" opacity=".7"/><rect x="450" y="30" width="110" height="40" fill="var(--ok)" opacity=".8"/><rect x="556" y="30" width="4" height="40" fill="var(--bad)"/>\n   <text x="245" y="56" text-anchor="middle" fill="#fff" font-size="15" font-weight="900">氮氣 約 78%</text><text x="503" y="56" text-anchor="middle" fill="#fff" font-size="14" font-weight="900">氧氣 21%</text>\n   <text x="560" y="95" text-anchor="end" fill="var(--bad)" font-size="12" font-weight="700">CO₂ 只有約 0.04%</text></g></svg>\n   <figcaption>圖 2　CO₂ 量很少，所以一點點變動，百分比就很明顯。</figcaption></figure>\n  <ol class="pts"><li>北半球<b>春夏</b>植物光合作用旺盛 → 吸收較多 CO₂ → CO₂ 下降；秋冬上升。</li><li>長期來看 CO₂ 整體<b>逐年上升</b>，主要是燃燒化石燃料。</li><li>同樣多的氣體變動，O₂ 基數大（21%），變化百分比<b>小很多</b>。</li></ol>`,side:[["判斷技巧","比較「變化百分比」要看原本有多少：原本越多，同樣的變動量，百分比越小。"]],ex:"bp51",exNote:["光合作用吸 CO₂、放 O₂，兩者變動的量差不多。","大氣中 O₂ 約 21%，CO₂ 只有約 0.04%，O₂ 多得多。","同樣的變動量放在很大的 O₂ 上，百分比會小很多，選 C。"],pr:"pr316"},{t:"聖嬰與反聖嬰",star:"★",main:`<figure class="dg"><svg viewBox="0 0 600 190" role="img" aria-label="聖嬰現象">${AH}\n   <g font-family="Noto Sans TC,sans-serif" text-anchor="middle">\n   <text x="80" y="25" fill="var(--ink)" font-size="13" font-weight="700">西太平洋</text><text x="80" y="42" fill="var(--muted)" font-size="11">（印尼、澳洲）</text>\n   <text x="520" y="25" fill="var(--ink)" font-size="13" font-weight="700">東太平洋</text><text x="520" y="42" fill="var(--muted)" font-size="11">（祕魯、南美）</text>\n   <text x="300" y="75" fill="var(--ink)" font-size="14" font-weight="900">平常：信風把暖水吹到西邊</text>\n   <path d="M480 90 H140" stroke="#3b6fc4" stroke-width="3" marker-end="url(#ah)"/>\n   <text x="
