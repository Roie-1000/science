<script>const QBANK=[{id:"p0",t:"past",u:14,y:111,n:2,q:"成熟的蓮霧會自然從樹上掉落到地面，蓮霧在掉落的過程中，其速率逐漸增加。上述現象是下列何種能量減少而轉換成其他形式的能量所造成的？",o:["動能","熱能","重力位能","彈力（性）位能"],a:2,e:"物體由高處落下，高度變低，重力位能減少，轉變為動能（速率變大）和少部分熱能。"},{id:"p1",t:"past",u:7,y:111,n:3,q:"博物館的貴重畫冊常會保存在充滿氮氣的密閉容器中，以防止畫冊氧化。上述使用氮氣的原因，主要是考量氮氣具有下列何種性質？",o:["密度較大","比熱較小","沸點較大","活性較小"],a:3,e:"氮氣在常溫下活性很小，不容易和其他物質反應，所以可以隔絕氧氣、避免畫冊被氧化。"},{id:"p2",t:"past",u:11,y:111,n:7,q:"小真和小文到高山上旅遊，發現密封包裝的洋芋片外包裝比在山下膨脹許多。小真說：「包裝膨脹應該是因為山上氣溫較低。」小文不同意。下列哪一個說法「最不適合」用來反駁小真？",o:["在平地家中開冷氣，溫度跟山上相同，洋芋片包裝卻沒有膨脹","這瓶玻璃瓶裝可樂同樣到氣溫較低的山上，玻璃瓶卻沒有膨脹","山上便利商店內有暖氣，溫度跟山下相同，洋芋片包裝也有膨脹","開車上山時車內空調讓溫度不變，洋芋片包裝也有膨脹"],a:1,e:"包裝膨脹是因為山上大氣壓力較小。(A)(C)(D)都能說明「跟溫度無關」；(B)玻璃瓶容積固定，本來就不會膨脹，無法用來說明，所以最不適合。"},{id:"p3",t:"past",u:6,y:111,n:9,q:"製作蛋糕時，在白色鮮奶油中加入色素使其「變色」，鮮奶油仍維持原本性質；做好的蛋糕若沒冷藏，鮮奶油會腐壞「變質」。關於「變色」和「變質」，下列何者最合理？",o:["兩者都是化學變化","兩者都不是化學變化","只有後者是化學變化","只有前者是化學變化"],a:2,e:"加色素只是混合，沒有新物質生成，是物理變化；腐壞變質有新物質生成，是化學變化。"},{id:"p4",t:"past",u:10,y:111,n:10,q:"蘋果酸是蘋果的酸味來源，化學式為 C₄H₆O₅，分子中含有兩個 −COOH 原子團。關於蘋果酸，下列何者正確？",o:["屬於有機化合物，也是電解質","屬於有機化合物，也是非電解質","屬於無機化合物，也是電解質","屬於無機化合物，也是非電解質"],a:0,e:"含碳且具有 −COOH，屬於有機酸（有機化合物）；酸溶於水會解離出 H⁺，所以是電解質。"},{id:"p5",t:"past",u:3,y:111,n:14,q:"光線經過「」中的裝置後，哪一個「不會」改變光的傳播方向？",o:["利用「針孔」成像觀察日食","利用「放大鏡」觀察花朵","利用「汽車後照鏡」觀察後方車輛","利用「三稜鏡」將陽光分散成七種顏色"],a:0,e:"針孔成像是光的直進造成，光不轉彎；放大鏡、三稜鏡是折射，後照鏡是反射，都會改變光的方向。"},{id:"p6",t:"past",u:6,y:111,n:21,adapt:true,q:"「自熱罐」飲料的罐身下方隔層有氧化鈣（CaO）和水，兩者混合後會放出熱量加熱飲料。CaO 和水反應產生的物質應為下列何者？",o:["碳酸鈉","硫酸鈣","氫氧化鈉","氫氧化鈣"],a:3,e:"CaO + H₂O → Ca(OH)₂，產生氫氧化鈣（熟石灰），而且是放熱反應。"},{id:"p7",t:"past",u:10,y:111,n:22,q:"去除咖啡因時，過去常用二氯甲烷作有機溶劑，後來因安全疑慮改用乙酸乙酯。「因為酯類＿＿＿，所以較無安全性疑慮」，空格最適合填入下列何者？",o:["只由碳和氫兩種原子所組成","是香蕉、柳丁等水果就含有的物質","沸點比二氯甲烷高，而不易揮發去除","是油脂與鹼性物質進行皂化反應後的產物"],a:1,e:"酯類本來就存在於香蕉、柳丁等水果中（水果香味來源），代表較無毒性。(A)酯含有氧；(D)皂化的產物是肥皂和甘油。"},{id:"p8",t:"past",u:4,y:111,n:28,adapt:true,q:"將 20℃ 的純水分成甲、乙兩杯，質量比 M甲：M乙＝3：2，用相同的熱源分別加熱相同時間（熱量完全被水吸收），甲、乙兩杯上升溫度的比 ΔT甲：ΔT乙 為何？",o:["3：2","2：3","1：1","9：4"],a:1,e:"H＝m·s·ΔT，熱量相同、比熱相同時，ΔT 與質量成反比，所以 ΔT甲：ΔT乙＝2：3。"},{id:"p9",t:"past",u:8,y:111,n:29,q:"養殖池白蝦大量死亡，專家建議用水車調整水中溶氧量，並投放熟石灰（氫氧化鈣）調整 pH 值。關於此方法，下列說明何者最合理？",o:["使水中溶氧量增加，pH 值增加","使水中溶氧量增加，pH 值減少","使水中溶氧量減少，pH 值增加","使水中溶氧量減少，pH 值減少"],a:0,e:"水車攪動水面讓更多氧氣溶入；氫氧化鈣溶於水呈鹼性，使 pH 值增加。"},{id:"p10",t:"past",u:5,y:111,n:31,q:"一個帶電的離子含有 X、Y、Z 三種粒子（質子、電子、中子，未依順序），數目依序為 Nx、Ny、Nz。已知 X 粒子的質量最小，下列何者最合理？",o:["若為陽離子，且 Ny＞Nx＝Nz，則 Z 為質子","若為陽離子，且 Ny＞Nx＝Nz，則 Z 為電子","若為陰離子，且 Nx＝Ny＞Nz，則 Z 為質子","若為陰離子，且 Nx＞Ny＝Nz，則 Z 為電子"],a:2,e:"質量最小的 X 是電子。陽離子電子比質子少，Ny＞Nx 所以 Y 是質子、Z 是中子；陰離子電子比質子多，Nx＝Ny＞Nz 時，Y 是中子、Z 是質子。"},{id:"p11",t:"past",u:2,y:111,n:34,adapt:true,q:"繩子一端以固定頻率上下振動產生繩波。繩上 P 點的鉛直高度隨時間變化如下：時間（×10⁻² s）0、0.5、1.0、1.5、2.0、2.5、3.0、3.5、4.0、4.5；高度（cm）5.0、2.5、−2.5、−5.0、−2.5、2.5、5.0、2.5、−2.5、−5.0。此繩波的週期最可能為何？",o:["1.0×10⁻² s","1.5×10⁻² s","2.0×10⁻² s","3.0×10⁻² s"],a:3,e:"0 s 時在 5.0 cm，到 3.0×10⁻² s 又回到 5.0 cm（最高點），剛好完成一次完整振動，所以週期是 3.0×10⁻² s。",fig:'<svg viewBox="0 0 300 194" role="img" aria-label="題目附圖"><path class="ax" d="M40 18 V172 M40 95 H285"/><path class="ln" d="M40.0 35.0 L42.6 35.3 L45.2 36.3 L47.8 37.9 L50.4 40.2 L53.0 43.0 L55.6 46.5 L58.2 50.4 L60.8 54.9 L63.4 59.7 L66.0 65.0 L68.6 70.6 L71.2 76.5 L73.8 82.5 L76.4 88.7 L79.0 95.0 L81.6 101.3 L84.2 107.5 L86.8 113.5 L89.4 119.4 L92.0 125.0 L94.6 130.3 L97.2 135.1 L99.8 139.6 L102.4 143.5 L105.0 147.0 L107.6 149.8 L110.2 152.1 L112.8 153.7 L115.4 154.7 L118.0 155.0 L120.6 154.7 L123.2 153.7 L125.8 152.1 L128.4 149.8 L131.0 147.0 L133.6 143.5 L136.2 139.6 L138.8 135.1 L141.4 130.3 L144.0 125.0 L146.6 119.4 L149.2 113.5 L151.8 107.5 L154.4 101.3 L157.0 95.0 L159.6 88.7 L162.2 82.5 L164.8 76.5 L167.4 70.6 L170.0 65.0 L172.6 59.7 L175.2 54.9 L177.8 50.4 L180.4 46.5 L183.0 43.0 L185.6 40.2 L188.2 37.9 L190.8 36.3 L193.4 35.3 L196.0 35.0 L198.6 35.3 L201.2 36.3 L203.8 37.9 L206.4 40.2 L209.0 43.0 L211.6 46.5 L214.2 50.4 L216.8 54.9 L219.4 59.7 L222.0 65.0 L224.6 70.6 L227.2 76.5 L229.8 82.5 L232.4 88.7 L235.0 95.0 L237.6 101.3 L240.2 107.5 L242.8 113.5 L245.4 119.4 L248.0 125.0 L250.6 130.3 L253.2 135.1 L255.8 139.6 L258.4 143.5 L261.0 147.0 L263.6 149.8 L266.2 152.1 L268.8 153.7 L271.4 154.7 L274.0 155.0"/><circle cx="40" cy="35" r="3.5" class="dot"/><circle cx="66.0" cy="65.0" r="3.5" class="dot"/><circle cx="92" cy="125.0" r="3.5" class="dot"/><circle cx="118.0" cy="155" r="3.5" class="dot"/><circle cx="144" cy="125.0" r="3.5" class="dot"/><circle cx="170.0" cy="65.0" r="3.5" class="dot"/><circle cx="196" cy="35" r="3.5" class="dot"/><circle cx="222.0" cy="65.0" r="3.5" class="dot"/><circle cx="248" cy="125.0" r="3.5" class="dot"/><circle cx="274.0" cy="155" r="3.5" class="dot"/><path class="ax" d="M92 95 v4"/><text x="92" y="176" text-anchor="middle">1.0</text><path class="ax" d="M144 95 v4"/><text x="144" y="176" text-anchor="middle">2.0</text><path class="ax" d="M196 95 v4"/><text x="196" y="176" text-anchor="middle">3.0</text><path class="ax" d="M248 95 v4"/><text x="248" y="176" text-anchor="middle">4.0</text><text x="32" y="39" text-anchor="end">5</text><text x="32" y="159" text-anchor="end">−5</text><text x="32" y="99" text-anchor="end">0</text><path class="gr" d="M40 35 H285 M40 155 H285"/><text x="294" y="188" text-anchor="end">時間 (×10⁻² s)</text><text x="8" y="12" text-anchor="start">高度 (cm)</text></svg>',cap:"P 點高度隨時間的變化（依表中數據畫成）"},{id:"p12",t:"past",u:11,y:111,n:36,q:"書櫃裝滿書時推不動，把書拿下後就能推動。阿忠：「由 F＝ma，質量大推動所需的力也大。」小志：「裝滿書時書櫃對地面的正向力較大，最大靜摩擦力較大，所以推不動。」兩人的解釋是否合理？",o:["兩人均合理","兩人均不合理","只有阿忠合理","只有小志合理"],a:3,e:"要推動靜止的物體，外力必須超過最大靜摩擦力；書越多正向力越大，最大靜摩擦力越大。F＝ma 說的是合力與加速度，任何大於 0 的合力都能讓物體加速，所以阿忠不合理。"},{id:"p13",t:"past",u:1,y:111,n:38,q:"一個內部為真空的密閉空心金屬球，金屬成分為純銅。將球放入水中會完全沒入，測得排開水的體積為 V，質量為 M，算出 D＝M/V 與純銅密度 8.96 g/cm³ 明顯不同。若測量與計算都沒錯，下列何者最合理？",o:["D＜8.96，因為 M 是金屬的質量，但 V 大於金屬成分的體積","D＜8.96，因為 V 是金屬的體積，但 M 小於金屬成分的質量","D＞8.96，因為 M 是金屬的質量，但 V 小於金屬成分的體積","D＞8.96，因為 V 是金屬的體積，但 M 大於金屬成分的質量"],a:0,e:"排開水的體積 V＝金屬體積＋空心部分體積，比金屬體積大；質量只有金屬，所以算出的平均密度 D 比純銅小。"},{id:"p14",t:"past",u:15,y:111,n:48,adapt:true,q:"電阻丙、丁並聯後接在電池上。安培計乙接在幹路上，安培計甲只與電阻丙串聯。小玉記錄 I甲＝200 mA、I乙＝100 mA。判斷 I甲＞I乙 是否合理，下列何者最適當？",o:["合理，因為負極為電子流出端，甲較靠近負極","合理，因為甲測得的電流應為流過丙與丁的電流相加","不合理，因為正極為電流流出端，乙較靠近正極，所以 I乙＞I甲","不合理，因為乙測得的電流應為流過丙與丁的電流相加，所以 I乙＞I甲"],a:3,e:"幹路電流＝各支路電流的和。乙在幹路，測到丙＋丁的電流；甲只測到丙，所以應該 I乙＞I甲，紀錄不合理。",fig:'<svg viewBox="0 0 300 178" role="img" aria-label="題目附圖"><path class="ink" d="M40 40 V91 M40 109 V160 H260 V40 H40 M110 40 V100 H260"/><rect x="26" y="91" width="28" height="18" style="fill:var(--sheet)"/><path class="ink" d="M27 95 H53"/><path class="ink" d="M33 105 H47"/><path d="M33 105 H47" style="stroke:var(--ink);stroke-width:4"/><text x="58" y="98" text-anchor="start">＋</text><text x="58" y="114" text-anchor="start">－</text><circle cx="150" cy="40" r="12" class="meter"/><text x="150" y="45" text-anchor="middle" class=b>甲</text><rect x="195" y="31" width="40" height="18" rx="0" class="res"/><text x="215" y="25" text-anchor="middle" class=b>丙</text><rect x="165" y="91" width="40" height="18" rx="0" class="res"/><text x="185" y="85" text-anchor="middle" class=b>丁</text><circle cx="150" cy="160" r="12" class="meter"/><text x="150" y="165" text-anchor="middle" class=b>乙</text></svg>',cap:"電路接法示意圖"},{id:"p15",t:"past",u:3,y:112,n:9,q:"舞臺劇演出時讓周遭環境昏暗，再用聚光燈照射演員。觀眾能看見演員的原因，下列何者最合理？",o:["聚光燈的光照在演員上，演員吸收這些光線","聚光燈的光照在演員上，演員折射這些光線","聚光燈的光照在演員上，演員反射這些光線","觀眾眼睛發出的光照在演員上，演員折射這些光線"],a:2,e:"演員自己不會發光。聚光燈的光照到演員身上，被演員「反射」進入觀眾眼睛，觀眾才看得見。吸收的光不會進到眼睛；折射是光穿過透明物體才發生；眼睛也不會發光。"},{id:"p16",t:"past",u:5,y:112,n:12,q:"道耳頓提出原子說後，愈來愈多證據顯示原子說需要修正。因為「電子的發現」而需要修正的內容最可能是下列何者？",o:["物質均由原子組成，原子不可再分割","相同元素的原子，有相同的質量和性質","不同元素的原子，有不同的質量和性質","化學反應是原子的重新排列組合"],a:0,e:"發現原子裡還有更小的電子，代表原子可以再分割，所以「原子不可分割」要修正。"},{id:"p17",t:"past",u:10,y:112,n:17,q:"四位學生說明有機化合物與無機化合物的組成元素，哪一位最合理？",o:["小玉：有機必含 C；無機必不含 C","小如：有機必含 C；無機可以含 C","小方：有機必含 C、O；無機必不含 C、O","阿德：有機必含 C、H、O；無機可以含 C、H、O"],a:1,e:"有機化合物一定含碳；但 CO、CO₂、碳酸鹽（如 CaCO₃）、氰化物雖然含碳，仍是無機化合物，所以無機物「可以」含 C。"},{id:"p18",t:"past",u:12,y:112,n:18,q:"400 公尺賽跑，各跑道起跑位置不同，但每位選手都跑 400 公尺。最先跑完的選手，下列哪一項物理量必高於其他所有選手？",o:["平均速率","平均速度","過程中速率的最大值","過程中速度的最大值"],a:0,e:"平均速率＝路徑長÷時間，大家路徑長都是 400 m，最先到的時間最短，平均速率最大。各跑道起終點不同，位移不一樣，平均速度無法判斷；最大值也無法判斷。"},{id:"p19",t:"past",u:14,y:112,n:19,q:"半圓形軌道固定在水平桌面，軌道兩端都距桌面 0.5 m。小球從距桌面 1.0 m 處由靜止自由落下滑入軌道，不計摩擦與阻力。小球滑過最低點後向上，到達最高點時動能為 0，則最高點距桌面多高？",o:["0.25 m","0.5 m","1.0 m","1.5 m"],a:2,e:"力學能守恆：最高點動能為 0，位能要等於一開始的位能，所以高度回到 1.0 m（會飛出軌道端點繼續上升）。"},{id:"p20",t:"past",u:7,y:112,n:26,q:"砒霜（As₂O₃）中常含有少量硫或硫化物，硫化物接觸銀會使銀氧化產生黑色硫化銀（Ag₂S），所以古人用銀針試毒。下列推論何者最合理？",o:["硫化物發生還原反應而使銀針變黑","銀針變黑是因為三氧化二砷被還原","砒霜純度愈高，銀針變黑愈明顯","將銀針改成活性更小的黃金，也會反應產生硫化物"],a:0,e:"銀被氧化，硫化物就被還原（氧化還原同時發生）。(B)變黑和 As₂O₃ 無關；(C)純度越高硫化物越少，越不明顯；(D)黃金活性很小不反應。"},{id:"p21",t:"past",u:6,y:112,n:27,q:"甲、乙兩種化合物在足量氧氣中燃燒：甲＋3O₂ → 2CO₂＋3H₂O；乙＋3O₂ → 2CO₂＋2H₂O。下列比較何者正確？",o:["甲的分子量大於乙，且甲可能為醇類","甲的分子量大於乙，且甲可能為烴類","乙的分子量大於甲，且乙可能為醇類","乙的分子量大於甲，且乙可能為烴類"],a:0,e:"用原子數守恆反推：甲＝C₂H₆O（分子量 46，可能是乙醇）；乙＝C₂H₄（分子量 28，乙烯，屬於烴）。"},{id:"p22",t:"past",u:1,y:112,n:30,adapt:true,q:"某牌黑麻油標示「內容量 500 mL／淨重 520 g」。已知黑麻油會浮在水面上，此標示是否合理？",o:["合理，因為 mL 與 g 都是質量單位","合理，因為黑麻油密度比水大","不合理，黑麻油密度比水小，g 前面的數值應小於 mL 前面的數值","不合理，mL 與 g 都是體積單位，數值應相同"],a:2,e:"mL（c.c.）是體積、g 是質量。會浮在水上代表密度＜1 g/cm³，質量（g）的數值應小於體積（mL）的數值，520 g＞500 mL 代表密度 1.04，矛盾。（改編自 112 會考第 30 題）"},{id:"p23",t:"past",u:11,y:112,n:33,q:"木塊靜置於粗糙水平面，施以不同水平外力，結果如下：外力 100 gw，摩擦力 100 gw，靜止；外力 200 gw，摩擦力 200 gw，靜止；外力 300 gw，摩擦力 250 gw，等加速度運動；外力 400 gw，摩擦力 250 gw，等加速度運動。最大靜摩擦力 fs 的範圍為何？",o:["fs＜200 gw","200 gw＜fs＜250 gw","250 gw＜fs＜300 gw","fs＞300 gw"],a:2,e:"200 gw 推不動 → fs＞200；300 gw 推得動 → fs＜300；動摩擦力是 250 gw，而最大靜摩擦力比動摩擦力大 → 250＜fs＜300。"},{id:"p24",t:"past",u:16,y:112,n:34,adapt:true,q:"電火鍋的電器標示為「110 V、1200 W」。正常使用下達到最大功率時，每分鐘消耗多少電能？",o:["20 J","110 J","1200 J","72000 J"],a:3,e:"E＝P×t＝1200 W × 60 s＝72000 J。時間要換成秒，單位才會是焦耳。"},{id:"p25",t:"past",u:9,y:112,n:40,q:"泳池派對倒入大量液態氮製造煙霧，造成數人昏迷。有人說：「氮氣和池水中的氯反應產生有毒的三氯化氮。」小莫認為不是三氯化氮造成的，下列何者最可能是她的理由？",o:["空氣中有大量氮氣，池水也會接觸氮氣，但一般泳池沒有類似意外","池水溫度因液態氮汽化而下降，反而會加快產生三氯化氮的反應速率","泳池加入較高濃度氯氣殺菌，氯含量比自來水高","液態氮汽化後的氣體會溶於池水中，與氯接觸機會增加"],a:0,e:"空氣中 78% 是氮氣，如果氮會和池水的氯反應產生毒物，平常泳池就會出事。(B)溫度下降速率會變慢；(D)氮氣難溶於水。"},{id:"p26",t:"past",u:12,y:113,n:1,adapt:true,q:"士兵從 X 點到 Y 點，甲路線走直線，乙路線走之字形。比較兩種路線的位移大小與路徑長，下列何者正確？",o:["位移：甲＞乙；路徑長：甲＝乙","位移：甲＝乙；路徑長：乙＞甲","位移：乙＞甲；路徑長：乙＞甲","位移與路徑長都相等"],a:1,e:"位移只看起點到終點的直線距離與方向，兩條路線起終點相同，位移相等；路徑長是實際走過的長度，之字形較長。（選項依原題概念重擬）",fig:'<svg viewBox="0 0 300 172" role="img" aria-label="題目附圖"><path class="ln2" d="M50 140 H250"/><path class="ln" d="M50 140 L85 60 L120 140 L155 60 L190 140 L225 60 L250 140"/><circle cx="50" cy="140" r="5" class="dot"/><circle cx="250" cy="140" r="5" class="dot"/><text x="46" y="160" text-anchor="middle" class=b>X</text><text x="254" y="160" text-anchor="middle" class=b>Y</text><text x="150" y="160" text-anchor="middle">甲路線（直線）</text><text x="160" y="46" text-anchor="middle">乙路線（之字形）</text></svg>',cap:"士兵的兩種路線"},{id:"p27",t:"past",u:10,y:113,n:2,q:"木糖醇可以代替蔗糖。若要知道木糖醇是否和乙醇一樣都是醇類，應查詢木糖醇的何項資訊？",o:["分子量","組成的原子種類與排列方式","組成的原子總數是否超過 1000 個","氫和氧的原子數目比是否為 1：1"],a:1,e:"醇類的特徵是具有 −OH 官能基，要看分子由哪些原子、怎麼排列（結構），才能判斷屬於哪一類。"},{id:"p28",t:"past",u:5,y:113,n:4,q:"元素週期表的一部分（含氦、氖、氬、氪、氯、溴等元素）。從週期表「無法」得知下列何項資訊？",o:["氯原子與氬原子的質子數分別為多少","氖原子與氪原子是否有相似的化學性質","氦原子與氪原子在自然界中含量何者比較多","1 莫耳氯氣與 1 莫耳溴何者質量較大"],a:2,e:"週期表可以查原子序（質子數）、原子量、同族性質相似，但沒有元素在自然界的含量。"},{id:"p29",t:"past",u:16,y:113,n:6,adapt:true,q:"電扇插頭處的雙芯電線被老鼠咬破，兩條銅線都裸露。小健直接用絕緣膠帶把兩條裸露的銅線纏在一起包起來（兩條銅線互相接觸）。家人認為不適當，原因最可能是下列何者？",o:["插電後電扇會轉，但轉速下降","插電後電扇會轉，但耗電量上升","插電後電線會發生短路，可能引發電線走火","插電後流過電扇的電流變大，轉速過快而危險"],a:2,e:"兩條導線直接接觸，電流不經過電扇就直接流回去，形成短路，電流極大、發熱，可能起火。"},{id:"p30",t:"past",u:6,y:113,n:7,q:"虎門銷煙：引海水進浸泡池泡鴉片，再加入石灰，石灰遇水會改變水溫，利於將鴉片溶於水中。下列何者最合理？",o:["石灰溶於水為放熱反應，高溫使鴉片更易溶於水","石灰溶於水為吸熱反應，高溫使鴉片更易溶於水","鴉片浸泡海水使水溫上升，與石灰反應速率加快","鴉片浸泡海水使水溫下降，與石灰反應速率加快"],a:0,e:"生石灰 CaO 加水變成 Ca(OH)₂，同時放出大量的熱，是放熱反應。水溫升高後，鴉片比較容易溶在水裡。所以不是吸熱；水溫改變是石灰造成的，不是鴉片泡海水造成的。"},{id:"p31",t:"past",u:9,y:113,n:11,q:"裝有紅棕色 NO₂ 的密閉瓶放入冰水，NO₂ 結合成無色 N₂O₄，顏色逐漸變淡。溫度恆定一段時間後顏色不再改變，此時反應速率的說明何者正確？",o:["正反應速率等於逆反應速率，且速率為 0","正反應速率等於逆反應速率，且速率不為 0","正反應速率不等於逆反應速率，且兩速率均不為 0","正反應速率不等於逆反應速率，且其中一速率為 0"],a:1,e:"動態平衡：正、逆反應仍在進行，只是速率相等，所以濃度（顏色）不再改變。"},{id:"p32",t:"past",u:17,y:113,n:13,adapt:true,q:"兩個相同的螺線管各接一個相同的檢流計。兩個相同的磁鐵，一個 N 極向下、一個 N 極向上，從相同高度由靜止落下穿過線圈。比較磁鐵剛進入線圈時兩檢流計的感應電流，下列何者最合理？",o:["方向相同，大小相同","方向相同，大小不同","方向相反，大小不同","方向相反，大小相同"],a:3,e:"磁極方向相反，線圈內磁場的變化方向相反，感應電流方向相反；落下高度相同、速率相同、圈數相同，磁場變化快慢相同，感應電流大小相同。（選項依原題概念重擬）",fig:'<svg viewBox="0 0 300 194" role="img" aria-label="題目附圖"><ellipse cx="90" cy="104" rx="26" ry="6" class="ink"/><ellipse cx="90" cy="113" rx="26" ry="6" class="ink"/><ellipse cx="90" cy="122" rx="26" ry="6" class="ink"/><ellipse cx="90" cy="131" rx="26" ry="6" class="ink"/><ellipse cx="90" cy="140" rx="26" ry="6" class="ink"/><ellipse cx="90" cy="149" rx="26" ry="6" class="ink"/><ellipse cx="90" cy="158" rx="26" ry="6" class="ink"/><path class="ink" d="M64 158 C50 170 44 176 44 176 M116 158 C130 170 136 176 136 176"/><path class="ink" d="M44 176 H76 M104 176 H136"/><circle cx="90" cy="176" r="12" class="meter"/><text x="90" y="181" text-anchor="middle" class=b>G</text><ellipse cx="210" cy="104" rx="26" ry="6" class="ink"/><ellipse cx="210" cy="113" rx="26" ry="6" class="ink"/><ellipse cx="210" cy="122" rx="26" ry="6" class="ink"/><ellipse cx="210" cy="131" rx="26" ry="6" class="ink"/><ellipse cx="210" cy="140" rx="26" ry="6" class="ink"/><ellipse cx="210" cy="149" rx="26" ry="6" class="ink"/><ellipse cx="210" cy="158" rx="26" ry="6" class="ink"/><path class="ink" d="M184 158 C170 170 164 176 164 176 M236 158 C250 170 256 176 256 176"/><path class="ink" d="M164 176 H196 M224 176 H256"/><circle cx="210" cy="176" r="12" class="meter"/><text x="210" y="181" text-anchor="middle" class=b>G</text><rect x="79" y="20" width="22" height="56" rx="0" class="mag"/><path class="ink" d="M79 48 H101"/><text x="90" y="40" text-anchor="middle" class=b>S</text><text x="90" y="68" text-anchor="middle" class=b>N</text><path class="ln" d="M112 30 L112.0 67.8"/><polygon class="hd1" points="112.0,72.0 115.8,65.0 108.2,65.0"/><rect x="199" y="20" width="22" height="56" rx="0" class="mag"/><path class="ink" d="M199 48 H221"/><text x="210" y="40" text-anchor="middle" class=b>N</text><text x="210" y="68" text-anchor="middle" class=b>S</text><path class="ln" d="M232 30 L232.0 67.8"/><polygon class="hd1" points="232.0,72.0 235.8,65.0 228.2,65.0"/><text x="90" y="14" text-anchor="middle">N 極向下</text><text x="210" y="14" text-anchor="middle">N 極向上</text></svg>',cap:"磁鐵由同高度落下穿過線圈"},{id:"p33",t:"past",u:11,y:113,n:16,q:"汽車輪胎上有一個測量裝置，單位是 psi，1 psi＝1 磅力／平方英寸，其中磅力是力的單位、英寸是長度的單位。此裝置最可能量測輪胎的哪一項物理量？",o:["每秒轉動次數","胎內的氣體壓力","施於地面的推力","與地面間的摩擦力"],a:1,e:"psi＝磅力÷平方英寸＝「力÷面積」，力除以面積就是壓力，所以它量的是輪胎裡的氣體壓力（胎壓）。轉動次數單位是次/秒，推力和摩擦力是「力」，單位不會除以面積。"},{id:"p34",t:"past",u:8,y:113,n:17,adapt:true,q:"實驗一發現：鹽酸越濃（pH 越低），豬牙齒浸泡後重量減少的百分比越多。實驗二將豬牙齒泡在甲、乙、丙三杯飲料（pH 介於 2～4），重量減少百分比為丙＜甲＜乙。若只考慮 pH 值的影響，下列推測何者最合理？",o:["乙杯最酸，其 pH 值最大","乙杯最酸，其 pH 值最小","丙杯最酸，其 pH 值最大","丙杯最酸，其 pH 值最小"],a:1,e:"實驗一告訴我們：越酸（pH 越小）牙齒溶掉越多。三杯中乙減少最多，所以乙最酸；越酸 pH 越小，所以乙的 pH 最小。丙減少最少，是最不酸的。"},{id:"p35",t:"past",u:2,y:113,n:18,adapt:true,q:"報導指出：重力波是時空的漣漪，傳遞時「不需要介質」。下列有關重力波的敘述，何者最合理？",o:["與水波一樣都屬於力學波","與電磁波一樣都屬於力學波","與光波一樣都不屬於力學波","與超聲波一樣都不屬於力學波"],a:2,e:"力學波（水波、聲波、超聲波）需要介質傳播；不需要介質的像光（電磁波）就不是力學波。"},{id:"p36",t:"past",u:7,y:113,n:23,q:"報導：「金屬多以氧化物形式封藏於礦物中，可利用氫和氧易起反應的特性，將氧從礦物中移除，留下純金屬和水。」關於此反應，下列何者最合理？",o:["因為氫被氧化，所以是氧化還原反應","因為礦物被氧化，所以是氧化還原反應","因為金屬氧化物溶於水呈酸性，所以是酸鹼中和","因為金屬氧化物溶於水呈鹼性，所以是酸鹼中和"],a:0,e:"氫搶走氧變成水（被氧化），金屬氧化物失去氧變成金屬（被還原），是氧化還原反應。"},{id:"p37",t:"past",u:15,y:113,n:26,q:"一顆裝在絕緣支架上的金屬球，以感應起電的方式使其帶正電。接著用手輕觸金屬球使其接地，金屬球的帶電情形及原因最可能為何？",o:["不帶電，因地球的電子經由手流向金屬球","不帶電，因金屬球的正電荷經由手流至地球","帶正電，感應起電後再接地，電性不受影響","帶負電，地球的電子流向金屬球使負電荷多於正電荷"],a:0,e:"能移動的只有電子。帶正電的球缺電子，接地後電子從地球經手流入，補到電中性為止。"},{id:"p38",t:"past",u:4,y:113,n:27,adapt:true,q:"在一大氣壓下加熱 100 g 冰塊，溫度–時間圖中，在 t₁～t₂ 期間溫度維持 T₁ 不變，t₂ 之後溫度開始上升。下列何者正確？",o:["T₁ 的數值為 0℃","t₁ 可以表示冰塊的熔點","時間大於 t₂ 時，燒杯中的水只會以氣態存在","t₁～t₂ 期間水以固體與氣體共存"],a:0,e:"平台代表冰在熔化，一大氣壓下冰的熔點是 0℃。熔點是溫度不是時間；t₂ 後是液態水升溫；平台是固液共存。",fig:'<svg viewBox="0 0 300 194" role="img" aria-label="題目附圖"><path class="ax" d="M40 18 V160 H285"/><path class="ln" d="M40 140 L100 100 H190 L270 30"/><path class="gr" d="M40 100 H100 M100 160 V100 M190 160 V100"/><text x="32" y="104" text-anchor="end">T₁</text><text x="100" y="175" text-anchor="middle">t₁</text><text x="190" y="175" text-anchor="middle">t₂</text><text x="294" y="190" text-anchor="end">時間</text><text x="8" y="12" text-anchor="start">溫度</text></svg>',cap:"100 g 冰塊的溫度–時間圖"},{id:"p39",t:"past",u:2,y:114,n:1,q:"孕婦產檢時常用超聲波（超音波）檢查胎兒。醫生使用超聲波時，孕婦的聽覺感受何者最合理？",o:["孕婦會聽見低沉的轟隆聲","孕婦會聽見尖銳刺耳的聲音","因頻率過高，孕婦聽不見超聲波","因波速過快，孕婦聽不見超聲波"],a:2,e:"超聲波頻率超過 20000 Hz，超出人耳可聽範圍，所以聽不見。聽不見跟波速無關。"},{id:"p40",t:"past",u:5,y:114,n:4,adapt:true,q:"小志舉例：元素—硫磺（S）；化合物—笑氣（N₂O）；混合物—花岡岩（由多種礦物組成）。比較各例子所含「原子種類」的多寡，下列何者正確？",o:["笑氣＞硫磺","硫磺＞笑氣","硫磺＞花岡岩","三個例子都一樣多"],a:0,e:"硫磺只有 S 一種原子；笑氣有 N、O 兩種；花岡岩由多種礦物組成，原子種類更多。所以笑氣＞硫磺。"},{id:"p41",t:"past",u:13,y:114,n:9,q:"鉛筆平放在桌上，兩手指在兩端施水平力使其保持靜止。手指施於左右兩端的力為 F左、F右，鉛筆施於手指的反作用力為 F左′、F右′。已知 F左＝1 N，不考慮摩擦力，下列何者正確？",o:["F右′＜F右＜1 N","F右′＜F右＝1 N","F右′＝F右＜1 N","F右′＝F右＝1 N"],a:3,e:"鉛筆靜止 → 合力為 0 → F右＝F左＝1 N；作用力與反作用力大小相等 → F右′＝F右＝1 N。"},{id:"p42",t:"past",u:15,y:114,n:10,q:"甲球帶負電，乙、丙兩球帶正電，排成一直線（乙在中間）。原本乙距甲 2 m、距丙 1 m；把乙向甲移動 1 m 後，乙距甲 1 m、距丙 2 m。移動前後甲乙間靜電力 F甲乙、乙丙間靜電力 F乙丙 如何變化？",o:["F甲乙 變大，F乙丙 變大","F甲乙 變大，F乙丙 變小","F甲乙 變小，F乙丙 變大","F甲乙 變小，F乙丙 變小"],a:1,e:"電量不變時距離越近靜電力越大。乙靠近甲、遠離丙，所以 F甲乙 變大、F乙丙 變小。"},{id:"p43",t:"past",u:1,y:114,n:11,q:"遊戲卡塗上非常苦的苯甲地那銨，濃度只要達到＿＿＿，也就是每 1000 g 溶液中含有 30 mg，就會苦到難以忍受。空格最適合填入何者？",o:["30%","30 mg","30 ppm","30 g/cm³"],a:2,e:"30 mg ÷ 1000 g ＝ 30 mg ÷ 1,000,000 mg ＝ 30×10⁻⁶ ＝ 30 ppm。"},{id:"p44",t:"past",u:3,y:114,n:14,q:"三顆小球在紅光照射下，分別呈現紅色、紅色、黑色。關於這三顆小球在白光照射下的顏色，下列推論何者最合理？",o:["至少有一顆紅球","至少有一顆黑球","最多有兩顆白球","最多有兩顆綠球"],a:2,e:"紅光下看起來紅色的球，能反射紅光，可能是紅球或白球；紅光下黑色的球不反射紅光，可能是黑、綠、藍等。所以白球最多兩顆。"},{id:"p45",t:"past",u:5,y:114,n:17,adapt:true,q:"Ca 和 Cl 的原子序分別為 20、17。Ca²⁺ 的質子數為 w、電子數為 y；Cl⁻ 的質子數為 x、電子數為 z。下列比較何者正確？",o:["w＞z","x＞y","x＞z","y＞w"],a:0,e:"w＝20、x＝17；Ca²⁺ 少 2 個電子 y＝18；Cl⁻ 多 1 個電子 z＝18。所以 w（20）＞z（18）。"},{id:"p46",t:"past",u:11,y:114,n:18,adapt:true,q:"2 kg 木塊靜置於水平桌面，施水平向東外力 F。摩擦力 f 與 F 的關係為：F 從 0 增加到 400 gw 之前，f＝F；F 超過 400 gw 後，f 固定為 300 gw。下列敘述何者正確？",o:["最大靜摩擦力為 300 gw","F 由 0 增加至 300 gw 時，木塊即開始向東運動","若 F 小於 400 gw，則 F 越小，靜摩擦力也越小","若 F 大於 400 gw，則 F 越大，動摩擦力也越大"],a:2,e:"最大靜摩擦力是 400 gw；未動時靜摩擦力＝外力，所以外力越小靜摩擦越小；動摩擦力固定 300 gw，跟外力大小無關。",fig:'<svg viewBox="0 0 300 194" role="img" aria-label="題目附圖"><path class="ax" d="M40 18 V160 H285"/><path class="ln" d="M40 160 L200.0 40.0"/><path class="gr" d="M200.0 40.0 V70.0"/><path class="ln" d="M200.0 70.0 H280.0"/><circle cx="200.0" cy="40.0" r="3.5" class="dot"/><path class="gr" d="M40 40.0 H200.0 M40 70.0 H200.0 M200.0 160 V70.0"/><text x="32" y="44.0" text-anchor="end">400</text><text x="32" y="74.0" text-anchor="end">300</text><text x="200.0" y="175" text-anchor="middle">400</text><text x="294" y="190" text-anchor="end">外力 F (gw)</text><text x="8" y="12" text-anchor="start">摩擦力 f (gw)</text></svg>',cap:"摩擦力與外力的關係"},{id:"p47",t:"past",u:8,y:114,n:19,q:"將發電廠的二氧化碳灌入水中成為氣泡水，再高壓注入地下岩層，與鈣、鎂等離子反應而「固化」。這是利用二氧化碳（水溶液）的何種性質？",o:["密度大於空氣","溶於水呈酸性","可與鈣離子反應產生難溶於水的碳酸鹽","可與鈉離子反應產生易溶於水的碳酸鹽"],a:2,e:"CO₂ 溶於水形成碳酸，和 Ca²⁺ 生成難溶的碳酸鈣（就是石灰岩的成分），所以能「固化」在岩石中。"},{id:"p48",t:"past",u:4,y:114,n:26,q:"阿偉想比較鋁和銅的比熱大小，加熱條件相同且忽略熱量散失，下列哪一種方式最合理？",o:["加熱相同體積的鋁和銅，先開始熔化者比熱較小","加熱相同體積的鋁和銅，溫度上升較快者比熱較小","加熱相同質量的鋁和銅，先開始熔化者比熱較小","加熱相同質量的鋁和銅，溫度上升較快者比熱較小"],a:3,e:"H＝m·s·ΔT，比較比熱要控制質量相同、吸熱相同，溫度上升越快（ΔT 越大）比熱越小。熔化先後和熔點有關，不是比熱。"},{id:"p49",t:"past",u:13,y:114,n:39,adapt:true,q:"一質量固定的物體向東做直線運動：0～4 s 速度由 0 均勻增加到 16 m/s；4～6 s 維持 16 m/s；6～10 s 速度由 16 m/s 均勻減為 0。在 t＝2 s、5 s、7 s 時所受合力大小為 F₂、F₅、F₇，大小關係為何？",o:["F₂＜F₇＜F₅","F₂＞F₇＞F₅","F₂＝F₇＞F₅","F₂＝F₇＜F₅"],a:2,e:"加速度大小：0～4 s 為 4 m/s²，4～6 s 為 0，6～10 s 為 4 m/s²（反向）。F＝ma，所以 F₂＝F₇＞F₅＝0。",fig:'<svg viewBox="0 0 300 194" role="img" aria-label="題目附圖"><path class="ax" d="M40 18 V160 H285"/><path class="ln" d="M40 160 L136 48 H184 L280 160"/><path class="gr" d="M40 48 H136 M136 160 V48 M184 160 V48"/><text x="32" y="52" text-anchor="end">16</text><text x="88" y="175" text-anchor="middle">2</text><text x="136" y="175" text-anchor="middle">4</text><text x="160" y="175" text-anchor="middle">5</text><text x="184" y="175" text-anchor="middle">6</text><text x="208" y="175" text-anchor="middle">7</text><text x="280" y="175" text-anchor="middle">10</text><circle cx="88" cy="104" r="3" class="dot"/><circle cx="160" cy="48" r="3" class="dot"/><circle cx="208" cy="76" r="3" class="dot"/><text x="294" y="190" text-anchor="end">時間 t (s)</text><text x="8" y="12" text-anchor="start">速度 v (m/s)</text></svg>',cap:"物體的速度–時間圖"},{id:"p50",t:"past",u:4,y:114,n:40,q:"燒瓶中的水加熱沸騰後停止加熱，塞住瓶口倒置，把冰塊放在燒瓶上方，瓶內的水又開始冒泡沸騰（物理變化）。關於此現象的解釋何者最合理？",o:["瓶內水蒸氣凝結，接著藉由水汽化達到新的平衡","瓶內水蒸氣蒸發，接著藉由水汽化達到新的平衡","瓶內氣壓降低，接著藉由水分解產生氣體達到新的平衡","瓶內氣壓升高，接著藉由水分解產生氣體達到新的平衡"],a:0,e:"冰塊使瓶內水蒸氣凝結，氣壓下降，沸點跟著降低，水又沸騰汽化來補充水蒸氣。沒有發生水的分解。"},{id:"p51",t:"past",u:16,y:114,n:42,q:"自行車選手踩單車發電烤吐司，平均電功率約 700 W，總共產生電能約 0.021 kWh。若一度電 3 元，產生的電能對應電費應如何計算？",o:["700÷1000×3 元","0.021×3 元","0.021×700÷1000×3 元","0.021×1000÷700×3 元"],a:1,e:"1 度＝1 kWh，電能已經是 0.021 kWh＝0.021 度，電費＝0.021×3 元。功率是干擾資訊。"},{id:"p52",t:"past",u:14,y:114,n:47,adapt:true,q:"阿貴用動滑輪舉起 200 g 砝碼，施鉛直向上的定力，使彈簧秤以穩定緩慢的速度提高 10 cm，砝碼上升 5 cm，此時彈簧秤讀數為 150 gw。此過程彈簧秤拉力所作的功為多少 gw·cm？",o:["1000","1500","2000","3000"],a:1,e:"拉力作功＝拉力 × 拉力移動距離＝150 gw × 10 cm＝1500 gw·cm。拉力比 100 gw 大，是因為動滑輪本身也有重量。",fig:'<svg viewBox="0 0 300 180" role="img" aria-label="題目附圖"><path class="ink" d="M30 16 H130"/><path class="ax" d="M38 16 l-8 -10"/><path class="ax" d="M52 16 l-8 -10"/><path class="ax" d="M66 16 l-8 -10"/><path class="ax" d="M80 16 l-8 -10"/><path class="ax" d="M94 16 l-8 -10"/><path class="ax" d="M108 16 l-8 -10"/><path class="ax" d="M122 16 l-8 -10"/><circle cx="130" cy="110" r="22" class="bg"/><circle cx="130" cy="110" r="3" class="dot"/><path class="ink" d="M108 110 V16"/><path class="ink" d="M152 110 V92"/><rect x="144" y="52" width="16" height="40" rx="3" class="bg"/><path class="ax" d="M146 58 H158"/><path class="ax" d="M146 64 H158"/><path class="ax" d="M146 70 H158"/><path class="ax" d="M146 76 H158"/><path class="ax" d="M146 82 H158"/><path class="ax" d="M146 88 H158"/><path class="ink" d="M152 52 V40"/><path class="ln" d="M152 40 L152.0 14.8"/><polygon class="hd1" points="152.0,10.0 147.6,18.0 156.4,18.0"/><text x="162" y="24" text-anchor="start">手施力</text><text x="166" y="76" text-anchor="start">彈簧秤</text><path class="ink" d="M130 110 V138"/><rect x="108" y="138" width="44" height="30" rx="0" class="box"/><text x="130" y="158" text-anchor="middle" class=b>200 g</text></svg>',cap:"動滑輪裝置"},{id:"p53",t:"past",u:5,y:115,n:2,q:"某物質：史前時代就透過採礦、冶煉取得製造器具；自然界中多以化合物形式存在；具有良好的導電性、導熱性和延展性，可拉成細絲、製成薄箔，電線多以它為原料。「它」應屬於何種物質？",o:["化合物","聚合物","金屬元素","非金屬元素"],a:2,e:"會導電、導熱，有延展性（可拉成細絲、打成薄片），這三個都是金屬的特性，例子就是做電線的銅。銅是一種元素，所以是「金屬元素」，不是化合物、聚合物或非金屬。"},{id:"p54",t:"past",u:5,y:115,n:3,q:"鈍氣又稱惰性氣體，指氦、氖、氬等週期表第 18 族元素。這些元素具有何種性質？",o:["熔點均高於室溫","有相似的化學性質","有相似的物理性質","均由雙原子所組成"],a:1,e:"同一族的元素化學性質相似。鈍氣常溫都是氣體（熔點很低），以單原子分子存在。"},{id:"p55",t:"past",u:15,y:115,n:7,adapt:true,q:"燈泡甲、乙並聯接在電池上。毫安培計 A₁ 接在從電池流出的幹路，A₂ 與燈泡乙串聯，A₃ 接在流回電池的幹路。已知 A₁ 讀數 500 mA、A₂ 讀數 300 mA，A₃ 的讀數最接近何者？",o:["200 mA","500 mA","800 mA","1000 mA"],a:1,e:"A₁ 和 A₃ 都在幹路上，測的都是總電流，大小相同為 500 mA。（流過燈泡甲的是 500−300＝200 mA）",fig:'<svg viewBox="0 0 300 178" role="img" aria-label="題目附圖"><path class="ink" d="M40 40 V91 M40 109 V160 H260 V40 H40 M110 40 V100 H260"/><rect x="26" y="91" width="28" height="18" style="fill:var(--sheet)"/><path class="ink" d="M27 95 H53"/><path class="ink" d="M33 105 H47"/><path d="M33 105 H47" style="stroke:var(--ink);stroke-width:4"/><text x="58" y="98" text-anchor="start">＋</text><text x="58" y="114" text-anchor="start">－</text><circle cx="75" cy="40" r="12" class="meter"/><text x="75" y="45" text-anchor="middle" class=b>A₁</text><circle cx="190" cy="40" r="12" class="bg"/><path class="ink" d="M182 32 L198 48 M198 32 L182 48"/><text x="190" y="22" text-anchor="middle" class=b>甲</text><circle cx="150" cy="100" r="12" class="meter"/><text x="150" y="105" text-anchor="middle" class=b>A₂</text><circle cx="215" cy="100" r="12" class="bg"/><path class="ink" d="M207 92 L223 108 M223 92 L207 108"/><text x="215" y="82" text-anchor="middle" class=b>乙</text><circle cx="150" cy="160" r="12" class="meter"/><text x="150" y="165" text-anchor="middle" class=b>A₃</text><path class="ln" d="M90 30 L102.4 30.0"/><polygon class="hd1" points="106.0,30.0 100.0,26.7 100.0,33.3"/><text x="98" y="22" text-anchor="middle">電流</text></svg>',cap:"電路接法示意圖（電流由電池正極流出）"},{id:"p56",t:"past",u:4,y:115,n:9,q:"冬季轉春季、濕度大時，若室內溫度比室外低，空氣吹入室內容易在磁磚牆面形成水珠（返潮）。下列說明何者最合理？",o:["空氣內的水分遇到較高溫的牆面凝結而形成","空氣內的水分遇到較高溫的牆面汽化而形成","空氣內的水分遇到較低溫的牆面凝結而形成","空氣內的水分遇到較低溫的牆面汽化而形成"],a:2,e:"室外暖濕空氣吹進來，碰到比較冷的磁磚牆，空氣裡的水蒸氣遇冷「凝結」成小水珠（跟冰飲料杯外面出水一樣）。汽化是液體變氣體，方向相反；牆面是冷的不是熱的。"},{id:"p57",t:"past",u:9,y:115,n:12,adapt:true,q:"探討鹼的濃度對皂化反應的影響：四份 30 g 椰子油各加入不同濃度的氫氧化鈉，邊加熱邊攪拌到出現黏稠狀就停止，再測量產物質量。從此實驗結果，能否知道鹼的濃度與反應速率的關係？",o:["可以，鹼的濃度加倍，反應速率變快為四倍","可以，鹼的濃度增加，反應速率先增後微降","不行，因為本實驗所使用鹼的濃度並不相同","不行，因為實驗並未記錄各組反應所需的時間"],a:3,e:"反應速率要看「多快」，需要記錄時間。本實驗只量產物質量，沒有記錄時間，無法判斷速率。"},{id:"p58",t:"past",u:2,y:115,n:16,q:"小忠被室友打鼾聲吵得睡不著，向室友抱怨「很大聲」。下列哪一句話最符合他想呈現的問題？",o:["你發出 70 dB 的打鼾聲","你發出 250 Hz 的打鼾聲","你發出的打鼾聲每秒傳播 340 m","你發出的打鼾聲振動一次只要 0.004 秒"],a:0,e:"大聲是響度，單位是分貝（dB）。Hz 和週期描述的是音調，340 m/s 是聲速。"},{id:"p59",t:"past",u:1,y:115,n:18,q:"將物品放入量筒，由放入前後的液面刻度差得知物品體積。下列何者適合用此方法測體積？",o:["銅片","鉀塊","0.5 公克食鹽","0.5 公克葡萄糖"],a:0,e:"排水法的待測物要不溶於水、不與水反應。鉀會與水劇烈反應；食鹽、葡萄糖會溶於水。"},{id:"p60",t:"past",u:6,y:115,n:19,q:"燃燒 1 公噸甲烷（CH₄）會產生數公噸二氧化碳。若要算出二氧化碳排放量的實際值，需要甲烷和二氧化碳的哪一項資訊？",o:["沸點","密度","比熱","分子量"],a:3,e:"CH₄＋2O₂ → CO₂＋2H₂O。由質量換成莫耳數要用分子量，再用係數比換成 CO₂ 的莫耳數，最後乘 CO₂ 的分子量。"},{id:"p61",t:"past",u:16,y:115,n:28,q:"延長線包裝上寫著「勿超載」，延長線的壓鈕功能等同無熔絲開關。此處的超載最可能是指什麼？",o:["流經電器的電流值超過電器可負荷的最大電流","輸入電器的電壓值超過電器可負荷的最大電壓","流經延長線的電流值超過延長線可負荷的最大電流","輸入延長線的電壓值超過延長線可負荷的最大電壓"],a:2,e:"延長線上接太多電器（並聯），總電流變大，超過延長線能承受的電流，無熔絲開關就會跳開。"},{id:"p62",t:"past",u:11,y:115,n:32,adapt:true,q:"一個密度均勻的長方體木塊，長 30 cm、寬 20 cm、高 10 cm，以 30×20 的面平放在桌面，對桌面的壓力為 P。依序截去部分後，木塊變成長 20 cm、寬 10 cm、高 8 cm，仍以長×寬的面平放。此時對桌面的壓力為何？",o:["4P/15","4P/5","P","3P"],a:1,e:"壓力＝重量÷面積＝密度×高（對直立柱體而言）。原本 P ∝ 10，後來 ∝ 8，所以變成 8/10＝4/5 P。也可以算：6000D÷600＝10D，1600D÷200＝8D。",fig:'<svg viewBox="0 0 300 178" role="img" aria-label="題目附圖"><path class="ink" d="M10 150 H290"/><path class="box" d="M24 120 h105 v30 h-105 Z"/><path class="lay3" d="M24 120 l24.0 -18.0 h105 l-24.0 18.0 Z"/><path class="lay2" d="M129 120 l24.0 -18.0 v30 l-24.0 18.0 Z"/><text x="88.5" y="170" text-anchor="middle">截切前 30×20×10</text><path class="box" d="M186 124 h70 v26 h-70 Z"/><path class="lay3" d="M186 124 l13.2 -9.9 h70 l-13.2 9.9 Z"/><path class="lay2" d="M256 124 l13.2 -9.9 v26 l-13.2 9.9 Z"/><text x="227.6" y="170" text-anchor="middle">截切後 20×10×8</text><text x="76" y="140" text-anchor="middle">30</text><text x="220" y="141" text-anchor="middle">20</text></svg>',cap:"長×寬的面朝下平放（單位：cm）"},{id:"p63",t:"past",u:1,y:115,n:36,q:"取 20 g 蔗糖放入 20 g 水中得到甲杯，取 30 g 蔗糖放入 20 g 水中得到乙杯，蔗糖均完全溶解。甲、乙兩杯的重量百分率濃度比是多少？",o:["1：1","2：3","4：5","5：6"],a:3,e:"甲＝20÷(20+20)＝50%；乙＝30÷(30+20)＝60%。50：60＝5：6。分母是溶液，不是水！"},{id:"p64",t:"past",u:8,y:115,n:40,q:"1.0 M 氫氧化鈉水溶液（含廣用指示劑）中持續滴入 1.0 M 鹽酸，直到呈中性停止。比較滴入前與停止時燒杯中的鈉離子濃度，下列何者最合理？",o:["因為溶液體積增加，所以鈉離子濃度減少","因為鈉離子數目沒有改變，所以鈉離子濃度不變","因為鈉離子質量沒有改變，所以鈉離子濃度不變","因為中和形成鹽類析出，所以鈉離子濃度減少"],a:0,e:"NaCl 在水中仍解離，Na⁺ 數目不變；但加入鹽酸使體積變大，濃度＝數量÷體積，所以濃度下降。"},{id:"p65",t:"past",u:13,y:115,n:41,adapt:true,q:"三個相同的小球分別受到鉛直向上的外力 F甲、F乙、F丙：甲靜止不動、乙等速上升、丙向上運動但越來越慢。不考慮空氣阻力，三個外力的大小關係為何？",o:["F甲＝F乙＜F丙","F甲＝F乙＞F丙","F乙＞F甲＞F丙","F乙＞F丙＞F甲"],a:1,e:"靜止與等速都是合力為 0 → F＝重量；丙向上減速，加速度向下，合力向下 → F丙＜重量。"},{id:"p66",t:"past",u:12,y:115,n:46,q:"科學家想觀察水滴以不同速度衝擊石英板的變化（水滴由靜止從針頭落下），若不考慮空氣阻力，調整哪一項實驗條件最合理？",o:["調整水滴溫度，以改變水滴密度","調整針頭孔徑，以改變水滴直徑與重量","調整針頭高度，以改變水滴落下的垂直距離","調整攝影機每秒拍攝張數"],a:2,e:"自由落體的末速只跟落下高度有關（與質量無關），落得越高撞擊速度越快。"},{id:"p67",t:"past",u:6,y:115,n:48,adapt:true,q:"實驗需要在兩支針筒內分別通入氧氣（O₂）和二氧化碳（CO₂），依序可使用下列何種反應來製備？",o:["鹽酸和鎂帶反應、雙氧水分解反應","鹽酸和鎂帶反應、鹽酸和碳酸鈣反應","雙氧水分解反應、鹽酸和鎂帶反應","雙氧水分解反應、鹽酸和碳酸鈣反應"],a:3,e:"雙氧水分解產生 O₂；鹽酸＋碳酸鈣產生 CO₂；鹽酸＋鎂帶產生的是 H₂。"},{id:"p68",t:"past",u:10,y:112,n:11,adapt:true,q:"製作肥皂的步驟：將椰子油、酒精與氫氧化鈉水溶液混合，加熱並攪拌，再加入水，最後倒入飽和食鹽水。關於此實驗，下列說明何者正確？",o:["椰子油、酒精、氫氧化鈉都是反應物","加熱與攪拌是為了避免反應速率過快","加入的水是催化劑","加入飽和食鹽水是為了分離不同的生成物"],a:3,e:"皂化：油脂＋鹼 → 肥皂＋甘油。酒精只是幫助混合；加熱攪拌是加快反應；加飽和食鹽水使肥皂析出浮起，與甘油分離（鹽析）。"},{id:"p69",t:"past",u:17,y:114,n:31,adapt:true,q:"一條南北向放置的長直導線通以由南向北的電流，磁針放在導線的正上方。磁針 N 極會往哪個方向偏轉？",o:["向東","向西","向南","不偏轉"],a:0,e:"安培右手定則：拇指指北（電流方向），四指環繞方向就是磁場。導線正上方的磁場向東，所以 N 極偏向東。若磁針在導線下方則偏西。",fig:'<svg viewBox="0 0 300 196" role="img" aria-label="題目附圖"><path class="ink" d="M120 12 V178"/><path d="M120 12 V178" style="stroke:var(--accent);stroke-width:5;opacity:.35"/><path class="ln" d="M108 176 L108.0 140.8"/><polygon class="hd1" points="108.0,136.0 103.6,144.0 112.4,144.0"/><text x="102" y="162" text-anchor="end">電流</text><circle cx="120" cy="95" r="30" class="bg"/><polygon points="120,70 127,95 113,95" class="hd2"/><polygon points="120,120 127,95 113,95" style="fill:var(--sheet);stroke:var(--ink);stroke-width:1"/><text x="120" y="190" text-anchor="middle">南</text><text x="160" y="90" text-anchor="start">磁針在導線正上方</text><path class="ink" d="M250 150 L250.0 124.2"/><polygon class="hd0" points="250.0,120.0 246.2,127.0 253.8,127.0"/><text x="250" y="112" text-anchor="middle" class=b>北</text><text x="250" y="168" text-anchor="middle">南</text><text x="272" y="154" text-anchor="start">東</text><text x="220" y="154" text-anchor="start">西</text><path class="ax" d="M235 150 H265"/></svg>',cap:"俯視圖：導線南北向，電流由南向北"},{id:"m0",t:"mine",u:1,q:"質量 54 g 的金屬塊放入裝有 30 mL 水的量筒中，金屬塊完全沉入，水面升到 50 mL。此金屬的密度為多少？",o:["1.08 g/cm³","1.8 g/cm³","2.7 g/cm³","5.4 g/cm³"],a:2,e:"體積＝50−30＝20 cm³，密度＝54÷20＝2.7 g/cm³（就是鋁的密度）。"},{id:"m1",t:"mine",u:1,q:"一個密度 0.8 g/cm³ 的木塊放入水中（水密度 1 g/cm³），靜止時露出水面的體積占木塊總體積的多少？",o:["20%","80%","0%","40%"],a:0,e:"浮體浸入水中的體積比例＝物體密度÷液體密度＝0.8，也就是 80% 在水下，露出 20%。"},{id:"m2",t:"mine",u:1,q:"把 200 g 濃度 20% 的食鹽水加入 200 g 的水，稀釋後的重量百分濃度為何？",o:["20%","10%","5%","40%"],a:1,e:"溶質＝200×20%＝40 g，稀釋時溶質不變。新溶液＝400 g，濃度＝40÷400＝10%。"},{id:"m3",t:"mine",u:1,q:"某固體在 60℃ 時溶解度為 110 g／100 g 水，20℃ 時為 32 g／100 g 水。將 60℃ 的飽和溶液 210 g 降溫至 20℃，會析出多少克固體？",o:["32 g","78 g","110 g","142 g"],a:1,e:"210 g 飽和溶液＝100 g 水＋110 g 溶質。降到 20℃ 只能溶 32 g，析出 110−32＝78 g。"},{id:"m4",t:"mine",u:1,q:"想從海水中得到純水，最適合的方法為何？",o:["過濾","蒸餾","層析","傾析"],a:1,e:"鹽溶在水裡，過濾濾不掉。蒸餾利用沸點不同，把水汽化後再冷凝收集，就能得到純水。"},{id:"m5",t:"mine",u:1,q:"小美想探討「水溫對糖溶解快慢的影響」，下列哪一項應該是操縱變因？",o:["糖的質量","水的體積","水的溫度","攪拌的速度"],a:2,e:"想知道「誰的影響」，那個就是操縱變因（水溫）；溶解所需時間是應變變因；其他像糖量、水量、攪拌都要控制相同。"},{id:"m6",t:"mine",u:2,q:"一列繩波的頻率為 5 Hz，波長為 40 cm，此繩波的波速為何？",o:["8 cm/s","45 cm/s","200 cm/s","0.125 cm/s"],a:2,e:"波速公式：v＝f×λ（頻率×波長）。v＝5 Hz×40 cm＝200 cm/s。錯誤選項是把數字相除或相加（40÷5＝8、5＋40＝45），要記得是「相乘」。"},{id:"m7",t:"mine",u:2,q:"小明對著山谷大喊，3 秒後聽到回聲。若聲速為 340 m/s，小明與山谷的距離約為何？",o:["1020 m","510 m","340 m","113 m"],a:1,e:"聲音來回走了 340×3＝1020 m，單程距離是一半：510 m。"},{id:"m8",t:"mine",u:2,q:"把吉他的弦調得更緊，再用相同力量撥弦，聲音會有什麼變化？",o:["響度變大","音調變高","音色改變","聲速變快"],a:1,e:"弦越緊、越短、越細，振動頻率越高，音調越高。響度看振幅，音色看波形。"},{id:"m9",t:"mine",u:2,q:"關於聲波的敘述，下列何者正確？",o:["聲波是橫波","聲波可以在真空中傳播","聲波在固體中的傳播速率通常比在空氣中快","溫度越低，聲波在空氣中傳播越快"],a:2,e:"聲波是縱波，需要介質，真空不能傳。一般傳播速率：固體＞液體＞氣體；氣溫越高聲速越快。"},{id:"m10",t:"mine",u:3,q:"一道光射向平面鏡，入射光與「鏡面」的夾角為 30°，則反射角為多少？",o:["30°","60°","90°","120°"],a:1,e:"入射角是光線與「法線」的夾角＝90°−30°＝60°，反射角＝入射角＝60°。"},{id:"m11",t:"mine",u:3,q:"小華站在平面鏡前 2 m，接著向鏡子走近 0.5 m。此時小華和他的像相距多少？",o:["1.5 m","3 m","4 m","2.5 m"],a:1,e:"走近後距鏡 1.5 m，像也在鏡後 1.5 m，人與像相距 3 m。"},{id:"m12",t:"mine",u:3,q:"凸透鏡焦距 10 cm，把物體放在透鏡前 5 cm 處，從另一側透過透鏡看，會看到什麼樣的像？",o:["正立、放大的虛像","倒立、放大的實像","倒立、縮小的實像","正立、縮小的實像"],a:0,e:"物體在焦點以內（5 cm＜10 cm），光線經透鏡後還是散開，不會在屏幕上成像，但從另一側看會看到正立、放大的虛像，這就是放大鏡的原理。物體在 f 與 2f 之間才是倒立放大實像。"},{id:"m13",t:"mine",u:3,q:"關於「全反射」，下列何者正確？",o:["光由空氣射入水中時容易發生","光由水射向空氣，且入射角大於臨界角時發生","只要入射角大於 45° 就一定發生","全反射時有一部分光會折射出去"],a:1,e:"全反射的兩個條件：光從光密介質（水、玻璃）射向光疏介質（空氣），而且入射角大於臨界角。光纖就是利用全反射。"},{id:"m14",t:"mine",u:3,q:"汽車的後照鏡和路口轉彎處的反光鏡常用凸面鏡，主要原因為何？",o:["成正立放大的像","成倒立的實像","可以看到較大的範圍","可以聚集光線"],a:2,e:"凸面鏡會讓光線發散，成「正立、縮小的虛像」，因為像縮小了，鏡子裡可以裝進更大的範圍，視野變大。凸面鏡不會成放大像或實像；能聚集光線的是凹面鏡。"},{id:"m15",t:"mine",u:4,q:"25℃ 換算成華氏溫度是多少？",o:["45℉","57℉","77℉","81℉"],a:2,e:"攝氏換華氏：℉＝℃×9/5＋32。25×9/5＝45，45＋32＝77℉。選 45℉ 是忘了加 32；57℉ 是直接 25＋32。"},{id:"m16",t:"mine",u:4,q:"將 500 g 的水由 20℃ 加熱到 60℃，需要吸收多少熱量？（水的比熱 1 cal/g℃）",o:["2000 cal","10000 cal","20000 cal","30000 cal"],a:2,e:"熱量公式 H＝m×s×ΔT。質量 m＝500 g，水比熱 s＝1，溫度變化 ΔT＝60−20＝40℃。H＝500×1×40＝20000 cal。注意 ΔT 要用「升高多少度」，不是末溫 60。"},{id:"m17",t:"mine",u:4,q:"100 g、80℃ 的水和 300 g、20℃ 的水混合，若沒有熱量散失，最後的溫度為何？",o:["35℃","50℃","40℃","30℃"],a:0,e:"熱水放熱＝冷水吸熱：100×(80−T)＝300×(T−20) → 8000−100T＝300T−6000 → T＝35℃。混合溫度會偏向質量大的那杯。"},{id:"m18",t:"mine",u:4,q:"保溫瓶做成雙層玻璃、中間抽成真空，主要是為了減少哪些熱的傳播方式？",o:["傳導和對流","對流和輻射","只有輻射","傳導和輻射"],a:0,e:"真空沒有物質，熱無法傳導也無法對流；玻璃鍍銀是為了反射、減少輻射。"},{id:"m19",t:"mine",u:4,q:"把 0℃ 的冰持續加熱變成 0℃ 的水，這段期間的說明何者正確？",o:["溫度上升，因為吸熱","溫度不變，吸收的熱用來改變狀態","溫度不變，因為沒有吸熱","溫度下降，因為熔化會放熱"],a:1,e:"冰熔化時，雖然一直吸熱，但溫度停在 0℃ 不變，因為吸收的熱都拿去「把固體變成液體」（熔化熱）。等冰全部熔化後，溫度才會再上升。熔化是吸熱，不是放熱。"},{id:"m20",t:"mine",u:5,q:"鈉原子的原子序為 11、質量數為 23。鈉離子 Na⁺ 的質子數、中子數、電子數依序為何？",o:["11、12、11","11、12、10","12、11、10","11、23、12"],a:1,e:"質子＝原子序＝11；中子＝23−11＝12；Na⁺ 失去 1 個電子，電子＝10。"},{id:"m21",t:"mine",u:5,q:"下列哪兩種元素的化學性質最相似？",o:["鈉（Na）和鎂（Mg）","鈉（Na）和鉀（K）","鈉（Na）和氯（Cl）","鉀（K）和鈣（Ca）"],a:1,e:"週期表中「同一族（直行）」的元素化學性質最相似。鈉和鉀都在第 1 族（鹼金屬），都很活潑、會和水劇烈反應。鈉和鎂、鉀和鈣是不同族；氯是非金屬。"},{id:"m22",t:"mine",u:5,q:"下列哪一組全部都是純物質？",o:["空氣、海水","糖水、氧氣","二氧化碳、銅","汽油、蒸餾水"],a:2,e:"二氧化碳是化合物、銅是元素，都是純物質。空氣、海水、糖水、汽油都是混合物。"},{id:"m23",t:"mine",u:6,q:"88 g 的二氧化碳（CO₂，分子量 44）中含有多少個氧原子？",o:["6×10²³ 個","1.2×10²⁴ 個","2.4×10²⁴ 個","3.6×10²⁴ 個"],a:2,e:"88÷44＝2 mol CO₂，每個 CO₂ 有 2 個 O → 4 mol O，4×6×10²³＝2.4×10²⁴ 個。"},{id:"m24",t:"mine",u:6,q:"反應式 2H₂＋O₂ → 2H₂O。4 g 氫氣完全反應需要多少克氧氣？（H＝1，O＝16）",o:["8 g","16 g","32 g","64 g"],a:2,e:"4 g H₂＝2 mol，係數比 H₂：O₂＝2：1，需要 1 mol O₂＝32 g。"},{id:"m25",t:"mine",u:6,q:"平衡反應式 □C₃H₈＋□O₂ → □CO₂＋□H₂O，係數為最簡整數時，O₂ 的係數是多少？",o:["3","4","5","7"],a:2,e:"C₃H₈＋5O₂ → 3CO₂＋4H₂O。先平衡 C（3）、再 H（8÷2＝4）、最後數 O：3×2＋4＝10 → O₂ 係數 5。"},{id:"m26",t:"mine",u:6,q:"在開口燒杯中讓大理石（碳酸鈣）與鹽酸反應，反應後燒杯與內容物的總質量變少了。下列解釋何者正確？",o:["這個反應不遵守質量守恆定律","生成的二氧化碳逸散到空氣中","反應時有質量轉變成熱能","碳酸鈣溶於水後質量變小"],a:1,e:"CaCO₃＋2HCl → CaCl₂＋H₂O＋CO₂，CO₂ 氣體跑掉了，所以秤到的質量變少。若在密閉容器中，總質量不變。"},{id:"m27",t:"mine",u:6,q:"反應 N₂＋3H₂ → 2NH₃ 中，下列何者「不」等於 1：3：2？",o:["分子數比","莫耳數比","同溫同壓下的氣體體積比","質量比"],a:3,e:"係數比＝分子數比＝莫耳數比（氣體同溫同壓下也等於體積比），但不等於質量比。質量比是 28：6：34。"},{id:"m28",t:"mine",u:7,q:"把鐵釘放入藍色硫酸銅溶液，一段時間後鐵釘表面有紅色物質析出，溶液顏色變淡。下列何者正確？",o:["鐵被還原，銅離子被氧化","鐵被氧化，銅離子被還原","鐵的活性比銅小","溶液中銅離子變多"],a:1,e:"Fe＋Cu²⁺ → Fe²⁺＋Cu。鐵活性大，失去電子被氧化；Cu²⁺ 得到電子被還原成紅色的銅，溶液藍色變淡。"},{id:"m29",t:"mine",u:7,q:"金屬 X 放入 Y 的鹽類溶液中，有 Y 析出；金屬 Y 放入 Z 的鹽類溶液中，有 Z 析出。三種金屬的活性大小為何？",o:["X＞Y＞Z","Z＞Y＞X","Y＞X＞Z","X＞Z＞Y"],a:0,e:"活性大的金屬能把活性小的從化合物中置換出來：X＞Y，Y＞Z，所以 X＞Y＞Z。"},{id:"m30",t:"mine",u:7,q:"高爐煉鐵的主要反應為 Fe₂O₃＋3CO → 2Fe＋3CO₂。下列敘述何者正確？",o:["CO 是氧化劑","Fe₂O₃ 被氧化","CO 是還原劑，本身被氧化","此反應不是氧化還原反應"],a:2,e:"CO 搶走 Fe₂O₃ 的氧變成 CO₂，CO 被氧化、是還原劑；Fe₂O₃ 失去氧被還原。"},{id:"m31",t:"mine",u:7,q:"鎂帶在二氧化碳中可以繼續燃燒，生成白色氧化鎂和黑色碳粒。由此可推知什麼？",o:["碳對氧的活性比鎂大","鎂對氧的活性比碳大","二氧化碳有可燃性","此反應中碳被氧化"],a:1,e:"2Mg＋CO₂ → 2MgO＋C，鎂搶走了碳的氧，代表鎂對氧的活性比碳大；碳被還原。"},{id:"m32",t:"mine",u:8,q:"pH＝3 的溶液，其氫離子濃度是 pH＝5 溶液的幾倍？",o:["2 倍","10 倍","100 倍","1000 倍"],a:2,e:"pH 每差 1，[H⁺] 差 10 倍。差 2 → 10×10＝100 倍。"},{id:"m33",t:"mine",u:8,q:"某溶液滴入酚酞後無色，且會使藍色石蕊試紙變紅。此溶液最可能是下列何者？",o:["氨水","石灰水","醋","食鹽水"],a:2,e:"藍色石蕊變紅 → 酸性。醋是酸性；氨水、石灰水是鹼性（會讓酚酞變紅）；食鹽水中性。"},{id:"m34",t:"mine",u:8,q:"下列哪一種水溶液「不」導電？",o:["食鹽水","醋","蔗糖水","氨水"],a:2,e:"水溶液要導電，溶質必須在水中解離出「離子」。蔗糖是非電解質，溶在水裡還是蔗糖分子，沒有離子，所以不導電。食鹽、醋酸、氨水都是電解質，水溶液會導電。"},{id:"m35",t:"mine",u:8,q:"20 mL 的 0.1 M 鹽酸，需要加入多少 0.1 M 氫氧化鈉才剛好中和？",o:["10 mL","20 mL","40 mL","200 mL"],a:1,e:"HCl＋NaOH → NaCl＋H₂O，1：1 反應。H⁺ 莫耳數＝0.1×0.02＝0.002 mol，需要等量 OH⁻，0.1 M 就要 20 mL。"},{id:"m36",t:"mine",u:8,q:"把 pH＝2 的鹽酸用大量的水稀釋，稀釋後的 pH 值最可能為何？",o:["變成 1","維持 2","變大但小於 7","變成大於 7"],a:2,e:"酸被稀釋，[H⁺] 變小，pH 變大，越來越接近 7，但不會變成鹼性（不會超過 7）。"},{id:"m37",t:"mine",u:9,q:"鋅片與鹽酸反應產生氫氣，下列何種做法「無法」加快反應速率？",o:["提高溫度","把鋅片改成鋅粉","改用較濃的鹽酸","加入更多「相同濃度」的鹽酸"],a:3,e:"影響速率的是濃度、溫度、表面積、催化劑。加入相同濃度的鹽酸，濃度沒有改變，速率不變。"},{id:"m38",t:"mine",u:9,q:"鉻酸鉀溶液中存在平衡：2CrO₄²⁻（黃色）＋2H⁺ ⇌ Cr₂O₇²⁻（橙色）＋H₂O。加入鹽酸後，溶液顏色會如何變化？",o:["變得更黃","變成橙色","變成無色","顏色不變"],a:1,e:"加入 H⁺（反應物），平衡往右移，Cr₂O₇²⁻ 增加，顏色偏橙色。若加入 NaOH 消耗 H⁺，就往左變黃。"},{id:"m39",t:"mine",u:9,q:"雙氧水中加入二氧化錳，會迅速產生氧氣。反應結束後二氧化錳的質量與原本相比如何？",o:["變多","變少","不變","完全消失"],a:2,e:"MnO₂ 是催化劑，只加快反應速率，本身反應前後的質量和性質不變，也不會增加產物的總量。"},{id:"m40",t:"mine",u:10,q:"甲烷 CH₄、乙烷 C₂H₆、丙烷 C₃H₈ 都屬於烷類。含有 4 個碳的丁烷，化學式為何？",o:["C₄H₈","C₄H₁₀","C₄H₁₂","C₄H₆"],a:1,e:"烷類通式 CnH₂n₊₂，n＝4 時 H＝10，丁烷 C₄H₁₀（打火機燃料）。"},{id:"m41",t:"mine",u:10,q:"製造乙酸乙酯時，將乙酸與乙醇混合並加入少量濃硫酸加熱。濃硫酸在此反應中的主要角色為何？",o:["反應物","催化劑","中和劑","溶劑"],a:1,e:"酯化：乙酸＋乙醇 → 乙酸乙酯＋水，濃硫酸當催化劑（也能吸水）。產物酯類有水果香味。"},{id:"m42",t:"mine",u:10,q:"下列關於乙醇（C₂H₅OH）的敘述，何者正確？",o:["含有 −OH，所以水溶液呈鹼性","屬於有機酸","水溶液呈中性，是非電解質","燃燒後只產生水"],a:2,e:"醇的 −OH 在水中不會解離成 OH⁻，所以乙醇不是鹼，水溶液中性、不導電。燃燒產物是 CO₂ 和 H₂O。"},{id:"m43",t:"mine",u:10,q:"寶特瓶（PET）可以回收再加熱重新塑形，屬於哪一類聚合物？",o:["熱固性，網狀結構","熱固性，鏈狀結構","熱塑性，鏈狀結構","熱塑性，網狀結構"],a:2,e:"熱塑性塑膠是鏈狀結構，加熱會軟化可重塑、可回收；熱固性是網狀結構，加熱不會軟化（如電木）。"},{id:"m44",t:"mine",u:10,q:"下列哪一種衣料的主要成分是蛋白質？",o:["棉","麻","蠶絲","尼龍"],a:2,e:"蠶絲、羊毛是蛋白質；棉、麻是纖維素；尼龍是合成纖維。燃燒時蛋白質有燒焦羽毛的味道。"},{id:"m45",t:"mine",u:11,q:"在彈性限度內，彈簧掛 20 gw 的物體時伸長 4 cm。若改掛 50 gw，彈簧伸長多少？",o:["8 cm","10 cm","12.5 cm","14 cm"],a:1,e:"虎克定律：伸長量與外力成正比。20：4＝50：x → x＝10 cm。注意是「伸長量」，不是彈簧總長。"},{id:"m46",t:"mine",u:11,q:"游泳池中水深 50 cm 處，水所造成的壓力約為多少？（水密度 1 g/cm³）",o:["5 gw/cm²","50 gw/cm²","500 gw/cm²","50 kgw/cm²"],a:1,e:"液體壓力 P＝h×d＝50 cm×1 gw/cm³＝50 gw/cm²。和容器形狀、水的總量無關，只看深度。"},{id:"m47",t:"mine",u:11,q:"一物體在空氣中以彈簧秤測得 100 gw，完全沒入水中時彈簧秤讀數為 60 gw。此物體的密度為多少？",o:["1.67 g/cm³","2.5 g/cm³","4 g/cm³","0.4 g/cm³"],a:1,e:"浮力＝100−60＝40 gw＝排開水重，所以體積＝40 cm³。密度＝100÷40＝2.5 g/cm³。"},{id:"m48",t:"mine",u:11,q:"油壓機小活塞面積 10 cm²，大活塞面積 200 cm²。在小活塞上施 5 kgw 的力，大活塞最多可舉起多重的物體？",o:["0.25 kgw","50 kgw","100 kgw","1000 kgw"],a:2,e:"帕斯卡原理：壓力相同，F₁/A₁＝F₂/A₂ → 5/10＝F₂/200 → F₂＝100 kgw。"},{id:"m49",t:"mine",u:11,q:"托里切利實驗中，若把玻璃管稍微傾斜（管子夠長），管內水銀柱的「鉛直高度」會如何？",o:["變高","變低","不變","先變高再變低"],a:2,e:"大氣壓力只支撐水銀柱的鉛直高度（約 76 cm），傾斜時水銀柱變長，但鉛直高度不變。"},{id:"m50",t:"mine",u:11,q:"同一塊磚分別平放、側放、直立放在桌面上，下列何者正確？",o:["平放時對桌面的壓力最大","直立時對桌面的壓力最大","三種放法壓力都相同","三種放法對桌面的作用力不同"],a:1,e:"三種放法對桌面的「力」都等於磚的重量，但直立時接觸面積最小，壓力（力÷面積）最大。"},{id:"m51",t:"mine",u:12,q:"汽車前 2 秒行駛 10 m，後 3 秒行駛 20 m，全程 5 秒的平均速率為何？",o:["5 m/s","6 m/s","6.5 m/s","7.5 m/s"],a:1,e:"平均速率＝總路徑長÷總時間＝30÷5＝6 m/s。不能把兩段速率（5 和 6.67）直接平均。"},{id:"m52",t:"mine",u:12,q:"一物體由靜止開始做等加速度運動，4 秒後速度達到 20 m/s。這 4 秒內的位移為多少？",o:["20 m","40 m","80 m","5 m"],a:1,e:"v–t 圖下的面積＝位移＝三角形面積＝½×4×20＝40 m（加速度＝20÷4＝5 m/s²）。"},{id:"m53",t:"mine",u:12,q:"一顆石頭由靜止自由落下，不計空氣阻力（g＝9.8 m/s²），第 2 秒末的速度為多少？",o:["4.9 m/s","9.8 m/s","19.6 m/s","39.2 m/s"],a:2,e:"v＝gt＝9.8×2＝19.6 m/s。落下距離＝½gt²＝19.6 m。"},{id:"m54",t:"mine",u:12,q:"某物體的位置–時間（x–t）圖是一條斜向上的直線，表示該物體在做什麼運動？",o:["靜止","等速度運動","等加速度運動","速度越來越慢"],a:1,e:"x–t 圖的斜率＝速度。直線代表斜率固定 → 等速度運動；水平線才是靜止。若是 v–t 圖的斜直線才是等加速度。"},{id:"m55",t:"mine",u:12,q:"甲、乙兩車同時同地出發。在速度–時間（v–t）圖中，兩條線在 t＝5 s 時相交，這代表什麼？",o:["5 s 時兩車相遇","5 s 時兩車速度相同","5 s 時兩車加速度相同","5 s 時兩車都停止"],a:1,e:"v–t 圖的交點代表速度相同，不是相遇。要判斷相遇，要比較圖形下的面積（位移）是否相等。"},{id:"m56",t:"mine",u:13,q:"質量 2 kg 的物體在水平面上受 12 N 的水平拉力，物體與地面的摩擦力為 4 N。物體的加速度為多少？",o:["2 m/s²","4 m/s²","6 m/s²","8 m/s²"],a:1,e:"合力＝12−4＝8 N，a＝F/m＝8÷2＝4 m/s²。F＝ma 的 F 一定是「合力」。"},{id:"m57",t:"mine",u:13,q:"公車突然煞車時，站著的乘客身體會向前傾。可以用哪一個定律解釋？",o:["牛頓第一運動定律（慣性定律）","牛頓第二運動定律","牛頓第三運動定律","萬有引力定律"],a:0,e:"慣性：物體會想保持原來的運動狀態。車煞車時腳跟著車停下，但上半身還想繼續往前，所以身體向前傾，這是牛頓第一運動定律（慣性定律）。第二定律講 F＝ma，第三定律講作用力與反作用力。"},{id:"m58",t:"mine",u:13,q:"一本書靜置在桌上。下列哪一對力是「作用力與反作用力」？",o:["書受到的重力與桌面對書的支撐力","書對桌面的壓力與桌面對書的支撐力","書受到的重力與桌子受到的重力","桌面對書的支撐力與地面對桌子的支撐力"],a:1,e:"作用力與反作用力是兩個物體「互相」施力：書壓桌面、桌面撐書，作用在不同物體上。「書受到的重力與桌面對書的支撐力」兩個力都作用在書上，是一對平衡力，不是作用力與反作用力。"},{id:"m59",t:"mine",u:13,q:"用繩子綁著小球在水平面上做等速率圓周運動，下列何者正確？",o:["小球的速度不變","小球不需要受力","小球受到指向圓心的力","繩子斷掉後小球會沿著半徑向外飛出"],a:2,e:"等速率但方向一直變，所以有加速度，需要指向圓心的向心力（繩的拉力）。繩斷後沿「切線」飛出。"},{id:"m60",t:"mine",u:13,q:"兩物體間的萬有引力為 F。若兩物體間的距離變成原來的 2 倍，萬有引力變為多少？",o:["2F","F/2","4F","F/4"],a:3,e:"萬有引力和「距離的平方」成反比。距離變 2 倍，引力變成 1/(2×2)＝1/4，所以是 F/4。選 F/2 是忘了平方；距離變遠引力只會變小，不會變大。"},{id:"m61",t:"mine",u:14,q:"下列哪一種情況，人對物體有作功？",o:["提著書包在水平走廊上等速行走","用力推牆壁但牆壁不動","把箱子從地上搬到桌上","舉著啞鈴靜止不動"],a:2,e:"作功要有力，而且物體沿力的方向移動。提書包水平走，力向上、位移水平，不作功；推牆、舉著不動都沒有位移。"},{id:"m62",t:"mine",u:14,q:"體重 60 kg 的小明花 10 秒爬上 5 m 高的樓梯（g＝9.8 m/s²），他對抗重力作功的平均功率約為多少？",o:["30 W","294 W","2940 W","3000 W"],a:1,e:"W＝mgh＝60×9.8×5＝2940 J，P＝W/t＝2940÷10＝294 W。"},{id:"m63",t:"mine",u:14,q:"小球從離地 10 m 處由靜止釋放，不計空氣阻力（g＝10 m/s²）。落到離地 5 m 時，小球的速率為多少？",o:["5 m/s","10 m/s","14 m/s","20 m/s"],a:1,e:"力學能守恆：減少的位能 mg×5＝增加的動能 ½mv² → v²＝2×10×5＝100 → v＝10 m/s。此時動能＝位能。"},{id:"m64",t:"mine",u:14,q:"同一輛車的速率從 10 m/s 加快到 20 m/s，動能變為原來的幾倍？",o:["2 倍","3 倍","4 倍","不變"],a:2,e:"Ek＝½mv²，與速率平方成正比，速率 2 倍 → 動能 4 倍。所以車速快很多時撞擊非常危險。"},{id:"m65",t:"mine",u:14,q:"槓桿的支點左側 20 cm 處掛 30 gw 的砝碼，要使槓桿水平平衡，應在支點右側 15 cm 處掛多重的砝碼？",o:["22.5 gw","30 gw","40 gw","45 gw"],a:2,e:"槓桿原理：左力矩＝右力矩，30×20＝F×15 → F＝40 gw。"},{id:"m66",t:"mine",u:14,q:"用一個動滑輪（不計滑輪重與摩擦）把 100 kgw 的物體等速舉高 2 m。施力的大小與手拉繩子的長度為何？",o:["100 kgw、2 m","50 kgw、2 m","50 kgw、4 m","200 kgw、1 m"],a:2,e:"動滑輪省一半力但費兩倍距離：50 kgw、4 m。作功 50×4＝100×2，機械不能省功。"},{id:"m67",t:"mine",u:15,q:"4 Ω 和 2 Ω 的電阻串聯，接在 6 V 的電池上。4 Ω 電阻兩端的電壓為多少？",o:["2 V","3 V","4 V","6 V"],a:2,e:"串聯總電阻＝6 Ω，I＝6÷6＝1 A；4 Ω 的電壓＝IR＝1×4＝4 V。串聯時電阻越大分到的電壓越多。"},{id:"m68",t:"mine",u:15,q:"4 Ω 和 12 Ω 的電阻並聯，接在 12 V 的電池上，兩電阻消耗的電功率比（4 Ω：12 Ω）是多少？",o:["3：1","1：3","1：1","9：1"],a:0,e:"並聯時兩電阻的電壓都是 12 V，電功率 P＝V²÷R，電壓相同時電功率和電阻成反比，所以 4 Ω：12 Ω＝(144÷4)：(144÷12)＝36 W：12 W＝3：1。電阻小的那條反而比較耗電。"},{id:"m69",t:"mine",u:15,q:"關於電路中電流與電子流的方向，下列何者正確？",o:["電流與電子流方向相同","電流由電池負極經外電路流向正極","電子流由電池負極經外電路流向正極","電路中正電荷由正極移動到負極"],a:2,e:"電流方向規定為正極 → 外電路 → 負極；實際移動的電子方向相反，由負極出發流向正極。"},{id:"m70",t:"mine",u:15,q:"要測量電路中某燈泡的電流和電壓，安培計和伏特計應如何連接？",o:["兩者都與燈泡串聯","兩者都與燈泡並聯","安培計與燈泡串聯，伏特計與燈泡並聯","安培計與燈泡並聯，伏特計與燈泡串聯"],a:2,e:"安培計要讓電流流過它，所以串聯；伏特計測兩端的電壓差，所以並聯。"},{id:"m71",t:"mine",u:15,q:"同材質的導線，下列哪一條的電阻最大？",o:["長 1 m、截面積 2 mm²","長 2 m、截面積 1 mm²","長 1 m、截面積 1 mm²","長 2 m、截面積 2 mm²"],a:1,e:"電阻與長度成正比、與截面積成反比。越長越細電阻越大：長 2 m、截面積 1 mm² 最大。"},{id:"m72",t:"mine",u:15,q:"用絲綢摩擦玻璃棒後，玻璃棒帶正電。其原因為何？",o:["絲綢的正電荷跑到玻璃棒上","玻璃棒的電子跑到絲綢上","玻璃棒產生了新的正電荷","玻璃棒的質子跑到絲綢上"],a:1,e:"摩擦起電是電子的轉移，質子不會移動。玻璃棒失去電子帶正電，絲綢得到電子帶等量負電。"},{id:"m73",t:"mine",u:16,q:"一台標示「110 V、1100 W」的電器正常使用時，通過的電流為多少？",o:["0.1 A","1 A","10 A","100 A"],a:2,e:"P＝IV → I＝P÷V＝1100÷110＝10 A（電阻 R＝V÷I＝11 Ω）。"},{id:"m74",t:"mine",u:16,q:"一台 2000 W 的冷氣每天使用 5 小時，30 天共使用多少度電？若每度 3 元，電費為多少？",o:["30 度、90 元","300 度、900 元","3000 度、9000 元","10 度、30 元"],a:1,e:"電能＝2 kW×5 h×30＝300 kWh＝300 度，電費＝300×3＝900 元。功率要先換成 kW。"},{id:"m75",t:"mine",u:16,q:"兩個電阻串聯在電路中，下列何者正確？（電流熱效應 H＝I²Rt）",o:["電阻大的發熱較多","電阻小的發熱較多","兩者發熱一樣多","無法判斷"],a:0,e:"串聯時電流相同，H＝I²Rt，電阻越大產生的熱越多。（若是並聯，電壓相同，用 V²/R，電阻小的反而發熱多）"},{id:"m76",t:"mine",u:16,q:"家庭電路中，各個電器的連接方式與原因為何？",o:["串聯，可以節省電費","並聯，每個電器都能得到相同電壓並可單獨開關","串聯，電流比較穩定","並聯，總電阻會變大比較安全"],a:1,e:"家庭電器並聯，各自得到 110 V，關掉一個不影響其他。並聯越多，總電流越大，所以要用保險絲或無熔絲開關保護。"},{id:"m77",t:"mine",u:16,q:"關於鋅銅電池，下列敘述何者正確？",o:["銅是負極","鋅極發生氧化反應，質量減少","電子由銅片經導線流向鋅片","鹽橋的功能是讓電子通過"],a:1,e:"鋅活性大當負極：Zn → Zn²⁺＋2e⁻（被氧化、鋅片變輕）；電子由鋅經導線流向銅；銅極 Cu²⁺ 還原成 Cu。鹽橋讓離子移動平衡電荷，電子不經過鹽橋。"},{id:"m78",t:"mine",u:16,q:"電解水時，正極與負極產生的氣體分別是什麼？體積比為何？",o:["正極 H₂、負極 O₂，2：1","正極 O₂、負極 H₂，1：2","正極 O₂、負極 H₂，2：1","兩極都產生 H₂"],a:1,e:"負極產生氫氣、正極產生氧氣，H₂：O₂ 體積比 2：1，所以正：負＝1：2。（口訣：負氫正氧，氫二氧一）"},{id:"m79",t:"mine",u:16,q:"想在鐵湯匙上鍍一層銅，下列裝置何者正確？",o:["湯匙接正極、銅片接負極，電鍍液用硫酸銅","湯匙接負極、銅片接正極，電鍍液用硫酸銅","湯匙接負極、銅片接正極，電鍍液用硫酸鋅","湯匙和銅片都接負極"],a:1,e:"被鍍物（湯匙）接負極，鍍上去的金屬（銅）接正極，電鍍液要含 Cu²⁺。Cu²⁺ 往負極移動，在湯匙上還原成銅。"},{id:"m80",t:"mine",u:17,q:"下列哪一種做法「無法」增強電磁鐵的磁力？",o:["增加線圈圈數","增加電流","在線圈中插入鐵心","把線圈中的鐵心換成鋁棒"],a:3,e:"鐵心會被磁化而大幅增強磁場；鋁不會被磁化，換成鋁棒磁力反而變弱。"},{id:"m81",t:"mine",u:17,q:"把磁棒和線圈連接檢流計，下列哪一種情況檢流計的指針「不會」偏轉？",o:["磁棒插入線圈","磁棒從線圈中拔出","磁棒靜止放在線圈中","線圈套向靜止的磁棒"],a:2,e:"電磁感應需要線圈內的磁場「發生變化」。磁棒靜止時磁場沒變，不會產生感應電流。"},{id:"m82",t:"mine",u:17,q:"當磁棒的 N 極靠近線圈時，根據冷次定律，線圈靠近磁棒的那一端會產生什麼磁極？",o:["N 極，排斥磁棒靠近","S 極，吸引磁棒靠近","N 極，吸引磁棒靠近","不產生磁極"],a:0,e:"冷次定律：感應電流的磁場要「反抗」變化。N 極靠近，線圈就產生 N 極去推開它；N 極遠離時則產生 S 極去拉住它。"},{id:"m83",t:"mine",u:17,q:"關於電動機（馬達）與發電機，下列何者正確？",o:["馬達將動能轉換為電能","發電機將電能轉換為動能","發電機是利用電磁感應的原理","馬達是利用電磁感應的原理"],a:2,e:"馬達：通電導線在磁場中受力，電能 → 動能。發電機：線圈在磁場中轉動產生感應電流（電磁感應），動能 → 電能。"},{id:"m84",t:"mine",u:17,q:"關於磁場與磁力線，下列敘述何者正確？",o:["磁力線由 S 極出發進入 N 極","磁力線越密集的地方磁場越強","地理北極附近是地磁的 N 極","兩條磁力線可以相交"],a:1,e:"磁鐵外部磁力線由 N 出、S 進，越密磁場越強，不會相交。磁針 N 極指北，所以地理北極附近是地磁的 S 極。"},{id:"m85",t:"mine",u:17,q:"通電的螺線管，用右手四指沿著電流方向握住線圈，大拇指所指的那一端為何？",o:["N 極","S 極","沒有磁極","磁場最弱處"],a:0,e:"螺線管右手定則：四指順著電流繞的方向，大拇指指向的一端就是 N 極。"},{id:"bp0",t:"past",u:104,y:111,n:5,q:"下列四種植物對環境刺激的感應，何者從接受刺激到出現反應，所需的時間最長？",o:["朱槿植株受光刺激後向光彎曲","捕蠅草受昆蟲刺激後葉片閉合","酢漿草在太陽下山後葉片下垂","含羞草受外力觸碰後小葉閉合"],a:0,e:"向光性是生長造成的彎曲，需要較長時間；捕蠅草、酢漿草的睡眠運動、含羞草的觸發運動都是快速的膨壓變化，所需時間短。"},{id:"bp1",t:"past",u:107,y:111,n:11,adapt:true,q:"ABO 血型由 IA、IB、i 控制，IA、IB 為顯性，i 為隱性。四組父母血型為：甲 A×A、乙 A×B、丙 O×AB、丁 O×O。在不考慮突變下，哪一組「不可能」生下 O 型子女？",o:["甲","乙","丙","丁"],a:2,e:"O 型是 ii，父母都要至少帶一個 i。丙組母親 AB 型基因型是 IAIB，沒有 i，所以子女不可能是 O 型。"},{id:"bp2",t:"past",u:101,y:111,n:17,adapt:true,q:"阿彥要觀察萼片細胞內葉綠體的大小，阿秀要觀察一朵小花雄蕊的數目，兩人最適合使用的顯微鏡分別為何？",o:["兩人皆用複式顯微鏡","兩人皆用解剖顯微鏡","阿彥用複式顯微鏡，阿秀用解剖顯微鏡","阿彥用解剖顯微鏡，阿秀用複式顯微鏡"],a:2,e:"複式顯微鏡倍率高，適合看細胞內的微小構造；解剖顯微鏡適合看較大、立體的構造，例如數雄蕊。"},{id:"bp3",t:"past",u:102,y:111,n:18,q:"以榕樹為例，比較可行光合作用的細胞數目（甲）與可行呼吸作用的細胞數目（乙）及其原因，下列何者最合理？",o:["甲大於乙，因植物的部分細胞不具有粒線體","甲小於乙，因植物的部分細胞不具有粒線體","甲小於乙，因植物的部分細胞不具有葉綠體","甲等於乙，因植物細胞皆具有葉綠體與粒線體"],a:2,e:"所有活細胞都要進行呼吸作用；只有含葉綠體的細胞（如葉肉細胞）能行光合作用，根部細胞就沒有葉綠體。"},{id:"bp4",t:"past",u:103,y:111,n:26,adapt:true,q:"某人心臟甲、乙兩心室血液中的含氧量：甲 19.8 mL/100mL、乙 15.2 mL/100mL。推測兩心室所連接的血管，下列何者最合理？",o:["甲與大靜脈連接","甲與肺靜脈連接","乙與主動脈連接","乙與肺動脈連接"],a:3,e:"左心室的血含氧多（剛從肺回來），右心室含氧少。甲是左心室接主動脈；乙是右心室接肺動脈。心室連接的都是動脈。"},{id:"bp5",t:"past",u:102,y:111,n:32,q:"蜂蜜中含有分解澱粉的酵素。甲、乙兩試管裝等量澱粉液，其中一支加蜂蜜、另一支加等量的水，反應足夠時間後以碘液檢測，甲呈藍黑色、乙呈黃褐色。哪一支加了蜂蜜？",o:["甲，因未檢測出澱粉","甲，因有檢測出澱粉","乙，因未檢測出澱粉","乙，因有檢測出澱粉"],a:2,e:"碘液遇澱粉變藍黑色。乙沒有變藍黑，表示澱粉已被蜂蜜中的酵素分解，所以乙加了蜂蜜。"},{id:"bp6",t:"past",u:105,y:111,n:35,q:"血液流出甲器官後，尿素濃度上升、氧氣濃度下降。甲器官最可能是下列何者？",o:["膀胱","肝臟","肺臟","腎臟"],a:1,e:"肝臟把蛋白質分解產生的氨轉變成尿素，所以流出肝臟的血尿素變多；所有器官都消耗氧。腎臟則是使尿素變少。"},{id:"bp7",t:"past",u:106,y:111,n:39,q:"人體細胞：甲 卵細胞、乙 受精卵、丙 口腔皮膜細胞、丁 成熟的紅血球。哪些「不具有」成對的性染色體？",o:["只有甲","甲和丁","丙和丁","乙、丙和丁"],a:1,e:"卵細胞經減數分裂，染色體不成對；成熟紅血球沒有細胞核，沒有染色體。受精卵和體細胞都有成對染色體。"},{id:"bp8",t:"past",u:109,y:112,n:1,q:"若將某區域的原始森林改種成單一物種的樹林，此區域最可能出現何種變化？",o:["生產者的物種數增加","消費者的物種數增加","食物網變得比較複雜","生態系變得比較不穩定"],a:3,e:"生產者只剩一種，消費者種類也跟著減少，食物網變簡單，生態系就比較不穩定。"},{id:"bp9",t:"past",u:108,y:112,n:4,q:"豆腐乳是將豆腐接種毛黴菌發酵製成，豆腐會被菌絲完全覆蓋。關於毛黴菌構造的敘述，何者最合理？",o:["不具孢子","不具粒線體","不具葉綠體","不具細胞壁"],a:2,e:"毛黴菌有菌絲，屬於真菌界：會產生孢子、有細胞壁、有粒線體（真核生物），但沒有葉綠體，不能行光合作用。"},{id:"bp10",t:"past",u:105,y:112,n:8,q:"「若食物中的糖分容易被快速吸收，會使血糖急遽上升，而引起某激素分泌增加，造成血糖快速下降。」關於此激素，何者正確？",o:["是由肝臟分泌的胰島素","是由肝臟分泌的升糖素","是由胰島分泌的胰島素","是由胰島分泌的升糖素"],a:2,e:"讓血糖「下降」的激素是胰島素，由胰臟裡的胰島分泌。升糖素作用相反，會讓血糖上升。肝臟不分泌這兩種激素，而是儲存和釋放肝糖的地方。"},{id:"bp11",t:"past",u:109,y:112,n:14,adapt:true,q:"DDT 難以被生物代謝。某食物鏈中甲、乙、丙、丁體內 DDT 濃度（ppm）分別為 2.0、0.2、20、0.04，其中一種為生產者。下列推論何者正確？",o:["食性關係可能為丙→甲→乙→丁","食性關係可能為丁→乙→甲→丙","丙最可能為生產者","甲最可能為三級消費者"],a:1,e:"難代謝的物質會沿食物鏈累積（生物放大作用），越高階濃度越高：丁＜乙＜甲＜丙，所以丁是生產者，丙是最高階。",fig:'<svg viewBox="0 0 300 146" role="img" aria-label="題目附圖"><rect x="40" y="30" width="220" height="80" rx="0" class="bg"/><path class="ink" d="M40 70 H260 M95 30 V110 M150 30 V110 M205 30 V110"/><path class="ink" d="M40 70 H260"/><text x="67" y="56" text-anchor="middle" class=b>甲</text><text x="67" y="96" text-anchor="middle">2.0</text><text x="122" y="56" text-anchor="middle" class=b>乙</text><text x="122" y="96" text-anchor="middle">0.2</text><text x="177" y="56" text-anchor="middle" class=b>丙</text><text x="177" y="96" text-anchor="middle">20</text><text x="232" y="56" text-anchor="middle" class=b>丁</text><text x="232" y="96" text-anchor="middle">0.04</text><text x="150" y="130" text-anchor="middle">單位：ppm（濃度越高，DDT 累積越多）</text></svg>',cap:"四種生物體內的 DDT 濃度"},{id:"bp12",t:"past",u:102,y:112,n:16,q:"維管束植物某代謝作用的反應式為「甲＋二氧化碳 → 氧氣＋乙＋水」。甲的名稱及其在植物體內主要運送的構造，何者最合理？",o:["水，由木質部運送","水，由韌皮部運送","葡萄糖，由木質部運送","葡萄糖，由韌皮部運送"],a:0,e:"這是光合作用，原料是水和二氧化碳，所以甲是水，由木質部由下往上運送。乙是葡萄糖。"},{id:"bp13",t:"past",u:101,y:112,n:24,adapt:true,q:"試管裝葡萄糖液，管口用一層膜密封後倒置於裝澱粉液的燒杯中。已知葡萄糖能通過此膜，澱粉不能。平衡後分別檢測試管和燒杯中的溶液，何者最合理？",o:["以碘液檢測，僅試管中的溶液變色","以碘液檢測，試管和燒杯皆變色","以本氏液檢測，僅試管中的溶液變色","以本氏液檢測，試管和燒杯皆變色"],a:3,e:"葡萄糖會擴散到燒杯，兩邊都有葡萄糖，本氏液都會變色；澱粉過不了膜，只有燒杯有澱粉，碘液只有燒杯變色。",fig:'<svg viewBox="0 0 300 194" role="img" aria-label="題目附圖"><path class="ink" d="M70 50 V170 H230 V50"/><rect x="71" y="90" width="158" height="79" rx="0" class="water"/><path class="ink" d="M130 20 V140 M170 20 V140"/><path class="ink" d="M130 20 Q150 8 170 20"/><rect x="131" y="22" width="38" height="117" rx="0" class="lay1"/><path d="M128 140 H172" style="stroke:var(--must);stroke-width:3;stroke-dasharray:4 3"/><text x="185" y="144" text-anchor="start">半透膜</text><text x="150" y="70" text-anchor="middle">葡萄</text><text x="150" y="86" text-anchor="middle">糖液</text><text x="96" y="160" text-anchor="middle">澱粉液</text><text x="150" y="186" text-anchor="middle">燒杯</text></svg>',cap:"試管口以膜密封後倒置在燒杯中"},{id:"bp14",t:"past",u:106,y:112,n:35,adapt:true,q:"草莓我們吃的部分是由花托膨大而來。草莓表面一粒一粒的小構造是由「子房」發育而成，這些小構造應稱為什麼？",o:["胚珠","種子","果實","花粉"],a:2,e:"花受精後：子房 → 果實，胚珠 → 種子。題目說小粒是由「子房」發育來的，所以是果實。草莓紅紅的果肉是花托變大的，表面的小粒才是真正的果實，每粒裡面有一顆種子。"},{id:"bp15",t:"past",u:107,y:112,n:38,q:"軟骨發育不全症由體染色體上的突變 FGFR3 基因造成（F 為突變、f 為正常），只要有一個 F 就會發病。阿佑因突變而患病，但父母皆未患病，父母的基因型最可能為何？",o:["父 Ff、母 Ff","父 Ff、母 ff","父 FF、母 FF","父 ff、母 ff"],a:3,e:"這是顯性遺傳疾病，有 F 就會發病；父母都沒病，所以都是 ff。阿佑的 F 是新發生的突變。"},{id:"bp16",t:"past",u:104,y:113,n:5,q:"人體副甲狀腺分泌的激素經由 X 運送，若此激素分泌過多，會影響骨骼中的 Y 含量，可能造成骨質疏鬆。X 和 Y 最可能為何？",o:["X 為血液，Y 為鈣","X 為血液，Y 為鉀","X 為消化液，Y 為鈣","X 為消化液，Y 為鉀"],a:0,e:"激素由內分泌腺分泌後直接進入「血液」運送全身（內分泌腺沒有導管，不用消化液）。副甲狀腺激素調節血中的「鈣」，分泌過多會把骨頭裡的鈣拉出來，造成骨質疏鬆。"},{id:"bp17",t:"past",u:107,y:113,n:12,adapt:true,q:"基因型皆為 Aa 的雄、雌長翅果蠅交配（長翅為顯性）。小坪只觀察 10 隻子代（4 長翅、6 短翅）就下結論。理論上第一子代長翅與短翅的比例應約為何？",o:["全為長翅","全為短翅","1：3","3：1"],a:3,e:"Aa×Aa → AA：Aa：aa＝1：2：1，長翅（AA、Aa）：短翅（aa）＝3：1。樣本太少會和理論值差很多。"},{id:"bp18",t:"past",u:101,y:113,n:20,q:"已知刺絲胞動物皆生活在水中。網友說：「所有刺絲胞動物都生活在海洋中。」若要驗證這句話是否成立，何種方法最能達到目的？",o:["從海洋中找到海月水母","從海月水母身上找到刺絲胞","從淡水中找到一種刺絲胞動物","從海洋中找到很多種刺絲胞動物"],a:2,e:"要推翻「所有都在海洋」，只要找到一個反例：在淡水中找到刺絲胞動物（如水螅），就能證明這句話不成立。"},{id:"bp19",t:"past",u:106,y:113,n:30,q:"青蛙的染色體有 13 對，其中 1 對為性染色體。不考慮突變，雌蛙卵巢內經減數分裂後的卵子，應有幾條性染色體？",o:["1 條","2 條","13 條","26 條"],a:0,e:"減數分裂後染色體數目減半，成對的變成單一條，性染色體只剩 1 條（全部共 13 條）。"},{id:"bp20",t:"past",u:105,y:113,n:33,adapt:true,q:"丙器官連接甲、乙兩條血管，乙血管中的氧氣含量比甲多，且丙會製造尿液。關於丙的功能與血液進出丙的路徑，何者正確？",o:["形成尿素，甲→丙→乙","形成尿素，乙→丙→甲","形成尿液，甲→丙→乙","形成尿液，乙→丙→甲"],a:3,e:"丙是腎臟，功能是形成尿液（尿素是肝臟製造的）。含氧多的乙是腎動脈（流入），甲是腎靜脈（流出）。",fig:'<svg viewBox="0 0 300 196" role="img" aria-label="題目附圖"><path class="muscle" d="M150 30 C210 20 240 70 230 110 C222 150 190 172 160 160 C140 152 150 128 140 112 C132 98 120 90 122 70 C124 46 134 34 150 30 Z"/><path class="ar" style="stroke-width:10" d="M124 84 C90 84 70 80 40 74"/><path d="M124 84 C90 84 70 80 40 74" class="tube" style="stroke-width:1.2"/><path d="M128 104 C94 108 70 108 40 106" class="vn" style="stroke-width:10"/><path d="M128 104 C94 108 70 108 40 106" class="tube" style="stroke-width:1.2"/><path d="M138 116 C120 136 112 160 110 186" class="tube" style="stroke-width:5"/><text x="34" y="70" text-anchor="end" class=b>甲</text><text x="34" y="110" text-anchor="end" class=b>乙</text><text x="184" y="100" text-anchor="middle" class=b>丙</text><text x="118" y="186" text-anchor="start">輸尿管</text></svg>',cap:"丙器官和連接的甲、乙兩條血管"},{id:"bp21",t:"past",u:108,y:113,n:39,q:"小美在圖鑑中看到杜鵑花科（Ericaceae）的金毛杜鵑（Rhododendron oldhamii），想依學名搜尋同屬但不同種的植物，何種查詢方式最好？",o:["學名第一個字為 Ericaceae 的植物","學名第二個字為 oldhamii 的植物","學名第一個字為 Rhododendron 的植物","學名為 Rhododendron oldhamii 的植物"],a:2,e:"二名法：第一個字是屬名，第二個字是種小名。同屬就找第一個字一樣的。"},{id:"bp22",t:"past",u:109,y:113,n:42,adapt:true,q:"食蛇龜過去因中國市場的需求，被暗地裡大量捕捉運往中國，使野外數量下降。過去食蛇龜面臨的主要問題是什麼？",o:["棲地破壞","環境汙染","過度捕捉","外來種引入"],a:2,e:"大量抓野生食蛇龜拿去賣，讓野外數量下降，這是「過度捕捉（過度利用）」。棲地破壞是住的地方被破壞；汙染是環境變髒；外來種是別的地方的生物跑進來，都不是題目描述的狀況。"},{id:"bp23",t:"past",u:109,y:114,n:3,q:"報導：「白尾八哥築巢偏好的位置與麻雀相近，食物種類也相似，甚至被觀察到會以麻雀幼鳥為食。」兩者之間最符合哪兩種交互作用？",o:["競爭、掠食","競爭、共生","共生、掠食","寄生、掠食"],a:0,e:"白尾八哥和麻雀搶一樣的築巢位置、吃一樣的食物 → 競爭。白尾八哥吃麻雀幼鳥 → 掠食。共生是雙方互相得利，寄生是住在別人身上吸養分，都不符合。"},{id:"bp24",t:"past",u:101,y:114,n:7,q:"網路說：「端午節正午太陽直射北半球，太陽與地球對雞蛋的引力恰好相反，所以只有那時才能立蛋。」下列哪一個實驗最適合用來反駁？",o:["將生雞蛋煮熟後剝殼，改於聖誕節正午時在臺灣成功立蛋","使用同一種生雞蛋，改於聖誕節正午時在臺灣成功立蛋","把生雞蛋換成生鴨蛋，於端午節正午在臺灣成功立蛋","另拿不同種的生雞蛋，於端午節正午在臺灣成功立蛋"],a:1,e:"要反駁的是「日期（太陽直射位置）」的影響，所以只改變日期、其他條件（同種生雞蛋）不變。(A)同時改了兩個變因。"},{id:"bp25",t:"past",u:102,y:114,n:8,adapt:true,q:"蘆筍植株的甲部位照到日光呈綠色，乙部位埋在土中未照光呈白色。兩部位進行生理作用所釋出的氣體，何者最合理？",o:["甲能釋出 O₂，但乙不能","甲能釋出 CO₂，但乙不能","乙能釋出 O₂，但甲不能","乙能釋出 CO₂，但甲不能"],a:0,e:"綠色的甲有葉綠素又照得到光，能行光合作用釋出 O₂；乙不能。兩部位都能行呼吸作用釋出 CO₂。"},{id:"bp26",t:"past",u:107,y:114,n:30,adapt:true,q:"孔雀魚黑眼睛與紅眼睛由一對遺傳因子控制。甲、乙兩隻黑眼睛孔雀魚交配，子代有黑眼睛和紅眼睛；從子代中選兩隻黑眼睛的丙、丁。甲、乙、丙、丁中哪兩隻的基因型一定相同？",o:["甲、乙","甲、丙","乙、丁","丙、丁"],a:0,e:"黑×黑生出紅，紅是隱性，甲乙都是 Aa；黑眼子代可能是 AA 或 Aa，無法確定。"},{id:"bp27",t:"past",u:108,y:114,n:34,adapt:true,q:"甲生物：有細胞核、有細胞膜、有菌絲、沒有葉綠素。乙生物：沒有細胞核、有細胞膜、有葉綠素。甲、乙依序屬於哪一界？",o:["原生生物界、真菌界","原生生物界、植物界","真菌界、原生生物界","真菌界、原核生物界"],a:3,e:"有菌絲、無葉綠素的真核生物是真菌；沒有細胞核但能行光合作用的是原核生物界的藍綠菌。"},{id:"bp28",t:"past",u:106,y:115,n:13,q:"人類長時間育種，不斷利用具有某些特徵的玉米植株雜交，使玉米粒從小而有硬殼變成現代玉米的樣貌。關於此育種過程，何者最合理？",o:["經由營養器官進行無性生殖","經由生殖器官進行有性生殖","親代與子代的表現型都相同","親代與子代的基因型都相同"],a:1,e:"雜交是用花粉授粉（生殖器官）進行有性生殖，子代會有新的基因組合，才能篩選出想要的特徵。"},{id:"bp29",t:"past",u:105,y:115,n:20,q:"蝦子頭部的「觸角腺」可以過濾體內液體，把有用的物質吸收，並排出多餘的含氮廢物。觸角腺的功能最類似人體哪個器官？",o:["肝臟","大腸","腎臟","尿道"],a:2,e:"人的腎臟會過濾血液、把有用的物質再吸收回去、把含氮廢物（尿素）變成尿排出。觸角腺做的事完全一樣。肝臟製造尿素但不排出；大腸吸收水分；尿道只是尿的通道。"},{id:"bp30",t:"past",u:109,y:115,n:21,q:"魚池原只有黑色鯉魚，放入 50 隻紅色鯉魚，一段時間後隨機捕捉 50 隻，其中 5 隻是紅色。若期間沒有遷入、遷出、出生、死亡，用捉放法算出黑色鯉魚數量 X，何者正確？",o:["X 為 500 隻，為實際數量","X 為 500 隻，為可能數量","X 為 450 隻，為實際數量","X 為 450 隻，為可能數量"],a:3,e:"50÷N＝5÷50 → 總數 N＝500，黑色＝500−50＝450。捉放法只是估計值，不是實際數量。"},{id:"bp31",t:"past",u:107,y:115,n:25,q:"黑毛為顯性、白毛為隱性。甲、乙兩袋各放 50 顆黑棋（顯性）與 50 顆白棋（隱性），每次從兩袋各抽一顆配對、記錄後放回，重複 100 次。子代黑毛、白毛數量最可能依序為何？",o:["49、51","78、22","26、74","100、0"],a:1,e:"相當於 Aa×Aa，黑：白≈3：1，100 次約 75：25，最接近 78、22。"},{id:"bp32",t:"past",u:108,y:115,n:29,q:"穿山龍俗稱棒槌瓜，葉呈掌狀，花朵為白色，種子具有翅。下列推論何者最合理？",o:["棒槌瓜的學名為穿山龍","成熟葉背可見孢子囊堆","其植株具有果實的構造","其植株具有毬果的構造"],a:2,e:"會開花代表是被子植物，有果實。學名要用拉丁文二名法；孢子囊堆是蕨類；毬果是裸子植物。"},{id:"bp33",t:"past",u:102,y:115,n:37,adapt:true,q:"試管中加入蛋白質溶液與人體消化液中以蛋白質為受質的某酵素，結果蛋白質濃度逐漸下降，產物 X 濃度逐漸上升。關於此酵素，何者最合理？",o:["可能由膽汁中取得","可能由胰液中取得","此酵素催化 X 的分解","此酵素催化 X 的合成"],a:1,e:"胰液含有分解蛋白質的酵素；膽汁沒有酵素，只能乳化脂肪。此酵素分解的是蛋白質，X 是產物。"},{id:"bp34",t:"past",u:103,y:115,n:39,q:"甲：「肺臟流出的血液會由血管最先進入右心房。」乙：「肝臟流出的血液會由血管最先進入右心室。」兩人的看法是否正確？",o:["僅甲正確","僅乙正確","兩人皆正確","兩人皆錯誤"],a:3,e:"肺靜脈把血帶回「左心房」；肝臟流出的血經下大靜脈回到「右心房」，不會直接進心室。"},{id:"bp35",t:"past",u:204,y:111,n:1,q:"氣象報導常可見「百帕」一詞，下列有關百帕的敘述何者正確？",o:["百帕是氣壓的單位","百帕是溫度的單位","百帕是風速的單位","百帕是下雨的機會"],a:0,e:"百帕（hPa）是「氣壓」的單位，1 大氣壓約 1013 百帕。溫度單位是℃，風速單位是 m/s 或級，下雨機會用降雨機率（%）表示。颱風中心氣壓越低，通常越強。"},{id:"bp36",t:"past",u:205,y:111,n:6,adapt:true,q:"住在英國（北緯 51 度）的大介，聖誕節（12/25）到紐西蘭（南緯 41 度）旅遊。下列何者是他當時在紐西蘭可發現的現象？",o:["紐西蘭的夜晚比英國長","紐西蘭的白晝比英國長","紐西蘭的晝夜長度大約相同","紐西蘭的晝夜長度都和英國大約相同"],a:1,e:"12 月太陽直射南回歸線附近，南半球是夏天、晝長夜短；北半球的英國是冬天、晝短夜長。"},{id:"bp37",t:"past",u:203,y:111,n:13,q:"地球內部可分為地殼、地函、地核。這些分層與岩石圈、軟流圈的關係，何者最合理？",o:["岩石圈的厚度範圍與地殼相等","軟流圈的厚度範圍與地函相等","岩石圈包括了地殼與一部分的地函","軟流圈包括了地函與一部分的地殼"],a:2,e:"岩石圈＝地殼＋上部地函（堅硬部分）；其下的軟流圈只是地函的一部分。"},{id:"bp38",t:"past",u:206,y:111,n:19,q:"「一氧化二氮無色、無味，常溫常壓下為氣態。它會吸收地表輻射，也對中樞神經有作用，醫療上可作為麻醉。」一氧化二氮會造成溫室效應，最可能是因為哪一個特性？",o:["無色、無味","會吸收地表輻射","常溫常壓下為氣態","對人體的中樞神經有作用"],a:1,e:"溫室氣體的關鍵是「會吸收地表放出的輻射（紅外線）」，把熱留在大氣中，讓地球變暖。無色無味、是氣體、會麻醉，這些都和溫室效應無關。"},{id:"bp39",t:"past",u:205,y:111,n:37,q:"小淳早上 8 點到海邊：10 點時海浪打到沙灘的位置比 8 點低；12 點比 10 點更低；下午 2 點比 12 點高。推算當地滿潮或乾潮時間，何者最合理？",o:["乾潮可能在 8～10 點間","乾潮可能在 12～14 點間","滿潮可能在 8～12 點間","滿潮可能在 12～14 點間"],a:1,e:"水位先一直降、到 12 點後又升，最低點（乾潮）落在 12～14 點之間。滿潮時間資料不足。"},{id:"bp40",t:"past",u:202,y:112,n:2,q:"太魯閣地區常見岩層受力而彎曲成美麗圖案，這種彎曲的現象稱為什麼？",o:["斷層","褶皺","順向坡","逆向坡"],a:1,e:"岩層受到擠壓而「彎曲」但沒有斷開，叫做褶皺。如果岩層斷開而且兩邊錯動，才叫斷層。順向坡、逆向坡是講岩層傾斜方向和山坡方向的關係。"},{id:"bp41",t:"past",u:205,y:112,n:5,adapt:true,q:"某港口 8/11 最高滿潮 2.5 m、最低乾潮 −2.5 m；8/14 最高滿潮 1.5 m、最低乾潮 −1.5 m。兩天的潮差約相差多少公尺？",o:["2","4","5","8"],a:0,e:"潮差＝滿潮−乾潮：8/11 為 5 m，8/14 為 3 m，相差 2 m。"},{id:"bp42",t:"past",u:202,y:112,n:10,q:"海蝕平臺上有火成岩脈，是岩漿侵入原有岩層形成的；火成岩脈抗侵蝕能力較強，像牆一樣立於平臺上。火成岩脈、原有岩層、海水侵蝕的先後順序何者最合理？",o:["火成岩脈→岩層沉積→海水侵蝕","岩層沉積→火成岩脈形成→海水侵蝕","海水侵蝕→岩層沉積→火成岩脈形成","火成岩脈→海水侵蝕→岩層沉積"],a:1,e:"要先有岩層，岩漿才能侵入（截切定律）；最後海水把較軟的岩層侵蝕掉，岩脈才凸出來。"},{id:"bp43",t:"past",u:204,y:112,n:15,q:"研究團隊想從臺灣航海向北至沖繩，選在夏天進行，因為季風與洋流有助於向北航行。當時的季風與洋流應為何？",o:["東北季風與黑潮","西南季風與黑潮","東北季風與中國沿岸流","西南季風與中國沿岸流"],a:1,e:"往北航行需要往北的風和洋流。臺灣夏天吹「西南季風」（從西南往東北吹），黑潮在臺灣東邊由南往北流，兩者都幫忙往北。東北季風是冬天吹、往南吹；中國沿岸流冬天往南流。"},{id:"bp44",t:"past",u:204,y:112,n:28,q:"小佐認為天氣系統 H（高氣壓）接近後，甲地應為晴朗的天氣。關於 H 的敘述，何者最能說明他的看法？",o:["中心近地面的氣流下沉，水氣不易凝結","中心近地面的氣流上升，水氣不易凝結","中心近地面氣壓比外圍低，水氣含量較少","中心近地面氣壓比外圍高，水氣含量較高"],a:0,e:"高氣壓中心氣流下沉、增溫，水氣不易凝結成雲，所以多晴朗。低氣壓則氣流上升、易成雲下雨。"},{id:"bp45",t:"past",u:205,y:112,n:39,q:"資料顯示當月 9 日晚間可見到月食，23 日早上可見到日食。下列有關不同日期的月相何者最合理？",o:["2 日應為下弦月","16 日應為滿月","23 日應為下弦月","30 日應為上弦月"],a:3,e:"月食在滿月（9 日）、日食在新月（23 日）。新月後約 7 天是上弦月，所以 30 日是上弦月；16 日是下弦月。"},{id:"bp46",t:"past",u:203,y:112,n:49,adapt:true,q:"土壤液化潛勢評估中，用「模擬地震參數」估算當地可能的「搖晃程度」。這個結果與下列何者最直接相關？",o:["地震強度（震度）","地震規模","地震的位置","斷層的類型"],a:0,e:"某地搖晃得多劇烈是「震度」；規模是地震釋放的總能量，一次地震只有一個規模。"},{id:"bp47",t:"past",u:204,y:113,n:15,adapt:true,q:"北半球某處地面天氣圖中只畫了一條等壓線，標示 1020 百帕。利用圖中資訊所做的推論，何者最合理？",o:["等壓線密集處的氣壓比稀疏處高","標示 1020 的等壓線是氣壓最高的位置","若再有一條等壓線的數值，即可判斷大致溫度","若再有一條等壓線的數值，即可判斷大致風向"],a:3,e:"只有一條線不知道哪邊高、哪邊低。再多一條就能知道高壓與低壓的方向，風由高壓吹向低壓，可判斷風向。溫度要看等溫線。",fig:'<svg viewBox="0 0 300 190" role="img" aria-label="題目附圖"><rect x="20" y="15" width="260" height="160" rx="0" class="bg"/><path class="soft" d="M20 120 C60 112 80 140 110 150 C140 160 150 175 160 175 H20 Z"/><path class="ln" d="M40 30 C90 60 110 120 180 120 C230 120 250 80 270 60"/><rect x="196" y="108" width="40" height="18" rx="4" class="bg"/><text x="216" y="122" text-anchor="middle" class=b>1020</text><path class="ink" d="M250 165 L250.0 139.2"/><polygon class="hd0" points="250.0,135.0 246.2,142.0 253.8,142.0"/><text x="250" y="130" text-anchor="middle" class=b>北</text></svg>',cap:"北半球某處地面天氣圖"},{id:"bp48",t:"past",u:205,y:113,n:24,adapt:true,q:"阿華在赤道某處晴朗無雲的白天觀測太陽，第二日 9 時至 12 時之間，太陽明亮面積的百分比先減少再恢復。下列敘述何者最合理？",o:["當日應該是農曆十五","當日白天長度是一年中最短的","此現象是月球的影子落在地球上所造成","此現象是阿華隨地球自轉進入夜晚所造成"],a:2,e:"白天太陽被遮住是日食，月球在地球與太陽之間，月影落在地球上，發生在農曆初一（新月）。",fig:'<svg viewBox="0 0 300 172" role="img" aria-label="題目附圖"><clipPath id="cp42"><circle cx="42" cy="80" r="26"/></clipPath><circle cx="42" cy="80" r="26" class="sun"/><text x="42" y="128" text-anchor="middle">9 時</text><clipPath id="cp114"><circle cx="114" cy="80" r="26"/></clipPath><circle cx="114" cy="80" r="26" class="sun"/><g clip-path="url(#cp114)"><circle cx="148" cy="80" r="27" style="fill:var(--ink);opacity:.82"/></g><text x="114" y="128" text-anchor="middle">10 時</text><clipPath id="cp186"><circle cx="186" cy="80" r="26"/></clipPath><circle cx="186" cy="80" r="26" class="sun"/><g clip-path="url(#cp186)"><circle cx="198" cy="80" r="27" style="fill:var(--ink);opacity:.82"/></g><text x="186" y="128" text-anchor="middle">10 時半</text><clipPath id="cp258"><circle cx="258" cy="80" r="26"/></clipPath><circle cx="258" cy="80" r="26" class="sun"/><text x="258" y="128" text-anchor="middle">12 時</text><text x="150" y="160" text-anchor="middle">太陽明亮的部分先減少，再恢復</text></svg>',cap:"阿華觀察到的太陽（示意）"},{id:"bp49",t:"past",u:204,y:113,n:28,adapt:true,q:"美環把天氣系統分兩類：甲類（低氣壓）：颱風、太平洋暖氣團；乙類（高氣壓）：蒙古大陸冷氣團。他的舉例有錯，應如何更正？",o:["颱風移到乙類","太平洋暖氣團移到乙類","颱風移到乙類，蒙古冷氣團移到甲類","颱風與太平洋暖氣團移到乙類"],a:1,e:"颱風是低氣壓；太平洋暖氣團和蒙古大陸冷氣團都是高氣壓，所以把太平洋暖氣團移到乙類。"},{id:"bp50",t:"past",u:205,y:113,n:31,q:"小茵住在臺灣，連續兩個月觀察每天正午陽光照進教室的範圍：從第 1 排逐漸擴大到第 3 排，再逐漸縮回第 2 排。最可能是哪一段時間？",o:["春分前至春分後","夏至前至夏至後","秋分前至秋分後","冬至前至冬至後"],a:3,e:"正午陽光照得越深入，代表太陽越斜（仰角越小）。臺灣冬至正午太陽最低，所以範圍先變大再縮小是冬至前後。"},{id:"bp51",t:"past",u:206,y:113,n:50,q:"春夏植物旺盛光合作用，使二氧化碳濃度產生約 2～3% 的週期性變化，氧氣濃度也會有週期性變化。氧氣的變化百分比與理由何者最合理？",o:["因 CO₂ 的分子量大於 O₂，O₂ 變化百分比會小很多","因 CO₂ 的分子量大於 O₂，O₂ 變化百分比會大很多","因大氣中 O₂ 濃度比 CO₂ 高得多，O₂ 變化百分比會小很多","因大氣中 O₂ 濃度比 CO₂ 高得多，O₂ 變化百分比會大很多"],a:2,e:"O₂ 約占 21%，CO₂ 只有約 0.04%。同樣變動量放在很大的基數上，百分比變化就很小。"},{id:"bp52",t:"past",u:204,y:114,n:5,adapt:true,q:"某鋒面的剖面圖中，乙空氣沿著鋒面向上抬升並形成雲雨，甲空氣位於鋒面下方。關於甲、乙空氣的性質，何者最合理？",o:["甲、乙皆為暖空氣","甲、乙皆為冷空氣","甲為暖空氣，乙為冷空氣","甲為冷空氣，乙為暖空氣"],a:3,e:"暖空氣比較輕（密度小），會沿著鋒面往上爬，上升冷卻形成雲雨；冷空氣比較重，會待在鋒面下面。所以上升的乙是暖空氣，在下方的甲是冷空氣。",fig:'<svg viewBox="0 0 300 172" role="img" aria-label="題目附圖"><path class="ink" d="M20 160 H280"/><path class="lay2" d="M20 160 L20 70 C90 90 170 130 280 160 Z"/><path class="ln2" d="M20 70 C90 90 170 130 280 160"/><path class="ln" d="M250 140 L124.3 76.2"/><polygon class="hd1" points="120.0,74.0 125.1,81.5 129.1,73.7"/><path class="cloud" d="M60 52 c-4-16 18-22 24-12 c6-14 30-10 30 4 c14 0 16 18 2 20 h-50 c-14 0-14-14-6-12 Z"/><path class="ln3" d="M72 70 l-4 12"/><path class="ln3" d="M86 70 l-4 12"/><path class="ln3" d="M100 70 l-4 12"/><text x="60" y="130" text-anchor="middle" class=b>甲</text><text x="230" y="100" text-anchor="middle" class=b>乙</text><text x="200" y="150" text-anchor="middle">鋒面</text></svg>',cap:"某鋒面的剖面示意圖"},{id:"bp53",t:"past",u:201,y:114,n:6,q:"小盈想在簡報中說明「過度抽取地下水」造成的影響，下列照片說明何者最適合？",o:["地層下陷使新屋與舊屋高度有落差","山壁旁的房屋受土石滑動而受損","泥砂混合雨水向下沖毀房屋","房屋受地面搖晃而結構受損"],a:0,e:"超抽地下水使地層壓密，造成地層下陷。(B)是順向坡滑動，(C)是土石流，(D)是地震。"},{id:"bp54",t:"past",u:204,y:114,n:13,q:"專家建議住在臺北的居民，陽臺不要朝北或東北，因冬天易下雨又有強風。這個建議是否適用於其他地區？",o:["適用於臺南，因冬天位處季風迎風面氣候偏溼","適用於基隆，因冬天位處季風背風面氣候偏溼","不適用於宜蘭，因冬天位處季風迎風面氣候偏乾","不適用於高雄，因冬天位處季風背風面氣候偏乾"],a:3,e:"冬季東北季風：北部、東北部是迎風面，多雨；南部是背風面，乾燥，所以不適用於高雄。"},{id:"bp55",t:"past",u:203,y:114,n:15,q:"地球表層由數個大小與形狀不同的板塊組成。下列說明何者最合理？",o:["板塊的交界與各大陸的海陸交界都吻合","板塊會移動而使陸地與海底的地形也隨著改變","板塊的交界上，皆形成高聳巨大的陸地山脈","板塊皆位於軟流圈之上，且交界均為中洋脊"],a:1,e:"板塊在軟流圈上移動，造成地形改變。板塊交界和海陸交界不一定一致；交界有張裂、聚合、錯動三種，不全是山脈或中洋脊。"},{id:"bp56",t:"past",u:205,y:114,n:37,q:"距離太陽最近的五顆行星與太陽在同一平面上公轉，下列敘述何者最合理？",o:["若地球、金星、水星呈一直線，地球可能位於金星與水星之間","若太陽、地球、火星呈一直線，太陽可能位於地球與火星之間","若金星、太陽、水星呈一直線，太陽不可能位於金星與水星之間","若火星、地球、木星呈一直線，地球不可能位於火星與木星之間"],a:1,e:"地球軌道在金星外，不可能夾在金星與水星之間；地球和火星可以分別在太陽兩側，太陽就會在中間。"},{id:"bp57",t:"past",u:205,y:114,n:50,q:"月亮由上弦月變到下弦月的這段時間，地球大約自轉或公轉了幾圈？",o:["地球大約自轉了半圈","地球大約自轉了 15 圈","地球繞太陽大約公轉了半圈","地球繞太陽大約公轉了 15 圈"],a:1,e:"上弦到下弦約半個月（14～15 天），地球一天自轉一圈，約 15 圈；公轉只走了約 15/365 圈。"},{id:"bp58",t:"past",u:203,y:115,n:8,adapt:true,q:"學校的地震預警跑馬燈顯示：「本地預估震度 4 級，13 秒後抵達。」根據此資訊可以得知何者？",o:["地震波到達後，會使學校持續搖晃 13 秒","地震波到達後，各縣市都會有震度 4 級的搖晃","在劇烈搖晃前，大約有 13 秒的時間可以避難","在劇烈搖晃前，可得知此地震的規模為 4"],a:2,e:"13 秒是震波抵達前的時間。震度隨地點不同；震度 4 級不等於規模 4。"},{id:"bp59",t:"past",u:205,y:115,n:15,q:"阿笙某日傍晚 5 點到海邊，海水在當天最高位置。此地每天兩次滿潮、兩次乾潮。若隔日想在海水退潮期間的一半到達，選哪個時段最合適？",o:["上午 5～6 點","上午 8～9 點","上午 11～12 點","下午 2～3 點"],a:1,e:"半日潮週期約 12 小時 25 分。隔日清晨約 5 點半滿潮，約中午 12 點乾潮，退潮的一半約在 8～9 點。"},{id:"bp60",t:"past",u:203,y:115,n:26,q:"某海域東、西兩側的陸地受板塊運動影響，距離逐年增加，海域面積逐漸擴大。下列推論何者最合理？",o:["此海域底部可發現岩漿湧出形成的火成岩","此海域底部可發現地球上最古老的海洋地殼","東、西兩側的陸地目前在同一板塊上","東、西兩側的陸地之間有海溝存在"],a:0,e:"兩側分開是張裂型邊界，岩漿湧出形成新的海洋地殼（火成岩）。海溝出現在聚合型邊界。"},{id:"bp61",t:"past",u:204,y:115,n:27,adapt:true,q:"小華想用「氣溫隨高度的變化」（甲圖）與「氣壓隨高度的變化」（乙圖）來區分對流層和平流層。何者最合理？",o:["甲圖可以，因氣溫在對流層隨高度上升而降低，在平流層則不會","乙圖可以，因氣壓在對流層隨高度上升而降低，在平流層則不會","兩圖都不可以，因氣溫與氣壓在兩層皆大致固定","兩圖都可以，因氣溫與氣壓在對流層皆隨高度降低，在平流層則不會"],a:0,e:"對流層越高越冷，平流層因臭氧層吸收紫外線，越高越熱；氣壓在兩層都隨高度降低，無法區分。",fig:'<svg viewBox="0 0 300 192" role="img" aria-label="題目附圖"><path class="ax" d="M38 20 V160 H158"/><path class="ln" d="M110 160 L50 131.2 L50 112.0 L96 40.0 L70 20.80000000000001"/><path class="gr" d="M38 112 H158"/><text x="34" y="116" text-anchor="end">12</text><text x="34" y="40" text-anchor="end">50</text><text x="98" y="184" text-anchor="middle">氣溫 →</text><text x="98" y="12" text-anchor="middle" class=b>甲圖</text><path class="ax" d="M178 20 V160 H298"/><path class="ln" d="M290.0 160.0 L262.7 155.2 L242.1 150.4 L226.7 145.6 L215.1 140.8 L206.4 136.0 L199.8 131.2 L194.9 126.4 L191.2 121.6 L188.4 116.8 L186.3 112.0 L184.7 107.2 L183.6 102.4 L182.7 97.6 L182.0 92.8 L181.5 88.0 L181.1 83.2 L180.9 78.4 L180.6 73.6 L180.5 68.8 L180.4 64.0 L180.3 59.2 L180.2 54.4 L180.2 49.6 L180.1 44.8 L180.1 40.0 L180.1 35.2 L180.0 30.4 L180.0 25.6 L180.0 20.8"/><path class="gr" d="M178 112 H298"/><text x="174" y="116" text-anchor="end">12</text><text x="174" y="40" text-anchor="end">50</text><text x="238" y="184" text-anchor="middle">氣壓 →</text><text x="238" y="12" text-anchor="middle" class=b>乙圖</text><text x="6" y="90" text-anchor="start">高度</text><text x="6" y="104" text-anchor="start">(km)</text></svg>',cap:"大氣的氣溫、氣壓隨高度的變化"},{id:"bp62",t:"past",u:204,y:115,n:34,q:"某季節臺灣較乾熱，而日本、中國多暴雨。原因是天氣系統甲與北方高壓的影響，使鋒面長期停留在日本到中國間。甲與此鋒面最可能為何？",o:["甲為低氣壓，鋒面是冷鋒","甲為低氣壓，鋒面是滯留鋒","甲為高氣壓，鋒面是冷鋒","甲為高氣壓，鋒面是滯留鋒"],a:3,e:"臺灣乾熱代表受高氣壓（太平洋高壓）籠罩；長時間停留不動的鋒面是滯留鋒（梅雨鋒面）。"},{id:"bm0",t:"mine",u:101,q:"下列哪一個構造是植物細胞有、動物細胞沒有的？",o:["細胞膜","粒線體","細胞壁","細胞核"],a:2,e:"細胞壁、葉綠體、大型液胞是植物細胞特有；細胞膜、細胞核、粒線體動植物都有。"},{id:"bm1",t:"mine",u:101,q:"複式顯微鏡的目鏡為 10×、物鏡為 40×，觀察時的放大倍率為何？",o:["50 倍","400 倍","4 倍","30 倍"],a:1,e:"顯微鏡的總放大倍率＝目鏡倍率×物鏡倍率＝10×40＝400 倍。是「相乘」不是相加（50 倍）也不是相除（4 倍）。"},{id:"bm2",t:"mine",u:101,q:"在複式顯微鏡下看到的影像位於視野左上方，想把它移到視野中央，玻片應往哪個方向移動？",o:["右下方","左上方","右上方","左下方"],a:1,e:"複式顯微鏡看到的像是上下左右都顛倒的。想把左上方的影像移到中央，玻片也要往「左上方」推。口訣：影像在哪邊，玻片就往哪邊移。"},{id:"bm3",t:"mine",u:101,q:"由小到大排列生物體的組成層次，何者正確？",o:["細胞→器官→組織→系統→個體","細胞→組織→器官→系統→個體","組織→細胞→器官→系統→個體","細胞→組織→系統→器官→個體"],a:1,e:"由小到大：細胞 → 組織（相同細胞集合）→ 器官（多種組織合作）→ 系統（多個器官合作）→ 個體。器官比組織大，所以組織要在器官前面；植物沒有「系統」這一層。"},{id:"bm4",t:"mine",u:101,q:"將紅血球放入濃食鹽水中，一段時間後會發生什麼？",o:["吸水脹破","失水皺縮","形狀不變","鹽分進入細胞使其變大"],a:1,e:"水會從水多（濃度低）往水少（濃度高）的地方移動。外面鹽水較濃，水從細胞流出，紅血球皺縮。"},{id:"bm5",t:"mine",u:102,q:"在食物樣本中滴入本氏液並隔水加熱，出現紅色沉澱，表示樣本中含有什麼？",o:["澱粉","葡萄糖等還原醣","蛋白質","脂質"],a:1,e:"本氏液檢測葡萄糖（還原醣），加熱後由藍變黃、橙、紅；碘液檢測澱粉，變藍黑色。"},{id:"bm6",t:"mine",u:102,q:"關於酵素的敘述，下列何者正確？",o:["酵素的主要成分是醣類","一種酵素可以催化所有反應","溫度過高會使酵素失去活性","酵素反應後就會被消耗掉"],a:2,e:"酵素主要成分是蛋白質，具有專一性，反應後不被消耗；溫度過高或 pH 不適合會使它變性失去活性。"},{id:"bm7",t:"mine",u:102,q:"光合作用的產物是什麼？",o:["二氧化碳和水","葡萄糖和氧氣","葡萄糖和二氧化碳","氧氣和水"],a:1,e:"二氧化碳＋水 → 葡萄糖＋氧氣（需要光和葉綠體）。呼吸作用則反過來。"},{id:"bm8",t:"mine",u:102,q:"人體消化食物時，大部分的養分在哪裡被吸收？",o:["胃","小腸","大腸","食道"],a:1,e:"小腸有絨毛，表面積很大，是消化和吸收養分的主要場所；大腸主要吸收水分。"},{id:"bm9",t:"mine",u:103,q:"植物體內負責把葉子製造的養分運送到全身的構造是什麼？",o:["木質部","韌皮部","形成層","氣孔"],a:1,e:"韌皮部負責運送葉子做出來的「養分（糖）」，可以往上也可以往下送。木質部運送的是「水和礦物質」，由根往上送；形成層負責長粗；氣孔是氣體進出的地方。"},{id:"bm10",t:"mine",u:103,q:"血液中負責運送氧氣的是哪一種成分？",o:["白血球","血小板","紅血球","血漿"],a:2,e:"紅血球含有血紅素，負責運送氧氣；白血球防禦、血小板凝血、血漿運送養分與廢物。"},{id:"bm11",t:"mine",u:103,q:"下列哪一種血管的管壁最薄，是血液與組織細胞交換物質的地方？",o:["動脈","靜脈","微血管","主動脈"],a:2,e:"微血管管壁只有一層細胞，方便物質交換；動脈壁最厚、有彈性；靜脈有瓣膜防止血液倒流。"},{id:"bm12",t:"mine",u:103,q:"關於肺循環的路徑，下列何者正確？",o:["左心室→主動脈→全身→大靜脈→右心房","右心室→肺動脈→肺→肺靜脈→左心房","右心室→肺靜脈→肺→肺動脈→左心房","左心房→肺動脈→肺→肺靜脈→右心室"],a:1,e:"肺循環：右心室 → 肺動脈（缺氧血）→ 肺（換氣）→ 肺靜脈（充氧血）→ 左心房。從左心室出發經主動脈到全身的是體循環；肺動脈和肺靜脈的順序不能顛倒。"},{id:"bm13",t:"mine",u:103,q:"植物的蒸散作用主要經由哪裡把水分散失到空氣中？",o:["根毛","氣孔","形成層","韌皮部"],a:1,e:"蒸散作用主要經由葉片的氣孔進行，是植物體內水分往上運輸的主要拉力。"},{id:"bm14",t:"mine",u:104,q:"手不小心碰到很燙的鍋子立刻縮回，這個反射的中樞在哪裡？",o:["大腦","小腦","脊髓","腦幹"],a:2,e:"縮手反射的中樞在脊髓，不需經過大腦思考，所以反應很快。痛覺之後才傳到大腦。"},{id:"bm15",t:"mine",u:104,q:"負責維持身體平衡、協調肌肉運動的是腦的哪一部分？",o:["大腦","小腦","腦幹","延腦"],a:1,e:"小腦負責平衡與協調；大腦負責思考、感覺、記憶；腦幹控制呼吸、心跳等。"},{id:"bm16",t:"mine",u:104,q:"下列哪一種現象屬於植物的「向性」？",o:["含羞草被觸碰後葉片閉合","捕蠅草捕捉昆蟲","莖向光源方向彎曲生長","酢漿草晚上葉片下垂"],a:2,e:"向性是與刺激方向有關的生長反應，較慢（向光性、向地性）。其他是膨壓改變造成的快速感應運動。"},{id:"bm17",t:"mine",u:104,q:"關於激素的敘述，下列何者正確？",o:["由導管直接送到作用部位","由內分泌腺分泌，經血液運送","作用速度比神經傳導快","只要分泌越多對身體越好"],a:1,e:"內分泌腺沒有導管，激素經血液運送，作用較慢但持久；分泌過多或過少都會生病。"},{id:"bm18",t:"mine",u:105,q:"人體吸氣時，橫膈與肋骨的變化為何？",o:["橫膈上升、肋骨下降","橫膈下降、肋骨上舉","橫膈上升、肋骨上舉","橫膈下降、肋骨下降"],a:1,e:"吸氣：橫膈收縮下降、肋骨上舉，胸腔變大、壓力變小，空氣流入。呼氣則相反。"},{id:"bm19",t:"mine",u:105,q:"天氣炎熱時，人體會如何調節體溫？",o:["皮膚血管收縮、流汗減少","皮膚血管舒張、流汗增加","皮膚血管收縮、流汗增加","身體發抖產生熱量"],a:1,e:"熱的時候皮膚血管舒張讓熱散出，並流汗利用汗水蒸發帶走熱。冷的時候血管收縮、發抖產熱。"},{id:"bm20",t:"mine",u:105,q:"飯後血糖升高時，身體會分泌哪一種激素使血糖降低？",o:["升糖素","胰島素","甲狀腺素","腎上腺素"],a:1,e:"胰島素促進細胞吸收葡萄糖、使肝臟把葡萄糖轉成肝糖儲存，血糖下降。升糖素作用相反。"},{id:"bm21",t:"mine",u:105,q:"正常人的尿液中，通常「不」含有下列哪一種物質？",o:["水","尿素","無機鹽","葡萄糖"],a:3,e:"葡萄糖在腎小管會被完全再吸收回血液，正常尿液中沒有葡萄糖；若有，可能是糖尿病。"},{id:"bm22",t:"mine",u:106,q:"人體的體細胞有 46 條染色體，經減數分裂產生的精子有幾條染色體？",o:["92 條","46 條","23 條","12 條"],a:2,e:"減數分裂後染色體數目減半，精子和卵都是 23 條，受精後恢復 46 條。"},{id:"bm23",t:"mine",u:106,q:"下列哪一種繁殖方式屬於有性生殖？",o:["馬鈴薯用塊莖長出新植株","草莓用走莖繁殖","酵母菌出芽生殖","用種子播種長出新植株"],a:3,e:"種子是經過受精作用形成的，屬於有性生殖。塊莖、走莖是營養器官繁殖，出芽也是無性生殖。"},{id:"bm24",t:"mine",u:106,q:"無性生殖的子代與親代相比，下列何者正確？",o:["子代的遺傳性狀和親代幾乎相同","子代一定比親代更適應環境","子代的染色體數目是親代的一半","需要經過受精作用"],a:0,e:"無性生殖只經細胞分裂，子代遺傳物質與親代相同，能保留優良性狀，但變異少。"},{id:"bm25",t:"mine",u:106,q:"開花植物受精後，胚珠和子房分別會發育成什麼？",o:["胚珠→果實，子房→種子","胚珠→種子，子房→果實","胚珠→花瓣，子房→種子","胚珠→種子，子房→花托"],a:1,e:"花受精後：胚珠 → 種子，子房 → 果實（子房包著胚珠，果實也包著種子）。花瓣和花托通常會凋謝或留在下面，不是由胚珠或子房變來的。"},{id:"bm26",t:"mine",u:107,q:"豌豆高莖（T）對矮莖（t）為顯性。Tt 與 tt 雜交，子代高莖與矮莖的比例約為何？",o:["3：1","1：1","1：3","全部高莖"],a:1,e:"Tt × tt：T t 分別和 t 配對，得到 Tt（高）和 tt（矮）各一半，所以高：矮＝1：1。3：1 是 Tt×Tt 的結果；全部高莖需要一方是 TT。"},{id:"bm27",t:"mine",u:107,q:"一對夫妻已經生了兩個女兒，第三胎生男孩的機率是多少？",o:["1/4","1/3","1/2","3/4"],a:2,e:"每一胎都是獨立事件，由父親的精子帶 X 或 Y 決定，生男生女的機率各是 1/2。"},{id:"bm28",t:"mine",u:107,q:"父親血型 AB 型、母親血型 O 型，他們的子女可能是哪些血型？",o:["A 型或 B 型","AB 型或 O 型","A、B、AB、O 型都有可能","只有 AB 型"],a:0,e:"IAIB × ii → IAi（A 型）或 IBi（B 型），不可能是 AB 或 O 型。"},{id:"bm29",t:"mine",u:107,q:"關於人類性別的決定，下列何者正確？",o:["由母親的卵決定","由父親的精子帶 X 或 Y 決定","男性的性染色體為 XX","卵細胞可能帶 Y 染色體"],a:1,e:"女性 XX、男性 XY。卵一定帶 X，精子帶 X 或 Y，所以由精子決定性別。"},{id:"bm30",t:"mine",u:108,q:"根據達爾文的天擇說，長頸鹿的脖子為什麼會變長？",o:["長頸鹿努力伸長脖子吃樹葉，脖子就慢慢變長並遺傳給後代","族群中脖子較長的個體較容易存活並繁殖，使長脖子的特徵逐漸普遍","環境直接讓所有長頸鹿的脖子變長","長頸鹿想要長脖子，基因就跟著改變"],a:1,e:"天擇說：族群中本來就有脖子長短不同的個體（變異），脖子長的比較吃得到高處樹葉，較容易存活並留下後代，長脖子就越來越普遍。「努力伸長脖子並遺傳」是拉馬克的用進廢退說，後天改變不會遺傳。"},{id:"bm31",t:"mine",u:108,q:"分類階層由大到小排列，何者正確？",o:["界→門→綱→目→科→屬→種","界→綱→門→目→科→屬→種","界→門→目→綱→科→屬→種","種→屬→科→目→綱→門→界"],a:0,e:"分類階層由大到小：界、門、綱、目、科、屬、種，口訣「界門綱目科屬種」。綱在門的下面、目在綱的下面，順序不能交換。越往下的階層，生物越相似、親緣關係越近。"},{id:"bm32",t:"mine",u:108,q:"下列哪一種生物屬於原核生物界？",o:["草履蟲","酵母菌","大腸桿菌","香菇"],a:2,e:"細菌和藍綠菌沒有細胞核，屬原核生物；草履蟲是原生生物；酵母菌、香菇是真菌。"},{id:"bm33",t:"mine",u:108,q:"化石可以作為演化的證據，一般而言較深、較古老的地層中的生物化石有什麼特徵？",o:["構造較複雜","構造較簡單","全部是哺乳類","和現代生物完全相同"],a:1,e:"地層越深通常越古老。生物是由簡單慢慢演化成複雜的，所以越古老的地層，化石構造越簡單；越新的地層才出現較複雜的生物（例如哺乳類）。古老化石和現代生物也不會完全一樣。"},{id:"bm34",t:"mine",u:109,q:"在能量塔中，每往上一個階層，能量大約只剩多少？",o:["100%","50%","10%","1%"],a:2,e:"每一層只有約 10% 的能量傳到下一層，其餘多在呼吸作用中以熱散失，所以食物鏈通常不長。"},{id:"bm35",t:"mine",u:109,q:"在生態系中，負責把動植物屍體分解成無機物、讓物質回到環境中的是哪一類生物？",o:["生產者","初級消費者","高級消費者","分解者"],a:3,e:"分解者（細菌、真菌）分解有機物，使碳、氮等物質能在生態系中循環。"},{id:"bm36",t:"mine",u:109,q:"在碳循環中，下列哪一個過程會把大氣中的二氧化碳轉變成有機物？",o:["呼吸作用","燃燒化石燃料","光合作用","分解作用"],a:2,e:"光合作用把 CO₂ 固定成葡萄糖；呼吸、燃燒、分解都會把碳以 CO₂ 釋放回大氣。"},{id:"bm37",t:"mine",u:109,q:"某地區所有的生物與牠們的環境合起來稱為什麼？",o:["族群","群集","生態系","生物圈"],a:2,e:"同種生物＝族群；同地所有生物＝群集；群集＋環境＝生態系；地球上所有生態系＝生物圈。"},{id:"bm38",t:"mine",u:201,q:"地球上的水大部分存在於哪裡？",o:["冰川","地下水","海洋","河流湖泊"],a:2,e:"約 97% 的水是海水；淡水只占約 3%，其中大部分是冰川，人類容易取用的很少。"},{id:"bm39",t:"mine",u:201,q:"河流在上游山區最主要的作用是什麼，常形成什麼地形？",o:["沉積作用，形成三角洲","侵蝕作用，形成 V 形谷","搬運作用，形成沙洲","沉積作用，形成沖積扇"],a:1,e:"上游坡度大、流速快，以向下侵蝕為主，形成 V 形谷；下游流速變慢，以沉積為主，形成三角洲。"},{id:"bm40",t:"mine",u:201,q:"河流流出山谷進入平原時，因坡度突然變緩而堆積形成的扇狀地形稱為什麼？",o:["三角洲","沖積扇","海蝕平臺","沙嘴"],a:1,e:"山谷出口坡度變緩，流速減慢，泥沙堆積成沖積扇；河口的堆積才是三角洲。"},{id:"bm41",t:"mine",u:201,q:"臺灣西南沿海常發生地層下陷，主要原因是什麼？",o:["地震頻繁","超抽地下水","海水侵蝕","河流沉積"],a:1,e:"西南沿海養殖業大量抽地下水，地底含水層的水被抽走後，土層被壓密變薄，地面就慢慢往下沉（地層下陷），淹水更嚴重。地震、海水侵蝕、河流沉積都不是主要原因。"},{id:"bm42",t:"mine",u:202,q:"花岡岩是岩漿在地底深處慢慢冷卻形成的，屬於哪一類岩石？",o:["沉積岩","變質岩","火成岩（深成岩）","火成岩（火山岩）"],a:2,e:"在地底慢慢冷卻的是深成岩，晶體顆粒大（花岡岩）；噴出地表快速冷卻的是火山岩（玄武岩、安山岩）。"},{id:"bm43",t:"mine",u:202,q:"下列哪一種岩石最可能找到化石？",o:["玄武岩","花岡岩","頁岩","大理岩"],a:2,e:"化石多保存在沉積岩中（頁岩、砂岩、石灰岩）。火成岩由岩漿形成，變質岩經高溫高壓，都不易保存化石。"},{id:"bm44",t:"mine",u:202,q:"地層沒有倒轉時，判斷地層新舊的原則為何？",o:["上面的較老，下面的較新","下面的較老，上面的較新","厚的較老，薄的較新","顏色深的較老"],a:1,e:"疊置定律：先沉積的在下面，越上面越新。被岩脈或斷層切過的岩層，比岩脈、斷層更老。"},{id:"bm45",t:"mine",u:202,q:"岩層受張力作用，上盤相對下滑，形成的斷層稱為什麼？",o:["正斷層","逆斷層","平移斷層","褶皺"],a:0,e:"張力 → 正斷層（上盤下滑）；擠壓 → 逆斷層（上盤上升）；水平錯動 → 平移斷層。"},{id:"bm46",t:"mine",u:202,q:"石灰岩受高溫高壓作用後，會變成哪一種岩石？",o:["板岩","大理岩","片麻岩","砂岩"],a:1,e:"石灰岩 → 大理岩；頁岩 → 板岩；砂岩 → 石英岩；花岡岩 → 片麻岩。"},{id:"bm47",t:"mine",u:203,q:"關於地震波的敘述，下列何者正確？",o:["S 波速度比 P 波快","P 波可在固體、液體、氣體中傳播","S 波可以通過液態外核","地震時一定先感受到左右搖晃"],a:1,e:"P 波（縱波）最快、可在各種介質傳播，先到，造成上下跳動；S 波（橫波）較慢，只能在固體中傳播，造成左右搖晃。"},{id:"bm48",t:"mine",u:203,q:"關於地震規模與震度，下列何者正確？",o:["一次地震有一個規模、各地震度可能不同","一次地震各地規模都不同","震度越大代表地震釋放的能量一定越大","震度與距離震央遠近無關"],a:0,e:"規模表示地震釋放的總能量，一次地震只有一個；震度是各地搖晃程度，一般離震央越遠越小。"},{id:"bm49",t:"mine",u:203,q:"臺灣位於哪兩個板塊的交界，屬於哪一種邊界？",o:["歐亞板塊與菲律賓海板塊，聚合型","太平洋板塊與北美板塊，張裂型","歐亞板塊與印澳板塊，錯動型","菲律賓海板塊與太平洋板塊，張裂型"],a:0,e:"臺灣在歐亞板塊與菲律賓海板塊的聚合型邊界上，擠壓造山，所以山多、地震多。"},{id:"bm50",t:"mine",u:203,q:"支持「海底擴張說」的證據之一是什麼？",o:["離中洋脊越遠，海洋地殼年齡越老","離中洋脊越遠，海洋地殼年齡越年輕","中洋脊附近的岩石最古老","海洋地殼比大陸地殼老"],a:0,e:"岩漿在中洋脊湧出形成新地殼，再往兩側推開，所以越靠中洋脊越年輕，越遠越老，兩側對稱。"},{id:"bm51",t:"mine",u:204,q:"風的形成主要原因是什麼？",o:["地球自轉","兩地之間的氣壓差","雲的移動","海水的流動"],a:1,e:"空氣會從氣壓高的地方流向氣壓低的地方，這種空氣流動就是風。兩地氣壓差越大，風越強（天氣圖上等壓線越密）。地球自轉只會改變風的方向，不是形成風的原因。"},{id:"bm52",t:"mine",u:204,q:"白天在海邊感受到的海風，是從哪裡吹向哪裡，為什麼？",o:["陸地吹向海洋，因陸地氣壓較低","海洋吹向陸地，因陸地增溫快、氣壓較低","海洋吹向陸地，因海洋增溫快","陸地吹向海洋，因海洋比熱小"],a:1,e:"白天陸地比熱小、增溫快，空氣上升形成低壓，風從海洋（高壓）吹向陸地；晚上相反吹陸風。"},{id:"bm53",t:"mine",u:204,q:"冷鋒通過後，當地天氣通常會有什麼變化？",o:["氣溫上升、氣壓下降","氣溫下降、氣壓上升","氣溫上升、氣壓上升","天氣沒有變化"],a:1,e:"冷鋒過境時常有短暫陣雨，之後被冷氣團籠罩，氣溫下降、氣壓上升、天氣轉晴。"},{id:"bm54",t:"mine",u:204,q:"臺灣每年五、六月的梅雨，主要是受到哪一種鋒面影響？",o:["冷鋒","暖鋒","滯留鋒","囚錮鋒"],a:2,e:"冷暖氣團勢力相當，鋒面停留在臺灣附近徘徊，形成滯留鋒，帶來連續降雨。"},{id:"bm55",t:"mine",u:204,q:"北半球颱風地面的風向與中心氣流為何？",o:["順時針向外吹，中心下沉","逆時針向內吹，中心上升","順時針向內吹，中心上升","逆時針向外吹，中心下沉"],a:1,e:"颱風是強烈的低氣壓，北半球地面風逆時針向中心吹入，氣流在中心附近上升（颱風眼則下沉）。高氣壓則順時針向外吹。"},{id:"bm56",t:"mine",u:205,q:"一光年是什麼單位？",o:["時間單位","距離單位","速度單位","亮度單位"],a:1,e:"光年是光在一年中走的距離，是距離單位，約 9.46×10¹² 公里。"},{id:"bm57",t:"mine",u:205,q:"臺灣在一年中哪一天正午太陽的仰角最大、白天最長？",o:["春分","夏至","秋分","冬至"],a:1,e:"夏至（約 6/21）太陽直射北回歸線，臺灣正午太陽最高、晝最長；冬至相反。"},{id:"bm58",t:"mine",u:205,q:"農曆初七、初八左右看到的月相是什麼，何時出現在正南方天空？",o:["上弦月，傍晚","下弦月，傍晚","上弦月，清晨","滿月，午夜"],a:0,e:"上弦月（亮面在右/西邊）傍晚在南方天空，半夜西沉；下弦月（約廿二、廿三）清晨在南方。"},{id:"bm59",t:"mine",u:205,q:"發生月食時，太陽、地球、月球的排列與當天月相為何？",o:["月球在中間，新月","地球在中間，滿月","太陽在中間，上弦月","月球在中間，滿月"],a:1,e:"月食：地球在中間擋住陽光，月球進入地球影子，只會發生在滿月（農曆十五左右）。日食則是月球在中間、新月。"},{id:"bm60",t:"mine",u:205,q:"造成潮汐的主要原因是什麼？",o:["風吹海面","地球自轉的離心力與月球、太陽的引力","海底地震","河水流入海洋"],a:1,e:"主要是月球引力（太陽也有影響）。大多數地方一天兩次滿潮、兩次乾潮，每次約晚 50 分鐘。"},{id:"bm61",t:"mine",u:206,q:"下列哪一種氣體是造成溫室效應最主要的人為溫室氣體？",o:["氧氣","氮氣","二氧化碳","氬氣"],a:2,e:"燃燒化石燃料大量排放二氧化碳，是人為溫室效應的主因；甲烷、一氧化二氮也是溫室氣體。"},{id:"bm62",t:"mine",u:206,q:"聖嬰現象發生時，赤道太平洋海水溫度的變化為何？",o:["東太平洋（南美洲沿岸）海水溫度異常升高","西太平洋海水溫度異常升高","全太平洋海水溫度都下降","海水溫度沒有變化"],a:0,e:"聖嬰現象：信風減弱，東太平洋海水異常變暖，南美洲多雨、澳洲印尼乾旱。反聖嬰則東太平洋變冷。"},{id:"bm63",t:"mine",u:206,q:"下列哪一種發電方式屬於再生能源，且發電過程幾乎不排放二氧化碳？",o:["燃煤發電","燃氣發電","太陽能發電","燃油發電"],a:2,e:"太陽能、風力、水力、地熱是再生能源，發電時幾乎不排碳。燃煤、燃氣、燃油都是化石燃料。"},{id:"bm64",t:"mine",u:206,q:"全球暖化可能造成的影響，下列何者「最不」合理？",o:["海平面上升","極端天氣增加","冰川融化","全球所有地區的降雨都平均增加"],a:3,e:"暖化會使降雨分布更不均，有的地方更乾旱、有的更易淹水，不是所有地方平均增加。"},{id:"pr0",t:"mine",set:"prac",d:"b",u:1,q:"一塊金屬質量 54 g、體積 20 cm³，它的密度是多少？",o:["2.7 g/cm³","0.37 g/cm³","1080 g/cm³","34 g/cm³"],a:0,e:"密度＝質量÷體積。D＝54 g÷20 cm³＝2.7 g/cm³（就是鋁的密度）。選 0.37 是把體積÷質量算反了；1080 是相乘。"},{id:"pr1",t:"mine",set:"prac",d:"b",u:1,q:"把 30 g 食鹽溶在 120 g 水中，重量百分濃度是多少？",o:["20%","25%","30%","15%"],a:0,e:"濃度＝30÷(30＋120)×100%＝20%。分母是溶液 150 g，不是水 120 g。"},{id:"pr2",t:"mine",set:"prac",d:"b",u:1,q:"下列哪一種方法最適合把泥沙和水分開？",o:["過濾","蒸餾","層析","結晶"],a:0,e:"泥沙「不溶於水」，用濾紙過濾，泥沙會被留在濾紙上，水流下去，就分開了。蒸餾是分開溶在水裡的東西（如鹽水）；層析分開色素；結晶是讓溶質析出。"},{id:"pr3",t:"mine",set:"prac",d:"b",u:1,q:"一個物體密度 0.8 g/cm³，放進水中會怎樣？",o:["浮在水面","沉到水底","懸在水中任意位置","先浮後沉"],a:0,e:"浮沉看密度：物體密度比液體小就浮，比液體大就沉。水的密度是 1 g/cm³，0.8＜1，所以浮在水面上。只有密度剛好等於 1 才會懸在水中。"},{id:"pr4",t:"mine",set:"prac",d:"b",u:1,q:"下列哪一個是化學變化？",o:["鐵釘生鏽","冰塊熔化","糖溶於水","酒精揮發"],a:0,e:"化學變化會產生「新的物質」。鐵生鏽變成氧化鐵，是新物質，屬於化學變化。冰熔化、酒精揮發只是狀態改變；糖溶於水只是混合，糖還是糖，這些都是物理變化。"},{id:"pr5",t:"mine",set:"prac",d:"c",u:1,q:"200 g 的 25% 糖水，要稀釋成 10%，需要再加多少 g 的水？",o:["300 g","200 g","250 g","500 g"],a:0,e:"糖＝200×25%＝50 g。稀釋後總重＝50÷10%＝500 g，要加 500−200＝300 g 水。"},{id:"pr6",t:"mine",set:"prac",d:"c",u:1,q:"某物質 60℃ 時溶解度 80 g/100 g 水，20℃ 時 30 g/100 g 水。把 60℃ 的飽和溶液 360 g 降到 20℃，析出多少 g？",o:["100 g","50 g","80 g","180 g"],a:0,e:"飽和溶液 180 g 含水 100 g、溶質 80 g；360 g 含水 200 g。析出＝(80−30)×2＝100 g。"},{id:"pr7",t:"mine",set:"prac",d:"c",u:1,q:"木塊密度 0.6 g/cm³ 浮在水面，它在水面下的體積占全部的幾成？",o:["6 成","4 成","10 成","5 成"],a:0,e:"浮體在液面下的體積比例＝物體密度÷液體密度＝0.6÷1＝0.6。"},{id:"pr8",t:"mine",set:"prac",d:"c",u:1,q:"一瓶 500 g 的溶液含某物質 2 mg，濃度是多少 ppm？",o:["4 ppm","0.4 ppm","40 ppm","2 ppm"],a:0,e:"ppm＝溶質÷溶液×10⁶＝0.002 g÷500 g×10⁶＝4 ppm。"},{id:"pr9",t:"mine",set:"prac",d:"c",u:1,q:"量筒原有水 30 mL，放入一顆 26 g 的石頭後水面到 40 mL。下列推論何者正確？",o:["石頭密度 2.6 g/cm³，若換成同材質 52 g 的石頭，密度不變","石頭密度 0.87 g/cm³","石頭越大密度越大","石頭體積是 40 cm³"],a:0,e:"體積＝40−30＝10 cm³，密度＝26÷10＝2.6 g/cm³。密度是物質特性，和多少無關。"},{id:"pr10",t:"mine",set:"prac",d:"b",u:2,q:"聲音在下列哪一種環境中無法傳播？",o:["真空","水中","鐵軌中","空氣中"],a:0,e:"聲音是靠物質（介質）振動一個傳一個傳出去的，需要介質。水、鐵軌、空氣都是介質，可以傳聲；真空裡沒有任何物質，所以聲音無法傳播（太空中聽不到聲音）。"},{id:"pr11",t:"mine",set:"prac",d:"b",u:2,q:"某波頻率 5 Hz、波長 2 m，波速是多少？",o:["10 m/s","2.5 m/s","0.4 m/s","7 m/s"],a:0,e:"波速＝頻率×波長，v＝f×λ＝5×2＝10 m/s。選 2.5 是相除、7 是相加，都不對。"},{id:"pr12",t:"mine",set:"prac",d:"b",u:2,q:"分辨出電話裡是媽媽的聲音，是靠聲音的哪一個要素？",o:["音色","響度","音調","頻率"],a:0,e:"每個人的聲帶不一樣，發出的聲音「波形」不同，這就是音色。靠音色才能分辨是誰的聲音、是什麼樂器。響度是大小聲，音調（頻率）是高低音。"},{id:"pr13",t:"mine",set:"prac",d:"b",u:2,q:"下列哪一種波是縱波？",o:["聲波","繩波","水面波的上下振動","光波"],a:0,e:"縱波：介質振動方向和波前進方向「平行」，會形成疏密相間，聲波就是。繩波、水面上下振動的波是橫波（振動方向和前進方向垂直）；光波是電磁波，也是橫波。"},{id:"pr14",t:"mine",set:"prac",d:"b",u:2,q:"週期 0.2 秒的波，頻率是多少？",o:["5 Hz","0.2 Hz","2 Hz","20 Hz"],a:0,e:"頻率和週期互為倒數：f＝1÷T＝1÷0.2＝5 Hz，意思是 1 秒振動 5 次。0.2 Hz 是把週期當頻率；不要搞混。"},{id:"pr15",t:"mine",set:"prac",d:"c",u:2,q:"對著山谷大喊，1.2 秒後聽到回聲，聲速 340 m/s，人到山壁的距離約多少？",o:["204 m","408 m","340 m","102 m"],a:0,e:"1.2 秒是聲音「去山壁再回來」的總時間。總路程＝340×1.2＝408 m，人到山壁只是單程，要除以 2：408÷2＝204 m。選 408 m 是忘了除以 2。"},{id:"pr16",t:"mine",set:"prac",d:"c",u:2,q:"將吉他弦拉得更緊後再撥，聲音會怎麼變化？",o:["頻率變高，音調變高","振幅變大，響度變大","頻率變低，音調變低","波形改變，音色不同"],a:0,e:"弦拉得越緊，振動越快，頻率越高，音調就越高。響度看振幅（撥的力氣大小），音色看波形（樂器種類），都不是因為弦變緊。"},{id:"pr17",t:"mine",set:"prac",d:"c",u:2,q:"同一個音叉在空氣中發出的聲波傳入水中，下列何者不變？",o:["頻率","波速","波長","傳播方向一定不變"],a:0,e:"頻率由發聲體決定，進入不同介質時不變；波速改變，波長也跟著改變。"},{id:"pr18",t:"mine",set:"prac",d:"c",u:2,q:"超聲波產檢時，人耳聽不到它的原因是什麼？",o:["頻率高於 20000 Hz","速度太快","振幅太小","不需要介質"],a:0,e:"人耳只能聽到大約 20～20000 Hz 的聲音。超聲波的頻率超過 20000 Hz，太高了，所以聽不到。超聲波在人體中的速度和一般聲音差不多，也需要介質，和聽不到無關。"},{id:"pr19",t:"mine",set:"prac",d:"c",u:2,q:"氣溫升高時，聲音在空氣中的傳播有什麼變化？",o:["聲速變快","聲速變慢","頻率變高","聲速不變"],a:0,e:"空氣溫度越高，空氣分子動得越快，聲音傳得越快。空氣中聲速約為 331＋0.6×氣溫（m/s）。頻率是由發聲體決定的，不會因為氣溫改變。"},{id:"pr20",t:"mine",set:"prac",d:"b",u:3,q:"一道光射向平面鏡，入射角是 35°。入射光和反射光之間的夾角是多少？",o:["70°","35°","55°","110°"],a:0,e:"反射定律：反射角＝入射角＝35°。入射光和反射光分別在法線兩側，各和法線夾 35°，所以兩條光線的夾角＝35°＋35°＝70°。選 55° 是 90°−35°，那是光線和鏡面的夾角。"},{id:"pr21",t:"mine",set:"prac",d:"b",u:3,q:"人站在平面鏡前 2 m，人和鏡中的像相距多少？",o:["4 m","2 m","1 m","0 m"],a:0,e:"平面鏡的像和人到鏡子的距離一樣：人在鏡前 2 m，像就在鏡後 2 m。人和像相距 2＋2＝4 m。選 2 m 是只算到鏡子的距離。"},{id:"pr22",t:"mine",set:"prac",d:"b",u:3,q:"汽車後照鏡常用哪一種鏡子來擴大視野？",o:["凸面鏡","凹面鏡","平面鏡","凸透鏡"],a:0,e:"凸面鏡成「正立、縮小的虛像」，像縮小了，鏡子裡能看到的範圍就變大，所以後照鏡、路口反光鏡用凸面鏡。凹面鏡會聚光；平面鏡視野普通；凸透鏡是透鏡不是鏡子。"},{id:"pr23",t:"mine",set:"prac",d:"b",u:3,q:"在只有紅光照射的房間裡，一件綠色衣服看起來是什麼顏色？",o:["黑色","綠色","紅色","白色"],a:0,e:"綠色衣服只反射綠光，其他顏色的光都被吸收。房間只有紅光，紅光照到綠衣服被吸收掉，沒有光反射進眼睛，所以看起來是黑色。"},{id:"pr24",t:"mine",set:"prac",d:"b",u:3,q:"近視眼鏡使用的是哪一種透鏡？",o:["凹透鏡","凸透鏡","凹面鏡","平面玻璃"],a:0,e:"近視是像落在視網膜「前面」。凹透鏡會讓光線發散，把成像往後推到視網膜上，所以近視戴凹透鏡。遠視（老花）才戴凸透鏡；凹面鏡是反射用的鏡子。"},{id:"pr25",t:"mine",set:"prac",d:"c",u:3,q:"凸透鏡焦距 10 cm，物體放在透鏡前 30 cm（兩倍焦距以外），成像的性質為何？",o:["倒立、縮小的實像","倒立、放大的實像","正立、放大的虛像","不成像"],a:0,e:"2f＝20 cm，物體在 30 cm，在兩倍焦距以外，成像在另一側 f 與 2f 之間，是倒立、縮小的實像，照相機就是這個原理。物體在 f 與 2f 之間才會放大；在 f 以內才是正立虛像。"},{id:"pr26",t:"mine",set:"prac",d:"c",u:3,q:"白光通過三稜鏡後，哪一種色光偏折最多？",o:["紫光","紅光","綠光","黃光"],a:0,e:"白光通過三稜鏡會分成紅橙黃綠藍靛紫。紫光的折射率最大，偏折最多，在最下面；紅光偏折最少。口訣：紫光最會轉彎。"},{id:"pr27",t:"mine",set:"prac",d:"c",u:3,q:"光從水中斜射入空氣時，下列敘述何者正確？",o:["折射角大於入射角，入射角夠大時可能全反射","折射角小於入射角","光一定會全反射","光的頻率改變"],a:0,e:"光從水（密）進入空氣（疏）時，折射光會「偏離法線」，所以折射角大於入射角。入射角大到超過臨界角時，光完全被反射回水中，叫全反射。光的頻率在折射時不會改變。"},{id:"pr28",t:"mine",set:"prac",d:"c",u:3,q:"針孔成像時，把針孔由圓形改成三角形，屏上的像會如何？",o:["形狀不變，仍是物體倒立的像","變成三角形","變成正立的像","看不到像"],a:0,e:"針孔成像是光「直線前進」造成的，屏上看到的是物體倒立的像，像的形狀由物體決定，不是由孔的形狀決定（孔夠小時）。所以改成三角形孔，像還是物體的倒立像。"},{id:"pr29",t:"mine",set:"prac",d:"c",u:3,q:"放大鏡觀察時，物體應放在凸透鏡的哪裡？",o:["焦點以內","兩倍焦距以外","焦點與兩倍焦距之間","剛好在焦點上"],a:0,e:"放大鏡就是凸透鏡。物體放在「焦點以內」（離透鏡比焦距近），才會看到正立、放大的虛像。放在焦點外會成倒立實像；剛好在焦點上不成像。"},{id:"pr30",t:"mine",set:"prac",d:"b",u:4,q:"25℃ 等於多少 K？",o:["298 K","248 K","25 K","77 K"],a:0,e:"絕對溫度 K＝℃＋273。25＋273＝298 K。選 248 是減 273 的錯誤方向；77 是華氏溫度。"},{id:"pr31",t:"mine",set:"prac",d:"b",u:4,q:"100 g 的水從 20℃ 加熱到 50℃，吸收多少熱量？",o:["3000 cal","5000 cal","2000 cal","300 cal"],a:0,e:"H＝m×s×ΔT。m＝100 g，水比熱 s＝1，ΔT＝50−20＝30℃。H＝100×1×30＝3000 cal。選 5000 是誤把末溫 50 當成溫度變化。"},{id:"pr32",t:"mine",set:"prac",d:"b",u:4,q:"太陽的熱傳到地球，主要靠哪一種方式？",o:["輻射","傳導","對流","蒸發"],a:0,e:"太陽和地球之間是幾乎沒有物質的太空（真空）。傳導和對流都需要物質，只有「輻射」不需要介質，所以太陽的熱靠輻射傳到地球。"},{id:"pr33",t:"mine",set:"prac",d:"b",u:4,q:"煮開水時，
