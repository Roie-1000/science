dle">\n   ${[["已知克數",70],["已知莫耳",210],["所求莫耳",350],["所求克數",490]].map(([t,e],a)=>`<rect x="${e-50}" y="34" width="100" height="44" rx="22" fill="${a===1||a===2?"var(--sc)":"none"}" opacity="${a===1||a===2?.25:1}" stroke="var(--sc)" stroke-width="2.5"/><text x="${e}" y="62" fill="var(--ink)" font-size="15" font-weight="900">${t}</text>`).join("")}\n   <path d="M122 56 H156" stroke="var(--ink)" stroke-width="3" marker-end="url(#ah)"/><path d="M262 56 H296" stroke="var(--ink)" stroke-width="3" marker-end="url(#ah)"/><path d="M402 56 H436" stroke="var(--ink)" stroke-width="3" marker-end="url(#ah)"/>\n   <text x="140" y="104" fill="var(--muted)" font-size="12">÷ 分子量</text><text x="280" y="104" fill="var(--bad)" font-size="13" font-weight="700">× 係數比</text><text x="420" y="104" fill="var(--muted)" font-size="12">× 分子量</text></g></svg>\n   <figcaption>圖 3　係數比只能用在「莫耳」這一層。</figcaption></figure>\n  <p>例：2H₂＋O₂ → 2H₂O，4 g 氫氣要多少氧氣？</p>\n  <ol class="pts"><li>4 g ÷ 2 ＝ 2 mol H₂</li><li>係數比 H₂：O₂＝2：1 → O₂ 要 1 mol</li><li>1 mol × 32 ＝ <b>32 g</b></li></ol>`,side:[["易錯","係數比是莫耳數比，不是質量比。題目只給克數，一定要先換成莫耳。（115 會考第 19 題）"],["解題步驟","克 → 莫耳 → 係數比 → 克。"]],ex:"m24",exNote:["H₂ 分子量 2 → 4 g÷2＝2 mol。","係數比 H₂：O₂＝2：1 → 需要 O₂ 1 mol。","O₂ 分子量 32 → 1×32＝32 g。"],pr:"pr55"},{t:"反應熱與實驗室製氣",star:"★★",main:`<p>化學反應會伴隨能量變化。<b>放熱反應</b>會讓周圍變熱（燃燒、生石灰加水），<b>吸熱反應</b>會讓周圍變冷（硝酸銨溶於水、冷敷袋）。</p>\n  <p>例：自熱罐、虎門銷煙都用到 <b>CaO＋H₂O → Ca(OH)₂</b>，大量放熱。</p>\n  <div class="cmp"><table><thead><tr><th>要製造</th><th>用什麼反應</th><th>怎麼檢驗</th></tr></thead><tbody>\n   <tr><th>氧氣 O₂</th><td>雙氧水分解（加二氧化錳當催化劑）</td><td>讓餘燼的線香<b>復燃</b></td></tr>\n   <tr><th>二氧化碳 CO₂</th><td>大理石（碳酸鈣）＋稀鹽酸</td><td>使澄清石灰水<b>變混濁</b></td></tr>\n   <tr><th>氫氣 H₂</th><td>鋅或鎂＋稀鹽酸</td><td>點火有<b>爆鳴聲</b></td></tr></tbody></table></div>`,side:[["易錯","CaO 加水生成的是氫氧化鈣 Ca(OH)₂，不是碳酸鈣。"],["口訣","雙氧出氧、石酸出碳、金屬加酸出氫。"]],ex:"p67",exNote:["要 O₂：雙氧水分解。","要 CO₂：鹽酸＋碳酸鈣。","鹽酸＋鎂帶產生的是 H₂，不是 O₂ 或 CO₂。所以依序是雙氧水、碳酸鈣 → D。"],pr:"p6"}],end:["p3","p30","p60","m27","pr56","pr59"],sumT:"計量題一次整理",sumH:["","怎麼算","例子","最常錯"],summary:[["分子量","原子量相加","CO₂＝12＋32＝44","原子個數漏乘"],["莫耳數","克 ÷ 分子量","88 g CO₂＝2 mol","直接拿克數比"],["粒子數","莫耳 × 6×10²³","1 mol 水＝6×10²³ 個","分子數和原子數搞混"],["係數比","＝莫耳比＝分子數比","2H₂：O₂＝2：1","當成質量比"]]};REF[7]={intro:"把氧化還原想成一場<b>「搶氧大賽」</b>：搶到氧的叫<b>被氧化</b>，被搶走氧的叫<b>被還原</b>，兩件事一定同時發生。誰搶得贏？看<b>活性</b>。會考每年至少 1 題，常藏在銀針試毒、煉鐵、防鏽這些生活情境裡。",map:mkMap("氧化還原反應",[["定義","得氧・失氧","★★★",[["氧化",""],["還原",""]]],["活性大小","誰比較會搶氧","★★★"],["金屬置換","活性大換出活性小","★★"],["煉鐵與冶金","CO・H₂ 當還原劑","★★"],["生活應用","防鏽・漂白・試毒","★★"]]),table:[["氧化與還原的定義","★★★","113-23"],["活性大小","★★★","111-41、115-50"],["金屬與鹽類溶液的置換","★★","課本基本題"],["煉鐵與冶金","★★","113-23"],["防鏽、漂白、試毒","★★","111-3、112-26、114-28"]],cs:[{t:"氧化與還原：搶氧大賽",star:"★★★",main:`<p>物質<b>得到氧</b>叫<b>氧化</b>（燃燒、生鏽）；物質<b>失去氧</b>叫<b>還原</b>。一個得到，另一個就一定失去，所以氧化和還原<b>一定同時發生</b>。</p>\n  <figure class="dg"><svg viewBox="0 -24 560 194" role="img" aria-label="氧化銅被氫氣還原">${AH}\n   <g font-family="Noto Sans TC,sans-serif" text-anchor="middle"><text x="70" y="70" fill="var(--ink)" font-size="22" font-weight="900">CuO</text><text x="140" y="70" fill="var(--ink)" font-size="22">＋</text><text x="200" y="70" fill="var(--ink)" font-size="22" font-weight="900">H₂</text>\n   <path d="M245 62 H305" stroke="var(--ink)" stroke-width="3" marker-end="url(#ah)"/>\n   <text x="360" y="70" fill="var(--ink)" font-size="22" font-weight="900">Cu</text><text x="415" y="70" fill="var(--ink)" font-size="22">＋</text><text x="480" y="70" fill="var(--ink)" font-size="22" font-weight="900">H₂O</text>\n   <path d="M80 82 Q220 150 350 82" stroke="var(--earth)" stroke-width="2.5" fill="none" marker-end="url(#ah)"/><text x="215" y="150" fill="var(--earth-k)" font-size="14" font-weight="700">CuO 失去氧：被還原</text>\n   <path d="M205 40 Q340 -10 470 40" stroke="var(--bad)" stroke-width="2.5" fill="none" marker-end="url(#ah)"/><text x="340" y="-6" fill="var(--bad)" font-size="14" font-weight="700">H₂ 得到氧：被氧化</text></g></svg>\n   <figcaption>圖 1　氫氣搶走氧化銅的氧：H₂ 被氧化，CuO 被還原。</figcaption></figure>\n  <div class="cmp"><table><thead><tr><th></th><th>自己發生的事</th><th>對別人做的事（角色）</th></tr></thead><tbody>\n   <tr><th>搶到氧的（H₂）</th><td><b>被氧化</b></td><td>讓別人被還原 → <b>還原劑</b></td></tr><tr><th>被搶走氧的（CuO）</th><td><b>被還原</b></td><td>讓別人被氧化 → <b>氧化劑</b></td></tr></tbody></table></div>`,side:[["口訣","得氧被氧化，是還原劑；失氧被還原，是氧化劑。角色和自己發生的事剛好相反。"],["延伸","氧化也可以說成「失去電子」，還原是「得到電子」。"]],ex:"p36",exNote:["氫和氧結合變成水 → 氫得到氧 → 被氧化。","金屬氧化物失去氧變成純金屬 → 被還原。","有氧化也有還原，所以是氧化還原反應，A 對。這和酸鹼中和無關。"],pr:"pr66"},{t:"活性大小：誰比較會搶氧",star:"★★★",main:`<p>不同元素「搶氧」的本事不一樣，這叫<b>活性</b>（對氧的活性）。活性越大越活潑，越容易被氧化，也越難從氧化物裡還原出來。</p>\n  <figure class="dg"><svg viewBox="0 0 600 140" role="img" aria-label="活性大小順序">${AH}\n   <g font-family="Noto Sans TC,sans-serif" text-anchor="middle">\n   ${["K","Na","Ba","Ca","Mg","Al","C","Zn","Cr","Fe","Sn","Pb","H","Cu","Hg","Ag","Pt","Au"].map((t,e)=>{const a=22+e*31.5,i=t==="C"||t==="H";return`<text x="${a}" y="70" fill="${i?"var(--bad)":"var(--ink)"}" font-size="${i?17:15}" font-weight="900">${t}</text>`}).join("")}\n   <path d="M20 95 H580" stroke="var(--sc)" stroke-width="3" marker-start="url(#ah)"/><text x="40" y="120" text-anchor="start" fill="var(--accent)" font-size="13" font-weight="700">活性大：越會搶氧，越難煉出來</text><text x="580" y="120" text-anchor="end" fill="var(--muted)" font-size="13">活性小：不易生鏽（金、銀）</text>\n   <text x="211" y="40" fill="var(--bad)" font-size="12">碳</text><text x="400" y="40" fill="var(--bad)" font-size="12">氫</text></g></svg>\n   <figcaption>圖 2　碳和氫雖然不是金屬，也放進來比，因為它們常拿來搶金屬氧化物的氧。</figcaption></figure>\n  <p class="law"><span>判斷規則</span>活性<em>大的</em>可以搶走活性<em>小的</em>的氧。反過來就不會反應。</p>\n  <p>例：鎂在二氧化碳中還能燃燒：2Mg＋CO₂ → 2MgO＋C，表示<b>鎂比碳會搶氧</b>。鐵比碳小，所以鐵粉搶不走 CO₂ 的氧。</p>`,side:[["記法","鉀鈉鋇鈣鎂鋁碳，鋅鉻鐵錫鉛氫，銅汞銀鉑金。"],["易錯","鐵的活性比碳小，鐵粉不會和 CO₂ 反應。（115 會考第 50 題）"],["易錯","氮氣「活性小」所以用來防氧化，不是因為密度或沸點。（111 會考第 3 題）"]],ex:"m31",exNote:["2Mg＋CO₂ → 2MgO＋C：鎂把 CO₂ 的氧搶走了。","搶得贏 → 鎂對氧的活性比碳大。","碳失去氧被還原；CO₂ 沒有可燃性，只是被鎂搶氧。"],pr:"pr64"},{t:"金屬置換：活潑的趕走不活潑的",star:"★★",main:`<p>把金屬放進另一種金屬的鹽類溶液，如果<b>放進去的金屬比較活潑</b>，就會把溶液裡的金屬「趕出來」，自己溶進去。</p>\n  <figure class="dg"><svg viewBox="0 0 520 200" role="img" aria-label="鐵釘放入硫酸銅溶液">\n   <g font-family="Noto Sans TC,sans-serif"><path d="M140 40 V170 Q140 185 155 185 H285 Q300 185 300 170 V40" stroke="var(--ink)" stroke-width="3" fill="none"/>\n   <rect x="142" y="70" width="156" height="113" fill="var(--earth)" opacity=".35"/>\n   <rect x="212" y="20" width="16" height="150" rx="3" fill="var(--muted)"/>\n   ${[90,110,130,150].map(t=>`<circle cx="210" cy="${t}" r="4" fill="var(--bad)"/><circle cx="230" cy="${t+8}" r="4" fill="var(--bad)"/>`).join("")}\n   <text x="320" y="70" fill="var(--ink)" font-size="14" font-weight="700">鐵釘表面：析出紅色的銅</text><text x="320" y="100" fill="var(--earth-k)" font-size="14" font-weight="700">藍色溶液：顏色變淡</text><text x="320" y="130" fill="var(--muted)" font-size="13">（Cu²⁺ 變少、Fe²⁺ 變多）</text>\n   <text x="320" y="170" fill="var(--ink)" font-size="14" font-weight="700">Fe＋CuSO₄ → FeSO₄＋Cu</text></g></svg>\n   <figcaption>圖 3　鐵比銅活潑，把銅從硫酸銅中置換出來。</figcaption></figure>\n  <ol class="pts"><li>鐵失去電子變成 Fe²⁺ → <b>鐵被氧化</b>。</li><li>Cu²⁺ 得到電子變成銅 → <b>銅離子被還原</b>。</li><li>銅放進硫酸亞鐵溶液 → <b>不反應</b>（銅比鐵不活潑）。</li></ol>`,side:[["判斷技巧","「X 放進 Y 的溶液，有 Y 析出」→ X＞Y。「沒反應」→ X＜Y。把每一組比較串起來就能排順序。"],["生活實例","不能用鐵桶裝硫酸銅溶液（農藥波爾多液），鐵桶會被腐蝕。"]],ex:"m28",exNote:["紅色物質是銅 → 銅離子變成銅，得到電子 → 被還原。","鐵溶進溶液變成 Fe²⁺ → 被氧化。","藍色變淡是銅離子變少；鐵能置換銅，表示鐵的活性比銅大 → B。"],pr:"m29"},{t:"煉鐵與冶金：把氧搶回來",star:"★★",main:`<p>自然界的金屬大多以<b>氧化物</b>（礦石）存在。想得到純金屬，就要找一個<b>更會搶氧</b>的東西把氧拿走，也就是用<b>還原劑</b>。</p>\n  <figure class="dg"><svg viewBox="0 0 520 220" role="img" aria-label="高爐煉鐵">${AH}\n   <g font-family="Noto Sans TC,sans-serif"><path d="M170 20 L130 190 H290 L250 20 Z" fill="var(--muted)" opacity=".18" stroke="var(--ink)" stroke-width="2.5"/>\n   <text x="210" y="50" text-anchor="middle" fill="var(--ink)" font-size="13" font-weight="700">鐵礦＋焦炭＋石灰石</text>\n   <path d="M210 175 V75" stroke="var(--bad)" stroke-width="3" marker-end="url(#ah)"/><text x="218" y="130" fill="var(--bad)" font-size="12">熱空氣</text>\n   <rect x="140" y="170" width="140" height="18" fill="var(--bad)" opacity=".55"/><text x="210" y="184" text-anchor="middle" fill="var(--ink)" font-size="12" font-weight="700">鐵水</text>\n   <text x="310" y="70" fill="var(--ink)" font-size="14" font-weight="700">① C＋O₂ → CO₂</text><text x="310" y="100" fill="var(--ink)" font-size="14" font-weight="700">② CO₂＋C → 2CO</text><text x="310" y="130" fill="var(--bad)" font-size="14" font-weight="700">③ Fe₂O₃＋3CO → 2Fe＋3CO₂</text><text x="310" y="160" fill="var(--muted)" font-size="13">石灰石：除去礦石裡的雜質</text></g></svg>\n   <figcaption>圖 4　高爐裡真正把鐵礦還原的是一氧化碳 CO。</figcaption></figure>\n  <p>同樣的道理：<b>氫氣</b>也能搶走氧化銅的氧，留下銅和水。活性<b>比碳還大</b>的金屬（如鋁、鎂），就要用電解才能煉出來。</p>`,side:[["易錯","CO 搶到氧被氧化，是「還原劑」；Fe₂O₃ 被還原，是「氧化劑」。"],["記法","焦炭負責產生 CO 和熱，石灰石負責除雜質。"]],ex:"m30",exNote:["Fe₂O₃ 失去氧變成 Fe → 被還原（是氧化劑）。","CO 得到氧變成 CO₂ → 被氧化（是還原劑）。","所以 C 對；有得失氧，一定是氧化還原反應。"],pr:"pr61"},{t:"生活中的氧化還原",star:"★★",main:`<div class="cmp"><table><thead><tr><th>情境</th><th>發生什麼</th><th>關鍵</th></tr></thead><tbody>\n   <tr><th>鐵生鏽</th><td>鐵和<b>水＋氧</b>反應</td><td>刷油漆、鍍鋅、塗油：隔絕水和氧</td></tr>\n   <tr><th>鋁不易生鏽</th><td>表面生成緻密的氧化鋁</td><td>保護層擋住裡面的鋁</td></tr>\n   <tr><th>漂白水</th><td>次氯酸根把色素<b>氧化</b></td><td>利用氧化力，也能殺菌</td></tr>\n   <tr><th>銀針試毒</th><td>銀被硫化物<b>氧化</b>成黑色硫化銀</td><td>銀被氧化，硫化物被還原</td></tr>\n   <tr><th>維生素 C</th><td>讓碘液還原變無色</td><td>維生素 C 本身被氧化（抗氧化劑）</td></tr>\n   <tr><th>食品包裝</th><td>鐵粉吸氧、充氮氣</td><td>防止食物被氧化</td></tr></tbody></table></div>\n  <p>氧化不一定要「看到氧」：失去電子也算氧化。銀變成硫化銀（Ag₂S）時，銀失去電子，所以銀被氧化。</p>`,side:[["易錯","銀針變黑：銀被氧化，硫化物被還原。（112 會考第 26 題）"],["判斷技巧","能讓別人被還原的物質，自己一定被氧化。（114 會考第 28 題）"]],ex:"p20",exNote:["題目說：硫化物使銀「氧化」。","氧化和還原同時發生 → 銀被氧化，硫化物就被還原 → A 對。","B：變黑跟 As₂O₃ 無關。C：純度越高硫化物越少，越不明顯。D：金活性更小，不會反應。"],pr:"pr68"}],end:["p1","pr63","pr65","pr67","pr69","pr62"],sumT:"氧化與還原一次對照",sumH:["","氧","電子","角色"],summary:[["被氧化","得到氧","失去電子","還原劑"],["被還原","失去氧","得到電子","氧化劑"],["活性大的","容易被氧化","—","能搶活性小的氧"],["活性小的","不易生鏽","—","金、銀、銅"]]};REF[8]={intro:"為什麼鹽水會導電、糖水不會？為什麼胃藥能中和胃酸？答案都在<b>離子</b>。這一章五年約 9 題，必背三件事：<b>pH 越小越酸</b>、<b>指示劑的顏色</b>、<b>中和後離子的數量和濃度</b>。",map:mkMap("電解質與酸鹼鹽",[["電解質","解離・導電","★★"],["酸與鹼","H⁺・OH⁻","★★"],["pH 與指示劑","越小越酸・差 1 差 10 倍","★★★"],["中和","酸＋鹼→鹽＋水","★★★"],["常見的鹽","碳酸鈣・食鹽","★"]]),table:[["電解質與解離","★★","111-10、112-3"],["酸鹼的性質","★★","111-29"],["pH 與指示劑","★★★","112-32、113-17"],["中和反應","★★★","115-40"],["常見的鹽類","★","114-19"]],cs:[{t:"電解質：溶在水裡會變成離子",star:"★★",main:`<p>電流要流動，需要<b>可以自由移動的帶電粒子</b>。有些物質溶在水裡會拆成帶電的離子，這叫<b>解離</b>，這種物質叫<b>電解質</b>。</p>\n  <figure class="dg"><svg viewBox="0 0 560 180" role="img" aria-label="食鹽水與糖水導電比較">\n   <g font-family="Noto Sans TC,sans-serif" text-anchor="middle">\n   <path d="M40 40 V150 Q40 162 52 162 H218 Q230 162 230 150 V40" stroke="var(--ink)" stroke-width="2.5" fill="none"/><rect x="42" y="60" width="186" height="100" fill="var(--earth)" opacity=".18"/>\n   ${[[70,90],[120,120],[170,85],[200,135],[95,140],[150,100]].map(([t,e],a)=>`<circle cx="${t}" cy="${e}" r="11" fill="${a%2?"var(--earth)":"var(--bad)"}"/><text x="${t}" y="${e+5}" fill="#fff" font-size="15" font-weight="900">${a%2?"−":"+"}</text>`).join("")}\n   <text x="135" y="28" fill="var(--ink)" font-size="15" font-weight="900">食鹽水：Na⁺、Cl⁻ → 會導電</text>\n   <path d="M330 40 V150 Q330 162 342 162 H508 Q520 162 520 150 V40" stroke="var(--ink)" stroke-width="2.5" fill="none"/><rect x="332" y="60" width="186" height="100" fill="var(--earth)" opacity=".18"/>\n   ${[[370,95],[430,130],[480,90],[400,140]].map(([t,e])=>`<ellipse cx="${t}" cy="${e}" rx="18" ry="11" fill="var(--muted)" opacity=".7"/>`).join("")}\n   <text x="425" y="28" fill="var(--ink)" font-size="15" font-weight="900">糖水：整個分子 → 不導電</text></g></svg>\n   <figcaption>圖 1　電解質解離出離子；非電解質還是完整的分子。</figcaption></figure>\n  <div class="cmp"><table><thead><tr><th></th><th>電解質</th><th>非電解質</th></tr></thead><tbody><tr><th>在水中</th><td>解離成離子</td><td>維持分子</td></tr><tr><th>導電</th><td>會</td><td>不會</td></tr><tr><th>例子</th><td><b>酸、鹼、鹽</b>（鹽酸、氨水、食鹽、醋）</td><td>糖、酒精、尿素</td></tr></tbody></table></div>\n  <p>溶液中正電總量＝負電總量，所以整杯溶液還是<b>電中性</b>。但陽離子和陰離子的<b>個數</b>不一定相等（CaCl₂ 是 1 個 Ca²⁺ 配 2 個 Cl⁻）。</p>`,side:[["易錯","固態食鹽不導電：離子卡在固體裡不能移動。要溶在水裡或熔化才會導電。"],["易錯","有機酸（含 −COOH）也是電解質，例如醋酸、蘋果酸。（111 會考第 10 題）"]],ex:"m34",exNote:["會導電的水溶液，溶質要解離出離子。","食鹽（鹽）、醋（酸）、氨水（鹼）都是電解質。","蔗糖是非電解質，在水裡還是分子 → 不導電。"],pr:"pr78"},{t:"酸與鹼：H⁺ 和 OH⁻",star:"★★",main:`<p>酸和鹼的差別，就看它們在水裡放出什麼離子：</p>\n  <div class="cmp"><table><thead><tr><th></th><th>酸</th><th>鹼</th></tr></thead><tbody>\n   <tr><th>放出</th><td><b>H⁺</b>（氫離子）</td><td><b>OH⁻</b>（氫氧根離子）</td></tr>\n   <tr><th>石蕊試紙</th><td>藍色 → <b>紅色</b></td><td>紅色 → <b>藍色</b></td></tr>\n   <tr><th>酚酞</th><td>無色</td><td><b>紅色</b></td></tr>\n   <tr><th>其他性質</th><td>酸味；和鎂、鋅反應產生<b>氫氣</b>；和大理石反應產生 CO₂</td><td>苦澀、滑滑的；能溶解油脂</td></tr>\n   <tr><th>常見</th><td>鹽酸、硫酸、硝酸、醋酸、碳酸</td><td>氫氧化鈉、氫氧化鈣（熟石灰）、氨水</td></tr></tbody></table></div>\n  <p>二氧化碳溶在水裡變成<b>碳酸</b>，所以汽水是酸性的。生石灰 CaO 加水變成氫氧化鈣，是鹼性的。</p>`,side:[["口訣","酸紅鹼藍（石蕊），酚酞遇鹼才變紅。"],["易錯","乙醇有 −OH 但不會解離出 OH⁻，不是鹼，是中性。"],["生活實例","魚塘加熟石灰：讓水變鹼性、pH 上升。（111 會考第 29 題）"]],ex:"p9",exNote:["水車攪動水面，讓更多空氣中的氧溶進水裡 → 溶氧量增加。","熟石灰＝氫氧化鈣，是鹼 → 溶在水裡讓 pH 增加。","所以兩個都增加，選 A。"],pr:"m33"},{t:"pH：越小越酸",star:"★★★",main:`<p>酸鹼有多強，用 <b>pH 值</b>來表示。在 25℃ 時：</p>\n  <figure class="dg"><svg viewBox="0 0 600 150" role="img" aria-label="pH 尺">\n   <defs><linearGradient id="phg" x1="0" x2="1"><stop offset="0" stop-color="#d4433a"/><stop offset=".5" stop-color="#2a9d5c"/><stop offset="1" stop-color="#5b4dff"/></linearGradient></defs>\n   <g font-family="Noto Sans TC,sans-serif" text-anchor="middle"><rect x="30" y="40" width="540" height="30" rx="6" fill="url(#phg)" opacity=".85"/>\n   ${Array.from({length:15},(t,e)=>`<text x="${30+e*540/14}" y="92" fill="var(--ink)" font-size="13" font-weight="700">${e}</text>`).join("")}\n   <text x="110" y="28" fill="var(--bad)" font-size="14" font-weight="900">酸性（越左越酸）</text><text x="300" y="28" fill="var(--ok)" font-size="14" font-weight="900">中性 7</text><text x="490" y="28" fill="#5b4dff" font-size="14" font-weight="900">鹼性（越右越鹼）</text>\n   <text x="68" y="120" fill="var(--muted)" font-size="12">胃酸 1～2</text><text x="160" y="120" fill="var(--muted)" font-size="12">醋、可樂 3</text><text x="300" y="120" fill="var(--muted)" font-size="12">純水 7</text><text x="420" y="120" fill="var(--muted)" font-size="12">小蘇打 8～9</text><text x="530" y="120" fill="var(--muted)" font-size="12">漂白水 12</text></g></svg>\n   <figcaption>圖 2　pH 是「倒過來的酸度計」：數字越小越酸。</figcaption></figure>\n  <p class="law"><span>pH 差 1，[H⁺] 差 10 倍</span>pH 3 比 pH 5 酸 <em>10×10＝100 倍</em>。</p>\n  <p>把酸加水稀釋，pH 會變大、越來越接近 7，但<b>不會超過 7</b>變成鹼性。</p>`,side:[["易錯","越酸 pH 越「小」，不是越大。（113 會考第 17 題）"],["易錯","pH 2 比 pH 4 酸 100 倍，不是 2 倍。"],["生活實例","吃完東西口腔 pH 會下降，牙齒最容易被酸蝕。（112 會考第 32 題）"]],ex:"p34",exNote:["實驗一：越酸（pH 越小），牙齒溶掉越多。","實驗二：乙杯牙齒減少最多 → 乙最酸。","越酸 pH 越小 → 乙的 pH 最小，選 B。"],pr:"m32"},{t:"中和：酸＋鹼 → 鹽＋水",star:"★★★",main:`<p>酸和鹼混在一起，H⁺ 和 OH⁻ 會結合成水，酸性和鹼性互相抵消，這叫<b>中和</b>。</p>\n  <div class="formula"><div class="fx"><span>H⁺</span>＋<span>OH⁻</span>→<span>H₂O</span></div><div class="fl"><div><b>HCl＋NaOH</b>→ NaCl＋H₂O<small>剩下的 Na⁺、Cl⁻ 就是鹽</small></div></div></div>\n  <figure class="dg"><svg viewBox="0 0 520 200" role="img" aria-label="鹼中滴入酸 pH 變化">\n   <g font-family="Noto Sans TC,sans-serif"><path d="M60 20 V170 H480" stroke="var(--ink)" stroke-width="2" fill="none"/><text x="52" y="24" text-anchor="end" fill="var(--muted)" font-size="12">pH</text><text x="480" y="190" text-anchor="end" fill="var(--muted)" font-size="12">滴入鹽酸的量</text>\n   <line x1="60" y1="95" x2="480" y2="95" stroke="var(--muted)" stroke-dasharray="4 4"/><text x="52" y="99" text-anchor="end" fill="var(--muted)" font-size="12">7</text>\n   <path d="M60 35 C200 38 240 45 260 60 C268 80 272 110 280 130 C300 150 380 155 480 158" stroke="var(--sc)" stroke-width="4" fill="none"/>\n   <circle cx="272" cy="95" r="6" fill="var(--bad)"/><text x="285" y="90" fill="var(--bad)" font-size="13" font-weight="700">剛好中和 pH＝7</text>\n   <text x="80" y="60" fill="var(--muted)" font-size="12">鹼性：還有 OH⁻</text><text x="340" y="148" fill="var(--muted)" font-size="12">酸過量：變酸性</text></g></svg>\n   <figcaption>圖 3　氫氧化鈉中慢慢滴鹽酸：pH 從大往小掉。</figcaption></figure>\n  <p>中和時<b>沒有參加反應的離子</b>（例如 Na⁺）數目不變；但因為一直加溶液、體積變大，它的<b>濃度會下降</b>。</p>\n  <p class="law"><span>剛好完全中和</span>酸的 H⁺ 莫耳數＝鹼的 OH⁻ 莫耳數　→　<em>M酸×V酸＝M鹼×V鹼</em>（一元酸鹼）</p>`,side:[["易錯","中和後 Na⁺ 數目不變、濃度下降，因為體積變大了。（115 會考第 40 題）"],["生活實例","胃藥（制酸劑）中和胃酸；被蚊蟲叮咬（酸）擦弱鹼。"],["易錯","中和不一定是中性：強酸配弱鹼，產物可能偏酸。國中題目多以 pH＝7 為完全中和。"]],ex:"p64",exNote:["Na⁺ 不參加反應，數目從頭到尾都一樣。","但一直滴入鹽酸，溶液體積變大。","濃度＝數目÷體積 → 分母變大，濃度變小，選 A。"],pr:"m35"},{t:"常見的鹽類",star:"★",main:`<p>酸鹼中和產生的離子化合物都叫<b>鹽</b>，不只是食鹽。常考的有：</p>\n  <div class="cmp"><table><thead><tr><th>名稱</th><th>化學式</th><th>性質與用途</th></tr></thead><tbody>\n   <tr><th>氯化鈉（食鹽）</th><td>NaCl</td><td>調味、生理食鹽水，水溶液中性</td></tr>\n   <tr><th>碳酸鈣</th><td>CaCO₃</td><td>大理石、石灰岩、貝殼、蛋殼；<b>難溶於水</b>；加鹽酸產生 CO₂</td></tr>\n   <tr><th>碳酸氫鈉（小蘇打）</th><td>NaHCO₃</td><td>發粉、制酸劑，水溶液弱鹼性；加熱產生 CO₂</td></tr>\n   <tr><th>碳酸鈉（蘇打）</th><td>Na₂CO₃</td><td>清潔劑，水溶液鹼性</td></tr>\n   <tr><th>硫酸鈣</th><td>CaSO₄</td><td>石膏，骨折固定、豆花凝固劑</td></tr></tbody></table></div>\n  <p>二氧化碳溶在水裡變碳酸，碰到 Ca²⁺ 會變成難溶的<b>碳酸鈣</b>沉澱，這就是「把 CO₂ 固化在岩石裡」的原理，也是石灰水檢驗 CO₂ 會變混濁的原因。</p>`,side:[["易錯","CO₂ 能「固化」是因為和 Ca²⁺ 生成難溶的碳酸鹽，不是因為密度大。（114 會考第 19 題）"],["記法","碳酸鹽＋酸 → 鹽＋水＋CO₂。"]],ex:"p47",exNote:["「固化」代表變成固體留在岩層裡。","CO₂ 溶在水裡變碳酸，和岩層的 Ca²⁺、Mg²⁺ 結合。","生成難溶於水的碳酸鈣（碳酸鹽）沉澱 → C。"],pr:"pr79"}],end:["fig11","fig27","m36","pr75","pr76","pr77"],sumT:"酸、鹼、中性一次比較",sumH:["","pH","石蕊","酚酞"],summary:[["酸性","＜ 7（越小越酸）","藍 → 紅","無色"],["中性","＝ 7","不變","無色"],["鹼性","＞ 7（越大越鹼）","紅 → 藍","紅色"]]};REF[9]={intro:"這一章回答兩個問題：<b>反應有多快？</b>（反應速率）以及<b>反應會不會停？</b>（化學平衡）。近四年每年 1 題，最常考的陷阱是：判斷速率一定要<b>記錄時間</b>，平衡時反應<b>沒有停</b>，只是正逆速率一樣快。",map:mkMap("反應速率與平衡",[["影響速率","本質・濃度・溫度・表面積","★★★"],["測量速率與催化劑","要記錄時間","★★"],["動態平衡","正逆速率相等不為 0","★★★"],["平衡移動","加濃度・改溫度","★★"]]),table:[["影響反應速率的因素","★★★","112-40"],["測量速率、催化劑","★★","115-12"],["可逆反應與動態平衡","★★★","113-11、114-40"],["平衡的移動","★★","課本基本題"]],cs:[{t:"影響反應速率的五個因素",star:"★★★",main:`<p>反應要發生，粒子必須<b>撞在一起</b>。撞得越多、越用力，反應就越快。所以會影響速率的因素有：</p>\n  <div class="cmp"><table><thead><tr><th>因素</th><th>怎樣比較快</th><th>為什麼</th><th>生活例子</th></tr></thead><tbody>\n   <tr><th>本質</th><td>活性大的</td><td>本來就容易反應</td><td>鈉遇水劇烈、鐵很慢</td></tr>\n   <tr><th>濃度</th><td>越濃越快</td><td>粒子多，碰撞機會多</td><td>純氧中燃燒更旺</td></tr>\n   <tr><th>溫度</th><td>越高越快</td><td>粒子動得快，撞得多又用力</td><td>食物放冰箱比較不會壞</td></tr>\n   <tr><th>表面積</th><td>越碎越快</td><td>接觸面變大</td><td>粉塵爆炸、細木條比木塊好燒</td></tr>\n   <tr><th>催化劑</th><td>加了較快</td><td>提供較容易的反應途徑</td><td>二氧化錳加雙氧水</td></tr></tbody></table></div>\n  <figure class="dg"><svg viewBox="0 0 520 210" role="img" aria-label="粉末與塊狀大理石產生二氧化碳">\n   <g font-family="Noto Sans TC,sans-serif"><path d="M60 20 V170 H480" stroke="var(--ink)" stroke-width="2" fill="none"/><text x="52" y="24" text-anchor="end" fill="var(--muted)" font-size="12">CO₂</text><text x="480" y="190" text-anchor="end" fill="var(--muted)" font-size="12">時間</text>\n   <path d="M60 170 C90 60 130 50 200 50 H470" stroke="var(--bad)" stroke-width="4" fill="none"/><path d="M60 170 C180 110 300 55 470 50" stroke="var(--earth)" stroke-width="4" fill="none"/>\n   <text x="200" y="80" fill="var(--bad)" font-size="14" font-weight="700">粉末：一開始很陡</text><text x="300" y="120" fill="var(--earth-k)" font-size="14" font-weight="700">塊狀：比較慢</text><text x="400" y="40" fill="var(--ink)" font-size="13" font-weight="700">最後一樣高</text></g></svg>\n   <figcaption>圖 1　快慢看斜率；最後產量由反應物的量決定。</figcaption></figure>`,side:[["易錯","加入更多「相同濃度」的鹽酸，濃度沒變 → 速率不變。"],["易錯","反應快不代表產物多。產量由反應物的量決定。"],["判斷技巧","圖上看速率：線越陡越快；看產量：最後的高度。"]],ex:"fig28",exNote:["粉末接觸面積大 → 反應快 → 一開始的線比較陡 → 甲是粉末。","兩份大理石質量相同、鹽酸足量 → 產生的 CO₂ 總量一樣。","所以 A：甲是粉末，最後 CO₂ 一樣多。"],pr:"m37"},{t:"怎麼知道反應多快？催化劑又是什麼？",star:"★★",main:`<p>速率就是「<b>每單位時間</b>反應了多少」。所以想比較速率，一定要有兩個數字：<b>變化了多少</b>和<b>花了多少時間</b>。</p>\n  <div class="formula"><div class="fx"><span>反應速率</span>＝<span>變化量</span>÷<span>時間</span></div><div class="fl"><div><b>變化量</b>產生氣體體積、沉澱多少、質量減少<small>看得到、量得到的</small></div></div></div>\n  <p>常見的觀察方法：量氣體體積（排水集氣）、看沉澱遮住「X」記號所花的時間、看顏色變化的時間。</p>\n  <p class="law"><span>催化劑</span>能<em>改變反應速率</em>，但本身在反應前後<em>質量和性質都不變</em>，也<em>不會增加產量</em>。</p>\n  <p>例：雙氧水加二氧化錳（MnO₂），氧氣一下子冒出來，反應完 MnO₂ 還在，可以重複使用。身體裡的<b>酵素</b>也是催化劑。</p>`,side:[["易錯","實驗只量產物質量、沒記錄時間 → 無法判斷速率。（115 會考第 12 題）"],["易錯","催化劑不會讓產物變多，只會讓它更快出來。"]],ex:"p57",exNote:["速率＝變化量÷時間。","實驗量了產物質量（變化量），但沒有記錄每一組花了多少時間。","缺時間就算不出速率 → D。"],pr:"m39"},{t:"可逆反應與動態平衡",star:"★★★",main:`<p>有些反應可以<b>往前走，也可以往回走</b>，叫<b>可逆反應</b>，用「⇌」表示。例如：</p>\n  <div class="formula"><div class="fx"><span>2NO₂</span>⇌<span>N₂O₄</span></div><div class="fl"><div><b>NO₂</b>紅棕色<small></small></div><div><b>N₂O₄</b>無色<small></small></div></div></div>\n  <figure class="dg"><svg viewBox="0 0 520 210" role="img" aria-label="正逆反應速率變化">\n   <g font-family="Noto Sans TC,sans-serif"><path d="M60 20 V170 H480" stroke="var(--ink)" stroke-width="2" fill="none"/><text x="52" y="24" text-anchor="end" fill="var(--muted)" font-size="12">速率</text><text x="480" y="190" text-anchor="end" fill="var(--muted)" font-size="12">時間</text>\n   <path d="M60 30 C140 80 200 105 280 110 H470" stroke="var(--bad)" stroke-width="4" fill="none"/><path d="M60 168 C140 130 200 115 280 110 H470" stroke="var(--earth)" stroke-width="4" fill="none"/>\n   <line x1="280" y1="20" x2="280" y2="170" stroke="var(--muted)" stroke-dasharray="4 4"/>\n   <text x="90" y="40" fill="var(--bad)" font-size="14" font-weight="700">正反應速率</text><text x="90" y="160" fill="var(--earth-k)" font-size="14" font-weight="700">逆反應速率</text>\n   <text x="290" y="95" fill="var(--ink)" font-size="14" font-weight="700">達到平衡：兩者相等，但不是 0</text></g></svg>\n   <figcaption>圖 2　平衡後兩條線重疊，但都在 0 的上面。</figcaption></figure>\n  <p class="law"><span>動態平衡</span>正反應速率＝逆反應速率，<em>而且都不為 0</em>。反應一直在進行，只是各物質的量不再改變。</p>\n  <p>就像捷運車廂：每站有人上、有人下，如果上下的人一樣多，車廂內的人數就不變，但一直有人在動。</p>`,side:[["易錯","平衡時速率「不為 0」，反應沒有停。（113 會考第 11 題）"],["易錯","平衡時濃度「不變」，但不代表反應物和生成物「一樣多」。"],["延伸","密閉容器中的水和水蒸氣、飽和溶液的溶解和析出，也是動態平衡。（114 會考第 40 題）"]],ex:"p31",exNote:["顏色不再改變 → 已達平衡。","平衡是動態的：正、逆反應都還在進行。","速率相等且不為 0 → B。"],pr:"pr84"},{t:"平衡的移動：外界改變，平衡會「調整」",star:"★★",main:`<p>平衡被打亂時，反應會往<b>抵銷這個改變</b>的方向移動，直到達成新的平衡。</p>\n  <div class="cmp"><table><thead><tr><th>改變</th><th>平衡往哪移</th><th>例子：2CrO₄²⁻（黃）＋2H⁺ ⇌ Cr₂O₇²⁻（橙）＋H₂O</th></tr></thead><tbody>\n   <tr><th>加入反應物</th><td>往<b>右</b>（消耗它）</td><td>加鹽酸（H⁺）→ 變<b>橙</b></td></tr>\n   <tr><th>拿走反應物</th><td>往<b>左</b>（補回它）</td><td>加 NaOH（中和掉 H⁺）→ 變回<b>黃</b></td></tr></tbody></table></div>\n  <p>溫度也會影響：<b>升溫往吸熱的方向移、降溫往放熱的方向移</b>。</p>\n  <figure class="dg"><svg viewBox="0 0 520 150" role="img" aria-label="二氧化氮瓶冷熱顏色">\n   <g font-family="Noto Sans TC,sans-serif" text-anchor="middle">\n   <circle cx="110" cy="75" r="44" fill="#8a3b12" opacity=".75" stroke="var(--ink)" stroke-width="2"/><text x="110" y="140" fill="var(--bad)" font-size="14" font-weight="700">熱水：顏色變深</text>\n   <circle cx="260" cy="75" r="44" fill="#8a3b12" opacity=".45" stroke="var(--ink)" stroke-width="2"/><text x="260" y="140" fill="var(--ink)" font-size="14" font-weight="700">室溫</text>\n   <circle cx="410" cy="75" r="44" fill="#8a3b12" opacity=".15" stroke="var(--ink)" stroke-width="2"/><text x="410" y="140" fill="var(--earth-k)" font-size="14" font-weight="700">冰水：顏色變淡</text></g></svg>\n   <figcaption>圖 3　2NO₂ ⇌ N₂O₄ 正反應放熱：降溫往右（無色變多），升溫往左（紅棕色變多）。</figcaption></figure>`,side:[["口訣","加什麼就消耗什麼，拿走什麼就補回什麼。"],["生活實例","汽水打開壓力降低，溶解的 CO₂ 往氣體方向跑，冒出大量氣泡。"]],ex:"m38",exNote:["加入鹽酸 → H⁺ 變多（加入反應物）。","平衡往右移動來消耗 H⁺。","右邊是橙色的 Cr₂O₇²⁻ → 溶液變成橙色，選 B。"],pr:"pr85"}],end:["p25","pr86","pr87","pr88","pr89"],sumT:"速率與平衡一次整理",sumH:["","重點","判斷方法","最常錯"],summary:[["反應速率","變化量÷時間","圖形看斜率","沒記錄時間也說能比速率"],["催化劑","加快速率，自己不變","反應前後質量不變","以為會增加產量"],["動態平衡","正逆速率相等且不為 0","顏色、濃度不再改變","以為反應停了"],["平衡移動","往抵銷改變的方向","加什麼消耗什麼","加同濃度溶液也以為會變"]]};REF[10]={intro:"酒精、醋、肥皂、塑膠、衣服，全都是<b>有機化合物</b>。種類雖然多，但認它們的方法很簡單：像看「姓氏」一樣看<b>官能基</b>。這一章五年約 10 題，最愛用生活情境考<b>分類</b>和<b>反應</b>。",map:mkMap("有機化合物",[["有機與無機","含碳・乾餾","★★"],["烴","烷・烯","★★"],["醇與有機酸","−OH・−COOH","★★★"],["酯化與皂化","酸＋醇・油＋鹼","★★★"],["聚合物與衣料","塑膠・纖維","★★"]]),table:[["有機與無機、乾餾","★★","112-17、113-19"],["烴：烷類與烯類","★★","課本基本題"],["醇與有機酸","★★★","111-10、113-2、114-44"],["酯化與皂化反應","★★★","111-22、112-11、115-12"],["聚合物與衣料","★★","114-21"]],cs:[{t:"有機與無機：含碳就是有機嗎？",star:"★★",main:`<p>以前人們以為有機物只能由生物製造，所以叫「有機」。現在的定義是：<b>含碳的化合物</b>大多是有機化合物。</p>\n  <p class="law"><span>例外</span><em>CO、CO₂、碳酸鹽（CaCO₃）、氰化物</em>雖然含碳，性質像無機物，仍歸為<em>無機化合物</em>。</p>\n  <p>所以：有機物<b>一定</b>含碳；無機物<b>可以</b>含碳。</p>\n  <p>把木材<b>隔絕空氣加熱</b>叫<b>乾餾</b>（沒有氧，不會燒起來），會分解成：</p>\n  <figure class="dg"><svg viewBox="0 0 520 170" role="img" aria-label="木材乾餾產物">${AH}\n   <g font-family="Noto Sans TC,sans-serif" text-anchor="middle"><rect x="40" y="60" width="110" height="50" rx="8" fill="var(--sc)" opacity=".3" stroke="var(--sc)" stroke-width="2"/><text x="95" y="91" fill="var(--ink)" font-size="16" font-weight="900">木材</text>\n   <text x="200" y="76" fill="var(--bad)" font-size="12" font-weight="700">隔絕空氣</text><text x="200" y="94" fill="var(--bad)" font-size="12" font-weight="700">加熱</text>\n   <path d="M160 85 H240 M240 85 L290 30 M240 85 L290 70 M240 85 L290 110 M240 85 L290 150" stroke="var(--ink)" stroke-width="2" fill="none"/>\n   <text x="300" y="35" text-anchor="start" fill="var(--ink)" font-size="14" font-weight="700">木炭（留在試管裡的黑色固體）</text>\n   <text x="300" y="75" text-anchor="start" fill="var(--ink)" font-size="14" font-weight="700">木焦油（黑色黏稠液體）</text>\n   <text x="300" y="115" text-anchor="start" fill="var(--ink)" font-size="14" font-weight="700">木醋液（黃色酸性液體）</text>\n   <text x="300" y="155" text-anchor="start" fill="var(--ink)" font-size="14" font-weight="700">可燃性氣體（可點燃）</text></g></svg>\n   <figcaption>圖 1　乾餾：沒有氧氣，木材分解而不是燃燒。</figcaption></figure>`,side:[["易錯","含碳不一定是有機物：CO₂、CaCO₃ 是無機物。（112 會考第 17 題）"],["記法","有機物多數可燃、燃燒產生 CO₂ 和 H₂O；多數不易溶於水。"]],ex:"p17",exNote:["有機化合物一定含碳 → 先刪 C、D 這種多加條件的。","CO₂、CaCO₃ 等是含碳的無機物 → 無機物「可以」含碳。","所以小如對，選 B。"],pr:"pr98"},{t:"烴：只有碳和氫",star:"★★",main:`<p>只由<b>碳和氫</b>組成的有機物叫<b>烴</b>，石油和天然氣的主要成分就是烴。最常考兩類：</p>\n  <div class="cmp"><table><thead><tr><th></th><th>烷類</th><th>烯類</th></tr></thead><tbody>\n   <tr><th>通式</th><td><b>CₙH₂ₙ₊₂</b></td><td><b>CₙH₂ₙ</b></td></tr>\n   <tr><th>鍵</th><td>只有單鍵</td><td>有碳碳<b>雙鍵</b>，可以聚合</td></tr>\n   <tr><th>例子</th><td>甲烷 CH₄（天然氣）、乙烷 C₂H₆、丙烷 C₃H₈（瓦斯）、丁烷 C₄H₁₀</td><td>乙烯 C₂H₄（催熟水果、做塑膠）</td></tr></tbody></table></div>\n  <figure class="dg"><svg viewBox="0 0 520 150" role="img" aria-label="乙烷與乙烯結構">\n   <g font-family="Noto Sans TC,sans-serif" text-anchor="middle" font-size="18" font-weight="900">\n   <text x="80" y="82" fill="var(--ink)">H</text><text x="130" y="82" fill="var(--accent)">C</text><text x="190" y="82" fill="var(--accent)">C</text><text x="240" y="82" fill="var(--ink)">H</text>\n   <text x="130" y="34" fill="var(--ink)">H</text><text x="190" y="34" fill="var(--ink)">H</text><text x="130" y="130" fill="var(--ink)">H</text><text x="190" y="130" fill="var(--ink)">H</text>\n   <path d="M92 76 H118 M142 76 H178 M202 76 H228 M130 40 V62 M190 40 V62 M130 88 V112 M190 88 V112" stroke="var(--ink)" stroke-width="2.5"/>\n   <text x="160" y="148" fill="var(--muted)" font-size="13" font-weight="700">乙烷 C₂H₆</text>\n   <text x="360" y="34" fill="var(--ink)">H</text><text x="360" y="130" fill="var(--ink)">H</text><text x="470" y="34" fill="var(--ink)">H</text><text x="470" y="130" fill="var(--ink)">H</text>\n   <text x="385" y="82" fill="var(--accent)">C</text><text x="445" y="82" fill="var(--accent)">C</text>\n   <path d="M368 42 L380 62 M462 42 L450 62 M368 112 L380 92 M462 112 L450 92 M398 71 H432 M398 81 H432" stroke="var(--ink)" stroke-width="2.5"/>\n   <text x="415" y="148" fill="var(--muted)" font-size="13" font-weight="700">乙烯 C₂H₄（雙鍵）</text></g></svg>\n   <figcaption>圖 2　碳一定伸出 4 隻手。乙烯少了 2 個 H，碳之間多牽一隻手變雙鍵。</figcaption></figure>`,side:[["解題技巧","烷類 H 的數目＝碳數 × 2 ＋ 2。丁烷 4 個碳 → H＝10。"],["記法","甲乙丙丁：1、2、3、4 個碳。"]],ex:"m40",exNote:["烷類通式 CₙH₂ₙ₊₂。","丁烷 n＝4 → H＝2×4＋2＝10。","丁烷是 C₄H₁₀，選 B。"],pr:"pr97"},{t:"醇與有機酸：看官能基認身分",star:"★★★",main:`<p>有機物的性質主要由一小段特別的原子團決定，叫<b>官能基</b>。認官能基就像看姓氏：</p>\n  <div class="cmp"><table><thead><tr><th>類別</th><th>官能基</th><th>例子</th><th>性質</th></tr></thead><tbody>\n   <tr><th>醇</th><td><b>−OH</b>（羥基）</td><td>甲醇（有毒）、乙醇（酒精）、木糖醇</td><td><b>中性、非電解質</b>，可當溶劑和燃料</td></tr>\n   <tr><th>有機酸</th><td><b>−COOH</b>（羧基）</td><td>甲酸（蟻酸）、乙酸（醋酸）、蘋果酸</td><td><b>弱酸性、電解質</b></td></tr>\n   <tr><th>酯</th><td><b>−COO−</b></td><td>乙酸乙酯</td><td>有水果香味，難溶於水</td></tr></tbody></table></div>\n  <p class="law"><span>判斷類別的方法</span>要看分子中<em>原子的種類和排列方式</em>（有沒有那個官能基），不是看分子量或原子比例。</p>`,side:[["易錯","醇的 −OH 不會在水中解離成 OH⁻，所以乙醇不是鹼。"],["易錯","判斷是不是醇類要看結構，不是分子量。（113 會考第 2 題）"],["易錯","有機酸也是電解質。（111 會考第 10 題）"]],ex:"p27",exNote:["醇類的共同特徵是有 −OH 官能基。","要知道有沒有 −OH，就要看分子由哪些原子組成、怎麼排列。","分子量、原子總數、H：O 比例都無法判斷 → B。"],pr:"m42"},{t:"酯化與皂化：兩個一定要會的反應",star:"★★★",main:`<div class="formula"><div class="fx"><span>有機酸</span>＋<span>醇</span>→<span>酯</span>＋水</div><div class="fl"><div><b>酯化反應</b>加濃硫酸當催化劑，加熱<small>乙酸＋乙醇 → 乙酸乙酯＋水</small></div></div></div>\n  <div class="formula"><div class="fx"><span>油脂</span>＋<span>強鹼</span>→<span>肥皂</span>＋甘油</div><div class="fl"><div><b>皂化反應</b>加熱攪拌<small>最後加飽和食鹽水，讓肥皂浮出來分離（鹽析）</small></div></div></div>\n  <figure class="dg"><svg viewBox="0 0 520 160" role="img" aria-label="肥皂分子去油汙">\n   <g font-family="Noto Sans TC,sans-serif"><ellipse cx="260" cy="85" rx="60" ry="42" fill="var(--sc)" opacity=".45"/><text x="260" y="91" text-anchor="middle" fill="var(--ink)" font-size="15" font-weight="900">油汙</text>\n   ${[0,45,90,135,180,225,270,315].map(t=>{const e=t*Math.PI/180,a=260+Math.cos(e)*50,i=85+Math.sin(e)*35,s=260+Math.cos(e)*95,r=85+Math.sin(e)*68;return`<line x1="${a}" y1="${i}" x2="${s}" y2="${r}" stroke="var(--ink)" stroke-width="2.5"/><circle cx="${s}" cy="${r}" r="7" fill="var(--earth)"/>`}).join("")}\n   <text x="390" y="40" fill="var(--earth-k)" font-size="13" font-weight="700">● 親水端朝外</text><text x="390" y="62" fill="var(--ink)" font-size="13" font-weight="700">— 親油端抓住油</text><text x="390" y="120" fill="var(--muted)" font-size="13">用水一沖就帶走</text></g></svg>\n   <figcaption>圖 3　肥皂分子一頭親油、一頭親水，把油汙包起來。</figcaption></figure>`,side:[["易錯","皂化產物是肥皂和甘油；酯化產物是酯和水。不要混。"],["易錯","製肥皂加的酒精只是幫油和鹼混合，不是反應物。（112 會考第 11 題）"],["生活實例","酯類本來就在香蕉、柳丁裡，所以拿來去咖啡因比較安全。（111 會考第 22 題）"]],ex:"p68",exNote:["皂化的反應物只有油脂和鹼；酒精是幫助混合用的 → A 錯。","加熱攪拌是讓反應「變快」，不是避免太快 → B 錯；水不是催化劑 → C 錯。","加飽和食鹽水，肥皂會析出浮起，和甘油分開 → D 對。"],pr:"m41"},{t:"聚合物與衣料",star:"★★",main:`<p>很多小分子（<b>單體</b>）一個接一個連起來，變成超長的大分子，叫<b>聚合物</b>。乙烯 → 聚乙烯（PE）就是這樣。</p>\n  <div class="cmp"><table><thead><tr><th></th><th>熱塑性塑膠</th><th>熱固性塑膠</th></tr></thead><tbody>\n   <tr><th>結構</th><td><b>鏈狀</b></td><td><b>網狀</b></td></tr><tr><th>加熱</th><td>會軟化，可重新塑形、回收</td><td>不會軟化，太熱會燒焦</td></tr><tr><th>例子</th><td>寶特瓶 PET、塑膠袋 PE、保鮮膜</td><td>美耐皿、電木（插座）</td></tr></tbody></table></div>\n  <div class="cmp"><table><thead><tr><th>衣料</th><th>來源</th><th>成分</th><th>燃燒時</th></tr></thead><tbody>\n   <tr><th>棉、麻</th><td>植物</td><td>纖維素</td><td>燒紙味</td></tr><tr><th>蠶絲、羊毛</th><td>動物</td><td><b>蛋白質</b></td><td>燒焦羽毛味</td></tr><tr><th>尼龍、聚酯</th><td>石油合成</td><td>聚合物</td><td>熔成硬球</td></tr></tbody></table></div>`,side:[["記法","鏈狀像麵條，加熱軟掉可重塑；網狀像漁網，加熱也不變形。"],["易錯","有些塑膠會被酒精溶解，不能拿來裝酒精。（114 會考第 21 題）"]],ex:"m43",exNote:["寶特瓶可以加熱再塑形、可回收 → 熱塑性。","熱塑性塑膠的分子是鏈狀。","所以是熱塑性、鏈狀，選 C。"],pr:"m44"}],end:["p4","p7","pr95","pr96","pr99"],sumT:"有機物分類一次整理",sumH:["","認法","代表","性質"],summary:[["烷","只有 C、H，CₙH₂ₙ₊₂","甲烷、丙烷","可燃，不溶於水"],["烯","只有 C、H，有雙鍵","乙烯","可聚合成塑膠"],["醇","−OH","乙醇","中性、非電解質"],["有機酸","−COOH","乙酸","弱酸、電解質"],["酯","−COO−","乙酸乙酯","水果香味"]]};REF[101]={intro:"生物課的第一章先教兩件工具：<b>科學方法</b>（怎麼證明一句話對不對）和<b>顯微鏡</b>（怎麼看見細胞）。接著認識所有生物的基本單位：<b>細胞</b>，以及水和物質怎麼進出細胞。每年 1～4 題。",map:mkMap("生命世界與細胞",[["科學方法","假設・變因・反例","★★"],["細胞構造","動物 vs 植物","★★★"],["顯微鏡","複式・解剖","★★★"],["擴散與滲透","高濃度往低濃度","★★"],["組成層次","細胞→個體","★"]]),table:[["科學方法","★★","113-20、114-7"],["細胞構造與細胞學說","★★★","課本基本題"],["顯微鏡操作","★★★","111-17"],["擴散與滲透","★★","112-24"],["組成層次與生物圈","★","課本基本題"]],cs:[{t:"科學方法：怎麼證明一句話",star:"★★",main:`<p>科學家遇到問題，會照著固定的步驟找答案：</p>\n  <figure class="dg"><svg viewBox="0 0 600 110" role="img" aria-label="科學方法步驟">${AH}\n   <g font-family="Noto Sans TC,sans-serif" text-anchor="middle">${["觀察","提出問題","假設","設計實驗","分析結果","結論"].map((t,e)=>`<circle cx="${50+e*100}" cy="45" r="30" fill="var(--sc)" opacity="${e===3?1:.25}"/><text x="${50+e*100}" y="51" fill="${e===3?"var(--on-sc)":"var(--ink)"}" font-size="14" font-weight="900">${t.length>2?t.slice(0,2):t}</text>${t.length>2?`<text x="${50+e*100}" y="96" fill="var(--muted)" font-size="12">${t}</text>`:""}${e<5?`<path d="M${82+e*100} 45 H${116+e*100}" stroke="var(--muted)" stroke-width="2.5" marker-end="url(#ah)"/>`:""}`).join("")}</g></svg>\n   <figcaption>圖 1　設計實驗時，一次只改變一個條件（操縱變因）。</figcaption></figure>\n  <div class="cmp"><table><thead><tr><th>變因</th><th>意思</th><th>例：光照會不會影響綠豆發芽</th></tr></thead><tbody>\n   <tr><th>操縱變因</th><td>故意改變的那一個</td><td>有沒有照光</td></tr><tr><th>應變變因</th><td>跟著改變、要測量的結果</td><td>發芽的數量</td></tr><tr><th>控制變因</th><td>其他全部保持一樣</td><td>水量、溫度、綠豆品種</td></tr></tbody></table></div>\n  <p class="law"><span>推翻「所有……都……」</span>只要找到<em>一個反例</em>就能推翻。要反駁「某個因素有影響」，就<em>只改變那個因素</em>，其他條件都不變，看結果是否一樣。</p>`,side:[["判斷技巧","「所有刺絲胞動物都在海洋」→ 在淡水找到一隻就推翻了。（113 會考第 20 題）"],["易錯","反駁「只有端午能立蛋」，要用同一種蛋、只改日期。換蛋、煮熟都多改了別的條件。（114 會考第 7 題）"]],ex:"bp18",exNote:["這句話是「所有刺絲胞動物都在海洋」。","在海洋找到再多種，也不能證明「所有」→ A、D 不行。","只要在淡水找到一種刺絲胞動物，這句話就被推翻 → C。"],pr:"pr179"},{t:"細胞：生物的基本單位",star:"★★★",main:`<p class="law"><span>細胞學說</span>所有生物都由細胞組成；細胞是生物<em>構造和功能</em>的基本單位；細胞由<em>原有的細胞</em>分裂產生。</p>\n  <figure class="dg"><svg viewBox="0 0 560 240" role="img" aria-label="動物細胞與植物細胞">\n   <g font-family="Noto Sans TC,sans-serif" text-anchor="middle">\n   <ellipse cx="140" cy="115" rx="110" ry="85" fill="var(--sc)" opacity=".12" stroke="var(--sc)" stroke-width="3"/><circle cx="140" cy="110" r="26" fill="var(--sc)" opacity=".45"/><text x="140" y="115" fill="var(--ink)" font-size="12" font-weight="700">細胞核</text>\n   <ellipse cx="85" cy="150" rx="16" ry="8" fill="var(--bad)" opacity=".6"/><text x="80" y="178" fill="var(--bad)" font-size="12" font-weight="700">粒線體</text><text x="210" y="70" fill="var(--accent)" font-size="12">細胞膜</text>\n   <text x="140" y="228" fill="var(--ink)" font-size="15" font-weight="900">動物細胞</text>\n   <rect x="310" y="25" width="220" height="180" rx="6" fill="none" stroke="var(--ink)" stroke-width="6"/><rect x="318" y="33" width="204" height="164" rx="4" fill="var(--sc)" opacity=".12" stroke="var(--sc)" stroke-width="2"/>\n   <rect x="380" y="70" width="100" height="90" rx="20" fill="var(--earth)" opacity=".25"/><text x="430" y="120" fill="var(--earth-k)" font-size="12" font-weight="700">大型液胞</text>\n   <circle cx="350" cy="70" r="20" fill="var(--sc)" opacity=".45"/><text x="350" y="75" fill="var(--ink)" font-size="11" font-weight="700">核</text>\n   ${[[345,150],[500,60],[495,175],[350,110]].map(([t,e])=>`<ellipse cx="${t}" cy="${e}" rx="12" ry="7" fill="var(--ok)"/>`).join("")}<text x="500" y="86" text-anchor="middle" fill="var(--ok)" font-size="12" font-weight="700">葉綠體</text><text x="340" y="18" fill="var(--ink)" font-size="12" font-weight="700">細胞壁</text>\n   <text x="420" y="235" fill="var(--ink)" font-size="15" font-weight="900">植物細胞</text></g></svg>\n   <figcaption>圖 2　植物細胞多了三樣：細胞壁、葉綠體、大型液胞。</figcaption></figure>\n  <div class="cmp"><table><thead><tr><th>構造</th><th>功能</th><th>動物</th><th>植物</th></tr></thead><tbody>\n   <tr><th>細胞膜</th><td>控制物質進出</td><td>✓</td><td>✓</td></tr><tr><th>細胞核</th><td>含遺傳物質，控制細胞活動</td><td>✓</td><td>✓</td></tr><tr><th>粒線體</th><td>呼吸作用，產生能量</td><td>✓</td><td>✓</td></tr>\n   <tr><th>細胞壁</th><td>支持、保護</td><td>✗</td><td>✓</td></tr><tr><th>葉綠體</th><td>光合作用</td><td>✗</td><td>✓（綠色部位）</td></tr><tr><th>大型液胞</th><td>儲存水分和物質</td><td>✗</td><td>✓</td></tr></tbody></table></div>`,side:[["記法","植物多三樣：壁、綠、泡（細胞壁、葉綠體、大液胞）。"],["易錯","粒線體動植物都有；根部細胞沒有葉綠體。"]],ex:"bm0",exNote:["細胞膜、粒線體、細胞核：動物和植物細胞都有。","細胞壁只有植物細胞有。","答案 C。"],pr:"fig37"},{t:"顯微鏡：看細胞的眼睛",star:"★★★",main:`<div class="cmp"><table><thead><tr><th></th><th>複式顯微鏡</th><th>解剖顯微鏡</th></tr></thead><tbody>\n   <tr><th>倍率</th><td>高（40～1000 倍）</td><td>低（約 10～40 倍）</td></tr><tr><th>影像</th><td><b>上下左右顛倒</b>、平面</td><td>正立、立體</td></tr><tr><th>適合看</th><td>細胞、細胞裡的構造（葉綠體、細胞核）</td><td>較大的構造（花的雄蕊、昆蟲的腳）</td></tr></tbody></table></div>\n  <div class="formula"><div class="fx"><span>放大倍率</span>＝<span>目鏡</span>×<span>物鏡</span></div></div>\n  <figure class="dg"><svg viewBox="0 0 520 170" role="img" aria-label="複式顯微鏡移動玻片">${AH}\n   <g font-family="Noto Sans TC,sans-serif" text-anchor="middle"><circle cx="130" cy="85" r="70" fill="none" stroke="var(--ink)" stroke-width="3"/><circle cx="95" cy="55" r="12" fill="var(--sc)"/><path d="M106 66 L122 80" stroke="var(--bad)" stroke-width="3" stroke-dasharray="4 3" marker-end="url(#ah)"/><circle cx="130" cy="85" r="4" fill="var(--muted)"/>\n   <text x="130" y="168" fill="var(--ink)" font-size="13" font-weight="700">影像在左上方</text>\n   <text x="280" y="60" text-anchor="start" fill="var(--ink)" font-size="14" font-weight="900">想移到中央？</text><text x="280" y="90" text-anchor="start" fill="var(--bad)" font-size="14" font-weight="700">玻片也往左上方移</text><text x="280" y="118" text-anchor="start" fill="var(--muted)" font-size="13">（影像顛倒，偏哪就往哪推）</text></g></svg>\n   <figcaption>圖 3　複式顯微鏡：影像偏哪邊，玻片就往哪邊移。</figcaption></figure>\n  <ol class="pts"><li>先用<b>低倍</b>找到目標，再換高倍。</li><li>換高倍後：視野<b>變暗、範圍變小、看到的細胞變少變大</b>；只能用<b>細調節輪</b>。</li><li>亮度用<b>光圈和反光鏡（光源）</b>調。</li></ol>`,side:[["口訣","偏哪推哪。"],["判斷技巧","看「細胞裡面的東西」用複式；看「看得到但太小的構造」用解剖。（111 會考第 17 題）"]],ex:"bp2",exNote:["葉綠體在細胞裡面，非常小 → 要高倍的複式顯微鏡。","數一朵小花的雄蕊，構造比較大、要看立體 → 解剖顯微鏡。","所以阿彥用複式、阿秀用解剖，選 C。"],pr:"bm2"},{t:"擴散與滲透：物質怎麼進出細胞",star:"★★",main:`<p class="law"><span>擴散</span>分子會從<em>濃度高</em>的地方往<em>濃度低</em>的地方移動，直到兩邊一樣。</p>\n  <p><b>滲透</b>是水分子通過細胞膜的擴散。想成：<b>水往「比較鹹（溶質多）」的那邊跑</b>。</p>\n  <figure class="dg"><svg viewBox="0 0 560 170" role="img" aria-label="紅血球在不同溶液">${AH}\n   <g font-family="Noto Sans TC,sans-serif" text-anchor="middle">\n   ${[[90,"清水",44,"吸水脹大甚至破裂","in"],[280,"生理食鹽水",34,"形狀不變",""],[470,"濃鹽水",24,"失水皺縮","out"]].map(([t,e,a,i,s])=>`<text x="${t}" y="22" fill="var(--ink)" font-size="14" font-weight="900">${e}</text><circle cx="${t}" cy="85" r="${a}" fill="var(--bad)" opacity=".55" stroke="var(--bad)" stroke-width="2"/>${s==="in"?`<path d="M${t-70} 85 H${t-a-4}" stroke="var(--earth)" stroke-width="3" marker-end="url(#ah)"/>`:s==="out"?`<path d="M${t-a-2} 85 H${t-70}" stroke="var(--earth)" stroke-width="3" marker-end="url(#ah)"/>`:""}<text x="${t}" y="155" fill="var(--muted)" font-size="13" font-weight="700">${i}</text>`).join("")}</g></svg>\n   <figcaption>圖 4　紅血球（動物細胞）放進不同溶液。藍色箭頭是水移動的方向。</figcaption></figure>\n  <p>植物細胞放進清水也會吸水，但有<b>細胞壁</b>撐住，不會脹破。</p>`,side:[["易錯","能通過膜的物質（葡萄糖）最後兩邊都有；不能通過的（澱粉）只留在原處。（112 會考第 24 題）"],["生活實例","泡菜加鹽會出水、葡萄乾泡水會膨脹，都是滲透。"]],ex:"bp13",exNote:["葡萄糖能通過膜 → 會擴散到燒杯 → 試管和燒杯都有葡萄糖 → 本氏液兩邊都變色。","澱粉不能通過 → 只在燒杯 → 碘液只有燒杯變色（A、B 錯）。","選 D。"],pr:"bm4"},{t:"組成層次與生物圈",star:"★",main:`<figure class="dg"><svg viewBox="0 0 600 110" role="img" aria-label="組成層次">${AH}\n   <g font-family="Noto Sans TC,sans-serif" text-anchor="middle">${[["細胞","肌肉細胞"],["組織","肌肉組織"],["器官","心臟"],["器官系統","循環系統"],["個體","人"]].map(([t,e],a)=>`<text x="${60+a*120}" y="45" fill="var(--ink)" font-size="${16}" font-weight="900">${t}</text><text x="${60+a*120}" y="72" fill="var(--muted)" font-size="12">${e}</text>${a<4?`<path d="M${100+a*120} 40 H${130+a*120}" stroke="var(--sc)" stroke-width="3" marker-end="url(#ah)"/>`:""}`).join("")}\n   <text x="300" y="102" fill="var(--bad)" font-size="13" font-weight="700">植物沒有「器官系統」這一層</text></g></svg>\n   <figcaption>圖 5　由小到大：細胞 → 組織 → 器官 → 器官系統 → 個體。</figcaption></figure>\n  <p><b>生物圈</b>是地球上有生物生活的範圍：大氣圈下層、整個水圈、岩石圈上層。生物圈裡的生物都需要：陽光（能量）、水、空氣、適當的溫度和養分。</p>`,side:[["記法","心臟、葉、花、根都是「器官」，由好幾種組織組成。"],["易錯","植物：細胞 → 組織 → 器官 → 個體，沒有器官系統。"]],ex:"bm3",exNote:["最小的是細胞，好幾個相同的細胞組成組織。","不同組織組成器官，器官組成器官系統，最後是個體。","細胞→組織→器官→系統→個體，選 B。"],pr:"pr173"}],end:["bp24","bm1","fig36","pr175","pr176","pr178"],sumT:"顯微鏡一次整理",sumH:["","做法","原因","最常錯"],summary:[["找目標","先用低倍","視野大、亮","直接用高倍"],["移動玻片","影像偏哪往哪推","影像上下左右顛倒","往反方向推"],["換高倍","只轉細調節輪","物鏡離玻片很近","轉粗調節輪壓破玻片"],["調亮度","光圈、反光鏡","控制進光量","去轉調節輪"]]};REF[102]={intro:"生物要活下去，需要<b>養分</b>當材料和燃料。這一章先學怎麼<b>檢驗</b>食物裡有什麼養分，再看幫忙分解養分的小幫手<b>酵素</b>，接著是植物自己做養分的<b>光合作用</b>，最後跟著食物走一趟人體的<b>消化道</b>。每年 2～3 題。",map:mkMap("養分與能量",[["養分檢測","碘液・本氏液","★★"],["酵素","專一性・溫度","★★★"],["光合作用","CO₂＋水→葡萄糖","★★★"],["光合 vs 呼吸","存錢與花錢","★★★"],["消化系統","口→胃→小腸","★★"]]),table:[["養分種類與檢測","★★","111-32"],["酵素的特性","★★★","111-32、115-37"],["光合作用反應式","★★★","112-16"],["光合作用與呼吸作用","★★★","111-18、114-8"],["消化器官與消化液","★★","115-37"]],cs:[{t:"六大養分與檢測方法",star:"★★",main:`<p>食物裡的養分分成六大類。前三種能<b>提供能量</b>，後三種不提供能量，但身體一樣少不了。</p>\n  <div class="cmp"><table><thead><tr><th></th><th>養分</th><th>消化後變成</th></tr></thead><tbody>\n   <tr><th rowspan="3">提供能量</th><td>醣類（澱粉）</td><td>葡萄糖</td></tr><tr><td>蛋白質</td><td>胺基酸</td></tr><tr><td>脂質</td><td>脂肪酸＋甘油</td></tr>\n   <tr><th>不提供能量</th><td colspan="2">維生素、礦物質、水</td></tr></tbody></table></div>\n  <figure class="dg"><svg viewBox="0 0 600 200" role="img" aria-label="碘液與本氏液檢測">${AH}\n   <g font-family="Noto Sans TC,sans-serif" text-anchor="middle">\n   <text x="150" y="20" fill="var(--ink)" font-size="15" font-weight="900">碘液 → 驗澱粉</text>\n   <path d="M95 40 V140 a15 15 0 0 0 30 0 V40" fill="none" stroke="var(--ink)" stroke-width="2.5"/><rect x="97" y="90" width="26" height="64" rx="12" fill="#c9a24a" opacity=".8"/>\n   <path d="M135 110 H165" stroke="var(--muted)" stroke-width="2.5" marker-end="url(#ah)"/>\n   <path d="M180 40 V140 a15 15 0 0 0 30 0 V40" fill="none" stroke="var(--ink)" stroke-width="2.5"/><rect x="182" y="90" width="26" height="64" rx="12" fill="#2b2a5a"/>\n   <text x="110" y="185" fill="var(--muted)" font-size="12">黃褐色</text><text x="195" y="185" fill="var(--ink)" font-size="13" font-weight="700">藍黑色＝有澱粉</text>\n   <text x="440" y="20" fill="var(--ink)" font-size="15" font-weight="900">本氏液 → 驗葡萄糖</text>\n   <path d="M365 40 V140 a15 15 0 0 0 30 0 V40" fill="none" stroke="var(--ink)" stroke-width="2.5"/><rect x="367" y="90" width="26" height="64" rx="12" fill="#3b82c4"/>\n   <path d="M405 110 H475" stroke="var(--bad)" stroke-width="2.5" marker-end="url(#ah)"/><text x="440" y="100" fill="var(--bad)" font-size="12" font-weight="700">隔水加熱</text>\n   <path d="M490 40 V140 a15 15 0 0 0 30 0 V40" fill="none" stroke="var(--ink)" stroke-width="2.5"/><rect x="492" y="90" width="26" height="64" rx="12" fill="#d0542f"/>\n   <text x="380" y="185" fill="var(--muted)" font-size="12">藍色</text><text x="505" y="185" fill="var(--ink)" font-size="13" font-weight="700">黃→橙→紅</text></g></svg>\n   <figcaption>圖 1　碘液不用加熱；本氏液一定要隔水加熱才會變色。</figcaption></figure>`,side:[["記法","碘「澱」藍黑；本氏「糖」加熱變紅。"],["易錯","本氏液驗的是葡萄糖等還原醣，不是澱粉；沒加熱就不會變色。"]],ex:"bm5",exNote:["題目用的是本氏液，而且有隔水加熱。","本氏液檢驗的是葡萄糖等還原醣。","出現紅色沉澱 → 含有還原醣，選 B。"],pr:"pr180"},{t:"酵素：分解養分的小幫手",star:"★★★",main:`<p class="law"><span>酵素的四個特性</span>① 主要成分是<em>蛋白質</em>。② 能<em>加快</em>反應，反應後自己<em>不會被用掉</em>。③ 有<em>專一性</em>：一種酵素只對一種受質作用，像一把鑰匙開一個鎖。④ 受<em>溫度</em>和<em>酸鹼（pH）</em>影響。</p>\n  <figure class="dg"><svg viewBox="0 0 600 230" role="img" aria-label="酵素活性與溫度">${AH}\n   <g font-family="Noto Sans TC,sans-serif">\n   <path d="M70 190 H560" stroke="var(--ink)" stroke-width="2" marker-end="url(#ah)"/><path d="M70 190 V25" stroke="var(--ink)" stroke-width="2" marker-end="url(#ah)"/>\n   <text x="565" y="214" text-anchor="end" fill="var(--muted)" font-size="12">溫度（℃）</text><text x="80" y="22" fill="var(--muted)" font-size="12">活性</text>\n   <path d="M80 182 C180 170 230 60 280 55 C320 52 340 100 380 180 L400 188 H540" fill="none" stroke="var(--sc)" stroke-width="4"/>\n   <line x1="280" y1="55" x2="280" y2="190" stroke="var(--muted)" stroke-dasharray="4 4"/>\n   <text x="280" y="208" text-anchor="middle" fill="var(--ink)" font-size="13" font-weight="700">37（體溫）</text>\n   <text x="290" y="45" fill="var(--sc)" font-size="13" font-weight="900">最適溫度：活性最高</text>\n   <text x="80" y="208" fill="var(--muted)" font-size="12">低溫：變慢，回溫可恢復</text>\n   <text x="410" y="170" fill="var(--bad)" font-size="12" font-weight="700">高溫：變性，回不來</text></g></svg>\n   <figcaption>圖 2　人體酵素在 37℃ 左右最有效。低溫只是「睡著」，高溫是「壞掉」。</figcaption></figure>\n  <p>酸鹼也一樣：<b>胃蛋白酶</b>喜歡胃裡的酸性，到了偏鹼性的小腸就不太能作用。</p>`,side:[["易錯","煮沸過的酵素降回 37℃ 也救不回來，因為已經變性。"],["判斷技巧","碘液檢測後「不變藍黑」→ 澱粉被分解了 → 那一管有酵素作用。"]],ex:"bp5",exNote:["碘液遇到澱粉才會變藍黑色。","甲呈藍黑 → 澱粉還在；乙呈黃褐 → 澱粉不見了。","澱粉被分解，代表乙加了含酵素的蜂蜜，選 C。"],pr:"pr185"},{t:"光合作用：植物自己做養分",star:"★★★",main:`<p>植物的<b>葉綠體</b>能利用光能，把二氧化碳和水做成葡萄糖，同時放出氧氣。</p>\n  <div class="formula"><div class="fx"><span>CO₂</span>＋<span>水</span> → <span>葡萄糖</span>＋<span>O₂</span></div>\n   <div class="fl"><div><b>需要</b>光、葉綠體<small>只有綠色、照得到光的細胞能做</small></div><div><b>產物去哪</b>葡萄糖可轉成澱粉存起來<small>運送時變成蔗糖，走韌皮部</small></div></div></div>\n  <figure class="dg"><svg viewBox="0 0 600 220" role="img" aria-label="葉片的光合作用">${AH}\n   <g font-family="Noto Sans TC,sans-serif" text-anchor="middle">\n   <circle cx="70" cy="45" r="24" fill="#f2b632"/><text x="70" y="90" fill="var(--ink)" font-size="13" font-weight="700">光</text>\n   <path d="M100 55 L215 95" stroke="#f2b632" stroke-width="3" marker-end="url(#ah)"/>\n   <path d="M230 110 C280 40 400 40 450 110 C400 180 280 180 230 110 Z" fill="var(--sc)" opacity=".85"/><path d="M230 110 H450" stroke="var(--paper)" stroke-width="2"/>\n   <text x="340" y="104" fill="var(--on-sc)" font-size="14" font-weight="900">葉綠體</text>\n   <path d="M120 150 L222 125" stroke="var(--muted)" stroke-width="2.5" marker-end="url(#ah)"/><text x="80" y="160" fill="var(--ink)" font-size="14" font-weight="700">CO₂</text><text x="80" y="178" fill="var(--muted)" font-size="11">從氣孔進來</text>\n   <path d="M340 215 V172" stroke="#3b82c4" stroke-width="2.5" marker-end="url(#ah)"/><text x="380" y="210" fill="#3b82c4" font-size="13" font-weight="700">水（根→木質部）</text>\n   <path d="M458 90 L540 55" stroke="var(--ok)" stroke-width="2.5" marker-end="url(#ah)"/><text x="560" y="48" fill="var(--ok)" font-size="14" font-weight="700">O₂</text>\n   <path d="M458 130 L530 160" stroke="var(--bad)" stroke-width="2.5" marker-end="url(#ah)"/><text x="555" y="182" fill="var(--bad)" font-size="13" font-weight="700">葡萄糖</text></g></svg>\n   <figcaption>圖 3　原料：CO₂（氣孔）＋水（木質部）；產物：葡萄糖＋O₂。</figcaption></figure>\n  <p><b>驗證實驗</b>：植物先放黑暗中把澱粉用光，再一半葉子遮光、一半照光。滴碘液後只有<em>照光</em>的部分變藍黑色。</p>`,side:[["易錯","題目把反應式寫成「甲＋CO₂ → O₂＋乙＋水」時，甲是水、乙是葡萄糖。"],["注意","水由木質部往上送；葡萄糖（蔗糖）由韌皮部送。"]],ex:"bp12",exNote:["有二氧化碳當原料、放出氧氣 → 這是光合作用。","光合作用的原料是 CO₂ 和水，所以甲是水。","水由根吸收後經木質部往上運送，選 A。"],pr:"pr186"},{t:"光合作用 vs 呼吸作用",star:"★★★",main:`<p>光合作用像<b>存錢</b>（把能量存進葡萄糖），呼吸作用像<b>花錢</b>（把葡萄糖分解拿出能量）。兩者剛好方向相反。</p>\n  <div class="cmp"><table><thead><tr><th></th><th>光合作用</th><th>呼吸作用</th></tr></thead><tbody>\n   <tr><th>誰在做</th><td>含葉綠體、照到光的細胞</td><td><b>所有活細胞</b>（有粒線體）</td></tr>\n   <tr><th>什麼時候</th><td>只有白天（有光）</td><td><b>24 小時</b>都在做</td></tr>\n   <tr><th>吸進</th><td>CO₂、水</td><td>O₂、葡萄糖</td></tr>\n   <tr><th>放出</th><td>O₂、葡萄糖</td><td>CO₂、水、能量</td></tr></tbody></table></div>\n  <figure class="dg"><svg viewBox="0 0 600 190" role="img" aria-label="白天與晚上的氣體進出">${AH}\n   <g font-family="Noto Sans TC,sans-serif" text-anchor="middle">\n   <text x="150" y="22" fill="var(--ink)" font-size="15" font-weight="900">白天（光強）</text>\n   <circle cx="150" cy="100" r="48" fill="var(--sc)" opacity=".85"/><text x="150" y="98" fill="var(--on-sc)" font-size="13" font-weight="900">光合＋呼吸</text><text x="150" y="116" fill="var(--on-sc)" font-size="11">光合比較多</text>\n   <path d="M205 80 H275" stroke="var(--ok)" stroke-width="3" marker-end="url(#ah)"/><text x="240" y="70" fill="var(--ok)" font-size="13" font-weight="700">放出 O₂</text>\n   <path d="M275 125 H205" stroke="var(--muted)" stroke-width="3" marker-end="url(#ah)"/><text x="240" y="146" fill="var(--muted)" font-size="13">吸進 CO₂</text>\n   <text x="450" y="22" fill="var(--ink)" font-size="15" font-weight="900">晚上（沒光）／不綠的部位</text>\n   <circle cx="450" cy="100" r="48" fill="var(--muted)" opacity=".35"/><text x="450" y="105" fill="var(--ink)" font-size="13" font-weight="900">只有呼吸</text>\n   <path d="M505 80 H575" stroke="var(--bad)" stroke-width="3" marker-end="url(#ah)"/><text x="540" y="70" fill="var(--bad)" font-size="13" font-weight="700">放出 CO₂</text>\n   <path d="M575 125 H505" stroke="var(--muted)" stroke-width="3" marker-end="url(#ah)"/><text x="540" y="146" fill="var(--muted)" font-size="13">吸進 O₂</text>\n   <text x="300" y="182" fill="var(--muted)" font-size="12">根、白色的莖、晚上的葉子，都只呼吸</text></g></svg>\n   <figcaption>圖 4　照光的綠色部位「淨」放出 O₂；不照光或不綠的部位只放出 CO₂。</figcaption></figure>`,side:[["判斷技巧","問「能呼吸的細胞數」和「能光合的細胞數」：呼吸一定比較多，因為有些細胞沒有葉綠體。（111 會考第 18 題）"],["易錯","晚上植物不是停止一切，而是只剩呼吸作用。"]],ex:"bp25",exNote:["甲是綠色、照到光 → 能光合也能呼吸，整體放出 O₂。","乙在土裡、白色 → 沒有葉綠素也沒光，只能呼吸，放出 CO₂。","所以「甲能釋出 O₂，乙不能」，選 A。"],pr:"pr187"},{t:"消化系統：食物的旅程",star:"★★",main:`<p>食物從口進來，沿著<b>消化道</b>一路被切小、分解，最後在<b>小腸</b>被吸收。旁邊的<b>消化腺</b>（唾液腺、肝臟、胰臟）負責送消化液進來。</p>\n  <figure class="dg"><svg viewBox="0 0 640 230" role="img" aria-label="消化道與消化液">${AH}\n   <g font-family="Noto Sans TC,sans-serif" text-anchor="middle">\n   ${[["口腔","唾液","澱粉→麥芽糖"],["食道","—","只負責運送"],["胃","胃液（酸）","開始分解蛋白質"],["小腸","胰液・腸液・膽汁","三大養分都分解\n主要吸收處"],["大腸","—","吸收水分"]].map(([t,e,a],i)=>{const s=64+i*128,r=i===3;return`<rect x="${s-50}" y="40" width="100" height="56" rx="28" fill="var(--sc)" opacity="${r?1:.25}"/><text x="${s}" y="75" fill="${r?"var(--on-sc)":"var(--ink)"}" font-size="17" font-weight="900">${t}</text>${i<4?`<path d="M${s+52} 68 H${s+74}" stroke="var(--muted)" stroke-width="2.5" marker-end="url(#ah)"/>`:""}<text x="${s}" y="125" fill="var(--accent)" font-size="12" font-weight="700">${e}</text>${a.split("\n").map((t,e)=>`<text x="${s}" y="${150+e*18}" fill="${e?"var(--bad)":"var(--ink)"}" font-size="12" ${e?'font-weight="700"':""}>${t}</text>`).join("")}`}).join("")}\n   <text x="320" y="22" fill="var(--muted)" font-size="12">消化道（食物經過的路）</text>\n   <text x="320" y="215" fill="var(--muted)" font-size="12">膽汁：肝臟製造、膽囊儲存；沒有酵素，只把油滴打小（乳化）</text></g></svg>\n   <figcaption>圖 5　小腸有胰液、腸液、膽汁，內壁有絨毛，是消化和吸收最主要的地方。</figcaption></figure>`,side:[["易錯","膽汁不含酵素；它是由肝臟製造，不是膽囊。"],["記法","澱粉→葡萄糖、蛋白質→胺基酸、脂質→脂肪酸＋甘油。"]],ex:"bp33",exNote:["這個酵素以蛋白質為受質，把蛋白質分解成產物 X。","膽汁沒有酵素，A 不對；酵素是「分解蛋白質」，不是分解或合成 X，C、D 不對。","胰液含有分解蛋白質的酵素，選 B。"],pr:"bm8"}],end:["bp3","fig15","fig38","pr188","pr189"],sumT:"消化液一次整理",sumH:["","從哪來","分解什麼","特別注意"],summary:[["唾液","唾液腺","澱粉","飯嚼久會變甜"],["胃液","胃","蛋白質","強酸性"],["膽汁","肝臟（膽囊儲存）","不分解，只乳化脂質","沒有酵素"],["胰液","胰臟","澱粉、蛋白質、脂質","流進小腸"],["腸液","小腸","澱粉、蛋白質、脂質","小腸消化最完整"]]};REF[103]={intro:"養分和氧要送到全身每個細胞，就需要<b>運輸系統</b>。植物靠<b>維管束</b>（木質部、韌皮部）和<b>蒸散作用</b>；人靠<b>血液、血管、心臟</b>。考題最愛心臟的四個腔室和兩條循環路線。每年 1～2 題。",map:mkMap("生物的運輸作用",[["維管束","木質部・韌皮部","★★"],["蒸散作用","氣孔・拉力","★"],["血液","四種成分","★★"],["血管","動脈・靜脈・微血管","★★"],["心臟與循環","體循環・肺循環","★★★"]]),table:[["木質部與韌皮部","★★","課本基本題"],["蒸散作用","★","課本基本題"],["血液的成分","★★","課本基本題"],["三種血管","★★","課本基本題"],["心臟與血液循環","★★★","111-26、115-39"]],cs:[{t:"植物的運輸：木質部與韌皮部",star:"★★",main:`<p>植物莖裡的<b>維管束</b>就像兩組水管：一組送水，一組送養分。</p>\n  <figure class="dg"><svg viewBox="0 0 600 230" role="img" aria-label="維管束的兩種管">${AH}\n   <g font-family="Noto Sans TC,sans-serif" text-anchor="middle">\n   <rect x="250" y="20" width="40" height="190" rx="6" fill="#3b82c4" opacity=".8"/><rect x="310" y="20" width="40" height="190" rx="6" fill="#e0913a" opacity=".85"/>\n   <text x="270" y="118" fill="#fff" font-size="15" font-weight="900" writing-mode="tb">木質部</text><text x="330" y="118" fill="#fff" font-size="15" font-weight="900" writing-mode="tb">韌皮部</text>\n   <path d="M230 200 V40" stroke="#3b82c4" stroke-width="4" marker-end="url(#ah)"/>\n   <path d="M372 70 V30" stroke="#e0913a" stroke-width="4" marker-end="url(#ah)"/><path d="M372 160 V200" stroke="#e0913a" stroke-width="4" marker-end="url(#ah)"/><circle cx="372" cy="115" r="6" fill="#e0913a"/>\n   <text x="130" y="90" fill="#3b82c4" font-size="15" font-weight="900">水＋礦物質</text><text x="130" y="112" fill="var(--ink)" font-size="13">根 → 往上送</text><text x="130" y="132" fill="var(--ink)" font-size="13" font-weight="700">只能由下往上</text>\n   <text x="475" y="90" fill="#e0913a" font-size="15" font-weight="900">養分（蔗糖）</text><text x="475" y="112" fill="var(--ink)" font-size="13">葉 → 送到全身</text><text x="475" y="132" fill="var(--ink)" font-size="13" font-weight="700">可上可下</text></g></svg>\n   <figcaption>圖 1　木質部在內側、韌皮部在外側（靠樹皮）。</figcaption></figure>\n  <ol class="pts"><li><b>紅墨水實驗</b>：芹菜插紅墨水，切開莖 → 被染紅的是<em>木質部</em>（水走的路）。</li><li><b>環狀剝皮</b>：剝掉一圈樹皮（含韌皮部）→ 葉子的養分送不下去，<em>切口上方膨大</em>。</li></ol>`,side:[["記法","木「水」上升；韌「糖」上下。"],["易錯","剝樹皮破壞的是韌皮部，水分仍然能經木質部往上送。"]],ex:"bm9",exNote:["題目問的是「葉子製造的養分」。","養分（糖）由韌皮部運送，可往上也可往下。","木質部送的是水和礦物質，所以選 B。"],pr:"b1h31"},{t:"蒸散作用：把水往上拉",star:"★",main:`<p class="law"><span>蒸散作用</span>水分從葉片的<em>氣孔</em>變成水蒸氣散失。葉子一直「喝水」，就把根吸的水經木質部<em>往上拉</em>，這是水往上運送的主要力量。</p>\n  <figure class="dg"><svg viewBox="0 0 600 200" role="img" aria-label="蒸散作用拉水">${AH}\n   <g font-family="Noto Sans TC,sans-serif" text-anchor="middle">\n   <path d="M300 185 V60" stroke="var(--sc)" stroke-width="10" stroke-linecap="round"/>\n   <path d="M300 75 C250 40 200 50 180 70 C220 90 270 90 300 75 Z" fill="var(--sc)"/><path d="M300 75 C350 40 400 50 420 70 C380 90 330 90 300 75 Z" fill="var(--sc)"/>\n   <path d="M300 185 l-30 12 M300 185 l30 12 M300 185 v14" stroke="var(--earth)" stroke-width="4" stroke-linecap="round"/>\n   <path d="M200 60 C190 40 205 30 195 10" fill="none" stroke="#3b82c4" stroke-width="2.5" stroke-dasharray="4 4" marker-end="url(#ah)"/><path d="M400 60 C410 40 395 30 405 10" fill="none" stroke="#3b82c4" stroke-width="2.5" stroke-dasharray="4 4" marker-end="url(#ah)"/>\n   <text x="100" y="52" fill="#3b82c4" font-size="13" font-weight="700">水蒸氣從氣孔散出</text>\n   <path d="M325 175 V100" stroke="#3b82c4" stroke-width="3" marker-end="url(#ah)"/><text x="400" y="145" fill="#3b82c4" font-size="13" font-weight="700">水被往上拉</text>\n   <text x="460" y="190" fill="var(--muted)" font-size="12">根吸水</text></g></svg>\n   <figcaption>圖 2　氣孔大多在葉的下表皮。</figcaption></figure>\n  <div class="cmp"><table><thead><tr><th>條件</th><th>蒸散變快還是變慢</th></tr></thead><tbody>\n   <tr><th>溫度高、有陽光</th><td><b>變快</b></td></tr><tr><th>空氣乾燥、有風</th><td><b>變快</b></td></tr><tr><th>空氣潮濕、氣孔關閉</th><td>變慢</td></tr></tbody></table></div>`,side:[["記法","跟晾衣服一樣：熱、乾、有風 → 乾得快。"]],ex:"pr199",exNote:["蒸散就是葉子的水分蒸發。","炎熱讓水蒸發快、乾燥讓水氣容易散開、有風把水氣吹走。","三個條件都讓蒸散變快，選 A。"],pr:"bm13"},{t:"血液：四種成分",star:"★★",main:`<p>血液靜置後會分成兩層：上層淡黃色的<b>血漿</b>，下層是<b>血球</b>。</p>\n  <figure class="dg"><svg viewBox="0 0 600 210" role="img" aria-label="血液成分">\n   <g font-family="Noto Sans TC,sans-serif">\n   <path d="M90 20 V170 a25 25 0 0 0 50 0 V20" fill="none" stroke="var(--ink)" stroke-width="2.5"/>\n   <rect x="92" y="40" width="46" height="80" fill="#f1d48a"/><rect x="92" y="120" width="46" height="6" fill="#eee"/><path d="M92 126 H138 V170 a23 23 0 0 1 -46 0 Z" fill="#c0392b"/>\n   ${[["血漿","約 55%","運送養分、廢物、激素","#c9a24a",80],["白血球","最大、有核","吞噬病菌、防禦","var(--muted)",123],["紅血球","圓盤形、成熟時無核","含血紅素，運送氧氣","#c0392b",160],["血小板","最小、碎片","幫助血液凝固","var(--accent)",195]].map(([t,e,a,i,s])=>`${s<190?`<path d="M146 ${s} H190" stroke="var(--muted)" stroke-width="1.5"/>`:""}<text x="200" y="${s+5}" fill="${i}" font-size="15" font-weight="900">${t}</text><text x="270" y="${s+5}" fill="var(--muted)" font-size="12">${e}</text><text x="400" y="${s+5}" fill="var(--ink)" font-size="13">${a}</text>`).join("")}</g></svg>\n   <figcaption>圖 3　紅血球數量最多；白血球體積最大；血小板最小。</figcaption></figure>`,side:[["易錯","成熟紅血球沒有細胞核。"],["判斷技巧","住高山、空氣稀薄 → 紅血球變多；被細菌感染 → 白血球變多。"]],ex:"bm10",exNote:["題目問「運送氧氣」。","紅血球裡有血紅素，能和氧結合。","白血球防禦、血小板凝血、血漿運養分，所以選 C。"],pr:"pr191"},{t:"血管：動脈、靜脈、微血管",star:"★★",main:`<p class="law"><span>判斷動脈或靜脈</span>看<em>血流方向</em>，不是看含氧量：離開心臟的叫<em>動脈</em>，回到心臟的叫<em>靜脈</em>。</p>\n  <figure class="dg"><svg viewBox="0 0 600 170" role="img" aria-label="三種血管">${AH}\n   <g font-family="Noto Sans TC,sans-serif" text-anchor="middle">\n   <circle cx="100" cy="70" r="46" fill="none" stroke="#c0392b" stroke-width="14"/><circle cx="100" cy="70" r="30" fill="#c0392b" opacity=".25"/>\n   <text x="100" y="140" fill="var(--ink)" font-size="15" font-weight="900">動脈</text><text x="100" y="160" fill="var(--muted)" font-size="12">壁最厚、有彈性、血壓高</text>\n   <circle cx="300" cy="70" r="46" fill="none" stroke="#3b6fc4" stroke-width="6"/><circle cx="300" cy="70" r="40" fill="#3b6fc4" opacity=".2"/><path d="M270 60 L300 85 L330 60" fill="none" stroke="#3b6fc4" stroke-width="3"/>\n   <text x="300" y="140" fill="var(--ink)" font-size="15" font-weight="900">靜脈</text><text x="300" y="160" fill="var(--muted)" font-size="12">壁較薄、有瓣膜防倒流</text>\n   <circle cx="500" cy="70" r="14" fill="none" stroke="var(--sc)" stroke-width="2"/><circle cx="500" cy="70" r="6" fill="#c0392b"/>\n   <path d="M420 70 H486 M514 70 H580" stroke="#c0392b" stroke-width="3" stroke-dasharray="2 4"/>\n   <text x="500" y="140" fill="var(--ink)" font-size="15" font-weight="900">微血管</text><text x="500" y="160" fill="var(--muted)" font-size="12">壁只有一層細胞、交換物質</text></g></svg>\n   <figcaption>圖 4　血液流向：心臟 → 動脈 → 微血管 → 靜脈 → 心臟。</figcaption></figure>`,side:[["易錯","肺動脈流缺氧血、肺靜脈流充氧血。名字跟方向有關，跟含氧量無關。"]],ex:"bm11",exNote:["要和組織細胞交換物質，管壁要最薄。","微血管的管壁只有一層細胞。","所以選 C。"],pr:"pr198"},{t:"心臟與兩條循環路線",star:"★★★",main:`<p>心臟有四個房間：上面兩個<b>心房</b>（收血），下面兩個<b>心室</b>（打血出去）。右邊管<b>肺</b>，左邊管<b>全身</b>。</p>\n  <figure class="dg"><svg viewBox="0 0 640 300" role="img" aria-label="心臟與血液循環">${AH}\n   <g font-family="Noto Sans TC,sans-serif" text-anchor="middle">\n   <rect x="230" y="20" width="180" height="40" rx="20" fill="var(--muted)" opacity=".25"/><text x="320" y="46" fill="var(--ink)" font-size="15" font-weight="900">肺（換氣）</text>\n   <rect x="230" y="250" width="180" height="40" rx="20" fill="var(--muted)" opacity=".25"/><text x="320" y="276" fill="var(--ink)" font-size="15" font-weight="900">全身組織</text>\n   <rect x="220" y="95" width="98" height="60" rx="10" fill="#3b6fc4" opacity=".85"/><text x="269" y="122" fill="#fff" font-size="14" font-weight="900">右心房</text><text x="269" y="141" fill="#fff" font-size="11">缺氧血</text>\n   <rect x="220" y="160" width="98" height="70" rx="10" fill="#3b6fc4"/><text x="269" y="192" fill="#fff" font-size="14" font-weight="900">右心室</text><text x="269" y="211" fill="#fff" font-size="11">缺氧血</text>\n   <rect x="322" y="95" width="98" height="60" rx="10" fill="#c0392b" opacity=".85"/><text x="371" y="122" fill="#fff" font-size="14" font-weight="900">左心房</text><text x="371" y="141" fill="#fff" font-size="11">充氧血</text>\n   <rect x="322" y="160" width="98" height="70" rx="10" fill="#c0392b"/><text x="371" y="192" fill="#fff" font-size="14" font-weight="900">左心室</text><text x="371" y="211" fill="#fff" font-size="11">壁最厚</text>\n   <path d="M218 200 H150 V40 H222" fill="none" stroke="#3b6fc4" stroke-width="3" marker-end="url(#ah)"/><text x="120" y="110" fill="#3b6fc4" font-size="13" font-weight="700">肺動脈</text>\n   <path d="M412 40 H490 V120 H426" fill="none" stroke="#c0392b" stroke-width="3" marker-end="url(#ah)"/><text x="525" y="80" fill="#c0392b" font-size="13" font-weight="700">肺靜脈</text>\n   <path d="M422 200 H560 V270 H418" fill="none" stroke="#c0392b" stroke-width="3" marker-end="url(#ah)"/><text x="595" y="240" fill="#c0392b" font-size="13" font-weight="700">主動脈</text>\n   <path d="M228 270 H80 V125 H214" fill="none" stroke="#3b6fc4" stroke-width="3" marker-end="url(#ah)"/><text x="45" y="200" fill="#3b6fc4" font-size="13" font-weight="700">大靜脈</text></g></svg>\n   <figcaption>圖 5　畫成你自己身體的方向。課本的圖是「面對別人」，左右會相反。</figcaption></figure>\n  <div class="cmp"><table><thead><tr><th></th><th>路線</th></tr></thead><tbody>\n   <tr><th>肺循環</th><td>右心室 → 肺動脈 → 肺 → 肺靜脈 → <b>左心房</b></td></tr>\n   <tr><th>體循環</th><td>左心室 → 主動脈 → 全身 → 大靜脈 → <b>右心房</b></td></tr></tbody></table></div>`,side:[["口訣","室出房入：血從心室出去，從心房回來。"],["易錯","血液回心臟一定先進「心房」，不會直接進心室。（115 會考第 39 題）"]],ex:"bp4",exNote:["甲含氧量高 → 充氧血 → 左心室；乙含氧量低 → 右心室。","心室連接的是動脈：左心室接主動脈、右心室接肺動脈。","乙（右心室）與肺動脈連接，選 D。"],pr:"bm12"}],end:["bp34","fig12","pr195","pr196","pr197"],sumT:"心臟的血管一次整理",sumH:["","連接哪個腔室","血流方向","血液"],summary:[["主動脈","左心室","心臟 → 全身","充氧血"],["大靜脈","右心房","全身 → 心臟","缺氧血"],["肺動脈","右心室","心臟 → 肺","缺氧血"],["肺靜脈","左心房","肺 → 心臟","充氧血"]]};REF[104]={intro:"身體要對外界做出反應，靠兩套系統：<b>神經</b>像傳簡訊，又快又準；<b>激素</b>像廣播，經血液送到全身，慢但作用久。植物沒有神經，也會對光、重力、觸碰做出反應。大約每年 1 題。",map:mkMap("生物的協調作用",[["神經系統","大腦・小腦・腦幹","★★"],["反射與意識","經不經過大腦","★★"],["內分泌","激素經血液","★★"],["植物的感應","向性・快速運動","★★"]]),table:[["神經系統的構造","★★","課本基本題"],["反射與意識行為","★★","課本基本題"],["激素與內分泌腺","★★","113-5"],["植物的向性與感應","★★","111-5"]],cs:[{t:"神經系統：身體的指揮中心",star:"★★",main:`<p>神經系統分成<b>中樞神經</b>（腦、脊髓）和<b>周圍神經</b>（腦神經、脊神經）。腦又分成三個部分，各管不同的事：</p>\n  <figure class="dg"><svg viewBox="0 0 600 220" role="img" aria-label="腦的三個部分">\n   <g font-family="Noto Sans TC,sans-serif">\n   <path d="M90 140 C60 60 150 20 230 30 C310 35 330 90 300 130 C280 150 200 155 150 150 Z" fill="var(--sc)" opacity=".85"/>\n   <path d="M215 150 C240 140 290 140 300 165 C290 185 240 185 225 170 Z" fill="var(--accent)" opacity=".85"/>\n   <path d="M190 150 C195 175 200 195 205 215 L222 215 C218 190 215 170 214 150 Z" fill="var(--muted)" opacity=".7"/>\n   <text x="190" y="95" text-anchor="middle" fill="var(--on-sc)" font-size="16" font-weight="900">大腦</text>\n   <path d="M300 75 H360" stroke="var(--sc)" stroke-width="2"/><text x="370" y="72" fill="var(--sc)" font-size="15" font-weight="900">大腦</text><text x="370" y="92" fill="var(--ink)" font-size="13">思考、記憶、判斷、產生感覺</text>\n   <path d="M300 163 H360" stroke="var(--accent)" stroke-width="2"/><text x="370" y="148" fill="var(--accent)" font-size="15" font-weight="900">小腦</text><text x="370" y="168" fill="var(--ink)" font-size="13">平衡、協調動作（喝醉會走不穩）</text>\n   <path d="M222 205 H360" stroke="var(--muted)" stroke-width="2"/><text x="370" y="200" fill="var(--ink)" font-size="15" font-weight="900">腦幹</text><text x="370" y="218" fill="var(--ink)" font-size="13">呼吸、心跳、血壓（維持生命）</text></g></svg>\n   <figcaption>圖 1　腦往下接著脊髓，脊髓負責傳訊息，也管一些反射。</figcaption></figure>\n  <p>訊息的路徑：<b>受器</b>（接收刺激，如眼睛、皮膚）→ 感覺神經 → 中樞 → 運動神經 → <b>動器</b>（做出反應，如肌肉）。</p>`,side:[["記法","大腦「想」、小腦「穩」、腦幹「活」。"],["易錯","感覺（痛、看到）都是在大腦產生，不是在受器產生。"]],ex:"bm15",exNote:["題目問「平衡、協調肌肉運動」。","這是小腦的工作。","大腦管思考、腦幹管心跳呼吸，所以選 B。"],pr:"pr201"},{t:"反射與意識行為",star:"★★",main:`<p class="law"><span>怎麼分</span>有沒有經過<em>大腦</em>思考。反射的中樞在<em>脊髓或腦幹</em>，路徑短、反應快；意識行為要經過<em>大腦</em>判斷。</p>\n  <figure class="dg"><svg viewBox="0 0 600 210" role="img" aria-label="縮手反射的路徑">${AH}\n   <g font-family="Noto Sans TC,sans-serif" text-anchor="middle">\n   <rect x="260" y="20" width="80" height="40" rx="20" fill="var(--muted)" opacity=".3"/><text x="300" y="45" fill="var(--ink)" font-size="14" font-weight="900">大腦</text>\n   <rect x="260" y="120" width="80" height="44" rx="10" fill="var(--sc)"/><text x="300" y="147" fill="var(--on-sc)" font-size="14" font-weight="900">脊髓</text>\n   <text x="70" y="148" fill="var(--ink)" font-size="14" font-weight="900">皮膚（受器）</text>\n   <text x="530" y="148" fill="var(--ink)" font-size="14" font-weight="900">肌肉（動器）</text>\n   <path d="M120 155 C170 190 220 175 256 150" fill="none" stroke="var(--bad)" stroke-width="3" marker-end="url(#ah)"/><text x="180" y="200" fill="var(--bad)" font-size="12" font-weight="700">① 感覺神經</text>\n   <path d="M344 150 C380 175 430 190 478 155" fill="none" stroke="var(--bad)" stroke-width="3" marker-end="url(#ah)"/><text x="420" y="200" fill="var(--bad)" font-size="12" font-weight="700">② 運動神經 → 縮手</text>\n   <path d="M300 116 V66" stroke="var(--muted)" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ah)"/><text x="400" y="92" fill="var(--muted)" font-size="12">③ 之後才傳到大腦 → 感到痛</text></g></svg>\n   <figcaption>圖 2　縮手反射：先縮手，再感覺到痛。</figcaption></figure>\n  <div class="cmp"><table><thead><tr><th></th><th>反射</th><th>意識行為</th></tr></thead><tbody>\n   <tr><th>中樞</th><td>脊髓（縮手、膝跳）、腦幹（眨眼、咳嗽）</td><td>大腦</td></tr>\n   <tr><th>速度</th><td>快、不用想</td><td>較慢、要判斷</td></tr>\n   <tr><th>例子</th><td>碰到燙鍋縮手</td><td>看到紅燈停下來、聽到鈴聲接電話</td></tr></tbody></table></div>`,side:[["易錯","反射不經過大腦，但大腦「事後」還是會感覺到。"]],ex:"bm14",exNote:["碰到燙鍋立刻縮手，來不及想 → 是反射。","縮手、膝跳這類反射的中樞在脊髓。","所以選 C。"],pr:"pr205"},{t:"內分泌系統與激素",star:"★★",main:`<p class="law"><span>激素</span>由<em>內分泌腺</em>分泌。內分泌腺<em>沒有導管</em>，激素直接進入<em>血液</em>，隨血液送到全身。量很少，但作用很大。</p>\n  <div class="cmp"><table><thead><tr><th>腺體</th><th>激素</th><th>作用</th></tr></thead><tbody>\n   <tr><th>腦垂腺</th><td>生長激素</td><td>促進生長（不足長不高、過多長太高）</td></tr>\n   <tr><th>甲狀腺</th><td>甲狀腺素（需要碘）</td><td>促進代謝；過多會消瘦、心跳快</td></tr>\n   <tr><th>副甲狀腺</th><td>副甲狀腺素</td><td>調節血中的<b>鈣</b>；過多會骨質疏鬆</td></tr>\n   <tr><th>胰島（胰臟內）</th><td>胰島素／升糖素</td><td>胰島素<b>降</b>血糖；升糖素<b>升</b>血糖</td></tr>\n   <tr><th>腎上腺</th><td>腎上腺素</td><td>緊急時心跳加快、血糖上升</td></tr></tbody></table></div>\n  <figure class="dg"><svg viewBox="0 0 600 120" role="img" aria-label="神經與激素比較">\n   <g font-family="Noto Sans TC,sans-serif" text-anchor="middle">\n   <text x="150" y="25" fill="var(--ink)" font-size="15" font-weight="900">神經＝傳簡訊</text>\n   <path d="M60 60 H240" stroke="var(--sc)" stroke-width="4"/><circle cx="60" cy="60" r="8" fill="var(--sc)"/><circle cx="240" cy="60" r="8" fill="var(--sc)"/>\n   <text x="150" y="95" fill="var(--muted)" font-size="12">快、只到指定的地方、作用短</text>\n   <text x="450" y="25" fill="var(--ink)" font-size="15" font-weight="900">激素＝廣播</text>\n   <circle cx="450" cy="60" r="8" fill="var(--bad)"/><circle cx="450" cy="60" r="20" fill="none" stroke="var(--bad)" opacity=".6"/><circle cx="450" cy="60" r="32" fill="none" stroke="var(--bad)" opacity=".35"/>\n   <text x="450" y="112" fill="var(--muted)" font-size="12">經血液送到全身、慢、作用久</text></g></svg>\n   <figcaption>圖 3　神經和激素一起合作，讓身體協調。</figcaption></figure>`,side:[["易錯","激素是經「血液」運送，不是經神經或導管。（113 會考第 5 題）"],["記法","全身只有胰島素能「降」血糖。"]],ex:"bp16",exNote:["內分泌腺沒有導管，激素直接進入血液 → X 是血液。","副甲狀腺素調節血液中的鈣。","分泌過多把骨頭的鈣拉出來 → 骨質疏鬆，Y 是鈣，選 A。"],pr:"pr202"},{t:"植物的感應：慢的和快的",star:"★★",main:`<p>植物沒有神經，但一樣會對刺激做出反應。重點是分清楚<b>慢的</b>和<b>快的</b>。</p>\n  <figure class="dg"><svg viewBox="0 0 600 200" role="img" aria-label="植物感應快慢">\n   <g font-family="Noto Sans TC,sans-serif" text-anchor="middle">\n   <text x="150" y="22" fill="var(--ink)" font-size="15" font-weight="900">向性：靠「生長」，要好幾天</text>\n   <circle cx="250" cy="70" r="18" fill="#f2b632"/>\n   <path d="M120 180 C120 130 140 90 200 72" fill="none" stroke="var(--sc)" stroke-width="6" stroke-linecap="round"/><path d="M200 72 l-14 -10 M200 72 l-6 14" stroke="var(--sc)" stroke-width="5" stroke-linecap="round"/>\n   <text x="80" y="110" fill="var(--sc)" font-size="13" font-weight="700">莖向光</text>\n   <path d="M120 180 V198" stroke="var(--earth)" stroke-width="5"/><text x="160" y="196" fill="var(--earth)" font-size="12" font-weight="700">根向地</text>\n   <text x="450" y="22" fill="var(--ink)" font-size="15" font-weight="900">快速運動：靠「膨壓」，幾秒</text>\n   ${[["含羞草","被碰觸就閉合",60],["捕蠅草","蟲碰到就夾住",110],["酢漿草","晚上葉片下垂",160]].map(([t,e,a])=>`<text x="390" y="${a+5}" fill="var(--accent)" font-size="15" font-weight="900">${t}</text><text x="500" y="${a+5}" fill="var(--ink)" font-size="13">${e}</text>`).join("")}\n   <line x1="300" y1="40" x2="300" y2="190" stroke="var(--muted)" stroke-dasharray="4 4"/></g></svg>\n   <figcaption>圖 4　會「長彎」的是向性，很慢；會「開合」的是膨壓改變，很快。</figcaption></figure>`,side:[["判斷技巧","問「哪個反應最慢」→ 找跟生長有關的（向光、向地）。（111 會考第 5 題）"],["記法","酢漿草晚上下垂叫「睡眠運動」，含羞草被碰閉合叫「觸發運動」。"]],ex:"bp0",exNote:["朱槿向光彎曲是向光性，靠生長，要好幾天。","捕蠅草、酢漿草、含羞草都是膨壓改變，很快。","所需時間最長的是 A。"],pr:"pr207"}],end:["bm17","pr206","pr208","pr209","b1h40"],sumT:"協調方式一次整理",sumH:["","靠什麼傳","速度","例子"],summary:[["神經","電訊號，經神經","最快","縮手、看到紅燈停下"],["激素","化學物質，經血液","較慢、作用久","胰島素降血糖"],["植物向性","生長不平均","很慢（幾天）","莖向光、根向地"],["植物快速運動","膨壓改變","快（幾秒）","含羞草閉合"]]};REF[105]={intro:"天氣再熱、吃再多糖，人的體溫、血糖、水分都能維持在差不多的範圍，這叫<b>恆定性</b>。這一章看四件事：<b>呼吸</b>、<b>體溫</b>、<b>血糖</b>、<b>排泄</b>。解題秘訣是看血液流過器官「多了什麼、少了什麼」。每年 1～2 題。",map:mkMap("生物的恆定性",[["呼吸與氣體交換","橫膈・肺泡","★★"],["體溫調節","內溫・外溫","★"],["血糖恆定","胰島素・升糖素","★★★"],["排泄","肝造尿素・腎排出","★★★"]]),table:[["呼吸運動與氣體交換","★★","課本基本題"],["體溫調節","★","課本基本題"],["血糖恆定","★★★","112-8"],["排泄與腎臟","★★★","111-35、113-33、115-20"]],cs:[{t:"呼吸運動與氣體交換",star:"★★",main:`<p>吸氣、呼氣靠的是<b>橫膈</b>和<b>肋骨</b>改變胸腔大小。胸腔變大，壓力變小，空氣就被吸進來。</p>\n  <figure class="dg"><svg viewBox="0 0 600 210" role="img" aria-label="吸氣與呼氣">${AH}\n   <g font-family="Noto Sans TC,sans-serif" text-anchor="middle">\n   ${[[150,"吸氣",1],[450,"呼氣",0]].map(([t,e,a])=>`<text x="${t}" y="22" fill="var(--ink)" font-size="16" font-weight="900">${e}</text>\n   <path d="M${t-80} 50 L${t-(a?95:75)} 160 M${t+80} 50 L${t+(a?95:75)} 160" stroke="var(--muted)" stroke-width="4" stroke-linecap="round"/>\n   <ellipse cx="${t-35}" cy="105" rx="${a?34:26}" ry="${a?52:42}" fill="var(--bad)" opacity=".35"/><ellipse cx="${t+35}" cy="105" rx="${a?34:26}" ry="${a?52:42}" fill="var(--bad)" opacity=".35"/>\n   <path d="M${t-95} ${a?172:150} Q${t} ${a?178:120} ${t+95} ${a?172:150}" fill="none" stroke="var(--sc)" stroke-width="5"/>\n   <path d="M${t} ${a?150:148} V${a?180:118}" stroke="var(--sc)" stroke-width="3" marker-end="url(#ah)"/>\n   <text x="${t}" y="200" fill="var(--sc)" font-size="13" font-weight="700">${a?"橫膈收縮下降・肋骨上舉 → 胸腔變大":"橫膈舒張上升・肋骨下降 → 胸腔變小"}</text>`).join("")}</g></svg>\n   <figcaption>圖 1　鐘罩模型：把底部橡皮膜（橫膈）往下拉，氣球（肺）變大＝吸氣。</figcaption></figure>\n  <p class="law"><span>氣體交換在肺泡</span>肺泡很多、很小、表面積大，外面包著微血管。<em>O₂ 擴散進血液</em>，<em>CO₂ 擴散進肺泡</em>，所以呼出的氣體 O₂ 少、CO₂ 多。</p>`,side:[["易錯","「呼吸運動」是吸氣呼氣；「呼吸作用」是細胞分解養分拿能量，兩個不一樣。"]],ex:"bm18",exNote:["吸氣要讓胸腔變大。","橫膈收縮往下降、肋骨往上舉。","選 B。"],pr:"pr210"},{t:"體溫調節",star:"★",main:`<p><b>內溫動物</b>（只有鳥類和哺乳類）體溫恆定；<b>外溫動物</b>（魚、兩生、爬蟲類）體溫隨環境改變，冬天常冬眠。</p>\n  <div class="cmp"><table><thead><tr><th></th><th>天氣熱：要散熱</th><th>天氣冷：要保熱</th></tr></thead><tbody>\n   <tr><th>皮膚血管</th><td><b>舒張</b>（臉紅），熱從皮膚散出</td><td><b>收縮</b>（臉白），減少散熱</td></tr>\n   <tr><th>汗腺</th><td>流汗增加，汗蒸發帶走熱</td><td>流汗減少</td></tr>\n   <tr><th>肌肉</th><td>—</td><td>發抖，肌肉收縮產熱</td></tr></tbody></table></div>`,side:[["記法","熱 → 開（血管開、汗開）；冷 → 關＋抖。"]],ex:"bm19",exNote:["天氣熱，身體要把熱散出去。","皮膚血管舒張讓熱散出，流汗增加讓汗蒸發帶走熱。","選 B。"],pr:"pr211"},{t:"血糖恆定：胰島素與升糖素",star:"★★★",main:`<p>胰臟裡的<b>胰島</b>分泌兩種作用相反的激素，把血糖維持在差不多 90 mg/100mL 左右。</p>\n  <figure class="dg"><svg viewBox="0 0 600 220" role="img" aria-label="血糖調節">${AH}\n   <g font-family="Noto Sans TC,sans-serif" text-anchor="middle">\n   <rect x="230" y="90" width="140" height="44" rx="22" fill="var(--sc)"/><text x="300" y="117" fill="var(--on-sc)" font-size="15" font-weight="900">血糖正常</text>\n   <text x="130" y="40" fill="var(--bad)" font-size="15" font-weight="900">血糖太高（飯後）</text>\n   <path d="M150 52 C150 90 180 105 224 108" fill="none" stroke="var(--bad)" stroke-width="3" marker-end="url(#ah)"/>\n   <text x="110" y="85" fill="var(--ink)" font-size="13" font-weight="700">胰島素 ↑</text><text x="110" y="104" fill="var(--muted)" font-size="12">細胞吸收葡萄糖</text><text x="110" y="121" fill="var(--muted)" font-size="12">肝臟存成肝糖</text>\n   <text x="470" y="200" fill="#3b6fc4" font-size="15" font-weight="900">血糖太低（餓了）</text>\n   <path d="M450 185 C450 145 420 125 376 120" fill="none" stroke="#3b6fc4" stroke-width="3" marker-end="url(#ah)"/>\n   <text x="500" y="128" fill="var(--ink)" font-size="13" font-weight="700">升糖素 ↑</text><text x="500" y="147" fill="var(--muted)" font-size="12">肝糖分解成葡萄糖</text>\n   <text x="300" y="190" fill="var(--muted)" font-size="12">胰島素不足 → 血糖降不下來 → 糖尿病</text></g></svg>\n   <figcaption>圖 2　胰島素「降」血糖，升糖素「升」血糖，兩個都由胰島分泌。</figcaption></figure>`,side:[["易錯","胰島素和升糖素都是胰島分泌的，不是肝臟；肝臟是儲存肝糖的倉庫。"],["判斷技巧","尿中出現葡萄糖 → 血糖太高，超過腎臟能再吸收的量。"]],ex:"bp10",exNote:["讓血糖「快速下降」的激素是胰島素。","胰島素由胰臟裡的胰島分泌，不是肝臟。","選 C。"],pr:"bm20"},{t:"排泄：肝臟造尿素，腎臟排出",star:"★★★",main:`<p>蛋白質分解會產生有毒的<b>氨</b>。肝臟把氨變成比較沒毒的<b>尿素</b>，再由腎臟從血液中濾出，做成尿液。</p>\n  <figure class="dg"><svg viewBox="0 0 640 170" role="img" aria-label="泌尿路徑">${AH}\n   <g font-family="Noto Sans TC,sans-serif" text-anchor="middle">\n   ${[["肝臟","製造尿素"],["腎臟","過濾血液、做尿"],["輸尿管","輸送"],["膀胱","暫時儲存"],["尿道","排出"]].map(([t,e],a)=>{const i=64+a*128,s=a===1;return`<rect x="${i-50}" y="40" width="100" height="56" rx="28" fill="${a?"var(--sc)":"var(--accent)"}" opacity="${s?1:.3}"/><text x="${i}" y="75" fill="${s?"var(--on-sc)":"var(--ink)"}" font-size="17" font-weight="900">${t}</text>${a<4?`<path d="M${i+52} 68 H${i+74}" stroke="var(--muted)" stroke-width="2.5" ${a?"":'stroke-dasharray="4 3"'} marker-end="url(#ah)"/>`:""}<text x="${i}" y="125" fill="var(--ink)" font-size="13">${e}</text>`}).join("")}\n   <text x="128" y="28" fill="var(--muted)" font-size="11">經血液送去</text>\n   <text x="320" y="158" fill="var(--muted)" font-size="12">泌尿系統：腎臟 → 輸尿管 → 膀胱 → 尿道</text></g></svg>\n   <figcaption>圖 3　肝臟不屬於泌尿系統，但尿素是它做的。</figcaption></figure>\n  <div class="cmp"><table><thead><tr><th>血液流過後</th><th>尿素</th><th>氧氣</th><th>是哪個器官</th></tr></thead><tbody>\n   <tr><td>流出肝臟</td><td><b>變多 ↑</b></td><td>變少</td><td>肝臟（製造尿素）</td></tr>\n   <tr><td>流出腎臟</td><td><b>變少 ↓</b></td><td>變少</td><td>腎臟（濾掉尿素）</td></tr></tbody></table></div>`,side:[["判斷技巧","每個器官都會用掉氧。尿素變多 → 肝臟；尿素變少 → 腎臟。（111 會考第 35 題）"],["注意","正常尿液沒有葡萄糖，因為腎臟會全部再吸收回去。"]],ex:"bp6",exNote:["血液流出甲後尿素上升 → 甲在製造尿素。","製造尿素的是肝臟（腎臟是把尿素濾掉，會讓尿素下降）。","氧氣下降是所有器官都會發生的，選 B。"],pr:"bm21"}],end:["bp20","bp29","fig39","pr217","pr218"],sumT:"恆定性一次整理",sumH:["","變太高時","變太低時","負責的器官"],summary:[["體溫","血管舒張、流汗","血管收縮、發抖","皮膚、肌肉"],["血糖","胰島素降血糖","升糖素升血糖","胰島、肝臟"],["水分","尿量變多、變淡","尿量變少、變濃","腎臟"],["CO₂","呼吸加快排出","—","肺"]]};REF[106]={intro:"生物會老會死，要靠<b>生殖</b>把生命延續下去。這一章先比較兩種細胞分裂，再看<b>無性生殖</b>和<b>有性生殖</b>，最後是開花植物的花怎麼變成果實和種子。每年固定 1 題。",map:mkMap("生殖",[["細胞分裂","數目不變・減半","★★★"],["性染色體","XX・XY","★★"],["無性生殖","子代和親代一樣","★★"],["開花植物","子房→果實","★★★"],["動物生殖","受精・發育","★"]]),table:[["細胞分裂與減數分裂","★★★","113-30"],["性染色體","★★","111-39"],["無性生殖","★★","課本基本題"],["花與果實、種子","★★★","112-35、115-13"],["動物的生殖","★","課本基本題"]],cs:[{t:"細胞分裂 vs 減數分裂",star:"★★★",main:`<p>體細胞的染色體是<b>一對一對</b>的，像成雙的鞋子。做精子或卵時，每雙只拿一隻，數目就<b>減半</b>；精卵結合後又湊回成對。</p>\n  <figure class="dg"><svg viewBox="0 0 620 230" role="img" aria-label="減數分裂與受精">${AH}\n   <g font-family="Noto Sans TC,sans-serif" text-anchor="middle">\n   ${[[80,46,"體細胞"],[230,23,"精子"],[230,23,"卵"],[400,46,"受精卵"],[540,46,"新個體的細胞"]].map(([t,e,a],i)=>{const s=i===2?170:i===1?60:115;const r=e===46?36:26;return`<circle cx="${t}" cy="${s}" r="${r}" fill="var(--sc)" opacity="${e===46?.85:.4}"/><text x="${t}" y="${s+6}" fill="${e===46?"var(--on-sc)":"var(--ink)"}" font-size="17" font-weight="900">${e}</text><text x="${t}" y="${s+r+18}" fill="var(--ink)" font-size="13" font-weight="700">${a}</text>`}).join("")}\n   <path d="M118 100 L200 68" stroke="var(--bad)" stroke-width="3" marker-end="url(#ah)"/><path d="M118 130 L200 162" stroke="var(--bad)" stroke-width="3" marker-end="url(#ah)"/>\n   <text x="150" y="72" fill="var(--bad)" font-size="12" font-weight="700">減數分裂</text><text x="150" y="168" fill="var(--bad)" font-size="12" font-weight="700">減半</text>\n   <path d="M260 70 L360 106" stroke="var(--muted)" stroke-width="3" marker-end="url(#ah)"/><path d="M260 162 L360 126" stroke="var(--muted)" stroke-width="3" marker-end="url(#ah)"/>\n   <text x="325" y="72" fill="var(--muted)" font-size="12" font-weight="700">受精</text>\n   <path d="M440 115 H498" stroke="var(--ok)" stroke-width="3" marker-end="url(#ah)"/><text x="470" y="100" fill="var(--ok)" font-size="12" font-weight="700">細胞分裂</text><text x="470" y="140" fill="var(--ok)" font-size="11">數目不變</text></g></svg>\n   <figcaption>圖 1　以人為例：46 →（減數分裂）23 →（受精）46 →（細胞分裂）46。</figcaption></figure>\n  <div class="cmp"><table><thead><tr><th></th><th>細胞分裂</th><th>減數分裂</th></tr></thead><tbody>\n   <tr><th>在哪裡</th><td>全身（生長、修補傷口）</td><td>只在生殖器官（精巢、卵巢）</td></tr>\n   <tr><th>染色體數目</th><td><b>不變</b></td><td><b>減半</b>，成對的分開</td></tr>\n   <tr><th>產生</th><td>體細胞</td><td>精子、卵（生殖細胞）</td></tr></tbody></table></div>`,side:[["判斷技巧","「有幾對」→ 生殖細胞就有「對數」那麼多條。青蛙 13 對 → 卵 13 條。"],["易錯","減數分裂後性染色體只剩 1 條，不是 1 對。（113 會考第 30 題）"]],ex:"bp19",exNote:["青蛙有 13 對染色體，其中 1 對是性染色體。","減數分裂把每一對分開，卵只拿到每對中的 1 條。","所以性染色體只剩 1 條，選 A。"],pr:"bm22"},{t:"性染色體：誰有成對的？",star:"★★",main:`<p>人有 23 對染色體，其中 1 對是<b>性染色體</b>：女生 <b>XX</b>、男生 <b>XY</b>。</p>\n  <div class="cmp"><table><thead><tr><th>細胞</th><th>有沒有成對的性染色體</th><th>原因</th></tr></thead><tbody>\n   <tr><td>體細胞（口腔皮膜、皮膚）</td><td>✓ 有</td><td>一般細胞都成對</td></tr>\n   <tr><td>受精卵</td><td>✓ 有</td><td>精＋卵又湊回成對</td></tr>\n   <tr><td>精子、卵</td><td><b>✗ 沒有</b></td><td>減數分裂後只剩 1 條</td></tr>\n   <tr><td>成熟紅血球</td><td><b>✗ 沒有</b></td><td>沒有細胞核，根本沒有染色體</td></tr></tbody></table></div>\n  <p class="law"><span>生男生女</span>卵一定帶 <em>X</em>；精子帶 X 或 Y。所以決定性別的是<em>精子</em>，機率各 1/2。</p>`,side:[["易錯","成熟紅血球沒有細胞核，常被拿來當陷阱。（111 會考第 39 題）"]],ex:"bp7",exNote:["甲卵細胞：減數分裂後只有 1 條性染色體 → 不成對。","丁成熟紅血球：沒有細胞核，沒有染色體 → 不成對。","乙受精卵、丙口腔皮膜細胞都有成對的，選 B。"],pr:"pr226"},{t:"無性生殖：複製一份自己",star:"★★",main:`<p class="law"><span>無性生殖</span>不需要精卵結合，只靠一個親代。子代的遺傳性狀和親代<em>幾乎一樣</em>，可以保留優良性狀，但變異少。</p>\n  <div class="cmp"><table><thead><tr><th>方式</th><th>例子</th></tr></thead><tbody>\n   <tr><th>分裂生殖</th><td>草履蟲、細菌：一個變兩個</td></tr>\n   <tr><th>出芽生殖</th><td>酵母菌、水螅：長出小芽再脫離</td></tr>\n   <tr><th>孢子繁殖</th><td>黴菌、蕨類</td></tr>\n   <tr><th>營養器官繁殖</th><td>用根、莖、葉繁殖：馬鈴薯塊莖、草莓走莖、扦插</td></tr>\n   <tr><th>組織培養</th><td>蘭花：取一小塊組織大量培養</td></tr></tbody></table></div>`,side:[["記法","無性＝影印機，印出來都一樣；有性＝洗牌，每次組合都不同。"],["易錯","種子是受精後形成的，用種子播種屬於有性生殖。"]],ex:"bm24",exNote:["無性生殖只有一個親代，不經過受精。","子代的遺傳物質從親代複製而來。","所以性狀和親代幾乎相同，選 A。"],pr:"pr223"},{t:"開花植物：花怎麼變成果實",star:"★★★",main:`<p>花粉落到柱頭叫<b>授粉</b>；花粉管長到胚珠，精細胞和卵結合才叫<b>受精</b>。受精後，花的各部分會變成：</p>\n  <figure class="dg"><svg viewBox="0 0 600 230" role="img" aria-label="花的構造與受精後的變化">${AH}\n   <g font-family="Noto Sans TC,sans-serif" text-anchor="middle">\n   <path d="M170 60 C175 120 160 150 140 170 C160 190 200 190 220 170 C200 150 185 120 190 60 Z" fill="var(--sc)" opacity=".85"/>\n   <ellipse cx="180" cy="55" rx="16" ry="8" fill="var(--sc)"/>\n   <circle cx="170" cy="168" r="7" fill="#f2b632"/><circle cx="190" cy="168" r="7" fill="#f2b632"/>\n   <path d="M110 180 L95 60 M250 180 L265 60" stroke="var(--muted)" stroke-width="3"/><ellipse cx="95" cy="52" rx="10" ry="14" fill="var(--accent)"/><ellipse cx="265" cy="52" rx="10" ry="14" fill="var(--accent)"/>\n   <path d="M80 190 Q180 225 280 190" fill="none" stroke="var(--earth)" stroke-width="6"/>\n   <text x="45" y="45" fill="var(--accent)" font-size="12" font-weight="700">花藥</text><text x="45" y="61" fill="var(--muted)" font-size="11">產生花粉</text>\n   <text x="180" y="30" fill="var(--sc)" font-size="12" font-weight="700">柱頭</text>\n   <text x="180" y="225" fill="var(--earth)" font-size="12" font-weight="700">花托</text>\n   ${[["子房","果實",120],["胚珠","種子",160],["受精卵","胚（長成新植物）",200]].map(([t,e,a],i)=>`<text x="380" y="${a}" fill="var(--ink)" font-size="16" font-weight="900">${t}</text><path d="M415 ${a-5} H465" stroke="var(--bad)" stroke-width="3" marker-end="url(#ah)"/><text x="475" y="${a}" text-anchor="start" fill="var(--bad)" font-size="16" font-weight="900">${e}</text>`).join("")}\n   <path d="M220 150 L350 115" stroke="var(--muted)" stroke-dasharray="3 4"/><path d="M198 168 L350 155" stroke="var(--muted)" stroke-dasharray="3 4"/></g></svg>\n   <figcaption>圖 2　子房 → 果實、胚珠 → 種子。一個胚珠受精變一顆種子。</figcaption></figure>`,side:[["易錯","草莓吃的部分是花托；表面一粒粒的才是果實（由子房發育）。（112 會考第 35 題）"],["判斷技巧","豆莢有 6 顆豆子 → 至少 6 個胚珠受精。花生殼是果皮，花生仁是種子。"]],ex:"bp14",exNote:["題目說小顆粒「由子房發育而成」。","子房發育成的是果實；胚珠才發育成種子。","所以那些小顆粒是果實，選 C。"],pr:"bm25"},{t:"動物的生殖",star:"★",main:`<div class="cmp"><table><thead><tr><th></th><th>體外受精</th><th>體內受精</th></tr></thead><tbody>\n   <tr><th>在哪裡</th><td>水中</td><td>母體內</td></tr><tr><th>例子</th><td>大部分魚、青蛙</td><td>鳥、爬蟲類、哺乳類</td></tr>\n   <tr><th>產卵數</th><td><b>很多</b>（存活率低，用數量彌補）</td><td>較少（受精率高）</td></tr></tbody></table></div>\n  <p><b>胚胎發育的養分</b>：<b>卵生</b>（雞）靠卵黃；<b>胎生</b>（人）靠胎盤和臍帶從母體得到養分和氧。</p>`,side:[["判斷技巧","越沒保護、越容易被吃的，產卵數越多。"]],ex:"pr228",exNote:["體外受精在水中進行，精卵不一定遇得到。","卵和幼魚又容易被吃掉，存活率低。","所以要產很多卵用數量彌補，選 A。"],pr:"b1h61"}],end:["bp28","fig40","pr225","pr229","bm23"],sumT:"有性 vs 無性一次整理",sumH:["","要不要精卵結合","子代和親代","優點"],summary:[["無性生殖","不用","幾乎一樣","快、能保留優良性狀"],["有性生殖","要","有差異、組合多樣","變異大，較能適應環境變化"]]};REF[107]={intro:"為什麼你長得像爸媽，又不完全一樣？答案在<b>基因</b>。這一章最重要的工具是<b>棋盤方格法</b>：只要會畫四格，ABO 血型、3：1、從子代推回親代都能解。每年 1～2 題，常常是計算題。",map:mkMap("遺傳",
