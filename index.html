.5 269.9 L244.0 280.6 L234.2 285.7 L234.0 296.0 L227.2 282.5 L221.0 268.2 L215.8 253.2 L211.6 237.8 L209.0 222.0 L208.0 206.0 Z" fill="#8a2535"/><path d="M100 214 L108 230 M134 212 L126 230 M210 192 L216 210 M246 192 L240 210" stroke="#fbe3d8" stroke-width="3" stroke-linecap="round"/><path d="M96 86 V150" fill="none" stroke="#9fbaff" stroke-width="4" stroke-linecap="round"/><polygon points="96.0,160.0 102.0,149.0 90.0,149.0" fill="#9fbaff"/><path d="M96 300 C96 262 100 236 106 212" fill="none" stroke="#9fbaff" stroke-width="4" stroke-linecap="round"/><polygon points="107.0,203.0 99.2,212.8 111.0,214.9" fill="#9fbaff"/><path d="M140 276 C176 270 180 220 180 180 C180 150 194 128 206 116" fill="none" stroke="#9fbaff" stroke-width="4" stroke-linecap="round"/><polygon points="213.0,110.0 201.0,113.5 209.5,122.0" fill="#9fbaff"/><path d="M150 100 C160 70 196 62 208 86" fill="none" stroke="#ffb3c4" stroke-width="4" stroke-linecap="round"/><polygon points="210.0,96.0 212.9,83.8 201.4,86.9" fill="#ffb3c4"/><path d="M240 176 C246 210 244 240 238 262" fill="none" stroke="#ffb3c4" stroke-width="4" stroke-linecap="round"/><polygon points="236.0,272.0 243.8,262.2 232.0,260.1" fill="#ffb3c4"/><text x="112" y="190" text-anchor="middle" style="fill:#fff;font-weight:700;font-size:16px">甲</text><text x="130" y="258" text-anchor="middle" style="fill:#fff;font-weight:700;font-size:16px">乙</text><text x="222" y="182" text-anchor="middle" style="fill:#fff;font-weight:700;font-size:16px">丙</text><text x="224" y="244" text-anchor="middle" style="fill:#fff;font-weight:700;font-size:16px">丁</text><text x="96" y="62" text-anchor="end">上大靜脈</text><text x="84" y="330" text-anchor="end">下大靜脈</text><text x="208" y="16" text-anchor="start">主動脈</text><text x="262" y="70" text-anchor="start">肺動脈</text><text x="316" y="212" text-anchor="end">肺靜脈</text><text x="170" y="352" text-anchor="middle">面對圖看，左邊是人體的右側</text></svg>',cap:"心臟",q:"上圖是人體心臟的剖面簡圖（面對圖看，左邊是人體的右側）。哪一個腔室負責把血液送到全身，而且肌肉壁最厚？",o:["丁","甲","乙","丙"],a:0,e:"面對別人時，他的右側在你的左邊。所以圖左上甲是右心房、左下乙是右心室、右上丙是左心房、右下丁是左心室。左心室連接主動脈，要把血液打到全身，距離最遠、需要的力量最大，所以肌肉壁最厚（圖中丁的壁明顯比乙厚）。右心室只把血送到肺，壁較薄；心房只負責接收回來的血，壁最薄。",id:"fig12",t:"mine",set:"fig"},{u:107,fig:'<svg viewBox="0 0 300 190" role="img" aria-label="家族譜系圖"><rect x="80" y="30" width="30" height="30" class="ink"/><circle cx="205" cy="45" r="15" class="ink"/><path class="ink" d="M110 45 H190 M150 45 V90 M95 90 H205 M95 90 V110 M205 90 V110"/><rect x="80" y="110" width="30" height="30" class="ink"/><circle cx="205" cy="125" r="15" class="filled"/><text x="95" y="22" text-anchor="middle">父</text><text x="205" y="22" text-anchor="middle">母</text><text x="95" y="158" text-anchor="middle">兒子</text><text x="205" y="158" text-anchor="middle">女兒</text><circle cx="35" cy="175" r="7" class="filled"/><text x="48" y="179" text-anchor="start">塗黑＝有此特徵</text><rect x="160" y="168" width="14" height="14" class="ink"/><text x="180" y="179" text-anchor="start">空白＝沒有</text></svg>',cap:"譜系圖",q:"某家族的特徵遺傳如圖：父母都沒有這個特徵，女兒卻有。下列推論何者正確？",o:["這個特徵是隱性，父母的基因型都是 Aa","這個特徵是顯性","父母都是 AA","女兒的基因型是 Aa"],a:0,e:"父母都沒有，卻生出有的孩子（無中生有），代表這個特徵是隱性 aa。女兒的兩個 a 分別來自爸爸和媽媽，所以父母都帶 a；他們自己沒表現，代表還有一個 A，都是 Aa。女兒表現隱性，一定是 aa。",id:"fig13",t:"mine",set:"fig"},{u:109,fig:'<svg viewBox="0 0 300 190" role="img" aria-label="食物網"><defs><marker id="ah-fig14" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" class="ahd"/></marker></defs><path class="ln" d="M130 160 L80 118" marker-end="url(#ah-fig14)"/><path class="ln" d="M170 160 L220 118" marker-end="url(#ah-fig14)"/><path class="ln" d="M220 94 L220 72" marker-end="url(#ah-fig14)"/><path class="ln" d="M80 94 L135 40" marker-end="url(#ah-fig14)"/><path class="ln" d="M200 52 L165 38" marker-end="url(#ah-fig14)"/><path class="ln" d="M178 26 L232 26" marker-end="url(#ah-fig14)"/><rect x="124" y="158" width="52" height="24" rx="6" class="box"/><text x="150" y="175" text-anchor="middle" class=b>草</text><rect x="44" y="93" width="52" height="24" rx="6" class="box"/><text x="70" y="110" text-anchor="middle" class=b>兔子</text><rect x="194" y="93" width="52" height="24" rx="6" class="box"/><text x="220" y="110" text-anchor="middle" class=b>蚱蜢</text><rect x="194" y="48" width="52" height="24" rx="6" class="box"/><text x="220" y="65" text-anchor="middle" class=b>青蛙</text><rect x="124" y="18" width="52" height="24" rx="6" class="box"/><text x="150" y="35" text-anchor="middle" class=b>蛇</text><rect x="234" y="18" width="52" height="24" rx="6" class="box"/><text x="260" y="35" text-anchor="middle" class=b>老鷹</text></svg>',cap:"食物網",q:"上圖是某草原的食物網（箭頭指向吃牠的生物）。哪些生物是初級消費者？",o:["兔子和蚱蜢","青蛙和蛇","只有草","蛇和老鷹"],a:0,e:"箭頭由「被吃的」指向「吃牠的」。直接吃草（生產者）的是初級消費者：兔子和蚱蜢。青蛙吃蚱蜢是次級消費者；蛇吃兔子和青蛙；老鷹在最上層。草是生產者，不是消費者。",id:"fig14",t:"mine",set:"fig"},{u:102,fig:'<svg viewBox="0 0 300 190" role="img" aria-label="題目附圖"><path class="ax" d="M40 160 H285 M40 160 V15"/><path class="ln" d="M40 150 C100 140 120 40 150 40 C175 40 195 120 230 158"/><path class="gr" d="M150 40 V160"/><text x="150" y="175" text-anchor="middle">37</text><text x="230" y="175" text-anchor="middle">60</text><text x="294" y="182" text-anchor="end">溫度 (℃)</text><text x="6" y="22" text-anchor="start">酵素活性</text></svg>',cap:"酵素活性曲線",q:"人體某消化酵素的活性與溫度關係如圖。下列敘述何者正確？",o:["約 37℃ 活性最好，60℃ 時幾乎失去活性","溫度越高活性一定越好","低溫時酵素會被破壞","活性和溫度無關"],a:0,e:"曲線最高點在 37℃（接近體溫），這時酵素最有效。溫度太高（60℃）酵素變性，活性幾乎為 0，而且降溫也回不來。低溫只是活性變低，酵素沒有被破壞，回到適溫還能作用。",id:"fig15",t:"mine",set:"fig"},{u:205,fig:'<svg viewBox="0 0 300 190" role="img" aria-label="月球繞地球的位置"><circle cx="150" cy="95" r="16" class="earth"/><text x="150" y="99" text-anchor="middle" class=b>地球</text><circle cx="150" cy="95" r="60" class="gr" fill="none"/><circle cx="210" cy="95" r="9" class="ball"/><circle cx="150" cy="35" r="9" class="ball"/><circle cx="90" cy="95" r="9" class="ball"/><circle cx="150" cy="155" r="9" class="ball"/><text x="226" y="99" text-anchor="start">甲</text><text x="150" y="20" text-anchor="middle">乙</text><text x="74" y="99" text-anchor="end">丙</text><text x="150" y="180" text-anchor="middle">丁</text><path class="ln" d="M290 60 H255 M290 95 H255 M290 130 H255"/><text x="292" y="50" text-anchor="end">陽光</text></svg>',cap:"月相位置",q:"如圖，陽光由右方照來，月球在甲、乙、丙、丁四個位置繞地球公轉。月球在丙位置時，看到的月相與可能發生的現象為何？",o:["滿月，可能發生月食","新月，可能發生日食","上弦月，可能發生月食","下弦月，不會有任何天象"],a:0,e:"丙在地球背對太陽的那一側，太陽、地球、月球排成一直線、地球在中間，從地球看月球整面被照亮，是滿月。如果三者剛好排得很直，地球的影子落在月球上，就是月食。甲（月球在中間）才是新月和日食。",id:"fig16",t:"mine",set:"fig"},{u:204,fig:'<svg viewBox="0 0 300 190" role="img" aria-label="鋒面剖面"><path class="soft" d="M20 160 L180 160 L180 160 Q120 150 60 80 L20 80 Z"/><path class="ink" d="M20 160 H285"/><path class="ln2" d="M60 80 Q120 150 180 160"/><text x="50" y="140" text-anchor="start" class=b>冷空氣</text><text x="220" y="130" text-anchor="middle" class=b>暖空氣</text><path class="ln" d="M90 125 H130"/><path class="ln" d="M124 120 L132 125 L124 130"/><path class="ln3" d="M200 110 Q170 80 150 50"/><text x="178" y="39" text-anchor="start">被抬升成雲</text><ellipse cx="140" cy="35" rx="30" ry="12" class="cloud"/></svg>',cap:"冷鋒剖面",q:"某鋒面的剖面如圖：冷空氣由左往右推進，把暖空氣迅速往上抬升。這個鋒面通過後，當地天氣最可能怎麼變化？",o:["氣溫下降，降雨後轉晴","氣溫上升，連續下好幾天雨","氣溫不變","開始吹西南季風"],a:0,e:"冷空氣推著暖空氣走，是冷鋒。暖空氣被快速抬升，常帶來短暫但強的陣雨；鋒面過去以後，當地換成冷空氣控制，氣溫下降、天氣轉晴。連續好幾天的雨多是滯留鋒（梅雨）。",id:"fig17",t:"mine",set:"fig"},{u:202,fig:'<svg viewBox="0 0 300 190" role="img" aria-label="地層與岩脈"><rect x="20" y="130" width="260" height="40" class="lay1"/><rect x="20" y="90" width="260" height="40" class="lay2"/><rect x="20" y="50" width="260" height="40" class="lay3"/><path class="dike" d="M130 170 L150 170 L160 90 L140 90 Z"/><text x="40" y="155" text-anchor="start" class=b>甲</text><text x="40" y="115" text-anchor="start" class=b>乙</text><text x="40" y="75" text-anchor="start" class=b>丙</text><text x="176" y="130" text-anchor="start" class=b>丁（火成岩脈）</text></svg>',cap:"地層剖面",q:"某地層剖面如圖，地層沒有倒轉。火成岩脈丁切穿甲、乙兩層，但沒有切穿丙。由老到新的順序為何？",o:["甲 → 乙 → 丁 → 丙","丁 → 甲 → 乙 → 丙","甲 → 乙 → 丙 → 丁","丙 → 乙 → 甲 → 丁"],a:0,e:"地層沒有倒轉時，下面先形成：甲比乙老、乙比丙老。丁切穿甲和乙，所以丁比它們新（截切定律）；丁沒有切到丙，代表丙是丁形成之後才堆上去的，丙最新。",id:"fig18",t:"mine",set:"fig"},{u:203,fig:'<svg viewBox="0 0 300 190" role="img" aria-label="板塊分開"><path class="soft" d="M20 120 L140 120 L150 100 L160 120 L280 120 L280 170 L20 170 Z"/><path class="ln2" d="M150 170 V105"/><path class="ln" d="M120 145 H60"/><path class="ln" d="M66 140 L58 145 L66 150"/><path class="ln" d="M180 145 H240"/><path class="ln" d="M234 140 L242 145 L234 150"/><path class="ink" d="M20 70 Q60 60 100 70 T180 70 T280 70"/><text x="150" y="40" text-anchor="middle">海面</text><text x="150" y="92" text-anchor="middle">岩漿上升</text><text x="90" y="138" text-anchor="middle">板塊</text><text x="210" y="138" text-anchor="middle">板塊</text></svg>',cap:"張裂型邊界",q:"上圖是海底某處的剖面：兩側板塊往相反方向移動，中間有岩漿上升。這裡最可能形成什麼地形？",o:["中洋脊，是張裂型板塊邊界","海溝，是聚合型板塊邊界","高山，是聚合型板塊邊界","轉形斷層，是錯動型板塊邊界"],a:0,e:"兩個板塊互相分開，是張裂型邊界。岩漿從中間冒出來冷卻，形成新的海洋地殼並隆起成海底山脈（中洋脊），海洋會越來越寬。互相擠壓才是聚合型（海溝、山脈）；水平錯開是錯動型。",id:"fig19",t:"mine",set:"fig"},{u:1,fig:'<svg viewBox="0 0 300 192" role="img" aria-label="題目附圖"><path class="water" d="M50 104 V170 H100 V104 Z"/><path class="ink" d="M50 30 V170 H100 V30"/><path class="ax" d="M50 170 h10"/><text x="64" y="174.0" text-anchor="start">0</text><path class="ax" d="M50 159 h6"/><path class="ax" d="M50 148 h10"/><text x="64" y="152.0" text-anchor="start">10</text><path class="ax" d="M50 137 h6"/><path class="ax" d="M50 126 h10"/><text x="64" y="130.0" text-anchor="start">20</text><path class="ax" d="M50 115 h6"/><path class="ax" d="M50 104 h10"/><text x="64" y="108.0" text-anchor="start">30</text><path class="ax" d="M50 93 h6"/><path class="ax" d="M50 82 h10"/><text x="64" y="86.0" text-anchor="start">40</text><path class="ax" d="M50 71 h6"/><path class="ax" d="M50 60 h10"/><text x="64" y="63.999999999999986" text-anchor="start">50</text><path class="ax" d="M50 49 h6"/><path class="ax" d="M50 38 h10"/><text x="64" y="42.0" text-anchor="start">60</text><text x="75" y="186" text-anchor="middle">放入前</text><path class="water" d="M190 78 V170 H240 V78 Z"/><path class="ink" d="M190 30 V170 H240 V30"/><path class="ax" d="M190 170 h10"/><text x="204" y="174.0" text-anchor="start">0</text><path class="ax" d="M190 159 h6"/><path class="ax" d="M190 148 h10"/><text x="204" y="152.0" text-anchor="start">10</text><path class="ax" d="M190 137 h6"/><path class="ax" d="M190 126 h10"/><text x="204" y="130.0" text-anchor="start">20</text><path class="ax" d="M190 115 h6"/><path class="ax" d="M190 104 h10"/><text x="204" y="108.0" text-anchor="start">30</text><path class="ax" d="M190 93 h6"/><path class="ax" d="M190 82 h10"/><text x="204" y="86.0" text-anchor="start">40</text><path class="ax" d="M190 71 h6"/><path class="ax" d="M190 60 h10"/><text x="204" y="63.999999999999986" text-anchor="start">50</text><path class="ax" d="M190 49 h6"/><path class="ax" d="M190 38 h10"/><text x="204" y="42.0" text-anchor="start">60</text><text x="215" y="186" text-anchor="middle">放入後</text><rect x="205" y="142" width="20" height="16" rx="4" class="box"/></svg>',cap:"量筒讀數（單位 mL）",q:"量筒中原本有水，放入一顆質量 30 g 的石頭後（石頭完全沉入），水面變化如上圖。這顆石頭的密度是多少？",o:["2.5 g/cm³","1.0 g/cm³","0.7 g/cm³","0.4 g/cm³"],a:0,e:"排水法：石頭體積＝水面上升的量＝42−30＝12 mL＝12 cm³。密度＝質量÷體積＝30÷12＝2.5 g/cm³。選 0.7 是用 30÷42（把放入後的讀數當體積）；選 0.4 是把體積÷質量算反了。",id:"fig20",t:"mine",set:"fig"},{u:1,fig:'<svg viewBox="0 0 300 190" role="img" aria-label="題目附圖"><path class="ax" d="M40 160 H285 M40 160 V15"/><path class="ln" d="M40 160 L150 20"/><path class="ln2" d="M40 160 L240 20"/><path class="ln3" d="M40 160 L285 104"/><path class="gr" d="M40 90 H140 M140 160 V90"/><circle cx="140" cy="90" r="3.5" class="dot"/><text x="158" y="24" text-anchor="start">甲</text><text x="248" y="24" text-anchor="start">乙</text><text x="262" y="98" text-anchor="start">丙</text><text x="140" y="175" text-anchor="middle">20</text><text x="32" y="94" text-anchor="end">20</text><text x="294" y="178" text-anchor="end">體積 V (cm³)</text><text x="8" y="12" text-anchor="start">質量 M (g)</text></svg>',cap:"質量–體積圖",q:"甲、乙、丙三種物質的質量–體積關係如上圖（乙的直線剛好是每 1 cm³ 重 1 g）。把它們分別放進水中，哪一種會浮在水面上？",o:["丙","甲","乙","三種都會沉"],a:0,e:"M–V 圖的斜率＝質量÷體積＝密度，線越斜密度越大。乙每 1 cm³ 重 1 g，密度和水一樣（1 g/cm³）；甲比乙斜，密度大於 1，會沉；丙比乙平，密度小於 1，所以會浮在水面。",id:"fig21",t:"mine",set:"fig"},{u:2,fig:'<svg viewBox="0 0 300 186" role="img" aria-label="題目附圖"><path class="gr" d="M20 100 H285"/><path class="ln" d="M20 100 L22 95.8 L24 91.7 L26 87.6 L28 83.7 L30 80.0 L32 76.5 L34 73.2 L36 70.3 L38 67.6 L40 65.4 L42 63.5 L44 62.0 L46 60.9 L48 60.2 L50 60.0 L52 60.2 L54 60.9 L56 62.0 L58 63.5 L60 65.4 L62 67.6 L64 70.3 L66 73.2 L68 76.5 L70 80.0 L72 83.7 L74 87.6 L76 91.7 L78 95.8 L80 100.0 L82 104.2 L84 108.3 L86 112.4 L88 116.3 L90 120.0 L92 123.5 L94 126.8 L96 129.7 L98 132.4 L100 134.6 L102 136.5 L104 138.0 L106 139.1 L108 139.8 L110 140.0 L112 139.8 L114 139.1 L116 138.0 L118 136.5 L120 134.6 L122 132.4 L124 129.7 L126 126.8 L128 123.5 L130 120.0 L132 116.3 L134 112.4 L136 108.3 L138 104.2 L140 100.0 L142 95.8 L144 91.7 L146 87.6 L148 83.7 L150 80.0 L152 76.5 L154 73.2 L156 70.3 L158 67.6 L160 65.4 L162 63.5 L164 62.0 L166 60.9 L168 60.2 L170 60.0 L172 60.2 L174 60.9 L176 62.0 L178 63.5 L180 65.4 L182 67.6 L184 70.3 L186 73.2 L188 76.5 L190 80.0 L192 83.7 L194 87.6 L196 91.7 L198 95.8 L200 100.0 L202 104.2 L204 108.3 L206 112.4 L208 116.3 L210 120.0 L212 123.5 L214 126.8 L216 129.7 L218 132.4 L220 134.6 L222 136.5 L224 138.0 L226 139.1 L228 139.8 L230 140.0 L232 139.8 L234 139.1 L236 138.0 L238 136.5 L240 134.6 L242 132.4 L244 129.7 L246 126.8 L248 123.5 L250 120.0 L252 116.3 L254 112.4 L256 108.3 L258 104.2 L260 100.0 L262 95.8 L264 91.7 L266 87.6 L268 83.7 L270 80.0 L272 76.5 L274 73.2 L276 70.3 L278 67.6 L280 65.4"/><path class="ink" d="M50 60 V100"/><path class="ink" d="M50 46 H170"/><path class="ink" d="M50 40 V52 M170 40 V52"/><text x="110" y="36" text-anchor="middle">40 cm</text><text x="56" y="86" text-anchor="start">5 cm</text><text x="150" y="178" text-anchor="middle">繩波某一瞬間的樣子</text></svg>',cap:"繩波",q:"一條繩波某一瞬間的形狀如上圖，相鄰兩個波峰相距 40 cm，波峰離中線（平衡位置）5 cm。這列波的波長和振幅分別是多少？",o:["波長 40 cm、振幅 5 cm","波長 20 cm、振幅 5 cm","波長 40 cm、振幅 10 cm","波長 80 cm、振幅 10 cm"],a:0,e:"波長是一個完整波形的長度，也就是「相鄰兩個波峰」的距離＝40 cm。振幅是從中線（平衡位置）到波峰的高度＝5 cm。選 10 cm 是把波峰到波谷的距離當成振幅，那其實是振幅的 2 倍。",id:"fig22",t:"mine",set:"fig"},{u:3,fig:'<svg viewBox="0 0 300 176" role="img" aria-label="題目附圖"><path class="ink" d="M40 150 H260"/><path class="ax" d="M48 150 l-8 10"/><path class="ax" d="M60 150 l-8 10"/><path class="ax" d="M72 150 l-8 10"/><path class="ax" d="M84 150 l-8 10"/><path class="ax" d="M96 150 l-8 10"/><path class="ax" d="M108 150 l-8 10"/><path class="ax" d="M120 150 l-8 10"/><path class="ax" d="M132 150 l-8 10"/><path class="ax" d="M144 150 l-8 10"/><path class="ax" d="M156 150 l-8 10"/><path class="ax" d="M168 150 l-8 10"/><path class="ax" d="M180 150 l-8 10"/><path class="ax" d="M192 150 l-8 10"/><path class="ax" d="M204 150 l-8 10"/><path class="ax" d="M216 150 l-8 10"/><path class="ax" d="M228 150 l-8 10"/><path class="ax" d="M240 150 l-8 10"/><path class="ax" d="M252 150 l-8 10"/><path class="gr" d="M150 150 V40"/><path class="ln" d="M70 70 L144.6 144.6"/><polygon class="hd1" points="148.0,148.0 145.5,139.2 139.2,145.5"/><path class="ln2" d="M152 148 L226.6 73.4"/><polygon class="hd2" points="230.0,70.0 221.2,72.5 227.5,78.8"/><path class="ink" d="M118 150 A32 32 0 0 1 127 127"/><text x="104" y="144" text-anchor="start">40°</text><text x="156" y="52" text-anchor="start">法線</text><text x="60" y="64" text-anchor="start">入射光</text><text x="210" y="64" text-anchor="start">反射光</text></svg>',cap:"平面鏡反射",q:"一道光射到平面鏡上，入射光與「鏡面」的夾角是 40°（如圖）。反射角是多少度？",o:["50°","40°","80°","100°"],a:0,e:"反射角要從「法線」量，不是從鏡面量。入射角＝90°−40°＝50°。反射定律：反射角＝入射角＝50°。選 40° 是直接拿鏡面的夾角當答案；80°、100° 是把角度加錯。",id:"fig23",t:"mine",set:"fig"},{u:3,fig:'<svg viewBox="0 0 300 186" role="img" aria-label="題目附圖"><path class="ink" d="M20 95 H280"/><rect x="20" y="95" width="260" height="85" class="water"/><path class="gr" d="M150 15 V180"/><path class="ln" d="M70 20 L144.5 89.7"/><polygon class="hd1" points="148.0,93.0 145.2,84.3 139.2,90.7"/><path class="ln" d="M150 95 L176 175"/><path class="ln3" d="M150 95 L220 160"/><path class="ln2" d="M150 95 L262 140"/><text x="176" y="176" text-anchor="middle" class=b>甲</text><text x="226" y="162" text-anchor="start" class=b>乙</text><text x="266" y="140" text-anchor="start" class=b>丙</text><text x="26" y="88" text-anchor="start">空氣</text><text x="26" y="174" text-anchor="start">水</text><text x="156" y="26" text-anchor="start">法線</text></svg>',cap:"光的折射",q:"一道光從空氣斜射進入水中（如圖）。光在水中最可能沿著哪一條路徑前進？",o:["甲","乙","丙","光會停在水面"],a:0,e:"光從速度快的空氣進入速度慢的水中，會「偏向法線」，折射角比入射角小，所以走甲。乙是沒有轉彎直直穿過（只有垂直入射才會這樣）；丙是偏離法線，那是光從水射向空氣時的情形。",id:"fig24",t:"mine",set:"fig"},{u:4,fig:'<svg viewBox="0 0 300 190" role="img" aria-label="題目附圖"><path class="ax" d="M40 160 H285 M40 160 V15"/><path class="ln" d="M40 140 L200 40"/><path class="ln2" d="M40 140 L270 90"/><path class="gr" d="M200 160 V40 M40 40 H200"/><text x="206" y="40" text-anchor="start">A</text><text x="276" y="90" text-anchor="start">B</text><text x="32" y="144" text-anchor="end">20</text><text x="32" y="44" text-anchor="end">60</text><text x="200" y="175" text-anchor="middle">4</text><text x="294" y="178" text-anchor="end">加熱時間 (分)</text><text x="8" y="12" text-anchor="start">溫度 (℃)</text></svg>',cap:"溫度–時間圖",q:"質量相同的 A、B 兩種液體，用同樣的加熱器加熱，溫度變化如上圖。下列敘述何者正確？",o:["A 的比熱比 B 小","A 的比熱比 B 大","A、B 比熱相同","A 吸收的熱比 B 多"],a:0,e:"同一個加熱器、加熱相同時間，A 和 B 吸收的熱一樣多。質量也一樣，H＝m×s×ΔT，升溫越快（ΔT 越大）的比熱越小。A 的線比較陡，升溫快，所以 A 的比熱比 B 小。",id:"fig25",t:"mine",set:"fig"},{u:5,fig:'<svg viewBox="0 0 300 190" role="img" aria-label="題目附圖"><circle cx="150" cy="95" r="36" class="ink" style="fill:none"/><circle cx="150" cy="95" r="58" class="ink" style="fill:none"/><circle cx="150" cy="95" r="80" class="ink" style="fill:none"/><circle cx="186.0" cy="95.0" r="4.5" class="dot"/><circle cx="114.0" cy="95.0" r="4.5" class="dot"/><circle cx="206.8" cy="106.5" r="4.5" class="dot"/><circle cx="182.0" cy="143.3" r="4.5" class="dot"/><circle cx="138.5" cy="151.8" r="4.5" class="dot"/><circle cx="101.7" cy="127.0" r="4.5" class="dot"/><circle cx="93.2" cy="83.5" r="4.5" class="dot"/><circle cx="118.0" cy="46.7" r="4.5" class="dot"/><circle cx="161.5" cy="38.2" r="4.5" class="dot"/><circle cx="198.3" cy="63.0" r="4.5" class="dot"/><circle cx="179.0" cy="20.4" r="4.5" class="dot"/><circle cx="150" cy="95" r="20" class="box"/><text x="150" y="92" text-anchor="middle" class=b>11p⁺</text><text x="150" y="106" text-anchor="middle">12n</text></svg>',cap:"原子示意圖",q:"上圖是某原子的示意圖（p⁺ 代表質子、n 代表中子、黑點代表電子）。這是哪一種元素的原子？",o:["鈉（Na），質量數 23","鎂（Mg），質量數 23","鈉（Na），質量數 11","氖（Ne），質量數 22"],a:0,e:"決定是哪一種元素的是「質子數」（原子序）。質子 11 個 → 原子序 11 → 鈉。質量數＝質子＋中子＝11＋12＝23。電子 2＋8＋1＝11 個，和質子一樣多，所以是不帶電的原子。",id:"fig26",t:"mine",set:"fig"},{u:8,fig:'<svg viewBox="0 0 300 190" role="img" aria-label="題目附圖"><path class="ax" d="M40 160 H285 M40 160 V15"/><path class="ln" d="M40 150 C110 148 140 140 150 120 C156 100 156 70 162 55 C180 40 230 36 285 34"/><path class="gr" d="M40 95 H285"/><path class="gr" d="M155 160 V95"/><circle cx="90" cy="148" r="4" class="dot"/><circle cx="155" cy="95" r="4" class="dot"/><circle cx="240" cy="36" r="4" class="dot"/><text x="90" y="140" text-anchor="middle">甲</text><text x="166" y="100" text-anchor="start">乙</text><text x="240" y="28" text-anchor="middle">丙</text><text x="32" y="99" text-anchor="end">7</text><text x="155" y="175" text-anchor="middle">20</text><text x="294" y="178" text-anchor="end">加入 NaOH (mL)</text><text x="8" y="12" text-anchor="start">pH</text></svg>',cap:"pH 變化曲線",q:"在鹽酸中慢慢加入氫氧化鈉溶液，pH 值變化如上圖。甲、乙、丙三點中，哪一點酸和鹼剛好完全中和？",o:["乙","甲","丙","三點都是"],a:0,e:"酸鹼剛好完全中和時溶液是中性，pH＝7，就是乙點（加入 20 mL 時）。甲點 pH 小於 7，鹽酸還有剩，是酸性；丙點 pH 大於 7，氫氧化鈉加太多，是鹼性。",id:"fig27",t:"mine",set:"fig"},{u:9,fig:'<svg viewBox="0 0 300 190" role="img" aria-label="題目附圖"><path class="ax" d="M40 160 H285 M40 160 V15"/><path class="ln" d="M40 160 C70 60 100 45 285 42"/><path class="ln2" d="M40 160 C120 90 200 50 285 44"/><path class="gr" d="M40 42 H285"/><text x="110" y="44" text-anchor="start">甲</text><text x="200" y="84" text-anchor="start">乙</text><text x="294" y="178" text-anchor="end">時間</text><text x="8" y="12" text-anchor="start">CO₂ 體積</text></svg>',cap:"CO₂ 體積–時間圖",q:"相同質量的大理石，一份是塊狀、一份是粉末，分別加入足量、相同的鹽酸，產生 CO₂ 的體積變化如上圖。下列何者正確？",o:["甲是粉末，兩者最後產生的 CO₂ 一樣多","甲是塊狀，兩者最後產生的 CO₂ 一樣多","甲是粉末，甲產生的 CO₂ 比較多","乙是粉末，乙反應比較快"],a:0,e:"粉末的接觸面積大，反應比較快，一開始的線比較陡，所以甲是粉末。兩份大理石質量相同、鹽酸足量，最後產生的 CO₂ 總量一樣多（兩條線最後高度相同）。接觸面積只影響「快慢」，不影響「總量」。",id:"fig28",t:"mine",set:"fig"},{u:11,fig:'<svg viewBox="0 0 300 186" role="img" aria-label="題目附圖"><path class="ink" d="M40 20 H120 M80 20 V32"/><rect x="70" y="32" width="20" height="40" rx="3" class="bg"/><path class="ink" d="M80 72 V88"/><rect x="66" y="88" width="28" height="24" class="box"/><text x="80" y="130" text-anchor="middle">空氣中：5 N</text><path class="ink" d="M180 20 H260 M220 20 V32"/><rect x="210" y="32" width="20" height="40" rx="3" class="bg"/><path class="ink" d="M220 72 V108"/><rect x="180" y="96" width="80" height="62" class="water"/><path class="ink" d="M180 80 V158 H260 V80"/><rect x="206" y="108" width="28" height="24" class="box"/><text x="220" y="176" text-anchor="middle">水中：3 N</text></svg>',cap:"彈簧秤與浮力",q:"用彈簧秤吊一塊金屬，在空氣中讀數 5 N；把金屬完全浸入水中後，讀數變成 3 N（如圖）。金屬受到的浮力是多少？",o:["2 N","3 N","5 N","8 N"],a:0,e:"在水中彈簧秤讀數變小，是因為水往上托住金屬（浮力）。浮力＝空氣中的讀數−水中的讀數＝5−3＝2 N。3 N 是水中秤到的「視重」，不是浮力；8 N 是把兩個數相加了。",id:"fig29",t:"mine",set:"fig"},{u:12,fig:'<svg viewBox="0 0 300 190" role="img" aria-label="題目附圖"><path class="ax" d="M40 160 H285 M40 160 V15"/><path class="area" d="M40 40 L200 160 L40 160 Z"/><path class="ln" d="M40 40 L200 160"/><text x="32" y="44" text-anchor="end">20</text><text x="200" y="175" text-anchor="middle">4</text><text x="294" y="178" text-anchor="end">t (s)</text><text x="8" y="12" text-anchor="start">v (m/s)</text></svg>',cap:"煞車的 v–t 圖",q:"一輛車煞車後的速度–時間圖如上。從煞車到停止，車子前進了多遠？",o:["40 m","80 m","20 m","5 m"],a:0,e:"v–t 圖線下的面積＝位移。這是一個三角形：½×底×高＝½×4×20＝40 m。選 80 m 是忘了乘 ½（把它當成長方形）；選 5 m 是加速度的大小（20÷4＝5 m 內壁有很多絨毛，表面積大，是養分消化和吸收最主要的地方。大腸主要吸收水分；胃只消化部分蛋白質；肝臟製造膽汁。",id:"fig38",t:"mine",set:"fig"},{u:105,fig:'<svg viewBox="0 0 300 200" role="img" aria-label="題目附圖"><path class="ink" style="fill:none" d="M90 40 C90 20 210 20 210 40 V150 H90 Z"/><path class="ink" d="M150 8 V50 M150 50 L125 80 M150 50 L175 80"/><circle cx="120" cy="95" r="18" class="box"/><circle cx="180" cy="95" r="18" class="box"/><path class="mag" d="M90 150 Q150 185 210 150"/><path class="ink" d="M150 172 L150.0 191.8"/><polygon class="hd0" points="150.0,196.0 153.8,189.0 146.2,189.0"/><text x="212" y="100" text-anchor="start">氣球</text><text x="216" y="160" text-anchor="start">橡皮膜（往下拉）</text><text x="160" y="14" text-anchor="start">玻璃管</text></svg>',cap:"呼吸作用的鐘罩模型",q:"上圖是模擬人體呼吸的鐘罩模型。把底部的橡皮膜往下拉時，下列何者正確？",o:["氣球變大，模擬吸氣，橡皮膜代表橫膈","氣球變小，模擬呼氣，橡皮膜代表橫膈","氣球變大，模擬吸氣，橡皮膜代表肋骨","氣球不變，因為瓶內沒有空氣"],a:0,e:"模型對照：玻璃管＝氣管，氣球＝肺，鐘罩＝胸腔，橡皮膜＝橫膈。橡皮膜往下拉（橫膈收縮下降），瓶內空間變大、壓力變小，外面空氣經玻璃管進入氣球，氣球脹大，就是吸氣。",id:"fig39",t:"mine",set:"fig"},{u:106,fig:'<svg viewBox="0 0 300 186" role="img" aria-label="題目附圖"><path class="soft" d="M150 150 C80 150 60 90 90 60 C110 90 130 120 150 150 Z"/><path class="soft" d="M150 150 C220 150 240 90 210 60 C190 90 170 120 150 150 Z"/><ellipse cx="150" cy="140" rx="18" ry="14" class="box"/><path class="ink" d="M150 126 V60"/><ellipse cx="150" cy="56" rx="9" ry="5" class="filled"/><path class="ink" d="M120 140 L112 74 M180 140 L188 74"/><ellipse cx="112" cy="70" rx="7" ry="10" class="bg"/><ellipse cx="188" cy="70" rx="7" ry="10" class="bg"/><path class="ink" d="M150 154 V180"/><text x="100" y="72" text-anchor="end" class=b>甲</text><text x="164" y="52" text-anchor="start" class=b>乙</text><text x="176" y="148" text-anchor="start" class=b>丙</text><text x="58" y="110" text-anchor="end" class=b>丁</text></svg>',cap:"花的剖面",q:"上圖是一朵花的剖面示意圖。受精後，哪一個構造會發育成果實？",o:["丙","甲","乙","丁"],a:0,e:"甲是雄蕊頂端的花藥（產生花粉），乙是雌蕊頂端的柱頭（接受花粉），丙是雌蕊底部膨大的子房，丁是花瓣。受精後子房發育成果實，子房裡的胚珠發育成種子；花瓣通常會凋謝。",id:"fig40",t:"mine",set:"fig"},{u:107,fig:'<svg viewBox="0 0 300 180" role="img" aria-label="題目附圖"><rect x="110" y="50" width="60" height="45" class="bg"/><text x="140" y="78" text-anchor="middle" class=b>AA</text><rect x="170" y="50" width="60" height="45" class="bg"/><text x="200" y="78" text-anchor="middle" class=b>Aa</text><rect x="110" y="95" width="60" height="45" class="bg"/><text x="140" y="123" text-anchor="middle" class=b>Aa</text><rect x="170" y="95" width="60" height="45" class="bg"/><text x="200" y="123" text-anchor="middle" class=b>？</text><text x="140" y="40" text-anchor="middle" class=b>A</text><text x="200" y="40" text-anchor="middle" class=b>a</text><text x="96" y="78" text-anchor="end" class=b>A</text><text x="96" y="123" text-anchor="end" class=b>a</text><text x="150" y="24" text-anchor="middle">父 Aa</text><text x="70" y="100" text-anchor="end">母 Aa</text><text x="150" y="170" text-anchor="middle">高莖 A 對矮莖 a 為顯性</text></svg>',cap:"棋盤方格",q:"高莖（A）對矮莖（a）為顯性。兩株 Aa 的豌豆交配，用棋盤方格整理如上圖。子代中矮莖的機率是多少？",o:["1/4","1/2","3/4","0"],a:0,e:"「？」格是父親的 a 配上母親的 a，基因型 aa，只有 aa 才會表現矮莖。4 格中只有 1 格是 aa，所以矮莖機率是 1/4。其他 3 格（AA、Aa、Aa）都有顯性基因 A，表現高莖，占 3/4。",id:"fig41",t:"mine",set:"fig"},{u:109,fig:'<svg viewBox="0 0 300 196" role="img" aria-label="題目附圖"><rect x="20.0" y="140" width="260" height="28" class="soft"/><text x="150" y="159" text-anchor="middle">生產者 10000</text><rect x="50.0" y="108" width="200" height="28" class="box"/><text x="150" y="127" text-anchor="middle">初級消費者 1000</text><rect x="75.0" y="76" width="150" height="28" class="bg"/><text x="150" y="95" text-anchor="middle">次級消費者 100</text><rect x="95.0" y="44" width="110" height="28" class="mag"/><text x="150" y="63" text-anchor="middle">三級消費者 ？</text><text x="150" y="188" text-anchor="middle">單位：能量單位</text></svg>',cap:"能量塔",q:"上圖是某生態系的能量塔，數字代表各階層能獲得的能量。三級消費者大約能獲得多少能量？",o:["10","100","50","1"],a:0,e:"能量沿著食物鏈往上傳，每一層大約只有 10% 能傳到下一層，其他的在呼吸作用中變成熱散失。從圖中看：10000 → 1000 → 100，每層都是 1/10，所以下一層約 100×10%＝10。這也是食物鏈通常不會太長的原因。",id:"fig42",t:"mine",set:"fig"},{u:201,fig:'<svg viewBox="0 0 300 196" role="img" aria-label="題目附圖"><path d="M30 40 C110 40 120 150 190 150 C250 150 260 90 290 80" style="fill:none;stroke:var(--base-soft);stroke-width:34"/><path class="ink" d="M30 23 C120 23 128 133 190 133 C238 133 246 75 290 63"/><path class="ink" d="M30 57 C100 57 112 167 190 167 C262 167 272 105 290 97"/><path class="ln" d="M46 40 L75.2 41.7"/><polygon class="hd1" points="80.0,42.0 72.3,37.1 71.8,45.9"/><text x="190" y="186" text-anchor="middle" class=b>甲</text><text x="190" y="122" text-anchor="middle" class=b>乙</text><text x="20" y="190" text-anchor="start">河水由左往右流</text></svg>',cap:"曲流",q:"上圖是一段彎曲的河道（曲流）。甲岸（轉彎外側）和乙岸（轉彎內側）的作用，何者正確？",o:["甲岸侵蝕、乙岸堆積","甲岸堆積、乙岸侵蝕","兩岸都以侵蝕為主","兩岸都以堆積為主"],a:0,e:"河水轉彎時，外側（凹岸）水流比較快，力量大，以「侵蝕」為主，河岸被掏空變陡；內側（凸岸）水流慢，泥沙容易沉下來，以「堆積」為主，常形成沙洲。",id:"fig43",t:"mine",set:"fig"},{u:202,fig:'<svg viewBox="0 0 300 190" role="img" aria-label="題目附圖"><path class="lay3" d="M30 60 H140 L170 170 H30 Z"/><path class="ink" d="M30 100 H151"/><path class="ink" d="M30 135 H160"/><path class="lay1" d="M140 90 L270 90 V170 H170 Z"/><path class="ink" d="M148 120 H270 M157 152 H270"/><path class="ln2" d="M135 40 L175 180"/><path class="ink" d="M80 30 L44.2 30.0"/><polygon class="hd0" points="40.0,30.0 47.0,33.9 47.0,26.1"/><path class="ink" d="M220 30 L255.8 30.0"/><polygon class="hd0" points="260.0,30.0 253.0,26.1 253.0,33.9"/><text x="150" y="26" text-anchor="middle">受力方向</text><text x="220" y="110" text-anchor="middle">上盤</text></svg>',cap:"斷層剖面",q:"上圖是某地的地層剖面，斷層面右側的岩層（上盤）相對往下移動，岩層受力方向如箭頭。這是哪一種斷層？",o:["正斷層，受張力形成","逆斷層，受擠壓形成","正斷層，受擠壓形成","平移斷層，受水平錯動形成"],a:0,e:"箭頭往兩邊拉開，是張力。斷層面上方那一塊（上盤）沿斷層面往下滑，形成正斷層。如果受擠壓、上盤往上衝，才是逆斷層；平移斷層是兩邊水平錯開，上下不會移動。",id:"fig44",t:"mine",set:"fig"},{u:203,fig:'<svg viewBox="0 0 300 190" role="img" aria-label="題目附圖"><path class="ln" d="M20 95 L70 95 L70 95.8 L72 90.2 L74 87.6 L76 87.1 L78 101.1 L80 97.6 L82 93.3 L84 100.5 L86 102.7 L88 102.7 L90 89.5 L92 93.3 L94 97.5 L96 88.9 L98 87.1 L100 87.6 L102 99.9 L104 95.9 L106 91.7 L108 101.6 L110 103.0 L112 102.1 L114 90.9 L116 95.0 L118 99.1 L120 87.9 L122 87.0 L124 88.4 L126 98.4 L128 94.2 L130 90.2 L132 102.4 L134 102.9 L136 101.1 L138 92.4 L140 96.7 L142 100.5 L144 87.3 L146 87.3 L148 89.5 L150 100.3 L152 102.6 L154 113.2 L156 118.7 L158 72.7 L160 80.4 L162 92.3 L164 85.0 L166 75.2 L168 71.0 L170 116.3 L172 107.5 L174 95.1 L176 107.3 L178 116.1 L180 119.0 L182 75.1 L184 84.8 L186 97.5 L188 80.6 L190 72.8 L192 71.3 L194 113.4 L196 102.8 L198 90.0 L200 111.4 L202 118.1 L204 118.2 L206 78.4 L208 89.7 L210 102.5 L212 76.8 L214 71.3 L216 72.6 L218 109.7 L220 97.8 L222 85.1 L224 114.8 L226 119.0 L228 116.3 L230 82.5 L232 94.8 L234 107.2 L236 73.9 L238 71.0 L240 75.0 L242 105.2 L244 92.6 L246 80.6 L248 117.2 L250 118.7 L252 113.4 L254 87.2 L256 100.0 L258 111.4 L260 71.9 L262 71.8 L264 78.4 L266 100.4 L268 87.5 L285 95"/><path class="gr" d="M70 40 V150 M150 40 V150"/><text x="70" y="34" text-anchor="middle">P 波抵達</text><text x="150" y="34" text-anchor="middle">S 波抵達</text><text x="70" y="166" text-anchor="middle">10 秒</text><text x="150" y="166" text-anchor="middle">18 秒</text><text x="150" y="184" text-anchor="middle">某測站的地震紀錄</text></svg>',cap:"地震儀紀錄",q:"某測站的地震儀紀錄如上圖。關於 P 波和 S 波，下列何者正確？",o:["P 波較快先到，P、S 波到達時間差 8 秒；離震央越遠時間差越大","S 波較快先到，時間差 8 秒","P 波較快先到，離震央越遠時間差越小","兩種波速度相同，同時到達"],a:0,e:"P 波速度比 S 波快，所以先被記錄到（10 秒），S 波後到（18 秒），時間差 18−10＝8 秒。兩種波一起出發、速度不同，距離越遠，差距拉得越大，所以時間差可以用來估計測站到震央的距離。S 波振幅較大、破壞力較強。",id:"fig45",t:"mine",set:"fig"},{u:204,fig:'<svg viewBox="0 0 300 180" role="img" aria-label="題目附圖"><ellipse cx="80" cy="95" rx="20" ry="16" class="ink" style="fill:none"/><ellipse cx="80" cy="95" rx="40" ry="32" class="ink" style="fill:none"/><ellipse cx="80" cy="95" rx="60" ry="48" class="ink" style="fill:none"/><ellipse cx="225" cy="95" rx="14" ry="12" class="ink" style="fill:none"/><ellipse cx="225" cy="95" rx="28" ry="24" class="ink" style="fill:none"/><ellipse cx="225" cy="95" rx="42" ry="36" class="ink" style="fill:none"/><ellipse cx="225" cy="95" rx="56" ry="48" class="ink" style="fill:none"/><ellipse cx="225" cy="95" rx="70" ry="60" class="ink" style="fill:none"/><text x="80" y="100" text-anchor="middle" class=b>高</text><text x="225" y="100" text-anchor="middle" class=b>低</text><circle cx="28" cy="95" r="4" class="dot"/><circle cx="168" cy="95" r="4" class="dot"/><text x="28" y="86" text-anchor="middle" class=b>甲</text><text x="168" y="86" text-anchor="middle" class=b>乙</text></svg>',cap:"等壓線圖",q:"上圖是某天的地面天氣圖（線條是等壓線）。甲、乙兩地中，哪一地的風比較強？",o:["乙，因為等壓線比較密集","甲，因為等壓線比較密集","乙，因為靠近高氣壓","兩地風力相同"],a:0,e:"等壓線越密集，表示短距離內氣壓相差越大，空氣流得越快，風就越強。乙在低氣壓旁邊，等壓線很密，風比較強；甲附近等壓線比較稀疏。另外高氣壓中心附近空氣下沉，通常天氣晴朗、風比較弱。",id:"fig46",t:"mine",set:"fig"},{u:205,fig:'<svg viewBox="0 0 300 198" role="img" aria-label="題目附圖"><ellipse cx="150" cy="95" rx="90" ry="65" class="gr" style="fill:none"/><circle cx="150" cy="95" r="18" class="sun"/><text x="150" y="99" text-anchor="middle" class=b>太陽</text><circle cx="60" cy="95" r="13" class="earth"/><path class="ink" d="M54 111 L66 79"/><text x="38" y="99" text-anchor="middle" class=b>甲</text><circle cx="150" cy="30" r="13" class="earth"/><path class="ink" d="M144 46 L156 14"/><text x="174" y="34" text-anchor="middle" class=b>乙</text><circle cx="240" cy="95" r="13" class="earth"/><path class="ink" d="M234 111 L246 79"/><text x="262" y="99" text-anchor="middle" class=b>丙</text><circle cx="150" cy="160" r="13" class="earth"/><path class="ink" d="M144 176 L156 144"/><text x="174" y="164" text-anchor="middle" class=b>丁</text><text x="150" y="192" text-anchor="middle">地軸上端是北極</text></svg>',cap:"地球公轉",q:"上圖是地球繞太陽公轉的四個位置（地軸傾斜方向固定，上端是北極）。地球在哪一個位置時，北半球是夏季？",o:["甲","乙","丙","丁"],a:0,e:"北半球的夏季，是北極那一端「傾向太陽」的時候，陽光比較直射北半球、白天也比較長。圖中地軸上端一直朝右上傾斜：地球在甲（太陽左邊）時，北極正好朝向太陽，所以是北半球夏季；在丙（太陽右邊）時，北極背向太陽，是北半球冬季；乙、丁是春分或秋分。",id:"fig47",t:"mine",set:"fig"},{u:205,fig:'<svg viewBox="0 0 300 192" role="img" aria-label="題目附圖"><path class="ink" d="M40 54 H280"/><path class="ink" d="M80 54 V20"/><path class="ln" d="M80 54 H108"/><text x="30" y="50" text-anchor="end" class=b>甲</text><path class="ink" d="M40 110 H280"/><path class="ink" d="M80 110 V76"/><path class="ln" d="M80 110 H140"/><text x="30" y="106" text-anchor="end" class=b>乙</text><path class="ink" d="M40 166 H280"/><path class="ink" d="M80 166 V132"/><path class="ln" d="M80 166 H210"/><text x="30" y="162" text-anchor="end" class=b>丙</text><text x="86" y="20" text-anchor="start">竿子（三根一樣高）</text><text x="290" y="186" text-anchor="end">影子</text></svg>',cap:"正午竿影",q:"在臺灣的某地，於夏至、春分、冬至三天的正午分別量竿子的影子長度，結果如上圖甲、乙、丙。夏至那天的影子是哪一條？",o:["甲","乙","丙","三天一樣長"],a:0,e:"夏至時太陽直射北回歸線，臺灣正午太陽仰角最大（最高），影子最短，所以是甲。冬至太陽直射南回歸線，太陽最低，影子最長是丙；春分介於中間是乙。太陽越高，影子越短。",id:"fig48",t:"mine",set:"fig"},{u:206,fig:'<svg viewBox="0 0 300 196" role="img" aria-label="題目附圖"><path class="ax" d="M40 160 H285 M40 160 V15"/><path class="ln" d="M40 150 L44 142.1 L48 136.1 L52 133.3 L56 134.3 L60 138.5 L64 144.6 L68 150.7 L72 154.9 L76 155.9 L80 153.1 L84 147.1 L88 139.2 L92 131.3 L96 125.3 L100 122.5 L104 123.5 L108 127.7 L112 133.8 L116 139.9 L120 144.1 L124 145.1 L128 142.3 L132 136.3 L136 128.4 L140 120.5 L144 114.5 L148 111.7 L152 112.7 L156 116.9 L160 123.0 L164 129.1 L168 133.3 L172 134.3 L176 131.5 L180 125.5 L184 117.6 L188 109.7 L192 103.7 L196 100.9 L200 101.9 L204 106.1 L208 112.2 L212 118.3 L216 122.5 L220 123.5 L224 120.7 L228 114.7 L232 106.8 L236 98.9 L240 92.9 L244 90.1 L248 91.1 L252 95.3 L256 101.4 L260 107.5 L264 111.7 L268 112.7 L272 109.9 L276 103.9 L280 96.0"/><path class="gr" d="M40 150 L280 96"/><text x="294" y="192" text-anchor="end">年份</text><text x="8" y="12" text-anchor="start">大氣 CO₂ 濃度</text><text x="60" y="176" text-anchor="middle">2000</text><text x="260" y="176" text-anchor="middle">2020</text></svg>',cap:"大氣 CO₂ 濃度變化",q:"上圖是夏威夷測站測得的大氣二氧化碳濃度變化。下列解釋何者最合理？",o:["每年有季節性起伏，但整體逐年上升，主要和燃燒化石燃料有關","每年都在下降，表示溫室效應減弱","起伏是因為每年火山爆發一次","整體持平，人類活動沒有影響"],a:0,e:"圖線有兩個特徵：(1) 一年之中有升有降的小起伏，因為北半球春夏植物光合作用旺盛，吸收較多 CO₂；(2) 整條線一直往上，表示 CO₂ 逐年增加，主要是人類大量燃燒煤、石油等化石燃料造成，會增強溫室效應。",id:"fig49",t:"mine",set:"fig"},{id:"g1-1",t:"mine",set:"grp",g:"g1",gi:0,u:4,q:"每個加熱器每分鐘放出多少熱量？",o:["2000 cal","1000 cal","4000 cal","200 cal"],a:0,e:"看甲：200 g 的水 4 分鐘從 20℃ 升到 60℃，每分鐘升 10℃。每分鐘吸熱＝質量×比熱×升溫＝200×1×10＝2000 cal，這就是加熱器每分鐘放出的熱。",gt:"比熱實驗",gp:"小明用三個完全相同的加熱器，分別加熱甲（200 g 的水）、乙（200 g 的某液體）、丙（400 g 的水），三杯一開始都是 20℃，每分鐘記錄一次溫度，畫成下圖。假設加熱器放出的熱全部被液體吸收，水的比熱是 1 cal/g·℃。",gf:'<svg viewBox="0 0 300 194" role="img" aria-label="題目附圖"><path class="ax" d="M40 18 V160 H285"/><path class="ln" d="M40 160 L272 104.0"/><path class="ln2" d="M40 160 L272 48.0"/><path class="ln3" d="M40 160 L272 132.0"/><text x="278" y="108.0" text-anchor="start">甲</text><text x="258" y="48.0" text-anchor="end">乙</text><text x="278" y="136.0" text-anchor="start">丙</text><path class="gr" d="M40 48.0 H272 M40 104.0 H272 M40 132.0 H272 M272 160 V48.0"/><text x="32" y="52.0" text-anchor="end">100</text><text x="32" y="108.0" text-anchor="end">60</text><text x="32" y="136.0" text-anchor="end">40</text><text x="32" y="164" text-anchor="end">20</text><text x="98" y="175" text-anchor="middle">1</text><text x="156" y="175" text-anchor="middle">2</text><text x="214" y="175" text-anchor="middle">3</text><text x="272" y="175" text-anchor="middle">4</text><text x="294" y="190" text-anchor="end">加熱時間 (分)</text><text x="8" y="12" text-anchor="start">溫度 (℃)</text></svg>',gc:"三杯液體的溫度–時間圖"},{id:"g1-2",t:"mine",set:"grp",g:"g1",gi:1,u:4,q:"乙液體的比熱是多少 cal/g·℃？",o:["0.5","2","1","0.25"],a:0,e:"乙和甲質量相同、吸熱也相同（同樣的加熱器、同樣的時間），但乙每分鐘升 20℃，是甲的 2 倍。H＝m×s×ΔT，吸熱和質量一樣時，比熱和升溫成反比，所以乙的比熱＝1÷2＝0.5。也可以直接算：2000＝200×s×20，s＝0.5。"},{id:"g1-3",t:"mine",set:"grp",g:"g1",gi:2,u:4,q:"比較甲、丙兩杯水加熱 4 分鐘的情形，下列何者正確？",o:["兩杯吸收的熱量相同，丙的質量較大所以升溫較少","丙吸收的熱量是甲的一半","丙吸收的熱量是甲的 2 倍","丙的比熱比甲小，所以升溫較少"],a:0,e:"加熱器相同、時間相同，兩杯吸收的熱量就一樣多。甲、丙都是水，比熱相同；丙的質量是甲的 2 倍，所以升溫只有甲的一半（甲升 40℃，丙升 20℃）。"},{id:"g2-1",t:"mine",set:"grp",g:"g2",gi:0,u:15,q:"甲電阻的大小是多少？",o:["20 Ω","10 Ω","1.8 Ω","0.05 Ω"],a:0,e:"電阻 R＝V÷I。甲在 6 V 時電流 0.3 A，R＝6÷0.3＝20 Ω。乙是 6÷0.6＝10 Ω。V–I 圖中線越陡（同電流下電壓越大），電阻越大。0.05 是把 I÷V 算反了。",gt:"電阻的電壓–電流圖",gp:"小美分別測量甲、乙兩個電阻兩端的電壓和通過的電流，畫成下圖。兩個電阻都遵守歐姆定律。",gf:'<svg viewBox="0 0 300 194" role="img" aria-label="題目附圖"><path class="ax" d="M40 18 V160 H285"/><path class="ln" d="M40 160 L148.0 40"/><path class="ln2" d="M40 160 L256.0 40"/><path class="gr" d="M40 40 H256.0 M148.0 160 V40 M256.0 160 V40"/><text x="142.0" y="34" text-anchor="middle" class=b>甲</text><text x="264.0" y="44" text-anchor="start" class=b>乙</text><text x="32" y="44" text-anchor="end">6</text><text x="148.0" y="175" text-anchor="middle">0.3</text><text x="256.0" y="175" text-anchor="middle">0.6</text><text x="294" y="190" text-anchor="end">電流 I (A)</text><text x="8" y="12" text-anchor="start">電壓 V (V)</text></svg>',gc:"甲、乙兩電阻的 V–I 圖"},{id:"g2-2",t:"mine",set:"grp",g:"g2",gi:1,u:15,q:"把甲、乙串聯後接在 6 V 的電池上，通過甲的電流是多少？",o:["0.2 A","0.3 A","0.6 A","0.9 A"],a:0,e:"串聯總電阻＝20＋10＝30 Ω，電流 I＝6÷30＝0.2 A。串聯電路每一處電流都一樣，所以通過甲的也是 0.2 A。0.3 A 是甲單獨接 6 V 的電流，串聯後電阻變大，電流會變小。"},{id:"g2-3",t:"mine",set:"grp",g:"g2",gi:2,u:15,q:"把甲、乙並聯後接在 6 V 的電池上，電池流出的總電流是多少？",o:["0.9 A","0.2 A","0.45 A","0.3 A"],a:0,e:"並聯時每個電阻兩端都是 6 V：甲 6÷20＝0.3 A，乙 6÷10＝0.6 A。幹路電流是兩條支路相加：0.3＋0.6＝0.9 A。"},{id:"g3-1",t:"mine",set:"grp",g:"g3",gi:0,u:12,q:"0～4 秒內，小車的加速度大小是多少？",o:["2 m/s²","8 m/s²","4 m/s²","0.5 m/s²"],a:0,e:"加速度＝速度變化÷時間＝(8−0)÷4＝2 m/s²，也就是 v–t 圖這一段的斜率。0.5 是把時間÷速度算反了。",gt:"小車的速度–時間圖",gp:"質量 2 kg 的小車在水平直線軌道上向東運動，速度和時間的關係如下圖。",gf:'<svg viewBox="0 0 300 194" role="img" aria-label="題目附圖"><path class="ax" d="M40 18 V160 H285"/><path class="area" d="M40 160 L120 48 H240 L280 160 Z"/><path class="ln" d="M40 160 L120 48 H240 L280 160"/><path class="gr" d="M40 48 H120 M120 160 V48 M240 160 V48"/><text x="32" y="52" text-anchor="end">8</text><text x="120" y="175" text-anchor="middle">4</text><text x="240" y="175" text-anchor="middle">10</text><text x="280" y="175" text-anchor="middle">12</text><text x="294" y="190" text-anchor="end">時間 t (s)</text><text x="8" y="12" text-anchor="start">速度 v (m/s)</text></svg>',gc:"小車的 v–t 圖"},{id:"g3-2",t:"mine",set:"grp",g:"g3",gi:1,u:12,q:"0～12 秒內，小車一共前進了多少公尺？",o:["72 m","96 m","64 m","48 m"],a:0,e:"v–t 圖線下的面積＝位移，可以拆成三塊：0～4 秒三角形 ½×4×8＝16 m；4～10 秒長方形 6×8＝48 m；10～12 秒三角形 ½×2×8＝8 m。合計 16＋48＋8＝72 m。整個梯形也可以用（上底＋下底）×高÷2＝(6＋12)×8÷2＝72 m。"},{id:"g3-3",t:"mine",set:"grp",g:"g3",gi:2,u:13,q:"4～10 秒內，小車所受的合力是多少？",o:["0 N","16 N","8 N","2 N"],a:0,e:"4～10 秒速度一直是 8 m/s，是等速度運動，加速度為 0。由 F＝ma，合力＝2×0＝0 N。有在動不代表一定有合力，牛頓第一定律：合力為 0 時，原本運動的物體會保持等速直線運動。"},{id:"g4-1",t:"mine",set:"grp",g:"g4",gi:0,u:9,q:"若要探討「接觸面積」對反應速率的影響，應該比較哪兩組？",o:["甲和乙","甲和丙","乙和丙","丙和丁"],a:0,e:"控制變因的原則：只能讓要探討的因素不同，其他條件都要一樣。甲、乙只有大理石的形狀（塊狀或粉末，也就是接觸面積）不同，鹽酸濃度和溫度都相同，所以比較甲和乙。乙和丙同時有兩個條件不同，無法判斷是哪個造成的。",gt:"大理石與鹽酸的反應速率",gp:"為了探討影響反應速率的因素，小安取四份質量相同的大理石，分別加入 50 mL 鹽酸，條件如下表，並測量產生二氧化碳的快慢。四組的鹽酸都是足量的。",gf:'<svg viewBox="0 0 300 180" role="img" aria-label="題目附圖"><rect x="20" y="20" width="260" height="150" rx="0" class="bg"/><path class="ink" d="M20 50 H280 M20 80 H280 M20 110 H280 M20 140 H280 M70 20 V170 M140 20 V170 M210 20 V170"/><text x="45" y="40" text-anchor="middle" class=b>組別</text><text x="105" y="40" text-anchor="middle" class=b>大理石</text><text x="175" y="40" text-anchor="middle" class=b>鹽酸濃度</text><text x="245" y="40" text-anchor="middle" class=b>溫度</text><text x="45" y="70" text-anchor="middle" class=b>甲</text><text x="105" y="70" text-anchor="middle">塊狀</text><text x="175" y="70" text-anchor="middle">1 M</text><text x="245" y="70" text-anchor="middle">25℃</text><text x="45" y="100" text-anchor="middle" class=b>乙</text><text x="105" y="100" text-anchor="middle">粉末</text><text x="175" y="100" text-anchor="middle">1 M</text><text x="245" y="100" text-anchor="middle">25℃</text><text x="45" y="130" text-anchor="middle" class=b>丙</text><text x="105" y="130" text-anchor="middle">塊狀</text><text x="175" y="130" text-anchor="middle">2 M</text><text x="245" y="130" text-anchor="middle">25℃</text><text x="45" y="160" text-anchor="middle" class=b>丁</text><text x="105" y="160" text-anchor="middle">塊狀</text><text x="175" y="160" text-anchor="middle">1 M</text><text x="245" y="160" text-anchor="middle">40℃</text></svg>',gc:"四組實驗的條件"},{id:"g4-2",t:"mine",set:"grp",g:"g4",gi:1,u:9,q:"丁組的反應比甲組快，最主要的原因是什麼？",o:["溫度較高，粒子運動較快，有效碰撞次數增加","鹽酸濃度較大，粒子數目較多","大理石的接觸面積較大","丁組加入了催化劑"],a:0,e:"甲、丁只有溫度不同（25℃ 與 40℃）。溫度升高，粒子運動得更快，碰撞更頻繁、更有力，有效碰撞的次數增加，所以反應變快。濃度和接觸面積在這兩組都一樣。"},{id:"g4-3",t:"mine",set:"grp",g:"g4",gi:2,u:9,q:"反應全部結束後，比較四組產生二氧化碳的總量，下列何者正確？",o:["四組一樣多","乙組最多","丙組最多","丁組最多"],a:0,e:"大理石質量都一樣，鹽酸又是足量的，大理石最後都會反應完，產生的 CO₂ 總量由大理石的量決定，所以四組一樣多。濃度、溫度、接觸面積只會改變「多快」產生，不會改變「總共」產生多少。"},{id:"g5-1",t:"mine",set:"grp",g:"g5",gi:0,u:3,q:"蠟燭放在距離透鏡 30 cm 處時，紙屏上會看到什麼樣的像？",o:["倒立、縮小的實像","倒立、放大的實像","正立、放大的虛像","正立、縮小的虛像"],a:0,e:"物距 30 cm 大於兩倍焦距（20 cm），成像在透鏡另一側的 F 和 2F 之間，是倒立、縮小的實像，照相機就是這個原理。實像可以用紙屏接到。",gt:"凸透鏡成像實驗",gp:"阿哲用焦距 10 cm 的凸透鏡做成像實驗：把蠟燭（物體）放在透鏡左方不同的位置，再移動右方的紙屏找清楚的像。下圖中 F 是焦點、2F 是兩倍焦距的位置。",gf:'<svg viewBox="0 0 300 202" role="img" aria-label="題目附圖"><path class="ax" d="M20 110 H285"/><path class="ln3" d="M150 40 Q164 110 150 180 Q136 110 150 40 Z" style="fill:var(--base-soft)"/><circle cx="110" cy="110" r="3" class="dot"/><text x="110" y="128" text-anchor="middle">F</text><circle cx="190" cy="110" r="3" class="dot"/><text x="190" y="128" text-anchor="middle">F</text><circle cx="70" cy="110" r="3" class="dot"/><text x="70" y="128" text-anchor="middle">2F</text><circle cx="230" cy="110" r="3" class="dot"/><text x="230" y="128" text-anchor="middle">2F</text><path class="ln2" d="M30 110 L30.0 84.2"/><polygon class="hd2" points="30.0,80.0 26.1,87.0 33.9,87.0"/><text x="30" y="74" text-anchor="middle">物體</text><text x="150" y="32" text-anchor="middle">凸透鏡</text><path class="gr" d="M30 145 H150"/><text x="90" y="160" text-anchor="middle">物距</text><text x="150" y="196" text-anchor="middle">焦距 f＝10 cm</text></svg>',gc:"凸透鏡成像實驗裝置"},{id:"g5-2",t:"mine",set:"grp",g:"g5",gi:1,u:3,q:"蠟燭放在距離透鏡 20 cm 處時，紙屏要放在透鏡右方多遠才能看到清楚的像？",o:["20 cm，像和蠟燭一樣大","10 cm，像比蠟燭小","40 cm，像比蠟燭大","不論放多遠都接不到像"],a:0,e:"物體剛好在 2F（20 cm），像也會在另一側的 2F，像距 20 cm，成倒立、和物體等大的實像。這是放大和縮小的分界點。"},{id:"g5-3",t:"mine",set:"grp",g:"g5",gi:2,u:3,q:"把蠟燭移到距離透鏡 5 cm 處，下列何者正確？",o:["紙屏接不到像，從透鏡右方看過去會看到正立放大的虛像","紙屏上會出現倒立放大的實像","紙屏上會出現正立縮小的實像","看不到任何像"],a:0,e:"物距 5 cm 小於焦距 10 cm，光線經過透鏡後是散開的，不會會聚成實像，所以紙屏接不到。眼睛從另一側看過去，會看到正立、放大的虛像，放大鏡就是這樣用的。"},{id:"g6-1",t:"mine",set:"grp",g:"g6",gi:0,u:11,q:"金屬在水中受到的浮力是多少？",o:["100 gw","170 gw","270 gw","440 gw"],a:0,e:"浮力＝空氣中的重量−水中的讀數（視重）＝270−170＝100 gw。也可以用阿基米德原理驗證：金屬排開 150−50＝100 mL 的水，重 100 gw，浮力就等於排開液體的重量。",gt:"用彈簧秤和量筒測浮力",gp:"小琪把一塊金屬用彈簧秤吊著，在空氣中讀數為 270 gw；再把金屬完全浸入裝水的量筒中（沒有碰到筒底），彈簧秤讀數變成 170 gw，量筒水面從 50 mL 上升到 150 mL（如圖）。水的密度是 1 g/cm³。",gf:'<svg viewBox="0 0 300 194" role="img" aria-label="題目附圖"><path class="ink" d="M30 14 H110 M70 14 V24"/><rect x="60" y="24" width="20" height="40" rx="3" class="bg"/><path class="ink" d="M70 64 V82"/><rect x="56" y="82" width="28" height="24" rx="0" class="box"/><text x="70" y="124" text-anchor="middle">空氣中 270 gw</text><path class="ink" d="M190 14 H270 M230 14 V24"/><rect x="220" y="24" width="20" height="40" rx="3" class="bg"/><path class="ink" d="M230 64 V112"/><rect x="196" y="84" width="68" height="86" rx="0" class="water"/><path class="ink" d="M196 50 V170 H264 V50"/><rect x="216" y="112" width="28" height="24" rx="0" class="box"/><text x="230" y="186" text-anchor="middle">水中 170 gw</text><path class="ax" d="M264 84 h-8"/><text x="270" y="88" text-anchor="start">150</text><path class="ax" d="M264 140 h-8"/><text x="270" y="144" text-anchor="start">50</text></svg>',gc:"金屬在空氣中和水中的彈簧秤讀數"},{id:"g6-2",t:"mine",set:"grp",g:"g6",gi:1,u:11,q:"這塊金屬的密度是多少？",o:["2.7 g/cm³","1.7 g/cm³","1.0 g/cm³","0.37 g/cm³"],a:0,e:"金屬體積＝水面上升的量＝100 cm³；質量 270 g（在空氣中重 270 gw）。密度＝270÷100＝2.7 g/cm³。1.7 是把水中的讀數 170 當成質量。"},{id:"g6-3",t:"mine",set:"grp",g:"g6",gi:2,u:11,q:"如果改把這塊金屬完全浸入密度 0.8 g/cm³ 的酒精中，彈簧秤的讀數是多少？",o:["190 gw","170 gw","80 gw","250 gw"],a:0,e:"浸在酒精裡排開的體積一樣是 100 cm³，排開酒精重 100×0.8＝80 gw，浮力 80 gw。彈簧秤讀數＝270−80＝190 gw。液體密度越小，浮力越小，讀數就越大。"},{id:"g7-1",t:"mine",set:"grp",g:"g7",gi:0,u:102,q:"水蘊草冒出的氣泡，主要成分是什麼氣體？",o:["氧氣","二氧化碳","氮氣","水蒸氣"],a:0,e:"光合作用以二氧化碳和水為原料，在葉綠體中利用光能製造葡萄糖，同時放出氧氣。水蘊草照光後冒出的氣泡主要是光合作用產生的氧氣。",gt:"水蘊草的光合作用",gp:"小晴把水蘊草放進裝水的試管中，用檯燈從不同距離照射，計算每分鐘從水蘊草冒出的氣泡數，結果如右圖。實驗時水溫保持相同。",gf:'<svg viewBox="0 0 300 196" role="img" aria-label="題目附圖"><rect x="40" y="60" width="46" height="110" rx="8" class="water"/><path class="ink" d="M40 50 V160 Q40 170 50 170 H76 Q86 170 86 160 V50"/><path class="ln3" d="M60 160 C58 130 66 110 62 80 M62 120 l-10 -8 M62 110 l10 -8 M62 98 l-9 -7 M62 88 l9 -7"/><circle cx="70" cy="75" r="2.5" class="bg"/><circle cx="70" cy="68" r="2.5" class="bg"/><circle cx="70" cy="60" r="2.5" class="bg"/><path class="sun" d="M112 70 h22 l8 18 h-38 Z"/><path class="ink" d="M123 88 V160 M110 160 H136"/><path class="gr" d="M104 90 l-12 4"/><path class="gr" d="M104 100 l-12 0"/><path class="gr" d="M104 110 l-12 -4"/><path class="ax" d="M168 160 H285"/><rect x="170" y="40" width="18" height="120" rx="0" class="box"/><text x="179" y="174" text-anchor="middle">10</text><text x="179" y="34" text-anchor="middle">40</text><rect x="198" y="94" width="18" height="66" rx="0" class="box"/><text x="207" y="174" text-anchor="middle">20</text><text x="207" y="88" text-anchor="middle">22</text><rect x="226" y="130" width="18" height="30" rx="0" class="box"/><text x="235" y="174" text-anchor="middle">30</text><text x="235" y="124" text-anchor="middle">10</text><rect x="254" y="145" width="18" height="15" rx="0" class="box"/><text x="263" y="174" text-anchor="middle">40</text><text x="263" y="139" text-anchor="middle">5</text><text x="226" y="190" text-anchor="middle">燈與試管的距離 (cm)</text><text x="226" y="24" text-anchor="middle">每分鐘氣泡數</text></svg>',gc:"實驗裝置與結果"},{id:"g7-2",t:"mine",set:"grp",g:"g7",gi:1,u:102,q:"這個實驗中的操縱變因是什麼？",o:["檯燈和試管的距離（光照強弱）","每分鐘的氣泡數","水的溫度","水蘊草的種類"],a:0,e:"操縱變因是實驗者刻意改變的條件：檯燈離試管的距離，也就是光照的強弱。應變變因是因此而改變、被測量的結果：每分鐘氣泡數。水溫要保持相同，是控制變因。"},{id:"g7-3",t:"mine",set:"grp",g:"g7",gi:2,u:102,q:"根據實驗結果，下列推論何者最合理？",o:["在一定範圍內，光照越強，水蘊草的光合作用越旺盛","檯燈越遠，光合作用越旺盛","光照強弱和光合作用無關","水蘊草只有在檯燈 10 cm 內才會進行光合作用"],a:0,e:"距離越近、光越強，氣泡數越多（10 cm 時 40 個，40 cm 時只剩 5 個），表示光合作用速率越快。40 cm 時仍有氣泡，所以不是只有 10 cm 內才進行。"},{id:"g8-1",t:"mine",set:"grp",g:"g8",gi:0,u:105,q:"飯後一小時內，兩人的血糖都上升，主要原因是什麼？",o:["小腸把食物消化後的葡萄糖吸收進入血液","肝臟把葡萄糖轉成肝醣","腎臟把葡萄糖排進尿液","肌肉大量消耗葡萄糖"],a:0,e:"澱粉在消化道被分解成葡萄糖，由小腸絨毛吸收進入血液，所以飯後血糖上升。肝臟把葡萄糖轉成肝醣、肌肉消耗葡萄糖，都會讓血糖「下降」。",gt:"飯後的血糖變化",gp:"醫生測量甲、乙兩人吃完同樣一餐後，血液中葡萄糖濃度（血糖）的變化，畫成下圖。其中一人身體健康，另一人調節血糖的激素分泌不足。",gf:'<svg viewBox="0 0 300 194" role="img" aria-label="題目附圖"><path class="ax" d="M40 14 V170 H285"/><path class="ln3" d="M40.0 146.0 L48.0 139.7 L56.0 133.6 L64.0 127.8 L72.0 122.5 L80.0 117.7 L88.0 113.6 L96.0 110.4 L104.0 108.0 L112.0 106.5 L120.0 106.0 L128.0 109.3 L136.0 112.7 L144.0 116.0 L152.0 119.3 L160.0 122.7 L168.0 126.0 L176.0 129.3 L184.0 132.7 L192.0 136.0 L200.0 139.3 L208.0 142.7 L216.0 146.0 L224.0 146.0 L232.0 146.0 L240.0 146.0 L248.0 146.0 L256.0 146.0 L264.0 146.0 L272.0 146.0 L280.0 146.0"/><path class="ln2" d="M40.0 114.0 L48.0 102.7 L56.0 91.8 L64.0 81.3 L72.0 71.7 L80.0 63.1 L88.0 55.8 L96.0 49.8 L104.0 45.5 L112.0 42.9 L120.0 42.0 L128.0 43.2 L136.0 44.4 L144.0 45.6 L152.0 46.8 L160.0 48.0 L168.0 49.2 L176.0 50.4 L184.0 51.6 L192.0 52.8 L200.0 54.0 L208.0 55.2 L216.0 56.4 L224.0 57.6 L232.0 58.8 L240.0 60.0 L248.0 61.2 L256.0 62.4 L264.0 63.6 L272.0 64.8 L280.0 66.0"/><text x="276" y="138.0" text-anchor="end" class=b>甲</text><text x="276" y="58.0" text-anchor="end" class=b>乙</text><path class="gr" d="M40 146.0 H285"/><text x="32" y="150.0" text-anchor="end">90</text><text x="32" y="46.0" text-anchor="end">220</text><path class="gr" d="M40 42.0 H120"/><text x="40" y="186" text-anchor="middle">0</text><text x="120" y="186" text-anchor="middle">1</text><text x="200" y="186" text-anchor="middle">2</text><text x="280" y="186" text-anchor="middle">3</text><text x="294" y="186" text-anchor="end">飯後時間 (小時)</text><text x="8" y="12" text-anchor="start">血糖 (mg/100 mL)</text></svg>',gc:"甲、乙兩人飯後的血糖變化"},{id:"g8-2",t:"mine",set:"grp",g:"g8",gi:1,u:105,q:"甲在飯後一小時血糖開始下降並回到約 90，主要是哪一種激素的作用？",o:["胰島素","甲狀腺素","腎上腺素","生長激素"],a:0,e:"胰島素由胰臟分泌，會促進細胞吸收葡萄糖，並讓肝臟把葡萄糖轉成肝醣儲存，使血糖下降。甲的血糖能回到正常值，表示胰島素作用正常，是健康的人。"},{id:"g8-3",t:"mine",set:"grp",g:"g8",gi:2,u:105,q:"關於乙的推論，下列何者最合理？",o:["乙的胰島素分泌不足，血糖降不下來，可能有糖尿病","乙的胰島素分泌過多","乙吃的食物比甲少","乙的血糖調節完全正常"],a:0,e:"乙一開始血糖就偏高，飯後升到約 220，三小時後仍降不太下來，表示促使血糖下降的胰島素不足（或作用不良），這就是糖尿病的特徵；血糖太高時尿液中也可能出現葡萄糖。"},{id:"g9-1",t:"mine",set:"grp",g:"g9",gi:0,u:107,q:"第一子代圓粒豌豆的基因型是什麼？",o:["Rr","RR","rr","RR 和 Rr 各一半"],a:0,e:"純種圓粒（RR）只能給 R，純種皺粒（rr）只能給 r，所以第一子代全部是 Rr。因為 R 是顯性，Rr 的外表是圓粒。",gt:"豌豆種子的形狀",gp:"豌豆種子的圓粒與皺粒由一對遺傳因子控制，圓粒（R）對皺粒（r）為顯性。研究者用純種圓粒和皺粒豌豆雜交，得到第一子代，再讓第一子代自花授粉，結果如下圖。",gf:'<svg viewBox="0 0 300 180" role="img" aria-label="題目附圖"><text x="20" y="32" text-anchor="start" class=b>親代</text><circle cx="110" cy="28" r="11" class="chl"/><text x="150" y="33" text-anchor="middle" class=b>×</text><circle cx="190" cy="28" r="11" class="lay1"/><path class="ink" d="M184 25 q3 4 6 0 q3 -4 6 0 M184 32 q3 4 6 0 q3 -4 6 0"/><text x="110" y="52" text-anchor="middle">圓粒</text><text x="190" y="52" text-anchor="middle">皺粒</text><path class="ink" d="M150 58 V74"/><text x="20" y="92" text-anchor="start" class=b>第一子代</text><circle cx="150" cy="88" r="11" class="chl"/><text x="170" y="93" text-anchor="start">全部是圓粒</text><path class="ink" d="M150 102 V118"/><text x="160" y="114" text-anchor="start">自花授粉</text><text x="20" y="140" text-anchor="start" class=b>第二子代</text><circle cx="110" cy="138" r="11" class="chl"/><circle cx="190" cy="138" r="11" class="lay1"/><path class="ink" d="M184 135 q3 4 6 0 q3 -4 6 0 M184 142 q3 4 6 0 q3 -4 6 0"/><text x="110" y="166" text-anchor="middle">圓粒約 300 株</text><text x="190" y="166" text-anchor="middle">皺粒約 100 株</text></svg>',gc:"豌豆種子形狀的遺傳"},{id:"g9-2",t:"mine",set:"grp",g:"g9",gi:1,u:107,q:"第二子代的圓粒豌豆中，基因型是 Rr 的大約占多少？",o:["2/3","1/2","1/4","3/4"],a:0,e:"Rr×Rr 的子代基因型比例是 RR：Rr：rr＝1：2：1。圓粒包含 RR 和 Rr，共 3 份，其中 Rr 占 2 份，所以是 2/3。1/2 是 Rr 占「全部子代」的比例，要看清楚題目問的範圍。"},{id:"g9-3",t:"mine",set:"grp",g:"g9",gi:2,u:107,q:"第二子代中，基因型是 RR 的豌豆大約有多少株？",o:["100 株","300 株","200 株","0 株"],a:0,e:"第二子代共約 400 株，RR：Rr：rr＝1：2：1，RR 占 1/4，約 100 株，和皺粒（rr）的數目差不多。圓粒 300 株中，RR 約 100 株、Rr 約 200 株。"},{id:"g10-1",t:"mine",set:"grp",g:"g10",gi:0,u:109,q:"這個食物網中一共有幾條食物鏈？",o:["3 條","2 條","4 條","7 條"],a:0,e:"從生產者（草）出發，一路走到不再被吃的生物（老鷹）：草→兔→老鷹；草→兔→蛇→老鷹；草→蚱蜢→青蛙→蛇→老鷹。共 3 條。7 是箭頭的數目，不是食物鏈的數目。",gt:"草原的食物網",gp:"下圖是某草原的食物網，箭頭由被吃的生物指向吃牠的生物。",gf:'<svg viewBox="0 0 300 190" role="img" aria-label="題目附圖"><path class="ln" d="M136.98026446069224 161.86266528793266 L98.0 131.3"/><polygon class="hd1" points="94.6,128.7 97.8,136.1 102.5,130.0"/><path class="ln" d="M164.31083505599867 163.7390096630006 L200.2 143.8"/><polygon class="hd1" points="203.9,141.7 195.9,141.7 199.7,148.5"/><path class="ln" d="M224.59756616906154 121.59043200690388 L228.9 103.5"/><polygon class="hd1" points="229.8,99.4 224.5,105.3 232.0,107.1"/><path class="ln" d="M219.24346305891302 82.56700532527333 L171.8 73.4"/><polygon class="hd1" points="167.7,72.6 173.9,77.7 175.3,70.2"/><path class="ln" d="M93.01973553930776 111.86266528793266 L132.0 81.3"/><polygon class="hd1" points="135.4,78.7 127.5,80.0 132.2,86.1"/><path class="ln" d="M78.2710531077053 106.08197751702761 L72.4 47.1"/><polygon class="hd1" points="71.9,42.9 68.8,50.3 76.5,49.5"/><path class="ln" d="M135.8336335545929 63.49232541414111 L89.6 37.1"/><polygon class="hd1" points="85.9,35.0 90.1,41.8 93.9,35.1"/><rect x="133.0" y="158" width="34" height="24" rx="8" class="box"/><text x="150" y="175" text-anchor="middle" class=b>草</text><rect x="63.0" y="108" width="34" height="24" rx="8" class="box"/><text x="80" y="125" text-anchor="middle" class=b>兔</text><rect x="196.0" y="123" width="48" height="24" rx="8" class="box"/><text x="220" y="140" text-anchor="middle" class=b>蚱蜢</text><rect x="211.0" y="73" width="48" height="24" rx="8" class="box"/><text x="235" y="90" text-anchor="middle" class=b>青蛙</text><rect x="133.0" y="58" width="34" height="24" rx="8" class="box"/><text x="150" y="75" text-anchor="middle" class=b>蛇</text><rect x="46.0" y="16" width="48" height="24" rx="8" class="box"/><text x="70" y="33" text-anchor="middle" class=b>老鷹</text></svg>',gc:"某草原的食物網"},{id:"g10-2",t:"mine",set:"grp",g:"g10",gi:1,u:109,q:"老鷹在這個食物網中可以是哪幾級消費者？",o:["二級、三級、四級消費者","只有二級消費者","只有三級消費者","初級、二級消費者"],a:0,e:"看老鷹在每條食物鏈的位置：草→兔→老鷹，老鷹是二級消費者；草→兔→蛇→老鷹，是三級；草→蚱蜢→青蛙→蛇→老鷹，是四級。同一種生物在食物網中可以占不同的階層。"},{id:"g10-3",t:"mine",set:"grp",g:"g10",gi:2,u:109,q:"如果青蛙被大量捕捉，短時間內蚱蜢的數量最可能如何變化？",o:["增加，因為天敵變少了","減少，因為食物變少了","不變，因為蚱蜢不吃青蛙","減少，因為草會變多"],a:0,e:"青蛙是蚱蜢的捕食者。青蛙變少，蚱蜢被吃掉的數量減少，短時間內數量會增加（之後可能因為草不夠吃而再下降）。蛇也可能因為少了青蛙，改吃更多兔子。"},{id:"g11-1",t:"mine",set:"grp",g:"g11",gi:0,u:101,q:"要把右上方的細胞移到視野中央，玻片應該往哪個方向移動？",o:["往右上方","往左下方","往左上方","往右下方"],a:0,e:"顯微鏡的像上下左右顛倒，玻片往哪移，視野中的像就往相反方向跑。想讓右上方的細胞往左下（中央）移，玻片要往右上方推。口訣：像在哪裡，玻片就往哪裡移。",gt:"顯微鏡下的細胞",gp:"小凱用複式顯微鏡觀察某種生物的葉片，在低倍（物鏡 10×）下看到如下圖的視野。他想仔細觀察右上方塗色的那個細胞。（顯微鏡下看到的像上下左右都顛倒。）",gf:'<svg viewBox="0 0 300 190" role="img" aria-label="題目附圖"><clipPath id="mv"><circle cx="150" cy="95" r="86"/></clipPath><g clip-path="url(#mv)"><rect x="52" y="54" width="38" height="34" rx="4" class="soft"/><circle cx="76" cy="70" r="4" class="dot"/><circle cx="62" cy="79" r="2.6" class="chl"/><circle cx="69" cy="63" r="2.6" class="chl"/><circle cx="76" cy="79" r="2.6" class="chl"/><rect x="94" y="46" width="38" height="34" rx="4" class="soft"/><circle cx="118" cy="62" r="4" class="dot"/><circle cx="104" cy="71" r="2.6" class="chl"/><circle cx="111" cy="55" r="2.6" class="chl"/><circle cx="118" cy="71" r="2.6" class="chl"/><rect x="134" y="56" width="38" height="34" rx="4" class="soft"/><circle cx="158" cy="72" r="4" class="dot"/><circle cx="144" cy="81" r="2.6" class="chl"/><circle cx="151" cy="65" r="2.6" class="chl"/><circle cx="158" cy="81" r="2.6" class="chl"/><rect x="66" y="96" width="38" height="34" rx="4" class="soft"/><circle cx="90" cy="112" r="4" class="dot"/><circle cx="76" cy="121" r="2.6" class="chl"/><circle cx="83" cy="105" r="2.6" class="chl"/><circle cx="90" cy="121" r="2.6" class="chl"/><rect x="108" y="90" width="38" height="34" rx="4" class="soft"/><circle cx="132" cy="106" r="4" class="dot"/><circle cx="118" cy="115" r="2.6" class="chl"/><circle cx="125" cy="99" r="2.6" class="chl"/><circle cx="132" cy="115" r="2.6" class="chl"/><rect x="148" y="98" width="38" height="34" rx="4" class="soft"/><circle cx="172" cy="114" r="4" class="dot"/><circle cx="158" cy="123" r="2.6" class="chl"/><circle cx="165" cy="107" r="2.6" class="chl"/><circle cx="172" cy="123" r="2.6" class="chl"/><rect x="80" y="134" width="38" height="34" rx="4" class="soft"/><circle cx="104" cy="150" r="4" class="dot"/><circle cx="90" cy="159" r="2.6" class="chl"/><circle cx="97" cy="143" r="2.6" class="chl"/><circle cx="104" cy="159" r="2.6" class="chl"/><rect x="122" y="130" width="38" height="34" rx="4" class="soft"/><circle cx="146" cy="146" r="4" class="dot"/><circle cx="132" cy="155" r="2.6" class="chl"/><circle cx="139" cy="139" r="2.6" class="chl"/><circle cx="146" cy="155" r="2.6" class="chl"/><rect x="180" y="46" width="36" height="32" rx="4" class="lay1"/><circle cx="204" cy="62" r="4" class="dot"/><circle cx="186" cy="70" r="2.6" class="chl"/><circle cx="193" cy="56" r="2.6" class="chl"/><circle cx="200" cy="70" r="2.6" class="chl"/></g><circle cx="150" cy="95" r="86" class="ink"/><path class="ink" d="M216 50 L240 30"/><text x="244" y="26" text-anchor="start">要觀察</text><text x="244" y="40" text-anchor="start">的細胞</text></svg>',gc:"低倍物鏡下的視野"},{id:"g11-2",t:"mine",set:"grp",g:"g11",gi:1,u:101,q:"把物鏡從 10× 換成 40× 後，視野會有什麼變化？",o:["看到的細胞數目變少，視野變暗","看到的細胞數目變多，視野變亮","看到的細胞數目變少，視野變亮","細胞數目和亮度都不變"],a:0,e:"放大倍率變大，看到的範圍變小，視野中的細胞數目就變少，每個細胞看起來變大；進入眼睛的光也變少，所以視野變暗，需要調大光圈或換凹面鏡。"},{id:"g11-3",t:"mine",set:"grp",g:"g11",gi:2,u:101,q:"圖中的細胞有細胞壁和許多綠色顆粒，這最可能是哪一種細胞？",o:["植物葉片的細胞","人的口腔皮膜細胞","細菌","動物的紅血球"],a:0,e:"外圍有方形的細胞壁、細胞內有綠色的葉綠體，是植物細胞的特徵，例如水蘊草葉片細胞。動物細胞沒有細胞壁和葉綠體；細菌太小，而且沒有細胞核和葉綠體。"},{id:"g12-1",t:"mine",set:"grp",g:"g12",gi:0,u:202,q:"甲、乙、丙、丁四層沉積岩中，哪一層最早形成？",o:["甲","乙","丙","丁"],a:0,e:"疊置定律：地層沒有倒轉時，下面的岩層先沉積，上面的後沉積，所以最下面的甲最老、最上面的丁最年輕。",gt:"地層的先後順序",gp:"下圖是某地的地層剖面。甲、乙、丙為沉積岩層，F 為斷層；丙層被侵蝕後，又沉積了丁層；戊為火成岩脈。假設地層沒有發生倒轉。",gf:'<svg viewBox="0 0 300 200" role="img" aria-label="題目附圖"><path class="ink" d="M14 180 H286"/><polygon class="lay2" points="20,192 150,192 145,164 20,164"/><polygon class="lay2" points="156,180 280,180 280,152 151,152"/><polygon class="lay3" points="20,164 145,164 140,136 20,136"/><polygon class="lay3" points="151,152 280,152 280,124 146,124"/><polygon class="lay1" points="20,136 140,136 136,112 20,112"/><polygon class="lay1" points="146,124 280,124 280,104 142,104"/><path class="soft" d="M20 112 L136 112 L142 104 L280 104 L280 60 L20 60 Z"/><path class="ln2" d="M158 196 L137 108"/><text x="164" y="172" text-anchor="start" class=b>F</text><path class="dike" d="M214 196 L224 196 L231 60 L221 60 Z"/><text x="60" y="186" text-anchor="middle" class=b>甲</text><text x="60" y="156" text-anchor="middle" class=b>乙</text><text x="60" y="128" text-anchor="middle" class=b>丙</text><text x="80" y="90" text-anchor="middle" class=b>丁</text><text x="238" y="76" text-anchor="start" class=b>戊</text></svg>',gc:"某地的地層剖面"},{id:"g12-2",t:"mine",set:"grp",g:"g12",gi:1,u:202,q:"斷層 F 最可能在什麼時候發生？",o:["丙沉積之後，丁沉積之前","甲沉積之前","甲沉積之後，乙沉積之前","丁沉積之後"],a:0,e:"斷層把甲、乙、丙都錯開了，所以斷層發生在丙沉積之後；丁層沒有被錯開，表示丁是斷層發生後才沉積的。被切到的地層比斷層老，沒被切到的比斷層年輕。"},{id:"g12-3",t:"mine",set:"grp",g:"g12",gi:2,u:202,q:"火成岩脈戊和丁層，哪一個比較晚形成？",o:["戊，因為戊切穿了丁","丁，因為丁在最上面","兩者同時形成","無法判斷"],a:0,e:"截切定律：切穿其他岩層的構造比被切穿的岩層年輕。戊從下往上切穿了甲、乙、丙、丁，所以戊是在丁沉積之後才由岩漿侵入形成的，是圖中最年輕的。"},{id:"g13-1",t:"mine",set:"grp",g:"g13",gi:0,u:204,q:"通過臺北的最可能是哪一種鋒面？",o:["冷鋒","暖鋒","滯留鋒","颱風"],a:0,e:"鋒面過後氣溫明顯下降（26℃→16℃）、氣壓上升、風向轉為偏北風，又伴隨短時間的大雨，這些都是冷鋒過境的特徵。冷空氣推擠暖空氣，暖空氣被迫快速上升，形成陣雨或雷雨。",gt:"鋒面過境前後的天氣",gp:"下圖是冬天某鋒面通過臺北前後三天的氣溫和氣壓紀錄。第 2 天臺北下了一陣大雨，風向從偏南風轉為偏北風。",gf:'<svg viewBox="0 0 300 198" role="img" aria-label="題目附圖"><path class="ax" d="M40 20 V160 H260 V20"/><path class="ln2" d="M70 50 L150 90 L230 135"/><path class="ln3" d="M70 140 L150 110 L230 45"/><circle cx="70" cy="50" r="4" class="dot"/><circle cx="150" cy="90" r="4" class="dot"/><circle cx="230" cy="135" r="4" class="dot"/><circle cx="70" cy="140" r="4" class="dot"/><circle cx="150" cy="110" r="4" class="dot"/><circle cx="230" cy="45" r="4" class="dot"/><text x="78" y="44" text-anchor="start">26℃</text><text x="238" y="140" text-anchor="start">16℃</text><text x="78" y="152" text-anchor="start">1008</text><text x="238" y="50" text-anchor="start">1022</text><text x="70" y="176" text-anchor="middle">第 1 天</text><text x="150" y="176" text-anchor="middle">第 2 天</text><text x="230" y="176" text-anchor="middle">第 3 天</text><text x="8" y="14" text-anchor="start">氣溫</text><text x="292" y="14" text-anchor="end">氣壓 (hPa)</text><path d="M98 188 H110" class="ln2"/><text x="114" y="192" text-anchor="start">氣溫</text><path d="M168 188 H180" class="ln3"/><text x="184" y="192" text-anchor="start">氣壓</text></svg>',gc:"鋒面過境前後的氣溫與氣壓"},{id:"g13-2",t:"mine",set:"grp",g:"g13",gi:1,u:204,q:"第 3 天氣壓上升、氣溫降低，主要是受到什麼影響？",o:["大陸冷氣團（高氣壓）南下","太平洋暖氣團增強","颱風接近","梅雨鋒面停留"],a:0,e:"冬天的冷鋒後方是從蒙古、西伯利亞南下的大陸冷氣團，屬於冷而乾的高氣壓，所以鋒面過後氣壓升高、氣溫下降，天氣轉為乾冷。"},{id:"g13-3",t:"mine",set:"grp",g:"g13",gi:2,u:204,q:"關於冷鋒附近的雲雨，下列何者最合理？",o:["暖空氣被冷空氣抬升，在鋒面附近形成雲和雨","冷空氣沿鋒面上升形成雲雨","鋒面附近的空氣都在下沉，所以不會下雨","雲雨只會出現在鋒面通過後一週"],a:0,e:"冷空氣比較重，會鑽到暖空氣下方，把暖空氣往上推。暖濕空氣上升後膨脹冷卻，水氣凝結成雲，最後降雨，所以鋒面附近常有雲雨。"},{id:"g14-1",t:"mine",set:"grp",g:"g14",gi:0,u:205,q:"月球在甲位置時，從地球上看到的月相是什麼？",o:["新月（朔），幾乎看不到月亮","滿月（望）","上弦月","下弦月"],a:0,e:"甲位於地球和太陽之間，月球被照亮的那一面朝向太陽，背對地球，所以從地球上幾乎看不到，是新月（農曆初一前後）。",gt:"月球的位置、月相與潮汐",gp:"下圖是從北極上空往下看，地球、月球和太陽光的相對位置（未按比例）。甲、乙、丙、丁是月球繞地球公轉時的四個位置。",gf:'<svg viewBox="0 0 300 190" role="img" aria-label="題目附圖"><ellipse cx="150" cy="95" rx="90" ry="65" class="gr"/><circle cx="150" cy="95" r="20" class="earth"/><text x="150" y="99" text-anchor="middle" class=b>地球</text><clipPath id="mh24095"><rect x="240" y="84" width="11" height="22"/></clipPath><circle cx="240" cy="95" r="10" class="bg"/><circle cx="240" cy="95" r="10" class="sun" clip-path="url(#mh24095)"/><text x="258" y="100" text-anchor="middle" class=b>甲</text><clipPath id="mh15030"><rect x="150" y="19" width="11" height="22"/></clipPath><circle cx="150" cy="30" r="10" class="bg"/><circle cx="150" cy="30" r="10" class="sun" clip-path="url(#mh15030)"/><text x="150" y="14" text-anchor="middle" class=b>乙</text><clipPath id="mh6095"><rect x="60" y="84" width="11" height="22"/></clipPath><circle cx="60" cy="95" r="10" class="bg"/><circle cx="60" cy="95" r="10" class="sun" clip-path="url(#mh6095)"/><text x="42" y="100" text-anchor="middle" class=b>丙</text><clipPath id="mh150160"><rect x="150" y="149" width="11" height="22"/></clipPath><circle cx="150" cy="160" r="10" class="bg"/><circle cx="150" cy="160" r="10" class="sun" clip-path="url(#mh150160)"/><text x="150" y="186" text-anchor="middle" class=b>丁</text><path class="ln" d="M298 40 L276.2 40.0"/><polygon class="hd1" points="272.0,40.0 279.0,43.9 279.0,36.1"/><path class="ln" d="M298 95 L276.2 95.0"/><polygon class="hd1" points="272.0,95.0 279.0,98.8 279.0,91.2"/><path class="ln" d="M298 150 L276.2 150.0"/><polygon class="hd1" points="272.0,150.0 279.0,153.8 279.0,146.2"/><text x="296" y="180" text-anchor="end">太陽光</text></svg>',gc:"地球、月球與太陽光（俯視）"},{id:"g14-2",t:"mine",set:"grp",g:"g14",gi:1,u:205,q:"如果發生月食，月球應該在哪個位置？",o:["丙","甲","乙","丁"],a:0,e:"月食是月球進入地球的影子中。地球的影子在背對太陽的一側，所以月球要在丙（太陽、地球、月球排成一直線，月球在外側），這時是滿月。日食則是月球在甲、擋住太陽。"},{id:"g14-3",t:"mine",set:"grp",g:"g14",gi:2,u:205,q:"一個月中，潮差最大的大潮出現在月球位於哪些位置時？",o:["甲和丙","乙和丁","只有甲","只有丙"],a:0,e:"大潮發生在太陽、地球、月球大致排成一直線時，月球和太陽的引潮力方向一致、互相加強，也就是新月（甲）和滿月（丙）前後。月球在乙、丁（上、下弦月）時，兩者引潮力互相抵消一部分，是小潮。"},{id:"g15-1",t:"mine",set:"grp",g:"g15",gi:0,u:203,q:"A、B、C 三個測站中，哪一個離震央最近？",o:["A，因為 S–P 時間差最短","C，因為 S–P 時間差最長","B，因為在中間","三站一樣近"],a:0,e:"P 波比 S 波快，兩者同時出發，距離越遠，兩種波抵達的時間差越大。A 的時間差只有 3 秒，最短，所以離震央最近；C 的 14 秒最長，最遠。",gt:"一次地震的測站紀錄",gp:"某次地震的規模為 6.2，震央位置和三個測站的紀錄如下圖（S–P 時間差：S 波和 P 波抵達的時間差）。",gf:'<svg viewBox="0 0 300 194" role="img" aria-label="題目附圖"><path class="soft" d="M30 40 C80 10 170 20 230 30 C280 40 290 120 260 170 C200 190 90 185 40 160 C20 120 20 70 30 40 Z"/><circle cx="70" cy="110" r="40" class="gr"/><circle cx="70" cy="110" r="90" class="gr"/><circle cx="70" cy="110" r="140" class="gr"/><polygon points="70,98 74,107 84,108 76,114 79,124 70,118 61,124 64,114 56,108 66,107" class="hd2"/><text x="70" y="140" text-anchor="middle" class=b>震央</text><circle cx="110" cy="92" r="5" class="dot"/><text x="118" y="88" text-anchor="start" class=b>A　S–P 3 秒</text><text x="118" y="104" text-anchor="start">震度 5 弱</text><circle cx="176" cy="52" r="5" class="dot"/><text x="184" y="48" text-anchor="start" class=b>B　S–P 8 秒</text><text x="184" y="64" text-anchor="start">震度 3 級</text><circle cx="204" cy="146" r="5" class="dot"/><text x="212" y="142" text-anchor="start" class=b>C　S–P 14 秒</text><text x="212" y="158" text-anchor="start">震度 1 級</text></svg>',gc:"震央與三個測站"},{id:"g15-2",t:"mine",set:"grp",g:"g15",gi:1,u:203,q:"三個測站測到的震度不同，但這次地震的規模有幾個？",o:["只有一個，規模 6.2","三個，每站各自不同","兩個，近的和遠的","規模要等震度都測完才能決定"],a:0,e:"規模代表地震釋放的總能量，一次地震只有一個規模。震度是各地感受到的搖晃程度，每個地方都不同，所以 A、B、C 的震度不一樣，但規模都是 6.2。"},{id:"g15-3",t:"mine",set:"grp",g:"g15",gi:2,u:203,q:"根據圖中資料，關於震度的推論何者最合理？",o:["一般而言，離震央越遠，震度越小","離震央越遠，震度越大","震度和距離無關","震度越大的地方，規模也越大"],a:0,e:"A 最近、震度 5 弱；C 最遠、震度只有 1 級。地震波傳得越遠能量衰減越多，所以通常離震央越遠震度越小（實際上也會受地質影響）。規模和地點無關。"}];const GRP={};QBANK.forEach(t=>{if(t.gp)GRP[t.g]=t});const YEARS=[111,112,113,114,115];const LV={must:["必考","b-must"],often:["常考","b-often"],base:["基本分","b-base"]};const U=[{id:1,book:"國二上",name:"基本測量與物質世界",topics:"長度體積、質量天平、密度沉浮、三態、混合物分離、水溶液與濃度",lv:"must",hard:true,yr:[4,3,2,4,4],alert:"密度、濃度（重量百分濃度、ppm）、稀釋、溶解度圖表、實驗變因控制，幾乎每年 2～4 題。是全冊最「穩拿」也最容易粗心丟分的單元。",keys:["密度 D＝M÷V，單位 g/cm³，水是 1 g/cm³。密度是物質的特性，同溫同壓下和拿多少無關。","排水法測不規則固體體積：放入前後的液面差＝物體體積。物體要不溶於水、不與水反應、會沉下去。","沉浮：物體密度＞液體 → 沉；＜液體 → 浮。浮體在液面下的體積比例＝物體密度÷液體密度。","重量百分濃度＝溶質質量÷「溶液」質量×100%，溶液＝溶質＋溶劑。ppm＝溶質÷溶液×10⁶。","稀釋只加水，溶質質量不變：C₁×W₁＝C₂×W₂。","溶解度：定溫下 100 g 水最多可溶解的溶質克數。多數固體溫度越高溶得越多；氣體相反。","分離方法：過濾（分不溶的固體）、蒸發與結晶、蒸餾（沸點不同）、層析（在濾紙上跑的速度不同）。","物理變化沒有新物質（熔化、溶解、混合色素）；化學變化有新物質（燃燒、腐壞、生鏽）。","上皿天平歸零：指針偏左代表左邊重，把左邊校準螺絲向內旋。"],plain:`<h3>密度：東西「擠得多緊」</h3><p>想像同樣大小的箱子，一箱裝棉花、一箱裝鐵塊。鐵塊那箱重很多，因為鐵的粒子排得更緊。<b>密度就是「每 1 cm³ 有多重」</b>，所以 2.7 g/cm³ 的意思是每一小方塊重 2.7 g。</p>\n<h3>濃度：果汁裡原汁占全部的幾成</h3><p>20 g 糖溶在 80 g 水，全部是 100 g，糖占 20%。最常錯的是把分母寫成水（80）。<b>分母永遠是「糖＋水」全部。</b></p>\n<div class="ex">例：200 g 的 20% 食鹽水加 200 g 水 → 鹽仍是 40 g，全部變 400 g → 10%。<br>稀釋口訣：<b>加水不加鹽，鹽的克數不會變</b>。</div>\n<h3>溶解度圖表：先找「100 g 水」</h3><p>題目給的是飽和溶液總重時，先拆成「100 g 水＋溶解度克數」。降溫時，析出量＝兩個溫度的溶解度差（水不是 100 g 時，按比例放大縮小）。</p>`,traps:["濃度分母是溶液不是水：20 g 糖溶於 20 g 水是 50%，不是 100%（115 會考第 36 題）。","空心物體用排水法算的是「平均密度」，會比材料本身的密度小（111 會考第 38 題）。","30 mg 溶在 1000 g 溶液中是 30 ppm，記得把 g 換成 mg 再比（114 會考第 11 題）。","會浮在水上的油，質量（g）的數字應該小於體積（mL）的數字（112 會考第 30 題）。","實驗只能改變一個操縱變因，比較兩組時其他條件都要一樣（115 會考第 23 題）。"],seen:["111-38 空心銅球密度","112-30 黑麻油標示","114-2 測不規則石頭密度","114-11 ppm","115-1 天平歸零","115-18 排水法","115-36 蔗糖濃度"]},{id:2,book:"國二上",name:"波動與聲音",topics:"橫波縱波、波速、聲波傳播、回聲與超聲波、聲音三要素",lv:"base",hard:false,yr:[1,1,1,1,1],alert:"五年來每年固定 1 題，題目短、觀念單純：dB 是響度、Hz 是音調、超聲波聽不到是因為頻率太高。",keys:["波傳遞的是能量，介質只在原地振動，不會跟著跑。","橫波：振動方向⊥傳播方向（繩波、光）；縱波：振動方向∥傳播方向（聲波、彈簧疏密波）。","波速 v＝f×λ；頻率 f＝1÷週期 T。","聲波需要介質，真空不能傳。一般速率：固體＞液體＞氣體；氣溫越高聲速越快（約 331＋0.6T m/s）。","回聲：距離＝聲速×來回時間÷2。","聲音三要素：響度（振幅大小，單位 dB）、音調（頻率高低，單位 Hz）、音色（波形，分辨是誰的聲音）。","人耳可聽範圍約 20～20000 Hz。超聲波＞20000 Hz（產檢、聲納）；次聲波＜20 Hz。","力學波需要介質（水波、聲波）；電磁波（光）不需要介質。"],plain:`<h3>一句話記三要素</h3><p><b>大不大聲看振幅（dB），高不高音看頻率（Hz），像不像誰看波形（音色）。</b>弦越緊、越短、越細，頻率越高，音調越高。</p>\n<h3>找週期的方法</h3><p>表格或圖形題，找某一點「回到同一個位置、而且往同一個方向動」所花的時間，就是一個週期。只回到同一高度但方向相反，只過了半個週期。</p>`,traps:["超聲波聽不到是因為「頻率太高」，不是「速度太快」（114 會考第 1 題）。","抱怨「很大聲」要用 dB，不是 Hz（115 會考第 16 題）。","回聲題忘記除以 2。","光和重力波不需要介質，所以不是力學波；超聲波是力學波（113 會考第 18 題）。"],seen:["111-34 繩波週期","112-13 白噪音響度與頻率","113-18 重力波","114-1 超聲波","115-16 打鼾 dB"]},{id:3,book:"國二上",name:"光與顏色",topics:"直進與針孔成像、反射定律與面鏡、折射與全反射、透鏡成像、色散",lv:"base",hard:true,yr:[1,1,1,1,1],alert:"每年固定 1 題。反射角是和「法線」的夾角、凸透鏡成像表、色光下物體顏色，是最常考的三件事。",keys:["光的直進：影子、針孔成像（倒立實像，像的形狀和孔的形狀無關）。","反射定律：入射角＝反射角，兩個角都是和「法線」的夾角。","平面鏡：正立、等大、左右相反的虛像，像距＝物距。","凹面鏡會聚光線（手電筒、衛星天線）；凸面鏡發散光線，成正立縮小虛像、視野大（後照鏡）。","折射：光由空氣斜射入水或玻璃，會偏向法線；水中筷子看起來向上折。","全反射：光從密介質（水、玻璃）射向疏介質（空氣），且入射角＞臨界角。光纖就是利用全反射。","凹透鏡永遠成正立縮小虛像（近視眼鏡）。","白光經三稜鏡色散成紅橙黃綠藍靛紫，紫光偏折最多。","不透明物體的顏色＝它反射的色光；白色反射全部，黑色全部吸收。看見物體是因為物體反射光進入眼睛。"],plain:`<h3>凸透鏡成像，記一張表就夠</h3><p>f 是焦距。<b>物體越靠近焦點，像越大、越遠；跨過焦點就從倒立實像變成正立虛像。</b></p>\n<div class="scroll"><table><thead><tr><th>物體位置</th><th>成像性質</th><th>生活應用</th></tr></thead><tbody>\n<tr><td>2f 以外</td><td>倒立、縮小、實像（像在 f～2f）</td><td>照相機、眼睛</td></tr>\n<tr><td>剛好在 2f</td><td>倒立、等大、實像（像在 2f）</td><td>測焦距</td></tr>\n<tr><td>f～2f 之間</td><td>倒立、放大、實像（像在 2f 外）</td><td>投影機</td></tr>\n<tr><td>剛好在 f</td><td>不成像（折射後變平行光）</td><td>探照燈</td></tr>\n<tr><td>f 以內</td><td>正立、放大、虛像（和物同側）</td><td>放大鏡</td></tr></tbody></table></div>\n<h3>色光下的顏色：只能反射「照到的光」</h3><p>紅光照在白球上，白球把紅光反射回來，看起來是紅的；紅光照在綠球上，綠球只反射綠光，但沒有綠光可反射，看起來是黑的。所以紅光下看到紅色的球，白光下可能是<b>紅球或白球</b>。</p>`,traps:["題目給的是光和「鏡面」的夾角時，要用 90° 去減才是入射角。","紅光下的紅球，在白光下可能是白球（114 會考第 14 題）。","針孔成像不改變光的方向；透鏡、面鏡、稜鏡都會（111 會考第 14 題）。","觀眾看見演員是因為演員「反射」光，不是吸收或折射（112 會考第 9 題）。","全反射要從「密到疏」，光從空氣射進水裡不會全反射。"],seen:["111-14 改變光方向","112-9 看見演員","113-36 透鏡焦距","114-14 色光照射","115-5 平面鏡反射"]},{id:4,book:"國二上",name:"溫度與熱",topics:"溫標換算、熱量與比熱、熱傳播、三態變化與潛熱",lv:"often",hard:true,yr:[1,1,1,2,3],alert:"近兩年題數變多（115 年有 3 題）。比熱比較的「控制變因」、加熱曲線的平台、凝結與汽化的判斷要熟。",keys:["℉＝9/5×℃＋32；K＝℃＋273。","熱量 H＝m×s×ΔT（單位 cal）；水的比熱 1 cal/g℃，是常見物質中最大的。","比熱越大，溫度越不容易改變（海邊溫差小）。常考比熱大小：水 1＞酒精 0.58＞冰 0.5＞鋁 0.21＞沙 0.2＞鐵 0.11＞銅 0.09＞鉛 0.03（cal/g℃）。","熱平衡：高溫放出的熱＝低溫吸收的熱（無散失時）。","熱傳播：傳導（靠物質，金屬是良導體）、對流（液體氣體流動，熱上升冷下降）、輻射（不需要介質，太陽）。","三態變化時溫度不變，吸收或放出的叫潛熱：熔化、汽化吸熱；凝固、凝結放熱。","冰的熔化熱約 80 cal/g；水的汽化熱約 540 cal/g。","沸點和氣壓有關：氣壓越低，沸點越低（高山上煮東西不易熟）。"],plain:`<h3>比熱＝「溫度的固執程度」</h3><p>同樣的火、同樣的質量，比熱大的東西溫度升得慢。所以比較比熱時，一定要<b>質量相同、吸收熱量相同</b>，再看誰的溫度變化大：<b>升溫越快，比熱越小</b>。</p>\n<h3>常見常考的比熱（單位 cal/g℃）</h3><div class="scroll"><table style="min-width:0"><thead><tr><th style="white-space:nowrap">物質</th><th style="white-space:nowrap">比熱（約）</th><th>會考常怎麼考</th></tr></thead><tbody>\n<tr><td><b>水</b></td><td class="mono">1.00</td><td>常見物質中最大，升溫最慢：海邊溫差小、海陸風、暖氣與汽車水箱用水</td></tr>\n<tr><td>酒精</td><td class="mono">0.58</td><td>和水比：同質量同熱量，酒精升溫約是水的 1.7 倍</td></tr>\n<tr><td>冰</td><td class="mono">0.50</td><td>加熱曲線中，冰段的斜率比水段陡（升溫較快）</td></tr>\n<tr><td>水蒸氣</td><td class="mono">0.48</td><td>同一種物質，不同狀態比熱不同</td></tr>\n<tr><td>空氣</td><td class="mono">0.24</td><td>比水小很多，所以陸地上的空氣白天升溫快</td></tr>\n<tr><td>鋁</td><td class="mono">0.21</td><td>金屬中比熱較大，鋁鍋比鐵鍋吸熱多</td></tr>\n<tr><td>沙石玻璃</td><td class="mono">0.20</td><td>沙灘白天燙、晚上涼；內陸日夜溫差大</td></tr>\n<tr><td>鐵</td><td class="mono">0.11</td><td>鐵、銅、鉛比熱都很小，吸一點熱就變很燙</td></tr>\n<tr><td>銅</td><td class="mono">0.09</td><td>常拿來和鋁、鐵比較升溫快慢</td></tr>\n<tr><td>鉛</td><td class="mono">0.03</td><td>表中最小，同熱量升溫最多</td></tr>\n</tbody></table></div>\n<div class="ex">記法：<b>水 1、酒精冰塊約一半、鋁沙約 0.2、鐵 0.1、銅 0.09、鉛 0.03</b>。<br>同質量吸同熱量，ΔT 和比熱成反比：100 g 的銅和水各吸 90 cal，水升 0.9℃，銅升 0.9÷0.09＝10℃。</div>\n<h3>加熱曲線看「平台」</h3><p>加熱冰塊的溫度–時間圖會出現兩段水平線：0℃ 的平台是冰在熔化（固液共存），100℃ 的平台是水在沸騰（液氣共存）。平台上一直在吸熱，但熱全部拿去改變狀態，溫度不動。</p>\n<div class="ex">例：100 g 80℃ 熱水＋300 g 20℃ 冷水 → 100×(80−T)＝300×(T−20) → T＝35℃。<br>小技巧：混合溫度會「偏向」質量比較大的那一杯。</div>`,traps:["比較比熱卻用「相同體積」或看「誰先熔化」都不對，要相同質量、看升溫快慢（114 會考第 26 題）。","返潮是暖濕空氣遇到「較冷」的牆面凝結（115 會考第 9 題）。","平台是兩態共存、溫度不變（113 會考第 27 題）。","同熱源加熱不同質量的水，ΔT 和質量成反比（111 會考第 28 題）。","倒置燒瓶放冰塊又沸騰，是水蒸氣凝結使氣壓下降、沸點降低（114 會考第 40 題）。"],seen:["111-28 加熱兩杯水","112-6 溫度計位置","113-27 冰的加熱曲線","114-26 比較比熱","114-40 冰塊使水沸騰","115-9 返潮","115-30 比熱比較"]},{id:5,book:"國二上",name:"元素與化合物",topics:"純物質分類、元素符號與週期表、金屬與非金屬、原子結構、分子與化學式",lv:"often",hard:false,yr:[1,1,1,2,2],alert:"每年 1～2 題，偏記憶。原子與離子的質子、中子、電子數，以及週期表能查到什麼，是固定考點。",keys:["純物質：元素（一種原子，如 Cu、O₂）、化合物（兩種以上元素，如 H₂O、CO₂）。混合物：空氣、海水、合金、花岡岩。","週期表：橫列叫週期、縱行叫族；同族化學性質相似。第 1 族鹼金屬（Na、K）、第 17 族鹵素（Cl、Br）、第 18 族鈍氣（He、Ne、Ar，單原子分子，非常穩定）。","金屬：有光澤、導電導熱、延展性好（銅做電線）；非金屬大多不導電（石墨例外）。","原子：原子核裡有質子（＋）和中子（不帶電），外面有電子（−）。電子質量最小。","原子序＝質子數；質量數＝質子數＋中子數。","陽離子：失去電子（Na⁺ 少 1 個電子）；陰離子：得到電子（Cl⁻ 多 1 個電子）。質子數不會變。","道耳頓原子說「原子不可分割」被電子的發現修正。"],plain:`<h3>離子題三步驟</h3><p>1. 質子數＝原子序，離子也不會變。2. 中子＝質量數−質子。3. 電子：帶幾個「＋」就減幾個，帶幾個「−」就加幾個。</p><div class="ex">Ca²⁺（原子序 20）：質子 20，電子 20−2＝18。<br>Cl⁻（原子序 17）：質子 17，電子 17＋1＝18。</div>`,traps:["離子只改變電子數，質子數不變（114 會考第 17 題）。","週期表查不到元素在自然界的含量（113 會考第 4 題）。","鈍氣是「化學性質」相似，常溫都是氣體、單原子分子（115 會考第 3 題）。","含有多種物質的混合物（花岡岩）原子種類最多（114 會考第 4 題）。"],seen:["111-31 離子中的粒子","112-12 原子說修正","113-4 週期表資訊","114-4 物質分類","114-17 Ca²⁺ 與 Cl⁻","115-2 金屬元素","115-3 鈍氣"]},{id:6,book:"國二下",name:"化學反應與計量",topics:"質量守恆、原子量與分子量、莫耳數換算、反應式平衡與係數比",lv:"must",hard:true,yr:[2,1,2,1,2],alert:"高頻考點「化學計量與粒子數」。每年 1～2 題，常和氣體製備、燃燒產物、能源減碳的情境題綁在一起。",keys:["質量守恆：反應前後原子種類、數目、總質量都不變。開放容器有氣體跑掉，秤起來會變輕，但仍守恆。","常用原子量：H＝1、C＝12、N＝14、O＝16、Na＝23、Mg＝24、Cl＝35.5、Ca＝40、Cu＝63.5、Zn＝65.4。","分子量＝各原子量相加，例如 H₂O＝18、CO₂＝44、CH₄＝16。","莫耳數 n＝質量÷分子量（或原子量）；1 莫耳＝6×10²³ 個粒子。","係數比＝分子數比＝莫耳數比（氣體同溫同壓也等於體積比），但「不等於質量比」。","平衡反應式：先平衡只出現在一種物質裡的原子，O 和 H 最後處理。","常見反應：CaO＋H₂O → Ca(OH)₂（放熱）；CaCO₃＋2HCl → CaCl₂＋H₂O＋CO₂；2H₂O₂ → 2H₂O＋O₂（MnO₂ 催化）；Mg＋2HCl → MgCl₂＋H₂。"],plain:`<h3>莫耳就是「化學界的一打」</h3><p>一打＝12 個，一莫耳＝6×10²³ 個。原子量的意思是「一莫耳這種原子有幾克」，所以 12 g 的碳剛好是 1 莫耳。</p>\n<h3>計量題固定四步：克 → 莫耳 → 係數比 → 克</h3><div class="ex">例：2H₂＋O₂ → 2H₂O，4 g 氫氣需要多少氧氣？<br>① 4 g ÷ 2 ＝ 2 mol H₂<br>② 係數比 H₂：O₂＝2：1 → 需要 1 mol O₂<br>③ 1 mol × 32 ＝ 32 g O₂</div>\n<h3>由燃燒產物反推化學式</h3><p>數一數箭頭兩邊的原子：甲＋3O₂ → 2CO₂＋3H₂O，右邊有 C₂、H₆、O₇，左邊氧氣給了 O₆，所以甲＝C₂H₆O（乙醇）。</p>`,traps:["係數比是莫耳數比，不是質量比。","題目只給質量時，一定要用分子量換成莫耳才能用係數比（115 會考第 19 題）。","由產物反推時別忘了氧氣也提供了氧原子（112 會考第 27 題）。","CaO 加水產物是氫氧化鈣，不是碳酸鈣（111 會考第 21 題）。","製備氣體配對：雙氧水 → O₂、鹽酸＋鎂 → H₂、鹽酸＋大理石 → CO₂（115 會考第 48 題）。"],seen:["111-9 物理與化學變化","111-21 自熱罐","112-27 燃燒反推化學式","113-7 石灰放熱","113-37 金屬與鹽酸","114-32 反應前後質量","115-19 甲烷排碳","115-48 製備氣體"]},{id:7,book:"國二下",name:"氧化還原反應",topics:"氧化與還原、活性大小、高爐煉鐵、漂白與防鏽",lv:"often",hard:true,yr:[3,1,1,1,1],alert:"每年至少 1 題，常藏在生活情境（銀針試毒、氫氣煉金屬、鐵粉吸氧）。判斷「誰被氧化、誰被還原」是核心。",keys:["氧化：得到氧（或失去電子）。還原：失去氧（或得到電子）。兩者一定同時發生。","活性大小（對氧）：鉀＞鈉＞鋇＞鈣＞鎂＞鋁＞碳＞鋅＞鉻＞鐵＞錫＞鉛＞氫＞銅＞汞＞銀＞鉑＞金。","元素符號：K＞Na＞Ba＞Ca＞Mg＞Al＞C＞Zn＞Cr＞Fe＞Sn＞Pb＞H＞Cu＞Hg＞Ag＞Pt＞Au。","口訣：甲那被(子)蓋美女貪心哥貼些錢請童工贏柏青","活性大的元素能從化合物中搶走活性小元素的氧（或把它置換出來）。","還原劑：還原別人（例如 C、CO、H₂）；氧化劑：氧化別人。","高爐煉鐵：焦炭燃燒產生 CO，Fe₂O₃＋3CO → 2Fe＋3CO₂；石灰石用來除去雜質。","燃燒、生鏽、呼吸作用都是氧化。","防鏽：隔絕空氣與水（油漆、塗油）、鍍上活性較大的鋅（犧牲自己保護鐵）。漂白水是利用氧化作用去色。","氮氣活性小，可用來保存食物、畫冊。"],plain:`<h3>把它想成「搶氧氣大賽」</h3><p><b>活性越大＝越活潑，越活潑的人越容易搶東西，所以活性越大的就越容易搶氧。</b>鎂在二氧化碳中還能燃燒：2Mg＋CO₂ → 2MgO＋C，代表鎂比碳更會搶氧。<b>搶到氧的被氧化，被搶走氧的被還原。</b></p>\n<h3>活性大小表（由大到小）</h3><p>越上面越會搶氧、越容易被氧化；越下面越穩定，金、鉑幾乎不生鏽。<b>上面的元素可以把下面元素從它的氧化物（或鹽類溶液）中置換出來。</b></p>\n<div class="scroll"><table style="min-width:0"><thead><tr><th>#</th><th>中文</th><th>符號</th><th>英文</th></tr></thead><tbody><tr><td class="mono">1</td><td><b>鉀</b></td><td class="mono"><b>K</b></td><td>Potassium</td></tr><tr><td class="mono">2</td><td><b>鈉</b></td><td class="mono"><b>Na</b></td><td>Sodium</td></tr><tr><td class="mono">3</td><td><b>鋇</b></td><td class="mono"><b>Ba</b></td><td>Barium</td></tr><tr><td class="mono">4</td><td><b>鈣</b></td><td class="mono"><b>Ca</b></td><td>Calcium</td></tr><tr><td class="mono">5</td><td><b>鎂</b></td><td class="mono"><b>Mg</b></td><td>Magnesium</td></tr><tr><td class="mono">6</td><td><b>鋁</b></td><td class="mono"><b>Al</b></td><td>Aluminium</td></tr><tr><td class="mono">7</td><td><b>碳</b></td><td class="mono"><b>C</b></td><td>Carbon</td></tr><tr><td class="mono">8</td><td><b>鋅</b></td><td class="mono"><b>Zn</b></td><td>Zinc</td></tr><tr><td class="mono">9</td><td><b>鉻</b></td><td class="mono"><b>Cr</b></td><td>Chromium</td></tr><tr><td class="mono">10</td><td><b>鐵</b></td><td class="mono"><b>Fe</b></td><td>Iron</td></tr><tr><td class="mono">11</td><td><b>錫</b></td><td class="mono"><b>Sn</b></td><td>Tin</td></tr><tr><td class="mono">12</td><td><b>鉛</b></td><td class="mono"><b>Pb</b></td><td>Lead</td></tr><tr><td class="mono">13</td><td><b>氫</b></td><td class="mono"><b>H</b></td><td>Hydrogen</td></tr><tr><td class="mono">14</td><td><b>銅</b></td><td class="mono"><b>Cu</b></td><td>Copper</td></tr><tr><td class="mono">15</td><td><b>汞</b></td><td class="mono"><b>Hg</b></td><td>Mercury</td></tr><tr><td class="mono">16</td><td><b>銀</b></td><td class="mono"><b>Ag</b></td><td>Silver</td></tr><tr><td class="mono">17</td><td><b>鉑</b></td><td class="mono"><b>Pt</b></td><td>Platinum</td></tr><tr><td class="mono">18</td><td><b>金</b></td><td class="mono"><b>Au</b></td><td>Gold</td></tr></tbody></table></div>\n<div class="ex">口訣：<b>甲那被(子)蓋美女貪心哥貼些錢請童工贏柏青</b><br>甲＝鉀、那＝鈉、被＝鋇、蓋＝鈣、美＝鎂、女＝鋁、貪＝碳、心＝鋅、哥＝鉻、貼＝鐵、些＝錫、錢＝鉛、請＝氫、童＝銅、工＝汞、贏＝銀、柏＝鉑、青＝金<br>K Na Ba Ca Mg Al C Zn Cr Fe Sn Pb H Cu Hg Ag Pt Au</div>\n<h3>還原劑和氧化劑不要背反</h3><p><b>還原劑：還原別人；氧化劑：氧化別人。</b>CO 在煉鐵中拿走 Fe₂O₃ 的氧，把 Fe₂O₃ 還原成鐵，所以 CO 是還原劑；Fe₂O₃ 把 CO 氧化成 CO₂，所以 Fe₂O₃ 是氧化劑。</p>`,traps:["銀針變黑：銀被氧化，硫化物被還原（112 會考第 26 題）。","鐵的活性比碳小，鐵粉搶不走 CO₂ 的氧（115 會考第 50 題）。","能讓碘液還原變無色的物質，本身被氧化（114 會考第 28 題）。","氫氣把金屬氧化物變回金屬：氫被氧化，是氧化還原，不是酸鹼中和（113 會考第 23 題）。"],seen:["111-3 氮氣防氧化","111-41 鈉與硫燃燒","112-26 銀針試毒","113-23 氫氣煉金屬","114-28 維生素 C 與碘液","115-50 鐵粉與 CO₂"]},{id:8,book:"國二下",name:"電解質與酸鹼鹽",topics:"電解質與解離、酸鹼性質、指示劑與 pH、中和與滴定、常見鹽類",lv:"must",hard:false,yr:[3,2,1,2,1],alert:"五年共約 9 題。pH 大小與酸性強弱、中和後離子數與濃度的變化、指示劑顏色是必背。",keys:["電解質：溶於水會解離出離子、可以導電（酸、鹼、鹽）。非電解質：糖、酒精。","水溶液中正電總量＝負電總量，所以溶液電中性。","酸：解離出 H⁺，pH＜7，藍色石蕊變紅，和活潑金屬反應產生 H₂。","鹼：解離出 OH⁻，pH＞7，紅色石蕊變藍，酚酞變紅，摸起來滑滑的。","pH 每差 1，氫離子濃度 [H⁺] 差 10 倍。pH 越小越酸。","中和：酸＋鹼 → 鹽＋水，會放熱。","常見酸：鹽酸 HCl、硫酸 H₂SO₄（濃硫酸有脫水性）、醋酸、碳酸。常見鹼：NaOH（易潮解）、Ca(OH)₂（石灰水，遇 CO₂ 變混濁）、氨水。","常見鹽：NaCl、CaCO₃（大理石）、NaHCO₃（小蘇打）。","體積莫耳濃度 M＝溶質莫耳數÷溶液公升數。"],plain:`<h3>pH 是「倒過來的酸度計」</h3><p>pH 數字越小代表越酸，而且每差 1 就差 10 倍：pH 3 比 pH 5 酸 100 倍。把酸加水稀釋，pH 會往 7 靠近，但不會變成鹼性。</p>\n<h3>中和後的離子：數量 vs. 濃度</h3><p>NaOH 加 HCl 中和，Na⁺ 沒有被消耗（仍在水中），所以<b>數量不變</b>；但加入鹽酸讓溶液體積變大，<b>濃度變小</b>。H⁺ 和 OH⁻ 結合成水，兩者數量都減少。</p>`,traps:["中和後 Na⁺ 數目不變、濃度下降（115 會考第 40 題）。","有機酸（−COOH）也是電解質（111 會考第 10 題）。","醇類的 −OH 不會解離，乙醇不是鹼。","越酸 pH 越「小」，不是越大（113 會考第 17 題）。","CO₂ 溶於水呈酸性，能和 Ca²⁺ 生成難溶的碳酸鈣（114 會考第 19 題）。"],seen:["111-10 蘋果酸","111-29 熟石灰調 pH","112-3 運動飲料電解質","112-32 口腔 pH 變化","113-17 牙齒酸蝕","114-19 CO₂ 固化","115-40 中和後鈉離子"]},{id:9,book:"國二下",name:"反應速率與平衡",topics:"影響速率的因素、可逆反應與動態平衡、濃度與溫度對平衡的影響",lv:"base",hard:true,yr:[0,1,1,1,1],alert:"近四年每年 1 題。動態平衡「速率相等但不是 0」、判斷速率需要記錄「時間」，是最常見的陷阱。",keys:["影響反應速率：反應物本質（活性）、濃度越大越快、溫度越高越快、表面積越大越快（粉末比塊狀快）、催化劑。","催化劑：加快速率，本身反應前後質量與性質不變，不會增加產量。","可逆反應用 ⇌ 表示，正反應與逆反應同時進行。","動態平衡：正反應速率＝逆反應速率（不是 0），所以各物質濃度維持不變、顏色不再改變。","加入反應物（或移走產物）→ 平衡往產物方向移動；反之往反應物方向。","2NO₂（紅棕）⇌ N₂O₄（無色）：降溫顏色變淡。","2CrO₄²⁻（黃）＋2H⁺ ⇌ Cr₂O₇²⁻（橙）＋H₂O：加酸變橙、加鹼變黃。"],plain:`<h3>動態平衡就像捷運車廂</h3><p>每一站都有人上車、有人下車，如果上車和下車的人一樣多，車廂內人數就不變。<b>人數不變不代表沒人在動</b>，這就是動態平衡：正、逆反應都在跑，只是速度一樣快。</p>\n<h3>判斷「速率」一定要有時間</h3><p>速率＝變化量÷時間。實驗如果只量了最後產生多少產物，沒有記錄花了多久，就不能說誰比較快。</p>`,traps:["平衡時速率「不為 0」（113 會考第 11 題）。","只記錄產量、沒記錄時間，不能判斷速率（115 會考第 12 題）。","加入「相同濃度」的溶液，濃度沒變，速率不變。","溫度下降，反應速率變慢（112 會考第 40 題）。"],seen:["112-40 液態氮與三氯化氮","113-11 NO₂ 動態平衡","114-40 相變平衡","115-12 皂化反應速率"]},{id:10,book:"國二下",name:"有機化合物",topics:"有機與無機、乾餾、烷烯、醇、有機酸、酯化、皂化、聚合物與衣料",lv:"must",hard:false,yr:[2,3,2,2,1],alert:"高頻考點。五年約 10 題，常用生活情境（木糖醇、乙酸乙酯、塑膠容器、蘋果酸）考「官能基」與「分類」。",keys:["有機物：含碳的化合物。但 CO、CO₂、碳酸鹽、氰化物雖然含碳，仍屬無機物。","乾餾木材（隔絕空氣加熱）：得到木炭、木焦油、木醋液、可燃性氣體。","烴：只含 C、H。烷類 CnH₂n₊₂（甲烷 CH₄ 是天然氣主成分、丙烷、丁烷）；烯類 CnH₂n（乙烯可催熟水果、做聚乙烯）。","醇類含 −OH：甲醇有毒、乙醇 C₂H₅OH。醇的水溶液是中性，醇不是鹼。","有機酸含 −COOH：甲酸（蟻酸）、乙酸 CH₃COOH（醋酸），水溶液弱酸性，是電解質。","酯化：有機酸＋醇 → 酯＋水（濃硫酸當催化劑）。酯有水果香味、難溶於水。","皂化：油脂＋NaOH → 肥皂＋甘油，加飽和食鹽水讓肥皂析出（鹽析）。肥皂一端親油、一端親水，能去油污。","聚合物：小分子連成的大分子。天然（澱粉、纖維素、蛋白質、天然橡膠）、合成（塑膠、尼龍）。","熱塑性：鏈狀，加熱軟化可重塑、可回收（PET、PE）；熱固性：網狀，加熱不軟化（電木）。","衣料：棉、麻是纖維素；羊毛、蠶絲是蛋白質；尼龍、聚酯纖維是合成纖維。"],plain:`<h3>用「官能基」認身分，像看姓氏</h3><div class="scroll"><table><thead><tr><th>類別</th><th>看這個</th><th>例子</th><th>性質</th></tr></thead><tbody>\n<tr><td>烷／烯</td><td>只有 C、H</td><td>CH₄、C₂H₄</td><td>可燃，不溶於水</td></tr>\n<tr><td>醇</td><td>−OH</td><td>乙醇</td><td>中性，非電解質</td></tr>\n<tr><td>有機酸</td><td>−COOH</td><td>乙酸、蘋果酸</td><td>弱酸性，電解質</td></tr>\n<tr><td>酯</td><td>−COO−</td><td>乙酸乙酯</td><td>香味，難溶於水</td></tr></tbody></table></div>\n<p>判斷一個物質屬於哪一類，要看「原子種類與排列方式」，分子量大小沒有幫助。</p>`,traps:["含碳不一定是有機物：無機物也可以含 C（112 會考第 17 題）。","判斷醇類要看原子排列（官能基），不是分子量（113 會考第 2 題）。","乙酸乙酯本來就存在水果中，所以較安全（111 會考第 22 題）。","皂化實驗：酒精不是反應物，飽和食鹽水用來分離肥皂（112 會考第 11 題）。","只燃燒產生 CO₂ 和 H₂O，代表一定含 C、H，可能含 O。"],seen:["111-10 蘋果酸","111-22 乙酸乙酯","112-11 製作肥皂","112-17 有機無機","113-2 木糖醇","113-19 元素百分比","114-21 塑膠盛酒精","114-44 −COOH 與蒜頭","115-12 皂化"]},{id:11,book:"國二下",name:"力與壓力",topics:"虎克定律、力的平衡、摩擦力、固體壓力、液體壓力與帕斯卡、大氣壓力、浮力",lv:"must",hard:true,yr:[2,1,2,3,2],alert:"易錯觀念第一名：靜摩擦力與最大靜摩擦力。五年約 10 題，摩擦力圖表、壓力計算、浮力與沉浮每年都有。",keys:["力的效應：使物體形變、改變運動狀態。1 kgw ≈ 9.8 N。","虎克定律：彈性限度內，彈簧「伸長量」與外力成正比。","二力平衡：大小相等、方向相反、在同一直線、作用在同一物體上。","靜摩擦力：物體沒動時，摩擦力＝外力（外力多大它就多大）。","最大靜摩擦力：要推動物體前的上限，與正向力（壓得多緊）和接觸面粗糙程度有關，與接觸面積無關。","動摩擦力：動起來後的摩擦力，大小固定，通常比最大靜摩擦力小。","壓力 P＝F÷A。同一物體立起來（面積小）壓力大。","液體壓力 P＝深度 h × 密度 d（gw/cm²），只看深度，與容器形狀無關，同一深度各方向相等。","連通管：靜止時同一種液體液面等高。帕斯卡原理：F₁/A₁＝F₂/A₂（油壓機）。","大氣壓力：1 atm＝76 cmHg＝1033.6 gw/cm²≈1013 hPa，高度越高越小。","浮力＝排開液體的重量＝液面下體積×液體密度。浮體：浮力＝物重；沉體：浮力＜物重。"],plain:`<h3>摩擦力的三段圖（必看）</h3><div class="fig"><figure><svg viewBox="0 0 300 200" role="img" aria-label="摩擦力與外力關係圖"><path class="ax" d="M40 170 H285 M40 170 V15"/><path class="ln" d="M40 170 L150 60"/><path class="ln2" d="M150 60 L152 90 L280 90"/><text x="250" y="188">外力 F</text><text x="4" y="22">摩擦力 f</text><text x="62" y="112">靜摩擦＝外力</text><text x="155" y="52">最大靜摩擦</text><text x="185" y="84">動摩擦（固定）</text></svg><figcaption>斜線段：沒動，f 跟著 F 變；頂點：最大靜摩擦；之後：動摩擦固定</figcaption></figure></div>\n<p>推不動的時候，摩擦力不是「最大靜摩擦」，而是剛好等於你的推力。你推 100 它就 100，推 200 它就 200，直到超過上限（最大靜摩擦）才會動。動起來後摩擦力掉到一個固定值。</p>\n<h3>浮力：水往上推的力</h3><p>物體泡進水裡越多，排開的水越多，浮力越大。<b>浮力只看「水下的體積」</b>，跟物體多重、沉多深無關（完全沒入後就不再變）。</p>\n<div class="ex">例：空氣中 100 gw，水中 60 gw → 浮力 40 gw → 體積 40 cm³ → 密度 100÷40＝2.5 g/cm³。</div>`,traps:["沒推動時摩擦力＝外力，不是最大靜摩擦力（114 會考第 18 題）。","書越多推不動，是正向力變大使最大靜摩擦力變大，不是因為 F＝ma（111 會考第 36 題）。","由「推不動」和「推得動」夾出最大靜摩擦的範圍（112 會考第 33 題）。","截去木塊時重量和底面積都變了，柱體壓力只看高度（115 會考第 32 題）。","山上洋芋片膨脹是大氣壓力變小（111 會考第 7 題）。","psi＝力÷面積，是壓力單位（113 會考第 16 題）。"],seen:["111-7 洋芋片膨脹","111-36 推書櫃","112-33 最大靜摩擦範圍","113-16 psi 胎壓","113-34 物體沒入體積","114-18 f–F 圖","114-29 液體分層","115-32 木塊壓力","115-33 陶瓷碗浮沉"]},{id:12,book:"國三上",name:"直線運動",topics:"位置、路徑長與位移、速率與速度、x–t 圖與 v–t 圖、等加
