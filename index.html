[["基因與顯隱性","AA・Aa・aa","★★★"],["棋盤方格法","3：1・1：1","★★★"],["ABO 血型","Iᴬ・Iᴮ・i","★★★"],["性別決定","XX・XY","★★"],["突變與生物技術","基因轉殖","★"]]),table:[["基因、等位基因、顯隱性","★★★","114-30"],["棋盤方格與比例","★★★","113-12、115-25"],["ABO 血型","★★★","111-11"],["性別決定","★★","課本基本題"],["突變與生物技術","★","112-38"]],cs:[{t:"基因：顯性和隱性",star:"★★★",main:`<p>基因位在<b>染色體</b>上，成對存在，叫<b>等位基因</b>：一個來自爸爸、一個來自媽媽。</p>\n  <figure class="dg"><svg viewBox="0 0 600 190" role="img" aria-label="三種基因型">\n   <g font-family="Noto Sans TC,sans-serif" text-anchor="middle">\n   ${[["AA","顯性","純種",1,1],["Aa","顯性","雜種（帶隱性）",1,0],["aa","隱性","純種",0,0]].map(([t,e,a,i,s],r)=>{const n=110+r*190;return`<rect x="${n-34}" y="30" width="22" height="90" rx="11" fill="${i?"var(--sc)":"var(--muted)"}" opacity="${i?1:.45}"/><rect x="${n+12}" y="30" width="22" height="90" rx="11" fill="${s?"var(--sc)":"var(--muted)"}" opacity="${s?1:.45}"/><text x="${n-23}" y="80" fill="${i?"var(--on-sc)":"var(--ink)"}" font-size="16" font-weight="900">${t[0]}</text><text x="${n+23}" y="80" fill="${s?"var(--on-sc)":"var(--ink)"}" font-size="16" font-weight="900">${t[1]}</text><text x="${n}" y="148" fill="var(--ink)" font-size="15" font-weight="900">表現${e}</text><text x="${n}" y="170" fill="var(--muted)" font-size="12">${a}</text>`}).join("")}</g></svg>\n   <figcaption>圖 1　大寫 A 是顯性，只要有一個就表現；小寫 a 是隱性，要兩個 aa 才表現。</figcaption></figure>\n  <p class="law"><span>無中生有為隱性</span>爸媽都是黑眼，卻生出紅眼 → 紅眼是<em>隱性</em>，而且爸媽一定都是 <em>Aa</em>。</p>\n  <p>基因型 = 基因的組合（AA、Aa、aa）；表現型 = 看得到的樣子（黑眼、紅眼）。AA 和 Aa 表現型一樣。</p>`,side:[["判斷技巧","表現顯性的子代可能是 AA 也可能是 Aa，無法確定；表現隱性的一定是 aa。"]],ex:"bp26",exNote:["黑眼 × 黑眼生出紅眼 → 紅眼是隱性，甲、乙一定都是 Aa。","丙、丁是黑眼子代，可能 AA 也可能 Aa，不能確定。","一定相同的只有甲、乙，選 A。"],pr:"pr231"},{t:"棋盤方格法",star:"★★★",main:`<p>爸爸的兩個基因放<b>上面</b>，媽媽的放<b>左邊</b>，交叉填格子。四格的機率都一樣，每格 1/4。</p>\n  <figure class="dg"><svg viewBox="0 0 600 230" role="img" aria-label="Aa 乘 Aa 與 Aa 乘 aa 的棋盤方格">\n   <g font-family="Noto Sans TC,sans-serif" text-anchor="middle">\n   ${[[40,"Aa × Aa",["A","a"],["A","a"],"顯：隱＝3：1"],[330,"Aa × aa",["A","a"],["a","a"],"顯：隱＝1：1"]].map(([t,e,a,i,s])=>`<text x="${t+115}" y="20" fill="var(--ink)" font-size="15" font-weight="900">${e}</text>\n    ${a.map((e,a)=>`<text x="${t+105+a*70}" y="52" fill="var(--accent)" font-size="16" font-weight="900">${e}</text>`).join("")}\n    ${i.map((e,a)=>`<text x="${t+50}" y="${95+a*60}" fill="var(--accent)" font-size="16" font-weight="900">${e}</text>`).join("")}\n    ${i.map((e,i)=>a.map((a,s)=>{const r=[a,e].sort().join("");const n=r.includes("A");return`<rect x="${t+72+s*70}" y="${62+i*60}" width="66" height="56" rx="8" fill="${n?"var(--sc)":"var(--muted)"}" opacity="${n?.85:.35}"/><text x="${t+105+s*70}" y="${96+i*60}" fill="${n?"var(--on-sc)":"var(--ink)"}" font-size="17" font-weight="900">${r}</text>`}).join("")).join("")}\n    <text x="${t+140}" y="210" fill="var(--bad)" font-size="14" font-weight="900">${s}</text>`).join("")}</g></svg>\n   <figcaption>圖 2　Aa×Aa：AA：Aa：aa＝1：2：1；Aa×aa：Aa：aa＝1：1。</figcaption></figure>\n  <ol class="pts"><li>題目給「共 400 隻」→ 用比例乘：Aa×aa 顯性約 400×1/2＝200 隻。</li><li>只觀察很少隻（例如 10 隻），結果會和 3：1 差很多，要<em>觀察很多</em>才準。</li><li>顯性個體中 Aa 占多少？AA、Aa、Aa 三份中有兩份 → <em>2/3</em>。</li></ol>`,side:[["記法","Aa×Aa → 3：1；Aa×aa → 1：1；AA×aa → 全部 Aa。"],["易錯","3：1 是「很多個」的平均，不是每生 4 個就剛好 3 個顯性。"]],ex:"bp17",exNote:["Aa × Aa → AA：Aa：aa＝1：2：1。","長翅是 AA 和 Aa，共 3 份；短翅 aa 1 份。","理論上長翅：短翅＝3：1，選 D。只看 10 隻樣本太少，才會跟理論差很多。"],pr:"bm26"},{t:"ABO 血型",star:"★★★",main:`<p>ABO 血型有三種基因：<b>Iᴬ、Iᴮ 是顯性</b>（兩個一起時都表現），<b>i 是隱性</b>。</p>\n  <div class="cmp"><table><thead><tr><th>血型</th><th>可能的基因型</th><th>能給孩子什麼</th></tr></thead><tbody>\n   <tr><th>A 型</th><td>IᴬIᴬ 或 <b>Iᴬi</b></td><td>Iᴬ 或 i</td></tr>\n   <tr><th>B 型</th><td>IᴮIᴮ 或 <b>Iᴮi</b></td><td>Iᴮ 或 i</td></tr>\n   <tr><th>AB 型</th><td>IᴬIᴮ（只有一種）</td><td>Iᴬ 或 Iᴮ，<b>沒有 i</b></td></tr>\n   <tr><th>O 型</th><td>ii（只有一種）</td><td>只有 i</td></tr></tbody></table></div>\n  <p class="law"><span>O 型孩子的條件</span>孩子是 <em>ii</em>，爸媽<em>都要</em>能給出 i。只要有一方是 <em>AB 型</em>，就不可能生出 O 型。</p>`,side:[["判斷技巧","A 型 × B 型生出 O 型 → 爸媽一定是 Iᴬi 和 Iᴮi，四種血型都可能生。"],["易錯","A × A 也可能生出 O 型（兩人都是 Iᴬi）。（111 會考第 11 題）"]],ex:"bp1",exNote:["O 型孩子是 ii，爸媽都要能給出 i。","甲 A×A、乙 A×B、丁 O×O 都可能帶 i。","丙的 AB 型是 IᴬIᴮ，沒有 i，不可能生出 O 型，選 C。"],pr:"bm28"},{t:"性別決定",star:"★★",main:`<figure class="dg"><svg viewBox="0 0 600 200" role="img" aria-label="性別決定棋盤">\n   <g font-family="Noto Sans TC,sans-serif" text-anchor="middle">\n   <text x="300" y="22" fill="var(--ink)" font-size="15" font-weight="900">爸爸 XY（精子帶 X 或 Y）</text>\n   <text x="265" y="55" fill="var(--accent)" font-size="17" font-weight="900">X</text><text x="355" y="55" fill="var(--accent)" font-size="17" font-weight="900">Y</text>\n   <text x="160" y="105" fill="var(--ink)" font-size="13" font-weight="700">媽媽 XX</text><text x="160" y="125" fill="var(--muted)" font-size="12">卵都帶 X</text>\n   <text x="210" y="100" fill="var(--accent)" font-size="17" font-weight="900">X</text><text x="210" y="160" fill="var(--accent)" font-size="17" font-weight="900">X</text>\n   ${[0,1].map(t=>`<rect x="225" y="${68+t*60}" width="80" height="54" rx="8" fill="var(--bad)" opacity=".25"/><text x="265" y="${101+t*60}" fill="var(--bad)" font-size="16" font-weight="900">XX 女</text><rect x="315" y="${68+t*60}" width="80" height="54" rx="8" fill="#3b6fc4" opacity=".25"/><text x="355" y="${101+t*60}" fill="#3b6fc4" font-size="16" font-weight="900">XY 男</text>`).join("")}\n   <text x="490" y="110" fill="var(--ink)" font-size="14" font-weight="900">男：女＝1：1</text><text x="490" y="132" fill="var(--muted)" font-size="12">每一胎都是 1/2</text></g></svg>\n   <figcaption>圖 3　決定性別的是爸爸的精子。</figcaption></figure>`,side:[["易錯","已經生了兩個女兒，下一胎生男的機率還是 1/2，每一胎互不影響。"]],ex:"bm27",exNote:["每一胎都是獨立的，前面生什麼不影響下一胎。","精子帶 X 或 Y 各一半。","生男孩機率是 1/2，選 C。"],pr:"pr232"},{t:"突變與生物技術",star:"★",main:`<p class="law"><span>突變</span>基因或染色體發生改變。發生在<em>生殖細胞</em>的突變才可能遺傳給下一代；只發生在體細胞的通常不會。</p>\n  <ul class="pts"><li><b>唐氏症</b>：第 21 號染色體多一條（3 條），屬於染色體數目異常。</li><li><b>顯性遺傳疾病</b>：有一個致病基因就發病。爸媽都沒病，孩子卻有病 → 是孩子自己發生的<em>新突變</em>。</li></ul>\n  <div class="cmp"><table><thead><tr><th>技術</th><th>做法</th><th>例子</th></tr></thead><tbody>\n   <tr><th>基因轉殖</th><td>把一種生物的基因放進另一種生物</td><td>細菌生產人類胰島素</td></tr>\n   <tr><th>雜交育種</th><td>選有優良特徵的個體交配（有性生殖）</td><td>現代玉米</td></tr>\n   <tr><th>複製、組織培養</th><td>無性生殖，子代和親代一樣</td><td>蘭花、桃莉羊</td></tr></tbody></table></div>`,side:[["易錯","顯性疾病父母都沒病 → 父母都是 ff，不是 Ff。（112 會考第 38 題）"]],ex:"bp15",exNote:["這種病只要有一個 F 就會發病（顯性）。","爸媽都沒病，代表他們都沒有 F → 都是 ff。","阿佑的 F 是自己發生的突變，選 D。"],pr:"pr239"}],end:["bp31","fig13","fig41","pr236","pr237"],sumT:"常見雜交一次整理",sumH:["","子代基因型","顯：隱","口訣"],summary:[["AA × aa","全部 Aa","全部顯性","純種配純種，全雜"],["Aa × Aa","AA：Aa：aa＝1：2：1","3：1","雜配雜，三比一"],["Aa × aa","Aa：aa＝1：1","1：1","雜配隱，一比一"],["Iᴬi × Iᴮi","IᴬIᴮ、Iᴬi、Iᴮi、ii","AB：A：B：O＝1：1：1：1","四種都可能"]]};REF[108]={intro:"地球上的生物從哪裡來？又要怎麼把幾百萬種生物分門別類？這一章先看<b>化石</b>和<b>天擇說</b>，再學<b>學名</b>和<b>分類階層</b>，最後用三個問題判斷生物屬於哪一<b>界</b>。每年 1～2 題。",map:mkMap("演化與生物多樣性",[["化石","越深越古老","★"],["天擇說","適者生存","★★"],["分類與學名","屬名＋種小名","★★"],["五界","三個問題判斷","★★★"],["植物與動物","有沒有種子、脊椎","★★"]]),table:[["化石與演化證據","★","課本基本題"],["天擇說","★★","課本基本題"],["二名法與分類階層","★★","113-39"],["五界的判斷","★★★","112-4、114-34"],["植物與動物的分類","★★","115-29"]],cs:[{t:"化石：演化的證據",star:"★",main:`<figure class="dg"><svg viewBox="0 0 600 225" role="img" aria-label="地層與化石">\n   <g font-family="Noto Sans TC,sans-serif">\n   ${[["#d9c59a","新","構造複雜、接近現代"],["#c8ad7a","",""],["#b39062","",""],["#9a764b","老","構造簡單"]].map(([t,e,a],i)=>`<rect x="60" y="${20+i*45}" width="300" height="45" fill="${t}"/>${e?`<text x="380" y="${48+i*45}" fill="var(--ink)" font-size="15" font-weight="900">${e}</text><text x="410" y="${48+i*45}" fill="var(--muted)" font-size="13">${a}</text>`:""}`).join("")}\n   <circle cx="130" cy="155" r="9" fill="none" stroke="#fff" stroke-width="2"/><path d="M220 160 q10 -14 20 0 q10 14 20 0" fill="none" stroke="#fff" stroke-width="2"/>\n   <path d="M150 55 l20 -10 l20 10 l-10 6 l10 10 h-30 z" fill="none" stroke="#5a4426" stroke-width="2"/><path d="M260 60 h40 l-8 -12 M300 60 l-8 12" fill="none" stroke="#5a4426" stroke-width="2"/>\n   <text x="210" y="220" text-anchor="middle" fill="var(--muted)" font-size="12">越深的地層越古老（沒有被翻轉過的情況下）</text></g></svg>\n   <figcaption>圖 1　上層的化石生物比較複雜，下層的比較簡單。</figcaption></figure>\n  <ul class="pts"><li><b>始祖鳥</b>：同時有羽毛（像鳥）和牙齒、尾骨（像爬蟲類）→ 鳥類可能由爬蟲類演化而來。</li><li><b>珊瑚化石</b>：珊瑚只住溫暖淺海 → 那層岩石形成時是溫暖淺海。</li></ul>`,side:[["判斷技巧","化石可以推論古代的環境：看這種生物現在住在哪裡。"]],ex:"bm33",exNote:["越深的地層越古老。","古老的生物構造較簡單，越往上越複雜。","選 B。"],pr:"b1h86"},{t:"天擇說：適合的才留下來",star:"★★",main:`<p class="law"><span>達爾文的天擇說</span>① 同一種生物<em>本來就有差異</em>。② 環境資源有限，<em>適合環境</em>的個體比較能存活、繁殖。③ 有利的特徵<em>遺傳</em>給後代，一代一代累積。</p>\n  <figure class="dg"><svg viewBox="0 0 600 180" role="img" aria-label="長頸鹿天擇">${AH}\n   <g font-family="Noto Sans TC,sans-serif" text-anchor="middle">\n   ${[[90,[30,45,60],"本來就有長有短"],[300,[45,60],"短的吃不到，被淘汰"],[510,[60,60,60],"長脖子的變多"]].map(([t,e,a],i)=>`${e.map((a,i)=>{const s=t-(e.length-1)*22+i*44;return`<rect x="${s-6}" y="${130-a}" width="12" height="${a}" rx="6" fill="#e0a64a"/><ellipse cx="${s}" cy="140" rx="16" ry="10" fill="#e0a64a"/><circle cx="${s+4}" cy="${128-a}" r="6" fill="#c98b2e"/>`}).join("")}<text x="${t}" y="172" fill="var(--ink)" font-size="13" font-weight="700">${a}</text>${i<2?`<path d="M${t+75} 100 H${t+130}" stroke="var(--muted)" stroke-width="2.5" marker-end="url(#ah)"/>`:""}`).join("")}\n   <line x1="190" y1="60" x2="410" y2="60" stroke="var(--ok)" stroke-dasharray="5 4"/><text x="300" y="50" fill="var(--ok)" font-size="12">樹葉的高度</text></g></svg>\n   <figcaption>圖 2　不是「一直伸長所以變長」，而是「本來就長的活下來」。</figcaption></figure>`,side:[["易錯","「努力伸脖子所以變長，再遺傳給後代」是拉馬克的用進廢退說，不是天擇。"],["判斷技巧","細菌抗藥性：原本就有少數抗藥的，用藥後只剩它們大量繁殖。"]],ex:"bm30",exNote:["天擇說的重點：族群本來就有差異。","脖子較長的個體較容易吃到高處的葉子，活下來並繁殖。","長脖子的特徵就越來越多，選 B。"],pr:"pr245"},{t:"分類階層與學名",star:"★★",main:`<p>分類階層從大到小：<b>界 → 門 → 綱 → 目 → 科 → 屬 → 種</b>。越往下，生物越相似、親緣越近。</p>\n  <figure class="dg"><svg viewBox="0 0 600 160" role="img" aria-label="學名的結構">\n   <g font-family="Noto Sans TC,sans-serif" text-anchor="middle">\n   <text x="300" y="60" fill="var(--ink)" font-size="30" font-style="italic" font-family="Georgia,serif"><tspan fill="var(--sc)" font-weight="700">Rhododendron</tspan> <tspan fill="var(--accent)">oldhamii</tspan></text>\n   <path d="M150 75 H340" stroke="var(--sc)" stroke-width="3"/><path d="M360 75 H480" stroke="var(--accent)" stroke-width="3"/>\n   <text x="245" y="102" fill="var(--sc)" font-size="15" font-weight="900">屬名</text><text x="245" y="122" fill="var(--muted)" font-size="12">第一個字，字首大寫</text>\n   <text x="420" y="102" fill="var(--accent)" font-size="15" font-weight="900">種小名</text><text x="420" y="122" fill="var(--muted)" font-size="12">第二個字，全部小寫</text>\n   <text x="300" y="152" fill="var(--muted)" font-size="12">金毛杜鵑的學名：拉丁文、斜體</text></g></svg>\n   <figcaption>圖 3　二名法：學名＝屬名＋種小名。同屬的生物，第一個字一樣。</figcaption></figure>\n  <p class="law"><span>同一種</span>能互相交配，並產生<em>有生殖能力</em>的後代。</p>`,side:[["記法","界門綱目科屬種：「借門剛買顆熟粽」。"],["易錯","科名（Ericaceae）不是學名的一部分；俗名也不是學名。"]],ex:"bp21",exNote:["二名法：第一個字是屬名，第二個字是種小名。","要找「同屬」的植物 → 找第一個字一樣的。","搜尋 Rhododendron 開頭的學名，選 C。"],pr:"bm31"},{t:"五界：三個問題判斷",star:"★★★",main:`<figure class="dg"><svg viewBox="0 0 640 270" role="img" aria-label="五界判斷流程">${AH}\n   <g font-family="Noto Sans TC,sans-serif" text-anchor="middle">\n   <rect x="230" y="12" width="180" height="40" rx="20" fill="var(--sc)"/><text x="320" y="38" fill="var(--on-sc)" font-size="15" font-weight="900">有細胞核嗎？</text>\n   <path d="M230 32 H130 V70" stroke="var(--muted)" stroke-width="2.5" fill="none" marker-end="url(#ah)"/><text x="180" y="25" fill="var(--bad)" font-size="12" font-weight="700">沒有</text>\n   <rect x="50" y="74" width="160" height="56" rx="10" fill="var(--bad)" opacity=".15"/><text x="130" y="98" fill="var(--bad)" font-size="15" font-weight="900">原核生物界</text><text x="130" y="118" fill="var(--ink)" font-size="12">細菌、藍綠菌</text>\n   <path d="M320 54 V74" stroke="var(--muted)" stroke-width="2.5" marker-end="url(#ah)"/><text x="338" y="68" fill="var(--ok)" font-size="12" font-weight="700">有</text>\n   <rect x="230" y="78" width="180" height="40" rx="20" fill="var(--sc)"/><text x="320" y="104" fill="var(--on-sc)" font-size="15" font-weight="900">有菌絲、沒葉綠素？</text>\n   <path d="M410 98 H520 V138" stroke="var(--muted)" stroke-width="2.5" fill="none" marker-end="url(#ah)"/><text x="465" y="90" fill="var(--bad)" font-size="12" font-weight="700">是</text>\n   <rect x="440" y="142" width="160" height="56" rx="10" fill="var(--accent)" opacity=".18"/><text x="520" y="166" fill="var(--accent)" font-size="15" font-weight="900">菌物界</text><text x="520" y="186" fill="var(--ink)" font-size="12">黴菌、酵母菌、香菇</text>\n   <path d="M320 120 V140" stroke="var(--muted)" stroke-width="2.5" marker-end="url(#ah)"/><text x="338" y="134" fill="var(--ok)" font-size="12" font-weight="700">否</text>\n   <rect x="230" y="144" width="180" height="40" rx="20" fill="var(--sc)"/><text x="320" y="170" fill="var(--on-sc)" font-size="15" font-weight="900">構造簡單、多為單細胞？</text>\n   <path d="M230 164 H130 V200" stroke="var(--muted)" stroke-width="2.5" fill="none" marker-end="url(#ah)"/><text x="180" y="157" fill="var(--bad)" font-size="12" font-weight="700">是</text>\n   <rect x="50" y="204" width="160" height="56" rx="10" fill="var(--muted)" opacity=".2"/><text x="130" y="228" fill="var(--ink)" font-size="15" font-weight="900">原生生物界</text><text x="130" y="248" fill="var(--ink)" font-size="12">草履蟲、變形蟲、矽藻</text>\n   <path d="M320 186 V204" stroke="var(--muted)" stroke-width="2.5" marker-end="url(#ah)"/>\n   <rect x="250" y="208" width="140" height="52" rx="10" fill="var(--ok)" opacity=".18"/><text x="320" y="230" fill="var(--ok)" font-size="14" font-weight="900">植物界／動物界</text><text x="320" y="250" fill="var(--ink)" font-size="12">多細胞、構造複雜</text></g></svg>\n   <figcaption>圖 4　先問細胞核，再問菌絲，最後看構造簡不簡單。</figcaption></figure>`,side:[["易錯","藍綠菌有葉綠素，但沒有細胞核 → 原核生物界，不是植物。"],["易錯","香菇、黴菌不是植物：沒有葉綠素，靠分解有機物生活。"]],ex:"bp27",exNote:["甲：有細胞核、有菌絲、沒葉綠素 → 菌物界（真菌界）。","乙：沒有細胞核 → 原核生物界（能光合，像藍綠菌）。","選 D。"],pr:"bm32"},{t:"植物與動物的分類",star:"★★",main:`<div class="cmp"><table><thead><tr><th>植物</th><th>維管束</th><th>繁殖</th><th>例子</th></tr></thead><tbody>\n   <tr><th>苔蘚植物</th><td>✗</td><td>孢子</td><td>地錢、土馬騌（很矮小）</td></tr>\n   <tr><th>蕨類植物</th><td>✓</td><td>孢子（葉背孢子囊堆）</td><td>筆筒樹、山蘇</td></tr>\n   <tr><th>裸子植物</th><td>✓</td><td>種子，<b>沒有花和果實</b>（毬果）</td><td>松、杉、蘇鐵</td></tr>\n   <tr><th>被子植物</th><td>✓</td><td>種子，<b>有花和果實</b></td><td>玫瑰、稻、榕樹</td></tr></tbody></table></div>\n  <div class="cmp"><table><thead><tr><th>脊椎動物</th><th>重點特徵</th></tr></thead><tbody>\n   <tr><th>魚類</th><td>鰓呼吸、有鰭</td></tr><tr><th>兩生類</th><td>小時候在水中用鰓，長大用肺和皮膚（青蛙）</td></tr>\n   <tr><th>爬蟲類</th><td>有鱗片、卵有殼（蛇、烏龜、鱷魚）</td></tr><tr><th>鳥類</th><td>有羽毛、內溫</td></tr><tr><th>哺乳類</th><td>有毛、胎生、哺乳、內溫（鯨魚也是）</td></tr></tbody></table></div>`,side:[["判斷技巧","會開花 → 一定是被子植物 → 一定有果實。"],["易錯","蜘蛛不是昆蟲：昆蟲 3 對足、身體 3 部分；蜘蛛 4 對足、2 部分。"]],ex:"bp32",exNote:["題目說穿山龍「花朵為白色」→ 會開花，是被子植物。","被子植物有花、有果實。","孢子囊堆是蕨類、毬果是裸子植物，選 C。"],pr:"pr247"}],end:["bp9","pr246","pr249","b1h81","b1h78"],sumT:"五界一次整理",sumH:["","細胞核","葉綠素","例子"],summary:[["原核生物界","✗","有的有（藍綠菌）","細菌、藍綠菌"],["原生生物界","✓","有的有","草履蟲、眼蟲、矽藻"],["菌物界","✓","✗（有菌絲）","黴菌、酵母菌、香菇"],["植物界","✓","✓","苔蘚、蕨類、種子植物"],["動物界","✓","✗","昆蟲、魚、哺乳類"]]};REF[109]={intro:"生物不是自己活著，而是和其他生物、和環境互相影響。這一章看<b>生態系的層次</b>、<b>生物間的關係</b>、<b>能量和物質</b>怎麼流動，以及人類怎麼<b>保育</b>。常和時事結合，每年 1～3 題。",map:mkMap("生態系與環境",[["族群與生態系","由小到大","★"],["交互作用","競爭・掠食・共生","★★★"],["食物鏈與能量塔","每層剩 10%","★★"],["生物放大・循環","越上層越毒","★★"],["族群估算","捉放法","★★"],["保育","外來種・過度利用","★★"]]),table:[["族群、群集、生態系","★","課本基本題"],["生物間的交互作用","★★★","114-3"],["食物鏈與能量塔","★★","課本基本題"],["生物放大、碳循環","★★","112-14"],["標記再捕捉法","★★","115-21"],["生物多樣性與保育","★★","112-1、113-42"]],cs:[{t:"族群、群集、生態系",star:"★",main:`<figure class="dg"><svg viewBox="0 0 600 210" role="img" aria-label="生態層次">\n   <g font-family="Noto Sans TC,sans-serif" text-anchor="middle">\n   ${[["生物圈","地球上所有生態系",270,100],["生態系","群集＋非生物環境（陽光、水、空氣）",210,80],["群集","同一地區所有的族群",150,60],["族群","同一地區、同一種的所有個體",90,40]].map(([t,e,a,i],s)=>`<ellipse cx="300" cy="${105+(3-s)*0}" rx="${a}" ry="${i}" fill="var(--sc)" opacity="${.15+s*.15}"/>`).join("")}\n   <text x="60" y="110" fill="var(--ink)" font-size="14" font-weight="900">生物圈</text>\n   <text x="120" y="110" fill="var(--ink)" font-size="14" font-weight="900">生態系</text>\n   <text x="180" y="110" fill="var(--ink)" font-size="14" font-weight="900">群集</text>\n   <text x="300" y="105" fill="var(--on-sc)" font-size="15" font-weight="900">族群</text>\n   <text x="300" y="125" fill="var(--on-sc)" font-size="11">一池塘的所有吳郭魚</text></g></svg>\n   <figcaption>圖 1　族群 ⊂ 群集 ⊂ 生態系 ⊂ 生物圈。</figcaption></figure>\n  <div class="cmp"><table><thead><tr><th>層次</th><th>包含什麼</th></tr></thead><tbody>\n   <tr><th>族群</th><td>同一地區、<b>同一種</b>生物的所有個體</td></tr><tr><th>群集</th><td>同一地區<b>所有</b>族群</td></tr>\n   <tr><th>生態系</th><td>群集＋<b>非生物環境</b></td></tr><tr><th>生物圈</th><td>地球上所有生態系</td></tr></tbody></table></div>`,side:[["易錯","陽光、水、溫度是「非生物」因子，但也屬於生態系的一部分。"]],ex:"bm37",exNote:["「所有的生物」＝群集。","群集再加上牠們的環境 → 生態系。","選 C。"],pr:"pr251"},{t:"生物間的交互作用",star:"★★★",main:`<div class="cmp"><table><thead><tr><th>關係</th><th>甲</th><th>乙</th><th>例子</th></tr></thead><tbody>\n   <tr><th>競爭</th><td>－</td><td>－</td><td>搶同樣的食物、巢位（獅子和獵豹搶羚羊）</td></tr>\n   <tr><th>掠食</th><td>＋（吃的）</td><td>－（被吃）</td><td>老鷹吃蛇</td></tr>\n   <tr><th>寄生</th><td>＋（寄生者）</td><td>－（宿主）</td><td>蛔蟲住在人腸道</td></tr>\n   <tr><th>互利共生</th><td>＋</td><td>＋</td><td>小丑魚和海葵、根瘤菌和豆科植物</td></tr>\n   <tr><th>片利共生</th><td>＋</td><td>0</td><td>印魚吸在鯊魚身上</td></tr></tbody></table></div>\n  <p class="law"><span>判斷方法</span>問兩個問題：有沒有<em>搶同樣的東西</em>（競爭）？有沒有<em>吃對方</em>（掠食）？兩種關係可以<em>同時存在</em>。</p>`,side:[["判斷技巧","食物和巢位相近 → 競爭；還吃對方的幼鳥 → 也是掠食。（114 會考第 3 題）"]],ex:"bp23",exNote:["築巢位置相近、食物種類相似 → 搶資源，是競爭。","白尾八哥還吃麻雀幼鳥 → 掠食。","兩種同時存在，選 A。"],pr:"pr257"},{t:"食物鏈與能量塔",star:"★★",main:`<p><b>生產者</b>（綠色植物）行光合作用，把光能存起來；<b>消費者</b>吃別的生物；<b>分解者</b>（細菌、真菌）把屍體分解回無機物。</p>\n  <figure class="dg"><svg viewBox="0 0 600 220" role="img" aria-label="能量塔">\n   <g font-family="Noto Sans TC,sans-serif" text-anchor="middle">\n   ${[["草（生產者）","10000"],["蚱蜢（初級消費者）","1000"],["青蛙（次級消費者）","100"],["蛇（三級消費者）","10"]].map(([t,e],a)=>{const i=360-a*80,s=170-a*48;return`<rect x="${230-i/2}" y="${s}" width="${i}" height="42" rx="4" fill="var(--sc)" opacity="${.35+a*.2}"/><text x="230" y="${s+27}" fill="var(--ink)" font-size="14" font-weight="900">${t}</text><text x="${240+i/2+20}" y="${s+27}" text-anchor="start" fill="var(--bad)" font-size="14" font-weight="900">${e}</text>`}).join("")}\n   <text x="530" y="20" fill="var(--bad)" font-size="13" font-weight="700">能量單位</text>\n   <text x="530" y="40" fill="var(--muted)" font-size="12">每層 ×1/10</text></g></svg>\n   <figcaption>圖 2　每往上一層只剩約 10%，其他在呼吸作用中變成熱散失。</figcaption></figure>`,side:[["易錯","能量只能單向流動、越來越少；物質（碳、氮）才會循環。"],["判斷技巧","食物鏈通常不超過五層，因為越上層能量越少。"]],ex:"pr255",exNote:["草 → 蚱蜢 → 青蛙 → 蛇，蛇在第 4 層。","每往上一層 ×1/10：10000 → 1000 → 100 → 10。","蛇大約得到 10 單位，選 A。"],pr:"bm34"},{t:"生物放大與碳循環",star:"★★",main:`<p class="law"><span>生物放大作用</span>難分解的物質（DDT、重金屬）吃進去排不掉，沿著食物鏈<em>一路累積</em>，越上層濃度<em>越高</em>。</p>\n  <figure class="dg"><svg viewBox="0 0 600 150" role="img" aria-label="生物放大">${AH}\n   <g font-family="Noto Sans TC,sans-serif" text-anchor="middle">\n   ${[["丁","0.04"],["乙","0.2"],["甲","2.0"],["丙","20"]].map(([t,e],a)=>{const i=80+a*150,s=16+a*8;return`<circle cx="${i}" cy="70" r="${s}" fill="var(--bad)" opacity="${.2+a*.2}"/><text x="${i}" y="76" fill="var(--ink)" font-size="16" font-weight="900">${t}</text><text x="${i}" y="130" fill="var(--bad)" font-size="13" font-weight="700">${e} ppm</text>${a<3?`<path d="M${i+s+6} 70 H${i+150-(s+14)}" stroke="var(--muted)" stroke-width="2.5" marker-end="url(#ah)"/>`:""}`}).join("")}\n   <text x="80" y="20" fill="var(--sc)" font-size="12" font-weight="700">生產者</text><text x="530" y="20" fill="var(--bad)" font-size="12" font-weight="700">最高階消費者</text></g></svg>\n   <figcaption>圖 3　把濃度從小排到大，就是食物鏈的順序（112 會考第 14 題）。</figcaption></figure>\n  <div class="cmp"><table><thead><tr><th>碳循環</th><th>CO₂ 怎麼變</th></tr></thead><tbody>\n   <tr><th>光合作用</th><td>大氣 CO₂ → 有機物（<b>減少</b> CO₂）</td></tr>\n   <tr><th>呼吸作用、分解作用</th><td>有機物 → CO₂（增加）</td></tr>\n   <tr><th>燃燒化石燃料、砍伐森林</th><td>增加 CO₂ → 溫室效應</td></tr></tbody></table></div>`,side:[["判斷技巧","有毒物質濃度最低的 → 生產者；最高的 → 最上層消費者。"]],ex:"bp11",exNote:["DDT 會生物放大，濃度越高越上層。","從小排到大：丁 0.04 → 乙 0.2 → 甲 2.0 → 丙 20。","食物鏈是丁→乙→甲→丙，選 B。"],pr:"bm36"},{t:"標記再捕捉法（捉放法）",star:"★★",main:`<p>池塘裡的魚數不完，可以用<b>比例</b>估計：先抓一些做記號放回，過一陣子再抓一次。</p>\n  <div class="formula"><div class="fx"><span>做記號數</span>／<span>總數</span>＝<span>再捕中有記號</span>／<span>再捕數</span></div>\n   <div class="fl"><div><b>例</b>先標記 40 條，再捕 50 條中 10 條有記號<small>40／N＝10／50 → N＝200 條</small></div><div><b>條件</b>期間沒有出生、死亡、遷入、遷出<small>且記號不會掉、混合均勻</small></div></div></div>\n  <p class="law"><span>注意</span>算出來的是<em>估計值</em>（可能數量），不是實際數量。</p>`,side:[["易錯","題目若問「原本的黑色鯉魚」，要把放進去的紅鯉魚扣掉。（115 會考第 21 題）"]],ex:"bp30",exNote:["放入 50 隻紅鯉魚（相當於做記號），再捕 50 隻中 5 隻是紅的。","50／N＝5／50 → 總數 N＝500，黑色＝500－50＝450。","捉放法只是估計，所以是「可能數量」，選 D。"],pr:"pr258"},{t:"生物多樣性與保育",star:"★★",main:`<p>物種越多、食物網越複雜，生態系越<b>穩定</b>：一種生物少了，還有別的可以替代。</p>\n  <div class="cmp"><table><thead><tr><th>威脅</th><th>意思</th><th>例子</th></tr></thead><tbody>\n   <tr><th>棲地破壞</th><td>生物住的地方被改掉</td><td>原始森林砍掉改種單一樹種、開發</td></tr>\n   <tr><th>過度利用</th><td>抓太多、採太多</td><td>食蛇龜被大量捕捉販賣</td></tr>\n   <tr><th>外來種</th><td>非本地生物大量繁殖，搶原生種的資源</td><td>綠鬣蜥、福壽螺</td></tr>\n   <tr><th>環境汙染</th><td>毒物、塑膠進入環境</td><td>DDT、海洋塑膠</td></tr></tbody></table></div>\n  <p>保育最根本的方法是<b>保護棲地</b>，例如設立國家公園、自然保留區。</p>`,side:[["易錯","大量捕捉販賣是「過度利用」，不是棲地破壞。（113 會考第 42 題）"],["判斷技巧","原始森林改成單一樹種 → 物種變少、食物網變簡單 → 比較不穩定。"]],ex:"bp22",exNote:["食蛇龜是因為市場需求被大量捕捉。","牠住的地方並沒有被破壞，也不是汙染或外來種。","問題是抓太多 → 過度捕捉，選 C。"],pr:"pr259"}],end:["bp8","fig14","fig42","pr256","bm35"],sumT:"生態系角色一次整理",sumH:["","做什麼","例子","能量來源"],summary:[["生產者","光合作用製造養分","綠色植物、藻類","太陽光"],["消費者","吃其他生物","兔子、青蛙、老鷹","吃進的生物"],["分解者","把屍體分解成無機物","細菌、真菌（香菇）","屍體、排遺"]]};REF[11]={intro:"這一章從「力」開始，延伸到<b>壓力</b>（力分散在多大的面積上）和<b>浮力</b>（液體往上托的力）。五年約 10 題，易錯第一名是<b>摩擦力</b>：推不動的時候，摩擦力到底多大？",map:mkMap("力與壓力",[["力","虎克定律・力平衡","★"],["摩擦力","靜・最大靜・動","★★★"],["固體壓力","P＝F÷A","★★"],["液體壓力","P＝h×d・帕斯卡","★★"],["大氣壓力","76 cmHg","★★"],["浮力","排開液體重","★★★"]]),table:[["力的測量與虎克定律","★","課本基本題"],["摩擦力","★★★","111-36、112-33、114-18"],["固體壓力","★★","113-16、115-32"],["液體壓力與帕斯卡原理","★★","114-29"],["大氣壓力","★★","111-7"],["浮力","★★★","113-34、115-33"]],cs:[{t:"力的測量：虎克定律",star:"★",main:`<p>力會讓物體<b>變形</b>，或<b>改變運動狀態</b>。彈簧秤就是利用彈簧的變形來量力。</p>\n  <p class="law"><span>虎克定律</span>在彈性限度內，彈簧的<em>伸長量</em>和所受的外力<em>成正比</em>。</p>\n  <figure class="dg"><svg viewBox="0 0 520 220" role="img" aria-label="彈簧伸長量">\n   <g font-family="Noto Sans TC,sans-serif" text-anchor="middle"><line x1="40" y1="20" x2="480" y2="20" stroke="var(--ink)" stroke-width="4"/>\n   ${[[100,0,60],[260,20,100],[420,40,140]].map(([t,e,a])=>`<path d="M${t} 20 ${Array.from({length:8},(e,i)=>`L${t+(i%2?-12:12)} ${20+(i+1)*a/8}`).join(" ")} L${t} ${20+a+6}" stroke="var(--ink)" stroke-width="2.5" fill="none"/>${e?`<rect x="${t-20}" y="${26+a}" width="40" height="30" rx="4" fill="var(--sc)"/><text x="${t}" y="${46+a}" fill="var(--on-sc)" font-size="13" font-weight="700">${e} gw</text>`:""}`).join("")}\n   <line x1="140" y1="86" x2="470" y2="86" stroke="var(--muted)" stroke-dasharray="4 4"/><text x="100" y="110" fill="var(--muted)" font-size="13">原長</text>\n   <text x="300" y="112" fill="var(--bad)" font-size="13" font-weight="700">伸長 4 cm</text><text x="460" y="150" fill="var(--bad)" font-size="13" font-weight="700">伸長 8 cm</text></g></svg>\n   <figcaption>圖 1　掛的重量加倍，伸長量也加倍（不是總長度加倍）。</figcaption></figure>\n  <p>力的單位：<b>1 kgw ≈ 9.8 N</b>。兩個力要讓物體平衡（<b>二力平衡</b>），必須大小相等、方向相反、在同一直線、作用在同一物體上。</p>`,side:[["易錯","成正比的是「伸長量」，不是彈簧的總長度。"],["解題步驟","先算每 1 gw 伸長多少，再乘新的重量，最後才加回原長。"]],ex:"m45",exNote:["20 gw 伸長 4 cm → 每 5 gw 伸長 1 cm。","50 gw → 伸長 50÷5＝10 cm。","題目問的是伸長量，所以答案 10 cm。"],pr:"pr100"},{t:"摩擦力：推不動時摩擦力多大？",star:"★★★",main:`<p>摩擦力總是<b>阻止物體相對滑動</b>。它分三種情況，一定要用這張圖記：</p>\n  <figure class="dg"><svg viewBox="0 0 520 240" role="img" aria-label="摩擦力與外力關係圖">\n   <g font-family="Noto Sans TC,sans-serif"><path d="M60 20 V200 H480" stroke="var(--ink)" stroke-width="2" fill="none"/><text x="52" y="24" text-anchor="end" fill="var(--muted)" font-size="13">摩擦力 f</text><text x="480" y="222" text-anchor="end" fill="var(--muted)" font-size="13">外力 F</text>\n   <polyline points="60,200 260,60" stroke="var(--sc)" stroke-width="4" fill="none"/><polyline points="260,90 470,90" stroke="var(--bad)" stroke-width="4" fill="none"/><line x1="260" y1="60" x2="260" y2="90" stroke="var(--muted)" stroke-dasharray="3 3"/>\n   <circle cx="260" cy="60" r="6" fill="var(--sc)"/><text x="268" y="52" fill="var(--accent)" font-size="14" font-weight="700">最大靜摩擦力</text>\n   <text x="120" y="120" fill="var(--accent)" font-size="14" font-weight="700" transform="rotate(-35 120 120)">靜摩擦＝外力</text>\n   <text x="330" y="115" fill="var(--bad)" font-size="14" font-weight="700">動摩擦力（固定）</text>\n   <text x="150" y="190" fill="var(--muted)" font-size="13">推不動</text><text x="360" y="190" fill="var(--muted)" font-size="13">推動了</text></g></svg>\n   <figcaption>圖 2　斜線段：沒動，摩擦力跟著外力變；頂點：最大靜摩擦；之後：動摩擦固定。</figcaption></figure>\n  <div class="cmp"><table><thead><tr><th>狀態</th><th>摩擦力多大</th></tr></thead><tbody><tr><th>推不動（靜止）</th><td><b>靜摩擦力＝外力</b>（推多少就擋多少）</td></tr><tr><th>剛好要動</th><td>最大靜摩擦力</td></tr><tr><th>滑動中</th><td>動摩擦力，<b>固定</b>，比最大靜摩擦小一點，和推多大力無關</td></tr></tbody></table></div>\n  <p>最大靜摩擦力和動摩擦力會受<b>接觸面粗糙程度</b>和<b>正向力</b>（物體壓在地上的力）影響，和接觸面積大小無關。</p>`,side:[["易錯","推不動時，摩擦力＝外力，不是最大靜摩擦力。（114 會考第 18 題）"],["易錯","書櫃裝滿推不動，是正向力變大使最大靜摩擦力變大，不是因為 F＝ma。（111 會考第 36 題）"],["判斷技巧","「推不動」和「推得動」的外力，夾出最大靜摩擦的範圍；而且最大靜摩擦＞動摩擦。（112 會考第 33 題）"]],ex:"p46",exNote:["F 到 400 gw 前 f＝F，表示還沒動 → 最大靜摩擦力是 400 gw，A 錯。","F 要超過 400 gw 才會動，B 錯。","沒動時 f＝F，所以 F 越小，靜摩擦力越小，C 對。","動摩擦力固定 300 gw，不會跟著 F 變大，D 錯。"],pr:"fig2"},{t:"固體壓力：力分攤到多大的面",star:"★★",main:`<p>同樣的力，作用在越小的面積上，感覺越「刺」。<b>每單位面積受到的力</b>就是<b>壓力</b>。</p>\n  <div class="formula"><div class="fx"><span>P</span>＝<span>F</span>÷<span>A</span></div><div class="fl"><div><b>P</b>壓力<small>gw/cm²、N/m²（Pa）</small></div><div><b>F</b>垂直作用的力<small>放在桌上就是重量</small></div><div><b>A</b>受力面積<small>cm²、m²</small></div></div></div>\n  <figure class="dg"><svg viewBox="0 0 520 170" role="img" aria-label="磚塊三種放法">\n   <g font-family="Noto Sans TC,sans-serif" text-anchor="middle"><line x1="20" y1="140" x2="500" y2="140" stroke="var(--muted)" stroke-width="3"/>\n   <rect x="40" y="110" width="120" height="30" fill="var(--sc)" opacity=".7" stroke="var(--ink)" stroke-width="2"/><text x="100" y="164" fill="var(--ink)" font-size="13" font-weight="700">平放：面積大 → 壓力小</text>\n   <rect x="220" y="80" width="120" height="60" fill="var(--sc)" opacity=".7" stroke="var(--ink)" stroke-width="2"/><text x="280" y="164" fill="var(--ink)" font-size="13" font-weight="700">側放</text>\n   <rect x="410" y="20" width="30" height="120" fill="var(--bad)" opacity=".7" stroke="var(--ink)" stroke-width="2"/><text x="425" y="164" fill="var(--bad)" font-size="13" font-weight="700">直立：面積小 → 壓力大</text></g></svg>\n   <figcaption>圖 3　同一塊磚，對桌面的「力」都一樣（＝重量），「壓力」不一樣。</figcaption></figure>\n  <p>如果是<b>均勻的長方體或柱體</b>直立放著，壓力＝密度×高，和底面積無關。</p>`,side:[["易錯","「力」和「壓力」不一樣。三種放法的力都等於重量，壓力才不同。"],["生活實例","刀子磨利、釘子尖頭是減少面積增加壓力；雪鞋、書包寬背帶是增加面積減少壓力。"],["單位","psi＝磅力÷平方英寸，是「力÷面積」，所以是壓力的單位。（113 會考第 16 題）"]],ex:"p62",exNote:["均勻的長方體平放：壓力＝重量÷底面積＝(密度×底面積×高)÷底面積＝密度×高。","壓力只看高度：原本高 10 cm，後來高 8 cm。","新壓力＝8/10 P＝4P/5，選 B。"],pr:"m50"},{t:"液體壓力與帕斯卡原理",star:"★★",main:`<p>液體有重量，所以會對容器底部和四周都產生壓力。越深，上面壓著的液體越多，壓力就越大。</p>\n  <div class="formula"><div class="fx"><span>P</span>＝<span>h</span>×<span>d</span></div><div class="fl"><div><b>h</b>深度<small>從液面往下量</small></div><div><b>d</b>液體密度<small>水＝1 g/cm³</small></div></div></div>\n  <ol class="pts"><li>液體壓力<b>只看深度和密度</b>，和容器形狀、液體總量無關。</li><li>同一深度，<b>各個方向</b>的壓力都一樣大。</li></ol>\n  <p class="law"><span>帕斯卡原理</span>密閉液體某處受到的壓力，會<em>大小不變</em>地傳到液體各處。</p>\n  <figure class="dg"><svg viewBox="0 0 520 200" role="img" aria-label="油壓機">${AH}\n   <g font-family="Noto Sans TC,sans-serif" text-anchor="middle"><path d="M80 60 V170 H440 V60 M120 60 V130 H340 V60" stroke="var(--ink)" stroke-width="3" fill="none"/>\n   <rect x="82" y="90" width="36" height="78" fill="var(--sc)" opacity=".35"/><rect x="118" y="132" width="224" height="36" fill="var(--sc)" opacity=".35"/><rect x="342" y="90" width="96" height="78" fill="var(--sc)" opacity=".35"/>\n   <rect x="82" y="80" width="36" height="10" fill="var(--ink)"/><rect x="342" y="80" width="96" height="10" fill="var(--ink)"/>\n   <path d="M100 30 V74" stroke="var(--bad)" stroke-width="4" marker-end="url(#ah)"/><text x="100" y="22" fill="var(--bad)" font-size="13" font-weight="700">小力 F₁</text>\n   <path d="M390 74 V30" stroke="var(--bad)" stroke-width="6" marker-end="url(#ah)"/><text x="390" y="22" fill="var(--bad)" font-size="13" font-weight="700">大力 F₂</text>\n   <text x="230" y="195" fill="var(--ink)" font-size="14" font-weight="700">F₁÷A₁＝F₂÷A₂（兩邊壓力相等）</text></g></svg>\n   <figcaption>圖 4　油壓機：面積大 20 倍，力就大 20 倍。</figcaption></figure>`,side:[["易錯","形狀不同的容器裝同樣深的水，底部水壓相同。"],["生活實例","油壓千斤頂、汽車煞車都用帕斯卡原理。"],["判斷技巧","不同液體分層：密度大的在下面。（114 會考第 29 題）"]],ex:"m48",exNote:["帕斯卡原理：兩邊壓力相等 → F₁÷A₁＝F₂÷A₂。","5÷10＝F₂÷200。","F₂＝100 kgw，選 C。"],pr:"m46"},{t:"大氣壓力：空氣也在壓你",star:"★★",main:`<p>地球外面包著一層厚厚的空氣，空氣有重量，所以也會產生壓力，叫<b>大氣壓力</b>。我們沒感覺，是因為身體內外的壓力平衡了。</p>\n  <figure class="dg"><svg viewBox="0 0 520 220" role="img" aria-label="托里切利實驗">${AH}\n   <g font-family="Noto Sans TC,sans-serif"><path d="M90 170 V200 H290 V170" stroke="var(--ink)" stroke-width="3" fill="none"/><rect x="92" y="175" width="196" height="24" fill="var(--muted)" opacity=".6"/>\n   <rect x="170" y="20" width="22" height="175" fill="none" stroke="var(--ink)" stroke-width="2.5"/><rect x="172" y="60" width="18" height="135" fill="var(--muted)" opacity=".85"/><text x="198" y="42" fill="var(--muted)" font-size="12">真空</text>\n   <path d="M230 175 V60" stroke="var(--bad)" stroke-width="2" marker-start="url(#ah)" marker-end="url(#ah)"/><text x="240" y="120" fill="var(--bad)" font-size="14" font-weight="700">76 cm</text>\n   <path d="M120 140 V170" stroke="var(--earth)" stroke-width="3" marker-end="url(#ah)"/><path d="M260 140 V170" stroke="var(--earth)" stroke-width="3" marker-end="url(#ah)"/><text x="120" y="132" text-anchor="middle" fill="var(--earth-k)" font-size="12">大氣</text>\n   <text x="320" y="70" fill="var(--ink)" font-size="14" font-weight="700">1 大氣壓</text><text x="320" y="95" fill="var(--ink)" font-size="14">＝76 cmHg</text><text x="320" y="120" fill="var(--ink)" font-size="14">≈1033.6 gw/cm²</text><text x="320" y="150" fill="var(--muted)" font-size="13">管子傾斜：鉛直高度不變</text></g></svg>\n   <figcaption>圖 5　托里切利實驗：大氣壓力撐住 76 cm 高的水銀柱。</figcaption></figure>\n  <p><b>高度越高，大氣壓力越小</b>（上面的空氣比較少）。所以山上密封的洋芋片會膨脹、高山上水的沸點比較低。</p>`,side:[["易錯","洋芋片在山上膨脹是因為大氣壓力變小，不是溫度變低。（111 會考第 7 題）"],["生活實例","吸管喝飲料、吸盤黏牆、針筒抽藥水，都是大氣壓力把東西推過去。"]],ex:"p2",exNote:["題目要找「最不適合」反駁小真（溫度說）的說法。","A、C、D 都在說：溫度一樣也膨脹、溫度變了卻不膨脹 → 能證明和溫度無關。","B 玻璃瓶本來就不會膨脹，不能拿來比 → 最不適合。"],pr:"m49"},{t:"浮力：液體往上托的力",star:"★★★",main:`<p>物體泡在液體裡，下面受到的液體壓力比上面大（比較深），這個差造成往上的力，就是<b>浮力</b>。</p>\n  <p class="law"><span>阿基米德原理</span>浮力＝物體<em>排開液體的重量</em>＝液體密度 × <em>沒入液體的體積</em></p>\n  <figure class="dg"><svg viewBox="0 0 520 220" role="img" aria-label="彈簧秤量浮力">\n   <g font-family="Noto Sans TC,sans-serif" text-anchor="middle"><rect x="80" y="20" width="40" height="60" rx="5" fill="none" stroke="var(--ink)" stroke-width="2.5"/><text x="100" y="56" fill="var(--ink)" font-size="13" font-weight="700">100</text><line x1="100" y1="80" x2="100" y2="110" stroke="var(--ink)" stroke-width="2"/><rect x="80" y="110" width="40" height="40" fill="var(--sc)"/><text x="100" y="180" fill="var(--ink)" font-size="13" font-weight="700">空氣中 100 gw</text>\n   <rect x="250" y="20" width="40" height="60" rx="5" fill="none" stroke="var(--ink)" stroke-width="2.5"/><text x="270" y="56" fill="var(--ink)" font-size="13" font-weight="700">60</text><line x1="270" y1="80" x2="270" y2="130" stroke="var(--ink)" stroke-width="2"/>\n   <path d="M200 100 V200 H340 V100" stroke="var(--ink)" stroke-width="2.5" fill="none"/><rect x="202" y="110" width="136" height="88" fill="var(--earth)" opacity=".25"/><rect x="250" y="130" width="40" height="40" fill="var(--sc)"/>\n   <text x="270" y="215" fill="var(--ink)" font-size="13" font-weight="700">水中 60 gw</text>\n   <text x="352" y="80" text-anchor="start" fill="var(--bad)" font-size="14" font-weight="700">浮力＝100－60＝40 gw</text><text x="352" y="105" text-anchor="start" fill="var(--ink)" font-size="13">排開水 40 g → 體積 40 cm³</text><text x="352" y="130" text-anchor="start" fill="var(--ink)" font-size="13">密度＝100÷40＝2.5 g/cm³</text></g></svg>\n   <figcaption>圖 6　秤重變輕的部分，就是浮力。</figcaption></figure>\n  <div class="cmp"><table><thead><tr><th>狀態</th><th>浮力和重量</th></tr></thead><tbody><tr><th>浮在液面</th><td>浮力＝重量</td></tr><tr><th>懸浮在液體中</th><td>浮力＝重量</td></tr><tr><th>沉到底</th><td>浮力＜重量</td></tr></tbody></table></div>`,side:[["解題步驟","① 浮力＝空氣中重－液體中重 ② 水中：浮力克數＝沒入體積 cm³ ③ 密度＝重量÷體積。"],["易錯","浮力等於「排開液體」的重量，不一定等於物體的重量。"],["易錯","陶瓷碗浮著和沉下去，浮力不一樣：浮著時浮力較大。（115 會考第 33 題）"]],ex:"m47",exNote:["浮力＝100－60＝40 gw。","在水中，40 gw 浮力代表排開 40 cm³ 的水，物體完全沒入，體積＝40 cm³。","密度＝100÷40＝2.5 g/cm³。"],pr:"pr104"}],end:["p12","p23","p33","fig29","pr105","pr107","pr109"],sumT:"三種壓力一次比較",sumH:["","公式","和什麼有關","生活例子"],summary:[["固體壓力","P＝F÷A","力、接觸面積","刀子、雪鞋"],["液體壓力","P＝h×d","深度、液體密度（不管形狀）","水壩下寬上窄"],["大氣壓力","1 atm＝76 cmHg","高度越高越小","洋芋片在山上膨脹"],["浮力","排開液體重","液體密度、沒入體積","彈簧秤在水中變輕"]]};REF[12]={intro:"描述一個東西怎麼動，要回答三個問題：<b>在哪裡？</b>（位置、位移）、<b>多快？</b>（速度）、<b>快得多快？</b>（加速度）。這一章最重要的工具是兩張圖：<b>x–t 圖和 v–t 圖</b>。它們也常常出現在力與運動、功與能的題目裡，看到圖一定要<b>先看縱軸</b>。",map:mkMap("直線運動",[["位置與位移","路徑長 vs 位移","★★"],["速率與速度","平均速率＝路徑÷時間","★★"],["x–t 圖","斜率＝速度","★★★"],["v–t 圖","斜率＝a，面積＝位移","★★★"],["自由落體","v＝gt","★★"]]),table:[["位置、路徑長與位移","★★","113-1"],["速率與速度","★★","112-18"],["x–t 圖","★★★","111-25"],["v–t 圖與加速度","★★★","111-25"],["自由落體","★★","115-46"]],cs:[{t:"路徑長與位移：走了多少 vs 差了多遠",star:"★★",main:`<p>描述位置要先選一個<b>參考點</b>（原點），再說「在原點的哪個方向、多遠」。</p>\n  <div class="cmp"><table><thead><tr><th></th><th>路徑長</th><th>位移</th></tr></thead><tbody><tr><th>意思</th><td>實際走過的長度</td><td>從<b>起點指向終點</b>的直線</td></tr><tr><th>方向</th><td>沒有</td><td><b>有</b></td></tr><tr><th>例子：向東 30 m 再向西 10 m</th><td>40 m</td><td>向東 20 m</td></tr></tbody></table></div>\n  <figure class="dg"><svg viewBox="0 0 520 170" role="img" aria-label="直線與之字形路線">${AH}\n   <g font-family="Noto Sans TC,sans-serif"><circle cx="60" cy="130" r="7" fill="var(--ink)"/><text x="60" y="158" text-anchor="middle" fill="var(--ink)" font-size="14" font-weight="700">X</text><circle cx="460" cy="130" r="7" fill="var(--ink)"/><text x="460" y="158" text-anchor="middle" fill="var(--ink)" font-size="14" font-weight="700">Y</text>\n   <line x1="66" y1="130" x2="450" y2="130" stroke="var(--earth)" stroke-width="4" marker-end="url(#ah)"/><text x="260" y="150" text-anchor="middle" fill="var(--earth-k)" font-size="13" font-weight="700">甲：直線</text>\n   <polyline points="60,130 120,40 180,120 240,40 300,120 360,40 420,120 455,128" stroke="var(--sc)" stroke-width="3.5" fill="none"/><text x="260" y="24" text-anchor="middle" fill="var(--accent)" font-size="13" font-weight="700">乙：之字形</text></g></svg>\n   <figcaption>圖 1　起點、終點一樣 → 位移相同；乙繞路 → 路徑長比較長。</figcaption></figure>`,side:[["易錯","繞操場一圈回到起點：路徑長 400 m，位移是 0。"],["判斷技巧","只要起點和終點相同，不管怎麼走，位移都一樣。（113 會考第 1 題）"]],ex:"p26",exNote:["甲、乙都從 X 到 Y → 起點、終點一樣 → 位移相同。","乙走之字形，實際走得比較多 → 乙的路徑長比較長。","所以位移甲＝乙，路徑長乙＞甲，選 B。"],pr:"pr110"},{t:"速率與速度",star:"★★",main:`<p>「速率」和「速度」聽起來一樣，但差在<b>有沒有方向</b>：</p>\n  <div class="formula"><div class="fx"><span>平均速率</span>＝<span>路徑長</span>÷<span>時間</span></div></div>\n  <div class="formula"><div class="fx"><span>平均速度</span>＝<span>位移</span>÷<span>時間</span></div></div>\n  <ol class="pts"><li>速率沒有方向；速度<b>有方向</b>。</li><li>方向改變（例如轉彎），速率可能不變，但速度一定變了。</li><li>單位換算：1 m/s＝3.6 km/h。</li></ol>\n  <p class="law"><span>平均速率不能直接平均</span>要用<em>總路徑長 ÷ 總時間</em>，不能把每一段的速率加起來除以段數。</p>\n  <p>例：前 2 秒走 10 m、後 3 秒走 20 m，平均速率＝30÷5＝<b>6 m/s</b>，不是 (5＋6.67)÷2。</p>`,side:[["易錯","400 m 賽跑每條跑道起點不同、終點相同，位移不一樣；大家路徑長都是 400 m，所以只能比平均速率。（112 會考第 18 題）"],["檢查答案","平均速率一定介於最快和最慢那段之間。"]],ex:"p18",exNote:["每個人都跑 400 m 路徑長，最先跑完 → 時間最短。","平均速率＝400÷時間 → 時間最短的平均速率最大，A 對。","各跑道起點不同，位移不一樣，平均速度不一定最大；過程中的最大值也不一定。"],pr:"m51"},{t:"x–t 圖：斜率是速度",star:"★★★",main:`<p>把位置 x 畫在縱軸、時間 t 畫在橫軸，就是 <b>x–t 圖</b>。看它的<b>斜率（傾斜程度）</b>，就知道速度。</p>\n  <figure class="dg"><svg viewBox="0 0 560 225" role="img" aria-label="x-t 圖三種形狀">\n   <g font-family="Noto Sans TC,sans-serif" text-anchor="middle">\n   ${[[30,"水平線","靜止","M0 70 H140"],[210,"斜直線","等速度","M0 130 L140 10"],[390,"曲線變陡","越來越快","M0 130 Q100 125 140 10"]].map(([t,e,a,i])=>`<g transform="translate(${t} 20)"><path d="M0 0 V140 H150" stroke="var(--ink)" stroke-width="2" fill="none"/><text x="-6" y="10" text-anchor="end" fill="var(--muted)" font-size="12">x</text><text x="150" y="156" fill="var(--muted)" font-size="12">t</text><path d="${i}" stroke="var(--sc)" stroke-width="4" fill="none"/><text x="75" y="176" fill="var(--ink)" font-size="14" font-weight="900">${e}</text><text x="75" y="194" fill="var(--accent)" font-size="13" font-weight="700">${a}</text></g>`).join("")}</g></svg>\n   <figcaption>圖 2　x–t 圖：線越陡，速度越快；水平代表停住。</figcaption></figure>\n  <p>斜直線的斜率＝<b>Δx÷Δt＝速度</b>。兩條線的<b>交點</b>代表兩人在<b>同一時間、同一位置</b>（相遇）。</p>`,side:[["易錯","x–t 圖的水平線是「靜止」；v–t 圖的水平線是「等速」。同一個形狀意思完全不同！"],["判斷技巧","x–t 圖上兩條斜直線：比斜率比快慢；比交點找相遇。"]],ex:"fig1",exNote:["x–t 圖是斜直線 → 兩人都在等速運動，C 錯。","算斜率：甲每秒 10 m、乙每秒 5 m → 甲 10 m/s、乙 5 m/s。","速度不同，B 錯；看圖 3 秒時兩人位置不同，D 錯 → A。"],pr:"m54"},{t:"v–t 圖：斜率是加速度，面積是位移",star:"★★★",main:`<p><b>加速度</b>是「速度改變得多快」：</p>\n  <div class="formula"><div class="fx"><span>a</span>＝<span>Δv</span>÷<span>Δt</span></div><div class="fl"><div><b>a</b>加速度<small>m/s²</small></div><div><b>Δv</b>速度變化<small>末速－初速</small></div></div></div>\n  <p>把速度畫在縱軸，就是 <b>v–t 圖</b>。這張圖有兩個用法：</p>\n  <figure class="dg"><svg viewBox="0 0 520 230" role="img" aria-label="v-t 圖斜率與面積">\n   <g font-family="Noto Sans TC,sans-serif"><path d="M60 20 V190 H480" stroke="var(--ink)" stroke-width="2" fill="none"/><text x="52" y="24" text-anchor="end" fill="var(--muted)" font-size="12">v (m/s)</text><text x="480" y="210" text-anchor="end" fill="var(--muted)" font-size="12">t (s)</text>\n   <path d="M60 190 L180 70 H420 V190 Z" fill="var(--sc)" opacity=".22"/><polyline points="60,190 180,70 420,70" stroke="var(--sc)" stroke-width="4" fill="none"/>\n   <text x="52" y="74" text-anchor="end" fill="var(--muted)" font-size="12">8</text><text x="180" y="206" text-anchor="middle" fill="var(--muted)" font-size="12">4</text><text x="420" y="206" text-anchor="middle" fill="var(--muted)" font-size="12">10</text>\n   <text x="70" y="44" fill="var(--bad)" font-size="13" font-weight="700">斜率＝8÷4＝2 m/s²</text>\n   <text x="300" y="140" text-anchor="middle" fill="var(--ink)" font-size="14" font-weight="700">面積＝位移</text><text x="300" y="162" text-anchor="middle" fill="var(--ink)" font-size="13">½×4×8＋6×8＝64 m</text>\n   <text x="300" y="60" text-anchor="middle" fill="var(--accent)" font-size="13" font-weight="700">水平：等速（a＝0）</text></g></svg>\n   <figcaption>圖 3　v–t 圖：看斜率得加速度，算面積得位移。</figcaption></figure>\n  <ol class="pts"><li>斜率正：加速；斜率負：減速；水平：等速。</li><li><b>面積</b>就是位移：三角形記得 ×½。</li><li>兩條線的交點只代表<b>速度相同</b>，不是相遇。</li></ol>`,side:[["易錯","v–t 圖的交點是「速度相同」，不是兩車相遇。"],["易錯","三角形面積忘了 ×½，答案會多一倍。"],["口訣","v–t 圖：斜加面位（斜率加速度，面積位移）。"]],ex:"fig0",exNote:["v–t 圖的面積＝位移。","0～4 s 是三角形：½×4×8＝16 m。","4～10 s 是長方形：6×8＝48 m。","16＋48＝64 m。"],pr:"m52"},{t:"自由落體：只受重力往下掉",star:"★★",main:`<p>物體<b>從靜止開始</b>、只受重力往下掉（不計空氣阻力），叫<b>自由落體</b>。它是一種等加速度運動，加速度就是<b>重力加速度 g ≈ 9.8 m/s²</b>（題目常取 10）。</p>\n  <div class="formula"><div class="fx"><span>v</span>＝<span>g</span>×<span>t</span></div><div class="fl"><div><b>落下距離</b>h＝½gt²<small>就是 v–t 圖的三角形面積</small></div></div></div>\n  <figure class="dg"><svg viewBox="0 0 520 230" role="img" aria-label="自由落體每秒位置">\n   <g font-family="Noto Sans TC,sans-serif">${[[0,0],[1,5],[2,20],[3,45]].map(([t,e])=>`<circle cx="120" cy="${20+e*4}" r="10" fill="var(--sc)"/><text x="145" y="${25+e*4}" fill="var(--ink)" font-size="13" font-weight="700">${t} 秒：落下 ${e} m，速度 ${t*10} m/s</text>`).join("")}\n   <line x1="120" y1="20" x2="120" y2="200" stroke="var(--muted)" stroke-dasharray="3 5"/></g></svg>\n   <figcaption>圖 4　g＝10：每過 1 秒速度多 10 m/s，間距越拉越大。</figcaption></figure>\n  <p class="law"><span>和質量無關</span>不計空氣阻力時，<em>輕的和重的一樣快</em>落地。落下的高度越高，落地時速度越快。</p>`,side:[["易錯","落下距離和時間的「平方」成正比：時間 2 倍，距離 4 倍。"],["實驗設計","想改變撞擊速度，就改變落下高度；改變水滴大小沒用，因為落下速度和質量無關。（115 會考第 46 題）"]],ex:"p66",exNote:["水滴由靜止落下，不計空氣阻力 → 自由落體。","自由落體的速度只跟落下的時間（高度）有關，和質量、密度無關。","所以要改變撞擊速度，就調整針頭高度，選 C。"],pr:"m53"}],end:["m55","fig30","pr115","pr116","pr117","pr118"],sumT:"兩種圖一次比較",sumH:["","斜率","面積","水平線代表"],summary:[["x–t 圖","速度","沒有意義","靜止"],["v–t 圖","加速度","位移","等速度"]]};REF[13]={intro:"這一章在回答一個問題：<b>力到底會讓物體怎樣？</b>答案是：力會改變物體的「運動狀態」，讓它變快、變慢或轉彎。牛頓用三個定律把這件事說清楚，再加上圓周運動和力矩，就是整章的內容。",map:`<svg viewBox="0 0 720 250" role="img" aria-label="力與運動架構圖">\n  <g font-family="Noto Sans TC,sans-serif" text-anchor="middle">\n  <rect x="285" y="12" width="150" height="44" rx="22" fill="var(--sc)"/><text x="360" y="40" fill="var(--on-sc)" font-size="18" font-weight="900">力與運動</text>\n  <path d="M360 56 V82 M110 82 H610 M110 82 V104 M285 82 V104 M455 82 V104 M610 82 V104" stroke="var(--muted)" stroke-width="2" fill="none"/>\n  <text x="110" y="126" fill="var(--ink)" font-size="16" font-weight="900">牛頓運動定律</text>\n  <text x="285" y="126" fill="var(--ink)" font-size="16" font-weight="900">重量與質量</text>\n  <text x="455" y="126" fill="var(--ink)" font-size="16" font-weight="900">圓周運動・萬有引力</text>\n  <text x="610" y="126" fill="var(--ink)" font-size="16" font-weight="900">力矩</text>\n  <path d="M110 136 V150 M40 150 H180 M40 150 V164 M110 150 V164 M180 150 V164" stroke="var(--muted)" stroke-width="1.5" fill="none"/>\n  <text x="40" y="184" fill="var(--accent)" font-size="14" font-weight="700">第一定律</text><text x="40" y="203" fill="var(--muted)" font-size="12.5">慣性</text>\n  <text x="110" y="184" fill="var(--accent)" font-size="14" font-weight="700">第二定律</text><text x="110" y="203" fill="var(--muted)" font-size="12.5">F＝ma</text>\n  <text x="180" y="184" fill="var(--accent)" font-size="14" font-weight="700">第三定律</text><text x="180" y="203" fill="var(--muted)" font-size="12.5">作用・反作用</text>\n  <text x="285" y="150" fill="var(--muted)" font-size="12.5">W＝mg</text>\n  <text x="455" y="150" fill="var(--muted)" font-size="12.5">向心力、F∝1/r²</text>\n  <text x="610" y="150" fill="var(--muted)" font-size="12.5">力×力臂</text>\n  <text x="110" y="234" fill="var(--bad)" font-size="13" font-weight="700">★★★ 每年必出</text>\n  <text x="455" y="176" fill="var(--often)" font-size="13" font-weight="700">★★</text>\n  <text x="610" y="176" fill="var(--often)" font-size="13" font-weight="700">★★</text>\n  <text x="285" y="176" fill="var(--often)" font-size="13" font-weight="700">★</text></g></svg>`,table:[["慣性（第一定律）","★★","111-36、115-41"],["F＝ma（第二定律）","★★★","111-36、112-23、114-39"],["作用力與反作用力（第三定律）","★★★","114-9、115-47"],["圓周運動與萬有引力","★★","課本基本題"],["力矩與槓桿","★★","111-33、115-22"]],cs:[{t:"慣性：沒有合力，運動就不變",star:"★★",main:`<p>先想一個問題：一顆在冰上滑的冰壺，為什麼會一直滑下去？因為<b>沒有東西去改變它的運動</b>。牛頓第一運動定律說的就是這件事：</p>\n  <p class="law"><span>牛頓第一運動定律（慣性定律）</span>物體所受的<em>合力為 0</em> 時，靜止的會<em>保持靜止</em>，運動的會<em>保持等速直線運動</em>。</p>\n  <p>物體「想保持原來運動狀態」的性質，就叫<b>慣性</b>。質量越大，慣性越大，越難讓它改變運動，所以推空的購物車很輕鬆，推裝滿的就很吃力。</p>\n  <figure class="dg"><svg viewBox="0 0 520 170" role="img" aria-label="公車煞車時乘客向前傾">${AH}\n   <g font-family="Noto Sans TC,sans-serif"><rect x="40" y="40" width="300" height="90" rx="14" fill="none" stroke="var(--ink)" stroke-width="3"/><circle cx="95" cy="138" r="16" fill="var(--ink)"/><circle cx="285" cy="138" r="16" fill="var(--ink)"/>\n   <rect x="300" y="52" width="30" height="30" rx="4" fill="var(--st)" stroke="var(--ink)" stroke-width="2"/>\n   <circle cx="205" cy="66" r="9" fill="var(--sc)"/><path d="M200 75 L188 110 M188 110 L182 128 M188 110 L196 128 M197 86 L212 96" stroke="var(--sc)" stroke-width="5" stroke-linecap="round" fill="none"/>\n   <line x1="225" y1="70" x2="262" y2="70" stroke="var(--sc)" stroke-width="4" marker-end="url(#ah)"/><text x="188" y="26" fill="var(--accent)" font-size="14" font-weight="700">身體想繼續往前</text>\n   <line x1="330" y1="150" x2="270" y2="150" stroke="var(--bad)" stroke-width="4" marker-end="url(#ah)"/><text x="350" y="155" fill="var(--bad)" font-size="13" font-weight="700">車子煞車減速</text>\n   <text x="380" y="70" fill="var(--ink)" font-size="14" font-weight="700">腳跟著車停下</text><text x="380" y="92" fill="var(--muted)" font-size="13">上半身還在往前</text><text x="380" y="112" fill="var(--muted)" font-size="13">→ 看起來向前傾</text></g></svg>\n   <figcaption>圖 1　公車煞車時，乘客向前傾就是慣性。</figcaption></figure>\n  <p>要特別注意：<b>「等速」不等於「沒受力」</b>。等速前進的車子其實有受力（引擎推力、摩擦力、空氣阻力），只是這些力<em>剛好抵消</em>，合力是 0。</p>`,side:[["生活實例","公車起動時乘客往後倒、甩乾手上的水、拍棉被灰塵掉下來，全都是慣性。"],["易錯","等速運動 ≠ 沒有受力。正確說法是「合力為 0」。（115 會考第 41 題）"],["口訣","合力零，狀態不變：靜者恆靜，動者等速直走。"]],ex:"p65",exNote:["先判斷每顆球的運動狀態：甲靜止、乙等速 → 兩顆的合力都是 0。","合力 0 → 向上外力剛好等於重量：F甲＝F乙＝W。","丙向上但越來越慢 → 加速度向下 → 合力向下 → 向上的外力比重量小：F丙＜W。","所以 F甲＝F乙＞F丙。"],pr:"pr120"},{t:"F＝ma：合力決定加速度",star:"★★★",main:`<p>如果合力<b>不是 0</b>，物體的速度就會改變。改變得多快（加速度）由兩件事決定：合力多大、物體多重。</p>\n  <div class="formula"><div class="fx"><span>F</span>＝<span>m</span>×<span>a</span></div>\n   <div class="fl"><div><b>F</b>合力<small>單位 N（牛頓）</small></div><div><b>m</b>質量<small>單位 kg</small></div><div><b>a</b>加速度<small>單位 m/s²</small></div></div></div>\n  <p>讀這個公式有兩個重點：</p>\n  <ol class="pts"><li><b>F 是「合力」</b>，不是你推的那個力。有摩擦力時要先扣掉。</li><li><b>合力的方向＝加速度的方向</b>，不一定是物體前進的方向。</li></ol>\n  <figure class="dg"><svg viewBox="0 0 520 150" role="img" aria-label="木箱受拉力與摩擦力">${AH}\n   <g font-family="Noto Sans TC,sans-serif"><line x1="30" y1="110" x2="490" y2="110" stroke="var(--muted)" stroke-width="2"/>\n   <rect x="200" y="50" width="110" height="60" rx="4" fill="var(--st)" stroke="var(--ink)" stroke-width="2.5"/><text x="255" y="86" text-anchor="middle" fill="var(--ink)" font-size="15" font-weight="700">2 kg</text>\n   <line x1="310" y1="80" x2="420" y2="80" stroke="var(--sc)" stroke-width="5" marker-end="url(#ah)"/><text x="365" y="68" text-anchor="middle" fill="var(--accent)" font-size="14" font-weight="700">拉力 12 N</text>\n   <line x1="200" y1="100" x2="130" y2="100" stroke="var(--bad)" stroke-width="5" marker-end="url(#ah)"/><text x="160" y="80" text-anchor="middle" fill="var(--bad)" font-size="14" font-weight="700">摩擦力 4 N</text>\n   <text x="255" y="140" text-anchor="middle" fill="var(--ink)" font-size="14" font-weight="700">合力＝12－4＝8 N（向右）→ a＝8÷2＝4 m/s²</text></g></svg>\n   <figcaption>圖 2　先算合力，再代 F＝ma。</figcaption></figure>\n  <p>在 v–t 圖上，<b>斜率就是加速度</b>。所以看 v–t 圖判斷受力：斜線段有合力、水平段合力為 0；斜率大小一樣，合力大小就一樣。</p>`,side:[["解題三步驟","① 畫出所有的力 ② 算合力（同向相加、反向相減）③ 代入 a＝F÷m"],["易錯","忘了扣摩擦力，直接用拉力 ÷ 質量。（會考最常見的錯法）"],["單位","1 N＝1 kg·m/s²：讓 1 kg 的物體產生 1 m/s² 加速度的力。"]],ex:"p49",exNote:["從 v–t 圖找加速度（斜率）：0～4 s 是 16÷4＝4 m/s²；4～6 s 水平，a＝0；6～10 s 是 16÷4＝4 m/s²（減速）。","t＝2 s 在第一段、t＝5 s 在水平段、t＝7 s 在第三段。","F＝ma，質量相同 → 合力大小跟著加速度大小：F₂＝F₇＝4m，F₅＝0。","所以 F₂＝F₇＞F₅。"],pr:"pr125"},{t:"作用力與反作用力：你推我，我推你",star:"★★★",main:`<p>用手推牆，手也會被牆推回來。<b>力一定成對出現</b>，這就是牛頓第三運動定律：</p>\n  <p class="law"><span>牛頓第三運動定律</span>甲施力給乙，乙同時施力給甲。這兩個力<em>大小相等、方向相反</em>，而且<em>作用在不同物體上</em>。</p>\n  <figure class="dg">${typeof FIG13!=="undefined"?FIG13:""}<figcaption>圖 3　書放在桌上：①② 是平衡力，②③ 是作用力與反作用力。</figcaption></figure>\n  <p>最容易和它搞混的是「平衡力」。判斷方法只有一個：<b>看這兩個力作用在誰身上</b>。</p>\n  <div class="cmp"><table><thead><tr><th></th><th>一對平衡力</th><th>作用力與反作用力</th></tr></thead><tbody>\n   <tr><th>作用在</th><td><b>同一個</b>物體</td><td><b>兩個不同</b>物體</td></tr>\n   <tr><th>能不能抵消</th><td>可以，合力為 0</td><td>不行，各在各的身上</td></tr>\n   <tr><th>大小</th><td>相等（物體才會平衡）</td><td><b>永遠</b>相等</td></tr>\n   <tr><th>例子</th><td>書的重力 ↓、桌子撐書 ↑</td><td>書壓桌子 ↓、桌子撐書 ↑</td></tr></tbody></table></div>`,side:[["判斷技巧","把「誰對誰施力」講出來。主角對調（書壓桌 ↔ 桌撐書）就是作用力與反作用力。"],["易錯","大卡車撞小汽車，兩車受的力一樣大。小汽車壞得比較嚴重，是因為質量小、加速度大。"],["易錯","作用力與反作用力永遠一樣大，跟物體有沒有在動無關。（114 會考第 9 題）"]],ex:"p41",exNote:["鉛筆靜止 → 鉛筆受的兩個力是一對平衡力 → F右＝F左＝1 N。","F右（手指推鉛筆）和 F右′（鉛筆推手指）主角對調，是作用力與反作用力 → 一定一樣大。","所以 F右′＝F右＝1 N。"],pr:"pr122"},{t:"圓周運動與萬有引力",star:"★★",main:`<p>用繩子綁著球甩圈圈，球的速率可以不變，但<b>方向一直在變</b>。速度有變，就代表有加速度、有合力。這個一直把球往圓心拉的力叫<b>向心力</b>，在這裡就是繩子的拉力。</p>\n  <figure class="dg"><svg viewBox="0 0 520 220" role="img" aria-label="等速率圓周運動">${AH}\n   <g font-family="Noto Sans TC,sans-serif"><circle cx="170" cy="110" r="80" fill="none" stroke="var(--muted)" stroke-width="2" stroke-dasharray="5 6"/><circle cx="170" cy="110" r="5" fill="var(--ink)"/>\n   <line x1="170" y1="110" x2="226" y2="53" stroke="var(--ink)" stroke-width="2.5"/><circle cx="227" cy="52" r="12" fill="var(--sc)" stroke="var(--ink)" stroke-width="2"/>\n   <line x1="227" y1="52" x2="300" y2="124" stroke="var(--earth)" stroke-width="4" marker-end="url(#ah)"/><text x="262" y="150" fill="var(--earth-k)" font-size="13" font-weight="700">速度（沿切線）</text>\n   <line x1="216" y1="63" x2="186" y2="94" stroke="var(--bad)" stroke-width="4" marker-end="url(#ah)"/><text x="120" y="210" fill="var(--bad)" font-size="13" font-weight="700">向心力（指向圓心）</text>\n   <line x1="304" y1="128" x2="350" y2="174" stroke="var(--muted)" stroke-width="2" stroke-dasharray="4 4"/>\n   <text x="330" y="40" fill="var(--ink)" font-size="14" font-weight="700">繩子斷掉時</text><text x="330" y="60" fill="var(--muted)" font-size="13">球沿虛線（切線）飛出</text><text x="330" y="80" fill="var(--muted)" font-size="13">不是沿半徑往外</text></g></svg>\n   <figcaption>圖 4　等速率圓周運動：速度沿切線，合力指向圓心。</figcaption></figure>\n  <p>月球繞地球、地球繞太陽也是圓周運動，提供向心力的是<b>萬有引力</b>。任何兩個有質量的物體都會互相吸引：</p>\n  <div class="formula"><div class="fx"><span>F</span> ∝ <span>m₁m₂</span> ÷ <span>r²</span></div><div class="fl"><div><b>m₁、m₂</b>兩物體質量<small>越大引力越大</small></div><div><b>r</b>兩者距離<small>距離的「平方」成反比</small></div></div></div>\n  <div class="cmp"><table><thead><tr><th>距離變成</th><td>1 倍</td><td>2 倍</td><td>3 倍</td><td>½ 倍</td></tr></thead><tbody><tr><th>引力變成</th><td>F</td><td><b>F/4</b></td><td><b>F/9</b></td><td><b>4F</b></td></tr></tbody></table></div>`,side:[["重量與質量","重量 W＝mg，是地球對物體的萬有引力。到月球重量約變 1/6，但質量不變。"],["易錯","距離變 2 倍，引力是 1/4 不是 1/2。記得「平方」。"]],ex:"m59",exNote:["等速率，但方向一直改變 → 速度有變 → 有加速度。","有加速度就一定有合力，方向指向圓心（向心力，由繩子提供）。","繩子斷了沒有向心力，球會依慣性沿切線飛出，不是沿半徑。"],pr:"pr123"},{t:"力矩：讓物體轉動的本事",star:"★★",main:`<p>開門時推離門軸越遠的地方越省力。讓物體轉動的效果，不只看力多大，還要看<b>力離轉軸多遠</b>：</p>\n  <div class="formula"><div class="fx"><span>力矩</span>＝<span>力</span>×<span>力臂</span></div><div class="fl"><div><b>力臂</b>轉軸到「力的作用線」的垂直距離<small>不是到施力點的距離</small></div></div></div>\n  <figure class="dg"><svg viewBox="0 0 520 170" role="img" aria-label="蹺蹺板力矩平衡">${AH}\n   <g font-family="Noto Sans TC,sans-serif"><path d="M260 112 L240 150 H280 Z" fill="var(--muted)"/><rect x="60" y="104" width="400" height="8" rx="3" fill="var(--ink)"/>\n   <rect x="72" y="64" width="44" height="40" rx="4" fill="var(--st)" stroke="var(--ink)" stroke-width="2"/><text x="94" y="90" text-anchor="middle" fill="var(--ink)" font-size="13" font-weight="700">30</text>\n   <rect x="412" y="74" width="36" height="30" rx="4" fill="var(--st)" stroke="var(--ink)" stroke-width="2"/><text x="430" y="94" text-anchor="middle" fill="var(--ink)" font-size="12" font-weight="700">W</text>\n   <path d="M94 128 H260 M260 128 H430" stroke="var(--sc)" stroke-width="2" marker-start="url(#ah)" marker-end="url(#ah)" fill="none"/>\n   <text x="177" y="146" text-anchor="middle" fill="var(--accent)" font-size="13" font-weight="700">2 m</text><text x="345" y="146" text-anchor="middle" fill="var(--accent)" font-size="13" font-weight="700">3 m</text>\n   <text x="260" y="40" text-anchor="middle" fill="var(--ink)" font-size="14" font-weight="700">左邊力矩＝右邊力矩：30×2＝W×3 → W＝20 kgw</text></g></svg>\n   <figcaption>圖 5　蹺蹺板平衡：順時針力矩＝逆時針力矩。</figcaption></figure>\n  <p>物體<b>轉動平衡</b>（不轉或等速轉）時，順時針力矩＝逆時針力矩。所以比較輕的人要坐得比較遠，才能和重的人平衡。</p>`,side:[["生活實例","門把裝在離門軸最遠的地方、扳手越長越好轉螺絲、剪刀剪硬東西要靠近支點。"],["易錯","力臂是到「力的作用線」的垂直距離。斜著施力時，力臂會比到施力點的距離短。"]],ex:"fig10",exNote:["蹺蹺板平衡 → 左右力矩相等。","左邊：30 kgw × 2 m＝60；右邊：W × 3 m。","60＝3W → W＝20 kgw。離支點越遠，需要的重量越小，答案一定小於 30。"],pr:"pr126"}],end:["m56","m58","pr127","pr129","m60"],sumT:"牛頓三大運動定律一次比較",sumH:["","條件","結果","生活例子"],summary:[["第一定律","合力＝0","靜止或等速直線運動","公車煞車向前傾"],["第二定律","合力≠0","產生加速度 a＝F÷m","推越重的車越難加速"],["第三定律","施力必成對","大小相等、方向相反、不同物體","手推牆、牆推手"]]};REF[14]={intro:"「功」是力讓物體移動時傳遞的能量。這一章把能量想成<b>錢包</b>：位能、動能是不同帳戶，錢可以轉來轉去，但不計摩擦時<b>總金額不變</b>（力學能守恆）。最後是讓工作變輕鬆的<b>簡單機械</b>：槓桿、滑輪、輪軸、斜面。五年約 9 題。",map:mkMap("功與能",[["功與功率","W＝F×S・P＝W÷t","★★"],["動能與位能","½mv²・mgh","★★"],["力學能守恆","位能＋動能＝定值","★★★"],["槓桿","施力×施力臂","★★"],["滑輪與斜面","省力就費距離","★★★"]]),table:[["功與功率","★★","111-27、114-41"],["動能與位能","★★","111-2、113-38"],["力學能守恆","★★★","112-19、115-46"],["槓桿原理","★★","115-22"],["滑輪、輪軸、斜面","★★★","114-47、114-48"]],cs:[{t:"功與功率：有出力、有移動才算",star:"★★",main:`<p>在物理上，<b>作功</b>要同時滿足兩件事：有施力，而且物體<b>沿著力的方向</b>移動了一段距離。</p>\n  <div class="formula"><div class="fx"><span>W</span>＝<span>F</span>×<span>S</span></div><div class="fl"><div><b>W</b>功<small>J（焦耳）＝N·m</small></div><div><b>F</b>力<small>N</small></div><div><b>S</b>沿力方向的位移<small>m</small></div></div></div>\n  <figure class="dg"><svg viewBox="0 0 560 170" role="img" aria-label="作功與不作功">${AH}\n   <g font-family="Noto Sans TC,sans-serif" text-anchor="middle">\n   <rect x="40" y="70" width="60" height="44" fill="var(--sc)" opacity=".7"/><path d="M110 92 H160" stroke="var(--bad)" stroke-width="4" marker-end="url(#ah)"/><path d="M40 130 H170" stroke="var(--ink)" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#ah)"/><text x="105" y="155" fill="var(--ok)" font-size="14" font-weight="900">推箱子前進：有作功</text>\n   <rect x="250" y="80" width="44" height="34" fill="var(--sc)" opacity=".7"/><path d="M272 76 V30" stroke="var(--bad)" stroke-width="4" marker-end="url(#ah)"/><path d="M240 130 H330" stroke="var(--ink)" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#ah)"/><text x="285" y="155" fill="var(--bad)" font-size="14" font-weight="900">提著水平走：不作功</text>\n   <rect x="430" y="60" width="20" height="80" fill="var(--muted)"/><path d="M384 100 H424" stroke="var(--bad)" stroke-width="4" marker-end="url(#ah)"/><text x="440" y="155" fill="var(--bad)" font-size="14" font-weight="900">推牆不動：不作功</text></g></svg>\n   <figcaption>圖 1　紅色是力，虛線是移動方向。力和移動垂直、或沒移動，都不作功。</figcaption></figure>\n  <p><b>功率</b>是「作功有多快」：</p>\n  <div class="formula"><div class="fx"><span>P</span>＝<span>W</span>÷<span>t</span></div><div class="fl"><div><b>P</b>功率<small>W（瓦特）＝J/s</small></div></div></div>`,side:[["易錯","提著書包水平走，手的力向上、移動是水平，兩者垂直 → 不作功。"],["生活實例","爬樓梯：W＝mgh。同一個人爬一樣高，跑上去和走上去作的功一樣，跑上去功率比較大。"]],ex:"m61",exNote:["作功的條件：有力，而且物體沿力的方向移動。","A：力向上、移動水平 → 不作功。B、D：物體沒動 → 不作功。","C：把箱子往上搬，力向上、箱子也往上移動 → 有作功。"],pr:"m62"},{t:"動能與位能",star:"★★",main:`<p>能量有很多種，這一章最重要的兩種：</p>\n  <div class="cmp"><table><thead><tr><th></th><th>動能</th><th>重力位能</th></tr></thead><tbody>\n   <tr><th>意思</th><td>運動中的物體具有的能量</td><td>在高處的物體具有的能量</td></tr>\n   <tr><th>公式</th><td><b>Ek＝½mv²</b></td><td><b>U＝mgh</b></td></tr>\n   <tr><th>和誰有關</th><td>質量、<b>速率的平方</b></td><td>質量、高度</td></tr>\n   <tr><th>變 2 倍時</th><td>速率 2 倍 → 動能 <b>4 倍</b></td><td>高度 2 倍 → 位能 2 倍</td></tr></tbody></table></div>\n  <p>除此之外還有<b>彈力位能</b>（拉長或壓縮的彈簧）、熱能、化學能、電能、光能等，能量可以互相轉換。</p>\n  <p class="law"><span>功能定理</span>對物體作多少功，物體的能量就增加多少。<em>沒有多給能量，動能就不會變多</em>。</p>`,side:[["易錯","速率變 2 倍，動能變 4 倍，不是 2 倍。所以車速快撞擊特別危險。"],["易錯","只改變質量、沒有多給能量，動能不會變 2 倍。（113 會考第 38 題）"],["生活實例","蓮霧從樹上掉下來越來越快：重力位能減少，轉成動能。（111 會考第 2 題）"]],ex:"m64",exNote:["Ek＝½mv²，動能和速率的平方成正比。","速率從 10 變 20 → 2 倍。","動能變 2²＝4 倍。"],pr:"pr132"},{t:"力學能守恆：位能和動能互換",star:"★★★",main:`<p><b>力學能＝動能＋位能</b>。如果不計摩擦和空氣阻力，物體運動時位能和動能會互相轉換，但<b>總和不變</b>。</p>\n  <figure class="dg"><svg viewBox="0 0 560 230" role="img" aria-label="單擺能量轉換">\n   <g font-family="Noto Sans TC,sans-serif" text-anchor="middle"><line x1="200" y1="20" x2="340" y2="20" stroke="var(--ink)" stroke-width="4"/>\n   <line x1="270" y1="20" x2="160" y2="120" stroke="var(--muted)" stroke-width="2"/><line x1="270" y1="20" x2="270" y2="170" stroke="var(--ink)" stroke-width="2.5"/><line x1="270" y1="20" x2="380" y2="120" stroke="var(--muted)" stroke-width="2"/>\n   <path d="M160 120 Q270 220 380 120" stroke="var(--muted)" stroke-dasharray="4 5" fill="none"/>\n   <circle cx="160" cy="120" r="14" fill="var(--sc)" opacity=".6"/><circle cx="270" cy="170" r="14" fill="var(--sc)"/><circle cx="380" cy="120" r="14" fill="var(--sc)" opacity=".6"/>\n   ${[[90,"甲（最高）",100,0],[270,"乙（最低）",0,100],[450,"丙（最高）",100,0]].map(([t,e,a,i])=>`<text x="${t}" y="${t===270?210:60}" fill="var(--ink)" font-size="14" font-weight="900">${e}</text><rect x="${t-34}" y="${t===270?216:66}" width="${a*.68}" height="8" fill="var(--earth)"/><rect x="${t-34+a*.68}" y="${t===270?216:66}" width="${i*.68}" height="8" fill="var(--bad)"/>`).join("")}\n   <rect x="440" y="160" width="14" height="8" fill="var(--earth)"/><text x="500" y="168" fill="var(--earth-k)" font-size="12" font-weight="700">位能</text><rect x="440" y="180" width="14" height="8" fill="var(--bad)"/><text x="500" y="188" fill="var(--bad)" font-size="12" font-weight="700">動能</text></g></svg>\n   <figcaption>圖 2　單擺：最高點全是位能，最低點全是動能，長條總長度不變。</figcaption></figure>\n  <ol class="pts"><li>最高點：速度 0，動能 0，<b>位能最大</b>。</li><li>最低點：<b>動能最大</b>，速度最快。</li><li>落到一半高度：位能、動能各一半。</li></ol>\n  <p>例：從 5 m 高自由落下，mgh＝½mv² → v²＝2gh＝100 → 落地速率 <b>10 m/s</b>（和質量無關）。</p>`,side:[["解題技巧","找兩個點，寫「位能＋動能＝位能＋動能」，質量通常可以約掉。"],["易錯","有摩擦時力學能會變少（變成熱能），但「總能量」仍然守恆。"]],ex:"p19",exNote:["一開始：靜止在 1.0 m 高 → 只有位能。","不計摩擦 → 力學能守恆。","到最高點動能為 0 → 位能要和一開始一樣 → 高度回到 1.0 m（會飛出 0.5 m 的軌道端點繼續往上）。"],pr:"m63"},{t:"槓桿：力矩平衡",star:"★★",main:`<p>一根可以繞著支點轉動的棒子就是<b>槓桿</b>。平衡時，兩邊的力矩相等：</p>\n  <div class="formula"><div class="fx"><span>施力</span>×<span>施力臂</span>＝<span>抗力</span>×<span>抗力臂</span></div></div>\n  <figure class="dg"><svg viewBox="0 0 520 170" role="img" aria-label="三類槓桿">\n   <g font-family="Noto Sans TC,sans-serif" text-anchor="middle" font-size="13">\n   ${[[90,"支點在中間","剪刀、蹺蹺板",0],[260,"抗力在中間","開瓶器、裁紙刀",1],[430,"施力在中間","筷子、鑷子",2]].map(([t,e,a,i])=>{const s=[t,t-60,t-60][i];return`<rect x="${t-65}" y="70" width="130" height="7" rx="3" fill="var(--ink)"/><path d="M${s} 77 l-10 20 h20 z" fill="var(--muted)"/><text x="${t}" y="125" fill="var(--ink)" font-weight="900">${e}</text><text x="${t}" y="145" fill="var(--muted)">${a}</text>`}).join("")}\n   <text x="260" y="30" fill="var(--accent)" font-size="14" font-weight="700">施力臂越長越省力；施力臂比抗力臂短就費力但省距離</text></g></svg>\n   <figcaption>圖 3　三角形是支點。看支點、抗力、施力誰在中間。</figcaption></figure>\n  <p><b>施力臂＞抗力臂 → 省力</b>（但手要移動比較遠）；<b>施力臂＜抗力臂 → 費力</b>（但省距離、動作快，例如筷子）。</p>`,side:[["口訣","省力必費距離，費力必省距離，沒有又省力又省距離的機械。"],["易錯","力臂是支點到「力的作用線」的垂直距離。"]],ex:"m65",exNote:["左邊力矩＝30×20＝600。","右邊力矩＝F×15。","600＝15F → F＝40 gw。右邊力臂比較短，所以要比 30 gw 重。"],pr:"pr139"},{t:"滑輪、輪軸與斜面",star:"★★★",main:`<div class="cmp"><table><thead><tr><th>機械</th><th>施力</th><th>拉繩距離</th><th>功能</th></tr></thead><tbody>\n   <tr><th>定滑輪</th><td>＝物重</td><td>＝物體上升距離</td><td>只<b>改變方向</b>（旗桿）</td></tr>\n   <tr><th>動滑輪</th><td>＝物重 ÷ 2</td><td>＝物體上升距離 × <b>2</b></td><td><b>省一半力</b>，費兩倍距離</td></tr>\n   <tr><th>輪軸</th><td>施力在輪上較省力</td><td>—</td><td>門把、方向盤、螺絲起子</td></tr>\n   <tr><th>斜面</th><td>斜面越長越省力</td><td>—</td><td>無障礙坡道、螺紋</td></tr></tbody></table></div>\n  <figure class="dg"><svg viewBox="0 0 520 220" role="img" aria-label="動滑輪">${AH}\n   <g font-family="Noto Sans TC,sans-serif"><line x1="100" y1="20" x2="300" y2="20" stroke="var(--ink)" stroke-width="4"/>\n   <line x1="160" y1="20" x2="160" y2="120" stroke="var(--ink)" stroke-width="2.5"/><line x1="220" y1="120" x2="220" y2="40" stroke="var(--ink)" stroke-width="2.5"/>\n   <circle cx="190" cy="120" r="30" fill="none" stroke="var(--ink)" stroke-width="3"/><line x1="190" y1="120" x2="190" y2="160" stroke="var(--ink)" stroke-width="2.5"/>\n   <rect x="160" y="160" width="60" height="40" fill="var(--sc)"/><text x="190" y="186" text-anchor="middle" fill="var(--on-sc)" font-size="14" font-weight="700">40</text>\n   <path d="M220 40 V10" stroke="var(--bad)" stroke-width="4" marker-end="url(#ah)" transform="translate(0 20)"/>\n   <text x="240" y="40" fill="var(--bad)" font-size="14" font-weight="700">拉力 20</text>\n   <text x="320" y="90" fill="var(--ink)" font-size="14" font-weight="700">兩段繩子一起撐住</text><text x="320" y="115" fill="var(--ink)" font-size="14">每段只要出一半力</text><text x="320" y="140" fill="var(--muted)" font-size="13">物體升 1 m，手拉 2 m</text><text x="320" y="165" fill="var(--muted)" font-size="13">功：20×2＝40×1，一樣</text></g></svg>\n   <figcaption>圖 4　動滑輪省力但不省功。</figcaption></figure>\n  <p class="law"><span>功的原理</span>任何機械都<em>不能省功</em>：省了力，就一定費距離。有摩擦或滑輪本身有重量時，作的功還會更多。</p>`,side:[["易錯","拉力作功要用「拉力 × 拉力移動的距離」，不是物體上升的距離。（114 會考第 47 題）"],["易錯","動滑輪本身有重量，所以沒掛砝碼也要出力，F–M 圖不會通過原點。（114 會考第 48 題）"]],ex:"p52",exNote:["拉力作的功＝拉力 × 拉力移動的距離。","彈簧秤讀數 150 gw，彈簧秤提高 10 cm。","W＝150×10＝1500 gw·cm。拉力大於 100 gw 是因為動滑輪本身也有重量。"],pr:"m66"}],end:["p0","fig8","fig32","pr135","pr136","pr138"],sumT:"本章公式一次整理",sumH:["","公式","單位","最常錯"],summary:[["功","W＝F×S","J","力和移動垂直也算功"],["功率","P＝W÷t","W","和功搞混"],["動能","Ek＝½mv²","J","速率 2 倍以為動能 2 倍"],["重力位能","U＝mgh","J","高度沒從同一基準量"],["槓桿","施力×施力臂＝抗力×抗力臂","—","力臂沒取垂直距離"],["動滑輪","F＝W÷2，拉繩 2 倍","—","作功用物體上升距離算"]]};REF[15]={intro:"用<b>水管</b>來想電路：電池像抽水馬達（<b>電壓</b>＝水位差），<b>電流</b>像水流量，<b>電阻</b>像水管變窄的地方。這一章每年都有題目，最常考<b>安培計讀數</b>（幹路＝支路相加）和<b>靜電</b>（只有電子會動）。",map:mkMap("基本電路",[["靜電","摩擦・感應・接地","★★"],["電流與電壓","安培計串、伏特計並","★★"],["電阻與歐姆定律","V＝IR","★★★"],["串聯","電流相同、電壓分配","★★"],["並聯","電壓相同、電流相加","★★★"]]),table:[["靜電、感應起電與接地","★★","113-26、114-10"],["電流、電壓與電表","★★","111-47"],["電阻與歐姆定律","★★★","課本基本題"],["串聯電路","★★","課本基本題"],["並聯電路","★★★","111-48、112-42、115-7"]],cs:[{t:"靜電：只有電子會搬家",star:"★★",main:`<p>物體本來正負電一樣多，不帶電。兩個物體<b>摩擦</b>時，電子從一邊跑到另一邊：</p>\n  <figure class="dg"><svg viewBox="0 0 520 170" role="img" aria-label="摩擦起電">${AH}\n   <g font-family="Noto Sans TC,sans-serif" text-anchor="middle"><rect x="60" y="50" width="160" height="40" rx="8" fill="var(--earth)" opacity=".3" stroke="var(--earth)" stroke-width="2"/><text x="140" y="40" fill="var(--ink)" font-size="14" font-weight="900">玻璃棒</text>\n   ${[80,110,140,170,200].map(t=>`<text x="${t}" y="76" fill="var(--bad)" font-size="18" font-weight="900">+</text>`).join("")}\n   <rect x="300" y="50" width="160" height="40" rx="8" fill="var(--sc)" opacity=".3" stroke="var(--sc)" stroke-width="2"/><text x="380" y="40" fill="var(--ink)" font-size="14" font-weight="900">絲綢</text>\n   ${[320,350,380,410,440].map(t=>`<text x="${t}" y="76" fill="var(--earth-k)" font-size="20" font-weight="900">−</text>`).join("")}\n   <path d="M225 70 H295" stroke="var(--ink)" stroke-width="3" marker-end="url(#ah)"/><text x="260" y="112" fill="var(--ink)" font-size="13" font-weight="700">電子跑過去</text>\n   <text x="140" y="140" fill="var(--bad)" font-size="14" font-weight="700">失去電子 → 帶正電</text><text x="380" y="140" fill="var(--earth-k)" font-size="14" font-weight="700">得到電子 → 帶負電</text></g></svg>\n   <figcaption>圖 1　摩擦起電：質子不會動，搬家的只有電子。</figcaption></figure>\n  <ol class="pts"><li><b>同性相斥、異性相吸</b>。電量越大、距離越近，靜電力越大。</li><li><b>感應起電</b>：帶電體靠近（不接觸）金屬，金屬裡的電子被推開或吸過來，近端帶異性電、遠端帶同性電。</li><li><b>接地</b>：電子在物體和地球之間流動，直到物體不帶電。</li></ol>`,side:[["易錯","帶正電的球接地，是電子從地球流進來，不是正電荷流出去。（113 會考第 26 題）"],["易錯","距離變近，靜電力變大。（114 會考第 10 題）"]],ex:"p37",exNote:["能移動的只有電子，質子（正電）不會動 → B 錯。","金屬球帶正電 = 缺電子。","接地後，地球的電子經由手流進球，補到不帶電為止 → A。"],pr:"m72"},{t:"電流與電壓：水流量和水位差",star:"★★",main:`<p><b>電流</b>是每秒通過導線某處的電量：I＝Q÷t，單位安培（A）。<b>電壓</b>是推動電荷流動的「推力」，單位伏特（V）。</p>\n  <div class="cmp"><table><thead><tr><th></th><th>方向</th></tr></thead><tbody><tr><th>電流（規定）</th><td>電池<b>正極</b> → 外電路 → <b>負極</b></td></tr><tr><th>電子流（真正在動的）</th><td>電池<b>負極</b> → 外電路 → <b>正極</b>（和電流相反）</td></tr></tbody></table></div>\n  <figure class="dg"><svg viewBox="0 0 520 210" role="img" aria-label="安培計串聯伏特計並聯">\n   <g font-family="Noto Sans TC,sans-serif" text-anchor="middle"><path d="M80 50 H440 V170 H80 Z" stroke="var(--ink)" stroke-width="3" fill="none"/>\n   <rect x="70" y="95" width="20" height="30" fill="var(--paper)" stroke="none"/><line x1="66" y1="100" x2="94" y2="100" stroke="var(--ink)" stroke-width="4"/><line x1="72" y1="114" x2="88" y2="114" stroke="var(--ink)" stroke-width="4"/><text x="50" y="96" fill="var(--bad)" font-size="13" font-weight="700">+</text>\n   <circle cx="200" cy="50" r="18" fill="var(--paper)" stroke="var(--ink)" stroke-width="2.5"/><text x="200" y="56" fill="var(--ink)" font-size="16" font-weight="900">A</text><text x="200" y="22" fill="var(--accent)" font-size="13" font-weight="700">安培計：串聯</text>\n   <rect x="300" y="155" width="70" height="30" fill="var(--sc)" opacity=".8" stroke="var(--ink)" stroke-width="2"/><text x="335" y="175" fill="var(--on-sc)" font-size="13" font-weight="700">燈泡</text>\n   <path d="M300 170 V120 H315 M355 120 H370 V170" stroke="var(--ink)" stroke-width="2.5" fill="none" transform="translate(0 0)"/><circle cx="335" cy="120" r="18" fill="var(--paper)" stroke="var(--ink)" stroke-width="2.5"/><text x="335" y="126" fill="var(--ink)" font-size="16" font-weight="900">V</text><text x="240" y="124" fill="var(--accent)" font-size="13" font-weight="700">伏特計：並聯</text></g></svg>\n   <figcaption>圖 2　安培計要讓電流「流過」它（串聯）；伏特計要「跨」在燈泡兩端（並聯）。</figcaption></figure>\n  <p>電表的接法：安培計和待測物<b>串聯</b>（電阻很小）；伏特計和待測物<b>並聯</b>（電阻很大）。兩者都是<b>正端接近電池正極</b>。</p>`,side:[["易錯","安培計絕對不能直接接在電池兩端，會短路燒壞。"],["記法","安培計像收費站，車要「穿過」它；伏特計像量兩個點的高度差，要「跨」在兩點上。"]],ex:"m70",exNote:["安培計要量流過燈泡的電流 → 電流要穿過它 → 和燈泡串聯。","伏特計量燈泡兩端的電壓差 → 跨在燈泡兩端 → 並聯。","所以選 C。"],pr:"m69"},{t:"電阻與歐姆定律",star:"★★★",main:`<p>導線對電流的阻礙叫<b>電阻</b>，單位歐姆（Ω）。同材質的導線：<b>越長電阻越大，越粗電阻越小</b>，溫度越高電阻通常也越大。</p>\n  <p class="law"><span>歐姆定律</span>溫度不變時，導體兩端的<em>電壓和電流成正比</em>。</p>\n  <div class="formula"><div class="fx"><span>V</span>＝<span>I</span>×<span>R</span></div><div class="fl"><div><b>V</b>電壓<small>V（伏特）</small></div><div><b>I</b>電流<small>A（安培）</small></div><div><b>R</b>電阻<small>Ω（歐姆）</small></div></div></div>\n  <figure class="dg"><svg viewBox="0 0 520 200" role="img" aria-label="V-I 圖">\n   <g font-family="Noto Sans TC,sans-serif"><path d="M70 20 V170 H470" stroke="var(--ink)" stroke-width="2" fill="none"/><text x="62" y="24" text-anchor="end" fill="var(--muted)" font-size="12">V</text><text x="470" y="190" text-anchor="end" fill="var(--muted)" font-size="12">I</text>\n   <line x1="70" y1="170" x2="300" y2="30" stroke="var(--bad)" stroke-width="4"/><text x="308" y="36" fill="var(--bad)" font-size="14" font-weight="700">甲：斜率大 → 電阻大</text>\n   <line x1="70" y1="170" x2="450" y2="90" stroke="var(--earth)" stroke-width="4"/><text x="380" y="80" fill="var(--earth-k)" font-size="14" font-weight="700">乙：電阻小</text></g></svg>\n   <figcaption>圖 3　V–I 圖是通過原點的直線，斜率＝電阻。</figcaption></figure>`,side:[["口訣","V 在上、I 和 R 在下：遮住要求的，剩下的就是算法。"],["易錯","I＝V÷R，不要除反成 R÷V。"],["判斷技巧","長度 2 倍、截面積 2 倍 → 電阻不變。"]],ex:"m71",exNote:["電阻和長度成正比、和截面積成反比。","越長、越細，電阻越大。","B 是最長（2 m）而且最細（1 mm²）→ 電阻最大。"],pr:"pr141"},{t:"串聯：一條路走到底",star:"★★",main:`<p>把電器一個接一個連成<b>一條路</b>，叫串聯。像一條水管上接好幾段窄管：</p>\n  <figure class="dg"><svg viewBox="0 0 520 170" role="img" aria-label="串聯電路">\n   <g font-family="Noto Sans TC,sans-serif" text-anchor="middle"><path d="M80 40 H440 V140 H80 Z" stroke="var(--ink)" stroke-width="3" fill="none"/>\n   <rect x="66" y="80" width="28" height="22" fill="var(--paper)"/><line x1="64" y1="84" x2="96" y2="84" stroke="var(--ink)" stroke-width="4"/><line x1="72" y1="98" x2="88" y2="98" stroke="var(--ink)" stroke-width="4"/><text x="40" y="96" fill="var(--ink)" font-size="13" font-weight="700">6 V</text>\n   <rect x="170" y="28" width="70" height="24" fill="var(--sc)" stroke="var(--ink)" stroke-width="2"/><text x="205" y="45" fill="var(--on-sc)" font-size="13" font-weight="700">2 Ω</text><text x="205" y="76" fill="var(--accent)" font-size="13" font-weight="700">2 V</text>\n   <rect x="300" y="28" width="70" height="24" fill="var(--sc)" stroke="var(--ink)" stroke-width="2"/><text x="335" y="45" fill="var(--on-sc)" font-size="13" font-weight="700">4 Ω</text><text x="335" y="76" fill="var(--accent)" font-size="13" font-weight="700">4 V</text>\n   <text x="260" y="125" fill="var(--ink)" font-size="14" font-weight="700">總電阻 6 Ω，電流處處 1 A</text></g></svg>\n   <figcaption>圖 4　串聯：電流一樣；電壓按電阻大小分配。</figcaption></figure>\n  <div class="cmp"><table><thead><tr><th>串聯規則</th><th></th></tr></thead><tbody><tr><th>電流</th><td><b>處處相等</b></td></tr><tr><th>電壓</th><td>總電壓＝各段電壓相加；電阻越大分到越多</td></tr><tr><th>總電阻</th><td>R＝R₁＋R₂（越串越大）</td></tr><tr><th>缺點</th><td>一個燈壞了，全部都不亮</td></tr></tbody></table></div>`,side:[["解題步驟","① 總電阻相加 ② 總電壓÷總電阻＝電流 ③ 每段電壓＝電流×那段電阻。"],["檢查答案","各段電壓加起來要等於電池電壓。"]],ex:"m67",exNote:["總電阻＝4＋2＝6 Ω。","電流 I＝6 V÷6 Ω＝1 A，串聯處處相同。","4 Ω 的電壓＝1×4＝4 V。"],pr:"fig6"},{t:"並聯：分岔再會合",star:"★★★",main:`<p>電路分成好幾條路，每條各接一個電器，叫<b>並聯</b>。家裡的電器都是並聯，所以一個關掉其他的照樣可以用。</p>\n  <figure class="dg"><svg viewBox="0 0 520 220" role="img" aria-label="並聯電路">${AH}\n   <g font-family="Noto Sans TC,sans-serif" text-anchor="middle"><path d="M80 40 H440 V180 H80 Z M200 40 V80 H440" stroke="var(--ink)" stroke-width="3" fill="none"/>\n   <rect x="66" y="98" width="28" height="22" fill="var(--paper)"/><line x1="64" y1="102" x2="96" y2="102" stroke="var(--ink)" stroke-width="4"/><line x1="72" y1="116" x2="88" y2="116" stroke="var(--ink)" stroke-width="4"/><text x="40" y="114" fill="var(--ink)" font-size="13" font-weight="700">6 V</text>\n   <rect x="290" y="28" width="70" height="24" fill="var(--sc)" stroke="var(--ink)" stroke-width="2"/><text x="325" y="45" fill="var(--on-sc)" font-size="13" font-weight="700">3 Ω</text><text x="400" y="30" fill="var(--accent)" font-size="13" font-weight="700">2 A</text>\n   <rect x="290" y="68" width="70" height="24" fill="var(--sc)" stroke="var(--ink)" stroke-width="2"/><text x="325" y="85" fill="var(--on-sc)" font-size="13" font-weight="700">6 Ω</text><text x="400" y="110" fill="var(--accent)" font-size="13" font-weight="700">1 A</text>\n   <circle cx="140" cy="180" r="16" fill="var(--paper)" stroke="var(--ink)" stroke-width="2.5"/><text x="140" y="186" fill="var(--ink)" font-size="14" font-weight="900">A</text>\n   <text x="140" y="214" fill="var(--bad)" font-size="14" font-weight="700">幹路：2＋1＝3 A</text><text x="320" y="150" fill="var(--ink)" font-size="13">兩條支路的電壓都是 6 V</text></g></svg>\n   <figcaption>圖 5　並聯：電壓一樣；幹路電流＝各支路電流相加。</figcaption></figure>\n  <div class="cmp"><table><thead><tr><th>並聯規則</th><th></th></tr></thead><tbody><tr><th>電壓</th><td><b>每條支路都等於電池電壓</b></td></tr><tr><th>電流</th><td><b>幹路電流＝各支路電流相加</b>；電阻小的支路電流大</td></tr><tr><th>總電阻</th><td>1/R＝1/R₁＋1/R₂（越並越小，比最小的還小）</td></tr></tbody></table></div>`,side:[["易錯","幹路電流一定比任何一條支路大。（111 會考第 48 題）"],["易錯","流出和流回電池的幹路電流一樣大，電流不會被「用掉」。（115 會考第 7 題）"],["解題技巧","兩個電阻並聯：總電阻＝相乘÷相加。"]],ex:"p14",exNote:["乙在幹路，量到的是丙＋丁兩條支路的電流和。","甲只和丙串聯，只量到丙那條。","幹路一定比支路大 → I乙＞I甲，小玉的紀錄不合理，選 D。"],pr:"fig7"}],end:["p42","p55","fig33","m68","pr146","pr147","pr149"],sumT:"串聯和並聯一次比較",sumH:["","電流","電壓","總電阻"],summary:[["串聯","處處相等","各段相加＝總電壓","R₁＋R₂（變大）"],["並聯","各支路相加＝幹路","各支路都相等","1/R＝1/R₁＋1/R₂（變小）"]]};REF[16]={intro:"電到家裡之後，會變成熱、光、動能，還要付電費。這一章把電路用到生活：<b>電功率與電費</b>、<b>用電安全</b>，再加上電和化學反應的關係：<b>電池</b>（化學能變電能）和<b>電解、電鍍</b>（電能變化學能）。五年約 9 題。",map:mkMap("電與生活",[["電功率","P＝IV","★★"],["電能與電費","1 度＝1 kWh","★★★"],["熱效應與用電安全","短路・超載・保險絲","★★"],["電池","活性大的當負極","★★"],["電解與電鍍","被鍍物接負極","★★"]]),table:[["電功率","★★","112-34"],["電能與電費","★★★","114-42"],["電流熱效應與用電安全","★★","113-6、113-46、115-28"],["化學電池","★★","111-30、114-25"],["電解與電鍍","★★","111-30、113-40、115-31"]],cs:[{t:"電功率：每秒用多少電能",star:"★★",main:`<p>電器上的標示「110 V、1100 W」意思是：接在 110 V 的電壓下，每秒消耗 1100 焦耳的電能。<b>每秒消耗的電能</b>就是<b>電功率</b>。</p>\n  <div class="formula"><div class="fx"><span>P</span>＝<span>I</span>×<span>V</span></div><div class="fl"><div><b>P</b>電功率<small>W（瓦特）</small></div><div><b>I</b>電流<small>A</small></div><div><b>V</b>電壓<small>V</small></div></div></div>\n  <p>搭配歐姆定律 V＝IR，還可以變形成：</p>\n  <div class="cmp"><table><thead><tr><th>公式</th><th>什麼時候用</th></tr></thead><tbody><tr><th>P＝IV</th><td>知道電流和電壓</td></tr><tr><th>P＝I²R</th><td><b>串聯</b>（電流相同）比較誰比較熱、比較亮</td></tr><tr><th>P＝V²÷R</th><td><b>並聯</b>（電壓相同）比較；或從標示求電阻</td></tr></tbody></table></div>`,side:[["解題步驟","看到標示「V、W」：電流 I＝P÷V，電阻 R＝V÷I（或 V²÷P）。"],["判斷技巧","串聯時電阻大的比較亮；並聯時電阻小的比較亮。"]],ex:"m73",exNote:["P＝I×V → I＝P÷V。","1100÷110＝10 A。","順便可求電阻：R＝110÷10＝11 Ω。"],pr:"pr151"},{t:"電能與電費：度＝千瓦小時",star:"★★★",main:`<div class="formula"><div class="fx"><span>E</span>＝<span>P</span>×<span>t</span></div><div class="fl"><div><b>W × 秒</b>→ 焦耳（J）<small>物理計算用</small></div><div><b>kW × 小時</b>→ 度（kWh）<small>電費用</small></div></div></div>\n  <p class="law"><span>1 度電</span>＝1 kWh＝功率 1 kW 的電器用 1 小時＝<em>3.6×10⁶ J</em></p>\n  <figure class="dg"><svg viewBox="0 0 560 130" role="img" aria-label="電費三步驟">${AH}\n   <g font-family="Noto Sans TC,sans-serif" text-anchor="middle">\n   ${[["① 換成 kW","2000 W → 2 kW",90],["② 算度數","2×5 h×30 天＝300 度",280],["③ 算電費","300×3 元＝900 元",470]].map(([t,e,a])=>`<text x="${a}" y="50" fill="var(--accent)" font-size="15" font-weight="900">${t}</text><text x="${a}" y="78" fill="var(--ink)" font-size="13">${e}</text>`).join("")}\n   <path d="M160 60 H200" stroke="var(--muted)" stroke-width="3" marker-end="url(#ah)"/><path d="M370 60 H405" stroke="var(--muted)" stroke-width="3" marker-end="url(#ah)"/>\n   <text x="280" y="116" fill="var(--muted)" font-size="13">例：2000 W 冷氣，每天 5 小時，30 天，每度 3 元</text></g></svg>\n   <figcaption>圖 1　電費三步驟：先換 kW、再乘小時、最後乘單價。</figcaption></figure>`,side:[["易錯","題目已經給 kWh，那就直接是度數，不用再乘功率。（114 會考第 42 題）"],["易錯","算焦耳時時間要用「秒」：1 分鐘＝60 秒。（112 會考第 34 題）"],["易錯","1000 W 用 2 小時是 2 度，不是 2000 度。"]],ex:"p24",exNote:["E＝P×t，要得到焦耳，時間用秒。","1 分鐘＝60 秒。","1200 W×60 s＝72000 J。"],pr:"m74"},{t:"電流熱效應與用電安全",star:"★★",main:`<p>電流通過導體會發熱，這是<b>電流的熱效應</b>，電鍋、吹風機、電暖器都靠它。</p>\n  <div class="formula"><div class="fx"><span>H</span>＝<span>I²</span>×<span>R</span>×<span>t</span></div><div class="fl"><div><b>焦耳定律</b>電流越大、電阻越大、時間越久，發熱越多<small>電流是「平方」，影響最大</small></div></div></div>\n  <div class="cmp"><table><thead><tr><th>危險</th><th>原因</th><th>結果</th></tr></thead><tbody>\n   <tr><th>短路</th><td>電流沒經過電器，直接從一條線流到另一條（電阻幾乎是 0）</td><td>電流超大 → 電線過熱走火</td></tr>\n   <tr><th>超載</th><td>同一條線上並聯太多電器，總電流太大</td><td>電線過熱</td></tr></tbody></table></div>\n  <p><b>保險絲</b>（熔點低）或<b>無熔絲開關</b>要<b>串聯</b>在電路中，電流太大時熔斷或跳開，切斷電路。家裡的電器都是<b>並聯</b>，每個都拿到 110 V，也能分別開關。</p>`,side:[["易錯","延長線「超載」是流經延長線的總電流太大，不是電器本身。（115 會考第 28 題）"],["易錯","保險絲不能用銅線代替：銅熔點太高，電流過大也不會斷。"],["生活實例","兩條裸露電線纏在一起就是短路。（113 會考第 6 題）"]],ex:"p29",exNote:["兩條銅線互相接觸 → 電流不經過電扇，直接從一條線跑到另一條。","這條路幾乎沒有電阻 → 電流極大，這就是短路。","H＝I²Rt，電流很大 → 電線發熱，可能走火 → C。"],pr:"pr159"},{t:"化學電池：化學能變電能",star:"★★",main:`<p>利用氧化還原反應，讓電子沿著導線流動，就是<b>化學電池</b>。最經典的是<b>鋅銅電池</b>：</p>\n  <figure class="dg"><svg viewBox="0 0 560 230" role="img" aria-label="鋅銅電池">${AH}\n   <g font-family="Noto Sans TC,sans-serif" text-anchor="middle">\n   <path d="M60 90 V200 H220 V90" stroke="var(--ink)" stroke-width="2.5" fill="none"/><rect x="62" y="110" width="156" height="88" fill="var(--muted)" opacity=".2"/>\n   <path d="M340 90 V200 H500 V90" stroke="var(--ink)" stroke-width="2.5" fill="none"/><rect x="342" y="110" width="156" height="88" fill="var(--earth)" opacity=".3"/>\n   <path d="M180 120 V75 H380 V120" stroke="var(--muted)" stroke-width="14" fill="none" opacity=".5"/><text x="280" y="66" fill="var(--muted)" font-size="12">鹽橋（讓離子移動）</text>\n   <rect x="100" y="40" width="20" height="140" fill="var(--muted)"/><text x="110" y="222" fill="var(--ink)" font-size="13" font-weight="700">鋅（負極）</text>\n   <rect x="440" y="40" width="20" height="140" fill="var(--bad)" opacity=".75"/><text x="450" y="222" fill="var(--ink)" font-size="13" font-weight="700">銅（正極）</text>\n   <path d="M110 40 V18 H450 V40" stroke="var(--ink)" stroke-width="2.5" fill="none"/><path d="M200 18 H330" stroke="var(--sc)" stroke-width="3" marker-end="url(#ah)"/><text x="265" y="12" fill="var(--accent)" font-size="12" font-weight="700">電子 鋅 → 銅</text>\n   <text x="140" y="160" fill="var(--ink)" font-size="12" font-weight="700">Zn → Zn²⁺＋2e⁻</text><text x="140" y="178" fill="var(--bad)" font-size="12">被氧化、變輕</text>\n   <text x="400" y="160" fill="var(--ink)" font-size="12" font-weight="700">Cu²⁺＋2e⁻ → Cu</text><text x="400" y="178" fill="var(--earth-k)" font-size="12">被還原、變重</text></g></svg>\n   <figcaption>圖 2　鋅銅電池：活性大的鋅當負極，被氧化溶掉。</figcaption></figure>\n  <p class="law"><span>電池的正負極</span>活性大的金屬當<em>負極</em>，自己<em>被氧化</em>、放出電子；電子經導線流到正極。</p>`,side:[["易錯","鹽橋讓「離子」移動，不是讓電子通過。電子只走導線。"],["記法","負極：活性大、被氧化、變輕；正極：析出金屬、變重。"]],ex:"m77",exNote:["鋅活性比銅大 → 鋅是負極，A 錯。","鋅極：Zn → Zn²⁺＋2e⁻，被氧化、質量減少 → B 對。","電子從鋅經導線流向銅，C 錯；鹽橋讓離子移動，D 錯。"],pr:"pr158"},{t:"電解與電鍍：電能變化學能",star:"★★",main:`<p>電池反過來用：用外加的電讓不會自己發生的反應發生，叫<b>電解</b>。</p>\n  <div class="cmp"><table><thead><tr><th></th><th>負極（接電池負極）</th><th>正極（接電池正極）</th></tr></thead><tbody>\n   <tr><th>電解水</th><td>產生<b>氫氣</b></td><td>產生<b>氧氣</b>（體積 H₂：O₂＝2：1）</td></tr>\n   <tr><th>電鍍銅</th><td>接<b>被鍍物</b>（湯匙）：銅析出鍍上去</td><td>接<b>鍍的金屬</b>（銅片）：銅溶出補充</td></tr></tbody></table></div>\n  <figure class="dg"><svg viewBox="0 0 520 210" role="img" aria-label="電鍍裝置">\n   <g font-family="Noto Sans TC,sans-serif" text-anchor="middle"><path d="M120 70 V190 H400 V70" stroke="var(--ink)" stroke-width="2.5" fill="none"/><rect x="122" y="90" width="276" height="98" fill="var(--earth)" opacity=".3"/>\n   <rect x="170" y="50" width="20" height="120" fill="var(--bad)" opacity=".75"/><text x="180" y="40" fill="var(--bad)" font-size="13" font-weight="700">銅片（正極）</text>\n   <path d="M340 50 V150 Q340 170 325 170 Q310 170 310 150" stroke="var(--muted)" stroke-width="10" fill="none"/><text x="340" y="40" fill="var(--ink)" font-size="13" font-weight="700">湯匙（負極）</text>\n   <text x="260" y="140" fill="var(--earth-k)" font-size="13" font-weight="700">硫酸銅溶液</text><text x="260" y="160" fill="var(--earth-k)" font-size="12">Cu²⁺ → 往負極</text>\n   <line x1="180" y1="50" x2="180" y2="20" stroke="var(--ink)" stroke-width="2"/><line x1="340" y1="50" x2="340" y2="20" stroke="var(--ink)" stroke-width="2"/><line x1="180" y1="20" x2="240" y2="20" stroke="var(--ink)" stroke-width="2"/><line x1="280" y1="20" x2="340" y2="20" stroke="var(--ink)" stroke-width="2"/>\n   <line x1="244" y1="8" x2="244" y2="32" stroke="var(--ink)" stroke-width="4"/><line x1="256" y1="13" x2="256" y2="27" stroke="var(--ink)" stroke-width="4"/></g></svg>\n   <figcaption>圖 3　鍍銅：湯匙接負極，銅片接正極，溶液要含銅離子。</figcaption></figure>`,side:[["口訣","負氫正氧（電解水）；被鍍物接負極（電鍍）。"],["易錯","電鍍液要含「鍍上去的那種金屬」的離子：鍍銅用硫酸銅，鍍銀用硝酸銀。"]],ex:"m79",exNote:["被鍍物（湯匙）要接負極，因為金屬離子要在負極得到電子才會析出。","鍍上去的金屬（銅片）接正極，溶出 Cu²⁺ 補充。","電鍍液要含 Cu²⁺ → 硫酸銅，選 B。"],pr:"m78"}],end:["p51","p61","fig34","m75","m76","pr155","pr157"],sumT:"電池和電鍍一次比較",sumH:["","能量轉換","負極","正極"],summary:[["化學電池","化學能 → 電能","活性大的金屬，被氧化、變輕","析出金屬、變重"],["電解水","電能 → 化學能","產生氫氣","產生氧氣"],["電鍍","電能 → 化學能","被鍍物，金屬析出","鍍的金屬，溶解"]]};REF[17]={intro:"電和磁是一家人：<b>電流會產生磁場</b>（電流磁效應），<b>磁場變化會產生電流</b>（電磁感應）。馬達和發電機就是這兩件事的應用。每年固定 1 題，一定要會用手操作：<b>安培右手定則</b>和<b>冷次定律</b>。",map:mkMap("電與磁",[["磁鐵與磁場","N 出 S 進","★"],["電流磁效應","安培右手定則","★★★"],["電磁鐵與馬達","電 → 動","★★"],["電磁感應","磁場變化才有電","★★★"],["冷次定律與發電機","反抗變化","★★"]]),table:[["磁鐵與磁場","★","課本基本題"],["電流磁效應","★★★","111-16、114-31、115-35"],["電磁鐵與電動機","★★","112-37"],["電磁感應","★★★","113-13"],["冷次定律與發電機","★★","113-13"]],cs:[{t:"磁鐵與磁場：N 出 S 進",star:"★",main:`<p>磁鐵有 <b>N 極和 S 極</b>，同極相斥、異極相吸。磁鐵周圍會影響磁針的空間叫<b>磁場</b>，用<b>磁力線</b>來畫：</p>\n  <figure class="dg"><svg viewBox="0 0 520 200" role="img" aria-label="磁棒磁力線">${AH}\n   <g font-family="Noto Sans TC,sans-serif" text-anchor="middle">\n   ${[30,55,80].map(t=>`<path d="M320 100 C${340+t} ${100-t*1.3} ${180-t} ${100-t*1.3} 200 100" stroke="var(--muted)" stroke-width="2" fill="none"/><path d="M320 100 C${340+t} ${100+t*1.3} ${180-t} ${100+t*1.3} 200 100" stroke="var(--muted)" stroke-width="2" fill="none"/><path d="M268 ${100-t*.975} H252" stroke="var(--muted)" stroke-width="2" marker-end="url(#ah)"/><path d="M268 ${100+t*.975} H252" stroke="var(--muted)" stroke-width="2" marker-end="url(#ah)"/>`).join("")}\n   <rect x="200" y="86" width="60" height="28" fill="var(--earth)"
