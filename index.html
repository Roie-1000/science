速度、自由落體",lv:"must",hard:true,yr:[2,1,1,0,1],alert:"高頻考點「直線運動圖表」。題目常常把 v–t 圖放在力與運動或功與能的題目裡一起考，看到圖先看縱軸。",keys:["路徑長：實際走過的長度（沒有方向）；位移：起點指向終點（有方向）。","平均速率＝路徑長÷時間；平均速度＝位移÷時間。","x–t 圖：斜率＝速度。水平線＝靜止；斜直線＝等速；曲線＝變速。","v–t 圖：斜率＝加速度；線下面積＝位移。水平線＝等速；斜直線＝等加速度。","加速度 a＝(v−v₀)÷t，單位 m/s²。","等加速度公式：v＝v₀＋at；s＝v₀t＋½at²；也可用 v–t 圖面積算。","自由落體：初速 0、加速度 g≈9.8 m/s²，落下快慢與質量無關（不計空氣阻力）。末速只和落下高度有關。","速度為負代表往反方向運動；加速度和速度反向時物體減速。"],plain:`<h3>看圖先看「縱軸是誰」</h3><div class="fig">\n<figure><svg viewBox="0 0 300 190" role="img" aria-label="x-t 圖"><path class="ax" d="M36 160 H285 M36 160 V15"/><path class="ln" d="M36 160 L270 40"/><path class="ln2" d="M36 110 L270 110"/><path class="ln3" d="M36 160 Q160 155 270 30"/><text x="252" y="178">t</text><text x="10" y="22">x</text><text x="196" y="66">等速</text><text x="214" y="104">靜止</text><text x="196" y="140">越來越快</text></svg><figcaption>x–t 圖：斜率＝速度</figcaption></figure>\n<figure><svg viewBox="0 0 300 190" role="img" aria-label="v-t 圖"><path class="area" d="M36 160 L200 60 L200 160 Z"/><path class="ax" d="M36 160 H285 M36 160 V15"/><path class="ln" d="M36 160 L200 60 L270 60"/><text x="252" y="178">t</text><text x="10" y="22">v</text><text x="70" y="98">斜率＝加速度</text><text x="110" y="148">面積＝位移</text><text x="215" y="52">等速</text></svg><figcaption>v–t 圖：斜率＝加速度，面積＝位移</figcaption></figure></div>\n<p>同一個形狀，在兩種圖上意思完全不同：x–t 圖的水平線是「停住」，v–t 圖的水平線是「等速前進」。</p>\n<h3>v–t 圖兩條線相交 ≠ 相遇</h3><p>交點只代表那一刻速度一樣。兩車同時同地出發，交點之前快的那台一直領先，距離越拉越大；要看面積相等時才是追上。</p>\n<div class="ex">例：靜止開始 4 秒加速到 20 m/s → 加速度 5 m/s²；位移＝三角形面積＝½×4×20＝40 m。</div>`,traps:["平均速率不是把各段速率加起來平均，要用總路徑÷總時間。","繞跑道跑步，大家路徑長相同但位移不同，只有平均速率能比（112 會考第 18 題）。","直線和之字形起終點相同，位移相同、路徑長不同（113 會考第 1 題）。","v–t 圖交點是速度相同，不是相遇（111 會考第 25 題）。","自由落體末速由高度決定，改變水滴大小不會改變撞擊速度（115 會考第 46 題）。"],seen:["111-12 斜面實驗變因","111-25 四車 v–t 圖","112-18 400 m 賽跑","113-1 位移與路徑長","115-46 水滴落下"]},{id:13,book:"國三上",name:"力與運動",topics:"慣性、F＝ma、作用力與反作用力、圓周運動與萬有引力、力矩",lv:"often",hard:true,yr:[2,1,0,2,2],alert:"每年 1～2 題。分清楚「平衡力」與「作用力反作用力」，以及「等速＝合力為 0」。",keys:["第一運動定律（慣性）：合力為 0 時，靜止的保持靜止，運動的做等速直線運動。質量越大慣性越大。","第二運動定律：F＝ma，F 是「合力」，合力方向＝加速度方向。1 N＝1 kg·m/s²。","第三運動定律：作用力與反作用力大小相等、方向相反、作用在「兩個不同物體」上、同時出現同時消失。","重量 W＝mg；質量不隨地點改變，重量會。","等速率圓周運動：速度方向一直在變，有指向圓心的加速度，需要向心力。繩子斷掉沿切線飛出。","萬有引力 F ∝ m₁m₂÷r²：距離 2 倍，引力變 1/4。","力矩＝力×力臂（轉軸到力的作用線的垂直距離）；順時針力矩＝逆時針力矩時轉動平衡。"],plain:`<h3>合力決定的是「加速度」，不是「往哪裡跑」</h3><p>球往上飛但越來越慢，代表加速度向下、合力向下。等速上升代表合力 0，所以向上的拉力剛好等於重量。</p>\n<h3>平衡力 vs. 作用力與反作用力</h3><div class="scroll"><table><thead><tr><th></th><th>一對平衡力</th><th>作用力與反作用力</th></tr></thead><tbody>\n<tr><td>作用在</td><td>同一個物體</td><td>兩個不同物體</td></tr>\n<tr><td>能否抵消</td><td>可以（合力為 0）</td><td>不能（在不同物體上）</td></tr>\n<tr><td>例子</td><td>書的重力 vs. 桌面撐書的力</td><td>書壓桌子 vs. 桌子撐書</td></tr></tbody></table></div>`,traps:["等速運動是合力為 0，不是沒有受力（115 會考第 41 題）。","作用力與反作用力永遠一樣大，不管物體有沒有動（114 會考第 9 題）。","v–t 圖斜率大小相同 → 加速度相同 → 合力相同（114 會考第 39 題）。","F＝ma 的 F 要扣掉摩擦力，用合力計算。"],seen:["111-33 力矩比較","111-36 F＝ma 與摩擦","112-23 v–t 圖受力","114-9 鉛筆兩端受力","114-39 合力大小","115-22 槓桿論點","115-41 三球外力","115-47 水滴反作用力"]},{id:14,book:"國三上",name:"功與能",topics:"功與功率、動能與位能、力學能守恆、槓桿、滑輪、輪軸與斜面",lv:"must",hard:true,yr:[2,1,1,3,2],alert:"高頻考點「力學能守恆」。五年約 9 題，能量轉換、動滑輪作功、槓桿原理都出現過。",keys:["功 W＝F×S（力和移動方向相同的部分）。力與移動方向垂直不作功（提著東西水平走）；沒有移動也不作功。","1 J（焦耳）＝1 N×1 m。","功率 P＝W÷t，單位 W（瓦特）＝J/s。","動能 Ek＝½mv²：速率 2 倍，動能 4 倍。","重力位能 U＝mgh（以某高度為基準）。","外力對物體作的功＝物體動能的變化。","力學能＝動能＋位能。只有重力作功（不計摩擦與空氣阻力）時，力學能守恆。","槓桿原理：施力×施力臂＝抗力×抗力臂。","定滑輪：不省力，只改變施力方向。動滑輪：省一半力、費兩倍距離。","輪軸、斜面：省力但費距離。任何簡單機械都不能省功。"],plain:`<h3>把能量想成錢包</h3><p>從高處放下球，一開始錢都存在「位能」帳戶。往下掉時，位能帳戶的錢一點一點轉到「動能」帳戶。<b>不計摩擦時總金額不變</b>，所以掉到一半高度時，位能和動能各一半。</p>\n<div class="ex">例：從 10 m 高靜止放下（g＝10），落到 5 m 時：減少的位能 m×10×5＝增加的動能 ½mv² → v＝10 m/s。<br>半圓軌道題：沒有摩擦時，球會回到出發時的同一高度（112 會考第 19 題）。</div>\n<h3>作功只看「力」和「力的方向上走了多遠」</h3><p>動滑輪題：拉力作的功＝拉力×繩子被拉的距離，不是砝碼上升的距離。拉 150 gw、拉了 10 cm，就是 1500 gw·cm。</p>`,traps:["拉力作功用拉力移動的距離（114 會考第 47 題）。","動滑輪本身有重量，所以不掛砝碼也要拉力，F–M 圖不過原點（114 會考第 48 題）。","只改變質量、不多給能量，動能不會變 2 倍（113 會考第 38 題）。","落下過程是「重力位能」減少轉成動能（111 會考第 2 題）。","提著物體水平走，力向上、位移水平，不作功。"],seen:["111-2 蓮霧落下","111-27 發電碳排","112-19 半圓軌道","113-38 動能變 2 倍","114-41 液化氫能量","114-47 動滑輪作功","114-48 F–M 圖","115-22 槓桿","115-46 自由落體"]},{id:15,book:"國三上",name:"基本電路",topics:"靜電與感應起電、電流與電子流、電壓與電阻、歐姆定律、串聯與並聯",lv:"must",hard:true,yr:[2,1,1,1,1],alert:"高頻考點「電路」與易錯觀念「歐姆定律」。每年都有安培計讀數或靜電的題目，串並聯規則要背熟。",keys:["摩擦起電：電子轉移，失去電子帶正電、得到電子帶負電。質子不會移動。","同性電相斥、異性電相吸；電量越大、距離越近，靜電力越大。","感應起電、接地：只有電子會在物體與地球之間流動。","電流方向：正極 → 外電路 → 負極；電子流方向相反。","電流 I（安培 A）＝電量÷時間；電壓 V（伏特 V）；電阻 R（歐姆 Ω）。","電阻與導線長度成正比、與截面積成反比，也和材質、溫度有關。","歐姆定律：V＝I×R（電阻不變時電壓與電流成正比）。","串聯：電流處處相同；總電壓＝各電壓相加；總電阻 R＝R₁＋R₂。一個斷掉全部不通。","並聯：各支路電壓相同；總電流＝各支路電流相加；1/R＝1/R₁＋1/R₂（越並越小）。","安培計要串聯，伏特計要並聯。"],plain:`<h3>用水管想電路</h3><p>電池像抽水馬達（電壓＝水位差），電流像水流量，電阻像水管變窄的地方。<b>串聯</b>是一條水管上連續好幾段窄管，水流量處處一樣；<b>並聯</b>是水管分岔，總水量＝各分岔水量加起來。</p>\n<div class="ex">串聯：4 Ω＋2 Ω 接 6 V → 總電阻 6 Ω → 電流 1 A → 4 Ω 分到 4 V、2 Ω 分到 2 V。<br>並聯：3 Ω 和 6 Ω 接 6 V → 各支路都是 6 V → 2 A＋1 A＝總電流 3 A。</div>\n<h3>安培計讀數題</h3><p>先找哪一個安培計在「幹路」（電池出來、還沒分岔或已經合流的地方），幹路的電流最大，等於所有支路的和；同一條幹路上的安培計讀數相同。</p>`,traps:["幹路電流＝各支路電流相加（111 會考第 48 題、115 會考第 7 題）。","接地時是電子從地球流向帶正電的物體（113 會考第 26 題）。","並聯的電阻越多，總電阻越小、總電流越大。","距離變近，靜電力變大（114 會考第 10 題）。"],seen:["111-47 依電路圖接線","111-48 安培計讀數","112-42 並聯燈泡接法","113-26 感應起電接地","114-10 靜電力","115-7 毫安培計"]},{id:16,book:"國三下",name:"電與生活",topics:"電能與電功率、焦耳定律、家庭用電安全、各種電池、電解與電鍍",lv:"must",hard:false,yr:[1,1,3,2,2],alert:"五年約 9 題。電費計算（度＝kWh）、短路與超載、電鍍正負極、鋅銅電池哪一極被氧化，是穩定考點。",keys:["電能 E＝P×t。用 W 和秒算得到 J；用 kW 和小時算得到 kWh。","1 度電＝1 kWh＝3.6×10⁶ J。電費＝度數×每度價格。","電功率 P＝I×V＝I²R＝V²÷R。","焦耳定律（電流熱效應）：H＝I²Rt，電熱水壺、吹風機、保險絲都利用它。","家庭電路：110 V（大功率電器 220 V），電器之間並聯。","保險絲與無熔絲開關裝在火線上，電流過大時切斷電路。","短路：電流沒經過電器直接回到電源，電阻極小、電流極大，會發熱起火。超載：同時用太多電器，總電流太大。","電池：化學能 → 電能。鋅銅電池：鋅（活性大）是負極，Zn → Zn²⁺＋2e⁻ 被氧化；銅是正極，Cu²⁺＋2e⁻ → Cu。鹽橋讓離子流動平衡電荷。","乾電池：鋅殼負極、碳棒正極，約 1.5 V；鉛蓄電池可以充電重複使用。","電解：電能 → 化學能。電解水：負極 H₂、正極 O₂，體積比 2：1。","電鍍：被鍍物接負極、要鍍上去的金屬接正極，電鍍液含該金屬離子。"],plain:`<h3>電費三步驟</h3><div class="ex">冷氣 2000 W，每天 5 小時，30 天，每度 3 元：<br>① 換成 kW：2 kW　② 度數＝2×5×30＝300 度　③ 電費＝300×3＝900 元</div>\n<h3>電池與電鍍的正負極，一句話分清楚</h3><p><b>電池：活性大的當負極，自己被氧化放出電子。</b><br><b>電鍍：想被鍍的東西接負極</b>，因為金屬離子（帶正電）會往負極跑，在那裡得到電子變回金屬，鍍上去。</p>`,traps:["電能已經給 kWh 時就直接是度數，不用再乘功率（114 會考第 42 題）。","E＝P×t 要用秒才得到 J（112 會考第 34 題）。","延長線超載是「流經延長線」的電流太大（115 會考第 28 題）。","被鍍物接負極、Cu²⁺ 往負極移動（113 會考第 40 題、115 會考第 31 題）。","兩條裸線直接接觸會短路（113 會考第 6 題）。"],seen:["111-30 鍍銅與鋅銅電池","112-34 電火鍋電能","113-6 電線短路","113-40 電鍍裝置","113-46 住宅用電","114-25 鋅銅電池電極面積","114-42 單車發電電費","115-28 延長線超載","115-31 鍍銅"]},{id:17,book:"國三下",name:"電與磁",topics:"磁鐵與磁場、電流磁效應（安培右手定則）、電磁鐵與馬達、電磁感應（冷次定律）與發電機",lv:"must",hard:true,yr:[1,1,1,1,1],alert:"高頻考點「電磁現象」，每年固定 1 題。安培右手定則判斷磁針偏轉方向，以及冷次定律判斷感應電流，一定要會操作。",keys:["磁鐵有 N、S 極，同極相斥、異極相吸。磁力線在磁鐵外由 N 出、S 進，越密磁場越強，不會相交。","地磁：地理北極附近是地磁的 S 極，所以磁針 N 極指北。","電流磁效應：載流直導線周圍的磁場是同心圓。安培右手定則：大拇指指電流方向，四指彎曲方向就是磁場方向。","導線上方與下方的磁場方向相反。","螺線管：四指沿電流繞的方向，大拇指指的是 N 極。","電磁鐵增強方法：增加線圈圈數、增加電流、加入鐵心。","載流導線在磁場中受力（右手開掌定則：拇指電流、四指磁場、掌心推出的方向就是受力方向）。馬達：電能 → 動能。","電磁感應：線圈內的磁場「發生變化」才會產生感應電流；變化越快、圈數越多，電流越大。","冷次定律：感應電流產生的磁場會「反抗」原本磁場的變化。","發電機：轉動線圈切割磁場，動能 → 電能。"],plain:`<h3>右手定則操作：導線南北向、電流向北</h3><p>右手拇指朝北握住導線，四指在導線<b>上方往東</b>繞、在導線<b>下方往西</b>繞。所以磁針放在導線上方 → N 極偏東；放在導線下方 → N 極偏西。</p>\n<p>如果電流產生的磁場剛好和地磁方向一樣（都向北），磁針本來就指北，就看不出偏轉（115 會考第 35 題）。</p>\n<h3>冷次定律：反抗變化的小氣鬼</h3><p>磁鐵 N 極靠近線圈 → 線圈在靠近端變出 N 極「推開」它；磁鐵 N 極遠離 → 線圈變出 S 極「拉住」它。<b>它不喜歡改變，你要靠近它就推，你要走它就拉。</b>磁鐵靜止不動 → 沒有變化 → 沒有感應電流。</p>`,traps:["導線上方與下方磁場方向相反，判斷前先確認磁針在上還是在下（111 會考第 16 題、114 會考第 31 題）。","電流磁場與地磁同向時，磁針不偏轉，不能用來判斷有沒有電流（115 會考第 35 題）。","磁鐵靜止在線圈中，沒有感應電流。","磁鐵極性反過來掉入線圈，感應電流方向相反、大小相同（113 會考第 13 題）。"],seen:["111-16 載流導線磁場","112-37 導線在磁場中受力","113-13 磁鐵落入線圈","114-31 電流磁效應","115-35 磁針判斷電流"]},{id:101,sub:"bio",book:"國一上",name:"生命世界與細胞",topics:"科學方法、生物圈、細胞學說、動植物細胞構造、顯微鏡操作、組成層次",lv:"must",hard:false,yr:[3,2,3,4,1],alert:"每年 1～4 題。顯微鏡（複式 vs. 解剖）、動植物細胞差異、擴散與滲透、科學方法（怎麼驗證一句話）是固定題型。",keys:["科學方法：觀察 → 提出問題 → 假設 → 設計實驗（操縱、控制、應變變因）→ 結果 → 結論。驗證「所有…都…」只要找到一個反例就能推翻。","生物圈：地球上有生物分布的範圍，包含大氣圈下層、水圈、岩石圈上層。","細胞學說：生物都由細胞組成；細胞是生物構造和功能的基本單位；細胞來自原有的細胞。","植物細胞特有：細胞壁、葉綠體、大型液胞。動植物都有：細胞膜、細胞核、細胞質、粒線體。","細胞膜控制物質進出；細胞核含遺傳物質（DNA）；粒線體進行呼吸作用；葉綠體進行光合作用。","擴散：分子由濃度高往濃度低移動。滲透：「水」通過半透膜，由水多（溶質少）往水少（溶質多）移動。","複式顯微鏡看細胞（放大倍率＝目鏡×物鏡，影像上下左右顛倒）；解剖顯微鏡看較大的立體標本（花、昆蟲），影像正立。","倍率越高：視野越暗、範圍越小、看到的細胞數越少，但每個細胞越大。","組成層次：細胞 → 組織 → 器官 → 器官系統 → 個體（植物沒有「器官系統」）。"],plain:`<h3>顯微鏡選哪台？看東西多大</h3><p>要看「細胞裡的東西」（葉綠體、細胞核）→ 複式顯微鏡；要看「一朵花、一隻螞蟻的構造」→ 解剖顯微鏡（立體、正立、倍率低）。</p>\n<h3>滲透：水往「鹹」的地方跑</h3><p>想像細胞外很鹹（溶質多），水就從細胞裡往外跑，細胞會縮；細胞外是清水，水往細胞裡跑，動物細胞會脹破、植物細胞有細胞壁撐著不會破。</p>\n<div class="ex">半透膜題的步驟：<b>先找哪種分子能通過膜</b>。能通過的會擴散到兩邊濃度相同；不能通過的會留在原地，水再往它那邊跑。</div>`,traps:["複式顯微鏡的影像上下左右都顛倒：影像在視野左上方，玻片要往左上方移。","葡萄糖能通過膜時，最後兩側都會有葡萄糖；澱粉不能通過，只留在原側（112 會考第 24 題）。","要推翻「所有刺絲胞動物都生活在海洋」，只要找到一種生活在淡水的刺絲胞動物（113 會考第 20 題）。","細胞壁不是動物細胞的構造；粒線體動植物都有。"],seen:["111-17 顯微鏡選用","112-24 半透膜與擴散","113-20 驗證科學敘述","114-7 立蛋與科學證據"]},{id:102,sub:"bio",book:"國一上",name:"養分與能量",topics:"養分與檢測（本氏液、碘液）、酵素、光合作用、消化系統",lv:"must",hard:true,yr:[2,3,1,2,2],alert:"每年 2～3 題。酵素實驗（對照組、溫度）、光合作用與呼吸作用比較、光合作用反應式、消化酵素是重點。",keys:["六大養分：醣類、蛋白質、脂質（提供能量）；維生素、礦物質、水（不提供能量）。","碘液遇澱粉變藍黑色；本氏液加熱後遇葡萄糖等還原醣由藍色變成黃、橙、紅色沉澱。","酵素是蛋白質，可以加快反應、反應前後本身不變；具有專一性（一種酵素只作用於特定受質）。","酵素受溫度、pH 影響：太高溫會變性失去活性，低溫只是活性變低。人體酵素約 37℃ 最佳；胃蛋白酶在酸性中作用。","光合作用：二氧化碳＋水 →（光、葉綠體）→ 葡萄糖＋氧氣。只有含葉綠體、照到光的細胞能進行。","呼吸作用：葡萄糖＋氧氣 → 二氧化碳＋水＋能量。所有活細胞隨時都在進行（白天晚上都有）。","光合作用製造的葡萄糖多轉成澱粉儲存，以蔗糖形式經韌皮部運送。","消化：口腔（唾液澱粉酶）、胃（胃蛋白酶）、小腸（胰液、腸液，最主要的消化與吸收場所）。膽汁不含酵素，只乳化脂質。","大分子 → 小分子：澱粉 → 葡萄糖；蛋白質 → 胺基酸；脂質 → 脂肪酸＋甘油。"],plain:`<h3>光合作用 vs. 呼吸作用：像存錢和花錢</h3><p>光合作用是「存能量」：用光把 CO₂ 和水做成葡萄糖，放出 O₂。呼吸作用是「花能量」：把葡萄糖燒掉拿能量，放出 CO₂。<b>每個活細胞都在花錢（呼吸），只有綠色且照光的細胞會存錢（光合）。</b></p>\n<div class="ex">所以榕樹「能呼吸的細胞數」一定比「能光合的細胞數」多，因為根、莖內部的細胞沒有葉綠體，但都要呼吸（111 會考第 18 題）。</div>\n<h3>酵素實驗看「對照組」</h3><p>兩支試管只差「有沒有加酵素」，其他都一樣。加酵素的那支澱粉被分解，滴碘液不變藍黑；加水的那支澱粉還在，碘液變藍黑。</p>`,traps:["照光的綠色部位同時進行光合作用與呼吸作用，釋出的氣體以 O₂ 為主；沒照光的白色部位只呼吸，釋出 CO₂（114 會考第 8 題）。","葡萄糖在植物體內是以「蔗糖」經韌皮部運送，不是木質部（112 會考第 16 題）。","酵素反應後本身不會被消耗；高溫失去活性後降溫也回不來。","膽汁由肝臟製造、儲存在膽囊，不含消化酵素。"],seen:["111-18 光合與呼吸細胞數","111-32 蜂蜜酵素實驗","112-16 光合作用反應式","114-8 蘆筍光照與氣體","115-37 蛋白酶與產物"]},{id:103,sub:"bio",book:"國一上",name:"生物的運輸作用",topics:"維管束、蒸散作用、血液成分、血管、心臟與體循環／肺循環",lv:"must",hard:true,yr:[2,2,1,2,2],alert:"每年 1～2 題。心臟四腔室與血液含氧量、體循環和肺循環路徑、木質部與韌皮部的分工是固定考點。",keys:["木質部：運送水分與礦物質，由下往上；韌皮部：運送養分（蔗糖），可上可下。","蒸散作用：水分由氣孔散失，是根吸水往上運送的主要拉力；氣孔多在葉的下表皮。","血液＝血漿（運送養分、廢物、激素）＋紅血球（含血紅素運氧，成熟後無細胞核）＋白血球（防禦）＋血小板（凝血）。","動脈：離開心臟，管壁厚、有彈性；靜脈：回到心臟，管壁薄、有瓣膜；微血管：只有一層細胞，物質交換的地方。","心臟：右心房、右心室（缺氧血）；左心房、左心室（充氧血）。左心室壁最厚，負責送血到全身。","體循環：左心室 → 主動脈 → 全身微血管 → 大靜脈 → 右心房。","肺循環：右心室 → 肺動脈 → 肺 → 肺靜脈 → 左心房。","肺動脈流缺氧血、肺靜脈流充氧血，是「動脈不一定充氧」的例外。"],plain:`<h3>心臟兩條路，記成「8 字形」</h3><p><b>右邊管肺、左邊管全身。</b>右心室把缺氧血打去肺「充氧」，充好的血回到左心房；左心室再把充氧血打到全身，用完回到右心房。</p>\n<div class="ex">口訣：<b>室出房入</b>（血從心室出去、從心房回來）。<br>肺臟流出的血 → 肺靜脈 → 先進左心房；肝臟流出的血 → 下大靜脈 → 先進右心房（115 會考第 39 題）。</div>\n<h3>看含氧量判斷左右</h3><p>含氧量高的心室是左心室，含氧量低的是右心室（111 會考第 26 題）。</p>`,traps:["血液一定先進「心房」，不會直接進心室（115 會考第 39 題）。","肺動脈裡是缺氧血、肺靜脈裡是充氧血。","成熟紅血球沒有細胞核。","木質部只能由下往上；韌皮部可以雙向運送。"],seen:["111-26 心室含氧量","115-39 血液回心臟路徑"]},{id:104,sub:"bio",book:"國一上",name:"生物的協調作用",topics:"刺激與反應、神經系統、反射與意識、內分泌與激素、植物的向性與感應",lv:"often",hard:false,yr:[2,0,1,1,1],alert:"大約每年 1 題。反射弧路徑、激素經血液運送、植物向性（慢）vs. 觸發運動（快）是常見題型。",keys:["神經系統：中樞神經（腦、脊髓）＋周圍神經（腦神經、脊神經）。","大腦：意識、思考、記憶；小腦：平衡與協調；腦幹：呼吸、心跳等維生功能。","反射：不經大腦思考，由脊髓或腦幹控制，速度快（膝跳反射、縮手反射）。路徑：受器 → 感覺神經 → 中樞 → 運動神經 → 動器。","意識行為：要經過大腦判斷，例如看到紅燈停下。","內分泌腺沒有導管，激素直接進入血液，隨血液運送到全身作用。","重要激素：胰島素降血糖、升糖素升血糖、甲狀腺素促進代謝、生長激素（腦垂腺）、腎上腺素（緊急時心跳加快）、副甲狀腺素調節血鈣。","植物向性：生長造成的彎曲，反應慢（向光性、向地性、向水性）。","植物感應運動：細胞膨壓改變，反應快（含羞草觸發運動、捕蠅草、酢漿草睡眠運動）。"],plain:`<h3>神經 vs. 激素：簡訊和廣播</h3><p>神經像傳簡訊，指定一個人、很快到；激素像廣播，透過血液送到全身，比較慢但作用久。</p>\n<h3>植物動得快還是慢？</h3><p>會「長歪」的（向光、向地）是生長，要好幾天；會「啪一下合起來」的（含羞草、捕蠅草）是水分進出造成的膨壓變化，幾秒鐘就有反應。</p>`,traps:["向光性要幾天，比含羞草閉合慢很多（111 會考第 5 題）。","激素是經「血液」運送，不是經神經或導管（113 會考第 5 題）。","反射不經大腦，但大腦事後仍會感覺到。","胰島素是唯一能降低血糖的激素。"],seen:["111-5 植物感應快慢","113-5 副甲狀腺素"]},{id:105,sub:"bio",book:"國一上",name:"生物的恆定性",topics:"呼吸與氣體交換、體溫調節、血糖恆定、排泄（腎臟與尿液）",lv:"often",hard:true,yr:[1,2,1,1,2],alert:"大約每年 1～2 題。腎臟（血液流經後尿素下降）、血糖調節（胰島素）、器官功能類比是常考題型。",keys:["恆定性：生物維持體內環境（體溫、血糖、水分）穩定的能力。","氣體交換在肺泡：O₂ 擴散進微血管、CO₂ 擴散進肺泡。吸氣時橫膈下降、胸腔變大。","內溫動物（鳥類、哺乳類）體溫恆定；外溫動物體溫隨環境改變。","血糖高 → 胰臟分泌胰島素 → 血糖降低；血糖低 → 分泌升糖素 → 血糖升高。","肝臟把胺基酸分解產生的氨轉變成尿素；腎臟過濾血液製造尿液，排出尿素。","泌尿系統：腎臟 → 輸尿管 → 膀胱 → 尿道。","血液流經腎臟後：尿素、氧氣減少，二氧化碳增加。流經肝臟後尿素增加。","皮膚排汗也能排出少量尿素和水分，同時幫助散熱。"],plain:`<h3>看血液流過器官「多了什麼、少了什麼」</h3><p>每個器官都會用掉氧、產生二氧化碳。<b>尿素變多 → 是肝臟（工廠製造尿素）；尿素變少 → 是腎臟（濾掉尿素）。</b></p>\n<div class="ex">111 會考第 35 題：血液流出甲器官後尿素上升、氧下降 → 甲是肝臟。</div>\n<h3>血糖像一台空調</h3><p>太熱（血糖高）就開冷氣（胰島素），太冷（血糖低）就開暖氣（升糖素），讓血糖一直在固定範圍附近。</p>`,traps:["尿素是肝臟製造的，腎臟只負責排出。","吃了容易吸收的糖 → 血糖上升 → 胰島素分泌增加 → 血糖下降（112 會考第 8 題）。","製造尿液的器官，流出的血液含氧量比流入的低（113 會考第 33 題）。","蝦的觸角腺能過濾、再吸收並排出含氮廢物，功能類似人的腎臟（115 會考第 20 題）。"],seen:["111-35 尿素上升的器官","112-8 血糖與胰島素","113-33 腎臟血管","115-20 觸角腺與腎臟"]},{id:106,sub:"bio",book:"國一下",name:"生殖",topics:"細胞分裂與減數分裂、無性生殖、有性生殖（開花植物、動物受精）",lv:"base",hard:false,yr:[1,1,1,1,1],alert:"每年固定 1 題。減數分裂後染色體數目減半、果實與種子由哪裡發育而來，是最常考的兩件事。",keys:["細胞分裂：1 個細胞變 2 個，染色體數目不變，用於生長與修補。","減數分裂：產生生殖細胞（精子、卵），染色體數目減半（人體 46 → 23），成對的染色體分開。","有性生殖：精卵結合成受精卵，子代有父母雙方的遺傳物質，差異大、適應力強。","無性生殖：不經精卵結合，子代和親代遺傳物質相同。例如分裂（細菌）、出芽（酵母菌、水螅）、孢子（黴菌、蕨類）、營養器官繁殖（甘薯的根、馬鈴薯的莖、落地生根的葉）、組織培養。","花的構造：雄蕊（花藥產生花粉）、雌蕊（柱頭、花柱、子房，子房內有胚珠）。","受精後：子房 → 果實；胚珠 → 種子；受精卵 → 胚。","動物體外受精多在水中（魚、青蛙），產卵數多；體內受精（鳥、哺乳類）。"],plain:`<h3>減數分裂：把成對的鞋子分開</h3><p>體細胞的染色體是一對一對的，像成雙的鞋子。做精子或卵時，每雙只拿一隻，所以數目減半；精卵結合後又湊回成對。</p>\n<div class="ex">青蛙 13 對（26 條）→ 卵子 13 條，其中性染色體只有 1 條（113 會考第 30 題）。</div>\n<h3>水果是哪裡長大的？</h3><p><b>子房變果實、胚珠變種子。</b>草莓的紅色果肉是花托膨大，表面一粒粒的才是子房發育成的果實（112 會考第 35 題）。</p>`,traps:["卵細胞、精子只含一條性染色體；成熟紅血球沒有細胞核，所以也沒有成對的性染色體（111 會考第 39 題）。","草莓表面的小顆粒是果實，不是種子（112 會考第 35 題）。","營養器官繁殖、組織培養都屬於無性生殖。","減數分裂只發生在生殖器官產生生殖細胞時。"],seen:["111-39 性染色體","112-35 草莓果實","113-30 青蛙減數分裂","115-13 玉米育種"]},{id:107,sub:"bio",book:"國一下",name:"遺傳",topics:"孟德爾遺傳、基因與等位基因、棋盤方格法、性別決定、突變與遺傳疾病、生物技術",lv:"must",hard:true,yr:[2,1,1,1,2],alert:"每年 1～2 題，而且常是計算題。ABO 血型、Aa×Aa 的 3：1、從子代推親代基因型是最常考的三種。",keys:["基因位於染色體上，成對的基因稱為等位基因，一個來自父親、一個來自母親。","顯性（大寫 A）只要一個就表現；隱性（小寫 a）要兩個 aa 才表現。","基因型（AA、Aa、aa）vs. 表現型（看得到的特徵）。","Aa × Aa → AA：Aa：aa＝1：2：1，顯性：隱性＝3：1。","Aa × aa → Aa：aa＝1：1。","ABO 血型：Iᴬ、Iᴮ 為顯性，i 為隱性。A 型 IᴬIᴬ 或 Iᴬi；B 型 IᴮIᴮ 或 Iᴮi；AB 型 IᴬIᴮ；O 型 ii。","人類性別：男 XY、女 XX，由父親的精子決定。生男生女機率各 1/2。","突變：遺傳物質改變，可能遺傳給下一代（發生在生殖細胞時）。","生物技術：基因轉殖、複製（無性生殖）、DNA 鑑定。"],plain:`<h3>棋盤方格法：爸爸放上面、媽媽放左邊</h3><p>把父親的兩個基因寫在上排，母親的寫在左列，交叉填格子，四格就是四種機率相等的子代。</p>\n<div class="ex">Aa × Aa：<br>　　A　　a<br>A　AA　Aa<br>a　Aa　aa<br>→ 顯性 3 格、隱性 1 格，<b>3：1</b>。</div>\n<h3>從子代倒推爸媽</h3><p>兩個黑眼睛生出紅眼睛 → 紅眼是隱性，而且爸媽都是帶著隱性的 Aa。<b>「無中生有」的那個特徵就是隱性。</b></p>\n<h3>機率不是保證</h3><p>3：1 是很多子代的平均。只看 10 隻子代，出現 4：6 也很正常，不代表孟德爾錯了（113 會考第 12 題）。</p>`,traps:["A 型 × A 型（都 Iᴬi）可以生出 O 型；AB 型的父母一方不可能生出 O 型子女（111 會考第 11 題）。","樣本數少時比例會偏離 3：1，要觀察很多子代才準（113 會考第 12 題）。","顯性遺傳疾病只要一個突變基因就會發病（112 會考第 38 題）。","性別由父親的 X 或 Y 精子決定，不是母親。"],seen:["111-11 ABO 血型","112-38 軟骨發育不全","113-12 果蠅子代比例","114-30 孔雀魚眼色","115-25 抽棋子模擬遺傳"]},{id:108,sub:"bio",book:"國一下",name:"演化與生物多樣性",topics:"化石與演化、天擇說、二名法與分類階層、五界特徵",lv:"often",hard:false,yr:[1,2,1,2,1],alert:"每年 1～2 題。從特徵判斷屬於哪一界（原核、原生、菌物、植物、動物）、學名的屬名與種小名，最常出現。",keys:["化石：越深的地層通常越古老，化石生物構造越簡單；越上層越複雜、越接近現代生物。","達爾文天擇說：個體間本來就有差異 → 適合環境的個體存活並繁殖較多 → 有利特徵逐代累積。","分類階層由大到小：界、門、綱、目、科、屬、種。越下層的生物越相似。","二名法：學名＝屬名（字首大寫）＋種小名（小寫），以拉丁文斜體書寫。同屬的生物學名第一個字相同。","原核生物界：沒有細胞核（細菌、藍綠菌）。","原生生物界：有細胞核，多為單細胞（草履蟲、變形蟲、矽藻、眼蟲）。","菌物界：有細胞核、細胞壁，沒有葉綠素，多由菌絲構成、靠分解吸收養分（黴菌、蕈類、酵母菌）。","植物界：苔蘚（無維管束）、蕨類（孢子繁殖）、裸子植物（種子裸露，無花無果實）、被子植物（有花、果實）。"],plain:`<h3>判斷是哪一界，三個問題就夠</h3><p>1. 有細胞核嗎？沒有 → 原核生物界。<br>2. 有葉綠素嗎？沒有、有菌絲 → 菌物界。<br>3. 單細胞、構造簡單 → 原生生物界；多細胞會光合作用 → 植物界；多細胞會吃東西 → 動物界。</p>\n<div class="ex">114 會考第 34 題：甲有核、有菌絲、沒葉綠素 → 菌物界；乙沒有核、有葉綠素 → 原核生物界（藍綠菌）。</div>`,traps:["長頸鹿脖子變長不是「因為一直伸長脖子」，而是脖子長的個體比較能存活繁殖。","藍綠菌有葉綠素但沒有細胞核，屬於原核生物界。","黴菌、蕈類不是植物，沒有葉綠素。","學名第一個字是屬名，同屬生物第一個字相同（113 會考第 39 題）。"],seen:["112-4 毛黴菌構造","113-39 杜鵑花學名","114-34 生物分界","115-29 穿山龍分類"]},{id:109,sub:"bio",book:"國一下",name:"生態系與環境",topics:"族群與群集、食物鏈與食物網、能量金字塔、物質循環、生態系、生物多樣性保育",lv:"must",hard:false,yr:[2,3,3,1,1],alert:"每年 1～3 題，常和時事結合。生物交互關係（競爭、掠食）、生物放大作用、外來種、標記再捕捉法是常客。",keys:["族群：同一區域同種生物的全部個體；群集：同一區域所有族群的總和；生態系＝群集＋非生物環境。","生產者（行光合作用）→ 初級消費者 → 次級消費者…；分解者（細菌、真菌）分解屍體與排遺。","能量沿食物鏈逐層遞減，每往上一層只有約 10% 傳下去，所以頂端消費者數量最少。","生物放大作用：難分解的物質（DDT、重金屬）沿食物鏈越往上累積濃度越高。","生物交互關係：掠食、競爭（資源相同）、寄生（一方受害）、片利共生（一方得利、一方無影響）、互利共生。","碳循環：光合作用吸收 CO₂，呼吸作用、燃燒、分解放出 CO₂。","生物多樣性：遺傳多樣性、物種多樣性、生態系多樣性。","威脅：棲地破壞、過度利用（濫捕）、外來種入侵、汙染。","標記再捕捉法：族群總數＝第一次捕捉標記數×第二次捕捉數÷第二次中有標記數。"],plain:`<h3>生物放大：越上面越毒</h3><p>小魚吃了很多浮游生物，大魚又吃了很多小魚，DDT 排不掉，一路累積。<b>DDT 濃度越高的，在食物鏈越上層。</b></p>\n<h3>單一物種樹林為什麼不好？</h3><p>原始森林有很多種植物，提供各種動物食物與棲所；改種單一樹種後，物種多樣性下降，生態系也比較不穩定（112 會考第 1 題）。</p>`,traps:["食性相似、築巢位置相近 → 競爭；還會吃對方的幼鳥 → 同時有掠食（114 會考第 3 題）。","大量捕捉販賣屬於「過度利用」，不是棲地破壞（113 會考第 42 題）。","能量金字塔不能倒立；數量金字塔有時會倒立（如一棵樹上很多昆蟲）。","DDT 濃度最高的是最高級消費者，不是生產者（112 會考第 14 題）。"],seen:["112-1 原始森林改種單一物種","112-14 DDT 生物放大","113-42 食蛇龜","114-3 白尾八哥與麻雀","115-21 標記再捕捉"]},{id:201,sub:"earth",book:"國三上",name:"水圈與地貌",topics:"水資源分布、河流侵蝕／搬運／沉積、海岸地形、地下水與超抽",lv:"base",hard:false,yr:[0,0,0,1,1],alert:"大約一兩年考 1 題，觀念單純：河流上游侵蝕、下游堆積；超抽地下水會地層下陷。",keys:["地球上的水約 97% 是海水，淡水只有約 3%，而淡水大部分是冰川；人類方便使用的河水、湖水很少。","水循環：蒸發 → 凝結 → 降水 → 地表逕流或滲入地下 → 回到海洋，由太陽能驅動。","河流上游坡度大、流速快，以侵蝕為主（V 形谷）；下游坡度小、流速慢，以堆積為主。","沖積扇：河流出山口坡度突然變緩而堆積；三角洲：河口處堆積。","海岸地形：岩岸以侵蝕為主（海蝕平臺、海蝕洞、海蝕柱）；沙岸以堆積為主（沙洲、潟湖）。","地下水存在岩層、土壤的孔隙中；過度抽取會造成地層下陷、海水倒灌。","風化：岩石在原地碎裂或分解；侵蝕：把物質搬離；搬運與沉積：流速變慢時顆粒大的先沉積。"],plain:`<h3>河流一生：年輕愛挖、年老愛堆</h3><p>上游像年輕人力氣大，一路往下挖出 V 形谷；到了下游走不動了，就把帶來的沙土放下，形成沖積扇、三角洲。</p>`,traps:["地層下陷是「超抽地下水」造成，不是地震（114 會考第 6 題）。","淡水大部分是冰川，不是河流或湖泊。","流速變慢時，顆粒大的先沉積、細的後沉積。"],seen:["114-6 超抽地下水的影響"]},{id:202,sub:"earth",book:"國三上",name:"岩石與地層",topics:"礦物、三大岩類、地層疊置與相對年代、褶皺與斷層",lv:"often",hard:false,yr:[1,2,1,1,0],alert:"大約每年 1 題。三大岩類怎麼形成、化石在哪類岩石、褶皺與正逆斷層，是常見題型。",keys:["礦物有固定的成分與性質，可用硬度、顏色、條痕、解理來鑑定。","火成岩：岩漿冷卻形成。地底深處慢慢冷卻 → 顆粒大（花岡岩）；地表快速冷卻 → 顆粒小（玄武岩、安山岩）。","沉積岩：沉積物堆積、壓密膠結而成，有層理，最可能找到化石（砂岩、頁岩、礫岩、石灰岩）。","變質岩：原有岩石受高溫高壓變質（石灰岩 → 大理岩；頁岩 → 板岩）。","地層疊置定律：沒有倒轉時，下層較老、上層較新。","截切定律：切過地層的岩脈或斷層，比被切的地層年輕。","褶皺：岩層受擠壓力彎曲（太魯閣常見）。","正斷層：張力，上盤下滑；逆斷層：擠壓力，上盤上移；平移斷層：兩側水平錯動。"],plain:`<h3>三大岩類，看「怎麼出生」</h3><p><b>火成岩是燒出來的</b>（岩漿冷卻），<b>沉積岩是堆出來的</b>（一層一層壓），<b>變質岩是壓出來的</b>（又熱又擠變了樣）。化石只會被「堆」進去，所以多在沉積岩。</p>\n<h3>正逆斷層：拉開就掉下去</h3><p>兩邊被拉開（張力）→ 上盤往下滑，是正斷層；兩邊被擠（壓力）→ 上盤被推上去，是逆斷層。</p>`,traps:["岩層「彎曲」是褶皺，「斷開錯動」才是斷層（112 會考第 2 題）。","侵入的火成岩脈比被它切過的岩層年輕（112 會考第 10 題）。","火成岩冷卻越慢，礦物晶體越大。"],seen:["112-2 太魯閣褶皺","112-10 海蝕平臺火成岩脈"]},{id:203,sub:"earth",book:"國三上",name:"板塊構造與地震",topics:"地球內部構造、大陸漂移與海底擴張、板塊邊界、地震波、規模與震度",lv:"must",hard:true,yr:[1,2,2,2,2],alert:"每年 1～2 題。地球分層（地殼／地函／地核 vs. 岩石圈／軟流圈）、板塊邊界與地形、規模 vs. 震度是必考。",keys:["依成分分：地殼、地函、地核。依性質分：岩石圈（地殼＋上部地函，硬）、軟流圈（地函中可緩慢流動的部分）。","板塊就是岩石圈分成的一塊塊，在軟流圈上緩慢移動。","張裂型邊界：板塊分開，形成中洋脊、裂谷，海洋變寬。","聚合型邊界：板塊互相擠壓，形成海溝、島弧、山脈（臺灣在歐亞板塊與菲律賓海板塊交界）。","錯動型邊界：板塊水平錯開，形成轉形斷層。","地震規模：地震釋放的能量大小，一次地震只有一個規模。震度：各地的搖晃程度，不同地點不同（臺灣分 0～7 級）。","P 波（縱波）較快、先到；S 波（橫波）較慢、後到，破壞力較大。地震預警就是利用兩者時間差。","海底擴張證據：中洋脊兩側岩石年齡對稱，越遠越老。"],plain:`<h3>兩種分層別搞混</h3><p>「地殼、地函、地核」是看<b>材料</b>（像蛋殼、蛋白、蛋黃）；「岩石圈、軟流圈」是看<b>軟硬</b>。岩石圈＝地殼＋地函最上面那層硬的。</p>\n<h3>規模 vs. 震度：燈泡瓦數 vs. 你覺得多亮</h3><p>規模是燈泡本身幾瓦（只有一個）；震度是你站的地方覺得多亮，離得近就亮、遠就暗。<b>預警跑馬燈上的「震度 4 級」是本地的搖晃程度</b>，看不出規模（115 會考第 8 題）。</p>`,traps:["岩石圈包含地殼和上部地函，不是只有地殼（111 會考第 13 題）。","土壤液化要看的是本地「搖晃程度」，也就是震度（112 會考第 49 題）。","兩側陸地距離逐年增加、海域變大 → 張裂型邊界（115 會考第 26 題）。","板塊大小形狀各不相同，包含海洋和陸地（114 會考第 15 題）。"],seen:["111-13 地球分層","112-49 土壤液化與震度","114-15 板塊敘述","115-8 地震預警","115-26 張裂型邊界"]},{id:204,sub:"earth",book:"國三下",name:"大氣與天氣變化",topics:"大氣分層與氣壓、風與海陸風、氣團與鋒面、天氣圖、颱風與梅雨",lv:"must",hard:true,yr:[4,3,3,3,2],alert:"五年考最多的地科單元，每年 2～4 題。高低氣壓的天氣、鋒面的冷暖空氣、季風方向、對流層與平流層判讀是重點。",keys:["對流層：最底層，天氣現象都在這裡，高度越高氣溫越低。平流層：氣溫隨高度升高（臭氧吸收紫外線），大氣穩定。","氣壓隨高度增加而降低。1 大氣壓≈1013 百帕（hPa），百帕是氣壓的單位。","風由高氣壓吹向低氣壓。等壓線越密，風越強。","北半球高氣壓：空氣下沉、順時針向外吹，天氣晴朗；低氣壓：空氣上升、逆時針向內吹，容易成雲致雨。","海陸風：白天陸地升溫快 → 風由海吹向陸（海風）；晚上相反（陸風）。","冷鋒：冷空氣推暖空氣，暖空氣被迫快速抬升，降雨短而強，過後氣溫下降。暖鋒：暖空氣爬上冷空氣，降雨範圍大、時間長。滯留鋒：冷暖勢力相當，久久不走（梅雨）。","臺灣冬季吹東北季風（北部、東北部多雨）；夏季吹西南季風。","颱風是熱帶海洋上的強烈低氣壓，北半球逆時針旋轉，中心有颱風眼。","梅雨：5、6 月滯留鋒停留在臺灣附近。"],plain:`<h3>高氣壓好天氣、低氣壓壞天氣</h3><p>高氣壓的空氣往<b>下沉</b>，下沉會變暖、水氣不容易凝結 → 晴天。低氣壓的空氣往<b>上升</b>，上升會變冷、水氣凝結成雲 → 下雨。颱風、暖氣團的中心都是低壓；冬天的蒙古冷氣團是高壓。</p>\n<h3>鋒面：誰在下面誰是冷的</h3><p>冷空氣比較重，一定在鋒面下方；暖空氣比較輕，沿著鋒面被抬上去形成雲雨（114 會考第 5 題）。</p>\n<div class="ex">判斷對流層、平流層：<b>看氣溫圖</b>。氣溫隨高度下降是對流層，上升是平流層；氣壓圖兩層都是往上遞減，分不出來（115 會考第 27 題）。</div>`,traps:["太平洋暖氣團是高氣壓，不是低氣壓（113 會考第 28 題）。","只有一條等壓線時，無法判斷風向和風速（113 會考第 15 題）。","夏天從臺灣往北航行：西南季風、黑潮向北，都有幫助（112 會考第 15 題）。","臺北冬天多雨是因為東北季風迎風，其他地區不一定適用（114 會考第 13 題）。","百帕是氣壓單位，不是溫度或雨量（111 會考第 1 題）。"],seen:["111-1 百帕","112-15 季風與洋流","112-28 高氣壓天氣","113-15 等壓線","113-28 高低氣壓分類","114-5 鋒面剖面","114-13 東北季風","115-27 對流層與平流層","115-34 滯留鋒"]},{id:205,sub:"earth",book:"國三下",name:"天文與星象",topics:"宇宙與光年、太陽系、晝夜與四季、月相、日食月食、潮汐",lv:"must",hard:true,yr:[3,4,3,2,4],alert:"地科的大魔王，每年 2～4 題。月相與日月食、潮汐時間推算、四季與太陽直射點（南北半球相反）幾乎每年都考。",keys:["光年是距離單位：光走一年的距離。","太陽系：類地行星（水金地火，岩石、密度大、體積小）；類木行星（木土天海，氣體、體積大、衛星多）。","自轉造成晝夜與太陽東升西落；地軸傾斜 23.5° 加上公轉造成四季。","夏至太陽直射北回歸線，北半球晝最長、正午太陽最高；冬至直射南回歸線。南北半球季節相反。","月相週期約 29.5 天：新月（朔）→ 上弦月 → 滿月（望）→ 下弦月 → 新月。","日食只發生在新月（太陽、月球、地球排成一直線，月球在中間）；月食只發生在滿月（地球在中間）。","潮汐主要由月球引力造成，每天約兩次滿潮、兩次乾潮，相鄰滿潮與乾潮約隔 6 小時 12 分。","每天的滿潮時間約延後 50 分鐘。新月、滿月時潮差最大（大潮）；上、下弦月時潮差最小（小潮）。"],plain:`<h3>月相：亮面朝太陽</h3><p>月亮自己不發光，<b>亮的那一側永遠朝向太陽</b>。上弦月（農曆初七、八）右半邊亮，下弦月（農曆廿二、廿三）左半邊亮；滿月整晚都看得到，傍晚從東方升起。</p>\n<div class="ex">月食在 9 日（滿月）→ 大約 7 天後是下弦月、約 15 天後（23、24 日）是新月，剛好會有日食（112 會考第 39 題）。</div>\n<h3>潮汐推時間：一圈約 12 小時 25 分</h3><p>滿潮 → 乾潮約 6 小時，乾潮 → 下一次滿潮又約 6 小時。今天 17:00 滿潮，隔天同一時間大約會晚 50 分鐘。</p>\n<h3>四季：南半球反過來</h3><p>12 月是北半球的冬天、南半球的夏天。從英國去紐西蘭過聖誕節，那裡白天長、正午太陽高（111 會考第 6 題）。</p>`,traps:["日食一定是新月、月食一定是滿月，不會反過來（112 會考第 39 題）。","上弦月到下弦月約半個月：地球自轉約 15 圈，公轉只走了約 15/365 圈（114 會考第 50 題）。","潮差＝滿潮高度−乾潮高度，乾潮是負值時 2.5−(−2.5)＝5 m（112 會考第 5 題）。","白天太陽明亮面積先減少再恢復是日食，是月球的影子落在地球上（113 會考第 24 題）。","陽光照進教室範圍變大再縮回，代表太陽正午高度先變低再變高，跨過了冬至（113 會考第 31 題）。"],seen:["111-6 南北半球季節","111-37 海浪與潮汐","112-5 大潮小潮","112-39 月食與日食","113-24 日食觀測","113-31 正午陽光與季節","114-37 行星公轉","114-50 上弦到下弦","115-15 退潮時間"]},{id:206,sub:"earth",book:"國三下",name:"全球氣候變遷",topics:"溫室效應與暖化、聖嬰與反聖嬰、永續發展與能源",lv:"often",hard:false,yr:[2,2,2,0,1],alert:"大約每年 1～2 題，題目通常是閱讀素養題：先讀懂文章裡氣體或現象的性質，再對應課本觀念。",keys:["溫室效應：大氣中的溫室氣體吸收地表放出的紅外線（地表輻射），再放出一部分回到地表，使地表保溫。","主要溫室氣體：水氣、二氧化碳、甲烷、一氧化二氮、氟氯碳化物。","全球暖化：人類大量燃燒化石燃料、砍伐森林，使 CO₂ 增加，增強溫室效應。","暖化影響：冰川融化、海平面上升、極端氣候增加、生物棲地改變。","聖嬰現象：東太平洋（南美洲祕魯外海）海水溫度異常升高，信風減弱；反聖嬰則是東太平洋變冷、信風增強。","CO₂ 濃度有季節性週期：春夏植物光合作用旺盛時下降、秋冬上升；氧氣變化方向和 CO₂ 相反。","臭氧層破洞（氟氯碳化物造成）和溫室效應是兩件不同的事。","永續發展：使用再生能源（太陽能、風力、水力）、節能減碳。"],plain:`<h3>溫室效應像蓋棉被</h3><p>陽光進來沒問題，但地表想把熱（紅外線）散出去時，被溫室氣體這條棉被擋住一部分。適量的棉被讓地球不會太冷；棉被太厚（CO₂ 太多）就太熱了。</p>\n<div class="ex">閱讀題訣竅：文章說某氣體「會吸收地表輻射」→ 它就是溫室氣體（111 會考第 19 題）。</div>`,traps:["溫室效應本身不是壞事，沒有它地球會太冷；問題是人類讓它增強。","臭氧層破洞讓紫外線增加，不是暖化的主要原因。","O₂ 約占大氣 21%、CO₂ 只有約 0.04%，同樣的變動量放在 O₂ 上，百分比變化小很多（113 會考第 50 題）。"],seen:["111-19 一氧化二氮","113-50 氧氣週期變化"]}];U.forEach(t=>{t.sub=t.sub||"phy"});const EASY={1:{s:["密度＝東西有多「擠」：同樣大小，越重的密度越大。算法：質量÷體積。","濃度＝糖（溶質）占整杯糖水的幾成。分母一定是「整杯」，不是只有水。","加水稀釋時，糖的克數不會變，只有整杯變重。"],w:[["質量","東西有多少，用天平量，單位 g、kg"],["體積","占多大空間，單位 cm³、mL（1 cm³＝1 mL）"],["溶質／溶劑／溶液","被溶的東西（糖）／拿來溶的東西（水）／溶完的整杯"],["ppm","百萬分之一。1 ppm＝1 公斤裡有 1 毫克"],["溶解度","100 g 水最多能溶多少克"]]},2:{s:["波是在「傳能量」，水和繩子本身只在原地上下動。","大聲小聲看振幅（dB），高音低音看頻率（Hz），聽得出是誰看音色。","聲音一定要有東西才能傳，真空中聽不到聲音。"],w:[["振幅","晃動的幅度，越大越大聲"],["頻率","1 秒振動幾次，單位 Hz，越多音越高"],["週期","振動 1 次要幾秒，和頻率互為倒數"],["波長","一個完整波的長度"],["介質","讓波傳過去的東西，例如空氣、水、繩子"]]},3:{s:["看得到東西，是因為光從東西「反射」進你的眼睛。","反射角＝入射角，兩個角都是和「法線」（垂直鏡子的虛線）量的。","凸透鏡把光聚在一起（放大鏡），凹透鏡把光散開（近視眼鏡）。"],w:[["法線","垂直於鏡面的一條假想線，量角度都從這條量"],["實像","光真的聚在那裡，可以投影在紙上，一定倒立"],["虛像","光沒有真的到那裡，只能用眼睛看，不能投影"],["焦點、焦距 f","平行光經過透鏡後聚在一起的點；透鏡到焦點的距離"],["折射","光從一種東西進到另一種東西時轉彎"]]},4:{s:["溫度是「多熱」，熱量是「給了多少熱」，兩者不一樣。","比熱大＝很難變熱也很難變冷。水的比熱最大，所以海邊溫差小。","冰在熔化、水在沸騰時，一直吸熱但溫度不變。"],w:[["比熱","1 g 的東西升高 1℃ 要多少熱，單位 cal/g℃"],["cal（卡）","熱量單位，1 g 水升 1℃ 要 1 cal"],["ΔT","溫度變化量＝後來溫度−原來溫度"],["傳導／對流／輻射","靠碰觸傳熱／靠流動傳熱／不用東西也能傳（太陽）"],["潛熱","改變狀態時吸收或放出、但不改變溫度的熱"]]},5:{s:["所有東西都是原子組成，原子中間有原子核（質子＋中子），外面繞著電子。","原子序＝質子數，決定它是什麼元素。","帶正電的離子是少了電子，帶負電的離子是多了電子，質子都不會變。"],w:[["元素","只由一種原子組成，例如氧氣 O₂、銅 Cu"],["化合物","兩種以上元素組成，例如水 H₂O"],["混合物","好幾種物質混在一起，例如空氣、海水"],["離子","得到或失去電子而帶電的原子"],["週期表的族","直的一行，同一族的元素個性相似"]]},6:{s:["化學反應前後，原子只是重新組合，總重量不會變（質量守恆）。","莫耳是「一大包」的單位，1 莫耳＝6×10²³ 個，就像一打＝12 個。","反應式前面的數字（係數）是「幾莫耳」的比例，不是幾克。"],w:[["原子量","1 莫耳這種原子有幾克，例如 C＝12、O＝16"],["分子量","把分子裡每個原子量加起來，例如 H₂O＝18"],["莫耳數","克數÷分子量"],["係數","化學式前面的數字，代表個數或莫耳數的比"],["生成物／反應物","箭頭右邊做出來的東西／箭頭左邊原本的東西"]]},7:{s:["氧化＝得到氧，還原＝失去氧，一個搶到、一個被搶，一定一起發生。","活性越大越活潑、越會搶氧，記口訣「甲那被(子)蓋美女貪心哥貼些錢請童工贏柏青」。","還原劑還原別人，氧化劑氧化別人。"],w:[["活性","搶氧（和氧結合）的能力，越大越會搶"],["還原劑","把別人還原的物質，自己被氧化"],["氧化劑","把別人氧化的物質，自己被還原"],["置換","活性大的把活性小的「換」出來"],["煉鐵","用 CO 搶走氧化鐵的氧，得到鐵"]]},8:{s:["酸性：pH 小於 7，酸酸的；鹼性：pH 大於 7，滑滑的；7 是中性。","pH 每差 1，酸的程度差 10 倍，數字越小越酸。","酸＋鹼會互相抵消（中和），變成鹽和水。"],w:[["電解質","溶在水裡可以導電的東西，例如鹽、酸、鹼"],["pH","表示酸鹼程度的數字，0～14"],["指示劑","遇到酸或鹼會變色的東西，例如石蕊、酚酞"],["中和","酸和鹼反應產生鹽和水"],["M（體積莫耳濃度）","1 公升溶液裡有幾莫耳溶質"]]},9:{s:["反應變快的方法：溫度高、濃度高、磨成粉、加催化劑。","有些反應可以來回進行（⇌），兩邊速度一樣快時就「平衡」了。","平衡不是停止，而是兩邊一直在進行、剛好互相抵消。"],w:[["反應速率","單位時間內反應了多少，一定要有時間才能比"],["催化劑","讓反應變快，自己不會被用掉"],["可逆反應","可以往右也可以往左進行的反應"],["平衡","往右和往左的速度一樣，看起來不再改變"],["表面積","東西露在外面能接觸的面積，粉末最大"]]},10:{s:["有機物就是含碳的化合物（CO、CO₂、碳酸鈣例外）。","看「官能基」認身分：−OH 是醇、−COOH 是有機酸、−COO− 是酯。","酸＋醇變成有香味的酯；油＋鹼變成肥皂。"],w:[["官能基","分子裡決定個性的一小段，像姓氏"],["烷／烯","只有碳和氫的化合物；烯有雙鍵"],["酯化","有機酸＋醇 → 酯＋水"],["皂化","油脂＋氫氧化鈉 → 肥皂＋甘油"],["聚合物","很多小分子連成的大分子，例如塑膠"]]},11:{s:["推不動時，摩擦力＝你的推力；推越大它越大，直到最大靜摩擦力為止。","壓力＝力÷面積，同樣的力，面積越小壓力越大（針很尖）。","浮力＝物體排開的水重，水下的體積越大浮力越大。"],w:[["正向力","兩個面互相壓住的力，例如桌子撐住書的力"],["最大靜摩擦力","推動前摩擦力的上限，超過才推得動"],["gw、kgw","重量單位：1 克物體受的重力、1 公斤物體受的重力"],["N（牛頓）","國際力的單位，1 kgw≈9.8 N"],["帕斯卡原理","密閉液體一處加壓，各處都增加一樣多（油壓機）"]]},12:{s:["位移看「起點到終點」，路徑長看「實際走了多遠」。","速度＝位移÷時間；加速度＝速度變化÷時間。","看圖先看縱軸：x–t 圖斜率是速度，v–t 圖斜率是加速度、面積是位移。"],w:[["位移","從起點直接指向終點的距離和方向"],["速率／速度","快慢（沒方向）／快慢加方向"],["加速度","速度改變得多快，單位 m/s²"],["斜率","線的傾斜程度＝縱軸變化÷橫軸變化"],["自由落體","從靜止只受重力往下掉，越掉越快"]]},13:{s:["沒有外力時，靜止的會一直靜止，在動的會一直等速直線前進（慣性）。","F＝ma：同樣的東西，用越大的力推，加速越快；越重越難加速。","你推牆、牆也推你，兩個力一樣大、方向相反，作用在不同東西上。"],w:[["慣性","保持原本狀態的傾向，越重慣性越大"],["合力","所有力加起來的結果，合力為 0 就是等速或靜止"],["質量 vs. 重量","東西有多少（不變）vs. 被地球吸多大力（會變）"],["向心力","讓東西繞圈圈、指向圓心的力"],["力矩","讓東西轉動的效果＝力×力臂"]]},14:{s:["作功＝力×在力的方向上移動的距離，沒移動或方向垂直就沒作功。","動能是「動起來的能量」，位能是「放在高處的能量」。","不計摩擦時，往下掉位能變少、動能變多，加起來不變（力學能守恆）。"],w:[["功","力讓東西移動所花的能量，單位 J（焦耳）"],["功率","每秒作多少功，單位 W（瓦特）"],["動能","½×質量×速率²，速率 2 倍動能 4 倍"],["位能","質量×g×高度，越高越大"],["力臂","支點到施力線的垂直距離"]]},15:{s:["電流像水流，電壓像推水的水位差，電阻像水管變窄的地方。","歐姆定律：電壓＝電流×電阻（V＝IR）。","串聯一條路：電流都一樣；並聯分岔路：電壓都一樣。"],w:[["電流 I","每秒流過多少電，單位安培 A"],["電壓 V", ((t,a)=>Math.round(r+(a-(d.length-1)/2)*e));l+=`<path d="M${r} 136 V150 ${d.length>1?`M${s[0]} 150 H${s[d.length-1]}`:""} ${s.map(t=>`M${t} 150 V164`).join(" ")}" stroke="var(--muted)" stroke-width="1.5" fill="none"/>`;d.forEach((t,e)=>{l+=`<text x="${s[e]}" y="184" fill="var(--accent)" font-size="13.5" font-weight="700">${t[0]}</text>${t[1]?`<text x="${s[e]}" y="203" fill="var(--muted)" font-size="12">${t[1]}</text>`:""}`});if(t[2])l+=`<text x="${r}" y="232" fill="${t[2].length>=3?"var(--bad)":"var(--often)"}" font-size="13" font-weight="700">${t[2]}</text>`}else{if(t[1])l+=`<text x="${r}" y="150" fill="var(--muted)" font-size="12.5">${t[1]}</text>`;if(t[2])l+=`<text x="${r}" y="176" fill="${t[2].length>=3?"var(--bad)":"var(--often)"}" font-size="13" font-weight="700">${t[2]}</text>`}});return l+`</g></svg>`}REF[1]={intro:"這一章是整個理化的「工具箱」：怎麼量長度、體積、質量，怎麼用<b>密度</b>判斷物質、預測沉浮，怎麼算<b>濃度</b>和<b>溶解度</b>。題目不難，但每年都有 2～4 題，而且最常因為「分母放錯」「單位沒換」丟分。",map:mkMap("基本測量與物質世界",[["測量與實驗","排水法・天平・變因","★★"],["密度","D＝M÷V","★★★"],["沉浮","比密度","★★"],["濃度","%・ppm・稀釋","★★★"],["溶解度與分離","飽和・析出・過濾蒸餾","★★"]]),table:[["測量、排水法與變因","★★","115-1、115-18、115-23"],["密度","★★★","111-38、114-2"],["沉浮","★★","112-30"],["重量百分濃度與 ppm","★★★","114-11、115-36"],["溶解度與混合物分離","★★","課本基本題"]],cs:[{t:"測量：量體積、量質量、控制變因",star:"★★",main:`<p>做實驗之前要先會「量」。會考最愛考兩件事：<b>形狀不規則的東西怎麼量體積</b>，以及<b>天平怎麼歸零</b>。</p>\n  <p class="law"><span>排水法</span>把物體完全放進量筒的水裡，<em>放入後的刻度 － 放入前的刻度＝物體的體積</em>。</p>\n  <figure class="dg"><svg viewBox="0 0 520 210" role="img" aria-label="排水法量體積">\n   <g font-family="Noto Sans TC,sans-serif" text-anchor="middle">\n   <rect x="90" y="40" width="70" height="150" rx="6" fill="none" stroke="var(--ink)" stroke-width="2.5"/><rect x="92" y="110" width="66" height="78" fill="var(--earth)" opacity=".28"/><line x1="80" y1="110" x2="170" y2="110" stroke="var(--earth)" stroke-width="2.5"/><text x="205" y="115" fill="var(--earth-k)" font-size="14" font-weight="700">30 mL</text>\n   <path d="M245 115 H285" stroke="var(--muted)" stroke-width="3" marker-end="url(#ah)"/>${AH}\n   <rect x="330" y="40" width="70" height="150" rx="6" fill="none" stroke="var(--ink)" stroke-width="2.5"/><rect x="332" y="86" width="66" height="102" fill="var(--earth)" opacity=".28"/><line x1="320" y1="86" x2="410" y2="86" stroke="var(--earth)" stroke-width="2.5"/><text x="445" y="91" fill="var(--earth-k)" font-size="14" font-weight="700">42 mL</text>\n   <path d="M352 182 L360 158 L382 160 L388 182 Z" fill="var(--sc)" stroke="var(--ink)" stroke-width="2"/>\n   <text x="365" y="22" fill="var(--ink)" font-size="14" font-weight="700">石頭體積＝42－30＝12 cm³</text></g></svg>\n   <figcaption>圖 1　排水法：看液面「上升了多少」，不是看放入後的讀數。</figcaption></figure>\n  <p>排水法有三個條件：物體要<b>不溶於水</b>、<b>不和水反應</b>、而且<b>會沉下去</b>。食鹽會溶、鉀會和水劇烈反應，都不能用排水法。</p>\n  <p>上皿天平使用前要<b>歸零</b>：指針偏哪邊，就代表哪邊比較重，要把那一邊的校準螺絲往<b>內</b>轉（或另一邊往外）。</p>\n  <p>做實驗時，一次只能改變一個條件，叫<b>操縱變因</b>；跟著改變、被測量的結果叫<b>應變變因</b>；其他都要保持一樣，叫<b>控制變因</b>。</p>`,side:[["易錯","讀量筒要看凹液面的最低點，視線和液面平齊。"],["判斷技巧","題目問「探討 X 對 Y 的影響」：X 是操縱變因，Y 是應變變因，其他全部是控制變因。"],["易錯","指針偏左＝左邊重，不是「左邊輕」。（115 會考第 1 題）"]],ex:"p59",exNote:["排水法的條件：不溶於水、不和水反應、會沉。","鉀會和水劇烈反應 → 不行；食鹽、葡萄糖會溶在水裡 → 液面上升不等於體積。","只有銅片三個條件都符合，答案是銅片。"],pr:"m5"},{t:"密度：每 1 cm³ 有多重",star:"★★★",main:`<p>同樣大小的箱子，一箱裝棉花、一箱裝鐵塊，鐵塊那箱重得多，因為鐵的粒子排得比較緊。用來比較「擠得多緊」的量就是<b>密度</b>。</p>\n  <div class="formula"><div class="fx"><span>D</span>＝<span>M</span>÷<span>V</span></div>\n   <div class="fl"><div><b>D</b>密度<small>g/cm³</small></div><div><b>M</b>質量<small>g</small></div><div><b>V</b>體積<small>cm³（＝mL）</small></div></div></div>\n  <ol class="pts"><li><b>密度是物質的特性。</b>同溫同壓下，一小塊鋁和一大塊鋁密度一樣，都是 2.7 g/cm³。</li><li><b>水的密度是 1 g/cm³</b>，這是所有沉浮題的比較標準。</li><li>在 M–V 圖上，<b>斜率＝密度</b>，線越陡密度越大。</li></ol>\n  <figure class="dg"><svg viewBox="0 0 520 230" role="img" aria-label="質量體積關係圖">\n   <g font-family="Noto Sans TC,sans-serif"><path d="M70 30 V190 H470" stroke="var(--ink)" stroke-width="2" fill="none"/><text x="60" y="26" text-anchor="end" fill="var(--muted)" font-size="13">M (g)</text><text x="478" y="206" fill="var(--muted)" font-size="13">V (cm³)</text>\n   <line x1="70" y1="190" x2="250" y2="40" stroke="var(--bad)" stroke-width="4"/><text x="258" y="44" fill="var(--bad)" font-size="14" font-weight="700">甲：D＞1，沉</text>\n   <line x1="70" y1="190" x2="370" y2="70" stroke="var(--earth)" stroke-width="4"/><text x="378" y="74" fill="var(--earth-k)" font-size="14" font-weight="700">水：D＝1</text>\n   <line x1="70" y1="190" x2="440" y2="130" stroke="var(--ok)" stroke-width="4"/><text x="380" y="160" fill="var(--ok)" font-size="14" font-weight="700">丙：D＜1，浮</text></g></svg>\n   <figcaption>圖 2　M–V 圖：線比水陡會沉，比水平會浮。</figcaption></figure>\n  <p>如果物體是<b>空心</b>的，排水法量到的體積包含空心的部分，算出來的是<b>平均密度</b>，會比材料本身小。</p>`,side:[["易錯","D＝M÷V，不要算成 V÷M。答案出現 0.37 這種奇怪的數字時就要檢查。"],["記法","1 mL＝1 cm³，1 L＝1000 cm³。"],["易錯","空心銅球算出來的密度比 8.96 小，不是量錯，是體積包含了空心。（111 會考第 38 題）"]],ex:"p13",exNote:["排開水的體積 V＝銅的體積＋中間空心的體積，比銅本身的體積大。","質量 M 只有銅（真空沒有質量）。","分子一樣、分母變大 → D＝M÷V 變小，所以 D＜8.96。"],pr:"pr9"},{t:"沉浮：比一比誰的密度大",star:"★★",main:`<p>東西放進液體裡會沉還是浮，只要比較<b>物體</b>和<b>液體</b>的密度：</p>\n  <div class="cmp"><table><thead><tr><th>物體密度和液體比</th><th>結果</th><th>例子（放進水裡）</th></tr></thead><tbody>\n   <tr><td>比較大</td><td><b>沉</b></td><td>鐵 7.9、石頭 2.6</td></tr><tr><td>相等</td><td><b>懸浮</b>（停在水中任意位置）</td><td>密度剛好 1 的物體</td></tr><tr><td>比較小</td><td><b>浮</b></td><td>木塊 0.6、油 0.9</td></tr></tbody></table></div>\n  <p>浮在液面的物體，<b>泡在液體裡的那部分</b>占全部的比例，剛好等於兩個密度的比：</p>\n  <div class="formula"><div class="fx"><span>液面下的比例</span>＝<span>物體密度</span>÷<span>液體密度</span></div></div>\n  <figure class="dg"><svg viewBox="0 0 520 190" role="img" aria-label="木塊浮在水面">\n   <g font-family="Noto Sans TC,sans-serif"><rect x="40" y="70" width="440" height="110" fill="var(--earth)" opacity=".22"/><line x1="40" y1="70" x2="480" y2="70" stroke="var(--earth)" stroke-width="2.5"/>\n   <rect x="190" y="40" width="110" height="100" fill="var(--sc)" opacity=".85" stroke="var(--ink)" stroke-width="2"/>\n   <path d="M320 40 V70" stroke="var(--ink)" stroke-width="2"/><path d="M320 70 V140" stroke="var(--earth)" stroke-width="2"/>\n   <text x="330" y="60" fill="var(--ink)" font-size="14" font-weight="700">露出 2 成</text><text x="330" y="112" fill="var(--earth-k)" font-size="14" font-weight="700">水下 8 成＝0.8÷1</text>\n   <text x="60" y="30" fill="var(--ink)" font-size="14" font-weight="700">木塊密度 0.8 g/cm³</text></g></svg>\n   <figcaption>圖 3　密度 0.8 的木塊，8 成在水面下、2 成露出。</figcaption></figure>`,side:[["判斷技巧","看到標示「500 mL、520 g」：520÷500＝1.04＞1，應該會沉。說會浮就是矛盾。"],["易錯","題目問「露出」的比例時，要用 1 減掉水下比例。"],["生活實例","冰山只露出一小角，因為冰的密度（0.92）很接近海水。"]],ex:"p22",exNote:["mL 是體積、g 是質量，所以標示的密度＝520÷500＝1.04 g/cm³。","黑麻油會浮在水面 → 密度要小於 1。","1.04＞1 和事實矛盾 → 不合理。浮在水上的油，g 的數字應該比 mL 小。"],pr:"m1"},{t:"濃度：溶質占全部的幾成",star:"★★★",main:`<p>一杯糖水裡，<b>糖是溶質</b>、<b>水是溶劑</b>，兩個加起來是<b>溶液</b>。濃度就是問：溶質占整杯溶液的幾成。</p>\n  <div class="formula"><div class="fx"><span>重量百分濃度</span>＝<span>溶質</span>÷<span>溶液</span>×100%</div>\n   <div class="fl"><div><b>溶液</b>溶質＋溶劑<small>分母一定是「全部」</small></div><div><b>ppm</b>溶質÷溶液×10⁶<small>百萬分之一，用在很稀的時候</small></div></div></div>\n  <figure class="dg"><svg viewBox="0 0 520 120" role="img" aria-label="溶質與溶液比例">\n   <g font-family="Noto Sans TC,sans-serif" text-anchor="middle"><rect x="40" y="30" width="88" height="44" fill="var(--sc)"/><rect x="128" y="30" width="352" height="44" fill="var(--earth)" opacity=".3"/>\n   <text x="84" y="58" fill="var(--on-sc,#fff)" font-size="14" font-weight="700">糖 20 g</text><text x="304" y="58" fill="var(--earth-k)" font-size="14" font-weight="700">水 80 g</text>\n   <path d="M40 90 H480" stroke="var(--ink)" stroke-width="2"/><text x="260" y="112" fill="var(--ink)" font-size="14" font-weight="700">溶液 100 g → 濃度＝20÷100＝20%</text></g></svg>\n   <figcaption>圖 4　分母是整條（溶液），不是藍色那段（水）。</figcaption></figure>\n  <p><b>稀釋</b>只是加水，溶質一克都沒有變多或變少，所以：</p>\n  <p class="law"><span>稀釋前後溶質不變</span>原來的濃度 × 原來的溶液重＝<em>新的濃度 × 新的溶液重</em></p>\n  <p>例：200 g 的 20% 食鹽水含鹽 40 g，加 200 g 水變成 400 g，濃度＝40÷400＝<b>10%</b>。</p>`,side:[["易錯","20 g 糖溶在 20 g 水是 50%，不是 100%。分母是 40 g 溶液。（115 會考第 36 題）"],["易錯","算 ppm 前先把單位換成一樣：30 mg 在 1000 g 中＝30 mg 在 1,000,000 mg 中＝30 ppm。（114 會考第 11 題）"],["口訣","加水不加鹽，鹽的克數不會變。"]],ex:"p63",exNote:["甲：溶質 20 g，溶液＝20＋20＝40 g → 20÷40＝50%。","乙：溶質 30 g，溶液＝30＋20＝50 g → 30÷50＝60%。","甲：乙＝50：60＝5：6。"],pr:"m2"},{t:"溶解度與混合物分離",star:"★★",main:`<p>水不能無限溶東西。<b>溶解度</b>是指：在某個溫度下，<b>100 g 水</b>最多能溶多少克溶質。溶到不能再溶，就叫<b>飽和溶液</b>。</p>\n  <ol class="pts"><li>多數<b>固體</b>：溫度越高，溶解度越大。</li><li><b>氣體</b>剛好相反：溫度越高越難溶（汽水放熱了會沒氣）。</li><li>飽和溶液降溫時，溶不下的部分會變成晶體跑出來，叫<b>析出</b>。</li></ol>\n  <figure class="dg"><svg viewBox="0 0 520 230" role="img" aria-label="溶解度曲線降溫析出">\n   <g font-family="Noto Sans TC,sans-serif"><path d="M70 20 V190 H470" stroke="var(--ink)" stroke-width="2" fill="none"/><text x="60" y="18" text-anchor="end" fill="var(--muted)" font-size="12">溶解度(g/100 g 水)</text><text x="470" y="210" text-anchor="end" fill="var(--muted)" font-size="12">溫度(℃)</text>\n   <path d="M70 175 Q260 150 420 40" stroke="var(--sc)" stroke-width="4" fill="none"/>\n   <line x1="170" y1="190" x2="170" y2="160" stroke="var(--muted)" stroke-dasharray="4 4"/><line x1="370" y1="190" x2="370" y2="78" stroke="var(--muted)" stroke-dasharray="4 4"/>\n   <text x="170" y="206" text-anchor="middle" fill="var(--muted)" font-size="12">20</text><text x="370" y="206" text-anchor="middle" fill="var(--muted)" font-size="12">60</text>\n   <line x1="70" y1="78" x2="370" y2="78" stroke="var(--muted)" stroke-dasharray="4 4"/><line x1="70" y1="162" x2="170" y2="162" stroke="var(--muted)" stroke-dasharray="4 4"/>\n   <circle cx="170" cy="162" r="5" fill="var(--ink)"/><circle cx="370" cy="78" r="5" fill="var(--ink)"/><text x="64" y="166" text-anchor="end" fill="var(--ink)" font-size="13" font-weight="700">32</text><text x="64" y="82" text-anchor="end" fill="var(--ink)" font-size="13" font-weight="700">110</text>\n   <path d="M95 82 V158" stroke="var(--bad)" stroke-width="3" marker-start="url(#ah)" marker-end="url(#ah)"/>${AH}<text x="106" y="118" fill="var(--bad)" font-size="13" font-weight="700">析出 110－32＝78 g</text></g></svg>\n   <figcaption>圖 5　從 60℃ 降到 20℃：兩個溶解度相減就是析出量（以 100 g 水計）。</figcaption></figure>\n  <p>要把混在一起的東西分開，就看它們哪裡<b>不一樣</b>：</p>\n  <div class="cmp"><table><thead><tr><th>方法</th><th>利用什麼不同</th><th>例子</th></tr></thead><tbody>\n   <tr><th>過濾</th><td>溶不溶於水</td><td>泥沙和水</td></tr><tr><th>蒸發・結晶</th><td>溶質留下、水跑掉</td><td>海水曬鹽</td></tr><tr><th>蒸餾</th><td>沸點不同</td><td>海水變純水、酒精和水</td></tr><tr><th>層析</th><td>在濾紙上跑的速度不同</td><td>分開墨水裡的色素</td></tr></tbody></table></div>`,side:[["解題步驟","題目給「飽和溶液 210 g」時，先拆成「100 g 水＋110 g 溶質」，再算析出量。水不是 100 g 就按比例放大縮小。"],["易錯","鹽溶在水裡，用過濾分不開；要用蒸發或蒸餾。"],["物理 vs 化學變化","有新物質產生才是化學變化（燃燒、生鏽、腐壞）；溶解、熔化、蒸發都是物理變化。"]],ex:"m3",exNote:["60℃ 飽和溶液 210 g＝100 g 水＋110 g 溶質。","降到 20℃，100 g 水只能溶 32 g。","溶不下的就析出：110－32＝78 g。"],pr:"m4"}],end:["p43","fig20","fig21","pr5","pr6","pr4"],sumT:"本章公式一次整理",sumH:["","公式","重點","最常錯"],summary:[["密度","D＝M÷V","物質特性，水＝1 g/cm³","空心物體算出平均密度較小"],["沉浮","比物體和液體密度","液面下比例＝物體密度÷液體密度","問露出要用 1 去減"],["濃度","溶質÷溶液×100%","ppm＝溶質÷溶液×10⁶","分母寫成水"],["稀釋","C₁W₁＝C₂W₂","溶質質量不變","忘了溶液重量也變了"],["析出量","兩溫度溶解度相減","以 100 g 水為準","水不是 100 g 沒換算比例"]]};REF[2]={intro:"丟一顆石頭進池塘，水波一圈圈往外跑，但水上的樹葉只在原地上下晃。這一章就是在說：<b>波傳的是能量，不是物質</b>。聲音也是一種波，會考每年固定 1 題，幾乎都考<b>聲音三要素</b>和<b>波速公式</b>。",map:mkMap("波動與聲音",[["波的種類","橫波・縱波・力學波","★★",[["橫波","繩波"],["縱波","聲波"]]],["描述波","週期・頻率・波長","★★",[["v＝fλ",""],["f＝1/T",""]]],["聲音的傳播","介質・聲速・回聲","★★"],["聲音三要素","響度・音調・音色","★★★"]]),table:[["波的種類與介質","★★","113-18"],["週期、頻率與波速","★★","111-34"],["聲音的傳播、回聲、超聲波","★★","114-1"],["聲音三要素","★★★","112-13、115-16"]],cs:[{t:"波：傳的是能量，不是東西",star:"★★",main:`<p>甩一下繩子，一個凸起會沿著繩子跑過去，但繩子本身沒有跑走。像繩子、水、空氣這種<b>讓波通過的物質，叫介質</b>。</p>\n  <p class="law"><span>波的本質</span>波傳遞的是<em>能量</em>；介質只在原地<em>來回振動</em>，不會跟著波往前跑。</p>\n  <p>依照「介質振動的方向」和「波前進的方向」，波分成兩種：</p>\n  <figure class="dg"><svg viewBox="0 0 520 245" role="img" aria-label="橫波與縱波">${AH}\n   <g font-family="Noto Sans TC,sans-serif"><text x="20" y="30" fill="var(--ink)" font-size="15" font-weight="900">橫波</text><text x="70" y="30" fill="var(--muted)" font-size="13">振動 ⊥ 前進（繩波）</text>\n   <path d="M30 80 Q60 40 90 80 T150 80 T210 80 T270 80 T330 80" stroke="var(--sc)" stroke-width="4" fill="none"/>\n   <path d="M360 80 H440" stroke="var(--ink)" stroke-width="3" marker-end="url(#ah)"/><text x="400" y="70" text-anchor="middle" fill="var(--ink)" font-size="13">前進</text>\n   <path d="M90 50 V110" stroke="var(--bad)" stroke-width="3" marker-start="url(#ah)" marker-end="url(#ah)"/><text x="100" y="124" fill="var(--bad)" font-size="13">振動</text>\n   <text x="20" y="160" fill="var(--ink)" font-size="15" font-weight="900">縱波</text><text x="70" y="160" fill="var(--muted)" font-size="13">振動 ∥ 前進（聲波）</text>\n   ${[30,38,46,54,62,100,116,132,148,164,200,208,216,224,232,270,286,302,318,334].map(t=>`<line x1="${t}" y1="178" x2="${t}" y2="218" stroke="var(--sc)" stroke-width="3"/>`).join("")}\n   <text x="46" y="232" text-anchor="middle" fill="var(--muted)" font-size="12">密</text><text x="132" y="232" text-anchor="middle" fill="var(--muted)" font-size="12">疏</text>\n   <path d="M360 198 H440" stroke="var(--ink)" stroke-width="3" marker-end="url(#ah)"/><path d="M455 198 H505" stroke="var(--bad)" stroke-width="3" marker-start="url(#ah)" marker-end="url(#ah)"/><text x="480" y="225" text-anchor="middle" fill="var(--bad)" font-size="13">振動</text></g></svg>\n   <figcaption>圖 1　橫波上下抖，縱波前後擠，形成一疏一密。</figcaption></figure>\n  <p>需要介質才能傳的波叫<b>力學波</b>（水波、繩波、聲波、超聲波）。<b>光</b>屬於電磁波，不需要介質，在真空也能傳，所以我們看得到太陽。</p>`,side:[["生活實例","體育館的「人浪」：每個人只在原地站起坐下，波卻繞了整圈。"],["易錯","光是橫波，但不是力學波；聲波是縱波，而且是力學波。兩種分類不要混在一起。"],["判斷技巧","題目說「不需要介質」，就和光同一類，不是力學波。（113 會考第 18 題）"]],ex:"p35",exNote:["力學波一定要有介質才能傳，例如水波、聲波、超聲波。","題目說重力波「不需要介質」→ 不是力學波。","光（電磁波）也不需要介質，所以重力波和光一樣，都不屬於力學波。"],pr:"pr13"},{t:"描述一個波：週期、頻率、波長、波速",star:"★★",main:`<p>描述一個波，要用四個量。先看圖認識前三個：</p>\n  <figure class="dg"><svg viewBox="0 0 520 190" role="img" aria-label="波長與振幅">${AH}\n   <g font-family="Noto Sans TC,sans-serif"><line x1="20" y1="100" x2="500" y2="100" stroke="var(--muted)" stroke-dasharray="5 5"/>\n   <path d="M20 100 Q65 20 110 100 T200 100 T290 100 T380 100 T470 100" stroke="var(--sc)" stroke-width="4" fill="none"/>\n   <path d="M65 40 H245" stroke="var(--earth)" stroke-width="2.5" marker-start="url(#ah)" marker-end="url(#ah)"/><text x="155" y="32" text-anchor="middle" fill="var(--earth-k)" font-size="14" font-weight="700">波長 λ（波峰到波峰）</text>\n   <path d="M425 100 V64" stroke="var(--bad)" stroke-width="2.5" marker-end="url(#ah)"/><text x="415" y="44" text-anchor="end" fill="var(--bad)" font-size="14" font-weight="700">振幅（中線到波峰）</text>\n   <text x="20" y="170" fill="var(--muted)" font-size="13">週期 T：振動一次要幾秒　頻率 f：一秒振動幾次（Hz）</text></g></svg>\n   <figcaption>圖 2　振幅是從中線量，不是從波谷量到波峰。</figcaption></figure>\n  <div class="formula"><div class="fx"><span>v</span>＝<span>f</span>×<span>λ</span></div>\n   <div class="fl"><div><b>v</b>波速<small>m/s</small></div><div><b>f</b>頻率<small>Hz＝1/s</small></div><div><b>λ</b>波長<small>m</small></div></div></div>\n  <ol class="pts"><li><b>f＝1÷T</b>：週期 0.2 秒，頻率就是 5 Hz。</li><li><b>頻率由波源決定</b>。聲音從空氣傳進水裡，頻率不變，是波速和波長一起變。</li></ol>`,side:[["找週期的技巧","找某一點「回到同一個位置、而且往同一個方向動」的時間。只回到同高度但方向相反，才過了半個週期。"],["易錯","v＝f×λ 是相乘。選項有相除、相加的數字，都是陷阱。"]],ex:"p11",exNote:["0 秒時高度 5.0（最高點），之後往下走。","下一次回到 5.0 是 3.0×10⁻² 秒，而且之後同樣往下走。","中間 1.5×10⁻² 秒是最低點（－5.0），只過了半個週期。","所以週期＝3.0×10⁻² s。"],pr:"m6"},{t:"聲音怎麼傳：介質、聲速、回聲",star:"★★",main:`<p>聲音是發聲體<b>振動</b>，推擠旁邊的空氣，一層傳一層到耳朵。所以聲音是<b>縱波</b>，而且一定要有介質。</p>\n  <div class="cmp"><table><thead><tr><th>介質</th><th>真空</th><th>氣體</th><th>液體</th><th>固體</th></tr></thead><tbody><tr><th>能不能傳</th><td><b>不能</b></td><td colspan="3">都可以</td></tr><tr><th>聲速</th><td>—</td><td>最慢（約 340 m/s）</td><td>較快</td><td><b>最快</b></td></tr></tbody></table></div>\n  <p>空氣溫度越高，分子動得越快，聲音也傳得越快：<b>聲速約＝331＋0.6×氣溫（m/s）</b>。</p>\n  <p>聲音碰到牆壁或山壁會反彈回來，就是<b>回聲</b>。聽到回聲的時間，是聲音<b>來回</b>走一趟的時間：</p>\n  <figure class="dg"><svg viewBox="0 0 520 150" role="img" aria-label="回聲來回">${AH}\n   <g font-family="Noto Sans TC,sans-serif"><circle cx="60" cy="60" r="12" fill="var(--sc)"/><path d="M60 72 V115 M45 88 H75 M60 115 L48 138 M60 115 L72 138" stroke="var(--sc)" stroke-width="5" stroke-linecap="round"/>\n   <rect x="440" y="20" width="40" height="120" fill="var(--muted)" opacity=".5"/>\n   <path d="M90 60 H430" stroke="var(--bad)" stroke-width="3" marker-end="url(#ah)"/><path d="M430 90 H90" stroke="var(--earth)" stroke-width="3" marker-end="url(#ah)"/>\n   <text x="260" y="50" text-anchor="middle" fill="var(--bad)" font-size="13" font-weight="700">去</text><text x="260" y="112" text-anchor="middle" fill="var(--earth-k)" font-size="13" font-weight="700">回</text>\n   <text x="260" y="140" text-anchor="middle" fill="var(--ink)" font-size="14" font-weight="700">距離＝聲速×時間÷2</text></g></svg>\n   <figcaption>圖 3　回聲的時間是「去＋回」，距離要除以 2。</figcaption></figure>\n  <p>人耳只聽得到大約 <b>20～20000 Hz</b>。高於 20000 Hz 的叫<b>超聲波</b>（產檢、蝙蝠、聲納），低於 20 Hz 的叫<b>次聲波</b>。</p>`,side:[["易錯","超聲波聽不到是因為「頻率太高」，不是速度太快。它在空氣中的速度和一般聲音一樣。（114 會考第 1 題）"],["易錯","回聲題最常忘記除以 2。"],["生活實例","太空中聽不到爆炸聲，因為沒有介質。"]],ex:"p39",exNote:["人耳可聽的範圍大約是 20～20000 Hz。","超聲波頻率超過 20000 Hz，超出範圍 → 聽不見。","選項 D 說「波速過快」是陷阱：超聲波的速度和一般聲音差不多，聽不見跟速度無關。"],pr:"m7"},{t:"聲音三要素：響度、音調、音色",star:"★★★",main:`<p>聽到一個聲音，我們會分辨三件事：大不大聲、高不高音、像不像某個人。這就是<b>聲音三要素</b>，每一個都對應到波的一個特徵。</p>\n  <figure class="dg"><svg viewBox="0 0 520 230" role="img" aria-label="聲音三要素波形比較">\n   <g font-family="Noto Sans TC,sans-serif">\n   <text x="10" y="40" fill="var(--ink)" font-size="14" font-weight="900">響度</text><path d="M70 40 Q85 25 100 40 T130 40 T160 40 T190 40" stroke="var(--muted)" stroke-width="3" fill="none"/><path d="M230 40 Q245 5 260 40 T290 40 T320 40 T350 40" stroke="var(--sc)" stroke-width="3" fill="none"/><text x="370" y="45" fill="var(--accent)" font-size="13" font-weight="700">振幅大 → 大聲</text>\n   <text x="10" y="120" fill="var(--ink)" font-size="14" font-weight="900">音調</text><path d="M70 120 Q85 100 100 120 T130 120 T160 120 T190 120" stroke="var(--muted)" stroke-width="3" fill="none"/><path d="M230 120 Q237 100 245 120 T260 120 T275 120 T290 120 T305 120 T320 120 T335 120 T350 120" stroke="var(--sc)" stroke-width="3" fill="none"/><text x="370" y="125" fill="var(--accent)" font-size="13" font-weight="700">頻率高 → 高音</text>\n   <text x="10" y="200" fill="var(--ink)" font-size="14" font-weight="900">音色</text><path d="M70 200 Q85 180 100 200 T130 200 T160 200 T190 200" stroke="var(--muted)" stroke-width="3" fill="none"/><path d="M230 200 L240 182 L248 205 L258 186 L270 200 L280 182 L288 205 L298 186 L310 200 L320 182 L328 205 L338 186 L350 200" stroke="var(--sc)" stroke-width="3" fill="none"/><text x="370" y="205" fill="var(--accent)" font-size="13" font-weight="700">波形不同 → 音色不同</text></g></svg>\n   <figcaption>圖 4　灰色是原本的聲音，彩色是改變後的聲音。</figcaption></figure>\n  <div class="cmp"><table><thead><tr><th>要素</th><th>決定於</th><th>單位</th><th>生活中的說法</th></tr></thead><tbody>\n   <tr><th>響度</th><td>振幅</td><td><b>dB（分貝）</b></td><td>很吵、很大聲</td></tr><tr><th>音調</th><td>頻率</td><td><b>Hz（赫茲）</b></td><td>很尖、很低沉</td></tr><tr><th>音色</th><td>波形</td><td>—</td><td>聽得出是誰、什麼樂器</td></tr></tbody></table></div>\n  <p>弦樂器的音調：弦<b>越緊、越短、越細</b>，振動越快，頻率越高，音調越高。</p>`,side:[["口訣","大不大聲看振幅（dB），高不高音看頻率（Hz），像不像誰看波形。"],["易錯","抱怨「很大聲」要用 dB，不是 Hz。（115 會考第 16 題）"],["易錯","用力撥弦是讓響度變大，不是音調變高。"]],ex:"p58",exNote:["「很大聲」講的是響度。","響度看振幅，單位是 dB（分貝）。","Hz 和「振動一次 0.004 秒」說的是音調（頻率），340 m/s 是聲速，都不是大小聲。"],pr:"m8"}],end:["fig22","m9","pr15","pr17","pr19"],sumT:"本章重點一次整理",sumH:["","是什麼","單位／公式","最常錯"],summary:[["波","傳能量，介質原地振動","v＝f×λ，f＝1÷T","以為介質會跟著跑"],["力學波","需要介質","水波、聲波、超聲波","把光當成力學波"],["回聲","聲音碰壁反彈","距離＝v×t÷2","忘了除以 2"],["響度","振幅","dB","和音調混淆"],["音調","頻率","Hz","超聲波聽不到怪速度"],["音色","波形","—","以為和大小聲有關"]]};REF[3]={intro:"我們能看到東西，是因為<b>光進到眼睛裡</b>。光平常走直線，碰到鏡子會<b>反射</b>，穿過水或玻璃會<b>折射</b>，透鏡就是利用折射來成像。會考每年 1 題，最常考：<b>角度要從法線量</b>、<b>凸透鏡成像表</b>、<b>色光下的顏色</b>。",map:mkMap("光與顏色",[["光的直進","影子・針孔成像","★"],["反射","反射定律・面鏡","★★",[["平面鏡",""],["凹凸面鏡",""]]],["折射","偏向法線・全反射","★★"],["透鏡成像","凸透鏡成像表","★★★"],["色光","色散・物體顏色","★★"]]),table:[["光的直進與看見物體","★","111-14、112-9"],["反射定律與面鏡","★★","115-5"],["折射與全反射","★★","課本基本題"],["凸透鏡成像","★★★","113-36"],["色散與物體的顏色","★★","114-14"]],cs:[{t:"光走直線：影子與針孔成像",star:"★",main:`<p>在同一種均勻的物質裡，光<b>沿直線前進</b>。所以手擋住光會有影子，而且可以做出針孔成像。</p>\n  <figure class="dg"><svg viewBox="0 0 520 190" role="img" aria-label="針孔成像">\n   <g font-family="Noto Sans TC,sans-serif"><path d="M60 50 L70 30 L80 50 Z" fill="var(--sc)"/><rect x="66" y="50" width="8" height="80" fill="var(--sc)"/>\n   <rect x="250" y="20" width="8" height="66" fill="var(--ink)"/><rect x="250" y="94" width="8" height="76" fill="var(--ink)"/>\n   <line x1="70" y1="30" x2="430" y2="150" stroke="var(--bad)" stroke-width="2"/><line x1="70" y1="130" x2="430" y2="58" stroke="var(--earth)" stroke-width="2"/>\n   <rect x="430" y="20" width="6" height="150" fill="var(--muted)"/>\n   <path d="M424 150 L414 170 L404 150 Z" fill="var(--sc)" transform="translate(4 0)"/><rect x="410" y="58" width="8" height="92" fill="var(--sc)" opacity=".7"/>\n   <text x="254" y="186" text-anchor="middle" fill="var(--muted)" font-size="13">小孔</text><text x="470" y="100" fill="var(--ink)" font-size="13" font-weight="700">倒立</text><text x="470" y="118" fill="var(--ink)" font-size="13" font-weight="700">實像</text></g></svg>\n   <figcaption>圖 1　上面的光走到下面、下面的光走到上面，所以像是倒立的。</figcaption></figure>\n  <ol class="pts"><li>針孔成像是<b>倒立的實像</b>，像的形狀由<b>物體</b>決定，和孔是圓的還是三角形的無關。</li><li>光通過針孔<b>沒有轉彎</b>。放大鏡、三稜鏡（折射）、後照鏡（反射）都會改變光的方向。</li></ol>\n  <p>除了太陽、燈泡這種<b>自己會發光</b>的光源，其他東西（月亮、人、書）都是<b>反射</b>光源的光進到眼睛，我們才看得見。</p>`,side:[["易錯","觀眾看見演員，是演員「反射」聚光燈的光，不是吸收、也不是折射。（112 會考第 9 題）"],["易錯","把針孔改成三角形，像不會變成三角形。"]],ex:"p5",exNote:["針孔成像：光沿直線穿過小孔，方向沒變。","放大鏡、三稜鏡 → 折射，會轉彎；後照鏡 → 反射，會轉彎。","所以不會改變光方向的只有針孔。"],pr:"pr28"},{t:"反射：入射角＝反射角",star:"★★",main:`<p>光碰到鏡子會彈回來。先在碰到的那一點畫一條和鏡面垂直的線，叫<b>法線</b>，所有角度都從法線量。</p>\n  <p class="law"><span>反射定律</span><em>入射角＝反射角</em>，而且入射光、反射光、法線在同一個平面上。</p>\n  <figure class="dg"><svg viewBox="0 0 520 200" role="img" aria-label="反射定律">${AH}\n   <g font-family="Noto Sans TC,sans-serif"><line x1="60" y1="170" x2="460" y2="170" stroke="var(--ink)" stroke-width="4"/><line x1="260" y1="170" x2="260" y2="20" stroke="var(--muted)" stroke-width="2" stroke-dasharray="6 5"/><text x="268" y="30" fill="var(--muted)" font-size="13">法線</text>\n   <line x1="140" y1="50" x2="258" y2="168" stroke="var(--sc)" stroke-width="4" marker-end="url(#ah)"/><line x1="262" y1="168" x2="380" y2="50" stroke="var(--sc)" stroke-width="4" marker-end="url(#ah)"/>\n   <path d="M228 138 A42 42 0 0 1 260 128" stroke="var(--bad)" stroke-width="2.5" fill="none"/><text x="212" y="118" fill="var(--bad)" font-size="14" font-weight="700">入射角</text>\n   <path d="M260 128 A42 42 0 0 1 292 138" stroke="var(--bad)" stroke-width="2.5" fill="none"/><text x="276" y="118" fill="var(--bad)" font-size="14" font-weight="700">反射角</text>\n   <text x="60" y="192" fill="var(--earth-k)" font-size="13" font-weight="700">注意：光和鏡面的夾角不是入射角</text></g></svg>\n   <figcaption>圖 2　角度從法線量。和鏡面夾 30°，入射角是 90°－30°＝60°。</figcaption></figure>\n  <div class="cmp"><table><thead><tr><th>鏡子</th><th>對光的作用</th><th>成像</th><th>用途</th></tr></thead><tbody>\n   <tr><th>平面鏡</th><td>—</td><td>正立、等大、左右相反虛像；像距＝物距</td><td>穿衣鏡</td></tr>\n   <tr><th>凹面鏡</th><td><b>會聚</b>光線</td><td>看物體位置</td><td>手電筒、衛星天線</td></tr>\n   <tr><th>凸面鏡</th><td><b>發散</b>光線</td><td>正立、縮小虛像，<b>視野大</b></td><td>後照鏡、路口反光鏡</td></tr></tbody></table></div>`,side:[["易錯","題目給光和「鏡面」的夾角時，要先用 90° 減，才是入射角。"],["解題技巧","平面鏡：人到像的距離＝人到鏡子距離 × 2。人走近 0.5 m，人和像就近 1 m。"],["易錯","入射光和反射光的夾角＝入射角 × 2，不是入射角。"]],ex:"fig23",exNote:["圖上 40° 是光和「鏡面」的夾角。","入射角從法線量：90°－40°＝50°。","反射角＝入射角＝50°。"],pr:"m11"},{t:"折射：換跑道會轉彎",star:"★★",main:`<p>光從一種物質斜斜進入另一種物質時，速度改變，方向也會轉彎，這叫<b>折射</b>。光在空氣中最快，在水、玻璃中比較慢。</p>\n  <p class="law"><span>折射的方向</span>從快到慢（空氣 → 水）：<em>偏向法線</em>，折射角＜入射角。<br>從慢到快（水 → 空氣）：<em>偏離法線</em>，折射角＞入射角。</p>\n  <figure class="dg"><svg viewBox="0 0 520 220" role="img" aria-label="光從空氣進入水中折射">${AH}\n   <g font-family="Noto Sans TC,sans-serif"><rect x="40" y="110" width="440" height="100" fill="var(--earth)" opacity=".22"/><line x1="40" y1="110" x2="480" y2="110" stroke="var(--earth)" stroke-width="2.5"/>\n   <line x1="260" y1="20" x2="260" y2="205" stroke="var(--muted)" stroke-width="2" stroke-dasharray="6 5"/>\n   <line x1="150" y1="20" x2="258" y2="108" stroke="var(--sc)" stroke-width="4" marker-end="url(#ah)"/><line x1="260" y1="110" x2="315" y2="200" stroke="var(--sc)" stroke-width="4" marker-end="url(#ah)"/>\n   <line x1="260" y1="110" x2="350" y2="183" stroke="var(--muted)" stroke-width="2" stroke-dasharray="4 4"/><text x="356" y="190" fill="var(--muted)" font-size="12">沒轉彎的話</text>\n   <text x="60" y="40" fill="var(--ink)" font-size="14" font-weight="700">空氣（快）</text><text x="60" y="200" fill="var(--earth-k)" font-size="14" font-weight="700">水（慢）</text>\n   <text x="325" y="135" fill="var(--accent)" font-size="13" font-weight="700">偏向法線</text></g></svg>\n   <figcaption>圖 3　空氣 → 水：光往法線靠。</figcaption></figure>\n  <p>光從水射向空氣時，入射角越大，折射光越貼近水面。入射角超過<b>臨界角</b>，光就完全反射回水裡，叫<b>全反射</b>。光纖、鑽石閃亮都是全反射。</p>`,side:[["口訣","進慢的物質靠法線，進快的物質離法線。"],["易錯","全反射要從「密到疏」（水、玻璃 → 空氣）。光從空氣射進水不會全反射。"],["生活實例","筷子插在水裡看起來彎了、泳池看起來比實際淺，都是折射。"]],ex:"fig24",exNote:["光從空氣（快）進入水（慢）。","速度變慢 → 偏向法線 → 折射角比入射角小。","甲是偏向法線的路徑；乙沒轉彎（只有垂直射入才會）；丙偏離法線，是水 → 空氣才會發生。"],pr:"m13"},{t:"凸透鏡成像：一張表搞定",star:"★★★",main:`<p>凸透鏡中間厚、邊緣薄，會把平行光<b>會聚</b>到一點，叫<b>焦點 F</b>，焦點到透鏡的距離叫<b>焦距 f</b>。物體放在不同位置，成的像不一樣：</p>\n  <figure class="dg"><svg viewBox="0 0 560 190" role="img" aria-label="凸透鏡物體位置">\n   <g font-family="Noto Sans TC,sans-serif" text-anchor="middle"><line x1="20" y1="110" x2="540" y2="110" stroke="var(--muted)" stroke-width="2"/>\n   <path d="M420 30 Q440 110 420 190 Q400 110 420 30 Z" fill="var(--earth)" opacity=".35" stroke="var(--earth)" stroke-width="2"/>\n   ${[[300,"F"],[180,"2F"]].map(([t,e])=>`<circle cx="${t}" cy="110" r="5" fill="var(--ink)"/><text x="${t}" y="134" fill="var(--ink)" font-size="14" font-weight="700">${e}</text>`).join("")}\n   <text x="100" y="60" fill="var(--accent)" font-size="13" font-weight="700">2F 外</text><text x="100" y="78" fill="var(--muted)" font-size="12">倒立縮小實像</text><text x="100" y="96" fill="var(--muted)" font-size="12">照相機</text>\n   <text x="240" y="60" fill="var(--accent)" font-size="13" font-weight="700">F～2F</text><text x="240" y="78" fill="var(--muted)" font-size="12">倒立放大實像</text><text x="240" y="96" fill="var(--muted)" font-size="12">投影機</text>\n   <text x="360" y="60" fill="var(--accent)" font-size="13" font-weight="700">F 以內</text><text x="360" y="78" fill="var(--muted)" font-size="12">正立放大虛像</text><text x="360" y="96" fill="var(--muted)" font-size="12">放大鏡</text>\n   <text x="180" y="166" fill="var(--muted)" font-size="12">剛好 2F：倒立等大</text><text x="300" y="166" fill="var(--muted)" font-size="12">剛好 F：不成像</text></g></svg>\n   <figcaption>圖 4　物體從左往右靠近透鏡：像越來越大，跨過 F 就變成正立虛像。</figcaption></figure>\n  <ol class="pts"><li><b>實像</b>是光真的會聚而成，可以用紙屏接到，一定<b>倒立</b>。</li><li><b>虛像</b>接不到，只能透過透鏡看，一定<b>正立</b>。</li><li>物體越靠近焦點，像越大、像距越遠。</li></ol>\n  <p>凹透鏡會讓光<b>發散</b>，只成正立縮小虛像。<b>近視</b>戴凹透鏡、<b>遠視和老花</b>戴凸透鏡。</p>`,side:[["口訣","2F 外照相、F 到 2F 投影、F 內放大鏡。"],["判斷技巧","題目給焦距和物距，先算 2f，再看物體落在哪一段。"],["易錯","放大鏡要把東西放在焦點「以內」，不是焦點外。"]],ex:"fig5",exNote:["焦距 10 cm → F 在 10 cm、2F 在 20 cm。","物體在 15 cm，落在 F 和 2F 之間。","查表：倒立、放大的實像（投影機的原理）。"],pr:"m12"},{t:"色光：物體為什麼有顏色",star:"★★",main:`<p>白光通過三稜鏡會分成<b>紅橙黃綠藍靛紫</b>，叫<b>色散</b>。紫光偏折最多、紅光最少，彩虹也是這樣來的。</p>\n  <p class="law"><span>物體的顏色</span>不透明物體的顏色，就是它<em>反射</em>的色光；其他顏色都被它<em>吸收</em>。</p>\n  <div class="cmp"><table><thead><tr><th>物體（白光下）</th><th>白光照</th><th>紅光照</th><th>綠光照</th></tr></thead><tbody>\n   <tr><th>白色（全反射）</th><td>白</td><td><b>紅</b></td><td><b>綠</b></td></tr><tr><th>紅色（只反射紅）</th><td>紅</td><td><b>紅</b></td><td><b>黑</b></td></tr><tr><th>綠色（只反射綠）</th><td>綠</td><td><b>黑</b></td><td><b>綠</b></td></tr><tr><th>黑色（全吸收）</th><td>黑</td><td>黑</td><td>黑</td></tr></tbody></table></div>\n  <p>所以在紅光下看起來是紅色的，<b>可能是紅球，也可能是白球</b>；看起來是黑色的，可能是黑、綠、藍等任何不反射紅光的顏色。</p>`,side:[["易錯","紅光下的紅球，在白光下可能是白球。（114 會考第 14 題）"],["口訣","照到什麼光，只能反射那個光；反射不了，就是黑。"],["生活實例","舞台燈換顏色，演員衣服的顏色也跟著變。"]],ex:"p44",exNote:["紅光下看起來紅 → 會反射紅光 → 白光下可能是紅球或白球。所以兩顆「紅」可能都是白球。","紅光下看起來黑 → 不反射紅光 → 可能是黑、綠、藍……，不可能是白球。","所以白球最多 2 顆。其他選項說「至少」、「最多兩顆綠球」都不一定成立。"],pr:"pr23"}],end:["p15","m10","m14","pr25","pr26","pr24"],sumT:"三種「光轉彎」一次比較",sumH:["","發生在","規則","例子"],summary:[["反射","碰到鏡面彈回","入射角＝反射角（從法線量）","鏡子、後照鏡"],["折射","進入不同物質","進慢的靠法線，進快的離法線","筷子看起來彎、透鏡"],["全反射","密 → 疏，角度超過臨界角","光全部反射回來","光纖"],["色散","白光通過三稜鏡","紫光偏最多、紅光最少","彩虹"]]};REF[4]={intro:"「溫度」和「熱」不是同一件事：<b>溫度</b>是冷熱的程度，<b>熱</b>是一種會從高溫流到低溫的能量。這一章近兩年題數變多（115 年考了 3 題），重點是<b>比熱的比較方法</b>、<b>加熱曲線的平台</b>和<b>三態變化的名稱</b>。",map:mkMap("溫度與熱",[["溫標","℃・℉・K","★"],["熱量","H＝msΔT","★★"],["比熱","溫度的固執程度","★★★"],["熱的傳播","傳導・對流・輻射","★"],["三態與潛熱","平台・凝結汽化","★★★"]]),table:[["溫標換算","★","課本基本題"],["熱量 H＝msΔT","★★","111-28"],["比熱的比較","★★★","114-26、115-30"],["熱的傳播","★","112-6"],["三態變化與潛熱","★★★","113-27、114-40、115-9"]],cs:[{t:"溫標：同一個溫度，三種說法",star:"★",main:`<p>溫度計上的數字要有一個標準，這個標準叫<b>溫標</b>。三種溫標用的「起點」和「格子大小」不一樣：</p>\n  <figure class="dg"><svg viewBox="0 0 520 210" role="img" aria-label="三種溫標比較">\n   <g font-family="Noto Sans TC,sans-serif" text-anchor="middle">\n   ${[[110,"攝氏 ℃","0","100"],[260,"華氏 ℉","32","212"],[410,"絕對 K","273","373"]].map(([t,e,a,i])=>`<rect x="${t-14}" y="30" width="28" height="140" rx="14" fill="none" stroke="var(--ink)" stroke-width="2.5"/><rect x="${t-8}" y="80" width="16" height="84" rx="8" fill="var(--bad)" opacity=".8"/><text x="${t}" y="196" fill="var(--ink)" font-size="14" font-weight="900">${e}</text><text x="${t+40}" y="56" fill="var(--accent)" font-size="14" font-weight="700">${i}</text><text x="${t+40}" y="156" fill="var(--accent)" font-size="14" font-weight="700">${a}</text>`).join("")}\n   <line x1="40" y1="52" x2="490" y2="52" stroke="var(--muted)" stroke-dasharray="4 5"/><line x1="40" y1="152" x2="490" y2="152" stroke="var(--muted)" stroke-dasharray="4 5"/>\n   <text x="30" y="46" text-anchor="start" fill="var(--muted)" font-size="12">水沸騰</text><text x="30" y="146" text-anchor="start" fill="var(--muted)" font-size="12">冰熔化</text></g></svg>\n   <figcaption>圖 1　同樣從冰點到沸點，攝氏分 100 格、華氏分 180 格。</figcaption></figure>\n  <div class="formula"><div class="fx"><span>℉</span>＝<span>℃</span>×9/5＋32</div><div class="fl"><div><b>K＝℃＋273</b>絕對溫度<small>沒有負的</small></div><div><b>℃＝(℉－32)×5/9</b>華氏換回攝氏<small>先減再乘</small></div></div></div>`,side:[["易錯","25℃ 換華氏：25×9/5＝45，還要再加 32＝77℉。忘記加 32 是最常見的錯。"],["記法","華氏 100 度大約是人發高燒的體溫（約 38℃）。"]],ex:"m15",exNote:["℉＝℃×9/5＋32。","25×9/5＝45。","45＋32＝77℉。"],pr:"pr30"},{t:"熱量：H＝m×s×ΔT",star:"★★",main:`<p>把東西加熱，要給它多少熱量？取決於三件事：<b>有多少</b>（質量）、<b>是什麼</b>（比熱）、<b>要升幾度</b>（溫度變化）。</p>\n  <div class="formula"><div class="fx"><span>H</span>＝<span>m</span>×<span>s</span>×<span>ΔT</span></div>\n   <div class="fl"><div><b>H</b>熱量<small>cal</small></div><div><b>m</b>質量<small>g</small></div><div><b>s</b>比熱<small>cal/g℃，水＝1</small></div><div><b>ΔT</b>溫度變化<small>末溫－初溫</small></div></div></div>\n  <p>1 卡（cal）就是讓 <b>1 g 水上升 1℃</b> 的熱量。</p>\n  <p>兩杯不同溫度的水混合，熱會從熱水流到冷水，直到溫度一樣，叫<b>熱平衡</b>：</p>\n  <p class="law"><span>熱平衡（不計散失）</span>熱水<em>放出</em>的熱＝冷水<em>吸收</em>的熱</p>\n  <figure class="dg"><svg viewBox="0 0 520 150" role="img" aria-label="熱水冷水混合">${AH}\n   <g font-family="Noto Sans TC,sans-serif" text-anchor="middle"><rect x="40" y="40" width="90" height="80" rx="6" fill="var(--bad)" opacity=".25" stroke="var(--bad)" stroke-width="2"/><text x="85" y="76" fill="var(--bad)" font-size="14" font-weight="700">100 g</text><text x="85" y="98" fill="var(--bad)" font-size="14" font-weight="700">80℃</text>\n   <text x="160" y="86" fill="var(--ink)" font-size="22" font-weight="900">＋</text>\n   <rect x="190" y="20" width="110" height="100" rx="6" fill="var(--earth)" opacity=".25" stroke="var(--earth)" stroke-width="2"/><text x="245" y="66" fill="var(--earth-k)" font-size="14" font-weight="700">300 g</text><text x="245" y="88" fill="var(--earth-k)" font-size="14" font-weight="700">20℃</text>\n   <path d="M320 70 H370" stroke="var(--ink)" stroke-width="3" marker-end="url(#ah)"/>\n   <rect x="390" y="20" width="100" height="100" rx="6" fill="var(--sc)" opacity=".3" stroke="var(--sc)" stroke-width="2"/><text x="440" y="76" fill="var(--ink)" font-size="16" font-weight="900">35℃</text>\n   <text x="260" y="144" fill="var(--ink)" font-size="13">100×(80－T)＝300×(T－20) → T＝35℃</text></g></svg>\n   <figcaption>圖 2　混合後溫度會偏向質量比較大的那杯。</figcaption></figure>`,side:[["易錯","ΔT 是「升了幾度」，不是末溫。20℃ 加熱到 50℃，ΔT＝30。"],["判斷技巧","同一種物質、吸收同樣的熱：質量越大，升溫越少（成反比）。"],["檢查答案","混合溫度一定在兩個溫度之間，而且靠近質量大的那杯。"]],ex:"p8",exNote:["同樣的熱源、同樣的時間 → 兩杯吸收的熱量 H 相同。","都是水 → 比熱 s 相同。","H＝m×s×ΔT 固定，m 和 ΔT 成反比：ΔT甲：ΔT乙＝2：3。"],pr:"m16"},{t:"比熱：溫度有多「固執」",star:"★★★",main:`<p>同樣的火、同樣的質量，有的東西一下子就燙，有的東西加熱很久還是溫的。<b>比熱</b>就是「溫度有多固執」：比熱越大，溫度越難改變。</p>\n  <p class="law"><span>比較比熱的正確方法</span>取<em>相同質量</em>、吸收<em>相同熱量</em>，看溫度變化：<em>升溫越快，比熱越小</em>。</p>\n  <figure class="dg"><svg viewBox="0 0 520 220" role="img" aria-label="比熱與升溫快慢">\n   <g font-family="Noto Sans TC,sans-serif"><path d="M70 20 V180 H470" stroke="var(--ink)" stroke-width="2" fill="none"/><text x="62" y="20" text-anchor="end" fill="var(--muted)" font-size="12">溫度</text><text x="470" y="200" text-anchor="end" fill="var(--muted)" font-size="12">加熱時間</text>\n   <line x1="70" y1="170" x2="330" y2="40" stroke="var(--bad)" stroke-width="4"/><text x="338" y="44" fill="var(--bad)" font-size="14" font-weight="700">沙子：升溫快 → 比熱小</text>\n   <line x1="70" y1="170" x2="440" y2="120" stroke="var(--earth)" stroke-width="4"/><text x="330" y="146" fill="var(--earth-k)" font-size="14" font-weight="700">水：升溫慢 → 比熱大</text></g></svg>\n   <figcaption>圖 3　質量相同、加熱器相同：線越陡，比熱越小。</figcaption></figure>\n  <div class="cmp"><table><thead><tr><th>物質</th><td>水</td><td>酒精</td><td>冰</td><td>鋁</td><td>沙</td><td>鐵</td><td>銅</td></tr></thead><tbody><tr><th>比熱（cal/g℃）</th><td><b>1</b></td><td>0.58</td><td>0.5</td><td>0.21</td><td>0.2</td><td>0.11</td><td>0.09</td></tr></tbody></table></div>\n  <p>水的比熱是常見物質中<b>最大</b>的，所以海邊早晚溫差小、沙灘白天比海水燙得多。</p>`,side:[["易錯","比較比熱要用「相同質量」，不是相同體積；也不能看「誰先熔化」，熔點和比熱是兩回事。（114 會考第 26 題）"],["口訣","升溫快，比熱小；升溫慢，比熱大。"],["生活實例","汽車水箱用水來散熱，因為水能吸很多熱溫度卻升不高。"]],ex:"p48",exNote:["比較比熱，控制變因要一樣：相同質量、相同熱量。所以 A、B（相同體積）先刪掉。","熔化快慢跟熔點有關，不能用來比比熱，C 刪掉。","D：相同質量、同樣加熱，溫度上升較快的，比熱較小。"],pr:"pr39"},{t:"熱的傳播：傳導、對流、輻射",star:"★",main:`<p>熱會從高溫往低溫跑，跑的方法有三種：</p>\n  <div class="cmp"><table><thead><tr><th>方式</th><th>怎麼傳</th><th>要不要物質</th><th>例子</th></tr></thead><tbody>\n   <tr><th>傳導</th><td>粒子一個碰一個傳過去，物質本身不移動</td><td>要，<b>固體</b>最主要</td><td>鐵湯匙放熱湯，握把變燙</td></tr>\n   <tr><th>對流</th><td>熱的流體上升、冷的下降，循環流動</td><td>要，<b>液體、氣體</b></td><td>煮水整壺變熱、冷氣裝高處</td></tr>\n   <tr><th>輻射</th><td>以電磁波直接傳出去</td><td><b>不用</b>，真空也可以</td><td>太陽曬到地球、烤火</td></tr></tbody></table></div>\n  <figure class="dg"><svg viewBox="0 0 520 180" role="img" aria-label="對流示意">${AH}\n   <g font-family="Noto Sans TC,sans-serif"><path d="M150 30 V150 Q150 165 165 165 H355 Q370 165 370 150 V30" stroke="var(--ink)" stroke-width="3" fill="none"/>\n   <rect x="152" y="60" width="216" height="103" fill="var(--earth)" opacity=".18"/>\n   <path d="M200 150 V80" stroke="var(--bad)" stroke-width="3.5" marker-end="url(#ah)"/><path d="M210 75 H310" stroke="var(--muted)" stroke-width="3" marker-end="url(#ah)"/><path d="M320 80 V150" stroke="var(--earth)" stroke-width="3.5" marker-end="url(#ah)"/><path d="M310 158 H210" stroke="var(--muted)" stroke-width="3" marker-end="url(#ah)"/>\n   <path d="M180 172 Q190 160 200 172 Q210 160 220 172" stroke="var(--bad)" stroke-width="3" fill="none"/>\n   <text x="390" y="90" fill="var(--bad)" font-size="13" font-weight="700">熱水變輕上升</text><text x="390" y="130" fill="var(--earth-k)" font-size="13" font-weight="700">冷水較重下沉</text></g></svg>\n   <figcaption>圖 4　壺底加熱：水會自己轉圈，整壺一起變熱。</figcaption></figure>\n  <p>保溫瓶：中間<b>真空</b>阻止傳導和對流，瓶壁<b>鍍銀</b>反射，減少輻射。</p>`,side:[["口訣","固體靠傳導，流體靠對流，真空只能靠輻射。"],["易錯","溫度計量水溫要放在液體中間，不能碰到杯底（杯底直接受熱溫度較高）。（112 會考第 6 題）"]],ex:"m18",exNote:["真空裡沒有物質。","傳導要粒子互相碰撞、對流要流體流動，兩者都需要物質 → 真空擋住了傳導和對流。","輻射不需要物質，所以保溫瓶還要鍍銀來反射。"],pr:"pr33"},{t:"三態變化與潛熱：平台的祕密",star:"★★★",main:`<p>物質有固、液、氣三種狀態，吸熱或放熱都可能讓它換狀態。六種變化的名字一定要會：</p>\n  <figure class="dg"><svg viewBox="0 0 520 230" role="img" aria-label="三態變化">${AH}\n   <g font-family="Noto Sans TC,sans-serif" text-anchor="middle">\n   <circle cx="90" cy="170" r="42" fill="var(--earth)" opacity=".25" stroke="var(--earth)" stroke-width="2.5"/><text x="90" y="176" fill="var(--earth-k)" font-size="17" font-weight="900">固</text>\n   <circle cx="430" cy="170" r="42" fill="var(--earth)" opacity=".25" stroke="var(--earth)" stroke-width="2.5"/><text x="430" y="176" fill="var(--earth-k)" font-size="17" font-weight="900">液</text>\n   <circle cx="260" cy="50" r="42" fill="var(--earth)" opacity=".25" stroke="var(--earth)" stroke-width="2.5"/><text x="260" y="56" fill="var(--earth-k)" font-size="17" font-weight="900">氣</text>\n   <path d="M136 162 H384" stroke="var(--bad)" stroke-width="3" marker-end="url(#ah)"/><text x="260" y="154" fill="var(--bad)" font-size="13" font-weight="700">熔化（吸熱）</text>\n   <path d="M384 186 H136" stroke="var(--earth)" stroke-width="3" marker-end="url(#ah)"/><text x="260" y="204" fill="var(--earth-k)" font-size="13" font-weight="700">凝固（放熱）</text>\n   <path d="M404 132 L300 70" stroke="var(--bad)" stroke-width="3" marker-end="url(#ah)"/><text x="400" y="90" fill="var(--bad)" font-size="13" font-weight="700">汽化（吸熱）</text>\n   <path d="M290 84 L392 146" stroke="var(--earth)" stroke-width="3" marker-end="url(#ah)"/><text x="330" y="128" fill="var(--earth-k)" font-size="13" font-weight="700">凝結</text>\n   <path d="M116 132 L220 70" stroke="var(--bad)" stroke-width="3" marker-end="url(#ah)"/><text x="120" y="90" fill="var(--bad)" font-size="13" font-weight="700">昇華（吸熱）</text>\n   <path d="M230 84 L128 146" stroke="var(--earth)" stroke-width="3" marker-end="url(#ah)"/><text x="190" y="128" fill="var(--earth-k)" font-size="13" font-weight="700">凝華</text></g></svg>\n   <figcaption>圖 5　紅色往「更散」吸熱，藍色往「更緊」放熱。</figcaption></figure>\n  <p>加熱冰塊畫出溫度–時間圖，會看到<b>平的一段</b>：</p>\n  <figure class="dg"><svg viewBox="0 0 520 200" role="img" aria-label="冰的加熱曲線">\n   <g font-family="Noto Sans TC,sans-serif"><path d="M60 20 V170 H480" stroke="var(--ink)" stroke-width="2" fill="none"/>\n   <polyline points="60,160 120,120 260,120 380,50 470,50" stroke="var(--sc)" stroke-width="4" fill="none"/>\n   <text x="52" y="124" text-anchor="end" fill="var(--muted)" font-size="12">0℃</text><text x="52" y="54" text-anchor="end" fill="var(--muted)" font-size="12">100℃</text>\n   <text x="80" y="110" fill="var(--muted)" font-size="12">冰升溫</text><text x="190" y="110" text-anchor="middle" fill="var(--bad)" font-size="13" font-weight="700">冰水共存，溫度不變</text><text x="322" y="112" fill="var(--muted)" font-size="12">水升溫</text><text x="425" y="40" text-anchor="middle" fill="var(--bad)" font-size="13" font-weight="700">沸騰</text>\n   <text x="470" y="190" text-anchor="end" fill="var(--muted)" font-size="12">時間</text></g></svg>\n   <figcaption>圖 6　平台：熱都拿去改變狀態，這份熱叫潛熱。</figcaption></figure>\n  <p>平台時明明一直吸熱，溫度卻不變，因為熱都用來<b>改變狀態</b>。這種熱叫<b>潛熱</b>，冰的熔化熱約 80 cal/g。</p>`,side:[["易錯","冰飲料杯外的水珠、磁磚牆返潮，都是水蒸氣遇到「較冷」的東西凝結。（115 會考第 9 題）"],["易錯","平台是兩態共存。熔點是「溫度」（0℃），不是時間 t₁。（113 會考第 27 題）"],["延伸","氣壓降低，沸點也降低。高山上煮飯不容易熟就是這個原因。（114 會考第 40 題）"]],ex:"p38",exNote:["平台（t₁～t₂）溫度不變 → 冰正在熔化，冰水共存。","一大氣壓下冰的熔點是 0℃ → T₁＝0℃，A 對。","B 錯：熔點是溫度，t₁ 是時間。C 錯：t₂ 後是液態水在升溫。D 錯：是固液共存，不是固氣。"],pr:"m19"}],end:["p56","p50","fig25","m17","pr37"],sumT:"本章公式與判斷一次整理",sumH:["","公式／規則","重點","最常錯"],summary:[["溫標","℉＝℃×9/5＋32；K＝℃＋273","華氏冰點 32","忘記加 32"],["熱量","H＝m×s×ΔT","1 cal 讓 1 g 水升 1℃","把末溫當 ΔT"],["比熱","同質量、同熱量比升溫","升溫快 → 比熱小","用相同體積比"],["熱平衡","放熱＝吸熱","溫度偏向質量大的","算式兩邊寫反"],["潛熱","平台溫度不變","兩態共存","以為沒吸熱"]]};REF[5]={intro:"世界上的東西千千萬萬，拆到最小都是一百多種<b>原子</b>組合起來的。這一章教你怎麼把物質<b>分類</b>、原子裡面有什麼、怎麼看<b>週期表</b>。偏記憶，但每年 1～2 題，<b>離子的粒子數</b>幾乎必考。",map:mkMap("元素與化合物",[["物質分類","純物質・混合物","★★",[["元素",""],["化合物",""],["混合物",""]]],["原子結構","質子・中子・電子","★★"],["離子","得失電子","★★★"],["週期表","週期・族","★★"],["金屬與非金屬","性質比較","★"]]),table:[["物質的分類","★★","114-4"],["原子結構與原子說","★★","112-12"],["離子的粒子數","★★★","111-31、114-17"],["週期表","★★","113-4、115-3"],["金屬與非金屬","★","115-2"]],cs:[{t:"物質分類：先分純不純",star:"★★",main:`<p>拿到一個物質，先問：它是<b>一種</b>東西，還是<b>好幾種</b>混在一起？</p>\n  <figure class="dg"><svg viewBox="0 0 560 220" role="img" aria-label="物質分類樹">\n   <g font-family="Noto Sans TC,sans-serif" text-anchor="middle"><text x="280" y="30" fill="var(--ink)" font-size="17" font-weight="900">物質</text>\n   <path d="M280 40 V56 M150 56 H410 M150 56 V72 M410 56 V72" stroke="var(--muted)" stroke-width="2" fill="none"/>\n   <text x="150" y="92" fill="var(--accent)" font-size="16" font-weight="900">純物質</text><text x="150" y="110" fill="var(--muted)" font-size="12">只有一種物質，有固定性質</text>\n   <text x="410" y="92" fill="var(--accent)" font-size="16" font-weight="900">混合物</text><text x="410" y="110" fill="var(--muted)" font-size="12">好幾種物質混在一起</text>\n   <path d="M150 118 V134 M80 134 H220 M80 134 V150 M220 134 V150" stroke="var(--muted)" stroke-width="2" fill="none"/>\n   <text x="80" y="170" fill="var(--ink)" font-size="15" font-weight="900">元素</text><text x="80" y="188" fill="var(--muted)" font-size="12">一種原子</text><text x="80" y="206" fill="var(--muted)" font-size="12">Cu、O₂、S</text>\n   <text x="220" y="170" fill="var(--ink)" font-size="15" font-weight="900">化合物</text><text x="220" y="188" fill="var(--muted)" font-size="12">兩種以上原子化合</text><text x="220" y="206" fill="var(--muted)" font-size="12">H₂O、CO₂、NaCl</text>\n   <text x="410" y="170" fill="var(--muted)" font-size="12">空氣、海水、糖水</text><text x="410" y="188" fill="var(--muted)" font-size="12">合金、汽油、花岡岩</text></g></svg>\n   <figcaption>圖 1　物質分類：先分純不純，純物質再看原子有幾種。</figcaption></figure>\n  <ol class="pts"><li><b>O₂ 是元素</b>：雖然有兩個原子，但都是氧，只有一種。</li><li>化合物有<b>固定的組成</b>（水一定是 H₂O）；混合物的比例可以隨便調（糖水可濃可淡）。</li></ol>`,side:[["判斷技巧","看化學式裡有幾種「大寫字母」：一種是元素，兩種以上是化合物。寫不出單一化學式的，就是混合物。"],["易錯","蒸餾水是純物質（化合物），礦泉水是混合物。"]],ex:"p40",exNote:["硫磺 S：只有 S 一種原子。","笑氣 N₂O：有 N、O 兩種原子。","花岡岩由很多礦物組成，原子種類更多。","所以笑氣＞硫磺，A 正確。"],pr:"m22"},{t:"原子結構：原子裡面有什麼",star:"★★",main:`<p>道耳頓最早說「原子是最小、不能再分割的粒子」。後來科學家發現原子裡還有更小的東西：</p>\n  <figure class="dg"><svg viewBox="0 0 520 220" role="img" aria-label="原子結構">\n   <g font-family="Noto Sans TC,sans-serif"><circle cx="150" cy="110" r="90" fill="none" stroke="var(--muted)" stroke-width="2" stroke-dasharray="5 6"/><circle cx="150" cy="110" r="50" fill="none" stroke="var(--muted)" stroke-width="2" stroke-dasharray="5 6"/>\n   <circle cx="142" cy="104" r="11" fill="var(--bad)"/><circle cx="160" cy="104" r="11" fill="var(--muted)"/><circle cx="142" cy="120" r="11" fill="var(--muted)"/><circle cx="160" cy="120" r="11" fill="var(--bad)"/>\n   <circle cx="200" cy="110" r="6" fill="var(--earth)"/><circle cx="100" cy="110" r="6" fill="var(--earth)"/><circle cx="150" cy="20" r="6" fill="var(--earth)"/><circle cx="150" cy="200" r="6" fill="var(--earth)"/>\n   <circle cx="290" cy="60" r="9" fill="var(--bad)"/><text x="308" y="65" fill="var(--ink)" font-size="14" font-weight="700">質子：帶正電，在原子核裡</text>\n   <circle cx="290" cy="110" r="9" fill="var(--muted)"/><text x="308" y="115" fill="var(--ink)" font-size="14" font-weight="700">中子：不帶電，在原子核裡</text>\n   <circle cx="290" cy="160" r="6" fill="var(--earth)"/><text x="308" y="165" fill="var(--ink)" font-size="14" font-weight="700">電子：帶負電，質量最小，在外面</text></g></svg>\n   <figcaption>圖 2　原子核很小但幾乎集中了全部質量。</figcaption></figure>\n  <div class="formula"><div class="fx"><span>原子序</span>＝<span>質子數</span></div><div class="fl"><div><b>質量數</b>＝質子數＋中子數<small>電子太輕不算</small></div><div><b>原子</b>電子數＝質子數<small>所以不帶電</small></div></div></div>\n  <p><b>原子序決定是哪一種元素</b>。質子數相同、中子數不同的原子叫<b>同位素</b>，例如碳-12 和碳-14。</p>`,side:[["易錯","質量數＝質子＋中子，不是原子序。11 個質子、12 個中子的鈉，質量數是 23。"],["歷史","發現電子 → 推翻「原子不可分割」。（112 會考第 12 題）"]],ex:"p16",exNote:["電子比原子還小，而且是從原子裡跑出來的。","既然原子裡面還有更小的粒子，原子就「可以再分割」。","所以要修正的是 A：原子不可再分割。"],pr:"pr42"},{t:"離子：電子跑掉或跑進來",star:"★★★",main:`<p>原子<b>失去或得到電子</b>，正負電不再相等，就變成<b>離子</b>。注意：只有電子會動，<b>質子數永遠不變</b>。</p>\n  <div class="cmp"><table><thead><tr><th></th><th>陽離子（如 Ca²⁺）</th><th>陰離子（如 Cl⁻）</th></tr></thead><tbody>\n   <tr><th>怎麼來</th><td><b>失去</b>電子</td><td><b>得到</b>電子</td></tr><tr><th>電子數</th><td>質子數 － 電荷數</td><td>質子數 ＋ 電荷數</td></tr><tr><th>例子</th><td>Ca（20）→ Ca²⁺：電子 20－2＝<b>18</b></td><td>Cl（17）→ Cl⁻：電子 17＋1＝<b>18</b></td></tr></tbody></table></div>\n  <p class="law"><span>離子題三步驟</span>① 質子數＝原子序，<em>不變</em>　② 中子＝質量數－質子　③ 電子：帶幾個「＋」<em>減</em>幾個，帶幾個「－」<em>加</em>幾個</p>\n  <figure class="dg"><svg viewBox="0 0 520 130" role="img" aria-label="鈉原子變鈉離子">${AH}\n   <g font-family="Noto Sans TC,sans-serif" text-anchor="middle"><circle cx="110" cy="60" r="44" fill="var(--sc)" opacity=".25" stroke="var(--sc)" stroke-width="2"/><text x="110" y="56" fill="var(--ink)" font-size="16" font-weight="900">Na</text><text x="110" y="76" fill="var(--muted)" font-size="12">11p　11e</text>\n   <path d="M175 60 H330" stroke="var(--ink)" stroke-width="3" marker-end="url(#ah)"/><text x="252" y="48" fill="var(--bad)" font-size="13" font-weight="700">失去 1 個電子</text>\n   <circle cx="410" cy="60" r="38" fill="var(--sc)" opacity=".25" stroke="var(--sc)" stroke-width="2"/><text x="410" y="56" fill="var(--ink)" font-size="16" font-weight="900">Na⁺</text><text x="410" y="76" fill="var(--muted)" font-size="12">11p　10e</text>\n   <text x="260" y="122" fill="var(--ink)" font-size="13">質子 11 個沒變，所以還是鈉</text></g></svg>\n   <figcaption>圖 3　鈉原子變成鈉離子：少一個電子，帶 ＋1。</figcaption></figure>`,side:[["易錯","陽離子是「失去」電子。Ca²⁺ 電子是 18，不是 22。"],["易錯","離子只改電子數，質子數不變。（114 會考第 17 題）"],["判斷技巧","題目說某粒子「質量最小」，那就是電子。"]],ex:"p45",exNote:["質子數＝原子序：w＝20（Ca）、x＝17（Cl）。","Ca²⁺ 失去 2 個電子：y＝20－2＝18。","Cl⁻ 得到 1 個電子：z＝17＋1＝18。","比一比：w＝20＞z＝18，A 對。"],pr:"m20"},{t:"週期表：元素的座位表",star:"★★",main:`<p>週期表依<b>原子序</b>排列。<b>橫的叫週期，直的叫族</b>。坐在同一直行（同一族）的元素，<b>化學性質相似</b>。</p>\n  <figure class="dg"><svg viewBox="0 0 560 200" role="img" aria-label="週期表簡圖">\n   <g font-family="Noto Sans TC,sans-serif" text-anchor="middle" font-size="13" font-weight="700">\n   ${[["H",0,0],["He",17,0],["Li",0,1],["Be",1,1],["B",12,1],["C",13,1],["N",14,1],["O",15,1],["F",16,1],["Ne",17,1],["Na",0,2],["Mg",1,2],["Al",12,2],["Si",13,2],["P",14,2],["S",15,2],["Cl",16,2],["Ar",17,2],["K",0,3],["Ca",1,3],["Br",16,3],["Kr",17,3]].map(([t,e,a])=>{const i=20+e*29,s=20+a*34,r=e===0&&a>0?"var(--bad)":e===16?"var(--ok)":e===17?"var(--earth)":"var(--muted)";return`<rect x="${i}" y="${s}" width="27" height="30" rx="3" fill="${r}" opacity=".22" stroke="${r}"/><text x="${i+13.5}" y="${s+20}" fill="var(--ink)">${t}</text>`}).join("")}\n   <text x="34" y="175" fill="var(--bad)">第 1 族</text><text x="34" y="192" fill="var(--bad)" font-weight="400" font-size="12">鹼金屬</text>\n   <text x="499" y="175" fill="var(--ok)">17 族</text><text x="499" y="192" fill="var(--ok)" font-weight="400" font-size="12">鹵素</text>\n   <text x="540" y="175" fill="var(--earth-k)">18</text><text x="540" y="192" fill="var(--earth-k)" font-weight="400" font-size="12">鈍氣</text>\n   <text x="250" y="110" fill="var(--muted)" font-weight="400">（中間是過渡元素）</text></g></svg>\n   <figcaption>圖 4　直的一行是族，同族化學性質相似。</figcaption></figure>\n  <div class="cmp"><table><thead><tr><th>族</th><th>名稱</th><th>特性</th></tr></thead><tbody><tr><th>第 1 族</th><td>鹼金屬（Na、K）</td><td>非常活潑，遇水劇烈反應</td></tr><tr><th>第 17 族</th><td>鹵素（Cl、Br）</td><td>活潑的非金屬</td></tr><tr><th>第 18 族</th><td>鈍氣（He、Ne、Ar）</td><td>很穩定，幾乎不反應</td></tr></tbody></table></div>\n  <p>週期表上查得到：<b>元素符號、原子序（質子數）、原子量</b>、哪些同族。查不到：<b>元素在自然界有多少</b>。</p>`,side:[["易錯","鈍氣是「化學性質」相似；物理性質（熔點、沸點）不一定相似。（115 會考第 3 題）"],["易錯","週期表查不到自然界含量。（113 會考第 4 題）"]],ex:"p28",exNote:["A：質子數＝原子序，週期表查得到。","B：氖和氪同族（18 族），可以知道化學性質相似。","D：週期表有原子量，可以算出質量比較。","C：自然界含量週期表沒有寫 → 無法得知。"],pr:"m21"},{t:"金屬與非金屬",star:"★",main:`<p>元素大致分成金屬和非金屬，兩者的性質幾乎相反：</p>\n  <div class="cmp"><table><thead><tr><th></th><th>金屬</th><th>非金屬</th></tr></thead><tbody>\n   <tr><th>光澤</th><td>有金屬光澤</td><td>多數沒有</td></tr><tr><th>導電、導熱</th><td><b>好</b></td><td>多數不好（<b>石墨</b>例外，會導電）</td></tr><tr><th>延展性</th><td>可拉成細絲、打成薄片</td><td>脆，容易碎</td></tr><tr><th>常溫狀態</th><td>多數固體（<b>汞</b>是液體）</td><td>固、液（<b>溴</b>）、氣都有</td></tr></tbody></table></div>\n  <p>寫化學式時，元素符號右下角的數字代表<b>原子個數</b>：CO₂ 是 1 個碳＋2 個氧，共 3 個原子；2H₂O 是 2 個水分子。</p>`,side:[["記法","常溫下的液體元素只有兩個：汞（金屬）、溴（非金屬）。"],["易錯","石墨是非金屬但會導電；說「非金屬都不導電」是錯的。"]],ex:"p53",exNote:["關鍵字：導電性、導熱性、延展性 → 金屬的三大特性。","做電線的原料是銅，銅是一種元素。","所以是「金屬元素」。"],pr:"pr47"}],end:["p10","p54","fig26","pr46","pr48","pr49"],sumT:"原子與離子的粒子數一次整理",sumH:["","質子","電子","重點"],summary:[["原子","＝原子序","＝質子","不帶電"],["陽離子（帶 n＋）","＝原子序","質子 － n","失去電子"],["陰離子（帶 n－）","＝原子序","質子 ＋ n","得到電子"],["同位素","相同","相同","中子數不同"]]};REF[6]={intro:"化學反應就是<b>原子重新排隊</b>：原子不會變多、變少，也不會變成別種原子。抓住這件事，就能理解<b>質量守恆</b>、會<b>平衡反應式</b>，再用<b>莫耳</b>把「克」換成「個數」，計量題就是固定四步。",map:mkMap("化學反應與計量",[["質量守恆","原子重新排列","★★"],["莫耳","克 ↔ 莫耳 ↔ 個數","★★★"],["反應式","平衡係數・反推化學式","★★"],["係數比計量","克→莫耳→係數比→克","★★★"],["反應熱與製氣","放熱吸熱・O₂ CO₂ H₂","★★"]]),table:[["物理變化、化學變化與質量守恆","★★","111-9、114-32"],["原子量、分子量與莫耳","★★★","115-19"],["平衡反應式與反推化學式","★★","112-27"],["係數比計量","★★★","113-37、115-19"],["反應熱與氣體製備","★★","111-21、113-7、115-48"]],cs:[{t:"質量守恆：原子只是換位置",star:"★★",main:`<p>有新物質產生的變化叫<b>化學變化</b>（燃燒、腐壞、生鏽）；只改形狀或狀態的叫<b>物理變化</b>（熔化、溶解、加色素）。</p>\n  <p class="law"><span>質量守恆定律</span>化學反應前後，原子的<em>種類、數目</em>都不變，所以<em>總質量不變</em>。</p>\n  <figure class="dg"><svg viewBox="0 0 520 150" role="img" aria-label="氫氣燃燒原子守恆">${AH}\n   <g font-family="Noto Sans TC,sans-serif" text-anchor="middle">\n   ${[[60,40],[60,90]].map(([t,e])=>`<circle cx="${t}" cy="${e}" r="13" fill="var(--muted)"/><circle cx="${t+24}" cy="${e}" r="13" fill="var(--muted)"/>`).join("")}\n   <circle cx="160" cy="65" r="17" fill="var(--bad)"/><circle cx="194" cy="65" r="17" fill="var(--bad)"/>\n   <path d="M235 65 H290" stroke="var(--ink)" stroke-width="3" marker-end="url(#ah)"/>\n   ${[[340,40],[340,95]].map(([t,e])=>`<circle cx="${t+20}" cy="${e}" r="17" fill="var(--bad)"/><circle cx="${t}" cy="${e+12}" r="13" fill="var(--muted)"/><circle cx="${t+40}" cy="${e+12}" r="13" fill="var(--muted)"/>`).join("")}\n   <text x="72" y="134" fill="var(--ink)" font-size="13" font-weight="700">2H₂</text><text x="177" y="134" fill="var(--ink)" font-size="13" font-weight="700">O₂</text><text x="360" y="140" fill="var(--ink)" font-size="13" font-weight="700">2H₂O</text>\n   <text x="470" y="60" fill="var(--muted)" font-size="12">H：4 → 4</text><text x="470" y="80" fill="var(--muted)" font-size="12">O：2 → 2</text></g></svg>\n   <figcaption>圖 1　氫氣燃燒：前後都是 4 個 H、2 個 O。</figcaption></figure>\n  <p>開放容器裡如果<b>有氣體跑掉</b>（大理石加鹽酸放出 CO₂），秤起來會變輕；如果<b>吸收了空氣中的氧</b>（鎂帶燃燒），會變重。兩種情況都還是守恆，只是有東西沒秤到。</p>`,side:[["易錯","開放容器質量變少 ≠ 不守恆，是氣體跑出去了。"],["判斷技巧","有沒有「新物質」？有 → 化學變化。顏色改變不一定是化學變化。（111 會考第 9 題）"]],ex:"m26",exNote:["大理石＋鹽酸會產生二氧化碳氣體。","燒杯開口，CO₂ 跑到空氣中，沒有被秤到。","所以秤起來變輕，但所有原子都還在，仍然遵守質量守恆。"],pr:"pr57"},{t:"莫耳：化學界的「一打」",star:"★★★",main:`<p>原子太小、太多，一個一個數不完，所以化學家用一個大單位來數：<b>1 莫耳＝6×10²³ 個</b>，就像「一打＝12 個」。</p>\n  <p><b>原子量</b>的意思是：1 莫耳這種原子有幾克。所以 12 g 的碳剛好 1 莫耳。<b>分子量</b>就是把分子裡所有原子量加起來。</p>\n  <div class="cmp"><table><thead><tr><th>原子</th><td>H</td><td>C</td><td>N</td><td>O</td><td>Na</td><td>Mg</td><td>Cl</td><td>Ca</td></tr></thead><tbody><tr><th>原子量</th><td>1</td><td>12</td><td>14</td><td>16</td><td>23</td><td>24</td><td>35.5</td><td>40</td></tr></tbody></table></div>\n  <figure class="dg"><svg viewBox="0 0 560 130" role="img" aria-label="克莫耳個數換算">${AH}\n   <g font-family="Noto Sans TC,sans-serif" text-anchor="middle"><circle cx="80" cy="60" r="44" fill="var(--sc)" opacity=".2" stroke="var(--sc)" stroke-width="2.5"/><text x="80" y="66" fill="var(--ink)" font-size="18" font-weight="900">克 g</text>\n   <circle cx="280" cy="60" r="44" fill="var(--sc)" opacity=".2" stroke="var(--sc)" stroke-width="2.5"/><text x="280" y="66" fill="var(--ink)" font-size="18" font-weight="900">莫耳</text>\n   <circle cx="480" cy="60" r="44" fill="var(--sc)" opacity=".2" stroke="var(--sc)" stroke-width="2.5"/><text x="480" y="66" fill="var(--ink)" font-size="18" font-weight="900">個數</text>\n   <path d="M128 48 H232" stroke="var(--bad)" stroke-width="3" marker-end="url(#ah)"/><text x="180" y="38" fill="var(--bad)" font-size="13" font-weight="700">÷ 分子量</text>\n   <path d="M232 74 H128" stroke="var(--earth)" stroke-width="3" marker-end="url(#ah)"/><text x="180" y="96" fill="var(--earth-k)" font-size="13" font-weight="700">× 分子量</text>\n   <path d="M328 48 H432" stroke="var(--bad)" stroke-width="3" marker-end="url(#ah)"/><text x="380" y="38" fill="var(--bad)" font-size="13" font-weight="700">× 6×10²³</text>\n   <path d="M432 74 H328" stroke="var(--earth)" stroke-width="3" marker-end="url(#ah)"/><text x="380" y="96" fill="var(--earth-k)" font-size="13" font-weight="700">÷ 6×10²³</text></g></svg>\n   <figcaption>圖 2　莫耳在正中間：克和個數都要先換成莫耳。</figcaption></figure>\n  <p>例：CO₂ 分子量＝12＋16×2＝44，所以 88 g CO₂＝88÷44＝<b>2 莫耳</b>。</p>`,side:[["易錯","問「原子」個數時，別忘了一個分子裡有好幾個原子。2 mol CO₂ 有 4 mol 的 O。"],["判斷技巧","質量一樣時，分子量越小，莫耳數（分子數）越多。"]],ex:"m23",exNote:["CO₂ 分子量 44 → 88÷44＝2 mol CO₂。","每個 CO₂ 有 2 個 O → O 原子有 2×2＝4 mol。","4×6×10²³＝2.4×10²⁴ 個。"],pr:"pr51"},{t:"反應式：兩邊原子要對得上",star:"★★",main:`<p>反應式左邊是<b>反應物</b>、右邊是<b>生成物</b>。化學式前面的數字叫<b>係數</b>，要讓左右兩邊每一種原子數目相等，這叫<b>平衡</b>。</p>\n  <p class="law"><span>平衡的順序</span>先平衡<em>只出現一次</em>的原子（通常是 C），再平衡 H，<em>最後才數 O</em>。</p>\n  <ol class="pts"><li>例：□C₃H₈＋□O₂ → □CO₂＋□H₂O</li><li>C：左邊 3 個 → 右邊 3CO₂</li><li>H：左邊 8 個 → 右邊 4H₂O</li><li>O：右邊 3×2＋4＝10 個 → 左邊 5O₂</li><li>答案：C₃H₈＋5O₂ → 3CO₂＋4H₂O</li></ol>\n  <p>反過來，知道生成物也能<b>反推</b>反應物的化學式：把右邊的原子數一數，減掉左邊已知的（通常是氧氣），剩下的就是未知物。</p>`,side:[["易錯","係數只能改前面的數字，不能改化學式右下角的小數字（H₂O 不能改成 H₂O₂）。"],["易錯","反推時別忘了氧氣也提供了氧原子。（112 會考第 27 題）"]],ex:"p21",exNote:["甲：右邊 2CO₂＋3H₂O → C 2、H 6、O 4＋3＝7；減掉左邊 3O₂ 的 6 個 O → 甲＝C₂H₆O（乙醇，分子量 46）。","乙：右邊 2CO₂＋2H₂O → C 2、H 4、O 6；減掉 6 個 O → 乙＝C₂H₄（乙烯，分子量 28）。","甲分子量較大，而且含 O 可能是醇類 → A。"],pr:"m25"},{t:"係數比計量：固定四步走",star:"★★★",main:`<p>平衡好的反應式，係數比就是<b>分子數比＝莫耳數比</b>（同溫同壓下的氣體也等於體積比）。但<b>不是質量比</b>！</p>\n  <figure class="dg"><svg viewBox="0 0 560 120" role="img" aria-label="計量四步驟">${AH}\n   <g font-family="Noto Sans TC,sans-serif" text-anchor="mid
