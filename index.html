整壺水會一起變熱，主要是靠什麼？",o:["對流","傳導","輻射","潛熱"],a:0,e:"壺底的水受熱後變輕往上升，上面較冷的水比較重往下沉，這樣不斷循環，整壺水都會變熱，這叫「對流」。液體和氣體主要靠對流傳熱；固體主要靠傳導。"},{id:"pr34",t:"mine",set:"prac",d:"b",u:4,q:"冰熔化成水的過程中，溫度如何變化？",o:["維持 0℃ 不變","持續上升","持續下降","先升後降"],a:0,e:"冰熔化時，吸收的熱用來把固體變成液體（潛熱），溫度一直維持在 0℃，要等冰全部熔化後溫度才會上升。所以不是持續上升，也不會下降。"},{id:"pr35",t:"mine",set:"prac",d:"c",u:4,q:"200 g、10℃ 的水和 100 g、70℃ 的水混合，不計熱量散失，最後溫度是多少？",o:["30℃","40℃","50℃","20℃"],a:0,e:"熱水放出的熱＝冷水吸收的熱：100×(70−T)＝200×(T−10)，7000−100T＝200T−2000，300T＝9000，T＝30℃。冷水比較多，所以最後溫度會比平均值 40℃ 更靠近冷水的 10℃。"},{id:"pr36",t:"mine",set:"prac",d:"c",u:4,q:"質量相同的甲、乙兩物體吸收相同熱量，甲升溫 10℃、乙升溫 20℃。哪一個比熱較大？",o:["甲，比熱是乙的 2 倍","乙，比熱是甲的 2 倍","兩者相同","無法判斷"],a:0,e:"H＝m×s×ΔT，H 和 m 一樣時，比熱 s 和升溫 ΔT 成反比：升溫越少，比熱越大。甲升 10℃、乙升 20℃，甲升溫是乙的一半，所以甲的比熱是乙的 2 倍。"},{id:"pr37",t:"mine",set:"prac",d:"c",u:4,q:"要把 10 g、0℃ 的冰完全變成 10℃ 的水，至少需要多少熱量？（冰的熔化熱 80 cal/g）",o:["900 cal","800 cal","100 cal","80 cal"],a:0,e:"熔化：10×80＝800 cal；升溫：10×1×10＝100 cal；共 900 cal。"},{id:"pr38",t:"mine",set:"prac",d:"c",u:4,q:"77℉ 等於多少℃？",o:["25℃","45℃","57℃","32℃"],a:0,e:"華氏換攝氏：℃＝(℉−32)×5/9。77−32＝45，45×5/9＝25℃。選 45 是忘了乘 5/9；選 32 是把冰點數字當答案。"},{id:"pr39",t:"mine",set:"prac",d:"c",u:4,q:"夏天在海邊，白天沙灘比海水燙很多，主要原因是什麼？",o:["沙的比熱比水小，吸同樣的熱溫度上升較多","沙的比熱比水大","水會反射所有陽光","沙會產生熱"],a:0,e:"沙的比熱比水小很多。吸收一樣多的陽光（熱），比熱小的沙升溫快，所以很燙；水比熱大，溫度上升慢，摸起來比較涼。不是水反射所有陽光，沙也不會自己產生熱。"},{id:"pr40",t:"mine",set:"prac",d:"b",u:5,q:"下列何者是化合物？",o:["水","氧氣","鐵","空氣"],a:0,e:"化合物：由兩種以上的元素「化學結合」而成。水 H₂O 由氫、氧組成，是化合物。氧氣（O₂）、鐵（Fe）只有一種元素，是元素；空氣是多種氣體混合，是混合物。"},{id:"pr41",t:"mine",set:"prac",d:"b",u:5,q:"原子核內含有哪些粒子？",o:["質子和中子","質子和電子","中子和電子","只有電子"],a:0,e:"原子核在原子中心，裡面有帶正電的質子和不帶電的中子。帶負電的電子在原子核外面繞。所以核內是質子和中子。"},{id:"pr42",t:"mine",set:"prac",d:"b",u:5,q:"某原子有 11 個質子、12 個中子，它的質量數是多少？",o:["23","11","12","1"],a:0,e:"質量數＝質子數＋中子數＝11＋12＝23。原子序才等於質子數（11）。這個原子是鈉（Na）。"},{id:"pr43",t:"mine",set:"prac",d:"b",u:5,q:"下列哪一種物質在常溫下是液態的金屬？",o:["汞","鐵","溴","鈉"],a:0,e:"汞（水銀）是唯一在常溫下是液態的金屬。溴在常溫下也是液體，但它是「非金屬」；鐵和鈉都是固態金屬。"},{id:"pr44",t:"mine",set:"prac",d:"b",u:5,q:"週期表中，同一族的元素有什麼共同點？",o:["化學性質相似","質量數相同","原子序相同","都是氣體"],a:0,e:"週期表直的一行叫「族」。同一族的元素最外層電子數相同，所以化學性質相似（例如第 1 族都很活潑）。同族元素原子序、質量數都不一樣，也不一定都是氣體。"},{id:"pr45",t:"mine",set:"prac",d:"c",u:5,q:"Ca²⁺ 的原子序是 20，它有幾個電子？",o:["18","20","22","40"],a:0,e:"鈣原子序 20，原子有 20 個電子。Ca²⁺ 的「2＋」代表失去 2 個電子，所以剩 20−2＝18 個。陽離子是失去電子，不是得到（22 是算反了）。"},{id:"pr46",t:"mine",set:"prac",d:"c",u:5,q:"O²⁻ 的質子數與電子數分別是多少？（O 原子序 8）",o:["8 個質子、10 個電子","10 個質子、8 個電子","8 個質子、8 個電子","8 個質子、6 個電子"],a:0,e:"陰離子得到 2 個電子，質子數不變仍為 8，電子 8＋2＝10。"},{id:"pr47",t:"mine",set:"prac",d:"c",u:5,q:"下列關於金屬與非金屬的敘述，何者正確？",o:["石墨是非金屬，但能導電","所有金屬常溫下都是固體","非金屬都不能導電","金屬都很硬"],a:0,e:"石墨是碳（非金屬），但它是少數能導電的非金屬，所以「非金屬都不能導電」是錯的。汞在常溫是液態金屬，所以「金屬都是固體」錯；鈉軟到能用刀切，所以「金屬都很硬」錯。"},{id:"pr48",t:"mine",set:"prac",d:"c",u:5,q:"CO₂ 一個分子中含有幾個原子？",o:["3 個","2 個","1 個","5 個"],a:0,e:"CO₂：C 後面沒寫數字代表 1 個碳原子，O₂ 代表 2 個氧原子，1＋2＝3 個原子。"},{id:"pr49",t:"mine",set:"prac",d:"c",u:5,q:"同位素指的是什麼？",o:["質子數相同、中子數不同的原子","中子數相同、質子數不同的原子","電子數不同的同種原子","分子式相同的不同物質"],a:0,e:"同位素是「同一種元素」，所以質子數相同；但中子數不同，所以質量數不同。例如碳-12 和碳-14。質子數不同就是不同元素了；電子數不同是離子。"},{id:"pr50",t:"mine",set:"prac",d:"b",u:6,q:"H₂O 的分子量是多少？（H＝1、O＝16）",o:["18","17","10","34"],a:0,e:"分子量＝各原子量加起來。H₂O 有 2 個 H、1 個 O：2×1＋16＝18。選 17 是只算 1 個 H；34 是把 O 算了 2 次。"},{id:"pr51",t:"mine",set:"prac",d:"b",u:6,q:"88 g 的 CO₂ 是幾莫耳？（C＝12、O＝16）",o:["2 mol","1 mol","4 mol","0.5 mol"],a:0,e:"先算 CO₂ 分子量：12＋16×2＝44。莫耳數＝質量÷分子量＝88÷44＝2 mol。"},{id:"pr52",t:"mine",set:"prac",d:"b",u:6,q:"在密閉容器中燃燒木炭，反應前後總質量如何？",o:["不變","增加","減少","先增後減"],a:0,e:"密閉容器裡，反應前後沒有東西跑出去或跑進來，原子只是重新排列，所以總質量不變，這叫質量守恆定律。"},{id:"pr53",t:"mine",set:"prac",d:"b",u:6,q:"1 莫耳的水分子約有幾個？",o:["6×10²³ 個","18 個","1 個","3×10²³ 個"],a:0,e:"1 莫耳就是 6×10²³ 個粒子（亞佛加厥數），不管是什麼物質都一樣。18 是水的分子量（1 莫耳水重 18 g），不是分子個數。"},{id:"pr54",t:"mine",set:"prac",d:"b",u:6,q:"平衡反應式 □H₂＋O₂ → □H₂O，方格中依序應填什麼？",o:["2、2","1、1","2、1","1、2"],a:0,e:"先數 O：左邊 O₂ 有 2 個 O，所以右邊要 2 個 H₂O。右邊 H 變成 4 個，左邊就要 2 個 H₂。答案 2H₂＋O₂ → 2H₂O，兩邊 H 都是 4、O 都是 2。"},{id:"pr55",t:"mine",set:"prac",d:"c",u:6,q:"2CO＋O₂ → 2CO₂。56 g 的一氧化碳完全燃燒，會產生多少 g 的二氧化碳？（C＝12、O＝16）",o:["88 g","44 g","56 g","176 g"],a:0,e:"CO 分子量＝12＋16＝28，56 g÷28＝2 mol。係數比 CO：CO₂＝2：2＝1：1，所以產生 2 mol CO₂。CO₂ 分子量 44，2×44＝88 g。選 56 g 是以為質量不變直接照抄；選 44 g 是只算了 1 mol。"},{id:"pr56",t:"mine",set:"prac",d:"c",u:6,q:"CH₄＋2O₂ → CO₂＋2H₂O，若生成 1.2×10²⁴ 個水分子，消耗多少莫耳的甲烷？",o:["1 mol","2 mol","0.5 mol","4 mol"],a:0,e:"水 1.2×10²⁴÷6×10²³＝2 mol，係數比 CH₄：H₂O＝1：2，甲烷 1 mol。"},{id:"pr57",t:"mine",set:"prac",d:"c",u:6,q:"在開放容器中加熱鎂帶燃燒，燃燒後的白色粉末比原本的鎂帶重，原因是什麼？",o:["鎂和空氣中的氧結合，增加了氧的質量","質量守恆不成立","鎂吸收了熱能變重","燃燒產生水"],a:0,e:"鎂燃燒是 2Mg＋O₂ → 2MgO。鎂和空氣中的氧結合，產物多了「氧」的質量，所以變重。質量守恆仍然成立，只是加上了從空氣來的氧。"},{id:"pr58",t:"mine",set:"prac",d:"c",u:6,q:"同溫同壓下，N₂＋3H₂ → 2NH₃，10 L 的 N₂ 完全反應，最多產生多少 L 的氨？",o:["20 L","10 L","30 L","40 L"],a:0,e:"同溫同壓下，氣體的體積比＝係數比。N₂：NH₃＝1：2，所以 10 L 的 N₂ 可產生 20 L 的 NH₃。"},{id:"pr59",t:"mine",set:"prac",d:"c",u:6,q:"下列各物質都是 1 g，哪一個所含分子數最多？（H＝1、C＝12、O＝16）",o:["H₂","O₂","CO₂","H₂O"],a:0,e:"質量一樣時，分子量越小的物質，莫耳數越多，分子數也越多。分子量：H₂＝2、H₂O＝18、O₂＝32、CO₂＝44，H₂ 最小，所以分子最多。"},{id:"pr60",t:"mine",set:"prac",d:"b",u:7,q:"物質與氧結合的反應稱為什麼？",o:["氧化","還原","中和","分解"],a:0,e:"物質「得到氧」叫氧化，例如燃燒、生鏽。「失去氧」才叫還原；酸鹼反應叫中和；一種物質變成多種叫分解。"},{id:"pr61",t:"mine",set:"prac",d:"b",u:7,q:"高爐煉鐵中，負責把氧化鐵還原成鐵的主要物質是什麼？",o:["一氧化碳","石灰石","氧氣","二氧化碳"],a:0,e:"高爐中焦炭（C）先燃燒產生一氧化碳 CO，CO 會搶走氧化鐵中的氧：Fe₂O₃＋3CO → 2Fe＋3CO₂。石灰石是用來除去雜質的；CO₂ 是產物，不會搶氧。"},{id:"pr62",t:"mine",set:"prac",d:"b",u:7,q:"鐵門刷油漆可以防鏽，原理是什麼？",o:["隔絕水和氧氣","增加鐵的活性","讓鐵變成合金","提高溫度"],a:0,e:"鐵生鏽需要「水」和「氧氣」同時存在。刷油漆在鐵表面形成一層保護膜，把水和氧氣隔開，鐵就不容易生鏽。"},{id:"pr63",t:"mine",set:"prac",d:"b",u:7,q:"鎂在二氧化碳中燃燒生成碳和氧化鎂，鎂扮演什麼角色？",o:["還原劑，本身被氧化","氧化劑，本身被還原","催化劑","不參與反應"],a:0,e:"2Mg＋CO₂ → 2MgO＋C。鎂搶走 CO₂ 的氧，自己得到氧「被氧化」，同時讓 CO₂ 被還原成碳，所以鎂是還原劑（還原別人）。CO₂ 是氧化劑。"},{id:"pr64",t:"mine",set:"prac",d:"b",u:7,q:"下列金屬中，活性最大的是哪一個？",o:["鉀","鐵","銅","金"],a:0,e:"活性大小：鉀＞鈉＞鋇＞鈣＞鎂＞鋁＞碳＞鋅＞鉻＞鐵＞錫＞鉛＞氫＞銅＞汞＞銀＞鉑＞金。鉀最大。"},{id:"pr65",t:"mine",set:"prac",d:"c",u:7,q:"把鋅片放入硫酸銅溶液中，下列現象何者正確？",o:["鋅片表面析出紅色的銅，溶液藍色變淡","沒有任何反應","鋅片表面析出鋅","溶液藍色變深"],a:0,e:"鋅的活性比銅大，會把銅從硫酸銅中置換出來：Zn＋CuSO₄ → ZnSO₄＋Cu。鋅片表面長出紅色的銅；藍色來自銅離子，銅離子變少，藍色變淡。"},{id:"pr66",t:"mine",set:"prac",d:"c",u:7,q:"CuO＋H₂ → Cu＋H₂O，下列敘述何者正確？",o:["氫氣被氧化，氧化銅被還原","氫氣被還原","銅被氧化","水是還原劑"],a:0,e:"H₂ 搶走 CuO 的氧變成 H₂O：氫得到氧 → 被氧化（是還原劑）。CuO 失去氧變成 Cu → 被還原（是氧化劑）。銅是被還原，不是被氧化。"},{id:"pr67",t:"mine",set:"prac",d:"c",u:7,q:"甲金屬放入乙的鹽類溶液會析出乙，乙放入丙的鹽類溶液不反應。三者活性大小為何？",o:["甲＞乙，且丙＞乙","乙＞甲＞丙","丙＞甲＞乙","甲＞乙＞丙"],a:0,e:"甲放入乙的溶液會析出乙 → 甲搶得贏乙 → 甲＞乙。乙放入丙的溶液不反應 → 乙搶不贏丙 → 丙＞乙。甲和丙誰大，題目資料無法判斷，所以只能說甲＞乙、丙＞乙。"},{id:"pr68",t:"mine",set:"prac",d:"c",u:7,q:"漂白水能漂白衣物，主要是利用什麼性質？",o:["氧化力","還原力","酸性","吸水性"],a:0,e:"漂白水裡的次氯酸根有很強的「氧化力」，會把色素氧化破壞，衣服就變白，也能殺菌。漂白水是鹼性的，不是靠酸性；也不是吸水。"},{id:"pr69",t:"mine",set:"prac",d:"c",u:7,q:"鋁的活性比鐵大，但鋁製品不容易生鏽，原因是什麼？",o:["表面生成緻密的氧化鋁保護層","鋁不會和氧反應","鋁的活性其實最小","鋁表面有油"],a:0,e:"鋁很活潑，表面很快和氧反應，生成一層又薄又緻密的氧化鋁，像保護膜一樣把裡面的鋁和空氣隔開，所以不會繼續生鏽。鐵鏽則鬆鬆的，擋不住。"},{id:"pr70",t:"mine",set:"prac",d:"b",u:8,q:"把電解質溶在水中後水溶液可以導電，主要原因是什麼？",o:["溶質解離出可以自由移動的離子","水分子本身可以大量導電","溶質分子變大","溶液溫度升高"],a:0,e:"電解質（如食鹽）溶在水裡會解離成帶正電和負電的離子，這些離子可以在水中自由移動，接上電源後就形成電流。純水幾乎不導電；非電解質（如糖）不會解離，所以不導電。"},{id:"pr71",t:"mine",set:"prac",d:"b",u:8,q:"pH＝3 的溶液是什麼性質？",o:["酸性","中性","鹼性","無法判斷"],a:0,e:"pH 值：小於 7 酸性、等於 7 中性、大於 7 鹼性（25℃）。pH＝3 小於 7，是酸性，而且是蠻酸的。"},{id:"pr72",t:"mine",set:"prac",d:"b",u:8,q:"酚酞在鹼性溶液中呈現什麼顏色？",o:["紅色","無色","藍色","黃色"],a:0,e:"酚酞指示劑：在鹼性中變「紅色」，在酸性和中性中是無色。藍色和黃色是其他指示劑（如石蕊、廣用試紙）的顏色。"},{id:"pr73",t:"mine",set:"prac",d:"b",u:8,q:"鹽酸與氫氧化鈉中和，產物是什麼？",o:["氯化鈉和水","氫氣和氧氣","二氧化碳","只有水"],a:0,e:"酸＋鹼 → 鹽＋水。HCl＋NaOH → NaCl＋H₂O，生成氯化鈉（食鹽）和水。中和反應不會產生氫氣、氧氣或二氧化碳。"},{id:"pr74",t:"mine",set:"prac",d:"b",u:8,q:"藍色石蕊試紙遇到什麼溶液會變紅？",o:["酸性","鹼性","中性","任何溶液"],a:0,e:"石蕊試紙口訣：「酸紅鹼藍」。藍色石蕊遇酸變紅；紅色石蕊遇鹼變藍。中性溶液兩種試紙都不變色。"},{id:"pr75",t:"mine",set:"prac",d:"c",u:8,q:"把 pH＝3 的鹽酸加水稀釋成 pH＝4，溶液中的氫離子濃度 [H⁺] 變成原來的多少？",o:["1/10","10 倍","1/2","不變"],a:0,e:"pH 每增加 1，[H⁺] 就變成原來的 1/10。pH 由 3 變 4，酸性變弱，[H⁺] 變成原來的 1/10。pH 數字越大，氫離子越少。"},{id:"pr76",t:"mine",set:"prac",d:"c",u:8,q:"0.1 M 的鹽酸 20 mL，要用多少 mL 的 0.2 M 氫氧化鈉才能完全中和？",o:["10 mL","20 mL","40 mL","5 mL"],a:0,e:"完全中和時，酸的 H⁺ 莫耳數＝鹼的 OH⁻ 莫耳數。0.1 M×20 mL＝0.2 M×V，V＝10 mL。鹼的濃度是酸的 2 倍，所以只要一半的體積。"},{id:"pr77",t:"mine",set:"prac",d:"c",u:8,q:"在氫氧化鈉溶液中逐滴加入鹽酸，直到過量，溶液的 pH 如何變化？",o:["由大於 7 逐漸下降到小於 7","由小於 7 上升到大於 7","一直維持 7","先下降再上升"],a:0,e:"一開始是氫氧化鈉，鹼性，pH 大於 7。加鹽酸中和，pH 慢慢變小，剛好中和時 pH＝7，鹽酸過量後變酸性，pH 小於 7。所以是一路往下降。"},{id:"pr78",t:"mine",set:"prac",d:"c",u:8,q:"下列關於電解質的敘述何者正確？",o:["電解質溶於水時，陽離子總電量等於陰離子總電量","陽離子數一定等於陰離子數","固態食鹽可以導電","電解質溶於水會帶負電"],a:0,e:"溶液仍是電中性，但數目不一定相等（如 CaCl₂ 中 Cl⁻ 是 Ca²⁺ 的兩倍）。"},{id:"pr79",t:"mine",set:"prac",d:"c",u:8,q:"大理石（碳酸鈣）加入稀鹽酸會產生什麼氣體？",o:["二氧化碳","氫氣","氧氣","氯氣"],a:0,e:"碳酸鈣（大理石）加鹽酸：CaCO₃＋2HCl → CaCl₂＋H₂O＋CO₂，產生二氧化碳。活潑金屬（鎂、鋅）加鹽酸才會產生氫氣。"},{id:"pr80",t:"mine",set:"prac",d:"b",u:9,q:"下列哪一個做法可以加快鋅與鹽酸的反應速率？",o:["把鋅片磨成鋅粉","降低溫度","加水稀釋鹽酸","換成更大塊的鋅"],a:0,e:"把鋅片磨成粉，和鹽酸的「接觸面積」變大，反應就變快。降低溫度、加水稀釋（濃度變小）會讓反應變慢；換更大塊的鋅，接觸面積相對變小，也比較慢。"},{id:"pr81",t:"mine",set:"prac",d:"b",u:9,q:"食物放進冰箱比較不容易壞，主要是因為什麼？",o:["溫度降低，反應速率變慢","冰箱裡沒有氧氣","低溫殺死所有細菌","冰箱濕度高"],a:0,e:"溫度越低，化學反應和細菌的活動都越慢，所以食物放冰箱不容易壞。冰箱裡還是有氧氣，低溫也不能殺死所有細菌，只是讓它們變慢。"},{id:"pr82",t:"mine",set:"prac",d:"b",u:9,q:"催化劑在反應中的作用是什麼？",o:["改變反應速率，本身反應前後不變","增加產物的量","被反應完全消耗","讓不能發生的反應發生"],a:0,e:"催化劑能改變（通常是加快）反應速率，但反應前後自己的質量和性質都不變。它不會讓產物變多，也不會被用完。"},{id:"pr83",t:"mine",set:"prac",d:"b",u:9,q:"雙氧水分解製造氧氣時加入二氧化錳，二氧化錳的角色是什麼？",o:["催化劑","反應物","生成物","指示劑"],a:0,e:"雙氧水（H₂O₂）會慢慢分解成水和氧氣，加入二氧化錳（MnO₂）後分解變快，而 MnO₂ 反應完還在、質量不變，所以是催化劑。"},{id:"pr84",t:"mine",set:"prac",d:"b",u:9,q:"在可逆反應達到平衡時，下列敘述何者正確？",o:["正反應與逆反應速率相等","反應完全停止","反應物全部用完","只有正反應在進行"],a:0,e:"化學平衡是「動態平衡」：正反應和逆反應都還在進行，只是速率相等，所以看起來各物質的量不變。反應沒有停止，反應物也沒有用完。"},{id:"pr85",t:"mine",set:"prac",d:"c",u:9,q:"密閉玻璃瓶中有平衡：2NO₂（紅棕色）⇌ N₂O₄（無色），正反應會放熱。把瓶子放進熱水中，顏色如何變化？",o:["紅棕色變深","紅棕色變淺","變成無色","顏色不變"],a:0,e:"正反應放熱，表示逆反應吸熱。加熱時平衡往「吸熱」的方向（往左）移動，生成更多紅棕色的 NO₂，所以顏色變深；放進冰水則往右移，顏色變淺。"},{id:"pr86",t:"mine",set:"prac",d:"c",u:9,q:"黃色鉻酸鉀溶液加入鹽酸後變成橙色（2CrO₄²⁻＋2H⁺ ⇌ Cr₂O₇²⁻＋H₂O）。若再加入氫氧化鈉，顏色如何變化？",o:["變回黃色","變得更橙","變成無色","變成紅色"],a:0,e:"加入氫氧化鈉，OH⁻ 會和 H⁺ 中和，左邊的 H⁺ 變少，平衡往左移，生成更多黃色的 CrO₄²⁻，所以顏色變回黃色。"},{id:"pr87",t:"mine",set:"prac",d:"c",u:9,q:"同質量的大理石分別放入 1 M 與 2 M 的鹽酸（足量），下列何者正確？",o:["2 M 反應較快，最後產生的 CO₂ 一樣多","2 M 產生的 CO₂ 較多","1 M 反應較快","兩者速率相同"],a:0,e:"鹽酸越濃，反應越快，所以 2 M 比較快。但產生多少 CO₂ 是看大理石有多少；兩邊大理石一樣多、鹽酸都足量，最後 CO₂ 一樣多。濃度只影響「快慢」，不影響「總量」。"},{id:"pr88",t:"mine",set:"prac",d:"c",u:9,q:"密封的汽水打開後冒出大量氣泡，用平衡的觀念解釋最合理的是哪一個？",o:["壓力降低，溶解的 CO₂ 逸出，平衡往產生氣體的方向移動","溫度突然升高","汽水中的糖分解","打開後氧氣進入產生反應"],a:0,e:"汽水是在高壓下把 CO₂ 溶進去的。打開瓶蓋，瓶內壓力突然變小，CO₂ 溶解度變小，平衡往產生氣體的方向移動，CO₂ 就變成氣泡跑出來。不是溫度升高，也不是糖分解。"},{id:"pr89",t:"mine",set:"prac",d:"c",u:9,q:"為什麼粉塵（如麵粉）在密閉空間遇到火花可能爆炸？",o:["顆粒極細，與氧接觸面積大，燃燒速率極快","麵粉本身是炸藥","麵粉會產生氫氣","麵粉的燃點極低到常溫就會燃燒"],a:0,e:"麵粉本身會燃燒，變成很細的粉塵飄在空中時，和氧氣的接觸面積非常大，遇到火花會在一瞬間全部燒完，產生大量熱和氣體，就爆炸了（粉塵爆炸）。麵粉不是炸藥，常溫也不會自己燒。"},{id:"pr90",t:"mine",set:"prac",d:"b",u:10,q:"下列何者是有機化合物？",o:["酒精（乙醇）","二氧化碳","碳酸鈣","一氧化碳"],a:0,e:"有機化合物是含碳的化合物，例如酒精 C₂H₅OH。但 CO、CO₂、碳酸鈣這類含碳的簡單化合物，性質像無機物，習慣上歸為無機化合物，是例外，要記住。"},{id:"pr91",t:"mine",set:"prac",d:"b",u:10,q:"甲烷的分子式是什麼？",o:["CH₄","C₂H₆","C₂H₄","CH₃OH"],a:0,e:"烷類：甲烷 CH₄（1 個碳）、乙烷 C₂H₆（2 個碳）。甲烷是最簡單的烷類，也是天然氣的主要成分。C₂H₄ 是乙烯；CH₃OH 是甲醇。"},{id:"pr92",t:"mine",set:"prac",d:"b",u:10,q:"醋的主要成分是什麼？",o:["乙酸","乙醇","甲醇","乙酯"],a:0,e:"醋酸就是「乙酸」，化學式 CH₃COOH，有酸味。乙醇是酒精；甲醇有毒；酯類有水果香味。"},{id:"pr93",t:"mine",set:"prac",d:"b",u:10,q:"肥皂是由油脂和什麼物質反應製成的？",o:["氫氧化鈉","鹽酸","乙醇","二氧化碳"],a:0,e:"油脂和強鹼（氫氧化鈉）一起加熱，會生成肥皂和甘油，這叫皂化反應。鹽酸是酸，不能做肥皂。"},{id:"pr94",t:"mine",set:"prac",d:"b",u:10,q:"下列哪一種是天然纖維？",o:["棉","尼龍","聚酯纖維","壓克力纖維"],a:0,e:"天然纖維來自動植物：棉、麻（植物）、蠶絲、羊毛（動物）。尼龍、聚酯纖維、壓克力纖維都是用石油化學原料人工合成的合成纖維。"},{id:"pr95",t:"mine",set:"prac",d:"c",u:10,q:"乙酸和乙醇在濃硫酸催化下加熱，會產生什麼？",o:["乙酸乙酯和水","乙烯和氧氣","二氧化碳和水","肥皂和甘油"],a:0,e:"酸＋醇 → 酯＋水，這叫酯化反應。乙酸＋乙醇 → 乙酸乙酯＋水，濃硫酸當催化劑。酯類常有水果香味。油脂＋鹼才是做肥皂。"},{id:"pr96",t:"mine",set:"prac",d:"c",u:10,q:"肥皂能去油汙，是因為肥皂分子有什麼特性？",o:["一端親水、一端親油","只溶於水","只溶於油","會和油產生化學反應變成水"],a:0,e:"肥皂分子像一根火柴：一頭「親油」、一頭「親水」。親油端鑽進油汙裡，親水端朝外向著水，把油包成小油滴，再被水沖走。肥皂沒有把油變成水。"},{id:"pr97",t:"mine",set:"prac",d:"c",u:10,q:"乙烷（C₂H₆）與乙烯（C₂H₄）的比較，何者正確？",o:["乙烯含雙鍵，可以進行聚合反應","乙烷含雙鍵","兩者分子量相同","乙烯是烷類"],a:0,e:"乙烯 C₂H₄ 有碳碳「雙鍵」，雙鍵可以打開互相連接，聚合成聚乙烯（塑膠袋原料）。乙烷是只有單鍵的烷類。兩者分子量不同（30 和 28）。"},{id:"pr98",t:"mine",set:"prac",d:"c",u:10,q:"木材乾餾後可得到木炭、木焦油等，乾餾的條件是什麼？",o:["隔絕空氣加熱","在空氣中燃燒","加水煮沸","加酸溶解"],a:0,e:"乾餾：「隔絕空氣」加熱。因為沒有氧氣，木材不會燒起來，而是分解成木炭、木焦油、木醋液等。在空氣中加熱就變成燃燒了。"},{id:"pr99",t:"mine",set:"prac",d:"c",u:10,q:"聚乙烯（PE）是由許多乙烯分子連接而成，這類物質稱為什麼？",o:["聚合物","單體","酯類","醇類"],a:0,e:"很多小分子（單體，像乙烯）連在一起，變成很長的大分子，這叫聚合反應，產物叫「聚合物」。聚乙烯 PE、保麗龍、尼龍都是聚合物。"},{id:"pr100",t:"mine",set:"prac",d:"b",u:11,q:"一條彈簧原長 10 cm，掛 20 gw 的物體後長度變成 14 cm。改掛 30 gw（未超過彈性限度），彈簧的總長度是多少？",o:["16 cm","6 cm","21 cm","15 cm"],a:0,e:"先算伸長量：20 gw 伸長 14−10＝4 cm，每 5 gw 伸長 1 cm。掛 30 gw 伸長 6 cm，總長度＝原長＋伸長量＝10＋6＝16 cm。選 6 cm 是只算伸長量；選 21 cm 是把總長度當成伸長量來比例計算（14×1.5）。"},{id:"pr101",t:"mine",set:"prac",d:"b",u:11,q:"1000 gw 的磚塊平放在桌上，接觸面積 200 cm²，對桌面的壓力是多少？",o:["5 gw/cm²","0.2 gw/cm²","200 gw/cm²","1000 gw/cm²"],a:0,e:"壓力＝力÷受力面積。P＝1000 gw÷200 cm²＝5 gw/cm²。意思是每 1 平方公分受到 5 gw 的力。"},{id:"pr102",t:"mine",set:"prac",d:"b",u:11,q:"水深 30 cm 處的水壓是多少？（水密度 1 g/cm³）",o:["30 gw/cm²","3 gw/cm²","300 gw/cm²","0.3 gw/cm²"],a:0,e:"水壓＝深度×液體密度。P＝30 cm×1 g/cm³＝30 gw/cm²。越深水壓越大，和容器形狀無關。"},{id:"pr103",t:"mine",set:"prac",d:"b",u:11,q:"用 10 kgw 的力推箱子，箱子沒有動，這時箱子受到的摩擦力是多少？",o:["10 kgw","0","大於 10 kgw","無法判斷"],a:0,e:"箱子沒動，代表受力平衡：靜摩擦力剛好和推力一樣大、方向相反。推力 10 kgw，所以摩擦力也是 10 kgw。不是 0，否則箱子就會動了。"},{id:"pr104",t:"mine",set:"prac",d:"b",u:11,q:"物體在水中受到的浮力等於什麼？",o:["排開水的重量","物體的重量","物體的質量","水的總重"],a:0,e:"阿基米德原理：物體在液體中受到的浮力＝它排開液體的重量。浮力不一定等於物體的重量（只有浮在水面或懸浮時才相等）。"},{id:"pr105",t:"mine",set:"prac",d:"c",u:11,q:"木箱最大靜摩擦力 30 kgw。用 20 kgw 推不動，改用 35 kgw 推動後，下列何者正確？",o:["20 kgw 推時摩擦力是 20 kgw；推動後摩擦力小於 35 kgw 才會加速","推不動時摩擦力是 30 kgw","推動後摩擦力等於 35 kgw","摩擦力一直是 30 kgw"],a:0,e:"未推動時靜摩擦＝推力；推動後是動摩擦力（通常小於最大靜摩擦），合力向前才會加速。"},{id:"pr106",t:"mine",set:"prac",d:"c",u:11,q:"物體在空氣中秤重 200 gw，完全浸入水中秤重 150 gw，物體的體積是多少？",o:["50 cm³","150 cm³","200 cm³","350 cm³"],a:0,e:"浮力＝200−150＝50 gw，水密度 1，排開水 50 cm³＝物體體積。"},{id:"pr107",t:"mine",set:"prac",d:"c",u:11,q:"一顆金屬球在空氣中秤重 300 gw，完全浸入水中秤重 200 gw。這顆金屬球的密度是多少？",o:["3 g/cm³","2 g/cm³","1.5 g/cm³","0.33 g/cm³"],a:0,e:"浮力＝空氣中重−水中重＝300−200＝100 gw，表示排開 100 g 的水，所以金屬球體積＝100 cm³。密度＝質量÷體積＝300÷100＝3 g/cm³。選 2 是用水中的 200 去除；選 0.33 是把體積÷質量算反了。"},{id:"pr108",t:"mine",set:"prac",d:"c",u:11,q:"油壓機的大活塞面積是小活塞的 50 倍。要舉起大活塞上 1000 kgw 的汽車，小活塞至少要施力多少？",o:["20 kgw","50 kgw","200 kgw","50000 kgw"],a:0,e:"帕斯卡原理：兩邊壓力相等，力和面積成正比。大活塞面積是 50 倍，力也是 50 倍，所以小活塞只要 1000÷50＝20 kgw。選 50000 是乘錯方向了。"},{id:"pr109",t:"mine",set:"prac",d:"c",u:11,q:"兩個形狀不同的容器裝同樣深度的水，容器底部受到的水壓如何？",o:["相同","底面積大的較大","裝水多的較大","開口小的較大"],a:0,e:"液體壓力只和「深度」和「液體密度」有關（P＝h×d），和容器形狀、底面積、水量都沒有關係。深度一樣、都是水，底部水壓就一樣。"},{id:"pr110",t:"mine",set:"prac",d:"b",u:12,q:"小明向東走 30 m 再向西走 10 m，位移是多少？",o:["向東 20 m","40 m","向西 20 m","向東 40 m"],a:0,e:"位移看起點到終點：30−10＝向東 20 m；路徑長才是 40 m。"},{id:"pr111",t:"mine",set:"prac",d:"b",u:12,q:"汽車 2 小時行駛 120 km，平均速率是多少？",o:["60 km/h","240 km/h","120 km/h","30 km/h"],a:0,e:"平均速率＝總路程÷總時間＝120 km÷2 h＝60 km/h。選 240 是相乘了。"},{id:"pr112",t:"mine",set:"prac",d:"b",u:12,q:"x–t 圖是一條水平線，代表物體在做什麼運動？",o:["靜止","等速度運動","等加速度運動","自由落體"],a:0,e:"x–t 圖是水平線，代表時間一直過去，但位置都沒有改變，所以物體是靜止的。等速度運動的 x–t 圖是一條斜直線。"},{id:"pr113",t:"mine",set:"prac",d:"b",u:12,q:"v–t 圖中，圖線與時間軸所圍的面積代表什麼？",o:["位移","加速度","速度","時間"],a:0,e:"v–t 圖中，速度×時間＝位移，所以圖線和時間軸圍出來的「面積」就是位移。斜率才是加速度。"},{id:"pr114",t:"mine",set:"prac",d:"b",u:12,q:"物體由靜止自由落下 2 秒，末速是多少？（g＝10 m/s²）",o:["20 m/s","10 m/s","5 m/s","40 m/s"],a:0,e:"自由落體：v＝g×t＝10×2＝20 m/s。每過 1 秒速度增加 10 m/s，2 秒後就是 20 m/s。"},{id:"pr115",t:"mine",set:"prac",d:"c",u:12,q:"汽車以 20 m/s 行駛，煞車後等減速 4 秒停下，加速度大小與煞車距離各是多少？",o:["5 m/s²，40 m","5 m/s²，80 m","4 m/s²，40 m","80 m/s²，20 m"],a:0,e:"a＝(0−20)÷4＝−5 m/s²；距離＝v–t 三角形面積＝½×20×4＝40 m。"},{id:"pr116",t:"mine",set:"prac",d:"c",u:12,q:"物體由靜止自由落下，第 1 秒內與前 2 秒內落下的距離比是多少？",o:["1：4","1：2","1：3","1：1"],a:0,e:"自由落體 h＝½gt²。第 1 秒：½×10×1²＝5 m；前 2 秒：½×10×2²＝20 m。5：20＝1：4。落下距離和時間的「平方」成正比。"},{id:"pr117",t:"mine",set:"prac",d:"c",u:12,q:"v–t 圖中一條斜向上的直線，斜率越大代表什麼？",o:["加速度越大","速度越大","位移越大","物體越重"],a:0,e:"v–t 圖的斜率＝速度變化÷時間＝加速度。線越陡，速度變化越快，加速度越大。速度看縱軸的值，位移看面積。"},{id:"pr118",t:"mine",set:"prac",d:"c",u:12,q:"甲、乙兩車的 x–t 圖都是斜直線，甲的斜率比乙大。下列何者正確？",o:["甲、乙都做等速度運動，甲較快","甲在加速","乙在減速","兩車速度相同"],a:0,e:"x–t 圖是斜直線 → 位置隨時間均勻改變 → 等速度運動。斜率就是速度，甲的斜率較大，所以甲比較快。兩車都沒有加速或減速。"},{id:"pr119",t:"mine",set:"prac",d:"c",u:12,q:"球以 20 m/s 鉛直上拋，忽略空氣阻力，可上升的最大高度是多少？（g＝10 m/s²）",o:["20 m","40 m","10 m","200 m"],a:0,e:"往上丟時速度越來越小，到最高點速度變 0。用 v²＝v₀²−2gh：0＝20²−2×10×h，400＝20h，h＝20 m。也可以想成上升 2 秒、平均速度 10 m/s，10×2＝20 m。"},{id:"pr120",t:"mine",set:"prac",d:"b",u:13,q:"公車突然起動，乘客身體往後倒，這可以用哪一個定律解釋？",o:["慣性定律","F＝ma","作用力與反作用力","萬有引力"],a:0,e:"公車起動時腳跟著車往前，但身體想保持原本的靜止狀態（慣性），所以看起來往後倒。這就是牛頓第一運動定律（慣性定律）。"},{id:"pr121",t:"mine",set:"prac",d:"b",u:13,q:"質量 2 kg 的物體受 10 N 的合力，加速度是多少？",o:["5 m/s²","20 m/s²","0.2 m/s²","12 m/s²"],a:0,e:"牛頓第二運動定律 F＝ma，a＝F÷m＝10÷2＝5 m/s²。選 20 是相乘、0.2 是 m÷F 除反了。"},{id:"pr122",t:"mine",set:"prac",d:"b",u:13,q:"人用手推牆，牆也推人，這兩個力的關係是什麼？",o:["大小相等、方向相反、作用在不同物體上","作用在同一物體上互相抵消","牆的力比較小","方向相同"],a:0,e:"作用力與反作用力：大小相等、方向相反、作用在「不同物體」上（手推牆、牆推手）。因為作用在不同物體上，所以不能互相抵消。"},{id:"pr123",t:"mine",set:"prac",d:"b",u:13,q:"兩物體距離變成原來的 2 倍，萬有引力變成原來的多少？",o:["1/4","1/2","2 倍","4 倍"],a:0,e:"萬有引力和距離的「平方」成反比。距離變 2 倍，引力變成 1÷(2×2)＝1/4。選 1/2 是忘了平方；距離變遠引力只會變小，所以不可能是 2 倍或 4 倍。"},{id:"pr124",t:"mine",set:"prac",d:"b",u:13,q:"用繩子綁球做等速率圓周運動，若繩子突然斷掉，球會怎麼運動？",o:["沿切線方向飛出","沿半徑向外飛出","直接掉向圓心","繼續做圓周運動"],a:0,e:"繩子斷掉，拉住球的向心力消失。球會依慣性，沿著斷掉那一瞬間的速度方向前進，也就是圓的「切線方向」。不會沿半徑往外飛，也不會掉向圓心。"},{id:"pr125",t:"mine",set:"prac",d:"c",u:13,q:"質量 4 kg 的木塊放在水平面，受 20 N 向右拉力，摩擦力 8 N，加速度是多少？",o:["3 m/s²","5 m/s²","2 m/s²","7 m/s²"],a:0,e:"先算合力：拉力向右 20 N，摩擦力向左 8 N，合力＝20−8＝12 N。再用 F＝ma：a＝12÷4＝3 m/s²。選 5 是忘了扣摩擦力（20÷4）。"},{id:"pr126",t:"mine",set:"prac",d:"c",u:13,q:"蹺蹺板上，40 kgw 的甲坐在離支點 1.5 m 處，30 kgw 的乙要坐在哪裡才能平衡？",o:["另一側離支點 2 m","另一側離支點 1.5 m","另一側離支點 1.125 m","同一側離支點 2 m"],a:0,e:"蹺蹺板平衡要兩邊力矩相等：力×到支點距離。甲：40×1.5＝60；乙：30×d＝60，d＝2 m，而且要坐在「另一側」才能平衡。乙比較輕，所以要坐比較遠。"},{id:"pr127",t:"mine",set:"prac",d:"c",u:13,q:"在等速上升的電梯中，人對電梯地板的壓力與人的重量比較如何？",o:["相等","較大","較小","變成零"],a:0,e:"等速上升代表速度沒變，加速度為零，合力也是零。所以地板往上撐的力＝人的重量，人壓地板的力也等於重量。只有加速上升時才會比較大。"},{id:"pr128",t:"mine",set:"prac",d:"c",u:13,q:"物體受到兩個力仍做等速度直線運動，下列何者正確？",o:["兩力大小相等、方向相反","物體一定靜止","只受一個力","兩力方向相同"],a:0,e:"等速度直線運動 → 速度不變 → 合力為零。兩個力要互相抵消，就必須大小相等、方向相反。合力為零的物體可以靜止，也可以等速前進，不一定靜止。"},{id:"pr129",t:"mine",set:"prac",d:"c",u:13,q:"同一物體在月球上與地球上相比，下列何者正確？",o:["質量相同，重量較小","質量變小，重量變小","質量與重量都不變","重量相同，質量較小"],a:0,e:"質量是物體含有多少物質，到哪裡都不變。重量是受到的重力，月球重力約地球的 1/6，所以在月球重量變小。記法：質量不變、重量會變。"},{id:"pr130",t:"mine",set:"prac",d:"b",u:14,q:"用 20 N 的力沿水平推箱子前進 5 m，作功多少？",o:["100 J","4 J","25 J","0 J"],a:0,e:"作功 W＝力×沿力方向移動的距離＝20 N×5 m＝100 J。選 4 是相除了；推了而且有移動，作功不是 0。"},{id:"pr131",t:"mine",set:"prac",d:"b",u:14,q:"提著書包在水平走廊上等速走 10 m，手對書包作功多少？",o:["0","書包重×10 m","10 J","無法判斷"],a:0,e:"手提書包的力是「向上」，但書包是「水平」移動，在力的方向上沒有移動距離，所以手對書包作功＝0。物理上的作功和覺得累不一樣。"},{id:"pr132",t:"mine",set:"prac",d:"b",u:14,q:"質量 2 kg 的球以 3 m/s 運動，動能是多少？",o:["9 J","6 J","18 J","3 J"],a:0,e:"動能 Ek＝½×m×v²＝½×2×3²＝½×2×9＝9 J。選 6 是忘了平方（½×2×3×2）；18 是忘了乘 ½。"},{id:"pr133",t:"mine",set:"prac",d:"b",u:14,q:"機器 5 秒作功 1000 J，功率是多少？",o:["200 W","5000 W","1000 W","20 W"],a:0,e:"功率＝作功÷時間＝1000 J÷5 s＝200 W，意思是每秒作 200 J 的功。選 5000 是相乘了。"},{id:"pr134",t:"mine",set:"prac",d:"b",u:14,q:"使用動滑輪提重物（不計滑輪重與摩擦），下列何者正確？",o:["省一半的力，但拉繩距離是兩倍","省力也省距離","不省力只改變方向","費力但省時間"],a:0,e:"動滑輪由兩段繩子一起拉住重物，所以拉力只要一半；但物體上升 1 m，繩子要拉 2 m。省力就費距離，作的功不會變少，沒有機械能同時省力又省距離。"},{id:"pr135",t:"mine",set:"prac",d:"c",u:14,q:"1 kg 的球從 5 m 高自由落下，不計空氣阻力，落地前瞬間的速率是多少？（g＝10 m/s²）",o:["10 m/s","5 m/s","50 m/s","100 m/s"],a:0,e:"力學能守恆：位能全部變動能。mgh＝½mv²，質量可以消掉：10×5＝½v²，v²＝100，v＝10 m/s。選 50 是 g×h 忘了開根號的步驟。"},{id:"pr136",t:"mine",set:"prac",d:"c",u:14,q:"物體速率變為原來的 3 倍，動能變為原來的幾倍？",o:["9 倍","3 倍","6 倍","1/3 倍"],a:0,e:"動能 Ek＝½mv²，和速率的「平方」成正比。速率變 3 倍，動能變 3×3＝9 倍。選 3 倍是忘了平方。"},{id:"pr137",t:"mine",set:"prac",d:"c",u:14,q:"單擺從最高點擺到最低點（不計阻力），下列何者正確？",o:["位能減少的量等於動能增加的量","力學能變小","最低點動能為零","最高點速率最大"],a:0,e:"不計阻力時力學能守恆：往下擺時高度降低、位能減少，減少的位能全部變成動能。所以最低點動能最大、速率最大；最高點速率是零，動能是零。"},{id:"pr138",t:"mine",set:"prac",d:"c",u:14,q:"用 50 N 的力把 10 kg 的物體沿斜面推上 1 m 高處，斜面長 2.5 m。這個斜面是否有摩擦？（g＝10 m/s²）",o:["有，推力作功 125 J 大於位能增加 100 J","沒有，作功剛好等於位能","沒有，作功小於位能","無法判斷"],a:0,e:"W＝50×2.5＝125 J，位能增加 mgh＝100 J，多的 25 J 用來克服摩擦。"},{id:"pr139",t:"mine",set:"prac",d:"c",u:14,q:"槓桿的抗力臂比施力臂長，這個槓桿有什麼特性？",o:["費力但省距離","省力但費距離","不省力也不費力","又省力又省距離"],a:0,e:"施力×施力臂＝抗力×抗力臂，施力臂短就要較大的力，但手移動距離較小。"},{id:"pr140",t:"mine",set:"prac",d:"b",u:15,q:"毛皮摩擦塑膠尺後，塑膠尺帶負電。關於毛皮，下列何者正確？",o:["毛皮失去電子，帶等量的正電","毛皮得到電子，帶負電","毛皮得到質子，帶正電","毛皮不帶電"],a:0,e:"摩擦起電時只有電子會轉移，總電量守恆。塑膠尺帶負電，表示它得到了電子，這些電子來自毛皮，所以毛皮失去電子，帶「等量」的正電。質子在原子核裡，不會移動。"},{id:"pr141",t:"mine",set:"prac",d:"b",u:15,q:"電阻 5 Ω 的電燈接 10 V 電壓，通過的電流是多少？",o:["2 A","50 A","0.5 A","15 A"],a:0,e:"歐姆定律 V＝I×R，所以 I＝V÷R＝10÷5＝2 A。選 50 是相乘、0.5 是 R÷V 除反了。"},{id:"pr142",t:"mine",set:"prac",d:"b",u:15,q:"10 秒內有 20 C 的電量通過導線，電流是多少？",o:["2 A","200 A","0.5 A","30 A"],a:0,e:"電流＝通過的電量÷時間：I＝Q÷t＝20 C÷10 s＝2 A，意思是每秒通過 2 庫侖的電量。"},{id:"pr143",t:"mine",set:"prac",d:"b",u:15,q:"測量燈泡兩端電壓時，伏特計要怎麼接？",o:["與燈泡並聯","與燈泡串聯","接在電池正極即可","不用接電源"],a:0,e:"伏特計量的是燈泡「兩端」的電壓差，所以要跨接在燈泡兩端，與燈泡並聯。安培計才是串聯。口訣：安串伏並。"},{id:"pr144",t:"mine",set:"prac",d:"b",u:15,q:"電流方向與電子流動方向的關係是什麼？",o:["相反","相同","垂直","沒有關係"],a:0,e:"電流方向規定為：正極 → 外電路 → 負極。但真正在導線裡移動的是電子，電子帶負電，從負極流向正極。所以兩者方向相反。"},{id:"pr145",t:"mine",set:"prac",d:"c",u:15,q:"2 Ω 與 3 Ω 兩電阻串聯接在 10 V 電源，通過 3 Ω 電阻的電壓是多少？",o:["6 V","4 V","10 V","5 V"],a:0,e:"總電阻 5 Ω，電流 2 A，3 Ω 兩端電壓＝2×3＝6 V。"},{id:"pr146",t:"mine",set:"prac",d:"c",u:15,q:"6 Ω 與 3 Ω 兩電阻並聯，總電阻是多少？",o:["2 Ω","9 Ω","4.5 Ω","3 Ω"],a:0,e:"並聯總電阻：1/R＝1/6＋1/3＝1/6＋2/6＝3/6，R＝2 Ω。兩個電阻時也可以用「相乘÷相加」：6×3÷9＝2 Ω。並聯後總電阻會比最小的那個還小，所以不會是 9 或 4.5。"},{id:"pr147",t:"mine",set:"prac",d:"c",u:15,q:"4 Ω 與 12 Ω 兩電阻並聯後接在 6 V 電源上，總電流是多少？",o:["2 A","0.375 A","1.5 A","0.5 A"],a:0,e:"並聯每條支路電壓都是 6 V：4 Ω 支路 6÷4＝1.5 A，12 Ω 支路 6÷12＝0.5 A，總電流＝1.5＋0.5＝2 A。也可以先算總電阻 4×12÷(4＋12)＝3 Ω，6÷3＝2 A。選 0.375 是誤把兩個電阻串聯（6÷16）。"},{id:"pr148",t:"mine",set:"prac",d:"c",u:15,q:"同材質的導線，長度變為 2 倍、截面積變為 2 倍，電阻變為原來的多少？",o:["不變","2 倍","4 倍","1/4 倍"],a:0,e:"導線電阻和長度成正比、和截面積成反比。長度 2 倍 → 電阻 ×2；截面積 2 倍 → 電阻 ÷2。×2÷2＝1，電阻不變。"},{id:"pr149",t:"mine",set:"prac",d:"c",u:15,q:"帶負電的塑膠棒靠近一個不帶電的金屬球（不接觸），金屬球靠近塑膠棒的一側帶什麼電？",o:["正電","負電","不帶電","正負電交替"],a:0,e:"塑膠棒帶負電，會把金屬球裡的電子「推」到遠的那一端。靠近塑膠棒的那一側少了電子，就帶正電。這叫靜電感應，金屬球整體還是不帶電。"},{id:"pr150",t:"mine",set:"prac",d:"b",u:16,q:"一台 1000 W 的電鍋使用 2 小時，耗電多少度？",o:["2 度","2000 度","0.5 度","20 度"],a:0,e:"1 度電＝1 kWh（1 千瓦用 1 小時）。1000 W＝1 kW，1 kW×2 h＝2 度。選 2000 是忘了把 W 換成 kW。"},{id:"pr151",t:"mine",set:"prac",d:"b",u:16,q:"燈泡接 110 V，通過 0.5 A，電功率是多少？",o:["55 W","220 W","110.5 W","0.0045 W"],a:0,e:"電功率 P＝I×V＝0.5 A×110 V＝55 W。選 220 是 110÷0.5，除錯了。"},{id:"pr152",t:"mine",set:"prac",d:"b",u:16,q:"家庭電路中，各電器之間是怎麼連接的？",o:["並聯","串聯","有的串聯有的並聯","全部接在同一條線上串聯"],a:0,e:"家庭電路用並聯：每個電器都能拿到 110 V，而且一個電器關掉或壞掉，其他電器照樣能用。如果是串聯，一個關掉全部都不會亮。"},{id:"pr153",t:"mine",set:"prac",d:"b",u:16,q:"電流通過電熱線會發熱，是電流的哪一種效應？",o:["熱效應","磁效應","化學效應","光效應"],a:0,e:"電流通過電熱線，電能變成熱能，這是電流的「熱效應」，電鍋、吹風機、電暖器都是。電磁鐵是磁效應；電解、電鍍是化學效應。"},{id:"pr154",t:"mine",set:"prac",d:"b",u:16,q:"電解水時，負極產生的氣體是什麼？",o:["氫氣","氧氣","氯氣","二氧化碳"],a:0,e:"電解水：負極產生氫氣、正極產生氧氣，體積比氫：氧＝2：1（因為 H₂O 有 2 個 H）。口訣：負氫正氧，氫多一倍。"},{id:"pr155",t:"mine",set:"prac",d:"c",u:16,q:"兩個電阻 R 串聯接電源，和兩個電阻 R 並聯接同一電源，總電功率的比是多少？",o:["1：4","1：2","2：1","4：1"],a:0,e:"串聯總電阻 2R，並聯 R/2；P＝V²÷R，比為 (1/2R)：(2/R)＝1：4。"},{id:"pr156",t:"mine",set:"prac",d:"c",u:16,q:"規格「110 V、220 W」的電器，正常使用時電阻是多少？",o:["55 Ω","2 Ω","0.5 Ω","24200 Ω"],a:0,e:"先求電流：I＝P÷V＝220÷110＝2 A。再求電阻：R＝V÷I＝110÷2＝55 Ω。也可以直接 R＝V²÷P＝12100÷220＝55 Ω。"},{id:"pr157",t:"mine",set:"prac",d:"c",u:16,q:"在銅鑰匙上鍍銀，下列做法何者正確？",o:["鑰匙接負極、銀片接正極，用硝酸銀溶液","鑰匙接正極、銀片接負極","鑰匙接負極，用硫酸銅溶液","兩極都用鑰匙"],a:0,e:"電鍍：要被鍍的東西（鑰匙）接「負極」，鍍上去的金屬（銀）接「正極」，電解液要含有銀離子（硝酸銀）。銀離子跑到負極得到電子，變成銀附著在鑰匙上。用硫酸銅只會鍍上銅。"},{id:"pr158",t:"mine",set:"prac",d:"c",u:16,q:"鋅銅電池放電一段時間後，取出兩片金屬秤重，最可能的結果為何？",o:["鋅片變輕、銅片變重","鋅片變重、銅片變輕","兩片都變輕","兩片質量都不變"],a:0,e:"鋅活性大，是負極，Zn 失去電子變成 Zn²⁺ 溶進溶液，所以鋅片變輕。電子經導線流到銅片，溶液中的 Cu²⁺ 在銅片上得到電子變成銅附著上去，所以銅片變重。"},{id:"pr159",t:"mine",set:"prac",d:"c",u:16,q:"保險絲應該怎麼接、有什麼特性？",o:["串聯在電路中，熔點低","並聯在電路中，熔點高","串聯在電路中，熔點高","可以用銅線代替"],a:0,e:"保險絲要「串聯」在電路中，電流全部經過它。它熔點低，電流太大時發熱熔斷，切斷電路保護安全。用銅線代替熔點太高不會斷，非常危險。"},{id:"pr160",t:"mine",set:"prac",d:"b",u:17,q:"磁鐵的磁力線在磁鐵外部的方向是什麼？",o:["由 N 極出發回到 S 極","由 S 極出發回到 N 極","由中間向兩端","沒有方向"],a:0,e:"磁力線在磁鐵外面由 N 極出發、回到 S 極；在磁鐵裡面由 S 到 N，形成封閉曲線。磁力線越密的地方磁場越強（兩極最強）。"},{id:"pr161",t:"mine",set:"prac",d:"b",u:17,q:"地理北極附近是地磁的什麼極？",o:["S 極","N 極","沒有磁極","N、S 極都有"],a:0,e:"指北針的 N 極指北，表示地理北極附近是地磁 S 極（異極相吸）。"},{id:"pr162",t:"mine",set:"prac",d:"b",u:17,q:"要增加電磁鐵的磁力，下列哪一個方法有效？",o:["增加線圈匝數","改用塑膠當鐵芯","減小電流","把線圈拉長變稀疏"],a:0,e:"電磁鐵變強的方法：增加線圈匝數、增加電流、插入鐵芯。塑膠不會被磁化，不能增強；電流變小或線圈變稀疏都會讓磁力變弱。"},{id:"pr163",t:"mine",set:"prac",d:"b",u:17,q:"電動機（馬達）主要是把什麼能量轉換成動能？",o:["電能","化學能","熱能","光能"],a:0,e:"馬達通電後會轉動：通電的線圈在磁場中受到磁力而轉動，把「電能」轉成「動能」。發電機則相反，把動能轉成電能。"},{id:"pr164",t:"mine",set:"prac",d:"b",u:17,q:"發電機是根據哪一個原理製成的？",o:["電磁感應","電流磁效應","摩擦起電","電流熱效應"],a:0,e:"發電機：線圈在磁鐵間轉動，穿過線圈的磁場一直變化，就產生感應電流，這是「電磁感應」。電流磁效應是馬達、電磁鐵的原理。"},{id:"pr165",t:"mine",set:"prac",d:"c",u:17,q:"磁鐵 N 極靠近線圈時，線圈靠近磁鐵那一端會產生什麼極？",o:["N 極，產生斥力","S 極，產生吸力","不產生磁極","N 極，產生吸力"],a:0,e:"感應電流產生的磁場會「反抗」磁場的變化（冷次定律）。N 極靠近，線圈就在靠近那端產生 N 極把它推開（斥力）。如果 N 極遠離，才會產生 S 極去吸住它。"},{id:"pr166",t:"mine",set:"prac",d:"c",u:17,q:"把磁鐵靜止放在線圈中不動，線圈中有沒有感應電流？",o:["沒有，因為磁場沒有變化","有，而且很大","有，方向一直改變","只有在 N 極時有"],a:0,e:"產生感應電流的關鍵是線圈裡的磁場要「改變」。磁鐵靜止不動，磁場一直一樣，沒有變化，所以沒有感應電流。插入或拔出的瞬間才會有。"},{id:"pr167",t:"mine",set:"prac",d:"c",u:17,q:"增加發電機產生的感應電流，下列何者無效？",o:["改用塑膠線圈","轉得更快","使用更強的磁鐵","增加線圈匝數"],a:0,e:"塑膠是絕緣體，電子不能在裡面流動，所以塑膠線圈不會有感應電流。轉得更快、磁鐵更強、匝數更多，都會讓磁場變化更大，感應電流變大。"},{id:"pr168",t:"mine",set:"prac",d:"c",u:17,q:"兩條平行導線通以同方向電流，兩導線之間的作用力是什麼？",o:["互相吸引","互相排斥","沒有作用力","一條吸、一條斥"],a:0,e:"兩條平行導線通「同方向」電流會互相吸引；通「相反方向」電流會互相排斥（和磁鐵相反，要特別記）。"},{id:"pr169",t:"mine",set:"prac",d:"c",u:17,q:"直導線電流由南向北，把磁針放在導線正下方，磁針 N 極會偏向哪裡？",o:["偏西","偏東","不偏轉","偏北"],a:0,e:"右手定則：大拇指指電流方向（北），四指彎曲方向就是磁場方向。導線上方磁場朝東、下方朝西，所以放在導線下方的磁針 N 極偏向西。"},{id:"pr170",t:"mine",set:"prac",d:"b",u:101,q:"進行光合作用的胞器是什麼？",o:["葉綠體","粒線體","細胞核","液胞"],a:0,e:"葉綠體裡有葉綠素，能吸收光能進行光合作用，製造葡萄糖。粒線體是進行呼吸作用、產生能量的地方；細胞核控制遺傳；液胞儲存水分。"},{id:"pr171",t:"mine",set:"prac",d:"b",u:101,q:"控制物質進出細胞的構造是什麼？",o:["細胞膜","細胞壁","細胞核","細胞質"],a:0,e:"細胞膜包在細胞外圍，可以選擇哪些物質能進出細胞（選擇性通透）。細胞壁在植物細胞膜外面，主要是支撐和保護，不控制物質進出。"},{id:"pr172",t:"mine",set:"prac",d:"b",u:101,q:"複式顯微鏡的目鏡是 10×，若想要總放大倍率為 100 倍，應該使用幾倍的物鏡？",o:["10×","90×","100×","1000×"],a:0,e:"總放大倍率＝目鏡倍率×物鏡倍率。100＝10×物鏡，物鏡＝10×。選 90× 是用減法；倍率是相乘關係，不是相加。"},{id:"pr173",t:"mine",set:"prac",d:"b",u:101,q:"下列哪一個生物組成層次，植物沒有？",o:["器官系統","組織","器官","細胞"],a:0,e:"動物：細胞 → 組織 → 器官 → 器官系統 → 個體。植物：細胞 → 組織 → 器官 → 個體，少了「器官系統」這一層。組織、器官、細胞植物都有。"},{id:"pr174",t:"mine",set:"prac",d:"b",u:101,q:"提出「細胞是生物構造和功能的基本單位」的是哪一個學說？",o:["細胞學說","天擇說","原子說","大陸漂移說"],a:0,e:"細胞學說：所有生物都由細胞組成，細胞是構造和功能的基本單位，細胞由原來的細胞分裂而來。天擇說是演化、原子說是化學、大陸漂移說是地科。"},{id:"pr175",t:"mine",set:"prac",d:"c",u:101,q:"從低倍物鏡換成高倍物鏡後，視野會有什麼變化？",o:["變暗、範圍變小、看到的細胞數變少","變亮、範圍變大","細胞數變多","沒有任何改變"],a:0,e:"換高倍物鏡：看得越大，但視野範圍變小，看到的細胞數變少；進入的光變少，所以視野變暗（要調亮光圈或反光鏡）。"},{id:"pr176",t:"mine",set:"prac",d:"c",u:101,q:"在複式顯微鏡下觀察時，把玻片往右推，視野中的影像會往哪個方向移動？",o:["往左","往右","往上","不會移動"],a:0,e:"複式顯微鏡的影像上下左右都是顛倒的，所以玻片往右推，看到的影像會往「左」移。也可以反過來記：影像要往哪邊移，就把玻片往相反方向推；想把偏左的影像移到中央，玻片要往左推。"},{id:"pr177",t:"mine",set:"prac",d:"c",u:101,q:"把紅血球放進濃鹽水中，紅血球會怎麼變化？",o:["水分流出，細胞皺縮","水分流入，細胞脹破","沒有變化","細胞壁破裂"],a:0,e:"濃鹽水裡的水比紅血球裡少，水會從水多的地方往水少的地方移動（滲透），所以紅血球裡的水流出去，細胞皺縮。放在清水中才會吸水脹破。"},{id:"pr178",t:"mine",set:"prac",d:"c",u:101,q:"洋蔥表皮細胞放入清水中，為什麼不會脹破？",o:["有細胞壁支撐","沒有細胞膜","水無法進入","細胞核會阻止水進入"],a:0,e:"洋蔥是植物細胞，細胞膜外面還有一層堅硬的細胞壁。放在清水裡會吸水膨脹，但被細胞壁撐住，所以不會脹破。紅血球沒有細胞壁，在清水中就會脹破。"},{id:"pr179",t:"mine",set:"prac",d:"c",u:101,q:"要驗證「光照會影響綠豆發芽」，下列設計何者正確？",o:["兩組綠豆一組照光、一組不照光，水分溫度都相同","兩組都照光但澆水量不同","一組照光澆水，一組不照光不澆水","只做照光一組"],a:0,e:"實驗設計要「只改變一個條件」（操縱變因：光照），其他條件（水、溫度、綠豆種類和數量）都要一樣，這樣結果不同才能確定是光造成的。"},{id:"pr180",t:"mine",set:"prac",d:"b",u:102,q:"碘液遇到哪一種養分會變成藍黑色？",o:["澱粉","葡萄糖","蛋白質","脂質"],a:0,e:"碘液遇澱粉變「藍黑色」，是檢驗澱粉的方法。葡萄糖要用本氏液（加熱變紅）；碘液不能檢驗蛋白質和脂質。"},{id:"pr181",t:"mine",set:"prac",d:"b",u:102,q:"光合作用需要的原料是什麼？",o:["二氧化碳和水","氧氣和葡萄糖","氧氣和水","二氧化碳和氧氣"],a:0,e:"光合作用：二氧化碳＋水 → 葡萄糖＋氧氣（需要光和葉綠體）。原料是二氧化碳和水；葡萄糖和氧氣是產物，不要搞反。"},{id:"pr182",t:"mine",set:"prac",d:"b",u:102,q:"下列哪一種養分不能提供能量？",o:["維生素","醣類","脂質","蛋白質"],a:0,e:"能提供能量的養分：醣類、脂質、蛋白質。維生素、礦物質、水不提供能量，但能幫助調節身體機能，一樣很重要。"},{id:"pr183",t:"mine",set:"prac",d:"b",u:102,q:"人體最主要的消化與吸收器官是什麼？",o:["小腸","胃","大腸","口腔"],a:0,e:"小腸很長，內壁有很多絨毛，表面積很大，還有胰液、腸液、膽汁，所以是消化和吸收最主要的器官。胃只消化一部分蛋白質；大腸主要吸收水分。"},{id:"pr184",t:"mine",set:"prac",d:"b",u:102,q:"酵素的主要成分是什麼？",o:["蛋白質","醣類","脂質","維生素"],a:0,e:"酵素的主要成分是蛋白質，所以怕高溫、對 pH 很敏感。溫度太高或酸鹼不對，酵素會變性失去活性。"},{id:"pr185",t:"mine",set:"prac",d:"c",u:102,q:"唾液澱粉酶放在 100℃ 煮沸後再降回 37℃，加入澱粉液，結果如何？",o:["澱粉不被分解，因為酵素已變性失去活性","澱粉被分解","澱粉變成蛋白質","分解速度加快"],a:0,e:"酵素是蛋白質，煮到 100℃ 會「變性」，結構被破壞，就算再降回 37℃ 也無法恢復。所以唾液澱粉酶失去作用，澱粉不會被分解。"},{id:"pr186",t:"mine",set:"prac",d:"c",u:102,q:"一株植物放在黑暗中 48 小時後照光，葉片一半用鋁箔遮住。滴碘液後哪一部分變藍黑色？",o:["照光的部分","遮光的部分","整片葉子","都不會變色"],a:0,e:"放黑暗中 48 小時，是為了把葉子原本的澱粉用光。照光的部分能進行光合作用產生澱粉，滴碘液變藍黑色；遮光的部分沒有光，不能製造澱粉，不變色。"},{id:"pr187",t:"mine",set:"prac",d:"c",u:102,q:"晚上植物不進行光合作用，下列何者正確？",o:["仍進行呼吸作用，釋出二氧化碳","也停止呼吸作用","釋出大量氧氣","停止所有生理作用"],a:0,e:"光合作用需要光，晚上會停止；但呼吸作用整天 24 小時都在進行，晚上植物依然吸收氧氣、放出二氧化碳。白天也有呼吸作用，只是光合作用比較明顯。"},{id:"pr188",t:"mine",set:"prac",d:"c",u:102,q:"膽汁能幫助消化脂質，下列敘述何者正確？",o:["膽汁不含酵素，是把脂質乳化成小油滴","膽汁含脂肪酶","膽汁由膽囊製造","膽汁可以分解蛋白質"],a:0,e:"膽汁是肝臟製造、膽囊儲存的。膽汁裡沒有酵素，它把大油滴打散成小油滴（乳化），讓脂肪酶比較好作用，屬於物理性消化，不能分解蛋白質。"},{id:"pr189",t:"mine",set:"prac",d:"c",u:102,q:"胃蛋白酶在胃中作用良好，移到小腸後活性變差，最可能的原因是什麼？",o:["小腸環境偏鹼性，與胃的酸性不同","小腸溫度太高","小腸中沒有蛋白質","胃蛋白酶被膽汁分解"],a:0,e:"酵素有自己最適合的 pH。胃蛋白酶適合胃裡的強酸性環境；小腸因為有胰液、膽汁，環境偏鹼性，所以胃蛋白酶到小腸活性就變差。"},{id:"pr190",t:"mine",set:"prac",d:"b",u:103,q:"植物體中，運送水分的是哪一種構造？",o:["木質部","韌皮部","表皮","氣孔"],a:0,e:"木質部負責把根吸收的水和礦物質「由下往上」送到葉子。韌皮部運送養分；表皮保護；氣孔讓氣體進出和散失水分。"},{id:"pr191",t:"mine",set:"prac",d:"b",u:103,q:"人到高山上住一段時間後，血液中某種血球會增加，幫助身體在空氣稀薄的地方取得足夠的氧。這種血球是什麼？",o:["紅血球","白血球","血小板","淋巴球"],a:0,e:"高山上空氣稀薄，氧氣較少，身體會製造更多含有血紅素的紅血球，提高運送氧氣的能力。白血球（含淋巴球）負責防禦病菌；血小板負責凝血，都和運送氧氣無關。"},{id:"pr192",t:"mine",set:"prac",d:"b",u:103,q:"心臟中，負責把血液送到全身的是哪一個腔室？",o:["左心室","右心室","左心房","右心房"],a:0,e:"左心室要把血液送到全身，路最遠，所以肌肉壁最厚、力量最大，血液從左心室打進主動脈。右心室只送到肺；心房是接收回心的血。"},{id:"pr193",t:"mine",set:"prac",d:"b",u:103,q:"物質交換主要發生在哪一種血管？",o:["微血管","動脈","靜脈","主動脈"],a:0,e:"微血管很細，管壁只有一層細胞，血液流得慢，養分、氧氣、廢物容易穿過管壁，在這裡和組織細胞交換。動脈、靜脈管壁厚，不能交換物質。"},{id:"pr194",t:"mine",set:"prac",d:"b",u:103,q:"植物體內水分散失的主要部位是什麼？",o:["葉片的氣孔","根毛","莖的表皮","花瓣"],a:0,e:"植物體內的水大多從葉片的「氣孔」以水蒸氣散失，這叫蒸散作用，也是把水往上拉的主要力量。根毛是吸收水分的地方。"},{id:"pr195",t:"mine",set:"prac",d:"c",u:103,q:"下列哪一條血管流的是充氧血？",o:["肺靜脈","肺動脈","上大靜脈","下大靜脈"],a:0,e:"肺靜脈把在肺裡充好氧的血送回左心房，所以流的是充氧血（雖然名字是靜脈）。肺動脈則把缺氧血從右心室送去肺。上下大靜脈是全身回來的缺氧血。"},{id:"pr196",t:"mine",set:"prac",d:"c",u:103,q:"從右心室出發，血液依序經過的路徑何者正確？",o:["肺動脈 → 肺 → 肺靜脈 → 左心房","主動脈 → 全身 → 大靜脈 → 右心房","肺靜脈 → 肺 → 肺動脈 → 左心房","肺動脈 → 肺 → 肺靜脈 → 右心房"],a:0,e:"從右心室出發是「肺循環」：右心室 → 肺動脈 → 肺（換氣，變充氧血）→ 肺靜脈 → 左心房。回到的是「左」心房，不是右心房；從左心室出發的才是體循環。"},{id:"pr197",t:"mine",set:"prac",d:"c",u:103,q:"在樹幹上環狀剝去一圈樹皮（含韌皮部），一段時間後切口上方膨大，原因是什麼？",o:["葉片製造的養分往下運送受阻而堆積","水分無法往上運送","根部養分往上堆積","木質部被破壞"],a:0,e:"樹皮裡有韌皮部，負責把葉子做的養分往下送。剝掉一圈後，養分送不下去，堆在切口上方，所以上方膨大。水是走木質部（在樹皮內側），沒被破壞，所以葉子不會馬上枯萎。"},{id:"pr198",t:"mine",set:"prac",d:"c",u:103,q:"靜脈中有瓣膜，主要功能是什麼？",o:["防止血液倒流","增加血壓","過濾血液","製造血球"],a:0,e:"靜脈的血壓很低，血液回心臟比較困難，靜脈裡的瓣膜像單向門，只讓血液往心臟流，防止倒流。動脈血壓高，不需要瓣膜。"},{id:"pr199",t:"mine",set:"prac",d:"c",u:103,q:"天氣炎熱、空氣乾燥又有風時，植物的蒸散作用會如何？",o:["變快","變慢","停止","不受影響"],a:0,e:"蒸散作用就是葉子的水分蒸發。溫度高（水蒸發快）、空氣乾燥（濕度低）、有風（把水氣吹走），三個條件都會讓蒸散「變快」，就像晾衣服在大熱天有風時乾得最快。"},{id:"pr200",t:"mine",set:"prac",d:"b",u:104,q:"反射作用的中樞通常在哪裡？",o:["脊髓或腦幹","大腦","小腦","心臟"],a:0,e:"反射作用不需要大腦思考，由脊髓（例如縮手、膝跳）或腦幹（例如眨眼、咳嗽）直接控制，所以反應很快。大腦負責有意識的行為；小腦管平衡。"},{id:"pr201",t:"mine",set:"prac",d:"b",u:104,q:"負責思考、記憶、判斷，並產生視覺、痛覺等感覺的是腦的哪一部分？",o:["大腦","小腦","腦幹","脊髓"],a:0,e:"大腦是最高級的中樞，負責思考、記憶、判斷和各種感覺（看到、聽到、覺得痛都是在大腦產生）。小腦管平衡與協調；腦幹管呼吸、心跳；脊髓負責傳遞訊息和簡單反射。"},{id:"pr202",t:"mine",set:"prac",d:"b",u:104,q:"可以降低血糖的激素是什麼？",o:["胰島素","升糖素","甲狀腺素","腎上腺素"],a:0,e:"胰島素讓血糖進入細胞利用或變成肝糖儲存，血糖就下降。升糖素作用相反，讓血糖上升；腎上腺素緊急時也會讓血糖上升；甲狀腺素調節代謝。"},{id:"pr203",t:"mine",set:"prac",d:"b",u:104,q:"植物的莖朝光源方向彎曲，稱為什麼？",o:["向光性","向地性","觸發運動","睡眠運動"],a:0,e:"植物的莖「朝光源」彎曲生長，叫向光性，這是慢慢「生長」造成的。根往下長是向地性；含羞草被碰到閉合是觸發運動；葉子晚上閉合是睡眠運動。"},{id:"pr204",t:"mine",set:"prac",d:"b",u:104,q:"激素主要經由什麼運送到全身？",o:["血液","神經","導管","淋巴結"],a:0,e:"內分泌腺沒有導管，激素分泌後直接進入「血液」，隨著血液流到全身。神經是傳電訊號的；有導管的是外分泌腺（如汗腺、唾腺）。"},{id:"pr205",t:"mine",set:"prac",d:"c",u:104,q:"手被針刺到，立刻縮手後才感到痛，原因是什麼？",o:["縮手是脊髓控制的反射，痛覺要傳到大腦才產生","大腦先決定縮手","痛覺由脊髓產生","縮手是意識行為"],a:0,e:"縮手反射的路線很短，只到脊髓就折返，所以先縮手。痛覺要一路往上傳到「大腦」才會產生，路比較長，所以縮完手才覺得痛。感覺（痛）都是在大腦產生的。"},{id:"pr206",t:"mine",set:"prac",d:"c",u:104,q:"看到紅燈停下腳步，訊息傳遞的路徑何者正確？",o:["眼睛 → 感覺神經 → 大腦 → 運動神經 → 腿部肌肉","眼睛 → 脊髓 → 腿部肌肉","眼睛 → 運動神經 → 大腦 → 感覺神經 → 肌肉","眼睛 → 小腦 → 心臟"],a:0,e:"看到紅燈停下來是有意識的行為，要經過大腦判斷。路徑：眼睛（受器）→ 感覺神經 → 大腦（判斷）→ 運動神經 → 腿部肌肉（動器）。感覺神經往內傳、運動神經往外傳，順序不能顛倒。"},{id:"pr207",t:"mine",set:"prac",d:"c",u:104,q:"含羞草被碰觸後葉片閉合，和向光性相比，下列何者正確？",o:["含羞草反應快，是膨壓改變；向光性慢，是生長造成","兩者都是生長造成","含羞草反應慢","向光性比含羞草快"],a:0,e:"含羞草被碰觸後，葉枕細胞的水分改變（膨壓改變），幾秒就閉合，速度快。向光性是莖兩側長得不一樣快造成彎曲，要好幾天，速度慢。"},{id:"pr208",t:"mine",set:"prac",d:"c",u:104,q:"遇到危險時心跳加快、血糖上升，主要是哪一種激素的作用？",o:["腎上腺素","胰島素","生長激素","甲狀腺素"],a:0,e:"遇到危險時，腎上腺分泌「腎上腺素」，讓心跳加快、血糖上升、呼吸加快，身體準備好戰鬥或逃跑。胰島素讓血糖下降，方向剛好相反。"},{id:"pr209",t:"mine",set:"prac",d:"c",u:104,q:"甲狀腺素分泌過多，最可能出現什麼症狀？",o:["代謝過快、容易消瘦、心跳快","血糖過低","身材矮小","嗜睡、代謝變慢"],a:0,e:"甲狀腺素會促進新陳代謝。分泌太多，代謝太快：容易餓卻變瘦、心跳快、怕熱、手抖（甲狀腺機能亢進）。分泌不足才會代謝變慢、嗜睡。"},{id:"pr210",t:"mine",set:"prac",d:"b",u:105,q:"人體進行氣體交換的部位是什麼？",o:["肺泡","氣管","支氣管","鼻腔"],a:0,e:"氣體交換在「肺泡」進行：肺泡很多很小、表面積大，外面包著微血管，O₂ 進入血液、CO₂ 從血液出來。氣管、支氣管、鼻腔只是空氣的通道。"},{id:"pr211",t:"mine",set:"prac",d:"b",u:105,q:"下列哪一種動物是內溫動物？",o:["鳥","青蛙","蛇","魚"],a:0,e:"內溫動物能自己維持體溫恆定，只有鳥類和哺乳類。青蛙（兩生類）、蛇（爬蟲類）、魚都是外溫動物，體溫會隨環境改變。"},{id:"pr212",t:"mine",set:"prac",d:"b",u:105,q:"製造尿液的器官是什麼？",o:["腎臟","膀胱","肝臟","輸尿管"],a:0,e:"腎臟過濾血液，把尿素、多餘的水和鹽分做成尿液。輸尿管把尿送到膀胱，膀胱只是暫時儲存。肝臟製造尿素，但不製造尿液。"},{id:"pr213",t:"mine",set:"prac",d:"b",u:105,q:"吸氣時橫膈如何變化？",o:["收縮下降，胸腔變大","舒張上升，胸腔變小","收縮上升","沒有變化"],a:0,e:"吸氣：橫膈收縮「下降」、肋骨上舉，胸腔變大，肺裡的壓力變小，空氣就被吸進來。呼氣時橫膈舒張上升，胸腔變小，空氣被擠出去。"},{id:"pr214",t:"mine",set:"prac",d:"b",u:105,q:"天氣很熱時，人體如何散熱？",o:["流汗、皮膚血管擴張","發抖","皮膚血管收縮","減少流汗"],a:0,e:"太熱時要「散熱」：流汗（汗水蒸發帶走熱）和皮膚血管擴張（讓更多熱從皮膚散出去，所以臉會紅）。發抖、血管收縮是天冷時保熱的方法。"},{id:"pr215",t:"mine",set:"prac",d:"c",u:105,q:"血液流經腎臟後，下列哪一種物質的濃度會降低？",o:["尿素","二氧化碳","葡萄糖濃度大增","水分完全消失"],a:0,e:"腎臟會從血液中濾出尿素，變成尿排出，所以流出腎臟的血液尿素濃度降低。腎臟細胞也要呼吸，CO₂ 反而增加；葡萄糖會被再吸收回來，不會大增。"},{id:"pr216",t:"mine",set:"prac",d:"c",u:105,q:"人在進食後一小時，血液中哪一種激素濃度最可能上升？",o:["胰島素","升糖素","腎上腺素","生長激素"],a:0,e:"吃完飯後，養分被吸收，血糖上升，胰臟就分泌較多胰島素，把血糖降回正常。升糖素是在血糖低（如空腹時）才分泌多。"},{id:"pr217",t:"mine",set:"prac",d:"c",u:105,q:"尿液中若出現大量葡萄糖，最可能的原因是什麼？",o:["血糖過高，超過腎臟再吸收的能力","喝太多水","腎臟製造葡萄糖","肝臟停止工作"],a:0,e:"正常情況下，腎臟濾出的葡萄糖會全部被再吸收回血液。若血糖太高（例如糖尿病），超過再吸收的能力，多出來的葡萄糖就跑進尿裡。"},{id:"pr218",t:"mine",set:"prac",d:"c",u:105,q:"蛋白質分解產生的含氮廢物，在人體中如何處理？",o:["在肝臟轉變成尿素，再由腎臟排出","直接由肺呼出","在腎臟合成尿素","由大腸排出"],a:0,e:"蛋白質分解會產生有毒的氨，肝臟把氨變成毒性較低的「尿素」，再由血液送到腎臟，隨尿液排出。肺呼出的是 CO₂；大腸排出的是糞便（食物殘渣）。"},{id:"pr219",t:"mine",set:"prac",d:"c",u:105,q:"冬天在戶外，人體會發抖，這對體溫恆定有什麼幫助？",o:["肌肉收縮產生熱量","增加流汗","讓血管擴張散熱","降低代謝"],a:0,e:"天冷時肌肉快速收縮抖動，肌肉作用會產生熱量，幫助維持體溫。流汗和血管擴張是天熱散熱用的，冬天會減少。"},{id:"pr220",t:"mine",set:"prac",d:"b",u:106,q:"人類的受精卵中有幾條染色體？",o:["46 條","23 條","92 條","69 條"],a:0,e:"精子和卵各有 23 條染色體（減數分裂後減半），受精時結合，受精卵就恢復成 23＋23＝46 條，和體細胞一樣。之後經細胞分裂發育成胚胎，每個細胞都保持 46 條。"},{id:"pr221",t:"mine",set:"prac",d:"b",u:106,q:"我們吃的花生仁（花生米）是由花的哪一個構造發育而來？",o:["胚珠","子房","花瓣","花托"],a:0,e:"花生殼是果皮（果實），由子房發育而成；殼裡面的花生仁是種子，由胚珠發育而成。記法：子房 → 果實，胚珠 → 種子，殼包著仁就像子房包著胚珠。"},{id:"pr222",t:"mine",set:"prac",d:"b",u:106,q:"酵母菌常用哪一種方式繁殖？",o:["出芽生殖","有性生殖","孢子繁殖","斷裂生殖"],a:0,e:"酵母菌是單細胞真菌，常用「出芽生殖」：從母細胞長出一個小芽，長大後脫離成新個體，屬無性生殖。香菇、黴菌才主要靠孢子繁殖。"},{id:"pr223",t:"mine",set:"prac",d:"b",u:106,q:"馬鈴薯用塊莖種植長出新植株，屬於哪一種生殖？",o:["營養器官繁殖（無性生殖）","有性生殖","出芽生殖","孢子繁殖"],a:0,e:"馬鈴薯塊莖是「莖」，屬於營養器官（根、莖、葉）。用根、莖、葉繁殖叫營養器官繁殖，沒有精卵結合，是無性生殖。"},{id:"pr224",t:"mine",set:"prac",d:"b",u:106,q:"細胞分裂後，子細胞的染色體數目與母細胞相比如何？",o:["相同","減半","加倍","不一定"],a:0,e:"一般的細胞分裂（用來生長、修補），複製一份遺傳物質再平分，所以子細胞的染色體數目和母細胞「相同」。只有產生精子、卵的減數分裂才會減半。"},{id:"pr225",t:"mine",set:"prac",d:"c",u:106,q:"有性生殖比無性生殖更有利於族群適應環境變化的原因是什麼？",o:["子代遺傳組合多樣，變異較大","子代和親代完全相同","繁殖速度比較快","不需要配偶"],a:0,e:"有性生殖由精子和卵結合，子代得到父母雙方的遺傳物質，組合很多樣，變異大。環境改變時，比較有機會有個體能適應存活。無性生殖子代和親代幾乎一樣。"},{id:"pr226",t:"mine",set:"prac",d:"c",u:106,q:"狗的體細胞有 78 條染色體，牠的卵細胞與受精卵各有幾條？",o:["39 條、78 條","78 條、78 條","39 條、39 條","78 條、156 條"],a:0,e:"卵細胞是減數分裂產生的，染色體減半：78÷2＝39 條。受精卵由精子（39）＋卵（39）結合，恢復成 78 條，和體細胞一樣。"},{id:"pr227",t:"mine",set:"prac",d:"c",u:106,q:"組織培養可以大量繁殖蘭花，下列敘述何者正確？",o:["子代與親代遺傳性狀相同","子代遺傳組合各不相同","屬於有性生殖","需要花粉授粉"],a:0,e:"組織培養是用植物的一小塊組織培養成新植株，不經過精卵結合，屬於無性生殖，所以子代和親代的遺傳性狀相同，能保留優良品種。"},{id:"pr228",t:"mine",set:"prac",d:"c",u:106,q:"魚類多為體外受精，產卵數通常很多，最合理的解釋是什麼？",o:["卵和幼魚在水中存活率低，要以數量彌補","魚的卵比較大","體外受精一定成功","魚不會照顧後代所以卵很小"],a:0,e:"體外受精時精子和卵在水中相遇，受精機會比較低，卵和幼魚又容易被吃掉，存活率低。所以要產很多卵，用數量來增加存活下來的機會。"},{id:"pr229",t:"mine",set:"prac",d:"c",u:106,q:"豌豆莢裡有 6 顆豌豆，這朵花的子房中至少有幾個胚珠受精？",o:["6 個","1 個","3 個","12 個"],a:0,e:"一個胚珠受精後發育成一顆種子。豆莢是果實（由子房發育），裡面 6 顆豌豆就是 6 顆種子，所以至少有 6 個胚珠受精。"},{id:"pr230",t:"mine",set:"prac",d:"b",u:107,q:"控制特徵的遺傳物質位於什麼構造上？",o:["染色體","細胞膜","粒線體","細胞壁"],a:0,e:"控制特徵的基因是 DNA 的一段，位於細胞核裡的「染色體」上。細胞膜控制物質進出；粒線體進行呼吸作用；細胞壁負責支撐。"},{id:"pr231",t:"mine",set:"prac",d:"b",u:107,q:"基因型 Aa 的個體，表現的是哪一種性狀？",o:["顯性性狀","隱性性狀","兩種都表現一半","無法判斷"],a:0,e:"Aa 有一個顯性基因 A 和一個隱性基因 a。只要有顯性基因，就會表現「顯性性狀」，隱性性狀被蓋住了。只有 aa 才會表現隱性性狀。"},{id:"pr232",t:"mine",set:"prac",d:"b",u:107,q:"人類的性別由什麼決定？",o:["父親精子中的性染色體","母親卵中的性染色體","環境溫度","母親的年齡"],a:0,e:"女性 XX，卵都帶 X；男性 XY，精子可能帶 X 或 Y。精子帶 X → 女孩（XX），帶 Y → 男孩（XY）。所以性別由父親的精子決定。"},{id:"pr233",t:"mine",set:"prac",d:"b",u:107,q:"O 型血的基因型是什麼？",o:["ii","IᴬIᴮ","Iᴬi","Iᴮi"],a:0,e:"ABO 血型中，Iᴬ、Iᴮ 是顯性，i 是隱性。O 型要兩個都是隱性的 i，所以是 ii。Iᴬi 是 A 型、Iᴮi 是 B 型、IᴬIᴮ 是 AB 型。"},{id:"pr234",t:"mine",set:"prac",d:"b",u:107,q:"Aa × Aa 的子代中，三種基因型 AA：Aa：aa 的比例約為何？",o:["1：2：1","1：1：1","3：0：1","2：1：1"],a:0,e:"畫棋盤方格：A×A＝AA、A×a＝Aa、a×A＝Aa、a×a＝aa，共 4 格，AA 1 格、Aa 2 格、aa 1 格，所以 1：2：1。表現型（顯性：隱性）才是 3：1。"},{id:"pr235",t:"mine",set:"prac",d:"c",u:107,q:"一對長翅果蠅交配，子代出現短翅。下列何者正確？",o:["短翅是隱性，雙親都是 Aa","短翅是顯性","雙親都是 AA","一定是突變造成"],a:0,e:"長翅雙親生出短翅（無中生有），代表短翅是隱性，被藏在雙親身上。短翅子代是 aa，一個 a 來自爸爸、一個來自媽媽，所以雙親都是 Aa。"},{id:"pr236",t:"mine",set:"prac",d:"c",u:107,q:"父親 A 型、母親 B 型，生出 O 型的孩子。父母的基因型分別是什麼？",o:["Iᴬi 和 Iᴮi","IᴬIᴬ 和 IᴮIᴮ","IᴬIᴮ 和 ii","Iᴬi 和 IᴮIᴮ"],a:0,e:"O 型孩子是 ii，一個 i 來自爸爸、一個來自媽媽，所以爸媽都帶 i。爸爸 A 型 → Iᴬi；媽媽 B 型 → Iᴮi。如果爸媽是 IᴬIᴬ 或 IᴮIᴮ 就不可能給出 i。"},{id:"pr237",t:"mine",set:"prac",d:"c",u:107,q:"Aa 與 aa 交配生了 400 隻子代，預期約有多少隻是顯性性狀？",o:["200 隻","100 隻","300 隻","400 隻"],a:0,e:"Aa×aa：A 和 a 各一半，和 a 配對後得到 Aa（顯性）和 aa（隱性）各一半。400 隻的一半是 200 隻表現顯性性狀。"},{id:"pr238",t:"mine",set:"prac",d:"c",u:107,q:"一對夫婦生了一個男孩和一個女孩。他們的下一個孩子是女孩的機率是多少？",o:["1/2","1/4","1/3","3/4"],a:0,e:"每一胎都是獨立事件：卵一定帶 X，精子帶 X 或 Y 的機會各一半，所以每一胎生女孩（XX）的機率都是 1/2，和之前生過幾個男孩、女孩都無關。選 1/3 是把已經出生的孩子算進去了。"},{id:"pr239",t:"mine",set:"prac",d:"c",u:107,q:"把人類的胰島素基因轉入細菌，讓細菌生產胰島素，這屬於哪一種技術？",o:["基因轉殖","複製（無性生殖）","雜交育種","組織培養"],a:0,e:"把一種生物（人）的基因放進另一種生物（細菌）裡，讓它表現出新的性狀（生產胰島素），叫做基因轉殖。複製、組織培養都不會放入別的物種的基因。"},{id:"pr240",t:"mine",set:"prac",d:"b",u:108,q:"生物分類階層中，最小的單位是什麼？",o:["種","屬","科","界"],a:0,e:"分類階層：界、門、綱、目、科、屬、種。「界」最大，「種」最小。同種的生物最相似，而且能交配生出有生殖能力的後代。"},{id:"pr241",t:"mine",set:"prac",d:"b",u:108,q:"學名的第一個字是什麼？",o:["屬名","種小名","科名","命名者"],a:0,e:"二名法：學名＝「屬名」＋「種小名」，用拉丁文斜體寫。第一個字是屬名（第一個字母大寫），第二個字是種小名。"},{id:"pr242",t:"mine",set:"prac",d:"b",u:108,q:"細菌和酵母菌都是單細胞生物，兩者最主要的差別是什麼？",o:["細菌沒有細胞核，酵母菌有細胞核","細菌有細胞核，酵母菌沒有","細菌有葉綠體，酵母菌沒有","兩者都沒有細胞膜"],a:0,e:"細菌是原核生物，遺傳物質散在細胞質中，沒有細胞核。酵母菌是真菌（菌物界），有細胞核，屬真核生物。兩者都有細胞膜，也都沒有葉綠體。"},{id:"pr243",t:"mine",set:"prac",d:"b",u:108,q:"蕨類植物用什麼方式繁殖？",o:["孢子","種子","果實","花粉"],a:0,e:"蕨類沒有花，也沒有種子，用葉背上的「孢子」繁殖。種子植物（裸子、被子植物）才用種子；有花和果實的是被子植物。"},{id:"pr244",t:"mine",set:"prac",d:"b",u:108,q:"香菇屬於哪一界？",o:["菌物界","植物界","原生生物界","原核生物界"],a:0,e:"香菇沒有葉綠素，不能行光合作用，身體由菌絲構成，靠分解有機物吸收養分，屬於「菌物界」（真菌）。它不是植物，也不是細菌。"},{id:"pr245",t:"mine",set:"prac",d:"c",u:108,q:"根據達爾文的天擇說，細菌對抗生素產生抗藥性的原因是什麼？",o:["原本就有少數抗藥的細菌，存活下來大量繁殖","抗生素讓細菌主動產生抗藥性","細菌學會躲避抗生素","抗生素變質了"],a:0,e:"天擇說：細菌族群中「本來」就有少數個體天生能抵抗抗生素（變異先存在）。用了抗生素後，一般的細菌死掉，抗藥的存活下來大量繁殖，族群就變成多數有抗藥性。不是抗生素讓細菌變出抗藥性。"},{id:"pr246",t:"mine",set:"prac",d:"c",u:108,q:"甲、乙同屬，乙、丙同科不同屬。下列何者正確？",o:["甲與乙的親緣關係比乙與丙更近","乙與丙更相近","甲與丙一定同屬","三者都同種"],a:0,e:"分類階層越下面越相近。甲、乙「同屬」（比較下層）；乙、丙只同科不同屬（比較上層）。所以甲和乙比較親近。同屬一定同科，所以甲、乙、丙都同科。"},{id:"pr247",t:"mine",set:"prac",d:"c",u:108,q:"松樹和玫瑰最主要的差別是什麼？",o:["松樹種子裸露沒有果實，玫瑰有花和果實","松樹用孢子繁殖","玫瑰沒有維管束","松樹沒有根"],a:0,e:"松樹是裸子植物：有種子，但種子裸露在毬果鱗片上，沒有花和果實。玫瑰是被子植物：有花、有果實，種子被果實包住。兩者都有根和維管束，都用種子繁殖。"},{id:"pr248",t:"mine",set:"prac",d:"c",u:108,q:"在某地層中發現大量珊瑚化石，可以推論這層岩層形成時的環境最可能是什麼？",o:["溫暖的淺海","寒冷的高山","乾燥的沙漠","淡水湖泊"],a:0,e:"珊瑚只生活在溫暖、清澈的淺海中。所以發現珊瑚化石，表示這層岩層形成時，當地是溫暖的淺海環境。這就是化石可以用來推測古代環境的例子（指相化石）。"},{id:"pr249",t:"mine",set:"prac",d:"c",u:108,q:"某生物是單細胞、有細胞核、能行光合作用，最可能屬於哪一界？",o:["原生生物界","原核生物界","菌物界","動物界"],a:0,e:"單細胞、有細胞核 → 不是原核生物（沒有核）。能行光合作用 → 不是菌物（不能光合作用）、也不是動物。這種有核的單細胞生物（如眼蟲、矽藻）屬於原生生物界。"},{id:"pr250",t:"mine",set:"prac",d:"b",u:109,q:"食物鏈中的生產者通常是什麼？",o:["綠色植物","草食動物","肉食動物","細菌"],a:0,e:"生產者能進行光合作用，自己製造養分，通常是綠色植物（或藻類）。草食動物、肉食動物是消費者；細菌多半是分解者。"},{id:"pr251",t:"mine",set:"prac",d:"b",u:109,q:"同一區域內同種生物的所有個體稱為什麼？",o:["族群","群集","生態系","生物圈"],a:0,e:"「族群」：同一區域、同一種生物的所有個體（例如一座池塘裡所有的吳郭魚）。不同族群合起來叫群集；群集加上環境叫生態系。"},{id:"pr252",t:"mine",set:"prac",d:"b",u:109,q:"下列哪一種生物在生態系中屬於分解者？",o:["香菇","青草","兔子","老鷹"],a:0,e:"香菇是真菌，沒有葉綠素，靠分解枯木、落葉等有機物取得養分，把有機物變回無機物，屬於分解者。青草是生產者；兔子是初級消費者；老鷹是高級消費者。"},{id:"pr253",t:"mine",set:"prac",d:"b",u:109,q:"獅子與獵豹爭奪同一群羚羊，兩者的關係是什麼？",o:["競爭","共生","寄生","掠食"],a:0,e:"獅子和獵豹都要吃羚羊，爭奪「相同的資源」，這是競爭。獅子、獵豹和羚羊之間才是掠食關係。"},{id:"pr254",t:"mine",set:"prac",d:"b",u:109,q:"下列哪一種行為會減少大氣中的二氧化碳？",o:["植樹造林","燃燒化石燃料","砍伐森林","焚燒垃圾"],a:0,e:"植物行光合作用會吸收二氧化碳，所以植樹造林能減少大氣中的 CO₂。燃燒化石燃料、焚燒垃圾會增加 CO₂；砍伐森林讓吸收 CO₂ 的植物變少。"},{id:"pr255",t:"mine",set:"prac",d:"c",u:109,q:"草 → 蚱蜢 → 青蛙 → 蛇，若草的能量是 10000 單位，蛇大約能得到多少？",o:["10 單位","1000 單位","100 單位","1 單位"],a:0,e:"每往上一層約剩 10%：10000 → 1000 → 100 → 10。"},{id:"pr256",t:"mine",set:"prac",d:"c",u:109,q:"食物鏈：草 → 蚱蜢 → 青蛙 → 蛇。若環境中有難分解的農藥，哪一種生物體內濃度最高？",o:["蛇","草","蚱蜢","青蛙"],a:0,e:"難分解的農藥不會被排出，會沿著食物鏈一層一層累積，越上層的消費者體內濃度越高，這叫生物放大作用。這條食物鏈最上層是蛇，所以蛇最多。"},{id:"pr257",t:"mine",set:"prac",d:"c",u:109,q:"小丑魚躲在海葵中避敵，海葵也能得到小丑魚的食物殘渣，這種關係是什麼？",o:["互利共生","寄生","競爭","片利共生"],a:0,e:"小丑魚得到保護，海葵得到食物殘渣，雙方都得到好處，叫「互利共生」。片利共生是一方得利、另一方沒影響；寄生是一方得利、另一方受害。"},{id:"pr258",t:"mine",set:"prac",d:"c",u:109,q:"湖中先捕捉 40 條魚做標記後放回，再捕 50 條，其中 10 條有標記。湖中魚約有多少條？",o:["200 條","100 條","500 條","2000 條"],a:0,e:"標記再捕捉法：第二次抓到的標記比例＝湖中標記比例。10/50＝40/N，N＝40×50÷10＝200 條。"},{id:"pr259",t:"mine",set:"prac",d:"c",u:109,q:"在臺灣野外大量繁殖的外來種（如綠鬣蜥），最可能造成什麼影響？",o:["與原生種競爭資源，降低生物多樣性","增加原生物種數量","讓生態系更穩定","沒有任何影響"],a:0,e:"外來種在新環境常常沒有天敵，大量繁殖後會和原生種搶食物、搶地盤，甚至吃掉原生種，使原生物種減少，生物多樣性降低，生態系也變得不穩定。"},{id:"pr260",t:"mine",set:"prac",d:"b",u:201,q:"地球上的淡水大部分以什麼形式存在？",o:["冰川","河水","湖水","地下水"],a:0,e:"地球上的水大部分是海水，淡水只占約 3%，而淡水中大部分是「冰川和冰帽」（約 2/3 以上），其次是地下水，河水和湖水只占很少。"},{id:"pr261",t:"mine",set:"prac",d:"b",u:201,q:"河流上游最主要的作用是什麼？",o:["侵蝕","沉積","搬運後堆積","結晶"],a:0,e:"河流上游坡度大、水流快，力量大，主要在「侵蝕」河床，往下切成 V 形谷。下游坡度小、水流慢，才以堆積為主。"},{id:"pr262",t:"mine",set:"prac",d:"b",u:201,q:"河流在河口處堆積形成的地形稱為什麼？",o:["三角洲","沖積扇","V 形谷","海蝕平臺"],a:0,e:"河流到了河口，流進海裡流速變慢，帶來的泥沙堆積成「三角洲」。沖積扇是在山谷出口（山區進入平原處）堆積的。"},{id:"pr263",t:"mine",set:"prac",d:"b",u:201,q:"驅動地球水循環的主要能量來自哪裡？",o:["太陽","地熱","月球引力","風力"],a:0,e:"太陽的熱讓海水、湖水蒸發成水蒸氣，水蒸氣上升變成雲，再降雨回到地面，整個水循環的能量主要來自太陽。"},{id:"pr264",t:"mine",set:"prac",d:"b",u:201,q:"過度抽取地下水最可能造成什麼問題？",o:["地層下陷","火山爆發","河水暴漲","颱風增加"],a:0,e:"地下水被大量抽走，地底土層的空隙失去水的支撐被壓密，地面就往下沉，叫地層下陷。這和火山、颱風無關。"},{id:"pr265",t:"mine",set:"prac",d:"c",u:201,q:"河流流速突然變慢時，下列哪一種顆粒最先沉積？",o:["礫石","砂","泥","黏土"],a:0,e:"顆粒越大越重，需要越快的水流才搬得動。流速一變慢，最大最重的礫石最先沉下來，接著是砂，最後才是泥和黏土。"},{id:"pr266",t:"mine",set:"prac",d:"c",u:201,q:"沖積扇最常出現在什麼位置？",o:["山地與平原交界的谷口","河流入海的河口","海岸的岩岸","高山的山頂"],a:0,e:"河流從陡峭的山谷流出到平坦的平原時，坡度突然變緩，流速變慢，泥沙在谷口堆積成扇形，就是沖積扇。河流入海的河口堆積的是三角洲；岩岸常見的是海蝕地形。"},{id:"pr267",t:"mine",set:"prac",d:"c",u:201,q:"海蝕洞、海蝕柱最常出現在哪一種海岸？",o:["岩岸","沙岸","泥灘","潟湖"],a:0,e:"海蝕洞、海蝕柱、海蝕平臺都是堅硬的岩石被海浪「侵蝕」出來的，所以出現在岩岸（例如北海岸、東北角）。沙岸、泥灘以堆積為主。"},{id:"pr268",t:"mine",set:"prac",d:"c",u:201,q:"臺灣西南沿海養殖業抽取地下水，除了地層下陷，還可能造成什麼？",o:["海水倒灌、土壤鹽化","地震增加","雨量增加","河川變長"],a:0,e:"大量抽地下水會讓地層下陷，地面變得比海平面還低，漲潮或颱風時海水容易倒灌；海水滲進地下也會讓土壤鹽化，不能種作物。"},{id:"pr269",t:"mine",set:"prac",d:"c",u:201,q:"曲流河道中，凹岸（外側）與凸岸（內側）的作用為何？",o:["凹岸侵蝕、凸岸堆積","凹岸堆積、凸岸侵蝕","兩岸都侵蝕","兩岸都堆積"],a:0,e:"曲流轉彎時，外側（凹岸）水流快，以侵蝕為主，河岸被挖深；內側（凸岸）水流慢，以堆積為主，形成沙洲。"},{id:"pr270",t:"mine",set:"prac",d:"b",u:202,q:"岩漿冷卻凝固形成的岩石是哪一類？",o:["火成岩","沉積岩","變質岩","化石"],a:0,e:"岩漿冷卻凝固形成的是「火成岩」（例如玄武岩、花岡岩）。沉積岩是泥沙堆積壓實而成；變質岩是原本的岩石受高溫高壓改變而成；化石不是岩石種類。"},{id:"pr271",t:"mine",set:"prac",d:"b",u:202,q:"最容易找到化石的岩石是哪一類？",o:["沉積岩","火成岩","變質岩","花岡岩"],a:0,e:"生物死後被泥沙埋住，跟著沉積物一起壓實成岩，才能保存成化石，所以化石大多在「沉積岩」中。火成岩來自高溫岩漿，生物會被燒毀；變質岩經高溫高壓，化石多半被破壞。"},{id:"pr272",t:"mine",set:"prac",d:"b",u:202,q:"大理岩是由哪一種岩石變質而成？",o:["石灰岩","砂岩","頁岩","玄武岩"],a:0,e:"石灰岩受到高溫高壓，會變質成「大理岩」。其他常考：頁岩 → 板岩，砂岩 → 石英岩。玄武岩是火成岩。"},{id:"pr273",t:"mine",set:"prac",d:"b",u:202,q:"地層沒有倒轉時，哪一層最古老？",o:["最下層","最上層","中間層","無法判斷"],a:0,e:"疊置定律：在地層沒有倒轉的情況下，先沉積的在下面、後沉積的在上面。所以最下層最先形成、最古老；最上層最年輕。"},{id:"pr274",t:"mine",set:"prac",d:"b",u:202,q:"岩層受擠壓而彎曲的構造稱為什麼？",o:["褶皺","正斷層","節理","層理"],a:0,e:"岩層受到擠壓而「彎曲」，但沒有斷開，叫做褶皺。正斷層是岩層斷開、上盤往下滑；節理是岩石的裂縫但沒有錯動；層理是沉積時一層一層的紋路。"},{id:"pr275",t:"mine",set:"prac",d:"c",u:202,q:"花岡岩顆粒粗大，玄武岩顆粒細小，主要原因是什麼？",o:["花岡岩在地底深處慢慢冷卻，玄武岩在地表快速冷卻","花岡岩年代較新","玄武岩是沉積岩","兩者成分完全相同"],a:0,e:"岩漿冷卻越慢，礦物結晶越有時間慢慢長大，顆粒就越粗。花岡岩在地底深處慢慢冷卻 → 顆粒粗；玄武岩噴出地表很快冷卻 → 顆粒細。兩者都是火成岩，成分也不同。"},{id:"pr276",t:"mine",set:"prac",d:"c",u:202,q:"一條火成岩脈切過甲、乙兩層沉積岩，下列何者正確？",o:["岩脈比甲、乙兩層都年輕","岩脈比甲、乙都古老","岩脈和甲同時形成","無法判斷先後"],a:0,e:"截切定律：要先有岩層，岩脈才能切過它，所以切過別人的比被切的年輕。岩脈切過甲、乙，代表岩脈比甲、乙都晚形成。"},{id:"pr277",t:"mine",set:"prac",d:"c",u:202,q:"岩層受到兩側擠壓，斷層面上方的岩塊（上盤）相對往上移動，形成哪一種斷層？",o:["逆斷層","正斷層","平移斷層","褶皺"],a:0,e:"擠壓的力把岩層往中間推，上盤沿斷層面往上衝，形成逆斷層，臺灣因為板塊擠壓，逆斷層很多（例如車籠埔斷層）。受張力、上盤往下滑才是正斷層；褶皺是彎曲但沒有斷開。"},{id:"pr278",t:"mine",set:"prac",d:"c",u:202,q:"用指甲可刮出痕跡的礦物，與可刮傷玻璃的礦物相比，下列何者正確？",o:["前者硬度較小","前者硬度較大","兩者硬度相同","硬度無法比較"],a:0,e:"指甲的硬度約 2.5，玻璃約 5.5。能被指甲刮出痕跡，代表比指甲還軟，硬度很小；能刮傷玻璃代表比玻璃硬。所以前者硬度較小。"},{id:"pr279",t:"mine",set:"prac",d:"c",u:202,q:"在高山上的岩層中發現海洋生物化石，最合理的解釋是什麼？",o:["該地過去是海洋，後來經地殼抬升","海洋生物會爬上山","化石被鳥帶上山","山上曾經下過海水雨"],a:0,e:"海洋生物化石一定是在「海裡」沉積形成的。現在出現在高山上，代表那裡以前是海，後來因板塊擠壓，地殼被抬升成山。臺灣的高山上也找得到海洋生物化石。"},{id:"pr280",t:"mine",set:"prac",d:"b",u:203,q:"地球內部最外層、最薄的一層是什麼？",o:["地殼","地函","外核","內核"],a:0,e:"地球由外到內：地殼 → 地函 → 外核 → 內核。地殼在最外層，也是最薄的一層；地函最厚。"},{id:"pr281",t:"mine",set:"prac",d:"b",u:203,q:"地震時最先抵達的地震波是什麼？",o:["P 波","S 波","表面波","海嘯"],a:0,e:"P 波是縱波，速度最快，最先抵達，造成上下跳動；S 波是橫波，比較慢、破壞較大，造成左右搖晃。海嘯是海水的波，不是地震波。"},{id:"pr282",t:"mine",set:"prac",d:"b",u:203,q:"一次地震有幾個規模？",o:["一個","每個地方都不同","兩個","沒有規模"],a:0,e:"「規模」代表地震釋放的總能量，一次地震只有一個規模。各地搖晃的程度叫「震度」，每個地方不一樣（離震央越近通常越大）。"},{id:"pr283",t:"mine",set:"prac",d:"b",u:203,q:"臺灣位於哪兩個板塊的交界？",o:["歐亞板塊與菲律賓海板塊","太平洋板塊與北美板塊","印度板塊與歐亞板塊","非洲板塊與南美板塊"],a:0,e:"臺灣位在「歐亞板塊」和「菲律賓海板塊」的交界，兩個板塊互相擠壓（聚合型邊界），所以臺灣多山、多地震。"},{id:"pr284",t:"mine",set:"prac",d:"b",u:203,q:"板塊張裂型邊界常形成什麼地形？",o:["中洋脊","海溝","島弧","高山"],a:0,e:"張裂型邊界：兩個板塊往反方向分開，地底岩漿上升冷卻，形成新的海洋地殼，在海底就形成「中洋脊」。海溝、島弧、高山都是聚合型邊界的地形。"},{id:"pr285",t:"mine",set:"prac",d:"c",u:203,q:"同一次地震，臺北震度 3 級、花蓮震度 5 級，下列何者正確？",o:["花蓮的搖晃程度較大，兩地的規模相同","花蓮的規模較大","臺北離震央較近","兩地搖晃程度相同"],a:0,e:"同一次地震只有一個規模，所以兩地規模相同。震度是各地搖晃程度，花蓮 5 級比臺北 3 級搖得厲害，通常也代表花蓮離震央比較近。"},{id:"pr286",t:"mine",set:"prac",d:"c",u:203,q:"中洋脊兩側岩石的年齡有什麼分布？",o:["越靠近中洋脊越年輕，兩側對稱","越靠近中洋脊越古老","兩側年齡完全不同且不對稱","年齡全部相同"],a:0,e:"新的地殼在中洋脊由岩漿冷卻形成，再慢慢被往兩側推開。所以越靠近中洋脊的岩石越年輕，越遠越老，而且兩側對稱，這是海底擴張的證據。"},{id:"pr287",t:"mine",set:"prac",d:"c",u:203,q:"岩石圈與軟流圈的關係，下列何者正確？",o:["岩石圈包含地殼和上部地函，浮在軟流圈上","岩石圈就是地殼","軟流圈在地核中","軟流圈比岩石圈堅硬"],a:0,e:"岩石圈是地球外面堅硬的一層，包含「地殼＋上部地函」，分成很多板塊；下面的軟流圈比較軟、可以緩慢流動，板塊就像浮在軟流圈上移動。岩石圈不等於地殼。"},{id:"pr288",t:"mine",set:"prac",d:"c",u:203,q:"地震預警系統能提前幾秒發出警報，主要利用什麼原理？",o:["P 波比 S 波快，先偵測 P 波估算","地震前動物會先叫","S 波比 P 波快","地震前會先下雨"],a:0,e:"P 波比 S 波快，但破壞力大的是 S 波。地震預警系統先偵測到最早到的 P 波，馬上算出地震資訊發出警報，讓人在 S 波到達前有幾秒時間避難。"},{id:"pr289",t:"mine",set:"prac",d:"c",u:203,q:"海洋板塊與大陸板塊聚合時，通常會發生什麼？",o:["海洋板塊隱沒，形成海溝和火山","大陸板塊隱沒到海洋板塊下方","兩者分開形成中洋脊","兩者水平錯動"],a:0,e:"海洋板塊比大陸板塊重（密度大），兩者相撞時海洋板塊會往下「隱沒」到大陸板塊下面，形成很深的海溝；隱沒的板塊熔融產生岩漿，形成火山。"},{id:"pr290",t:"mine",set:"prac",d:"b",u:204,q:"天氣現象主要發生在大氣的哪一層？",o:["對流層","平流層","中氣層","增溫層"],a:0,e:"對流層是最靠近地面的一層，幾乎所有水氣都在這裡，空氣又會上下對流，所以雲、雨、颱風等天氣現象都發生在對流層。"},{id:"pr291",t:"mine",set:"prac",d:"b",u:204,q:"風的吹送方向是什麼？",o:["由高氣壓吹向低氣壓","由低氣壓吹向高氣壓","由北吹向南","由冷處吹向熱處的高空"],a:0,e:"空氣從氣壓「高」的地方往氣壓「低」的地方流動，這種流動就是風。兩地氣壓差越大，風越強。"},{id:"pr292",t:"mine",set:"prac",d:"b",u:204,q:"颱風屬於哪一種天氣系統？",o:["低氣壓","高氣壓","冷鋒","滯留鋒"],a:0,e:"颱風是熱帶海洋上形成的強烈「低氣壓」，空氣往中心旋轉輻合、上升，形成很多雲和強風豪雨。高氣壓通常帶來晴朗天氣。"},{id:"pr293",t:"mine",set:"prac",d:"b",u:204,q:"臺灣冬季主要吹什麼季風？",o:["東北季風","西南季風","東南季風","西北季風"],a:0,e:"冬天亞洲大陸很冷，形成蒙古高氣壓，空氣從大陸吹向海洋，到臺灣變成「東北季風」。夏天則吹西南季風。"},{id:"pr294",t:"mine",set:"prac",d:"b",u:204,q:"梅雨季時，冷、暖氣團勢力相當，鋒面在臺灣附近停留徘徊。這段期間最可能出現什麼天氣？",o:["連續多日的降雨，容易發生豪雨","晴朗乾燥，氣溫穩定","冷鋒過後迅速轉晴","強烈颱風侵襲"],a:0,e:"冷暖氣團誰也推不動誰，鋒面停住不走，稱為滯留鋒。暖濕空氣一直沿著鋒面上升，所以雲雨連續好幾天，有時會下豪雨。冷鋒過境才會很快轉晴；颱風是熱帶低氣壓，不是鋒面。"},{id:"pr295",t:"mine",set:"prac",d:"c",u:204,q:"白天海邊吹的風通常是什麼方向？原因為何？",o:["由海吹向陸，因為陸地升溫快形成低壓","由陸吹向海，因為陸地升溫快","由陸吹向海，因為海水升溫快","沒有風"],a:0,e:"陸地比熱小，白天升溫快，陸地上空氣變熱上升，形成低氣壓；海上比較涼，是高氣壓。風從高壓吹向低壓，所以白天風由海吹向陸，叫海風。晚上相反（陸風）。"},{id:"pr296",t:"mine",set:"prac",d:"c",u:204,q:"寒流（強烈大陸冷氣團）南下影響臺灣時，最常見的天氣是什麼？",o:["氣溫明顯下降，迎風面的北部和東北部較濕冷","全臺氣溫上升，午後雷陣雨","全臺連續多日豪雨","吹西南風，南部高溫"],a:0,e:"大陸冷氣團從北方南下，吹東北季風，各地氣溫明顯下降。北部、東北部是迎風面，冷空氣帶著水氣遇山抬升，比較濕冷下雨；中南部在背風面，通常比較乾冷。午後雷陣雨、西南風高溫是夏天的天氣。"},{id:"pr297",t:"mine",set:"prac",d:"c",u:204,q:"地面天氣圖中，等壓線越密集的地方代表什麼？",o:["風力越強","氣溫越高","雨量越少","氣壓越高"],a:0,e:"等壓線越密集，代表短距離內氣壓差很大，空氣流得越快，所以風越強。等壓線不能直接看出氣溫高低或雨量。"},{id:"pr298",t:"mine",set:"prac",d:"c",u:204,q:"北半球高氣壓中心附近的空氣如何運動？",o:["下沉，順時針向外吹出","上升，逆時針向內吹","上升，順時針向外吹","下沉，逆時針向內吹"],a:0,e:"北半球高氣壓：空氣在中心「下沉」，到地面後「順時針」向外吹出（輻散）。下沉的空氣不容易成雲，所以天氣多晴朗。低氣壓相反：逆時針向內吹、上升、多雲雨。"},{id:"pr299",t:"mine",set:"prac",d:"c",u:204,q:"爬高山時，越往上越冷且氣壓越低，這是在大氣的哪一層？",o:["對流層","平流層","中氣層","臭氧層"],a:0,e:"爬山的高度都在對流層裡。對流層的特徵就是「越高越冷」（每上升 1 km 約降 6℃），氣壓也越低。平流層反而越高越熱（臭氧吸收紫外線）。"},{id:"pr300",t:"mine",set:"prac",d:"b",u:205,q:"月亮本身會發光嗎？",o:["不會，是反射太陽光","會，自己發光","只有滿月時會","只在晚上會"],a:0,e:"月亮自己不會發光，我們看到的是月亮「反射太陽光」。月亮被太陽照到的那一半是亮的，從地球看到亮的部分多少，就形成不同月相。"},{id:"pr301",t:"mine",set:"prac",d:"b",u:205,q:"日食發生時的月相是什麼？",o:["新月","滿月","上弦月","下弦月"],a:0,e:"日食：月球跑到太陽和地球中間，擋住太陽光。這時月球的亮面朝向太陽、背對地球，我們看不到月亮，就是「新月」（農曆初一）。月食才是滿月。"},{id:"pr302",t:"mine",set:"prac",d:"b",u:205,q:"地球上晝夜交替的原因是什麼？",o:["地球自轉","地球公轉","月球公轉","太陽自轉"],a:0,e:"地球每天繞著地軸自轉一圈，面向太陽的一面是白天、背對太陽的一面是晚上，所以有晝夜交替。公轉造成的是四季。"},{id:"pr303",t:"mine",set:"prac",d:"b",u:205,q:"夏至時，太陽直射哪裡？",o:["北回歸線","赤道","南回歸線","北極"],a:0,e:"夏至（約 6 月 21 日）時，太陽直射北緯 23.5 度，也就是「北回歸線」。臺灣嘉義就在北回歸線附近。春分、秋分直射赤道；冬至直射南回歸線。"},{id:"pr304",t:"mine",set:"prac",d:"b",u:205,q:"下列哪一顆是類木行星？",o:["土星","火星","金星","水星"],a:0,e:"類木行星：木星、土星、天王星、海王星，體積大、密度小，主要由氣體組成。水星、金星、地球、火星是類地行星，體積小、由岩石組成。"},{id:"pr305",t:"mine",set:"prac",d:"c",u:205,q:"今天早上 6 點滿潮，下一次乾潮大約在什麼時候？",o:["中午 12 點左右","早上 9 點","下午 6 點","晚上 12 點"],a:0,e:"每天大約有兩次滿潮、兩次乾潮，滿潮到下一次乾潮大約相隔 6 小時（6 小時 12 分）。早上 6 點滿潮，乾潮就在中午 12 點左右。"},{id:"pr306",t:"mine",set:"prac",d:"c",u:205,q:"月食發生在農曆十五，大約多少天後可能發生日食？",o:["約 15 天後","約 7 天後","約 30 天後","約 3 天後"],a:0,e:"月食發生在滿月（農曆十五），日食發生在新月（農曆初一）。滿月到下一次新月約半個月，所以約 15 天後可能發生日食。"},{id:"pr307",t:"mine",set:"prac",d:"c",u:205,q:"12 月時，南半球的澳洲是什麼季節？",o:["夏季","冬季","春季","秋季"],a:0,e:"南北半球季節相反。12 月太陽直射在南半球（接近南回歸線），南半球陽光比較直、白天比較長，所以澳洲是夏季（在澳洲過聖誕節是夏天）。"},{id:"pr308",t:"mine",set:"prac",d:"c",u:205,q:"潮差最大的大潮通常發生在什麼時候？",o:["新月和滿月","上弦月和下弦月","只有新月","只有滿月以後一週"],a:0,e:"新月和滿月時，太陽、月球、地球排成一直線，太陽和月球的引力疊加在一起，潮差最大，叫大潮。上弦、下弦月時三者成直角，潮差最小，叫小潮。"},{id:"pr309",t:"mine",set:"prac",d:"c",u:205,q:"如果地軸沒有傾斜，地球最可能出現什麼情況？",o:["沒有明顯的四季變化","沒有晝夜","一年變成半年","月相消失"],a:0,e:"四季是因為地軸傾斜，再加上地球公轉，讓太陽直射位置在南北回歸線間移動。如果地軸沒有傾斜，太陽永遠直射赤道，就沒有明顯的四季。晝夜是自轉造成的，還是會有。"},{id:"pr310",t:"mine",set:"prac",d:"b",u:206,q:"下列哪一種氣體「不是」溫室氣體？",o:["氮氣","二氧化碳","甲烷","水氣"],a:0,e:"溫室氣體會吸收地表放出的紅外線，把熱留在大氣中，例如二氧化碳、甲烷、水氣。氮氣雖然占空氣約 78%，但幾乎不吸收紅外線，所以不是溫室氣體。"},{id:"pr311",t:"mine",set:"prac",d:"b",u:206,q:"全球暖化最主要的人為原因是什麼？",o:["大量燃燒化石燃料","使用太陽能","植樹造林","騎腳踏車"],a:0,e:"燃燒煤、石油、天然氣（化石燃料）會放出大量二氧化碳，使溫室效應增強，是全球暖化最主要的人為原因。太陽能、植樹、騎腳踏車都是減碳的方法。"},{id:"pr312",t:"mine",set:"prac",d:"b",u:206,q:"下列哪一種是再生能源？",o:["太陽能","煤","石油","天然氣"],a:0,e:"再生能源是可以一直補充、用不完的能源，例如太陽能、風力、水力。煤、石油、天然氣是化石燃料，要幾百萬年才形成，用完就沒了。"},{id:"pr313",t:"mine",set:"prac",d:"b",u:206,q:"全球暖化可能造成什麼後果？",o:["海平面上升","冰川增加","全球氣溫下降","颱風完全消失"],a:0,e:"全球暖化會讓冰川、冰帽融化流進海裡，海水本身受熱也會膨脹，兩者都讓海平面上升，低窪地區可能被淹沒。暖化會使冰川減少，不會增加。"},{id:"pr314",t:"mine",set:"prac",d:"b",u:206,q:"溫室效應的作用是什麼？",o:["吸收地表放出的熱，使地表保溫","反射所有太陽光","破壞臭氧層","讓地球變冷"],a:0,e:"溫室氣體吸收地表放出的熱（紅外線），再放回地表，就像蓋被子一樣讓地球保溫。適度的溫室效應是好的，沒有它地球會太冷；太強才會造成暖化。"},{id:"pr315",t:"mine",set:"prac",d:"c",u:206,q:"聖嬰現象發生時，東太平洋祕魯外海的海水有什麼變化？",o:["海溫異常升高","海溫異常降低","海水變鹹","海面下降"],a:0,e:"聖嬰現象：信風變弱，原本被吹到西太平洋的溫暖海水往東流回，東太平洋（祕魯外海）海溫「異常升高」，漁獲減少。反聖嬰則是東太平洋變得更冷。"},{id:"pr316",t:"mine",set:"prac",d:"c",u:206,q:"大氣中 CO₂ 濃度在北半球春夏下降、秋冬上升，主要原因是什麼？",o:["春夏植物光合作用旺盛，吸收較多 CO₂","春夏燃燒較多燃料","秋冬植物光合作用較強","海洋在春夏釋出 CO₂"],a:0,e:"北半球陸地多、植物多。春夏植物生長旺盛，光合作用吸收大量 CO₂，濃度下降；秋冬植物落葉、光合作用減弱，CO₂ 濃度就回升。"},{id:"pr317",t:"mine",set:"prac",d:"c",u:206,q:"臭氧層破洞與全球暖化的關係，下列何者正確？",o:["是兩件不同的問題，臭氧層破洞使紫外線增加","臭氧層破洞是暖化的主因","兩者完全相同","臭氧層破洞讓地球變冷"],a:0,e:"臭氧層破洞和全球暖化是兩回事。臭氧層負責吸收太陽的紫外線，破洞會讓更多紫外線到地面，增加皮膚癌風險。全球暖化是溫室氣體增加造成的。"},{id:"pr318",t:"mine",set:"prac",d:"c",u:206,q:"若一種新氣體「會吸收地表的紅外線輻射」，大量排放後最可能造成什麼？",o:["增強溫室效應，使氣溫上升","讓臭氧層變厚","降低海平面","讓地球變冷"],a:0,e:"「會吸收地表的紅外線輻射」正是溫室氣體的特徵。大量排放會讓更多熱被留在大氣中，溫室效應增強，氣溫上升。"},{id:"pr319",t:"mine",set:"prac",d:"c",u:206,q:"下列哪一項做法最能達到「節能減碳」？",o:["搭乘大眾運輸工具","夏天冷氣調到 20℃","多使用一次性餐具","長時間開著電腦待機"],a:0,e:"搭大眾運輸，很多人共用一台車，平均每個人消耗的能源和排出的二氧化碳都比較少。冷氣調太低、用一次性餐具、電腦待機都會浪費能源。"},{id:"b1h0",t:"mine",set:"bio100",u:101,q:"顯微鏡操作時，對焦應該先用哪一個物鏡？",o:["低倍物鏡","高倍物鏡","油鏡","哪一個都可以"],a:0,e:"低倍物鏡的視野範圍大、比較亮，容易找到要看的東西，也比較不會撞到玻片。所以要先用低倍找到目標、移到中央，再換高倍觀察細節。"},{id:"b1h1",t:"mine",set:"bio100",u:101,q:"使用複式顯微鏡時，調節視野亮度的是哪一個構造？",o:["光圈與反光鏡（或光源）","粗調節輪","目鏡","載物臺夾"],a:0,e:"光圈控制進入的光量多少，反光鏡（或燈泡光源）提供光線，兩者一起調整視野亮度。粗、細調節輪是對焦用的；目鏡負責放大；載物臺夾固定玻片。"},{id:"b1h2",t:"mine",set:"bio100",u:101,q:"換成高倍物鏡後影像模糊，應該調整哪一個構造？",o:["細調節輪","粗調節輪","目鏡","光圈"],a:0,e:"換高倍物鏡後，物鏡離玻片很近，只能用「細調節輪」小幅度微調。用粗調節輪移動太大，可能讓物鏡撞破玻片、損壞鏡頭。"},{id:"b1h3",t:"mine",set:"bio100",u:101,q:"觀察口腔皮膜細胞時，滴加亞甲藍液的目的是什麼？",o:["將細胞核染色，便於觀察","殺死細菌","讓細胞膨脹","增加亮度"],a:0,e:"口腔皮膜細胞幾乎是透明的，不容易看清楚。滴亞甲藍液可以把細胞核染成藍色，細胞的構造就比較明顯。染色不是為了殺菌或增加亮度。"},{id:"b1h4",t:"mine",set:"bio100",u:101,q:"下列哪一種細胞沒有細胞壁？",o:["人類的神經細胞","洋蔥表皮細胞","細菌","黴菌"],a:0,e:"動物細胞沒有細胞壁，所以人的神經細胞沒有。植物細胞（洋蔥）有纖維素細胞壁；細菌和黴菌（真菌）也有細胞壁，只是成分不一樣。"},{id:"b1h5",t:"mine",set:"bio100",u:101,q:"下列哪一個構造是動物細胞與植物細胞都有的？",o:["粒線體","葉綠體","細胞壁","大型液胞"],a:0,e:"粒線體進行呼吸作用、產生能量，動物細胞和植物細胞都有。葉綠體、細胞壁、大型液胞是植物細胞才有的。"},{id:"b1h6",t:"mine",set:"bio100",u:101,q:"生物圈的範圍包含什麼？",o:["大氣圈下層、水圈和岩石圈上層","只有陸地","只有海洋","整個太陽系"],a:0,e:"生物圈是地球上「有生物生活」的範圍，包含大氣圈下層、水圈（海洋、湖泊等）和岩石圈上層（土壤、地表），不只陸地或海洋，也不會到太陽系。"},{id:"b1h7",t:"mine",set:"bio100",u:101,q:"心臟屬於哪一個組成層次？",o:["器官","組織","細胞","器官系統"],a:0,e:"心臟由肌肉組織、結締組織、神經組織等多種組織組成，一起完成「送血」的功能，所以是器官。心臟和血管合起來才是循環系統（器官系統）。"},{id:"b1h8",t:"mine",set:"bio100",u:101,q:"將葡萄乾泡在清水中一段時間後會膨脹，原因是什麼？",o:["水分滲透進入葡萄乾","葡萄乾的糖擴散進水中使它變大","水把空氣擠進去","葡萄乾在生長"],a:0,e:"葡萄乾裡面糖分很多（溶質濃度高、水少），清水裡水多。水會從水多的地方往水少的地方移動（滲透作用），水跑進葡萄乾裡，所以它就膨脹了。"},{id:"b1h9",t:"mine",set:"bio100",u:101,q:"實驗中「保持不變的條件」稱為什麼？",o:["控制變因","操縱變因","應變變因","結論"],a:0,e:"實驗中刻意保持相同的條件叫「控制變因」；故意改變的那一個條件叫「操縱變因」；因為操縱變因改變而跟著變化、被測量的結果叫「應變變因」。"},{id:"b1h10",t:"mine",set:"bio100",u:101,q:"科學家提出假設後，下一步通常要做什麼？",o:["設計實驗驗證","直接下結論","放棄問題","公布答案"],a:0,e:"科學方法：觀察 → 提出問題 → 提出假設 → 設計實驗驗證 → 分析結果 → 下結論。假設只是猜想，一定要經過實驗驗證才能下結論。"},{id:"b1h11",t:"mine",set:"bio100",u:102,q:"本氏液檢驗葡萄糖時必須進行什麼步驟？",o:["隔水加熱","冷藏","照光","加碘液"],a:0,e:"本氏液要「隔水加熱」才會和葡萄糖反應，顏色由藍色變成黃、橙、紅色（紅色沉澱）。不加熱就看不出變化。加碘液是檢驗澱粉用的。"},{id:"b1h12",t:"mine",set:"bio100",u:102,q:"口腔中的唾液可以分解哪一種養分？",o:["澱粉","蛋白質","脂質","纖維素"],a:0,e:"唾液含有「唾液澱粉酶」，能把澱粉分解成麥芽糖，所以飯在嘴裡嚼久了會變甜。蛋白質要到胃和小腸才開始消化；脂質主要在小腸；人體不能消化纖維素。"},{id:"b1h13",t:"mine",set:"bio100",u:102,q:"蛋白質最後被消化成什麼小分子？",o:["胺基酸","葡萄糖","脂肪酸","甘油"],a:0,e:"蛋白質在胃和小腸被消化，最後變成小分子的「胺基酸」被小腸吸收。澱粉 → 葡萄糖；脂質 → 脂肪酸和甘油。"},{id:"b1h14",t:"mine",set:"bio100",u:102,q:"大腸的主要功能是什麼？",o:["吸收水分，形成糞便","分泌膽汁","消化蛋白質","分泌胰島素"],a:0,e:"大腸的主要工作是吸收食物殘渣中的「水分」（和部分礦物質），讓殘渣變成糞便。膽汁由肝臟分泌；蛋白質在胃、小腸消化；胰島素由胰臟分泌。"},{id:"b1h15",t:"mine",set:"bio100",u:102,q:"光合作用主要發生在葉片的哪一種細胞？",o:["葉肉細胞","表皮細胞","根毛細胞","導管細胞"],a:0,e:"葉肉細胞裡有大量葉綠體，是進行光合作用的主要地方。表皮細胞大多沒有葉綠體（保衛細胞除外）；根毛細胞在地下照不到光；導管負責運水。"},{id:"b1h16",t:"mine",set:"bio100",u:102,q:"增加溫室中二氧化碳的濃度，對作物的影響最可能是什麼？",o:["光合作用增強，產量提高","作物停止呼吸","作物無法吸水","作物立即死亡"],a:0,e:"二氧化碳是光合作用的原料。溫室裡適度增加 CO₂，光合作用變強，製造更多養分，作物長得更好、產量提高。"},{id:"b1h17",t:"mine",set:"bio100",u:102,q:"水蘊草放在光下會冒出氣泡，這些氣泡主要是什麼？",o:["氧氣","二氧化碳","氮氣","水蒸氣"],a:0,e:"水蘊草照光會進行光合作用，產生「氧氣」，氧氣不太溶於水，就變成氣泡冒出來。氣泡越多，代表光合作用越旺盛。"},{id:"b1h18",t:"mine",set:"bio100",u:102,q:"把水蘊草移到離燈光更遠處，氣泡產生的速率如何？",o:["變慢","變快","不變","立刻停止且永不恢復"],a:0,e:"離燈光越遠，照到的光越弱，光合作用速率變慢，冒出的氧氣氣泡就變少、變慢。移回燈光附近，速率又會恢復。"},{id:"b1h19",t:"mine",set:"bio100",u:102,q:"下列哪一種食物富含蛋白質？",o:["豆腐","白飯","奶油","青菜"],a:0,e:"豆腐是黃豆做的，黃豆富含蛋白質（植物性蛋白質）。白飯主要是澱粉（醣類）；奶油主要是脂質；青菜主要提供纖維、維生素和礦物質。"},{id:"b1h20",t:"mine",set:"bio100",u:102,q:"酵素「專一性」的意思是什麼？",o:["一種酵素只能作用在特定的受質","酵素只能用一次","酵素只在人體中有作用","酵素可以分解所有物質"],a:0,e:"專一性：一種酵素只能作用在一種（或一類）特定的物質上，像一把鑰匙開一個鎖。例如澱粉酶只分解澱粉，不能分解蛋白質。酵素可以重複使用，不是只用一次。"},{id:"b1h21",t:"mine",set:"bio100",u:102,q:"胰臟分泌的胰液進入哪裡幫助消化？",o:["小腸","胃","大腸","肝臟"],a:0,e:"胰臟分泌的胰液經過胰管，流進小腸的前段（十二指腸），裡面有能分解澱粉、蛋白質、脂質的酵素，所以小腸是消化最完整的地方。"},{id:"b1h22",t:"mine",set:"bio100",u:103,q:"血漿的主要功能是什麼？",o:["運送養分、廢物和激素","運送氧氣","吞噬細菌","凝血"],a:0,e:"血漿是血液中的液體部分，溶著養分、廢物（如尿素、CO₂）、激素，跟著血液一起運送到全身。運送氧氣是紅血球；吞噬細菌是白血球；凝血是血小板。"},{id:"b1h23",t:"mine",set:"bio100",u:103,q:"血小板的主要功能是什麼？",o:["幫助血液凝固","運送氧氣","對抗病菌","運送二氧化碳"],a:0,e:"受傷流血時，血小板會聚集在傷口，幫助血液凝固，把傷口堵住，防止一直流血。運送氧氣是紅血球；對抗病菌是白血球。"},{id:"b1h24",t:"mine",set:"bio100",u:103,q:"白血球的主要功能是什麼？",o:["防禦病菌","運送氧氣","凝血","運送養分"],a:0,e:"白血球負責防禦：可以吞噬入侵的病菌，有些還會製造抗體。運送氧氣是紅血球；凝血是血小板；運送養分是血漿。"},{id:"b1h25",t:"mine",set:"bio100",u:103,q:"心臟中，哪兩個腔室流的是缺氧血？",o:["右心房和右心室","左心房和左心室","左心房和右心室","右心房和左心室"],a:0,e:"心臟「右邊」接收全身回來的缺氧血（右心房），再由右心室送去肺。「左邊」接收從肺回來的充氧血，再送到全身。記法：右缺氧、左充氧。"},{id:"b1h26",t:"mine",set:"bio100",u:103,q:"動脈和靜脈相比，下列何者正確？",o:["動脈管壁較厚、彈性較大","靜脈管壁較厚","動脈有瓣膜","靜脈血壓較高"],a:0,e:"動脈要承受心臟打出來的高壓血流，所以管壁厚、有彈性。靜脈血壓較低，管壁較薄，而且有瓣膜防止血液倒流。"},{id:"b1h27",t:"mine",set:"bio100",u:103,q:"測量脈搏時，摸到的是什麼的跳動？",o:["動脈","靜脈","微血管","淋巴管"],a:0,e:"心臟每收縮一次，血液衝進動脈，動脈管壁就跟著擴張一次，摸起來就是脈搏（手腕、脖子）。所以脈搏次數和心跳次數一樣。靜脈血壓低，摸不到跳動。"},{id:"b1h28",t:"mine",set:"bio100",u:103,q:"根部吸收的水分，在植物體內往上運送的主要動力是什麼？",o:["蒸散作用產生的拉力","韌皮部的推力","重力","光合作用的推力"],a:0,e:"葉片的氣孔一直蒸散水分，就像用吸管吸飲料一樣，把木質部裡的水一路往上拉，這個拉力是水往上運送的主要動力。韌皮部是送養分；重力會讓水往下，不是往上。"},{id:"b1h29",t:"mine",set:"bio100",u:103,q:"雙子葉植物莖的維管束排列方式為何？",o:["排成環狀","散生分布","只有韌皮部","沒有維管束"],a:0,e:"雙子葉植物（如向日葵）莖中的維管束排成一圈「環狀」，中間有形成層可以長粗。單子葉植物（如玉米）的維管束則是散生分布，沒有形成層。"},{id:"b1h30",t:"mine",set:"bio100",u:103,q:"劇烈運動時心跳加快，最主要的意義是什麼？",o:["加快運送氧氣和養分到肌肉","減少血液量","降低體溫","讓血液停止流動"],a:0,e:"劇烈運動時，肌肉需要更多氧氣和養分來產生能量。心跳加快讓血液流得更快，就能把更多氧氣和養分送到肌肉，也把二氧化碳等廢物帶走。"},{id:"b1h31",t:"mine",set:"bio100",u:103,q:"把芹菜插在紅色墨水中一段時間，切開莖會發現哪裡被染紅？",o:["木質部","韌皮部","表皮","髓"],a:0,e:"紅墨水是溶在水中的，水分從根（莖的切口）經過「木質部」往上運送，所以切開莖會看到木質部被染紅。韌皮部運送的是葉子做的養分。"},{id:"b1h32",t:"mine",set:"bio100",u:103,q:"血液由左心室出發，最先進入哪一條血管？",o:["主動脈","肺動脈","肺靜脈","上大靜脈"],a:0,e:"體循環從左心室開始：左心室 → 主動脈 → 全身 → 上、下大靜脈 → 右心房。肺動脈是從右心室出發的；肺靜脈是回到左心房的。"},{id:"b1h33",t:"mine",set:"bio100",u:104,q:"周圍神經系統包含哪些？",o:["腦神經和脊神經","腦和脊髓","大腦和小腦","只有脊髓"],a:0,e:"神經系統分兩部分：中樞神經＝腦和脊髓；周圍神經＝從腦和脊髓發出去的「腦神經」和「脊神經」，像電線一樣通到全身。"},{id:"b1h34",t:"mine",set:"bio100",u:104,q:"膝跳反射的中樞在哪裡？",o:["脊髓","大腦","小腦","腦幹"],a:0,e:"膝跳反射：敲膝蓋下方，小腿會自己往前踢，不用想，中樞在「脊髓」。這種反射路徑短、反應快。眨眼、咳嗽等反射中樞則在腦幹。"},{id:"b1h35",t:"mine",set:"bio100",u:104,q:"控制呼吸和心跳的是腦的哪一部分？",o:["腦幹","大腦","小腦","脊髓"],a:0,e:"腦幹控制呼吸、心跳、血壓等維持生命的基本功能，所以腦幹受傷非常危險。大腦管思考、記憶；小腦管平衡。"},{id:"b1h36",t:"mine",set:"bio100",u:104,q:"喝醉酒後走路搖晃，主要是哪一部分的功能受到影響？",o:["小腦","腦幹","脊髓","心臟"],a:0,e:"喝醉酒時酒精影響小腦，小腦負責平衡和協調動作，所以會走路搖晃、動作不穩。腦幹管呼吸心跳；脊髓負責傳訊息和簡單反射。"},{id:"b1h37",t:"mine",set:"bio100",u:104,q:"生長激素由哪一個腺體分泌？",o:["腦垂腺","甲狀腺","胰臟","腎上腺"],a:0,e:"生長激素由「腦垂腺」分泌，促進身體生長。分泌不足可能長不高（侏儒症），過多可能長太高（巨人症）。甲狀腺分泌甲狀腺素；胰臟分泌胰島素。"},{id:"b1h38",t:"mine",set:"bio100",u:104,q:"植物根部向下生長的現象稱為什麼？",o:["向地性","向光性","觸發運動","睡眠運動"],a:0,e:"根受到重力影響往下生長，叫向地性（莖則是背地性，往上長）。向光性是往光的方向彎；觸發運動是被碰觸後的反應（如含羞草）。"},{id:"b1h39",t:"mine",set:"bio100",u:104,q:"酢漿草在晚上葉片下垂，白天展開，這是什麼現象？",o:["睡眠運動","向光性","向地性","觸發運動"],a:0,e:"酢漿草的葉子隨著白天晚上（光線明暗）規律地展開和下垂，叫睡眠運動。觸發運動是被碰觸才反應；向光性、向地性是生長造成的彎曲。"},{id:"b1h40",t:"mine",set:"bio100",u:104,q:"內分泌腺和外分泌腺最主要的差別是什麼？",o:["內分泌腺沒有導管，分泌物直接進入血液","內分泌腺有導管","外分泌腺分泌激素","兩者完全相同"],a:0,e:"內分泌腺（甲狀腺、胰島、腦垂腺）沒有導管，分泌的激素直接進入血液。外分泌腺（汗腺、唾腺）有導管，分泌物經導管送出去。激素是內分泌腺分泌的。"},{id:"b1h41",t:"mine",set:"bio100",u:104,q:"下列哪一個是受器？",o:["眼睛的視網膜","手臂的肌肉","脊髓","運動神經"],a:0,e:"受器負責「接收刺激」，例如眼睛的視網膜接收光、耳朵接收聲音、皮膚接收冷熱。肌肉是動器（做出反應）；脊髓是中樞；運動神經負責把命令傳到肌肉。"},{id:"b1h42",t:"mine",set:"bio100",u:104,q:"聽到鈴聲後拿起電話接聽，屬於哪一種行為？",o:["意識行為","反射","向性","睡眠運動"],a:0,e:"聽到鈴聲後要想「這是電話，要接」，再決定拿起電話，經過大腦判斷，所以是意識行為。反射是不經大腦思考的；向性、睡眠運動是植物的反應。"},{id:"b1h43",t:"mine",set:"bio100",u:104,q:"甲狀腺素需要哪一種元素才能合成？",o:["碘","鐵","鈣","鈉"],a:0,e:"甲狀腺素裡含有「碘」，缺碘就無法合成足夠的甲狀腺素，甲狀腺會腫大（大脖子病），所以食鹽會加碘。鐵和血紅素有關；鈣和骨骼有關。"},{id:"b1h44",t:"mine",set:"bio100",u:105,q:"呼氣時，橫膈與肋骨如何變化？",o:["橫膈舒張上升、肋骨下降，胸腔變小","橫膈收縮下降","肋骨上舉","胸腔變大"],a:0,e:"呼氣時橫膈「舒張上升」、肋骨下降，胸腔變小，肺內壓力變大，空氣被擠出去。吸氣才是橫膈收縮下降、肋骨上舉、胸腔變大。"},{id:"b1h45",t:"mine",set:"bio100",u:105,q:"呼吸作用和呼吸運動的差別是什麼？",o:["呼吸作用是細胞分解養分產生能量，呼吸運動是吸氣呼氣","兩者完全一樣","呼吸運動在細胞內進行","只有動物有呼吸作用"],a:0,e:"呼吸作用：每個細胞把葡萄糖和氧分解，產生能量、二氧化碳和水，植物也有。呼吸運動：吸氣和呼氣，讓空氣進出肺。兩件事不一樣。"},{id:"b1h46",t:"mine",set:"bio100",u:105,q:"外溫動物在冬天常會冬眠，主要原因是什麼？",o:["體溫隨環境下降，活動力降低","體溫會升高","食物太多","不需要呼吸"],a:0,e:"外溫動物（如蛇、青蛙）的體溫會跟著環境變化。冬天氣溫低，體溫也下降，代謝變慢、活動力降低、食物也少，所以找地方冬眠來度過冬天。"},{id:"b1h47",t:"mine",set:"bio100",u:105,q:"血糖過低時，胰臟會分泌什麼激素？",o:["升糖素","胰島素","甲狀腺素","生長激素"],a:0,e:"血糖太低時，胰島分泌「升糖素」，讓肝臟把儲存的肝醣分解成葡萄糖放進血液，血糖就上升。胰島素作用剛好相反，是讓血糖下降。"},{id:"b1h48",t:"mine",set:"bio100",u:105,q:"尿液暫時儲存在哪裡？",o:["膀胱","腎臟","輸尿管","尿道"],a:0,e:"泌尿路徑：腎臟（製造尿液）→ 輸尿管（輸送）→ 膀胱（暫時儲存）→ 尿道（排出）。所以暫時存尿的是膀胱。"},{id:"b1h49",t:"mine",set:"bio100",u:105,q:"喝了大量的水之後，尿液會有什麼變化？",o:["量變多、顏色變淡","量變少、顏色變深","沒有變化","尿中出現葡萄糖"],a:0,e:"喝大量的水，體內水分太多，腎臟就把多餘的水排出去，所以尿量變多、尿被稀釋，顏色變淡，這樣能維持體內水分恆定。"},{id:"b1h50",t:"mine",set:"bio100",u:105,q:"大量流汗後，尿液會有什麼變化？",o:["量變少、濃度較高","量變多","顏色變淡","含大量蛋白質"],a:0,e:"大量流汗後身體缺水，腎臟會把更多水再吸收回血液，減少排水，所以尿量變少、尿比較濃（顏色較深）。"},{id:"b1h51",t:"mine",set:"bio100",u:105,q:"植物進行氣體交換主要經由什麼構造？",o:["氣孔","根毛","維管束","花瓣"],a:0,e:"葉片上的氣孔是氣體進出的通道：白天光合作用吸 CO₂、放 O₂，呼吸作用則相反，水蒸氣也從這裡散失。根毛吸水；維管束運輸。"},{id:"b1h52",t:"mine",set:"bio100",u:105,q:"魚類用什麼器官進行氣體交換？",o:["鰓","肺","皮膚","鰾"],a:0,e:"魚用「鰓」呼吸。鰓絲上布滿微血管，水流過時吸收水中的溶氧、排出二氧化碳。魚沒有肺；鰾是調整浮沉用的。"},{id:"b1h53",t:"mine",set:"bio100",u:105,q:"洗腎（血液透析）是在替代哪一個器官的功能？",o:["腎臟","肝臟","心臟","肺臟"],a:0,e:"腎臟衰竭時，血液中的尿素等廢物排不出去。洗腎（血液透析）就是用機器代替腎臟，把血液中的廢物和多餘水分過濾掉。"},{id:"b1h54",t:"mine",set:"bio100",u:105,q:"吸入的空氣與呼出的空氣比較，呼出的空氣有何不同？",o:["氧氣較少、二氧化碳較多","氧氣較多","二氧化碳較少","完全相同"],a:0,e:"吸進來的空氣中的氧氣，有一部分被身體用掉了；細胞呼吸作用產生的二氧化碳則被呼出來。所以呼出的空氣氧氣較少、二氧化碳較多（但仍有氧氣，所以能做人工呼吸）。"},{id:"b1h55",t:"mine",set:"bio100",u:106,q:"花的哪一個構造會產生花粉？",o:["花藥","柱頭","子房","花瓣"],a:0,e:"雄蕊由花絲和花藥組成，花藥會產生花粉（裡面有精細胞）。柱頭是雌蕊接收花粉的地方；子房裡有胚珠；花瓣用來吸引昆蟲。"},{id:"b1h56",t:"mine",set:"bio100",u:106,q:"花粉落在柱頭上的過程稱為什麼？",o:["授粉","受精","發芽","減數分裂"],a:0,e:"授粉：花粉落到雌蕊的柱頭上。之後花粉長出花粉管，一路延伸到胚珠，精細胞和卵細胞結合，這才叫受精。授粉在前、受精在後。"},{id:"b1h57",t:"mine",set:"bio100",u:106,q:"顏色鮮豔、有香味和花蜜的花，最可能靠什麼傳粉？",o:["昆蟲或鳥類","風","水","自己移動"],a:0,e:"顏色鮮豔、有香味、有花蜜，都是為了吸引昆蟲或鳥類來吃蜜，順便把花粉帶到別朵花上。靠風傳粉的花通常小、不鮮豔、沒香味，花粉多又輕。"},{id:"b1h58",t:"mine",set:"bio100",u:106,q:"水螅身上長出小水螅，屬於哪一種生殖方式？",o:["出芽生殖","分裂生殖","有性生殖","孢子繁殖"],a:0,e:"水螅身上長出一個芽體，慢慢長大成小水螅再脫離母體，叫「出芽生殖」，屬於無性生殖。分裂生殖是一個直接分成兩個（如草履蟲）。"},{id:"b1h59",t:"mine",set:"bio100",u:106,q:"草履蟲由一個個體變成兩個，屬於哪一種生殖方式？",o:["分裂生殖","出芽生殖","孢子繁殖","有性生殖"],a:0,e:"草履蟲是單細胞生物，一個細胞直接一分為二，變成兩個新個體，叫「分裂生殖」，是無性生殖。出芽是長出芽體；孢子繁殖是黴菌、蕨類的方式。"},{id:"b1h60",t:"mine",set:"bio100",u:106,q:"黴菌靠什麼構造繁殖？",o:["孢子","種子","花粉","塊莖"],a:0,e:"黴菌（真菌）的孢子囊會產生大量很小很輕的孢子，孢子飄到適合的地方就長出新的黴菌。種子是種子植物才有；花粉是開花植物的。"},{id:"b1h61",t:"mine",set:"bio100",u:106,q:"胎生的哺乳類，胎兒主要經由什麼獲得養分？",o:["胎盤和臍帶","卵黃","自己覓食","羊水"],a:0,e:"胎生的胎兒在媽媽子宮裡，透過「胎盤和臍帶」從母體血液得到養分和氧氣，並把廢物送回母體。卵黃是卵生動物胚胎的養分來源；羊水是保護胎兒的。"},{id:"b1h62",t:"mine",set:"bio100",u:106,q:"雞蛋中提供胚胎發育養分的主要是什麼？",o:["卵黃","蛋殼","氣室","殼膜"],a:0,e:"雞是卵生動物，胚胎在蛋裡發育時，主要靠「卵黃」提供養分。蛋殼保護並讓氣體進出；氣室提供空氣；殼膜也是保護用的。"},{id:"b1h63",t:"mine",set:"bio100",u:106,q:"下列關於減數分裂的敘述，何者正確？",o:["只發生在生殖器官中，產生生殖細胞","發生在所有細胞","子細胞染色體數目不變","產生的細胞會長成器官"],a:0,e:"減數分裂只發生在生殖器官（睪丸、卵巢、花藥、胚珠），用來產生精子和卵等生殖細胞，染色體數目減半。一般體細胞進行的是細胞分裂，數目不變。"},{id:"b1h64",t:"mine",set:"bio100",u:106,q:"扦插玫瑰枝條繁殖的優點是什麼？",o:["能保留親代優良性狀","子代變異較多","需要授粉","繁殖較慢"],a:0,e:"扦插是無性生殖（營養器官繁殖），子代的遺傳物質和親代一樣，所以能保留親代優良的花色、香味等性狀，而且繁殖快。不用授粉，變異也少。"},{id:"b1h65",t:"mine",set:"bio100",u:106,q:"胚珠受精後發育成種子，種子中將來長成新植物體的是什麼？",o:["胚","種皮","果皮","花托"],a:0,e:"種子由種皮、胚、養分組成。「胚」由受精卵發育而來，將來會長成新的植物體（有胚根、胚芽等）。種皮保護；果皮是子房壁變的；花托在花的底部。"},{id:"b1h66",t:"mine",set:"bio100",u:107,q:"基因的化學本質是什麼？",o:["DNA","蛋白質","醣類","脂質"],a:0,e:"基因是 DNA 上一段一段有遺傳功能的片段，所以基因的化學本質是 DNA。DNA 纏繞在蛋白質上形成染色體，但基因本身是 DNA。"},{id:"b1h67",t:"mine",set:"bio100",u:107,q:"人類體細胞有幾對染色體？",o:["23 對","46 對","22 對","24 對"],a:0,e:"人類體細胞有 46 條染色體，兩兩成對，所以是 23 對。其中 22 對是體染色體，1 對是性染色體（女 XX、男 XY）。"},{id:"b1h68",t:"mine",set:"bio100",u:107,q:"AA × aa 的子代中，基因型是什麼？",o:["全部 Aa","全部 AA","全部 aa","AA：aa＝1：1"],a:0,e:"AA 只能給出 A，aa 只能給出 a，所以每個子代都是 A＋a＝Aa，全部都是 Aa，表現顯性性狀。"},{id:"b1h69",t:"mine",set:"bio100",u:107,q:"基因型 AA 與 Aa 的個體，表現型有什麼關係？",o:["相同，都是顯性性狀","不同","AA 是隱性","Aa 是隱性"],a:0,e:"AA 和 Aa 都至少有一個顯性基因 A，所以外表（表現型）一樣，都表現顯性性狀。基因型不同，表現型卻相同，這是顯性的特點。"},{id:"b1h70",t:"mine",set:"bio100",u:107,q:"父親血型 A 型（Iᴬi）、母親血型 B 型（Iᴮi），他們的子女可能有哪些血型？",o:["A、B、AB、O 型都可能","只有 A 型或 B 型","只有 AB 型","只有 O 型"],a:0,e:"父親給 Iᴬ 或 i，母親給 Iᴮ 或 i，組合有 IᴬIᴮ（AB 型）、Iᴬi（A 型）、Iᴮi（B 型）、ii（O 型）四種，各占 1/4，所以四種血型都可能。"},{id:"b1h71",t:"mine",set:"bio100",u:107,q:"唐氏症是因為第 21 號染色體多了一條，這屬於什麼？",o:["染色體數目異常","基因工程","後天受傷","營養不良"],a:0,e:"唐氏症患者第 21 號染色體有 3 條（正常是 2 條），總共 47 條，屬於「染色體數目異常」，是先天的遺傳疾病，不是後天受傷或營養不良造成的。"},{id:"b1h72",t:"mine",set:"bio100",u:107,q:"下列哪一種特徵受環境影響最大，遺傳影響較小？",o:["因曬太陽而變黑的膚色","ABO 血型","耳垂形狀","天生的眼皮形狀"],a:0,e:"曬太陽變黑是後天「環境」造成的，不是基因改變，所以不會遺傳給孩子。ABO 血型、耳垂形狀、天生的眼皮形狀都由遺傳決定。"},{id:"b1h73",t:"mine",set:"bio100",u:107,q:"孟德爾研究遺傳時使用的實驗生物是什麼？",o:["豌豆","果蠅","大腸桿菌","老鼠"],a:0,e:"孟德爾用「豌豆」做雜交實驗，因為豌豆生長快、性狀明顯（高矮、圓皺）、可以自花授粉，發現了遺傳法則。果蠅是後來摩根研究用的。"},{id:"b1h74",t:"mine",set:"bio100",u:107,q:"Aa × Aa 的子代中，表現顯性性狀的個體裡，Aa 占多少比例？",o:["2/3","1/2","1/4","3/4"],a:0,e:"Aa×Aa 子代：AA、Aa、Aa、aa。表現顯性的有 AA、Aa、Aa 三份，其中 Aa 有兩份，所以占 2/3。要注意題目問的是「顯性個體中」的比例，不是全部。"},{id:"b1h75",t:"mine",set:"bio100",u:107,q:"發生在體細胞的突變，下列何者正確？",o:["通常不會遺傳給下一代","一定會遺傳給下一代","一定造成疾病","會使染色體加倍"],a:0,e:"突變如果只發生在身體一般的體細胞（如皮膚細胞），不會傳到精子或卵裡，所以通常不會遺傳給下一代。只有生殖細胞的突變才可能遺傳。突變也不一定造成疾病。"},{id:"b1h76",t:"mine",set:"bio100",u:107,q:"用 DNA 鑑定親子關係，主要依據是什麼？",o:["子女的 DNA 一半來自父親、一半來自母親","子女的 DNA 與父親完全相同","血型一定相同","身高相近"],a:0,e:"每個人的 DNA 一半來自爸爸（精子）、一半來自媽媽（卵）。比對孩子和父母的 DNA，如果孩子的每個片段都能在爸爸或媽媽身上找到，就能確認親子關係。"},{id:"b1h77",t:"mine",set:"bio100",u:107,q:"一對膚色正常的夫婦生出白化症孩子，白化症是什麼性狀？",o:["隱性性狀","顯性性狀","不會遺傳","性聯顯性"],a:0,e:"父母都正常卻生出白化症孩子（無中生有），代表白化症是隱性性狀。父母都是帶有隱性基因的 Aa，孩子得到兩個 a（aa）才表現白化。"},{id:"b1h78",t:"mine",set:"bio100",u:108,q:"鯨魚屬於哪一類動物？",o:["哺乳類","魚類","兩生類","爬蟲類"],a:0,e:"鯨魚雖然住在海裡、外形像魚，但牠用「肺」呼吸（要浮上來換氣）、胎生、用乳汁哺育幼鯨、體溫恆定，所以是哺乳類，不是魚類。"},{id:"b1h79",t:"mine",set:"bio100",u:108,q:"下列哪一種動物屬於兩生類？",o:["青蛙","烏龜","鱷魚","鯊魚"],a:0,e:"青蛙是兩生類：小時候（蝌蚪）住在水中用鰓呼吸，長大後可以上岸，用肺和皮膚呼吸。烏龜、鱷魚是爬蟲類；鯊魚是魚類。"},{id:"b1h80",t:"mine",set:"bio100",u:108,q:"昆蟲的身體分為幾部分？",o:["頭、胸、腹三部分","頭、腹兩部分","頭胸部和腹部","五部分"],a:0,e:"昆蟲身體分成「頭、胸、腹」三部分，胸部有三對足（6 隻腳），通常有翅膀。蜘蛛是分頭胸部和腹部兩部分，所以不是昆蟲。"},{id:"b1h81",t:"mine",set:"bio100",u:108,q:"蜘蛛不屬於昆蟲，主要原因是什麼？",o:["有四對足，身體分頭胸部和腹部","沒有外骨骼","會飛","是脊椎動物"],a:0,e:"昆蟲：身體分頭、胸、腹三部分，3 對足（6 隻腳）。蜘蛛：身體分頭胸部和腹部兩部分，4 對足（8 隻腳），屬於蛛形綱，所以不是昆蟲。蜘蛛也有外骨骼。"},{id:"b1h82",t:"mine",set:"bio100",u:108,q:"下列哪一個是脊椎動物？",o:["蛇","蚯蚓","章魚","蝸牛"],a:0,e:"蛇屬於爬蟲類，身體裡有一節一節的脊椎骨，是脊椎動物。蚯蚓（環節動物）、章魚和蝸牛（軟體動物）都沒有脊椎骨，是無脊椎動物。"},{id:"b1h83",t:"mine",set:"bio100",u:108,q:"苔蘚植物的特徵是什麼？",o:["沒有維管束，植物體矮小","有花和果實","有種子","有發達的根"],a:0,e:"苔蘚植物沒有維管束（不能有效運水），所以植物體矮小，只能長在潮濕的地方，用假根固定。它沒有花、種子，也沒有真正的根，用孢子繁殖。"},{id:"b1h84",t:"mine",set:"bio100",u:108,q:"生物的學名為什麼要統一使用拉丁文？",o:["避免各地俗名不同造成混淆","拉丁文最容易唸","只有拉丁文能寫","為了保密"],a:0,e:"同一種生物在不同地方有不同的俗名，容易搞混。用拉丁文的學名，全世界都用同一個名字，科學家溝通就不會混淆。拉丁文不常改變，所以適合當學名。"},{id:"b1h85",t:"mine",set:"bio100",u:108,q:"同一種生物的定義是什麼？",o:["能交配並產生具生殖能力的後代","外形一定完全相同","住在同一地區","吃相同的食物"],a:0,e:"「同一種」的定義：能互相交配，而且生出的後代「也有生殖能力」。例如馬和驢能生出騾，但騾不能生育，所以馬和驢不同種。外形相似、住同一地方都不一定同種。"},{id:"b1h86",t:"mine",set:"bio100",u:108,q:"始祖鳥化石同時有羽毛和牙齒，可作為什麼的證據？",o:["鳥類可能由爬蟲類演化而來","鳥類比爬蟲類古老","恐龍會游泳","鳥類不會演化"],a:0,e:"始祖鳥有羽毛（像鳥），又有牙齒、長尾骨、翅膀上有爪（像爬蟲類），是兩者之間的過渡生物，可以作為「鳥類可能由爬蟲類演化而來」的證據。"},{id:"b1h87",t:"mine",set:"bio100",u:108,q:"拉馬克用「用進廢退」解釋長頸鹿的長脖子，與達爾文的主要差異是什麼？",o:["拉馬克認為後天努力的改變會遺傳，達爾文認為是自然選擇","兩人說法完全相同","達爾文認為長頸鹿不會變","拉馬克提出天擇說"],a:0,e:"拉馬克的用進廢退：長頸鹿努力伸長脖子吃樹葉，脖子變長，再遺傳給下一代（後天改變會遺傳）。達爾文天擇說：本來就有脖子長短不同的，長脖子的比較容易活下來繁殖。後天改變不會遺傳，所以天擇說較被接受。"},{id:"b1h88",t:"mine",set:"bio100",u:108,q:"被子植物和裸子植物都有的構造是什麼？",o:["種子","果實","花","子房包住胚珠"],a:0,e:"被子植物和裸子植物都是「種子植物」，都用種子繁殖。但只有被子植物有花和果實，胚珠被子房包住；裸子植物的種子裸露，沒有果實。"},{id:"b1h89",t:"mine",set:"bio100",u:109,q:"在一個池塘生態系中，下列哪一項屬於「非生物」環境因子？",o:["陽光","水草","大肚魚","細菌"],a:0,e:"生態系包含生物和非生物環境。陽光、空氣、水、溫度、土壤等沒有生命的是非生物因子。水草（生產者）、大肚魚（消費者）、細菌（分解者）都是生物。"},{id:"b1h90",t:"mine",set:"bio100",u:109,q:"兔子吃草，兔子是什麼角色？",o:["初級消費者","生產者","次級消費者","分解者"],a:0,e:"兔子直接吃草（生產者），所以是「初級消費者」。吃兔子的蛇或老鷹才是次級消費者。草是生產者；分解者是細菌、真菌。"},{id:"b1h91",t:"mine",set:"bio100",u:109,q:"蛔蟲生活在人體腸道中吸收養分，人因此受害，屬於什麼關係？",o:["寄生","互利共生","競爭","片利共生"],a:0,e:"蛔蟲住在人的腸道裡，搶走人吃進去的養分（蛔蟲得利），人卻會營養不良、肚子痛（人受害）。一方得利、一方受害，就是寄生。互利共生是雙方都得利。"},{id:"b1h92",t:"mine",set:"bio100",u:109,q:"為什麼食物鏈通常不會超過五層？",o:["能量逐層遞減，越上層可用能量越少","動物不吃肉","植物不夠多","分解者太多"],a:0,e:"能量在食物鏈中每往上一層，大約只剩 10% 能傳下去（其他用在呼吸、變成熱散失）。層數越多，最上層能得到的能量越少，養不活太多生物，所以食物鏈通常不超過五層。"},{id:"b1h93",t:"mine",set:"bio100",u:109,q:"豆科植物根瘤中的根瘤菌能固定氮，與豆科植物互相得利，屬於什麼關係？",o:["互利共生","寄生","競爭","掠食"],a:0,e:"根瘤菌住在豆科植物的根瘤裡，把空氣中的氮變成植物能用的含氮物質（給植物）；植物提供養分和住的地方（給根瘤菌）。雙方都得到好處，是互利共生。"},{id:"b1h94",t:"mine",set:"bio100",u:109,q:"下列哪一種是水域生態系？",o:["河口","草原","沙漠","熱帶雨林"],a:0,e:"生態系分成陸域和水域。河口是河水和海水交會的地方，屬於水域生態系（湖泊、海洋也是）。草原、沙漠、熱帶雨林都是陸域生態系。"},{id:"b1h95",t:"mine",set:"bio100",u:109,q:"保護生物多樣性最根本的方法是什麼？",o:["保護棲地","建造更多動物園","大量引進外來種","只保護稀有動物"],a:0,e:"生物需要棲地才能找食物、躲藏、繁殖，棲地被破壞，生物就無法生存。所以保護棲地是保護生物多樣性最根本的方法。動物園只能保護少數個體；引進外來種反而會傷害原生種。"},{id:"b1h96",t:"mine",set:"bio100",u:109,q:"將森林大面積砍伐改為農地，對碳循環的影響是什麼？",o:["大氣中二氧化碳增加","二氧化碳減少","沒有影響","氧氣增加"],a:0,e:"植物變少，吸收 CO₂ 的能力下降，且燃燒或分解植物會釋放 CO₂。"},{id:"b1h97",t:"mine",set:"bio100",u:109,q:"族群的個體數量會受到哪些因素影響？",o:["出生、死亡、遷入、遷出","只有出生","只有天氣","只有食物"],a:0,e:"族群數量的增加來自「出生」和「遷入」，減少來自「死亡」和「遷出」。這四個因素一起決定族群大小，而食物、天氣、天敵等會影響這四個因素。"},{id:"b1h98",t:"mine",set:"bio100",u:109,q:"在食物網中，若某種草食動物大量減少，最可能發生什麼？",o:["捕食牠的肉食動物數量也減少，植物可能增加","所有生物都增加","植物一定減少","沒有任何影響"],a:0,e:"草食動物減少，吃牠的肉食動物食物變少，數量也會跟著減少；而原本被草食動物吃的植物，因為被吃得少，數量可能增加。食物網中的生物會互相影響。"},{id:"b1h99",t:"mine",set:"bio100",u:109,q:"墾丁國家公園設立的主要目的之一是什麼？",o:["保護自然生態與景觀","增加工廠","方便開發觀光飯店","引進外來物種"],a:0,e:"國家公園的主要目的是保護自然生態、野生動植物和特殊景觀，同時提供教育和適度的休閒。開發工廠、大型飯店、引進外來種都會破壞生態，不是設立目的。"},{u:12,fig:'<svg viewBox="0 0 300 190" role="img" aria-label="題目附圖"><path class="ax" d="M40 160 H285 M40 160 V15"/><path class="area" d="M40 160 L100 60 L250 60 L250 160 Z"/><path class="ln" d="M40 160 L100 60 L250 60"/><path class="gr" d="M100 60 V160 M40 60 H100"/><text x="100" y="175" text-anchor="middle">4</text><text x="250" y="175" text-anchor="middle">10</text><text x="32" y="64" text-anchor="end">8</text><text x="294" y="175" text-anchor="end">t (s)</text><text x="8" y="22" text-anchor="start">v (m/s)</text></svg>',cap:"v–t 圖",q:"一輛車的速度–時間圖如上。0～10 秒內，車子的位移是多少？",o:["64 m","80 m","48 m","16 m"],a:0,e:"v–t 圖「線下面積＝位移」。0～4 秒是三角形：½×4×8＝16 m；4～10 秒是長方形：6×8＝48 m。合計 16＋48＝64 m。選 80 m 是把整段都當成 8 m/s（10×8），忘了前 4 秒是從 0 慢慢加速。",id:"fig0",t:"mine",set:"fig"},{u:12,fig:'<svg viewBox="0 0 300 190" role="img" aria-label="題目附圖"><path class="ax" d="M40 160 H285 M40 160 V15"/><path class="ln" d="M40 160 L130 40"/><path class="ln2" d="M40 160 L220 40"/><path class="gr" d="M40 40 H220 M130 40 V160 M220 40 V160"/><text x="130" y="175" text-anchor="middle">3</text><text x="220" y="175" text-anchor="middle">6</text><text x="32" y="44" text-anchor="end">30</text><text x="122" y="36" text-anchor="end">甲</text><text x="228" y="36" text-anchor="start">乙</text><text x="294" y="175" text-anchor="end">t (s)</text><text x="8" y="22" text-anchor="start">x (m)</text></svg>',cap:"x–t 圖",q:"甲、乙兩人沿直線跑步的位置–時間圖如上。下列何者正確？",o:["甲的速度 10 m/s、乙的速度 5 m/s","甲、乙速度相同","甲在加速、乙在減速","3 秒時兩人在同一位置"],a:0,e:"x–t 圖的斜直線代表等速，斜率就是速度。甲 3 秒走 30 m：30÷3＝10 m/s；乙 6 秒走 30 m：30÷6＝5 m/s。兩條都是直線，所以都沒有加速或減速；3 秒時甲在 30 m、乙只在 15 m，位置不同。",id:"fig1",t:"mine",set:"fig"},{u:11,fig:'<svg viewBox="0 0 300 190" role="img" aria-label="題目附圖"><path class="ax" d="M40 160 H285 M40 160 V15"/><path class="ln" d="M40 160 L160 52"/><path class="ln2" d="M160 52 L162 88 L280 88"/><path class="gr" d="M40 52 H160 M40 88 H162 M160 52 V160"/><text x="32" y="56" text-anchor="end">12</text><text x="32" y="92" text-anchor="end">8</text><text x="160" y="175" text-anchor="middle">12</text><text x="294" y="182" text-anchor="end">推力 F (N)</text><text x="6" y="22" text-anchor="start">摩擦力 f (N)</text></svg>',cap:"摩擦力–推力圖",q:"用水平力推地上的木箱，摩擦力 f 與推力 F 的關係如上圖。用 10 N 推木箱時，木箱受到的摩擦力是多少？",o:["10 N","12 N","8 N","0 N"],a:0,e:"10 N 比最大靜摩擦力 12 N 小，木箱推不動。推不動時是「靜摩擦力」，大小剛好等於推力，所以是 10 N。12 N 是推動前的上限（最大靜摩擦力），8 N 是推動後的動摩擦力，這時都還用不到。",id:"fig2",t:"mine",set:"fig"},{u:1,fig:'<svg viewBox="0 0 300 190" role="img" aria-label="題目附圖"><path class="ax" d="M40 160 H285 M40 160 V15"/><path class="ln" d="M40 140 C120 120 200 70 270 30"/><path class="gr" d="M93 160 V125 H40 M206 160 V58 H40"/><text x="93" y="175" text-anchor="middle">20</text><text x="206" y="175" text-anchor="middle">60</text><text x="32" y="129" text-anchor="end">30</text><text x="32" y="62" text-anchor="end">110</text><text x="294" y="182" text-anchor="end">溫度 (℃)</text><text x="6" y="22" text-anchor="start">溶解度 (g/100 g 水)</text></svg>',cap:"溶解度曲線",q:"某物質的溶解度曲線如上。把 60℃、含 100 g 水的飽和溶液降溫到 20℃，會析出多少 g 的晶體？",o:["80 g","110 g","30 g","140 g"],a:0,e:"溶解度是「100 g 水最多溶多少」。60℃ 時 100 g 水溶了 110 g；降到 20℃ 只能溶 30 g，多出來的就析出：110−30＝80 g。題目剛好是 100 g 水，不用再換算比例。",id:"fig3",t:"mine",set:"fig"},{u:4,fig:'<svg viewBox="0 0 300 190" role="img" aria-label="題目附圖"><path class="ax" d="M40 160 H285 M40 160 V15"/><path class="ln" d="M40 140 L80 120 L140 120 L190 60 L260 60"/><path class="gr" d="M40 120 H80 M40 60 H190"/><text x="32" y="124" text-anchor="end">0</text><text x="32" y="64" text-anchor="end">100</text><text x="58" y="138" text-anchor="start">A</text><text x="110" y="114" text-anchor="middle">B</text><text x="170" y="98" text-anchor="start">C</text><text x="225" y="54" text-anchor="middle">D</text><text x="294" y="182" text-anchor="end">加熱時間</text><text x="6" y="22" text-anchor="start">溫度 (℃)</text></svg>',cap:"加熱曲線",q:"把冰塊持續加熱，溫度隨時間變化如上圖。哪一段是「冰和水同時存在」？",o:["B 段","A 段","C 段","D 段"],a:0,e:"B 段在 0℃ 保持水平：冰正在熔化，一邊是冰、一邊是水，吸的熱都拿去改變狀態，所以溫度不變。A 段是冰在升溫，C 段是水在升溫，D 段在 100℃ 是水在沸騰（水和水蒸氣共存）。",id:"fig4",t:"mine",set:"fig"},{u:3,fig:'<svg viewBox="0 0 300 190" role="img" aria-label="凸透鏡成像"><path class="ax" d="M10 100 H290"/><ellipse cx="150" cy="100" rx="9" ry="62" class="ink"/><path class="ink" d="M75 100 V62"/><path class="ink" d="M69 70 L75 60 L81 70"/><circle cx="100" cy="100" r="3" class="dot"/><circle cx="200" cy="100" r="3" class="dot"/><circle cx="50" cy="100" r="3" class="dot"/><circle cx="250" cy="100" r="3" class="dot"/><text x="100" y="118" text-anchor="middle">F</text><text x="200" y="118" text-anchor="middle">F</text><text x="50" y="118" text-anchor="middle">2F</text><text x="250" y="118" text-anchor="middle">2F</text><text x="75" y="52" text-anchor="middle">物體</text><text x="150" y="182" text-anchor="middle">凸透鏡（焦距 10 cm，物距 15 cm）</text></svg>',cap:"凸透鏡",q:"物體放在凸透鏡前 15 cm，透鏡焦距 10 cm（如圖，物體在 F 與 2F 之間）。成像的性質為何？",o:["倒立、放大的實像","倒立、縮小的實像","正立、放大的虛像","不會成像"],a:0,e:"物體在 F 和 2F 之間（10～20 cm），成像在另一側 2F 外，是倒立、放大的實像，投影機就是這樣。2F 以外才是倒立縮小（照相機）；F 以內才是正立放大虛像（放大鏡）。",id:"fig5",t:"mine",set:"fig"},{u:15,fig:'<svg viewBox="0 0 300 190" role="img" aria-label="串聯電路"><rect x="60" y="40" width="180" height="110" rx="4" class="ink"/><rect x="45" y="80" width="30" height="30" class="bg"/><path class="ink" d="M48 88 H72 M54 100 H66"/><rect x="105" y="30" width="40" height="20" class="res"/><rect x="175" y="30" width="40" height="20" class="res"/><text x="125" y="24" text-anchor="middle">2 Ω</text><text x="195" y="24" text-anchor="middle">4 Ω</text><text x="30" y="98" text-anchor="end">6 V</text></svg>',cap:"串聯電路",q:"如圖，2 Ω 和 4 Ω 的電阻串聯在 6 V 電池上。通過電路的電流和 4 Ω 電阻兩端的電壓各是多少？",o:["1 A、4 V","1 A、2 V","3 A、6 V","1.5 A、6 V"],a:0,e:"串聯總電阻＝2＋4＝6 Ω，電流 I＝V÷R＝6÷6＝1 A，串聯每一處電流都一樣。4 Ω 兩端電壓＝I×R＝1×4＝4 V（2 Ω 分到 2 V，加起來剛好 6 V）。",id:"fig6",t:"mine",set:"fig"},{u:15,fig:'<svg viewBox="0 0 300 190" role="img" aria-label="並聯電路"><path class="ink" d="M60 95 V30 H240 V160 H60 V125"/><path class="ink" d="M110 30 V160 M190 30 V160"/><rect x="45" y="95" width="30" height="30" class="bg"/><path class="ink" d="M48 103 H72 M54 115 H66"/><rect x="100" y="80" width="20" height="40" class="res"/><rect x="180" y="80" width="20" height="40" class="res"/><circle cx="80" cy="30" r="11" class="meter"/><text x="80" y="34" text-anchor="middle" class=b>A</text><text x="128" y="104" text-anchor="start">3 Ω</text><text x="208" y="104" text-anchor="start">6 Ω</text><text x="30" y="114" text-anchor="end">6 V</text></svg>',cap:"並聯電路",q:"如圖，3 Ω 和 6 Ω 的電阻並聯在 6 V 電池上，安培計 A 接在幹路。安培計的讀數是多少？",o:["3 A","1 A","2 A","0.67 A"],a:0,e:"並聯時每條支路的電壓都是 6 V。3 Ω 支路：6÷3＝2 A；6 Ω 支路：6÷6＝1 A。安培計在幹路，讀到的是兩條支路加起來：2＋1＝3 A。也可以先算總電阻 3×6÷(3＋6)＝2 Ω，6÷2＝3 A。",id:"fig7",t:"mine",set:"fig"},{u:14,fig:'<svg viewBox="0 0 300 190" role="img" aria-label="單擺"><path class="ink" d="M110 20 H190"/><path class="gr" d="M150 20 L80 120 M150 20 L150 150 M150 20 L220 120"/><path class="ln" d="M80 120 Q150 175 220 120" stroke-dasharray="5 5"/><circle cx="80" cy="120" r="9" class="ball"/><circle cx="150" cy="150" r="9" class="ball"/><circle cx="220" cy="120" r="9" class="ball"/><text x="66" y="124" text-anchor="end">甲</text><text x="150" y="176" text-anchor="middle">乙</text><text x="234" y="124" text-anchor="start">丙</text></svg>',cap:"單擺",q:"單擺從甲點由靜止放開，擺到乙（最低點）再到丙（不計空氣阻力）。關於動能，下列何者正確？",o:["乙點動能最大，甲、丙動能為零","甲點動能最大","三點動能都相同","丙點動能最大"],a:0,e:"甲、丙是最高點，擺錘在那一瞬間停住，速率為 0，動能為 0、位能最大。往下擺時位能變成動能，到最低點乙速率最快、動能最大。不計阻力，力學能守恆，所以丙會和甲一樣高。",id:"fig8",t:"mine",set:"fig"},{u:17,fig:'<svg viewBox="0 0 300 190" role="img" aria-label="磁鐵靠近線圈"><rect x="20" y="80" width="90" height="30" class="mag"/><path class="ink" d="M65 80 V110"/><text x="42" y="100" text-anchor="middle" class=b>S</text><text x="88" y="100" text-anchor="middle" class=b>N</text><path class="ln" d="M120 95 H150"/><path class="ln" d="M143 89 L152 95 L143 101"/><ellipse cx="185" cy="95" rx="7" ry="32" class="ink"/><ellipse cx="200" cy="95" rx="7" ry="32" class="ink"/><ellipse cx="215" cy="95" rx="7" ry="32" class="ink"/><ellipse cx="230" cy="95" rx="7" ry="32" class="ink"/><text x="180" y="60" text-anchor="middle">甲端</text><text x="240" y="60" text-anchor="middle">乙端</text><text x="135" y="82" text-anchor="middle">靠近</text></svg>',cap:"電磁感應",q:"如圖，把磁鐵的 N 極朝線圈的甲端快速靠近。線圈甲端會出現什麼磁極？",o:["N 極，會排斥磁鐵","S 極，會吸引磁鐵","不會產生磁極","N 極，會吸引磁鐵"],a:0,e:"冷次定律：感應電流產生的磁場要「反抗」變化。N 極靠近，線圈就在甲端變出 N 極把它推開（同極相斥）。如果是 N 極遠離，甲端才會變 S 極去拉住它。磁鐵不動就沒有感應電流。",id:"fig9",t:"mine",set:"fig"},{u:13,fig:'<svg viewBox="0 0 300 190" role="img" aria-label="槓桿"><path class="ink" d="M30 110 H270"/><path class="ink" d="M150 110 L135 140 H165 Z"/><rect x="58" y="80" width="34" height="30" class="box"/><rect x="223" y="80" width="34" height="30" class="box"/><text x="75" y="72" text-anchor="middle">30 kgw</text><text x="240" y="72" text-anchor="middle">? kgw</text><path class="gr" d="M75 125 H150 M150 125 H240"/><text x="112" y="140" text-anchor="middle">2 m</text><text x="195" y="140" text-anchor="middle">3 m</text></svg>',cap:"槓桿",q:"如圖，蹺蹺板在水平位置平衡。左邊 30 kgw 的物體距支點 2 m，右邊物體距支點 3 m，右邊物體重多少？（板子重量不計）",o:["20 kgw","45 kgw","30 kgw","15 kgw"],a:0,e:"平衡時左右力矩相等：力×力臂。30×2＝W×3，W＝60÷3＝20 kgw。離支點越遠的那邊，用比較小的重量就能平衡，所以答案一定小於 30。",id:"fig10",t:"mine",set:"fig"},{u:8,fig:'<svg viewBox="0 0 300 190" role="img" aria-label="pH 數線"><defs><linearGradient id="phg-fig11" x1="0" x2="1"><stop offset="0" stop-color="#e0245e"/><stop offset=".5" stop-color="#c9c9c9"/><stop offset="1" stop-color="#3b5bdb"/></linearGradient></defs><rect x="20" y="80" width="260" height="22" rx="4" fill="url(#phg-fig11)"/><text x="20.0" y="120" text-anchor="middle">0</text><text x="57.142857142857146" y="120" text-anchor="middle">2</text><text x="94.28571428571429" y="120" text-anchor="middle">4</text><text x="131.42857142857144" y="120" text-anchor="middle">6</text><text x="168.57142857142858" y="120" text-anchor="middle">8</text><text x="205.71428571428572" y="120" text-anchor="middle">10</text><text x="242.85714285714286" y="120" text-anchor="middle">12</text><text x="280.0" y="120" text-anchor="middle">14</text><path class="ink" d="M57 70 V80 M150 70 V80 M243 70 V80"/><text x="57" y="62" text-anchor="middle">甲</text><text
